# platform/versions.yaml
# =============================================================================
# THE single source of truth for every platform component version — what each
# component IS: its pinned version, WHERE that pin is written, and WHERE its
# upstream lives.
#
# Edit a version HERE, then run the sync-versions program (ansiwise) — it
# stamps every `stamps:` site below. Review `git diff` in every stamped
# checkout, commit → ArgoCD (apps) / the deploy programs (bootstrap, cliTools)
# carry the change. The versions-upstream program reads the SAME entries and
# reports each pin against what its upstream serves now; both operations read
# this one file, so the writer and the reader cannot drift apart.
#
# Do NOT hand-edit the version fields in apps/*/Chart.yaml, apps/*/values-*.yaml
# or the deploy programs — they are stamped from this file. The stamp touches
# only the version token, so comments and formatting are preserved.
#
# THE GRAMMAR is the ansiwise-versions plugin's (its declaration.dart states it
# in full). What matters when editing:
#   version:   the pin, ALWAYS QUOTED — YAML would read 8.8 as a number and
#              26.04 as a number that lost its trailing zero.
#   stamps:    every place the pin is written. `tree` is a LABEL the program
#              row maps to a checkout: `platform` is this repository, `deploy`
#              the installation repository carrying the ansiwise programs,
#              `manager` the manager repository beside this one. An `anchor` is
#              the exact trimmed line that opens the block the stamped key
#              stands in, and every site must match exactly once or the stamp
#              refuses — a stamp that cannot find its site never skips it.
#   upstream:  where the report asks. `chart_repository` means: read the
#              repository out of the Chart.yaml the chart_dependency stamp
#              names — the repository differs per chart in ways that are easy
#              to guess wrong, and the Chart.yaml is the one place that knows.
#   note:      one line the report appends beside the upstream answer, for a
#              pin that is deliberate.
# =============================================================================

# Official upstream images run via our own charts/deployment (no Bitnami, no
# operator). The value is the container image tag of each app. Asked of the
# REGISTRY each image is actually pulled from, never of a release feed: a
# project can tag a release with no image behind it, and a cluster runs the
# image.
images:
  zot:
    version: "v2.1.18"
    upstream:
      kind: oci_tags
      host: ghcr.io
      image: project-zot/zot-linux-amd64
      matching: '^v[0-9]+\.[0-9]+\.[0-9]+$'
    stamps:
      - kind: yaml_value
        tree: platform
        file: apps/registry/values-common.yaml
        key: tag
        anchor: 'repository: ghcr.io/project-zot/zot-linux-amd64'
      - kind: yaml_value
        tree: platform
        file: apps/registry/Chart.yaml
        key: appVersion
  dbgate:
    version: "7.2.3"
    upstream:
      kind: docker_hub
      image: dbgate/dbgate
      matching: '^[0-9]+\.[0-9]+\.[0-9]+$'
    stamps:
      - kind: yaml_value
        tree: platform
        file: apps/dbgate/values-common.yaml
        key: tag
        anchor: 'repository: dbgate/dbgate'
  # Tailnet coordination server. Only this half of the tailnet is an image —
  # the client on each host is a CLI tool the installer places, pinned under
  # cliTools below.
  headscale:
    version: "v0.29.2"
    upstream:
      kind: oci_tags
      host: ghcr.io
      image: juanfont/headscale
      matching: '^v[0-9]+\.[0-9]+\.[0-9]+$'
    stamps:
      - kind: yaml_value
        tree: platform
        file: apps/tailnet-coordinator/values-common.yaml
        key: tag
        anchor: 'repository: ghcr.io/juanfont/headscale'
      - kind: yaml_value
        tree: platform
        file: apps/tailnet-coordinator/Chart.yaml
        key: appVersion
  # In-house datastores — official images via charts/deployment (mongodb:
  # own StatefulSet templates); the Bitnami-chart era is fully migrated out.
  #
  # postgresql is the ONE values.yaml here, not values-common.yaml: it is no
  # longer a stage-deployed cluster app but a per-unit template, and such a
  # chart is rendered off its implicit Helm values.yaml.
  #
  # The dump/restore clients must speak to the servers pinned here: the
  # MongoDB apt-repo series is the server's <major>.<minor> and the PostgreSQL
  # client major the server's <major>, which is what the two dockerfile_arg
  # stamps into the manager's dbtools image cut with `segments`. That image
  # builds in the manager repository because its caller lives there; it cannot
  # read this file across the repository boundary, and a copy there would be a
  # second source for a version that must have exactly one — so the values are
  # stamped in from here.
  postgres:
    version: "18.4"
    upstream:
      kind: docker_hub
      image: library/postgres
      matching: '^1[0-9]+\.[0-9]+$'
    stamps:
      - kind: yaml_value
        tree: platform
        file: units/postgresql/values.yaml
        key: tag
        anchor: 'repository: postgres'
      - kind: dockerfile_arg
        tree: manager
        file: docker/dbtools.Dockerfile
        argument: PG_MAJOR
        segments: 1
  # THIS PIN PROTECTS NOTHING, and it was believed to. Measured 2026-07-30 by
  # probing the images: neither the entrypoint nor the mongod binary of 8.0.4,
  # 8.0.28 or 8.2 carries a kernel check. The refusal that circulates comes from
  # a third-party image. So the official image does not decline on an affected
  # kernel — it starts, serves for about thirty seconds, and segfaults, in a
  # cycle, accepting writes in between.
  #
  # The fault is real here. Every machine is Ubuntu 26.04, whose kernel is 7.0.0:
  # the package version 7.0.0-28.28 is <upstream>-<abi>.<upload>, so it is 7.0.0
  # and not 7.0.28. MongoDB's vendored TCMalloc and kernels 6.19 through 7.0.13
  # disagree over rseq; 7.0.14 and later resolve it. Every 8.0.x vendors the same
  # TCMalloc, so 8.0.4 crashes exactly like 8.0.28 — the pin only costs us
  # twenty-four releases of fixes. An image carries no kernel; it shares the
  # machine's, so no image choice avoids this.
  #
  # The blocker is the KERNEL, not the version, so no raise fixes it. Ubuntu
  # offers nothing newer for 26.04 — the GA and hardware-enablement stacks are
  # both on 7.0, and the next bump arrives with 26.04.2 — so a kernel of 7.0.14
  # or later means a mainline one. The cheaper mitigation is
  # GLIBC_TUNABLES=glibc.pthread.rseq=1 on the Deployment, reported to stop the
  # segfault at the cost of allocation performance; it belongs in apps/mongodb,
  # not here, and it comes out when the kernel moves.
  #
  # Watch mongod by hand for two minutes on the first install. Nothing here does
  # it: the probes in apps/mongodb are ordinary 10- and 15-second ones, and a
  # process that serves for half a minute and then segfaults passes them on the
  # way past. A restart count climbing on its own IS this defect.
  mongodb:
    version: "8.0.4"
    note: pinned deliberately until the kernel moves — see the comment above this entry
    upstream:
      kind: docker_hub
      image: library/mongo
      matching: '^[0-9]+\.[0-9]+\.[0-9]+$'
    stamps:
      - kind: yaml_value
        tree: platform
        file: apps/mongodb/values-common.yaml
        key: tag
        anchor: 'repository: mongo'
      - kind: yaml_value
        tree: platform
        file: units/mongodb/values.yaml
        key: tag
        anchor: 'repository: mongo'
      - kind: dockerfile_arg
        tree: manager
        file: docker/dbtools.Dockerfile
        argument: MONGO_SERIES
        segments: 2
  redis:
    version: "8.8"
    upstream:
      kind: docker_hub
      image: library/redis
      matching: '^[0-9]+\.[0-9]+$'
    stamps:
      - kind: yaml_value
        tree: platform
        file: apps/redis/values-common.yaml
        key: tag
        anchor: 'repository: redis'
  # The interpreter apps/service-provisioner runs its reconciler on. Not a
  # product of its own: the chart mounts the reconciler as a ConfigMap and the
  # container pip-installs the client libraries at boot, so this pin decides
  # which Python every ServiceClaim on this platform is resolved by.
  python:
    version: "3.12-slim"
    upstream:
      kind: docker_hub
      image: library/python
      matching: '^3\.[0-9]+-slim$'
    stamps:
      - kind: yaml_value
        tree: platform
        file: apps/service-provisioner/values-common.yaml
        key: tag
        anchor: 'repository: python'

# Upstream Helm charts wrapped by apps/*/Chart.yaml (dependency versions).
# Every upstream here is `chart_repository`: the report reads the repository
# to ask out of the very Chart.yaml the stamp writes, so the repository is
# named exactly once, where Helm itself reads it.
charts:
  external-secrets:
    version: "2.8.0"
    upstream:
      kind: chart_repository
    stamps:
      - kind: chart_dependency
        tree: platform
        file: apps/external-secrets/Chart.yaml
        dependency: external-secrets
  kube-prometheus-stack:
    version: "87.21.0"
    upstream:
      kind: chart_repository
    stamps:
      - kind: chart_dependency
        tree: platform
        file: apps/observability/Chart.yaml
        dependency: kube-prometheus-stack
  loki:
    version: "18.7.0"
    upstream:
      kind: chart_repository
    stamps:
      - kind: chart_dependency
        tree: platform
        file: apps/observability/Chart.yaml
        dependency: loki
  tempo:
    version: "2.2.3"
    upstream:
      kind: chart_repository
    stamps:
      - kind: chart_dependency
        tree: platform
        file: apps/observability/Chart.yaml
        dependency: tempo
  # alloy is declared in TWO charts. Both sites are stamped from the one key,
  # or a raise moves one and strands the other.
  alloy:
    version: "1.11.0"
    upstream:
      kind: chart_repository
    stamps:
      - kind: chart_dependency
        tree: platform
        file: apps/observability/Chart.yaml
        dependency: alloy
      - kind: chart_dependency
        tree: platform
        file: apps/observability-agent/Chart.yaml
        dependency: alloy
  # The upstream chart is named `mail` in the Chart.yaml that wraps it — the
  # dependency below is what couples this key to that name, for the stamp and
  # the report alike.
  postfix-mail:
    version: "5.1.0"
    upstream:
      kind: chart_repository
    stamps:
      - kind: chart_dependency
        tree: platform
        file: apps/postfix/Chart.yaml
        dependency: mail
  prometheus-postgres-exporter:
    version: "8.2.0"
    upstream:
      kind: chart_repository
    stamps:
      - kind: chart_dependency
        tree: platform
        file: units/postgresql/Chart.yaml
        dependency: prometheus-postgres-exporter
  prometheus-mongodb-exporter:
    version: "3.20.0"
    upstream:
      kind: chart_repository
    stamps:
      - kind: chart_dependency
        tree: platform
        file: apps/mongodb/Chart.yaml
        dependency: prometheus-mongodb-exporter
  prometheus-redis-exporter:
    version: "6.28.0"
    upstream:
      kind: chart_repository
    stamps:
      - kind: chart_dependency
        tree: platform
        file: apps/redis/Chart.yaml
        dependency: prometheus-redis-exporter
  # The push agent a cluster without the master part runs; the receiving
  # side is kube-prometheus-stack above, which carries its own copy.
  kube-state-metrics:
    version: "8.0.0"
    upstream:
      kind: chart_repository
    stamps:
      - kind: chart_dependency
        tree: platform
        file: apps/observability-agent/Chart.yaml
        dependency: kube-state-metrics

# Bootstrap components installed by the deploy programs (NOT ArgoCD-managed).
# Their pins live as literals in the program rows that install them — a
# program file computes nothing, so the stamp writes the literal and the
# fingerprint of the program changes with the pin, which is exactly what makes
# a re-run of a changed program need a fresh dry run.
bootstrap:
  # argo-cd is installed by the bootstrap AND declared in slaves/slave/Chart.yaml
  # (the namespaced instance a cluster without the master part runs). Both
  # sites are stamped from this one key, so master + slave stay on one chart
  # version and ONE set of CRDs fits both. The report reads the repository out
  # of the slave Chart.yaml — the same repository the program's helm_repository
  # row names.
  argocd:
    version: "10.2.1"
    upstream:
      kind: chart_repository
    stamps:
      - kind: chart_dependency
        tree: platform
        file: slaves/slave/Chart.yaml
        dependency: argo-cd
      - kind: yaml_value
        tree: deploy
        file: ansiwise/programs/deploy-gitops.yaml
        key: chart_version
        anchor: 'release: argocd'
  vault:
    version: "0.34.0"
    upstream:
      kind: helm_index
      repository: https://helm.releases.hashicorp.com
      chart: vault
    stamps:
      - kind: yaml_value
        tree: deploy
        file: ansiwise/programs/deploy-gitops.yaml
        key: chart_version
        anchor: 'release: vault'
  # The release is named `idp` in the program, the chart is authentik
  # (CalVer == app version).
  authentik:
    version: "2026.5.6"
    upstream:
      kind: helm_index
      repository: https://charts.goauthentik.io
      chart: authentik
    stamps:
      - kind: yaml_value
        tree: deploy
        file: ansiwise/programs/deploy-gitops.yaml
        key: chart_version
        anchor: 'release: idp'
  # The cluster UI the bootstrap installs beside the reconciler. Its pin stood
  # ONLY in the program row before this entry existed — a version outside the
  # single source, which is the drift this file exists to end.
  headlamp:
    version: "0.42.0"
    upstream:
      kind: helm_index
      repository: https://kubernetes-sigs.github.io/headlamp/
      chart: headlamp
    stamps:
      - kind: yaml_value
        tree: deploy
        file: ansiwise/programs/deploy-gitops.yaml
        key: chart_version
        anchor: 'release: headlamp'
  # 1.35, NOT the newest channel. Owner, 2026-07-29: 1.36 broke on Ubuntu 26.04
  # when that release came out and had to be rolled back. Raise this only after
  # a rehearsal cluster on 26.04 comes up clean; it is a decision, not a lag.
  # (The channel also drives cert-manager + Traefik addons.)
  microk8s:
    version: "1.35/stable"
    note: raise only after a rehearsal cluster on the pinned Ubuntu comes up clean
    upstream:
      kind: snap_channel
      snap: microk8s
    stamps:
      - kind: yaml_value
        tree: deploy
        file: ansiwise/programs/deploy-cluster.yaml
        key: channel
        anchor: '- step: install_snap'

# The Ubuntu release every host runs. Nothing here installs it — it is the
# ground the pins above stand on: the microk8s channel is proven on exactly
# this release (1.36 broke on it, see its note), and the mongodb note above
# describes this release's kernel. The installer reads this value in its
# preflight and refuses any other release before its first write. No stamps
# and no upstream, on purpose: nothing carries this pin but the preflight that
# reads it here, and a newer Ubuntu is never a bump but a rehearsal.
ubuntu:
  version: "26.04"
  note: the ground the pins stand on — nothing installs it, the preflight reads it here

# Base images of the images this platform BUILDS. These never reach a cluster:
# they are the ground a build stands on. A raise here is felt at the next
# build, not at the next sync.
baseImages:
  # 12-slim (bookworm), NOT 13. Measured 2026-07-29: on trixie the build dies
  # with "Unable to locate package mongodb-database-tools" — MongoDB's apt repo
  # answers for the trixie suite but carries no packages for the 8.0 series
  # there, so a reachable repository is not a usable one. Raise this once
  # MongoDB publishes the series for trixie, and rebuild the image to prove it.
  debian:
    version: "12-slim"
    note: 12-slim until MongoDB publishes its series for the newer suite — see the comment above
    upstream:
      kind: docker_hub
      image: library/debian
      matching: '^[0-9]+-slim$'
    stamps:
      - kind: dockerfile_from
        tree: manager
        file: docker/dbtools.Dockerfile
        image: library/debian

# CLI tools installed to /usr/local/bin on every host. They were fetched as
# "latest" until they were pinned here: two hosts installed a month apart got
# different tools and neither could be reproduced. Each pin is stamped into
# the install row of deploy-cluster AND into the assert list at the end of its
# tool phase, from this one key — jq and tailscale have no install row that
# takes a version (package manager and vendor installer), so only the assert
# list carries theirs, and the program reports rather than fails where those
# two drift. The upstream of each is its own release feed, because that is
# what the install fetches from.
cliTools:
  argocd:
    version: "v3.4.5"
    upstream:
      kind: github_release
      project: argoproj/argo-cd
    stamps:
      - kind: yaml_value
        tree: deploy
        file: ansiwise/programs/deploy-cluster.yaml
        key: version
        anchor: 'tool: argocd'
      - kind: list_pin
        tree: deploy
        file: ansiwise/programs/deploy-cluster.yaml
        anchor: 'tools:'
        entry: argocd
  vault:
    version: "v2.0.3"
    upstream:
      kind: hashicorp_release
      product: vault
    stamps:
      - kind: yaml_value
        tree: deploy
        file: ansiwise/programs/deploy-cluster.yaml
        key: version
        anchor: 'tool: vault'
      - kind: list_pin
        tree: deploy
        file: ansiwise/programs/deploy-cluster.yaml
        anchor: 'tools:'
        entry: vault
  yq:
    version: "v4.53.3"
    upstream:
      kind: github_release
      project: mikefarah/yq
    stamps:
      - kind: yaml_value
        tree: deploy
        file: ansiwise/programs/deploy-cluster.yaml
        key: version
        anchor: 'tool: yq'
      - kind: list_pin
        tree: deploy
        file: ansiwise/programs/deploy-cluster.yaml
        anchor: 'tools:'
        entry: yq
  # upstream tags its releases jq-<version>, and the pin is written in that
  # same shape so the assert can hold the two against each other.
  jq:
    version: "jq-1.8.2"
    upstream:
      kind: github_release
      project: jqlang/jq
    stamps:
      - kind: list_pin
        tree: deploy
        file: ansiwise/programs/deploy-cluster.yaml
        anchor: 'tools:'
        entry: jq
  # The client half of the tailnet; the server is images.headscale.
  tailscale:
    version: "v1.98.10"
    upstream:
      kind: github_release
      project: tailscale/tailscale
    stamps:
      - kind: list_pin
        tree: deploy
        file: ansiwise/programs/deploy-cluster.yaml
        anchor: 'tools:'
        entry: tailscale
