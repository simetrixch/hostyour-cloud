# The checks of this repository.
#
# WHY A DART PACKAGE IN A CHART REPOSITORY. What this repository holds is read by ArgoCD's go
# templates under `missingkey=error`, where one missing key does not fail one Application — it ends
# the whole reconcile and NO Application is created. A defect of that kind has to be found when it is
# committed, and the only thing that can find it is something that reads these files.
#
# It judges the tree beside it and nothing else. No chart depends on it, and it ships nowhere.
name: hostyour_cloud_checks
description: The checks that hold this repository's chart material to what reads it.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0

dependencies:
  yaml: ^3.1.2

dev_dependencies:
  # The probes that drive the installation search over planted trees compare paths the file system
  # answered against paths they planted, and the two spell their separators differently per
  # platform.
  path: ^1.9.1
  test: ^1.31.2
  lints: ^6.1.0
