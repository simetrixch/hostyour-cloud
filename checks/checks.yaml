# Every check this repository makes, and the file that carries it.
#
# WHY THIS FILE EXISTS. `dart test` discovers whatever is on disk and reports whether any of it
# failed. Delete a check file and nothing fails: the check is simply not there, and the run prints
# that every check is green. It is worse than a missing test, because a check and its counter-probe
# live in the same file — the thing that would have noticed goes with the thing it was watching.
#
# FORMAT. `<check>: <file, relative to this file>`, one per line, the reason on the comment line
# directly above it.

# Every directory under apps/ carries an app.yaml, and every apps/<name>/app.yaml carries every key
# the ApplicationSet generator reads bare. A directory without the file is never rendered by the
# generator and nothing says so; a file missing one key ends the WHOLE reconcile under
# missingkey=error, so no Application is created at all.
app-manifest-keys: test/app_manifest_keys_test.dart

# Every path the chart material names resolves in the TRACKED tree: a file:// dependency to a
# Chart.yaml of the matching name, a valueFile to a tracked file, a git generator's files: glob to at
# least one tracked file, a source's path: to a directory at least one tracked file stands under —
# except where absence is another repository's to answer, another branch's, composed at render time,
# or declared deliberate with ignoreMissingValueFiles. A generator or a source that finds nothing
# reports no error at all, and the defect surfaces only on a cluster's fresh clone, never on a
# case-insensitive checkout, which is why the paths are judged against git, not the file system.
# WHAT IT DOES NOT REACH: the three generators reading a books branch — clusters/active/*.yaml in
# slaves-appset.yaml and registrations/*/__STAGE__.yaml in the consumers and tenants appsets. Their
# files are not tracked on master, so moving what they select is caught by nothing.
chart-paths: test/chart_paths_test.dart

# Every label key the deploy programs' Vault namespace selectors match is one this repository's
# labels: blocks set. A selector key nothing sets matches no namespace, so the role admits no login —
# and that defect shipped twice, each time invisible until the first namespace of its kind existed.
vault-selector-labels: test/vault_selector_labels_test.dart

# Every role value the tree names is one the app generator can match: a literal its selector admits,
# or a role the installation's own answer allows. A value neither side admits matches nothing, and an
# ApplicationSet that matches nothing produces zero Applications and no error at all.
cluster-role-values: test/cluster_role_values_test.dart

# Every appset whose generator reads clusters/active/*.yaml reads only keys a writer of a cluster map
# writes — the deploy programs' map template and the Controller's strict schema — and selects on
# values a map can hold: a literal only under an answer closed to a list of words, otherwise a marker
# a branch program stamps FROM THE SAME ANSWER the map's key is written from. An unknown key ends the
# whole reconcile under missingkey=error and no Application is created; a selector matching nothing
# produces zero Applications and reports no error at all.
# WHAT IT DOES NOT REACH: the consumers and tenants appsets, whose generators read the registrations
# and not the cluster maps — another file, with another writer.
appset-cluster-map-keys: test/appset_cluster_map_keys_test.dart

# Every tag a builds[] pin states in this tree is a tag a release minted, judged against the release
# grammar the Controller states and the `-<sha7>` suffix a pushed image tag carries. Nothing else
# refuses one: charts/common `common.buildTag` only requires the key to be present, the release bump
# only overwrites an entry it already finds, and the Controller's pin schema types the tag as a
# non-empty string — so a stage no release has reached keeps whatever a person typed until a pull
# fails on a cluster.
# WHAT IT DOES NOT REACH: a tag that is not a builds[] pin — apps/redis and apps/registry state a
# vendor's own version under image:, which no release of ours minted — and the channel CEILING,
# which IS stated at platform/values-common.yaml:173-176 and read by the Controller, but needs the
# stage a pin serves held against the channel its tag names. That is hostyour-cloud#60's subject.
release-pin-tags: test/release_pin_tags_test.dart

# Every database published outside its own cluster on a plain-TCP entry point of the ingress
# controller is admitted through by a NetworkPolicy of its own chart, on the port its route sends
# to, and no two of them stand on one entry point. The route and the policy do not reference each
# other, and three different faults present to a client as the same closed port: a policy that names
# the controller's namespace nowhere, a route that resolves to nothing, and no route at all. The
# fourth — no policy at all — presents as a working database reachable from every pod in the cluster.
# WHAT IT DOES NOT REACH: the entry point itself. It is static configuration of the ingress
# controller, written by the installation's deploy program, so nothing here can say that the entry
# point a route names exists, that its address is the machine's tailnet address, or that the port
# stays closed on the machine's public address. Nor whether the admitted namespace is the RIGHT one:
# a policy admitting global.ingressNamespace passes whatever that value holds, so a MISNAMED
# namespace is invisible where a MISSING one is reported.
published-databases: test/published_databases_test.dart

# The stages a release channel may reach are stated ONCE — global.channelStages in
# platform/values-common.yaml — and the three points that enforce the ceiling reach it by two
# routes: gate-stage and bump read the CHANNEL_STAGES env var that
# apps/consumer-build/templates/pipeline-release.yaml renders from .Values.global.channelStages,
# while a cluster release reads that same file off the trunk (readChannelStages, hostyour-manager)
# before its set-pin step. What is reported is a second statement of that ceiling in any tracked
# file OTHER THAN the one that states it: a channel of the table standing with a stage of the
# table — on one line, over the
# lines indented below it, or over the block-sequence items at a mapping key's own column, the
# second spelling of a list this tree's YAML also uses; and the table written the other way round, a
# stage as the key with the channels in its block. Two statements do not disagree the day the second
# is written, they disagree the day either one is edited, and the permissive direction is silent — an
# alpha release gated, pinned and deployed to prod with every side reporting success.
# WHAT IT DOES NOT REACH: this checks package, which nothing on a cluster reads and whose probes
# state the table on purpose; a restatement written in words the table does not use; a spelling in a
# case the table does not use, the words being matched exactly as it spells them; the reader on the
# Controller side, hostyour-manager/server/domains/inventory/channel-stages.ts, which is another
# repository's file and reads this one rather than copying it; the file the table is stated in, so a
# second table appended to platform/values-common.yaml itself passes; and YAML's explicit-key
# spelling (? alpha / : [dev]), which loads to the identical table and appears in no file here.
channel-table-single: test/channel_table_single_test.dart
