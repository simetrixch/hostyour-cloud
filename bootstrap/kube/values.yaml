# Kubernetes Dashboard (Headlamp) Helm Values

# Service Configuration
service:
  type: ClusterIP  # Use ClusterIP, ingress will handle external access
  externalPort: 443

# Metrics Scraper
metricsScraper:
  enabled: true

# RBAC Settings
rbac:
  create: true
  clusterReadOnlyRole: true

# Service Account
serviceAccount:
  create: true
  name: kubernetes-dashboard

# Resources
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Settings
settings:
  # Global dashboard settings. __CLUSTER_NAME__ is this cluster's short name —
  # the fqdn's first DNS label — and the branch program stamps it over the
  # bootstrap tree from the cluster_name answer, which it derives from the fqdn
  # before the first step rather than asking for a short name its own domain
  # could contradict.
  clusterName: "__CLUSTER_NAME__"
  itemsPerPage: 10
  labelsLimit: 3
  logsAutoRefreshTimeInterval: 5
  resourceAutoRefreshTimeInterval: 5
  disableAccessDeniedNotifications: false

# OIDC — Headlamp chart 0.42+ uses an `envFrom: secretRef` pattern when
# externalSecret.enabled=true. The referenced Secret must hold keys NAMED
# AS THE ENV VARS Headlamp expects: OIDC_CLIENT_ID, OIDC_CLIENT_SECRET,
# OIDC_ISSUER_URL, OIDC_SCOPES (NOT camelCase clientID/etc.). The Secret
# headlamp-oidc in this namespace is created by GitOps.
# `hasScopes: true` makes the chart pass `-oidc-scopes=$(OIDC_SCOPES)` flag.
# `secret.create: false` disables the chart's own bundled Secret (which
# would only contain scopes literal and double-render).
#
# THE ONE SHARED HEADLAMP (master + ALL slaves — the cluster picker):
#   - the MASTER context comes from `-in-cluster` alone (inCluster
#     below is the chart default, pinned here so a chart-default change can
#     never drop the LIVE master context; `-kubeconfig` ADDS contexts next to
#     the in-cluster one, it does not replace it — the chart renders both
#     args independently, see headlamp templates/deployment.yaml).
#   - the SLAVE contexts come from the mounted multi-context kubeconfig
#     Secret `kube-slaves-kubeconfig` (key `kubeconfig`), REBUILT by
#     seeded EMPTY by the pipeline so the mounted file always exists and parses.
config:
  inCluster: true
  # Name the in-cluster (master) context after the master's short name — e.g.
  # "m1", matching how the slave contexts are named (s1, s2) — instead
  # of the chart default "main". Shown in the cluster picker. __MASTER_NAME__ is
  # the first DNS label of the domain of the cluster holding the master role —
  # this cluster's own domain where it holds the role and the named master's
  # where it does not — and the branch program stamps it over the bootstrap tree
  # from the books_name answer, which it derives from the books_cluster answer
  # the same way it derives cluster_name from the fqdn.
  inClusterContextName: "__MASTER_NAME__"
  extraArgs:
    - -kubeconfig=/etc/kube-slaves/kubeconfig
  # THE ONE CREDENTIAL COMES IN AS A WHOLE SECRET, and the other three stand below in the open.
  # This chart's schema lets `env` carry only name and value — a `valueFrom` there is refused by the
  # schema before helm renders anything — so a secret reference cannot ride in that list. What it
  # does allow is `externalSecret`, which mounts a Secret with envFrom: every key of it becomes an
  # environment variable AS IT STANDS, which is why the key is spelled OIDC_CLIENT_SECRET and not
  # after the field the store keeps it under.
  oidc:
    secret:
      create: false
    externalSecret:
      enabled: true
      name: headlamp-oidc

# `env` AND NOT `extraEnv`, which is what stood here and what this chart has never read. The
# deployment renders `.Values.env` — in both of its branches — and nothing at all under any other
# name, so all four of these values were dropped on the floor and the console came up with no
# identity provider configured. What an operator saw was the token page, which is the fallback for
# having no OIDC at all, and no error anywhere said a key had been ignored.
env:
  - name: OIDC_CLIENT_ID
    value: "headlamp"
  - name: OIDC_ISSUER_URL
    value: "https://idp.example.invalid/application/o/headlamp/"
  - name: OIDC_SCOPES
    value: "openid,profile,email,goauthentik.io/api"

# The shared slaves kubeconfig mount. `optional: true`: the pod must stay
# schedulable even if the Secret is ever deleted — the LIVE master dashboard
# (in-cluster context) must never break on a missing slave kubeconfig.
volumes:
  - name: kube-slaves-kubeconfig
    secret:
      secretName: kube-slaves-kubeconfig
      optional: true
volumeMounts:
  - name: kube-slaves-kubeconfig
    mountPath: /etc/kube-slaves
    readOnly: true
