# IngressRoute for the Kubernetes Dashboard (Headlamp). Its certificate is the base layer's one,
# served by the TLSStore bootstrap/ingress/certificate.yaml puts in Traefik's own namespace.
# Replaces the previous k8s Ingress + annotation pattern. Auth is handled
# by Headlamp's own OIDC client talking to the IdP — no Traefik forwardAuth
# Middleware needed.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kubernetes-dashboard
  namespace: kubernetes-dashboard
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`kube.example.invalid`)
      kind: Rule
      services:
        - name: headlamp
          port: 80
  tls:
    store:
      name: default
      namespace: vault
