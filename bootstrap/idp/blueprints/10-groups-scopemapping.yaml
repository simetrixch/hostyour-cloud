# yaml-language-server: $schema=
# Authentik blueprint — the OAuth2 `groups` scope that this platform's OIDC clients request.
#
# WHY IT IS DECLARED AT ALL, when the provider emits the claim by itself. The provider's own
# `profile` scope mapping already writes a top-level `groups` claim from the account's real
# memberships. What it does not do is make `groups` a SCOPE a client may ask for — and every client
# here asks for it by name, because the services behind them decide on that claim and a token
# carries a claim only where its scope was requested. So this declares the scope, and computes
# exactly what `profile` computes.
#
# **THE TWO MUST STAY IDENTICAL, and that is measured rather than assumed.** Both write the same
# claim key. Which of them lands last is the provider's business and not ours, and the one that
# loses is silent.
#
# This file used to APPEND an invented group name — `admins` — for anybody the provider considered
# privileged, so that a fresh installation would admit its first operator before anyone was really
# a member of the platform's group. `profile` overwrote it, and nothing anywhere reported that:
#
#     this mapping, computed alone   ['authentik Admins', 'admins']
#     the provider's profile scope   ['authentik Admins']
#     what the issued token carried  ['authentik Admins']
#
# Every service that admits on `admins` refused every login, with a message about a claim that did
# not match. What replaced it is a real membership: the deployment puts the first operator into the
# group with the step `authentik_group_membership`, additively, so both mappings compute the same
# list and it contains the group the platform admits on. A membership is also the only form anybody
# can audit — you can open the provider and see who may enter, which a value computed at token time
# never lets you do.
#
# File name `10-*` so this runs BEFORE the `99-*.yaml` provider blueprints that !Find it. (Authentik
# applies blueprints in alphabetical order by filename within /blueprints/local.)
version: 1
metadata:
  name: OAuth2 groups scope mapping
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - id: groups-scopemapping
    model: authentik_providers_oauth2.scopemapping
    identifiers:
      managed: blueprint:platform:groups-mapping
    attrs:
      name: "OAuth Mapping: groups"
      scope_name: groups
      description: Groups the user belongs to
      expression: |
        return [group.name for group in request.user.groups.all()]
