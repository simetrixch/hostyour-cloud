# yaml-language-server: $schema=
# Authentik blueprint — the Controller OIDC client (staff-only).
# The Controller is the standalone provider admin UI served at
# https://controller.${IDP_DOMAIN}/ (built from the separate hostyour-manager
# repo, deployed by the `manager` app). Mirrors 99-grafana.yaml (native
# OIDC, confidential client) and the retired 99-console.yaml: restricts the
# Controller application to staff via TWO bindings OR'd together
# (policy_engine_mode: any, pinned explicitly on the app entry below):
#   1. a group PolicyBinding on the custom `admins` group (invited staff), and
#   2. an ExpressionPolicy `return request.user.is_superuser` — ANY Authentik
#      superuser passes, independent of group naming / membership timing /
#      Authentik version, so the bootstrap admin (akadmin) reaches the
#      Controller on a FRESH install without any group choreography.
# client_secret stays ${IDP_CONTROLLER_CLIENT_SECRET} in git — it is
# sed-resolved into the idp-blueprints ConfigMap at apply time (see
# deploy-idp.sh:_idp_apply_blueprints_configmap), not baked in here.
# Waits for the groups scope mapping AND the admins group to exist first.
version: 1
metadata:
  name: controller OIDC client
  labels:
    blueprints.goauthentik.io/instantiate: "true"
conditions:
  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]
  - !Find [authentik_core.group, [name, admins]]
entries:
  - id: controller-provider
    model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: Controller
    attrs:
      name: Controller
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      client_type: confidential
      client_id: controller
      client_secret: ${IDP_CONTROLLER_CLIENT_SECRET}
      redirect_uris:
        - matching_mode: strict
          url: https://controller.${IDP_DOMAIN}/auth/callback
        # RP-initiated logout (/auth/logout): Authentik validates the post_logout_redirect_uri
        # against THIS list. The Controller sends config.publicUrl (the site root, no path), so it
        # must be registered too — otherwise Authentik rejects the logout redirect and "logout
        # does nothing". Matches PUBLIC_URL exactly (https://controller.<domain>, no trailing slash).
        - matching_mode: strict
          url: https://controller.${IDP_DOMAIN}
      access_token_validity: hours=1
      refresh_token_validity: days=30
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      grant_types:
        - authorization_code
        - refresh_token
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]
  - id: controller-app
    model: authentik_core.application
    identifiers:
      slug: controller
    attrs:
      name: Controller
      slug: controller
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Controller]]
      meta_launch_url: https://controller.${IDP_DOMAIN}/
      open_in_new_tab: true
      group: Platform
      # Explicit OR across the bindings below: a sign-in passes when ANY
      # binding passes. `any` IS the model default
      # (authentik_policies.PolicyBindingModel.policy_engine_mode defaults to
      # MODE_ANY), but the whole access design depends on the OR semantics, so
      # pin it here instead of trusting a default that a future Authentik
      # release could change.
      policy_engine_mode: any
  # Restrict the Controller application to the `admins` group (deny everyone else).
  - id: controller-admins-binding
    model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, controller]]
      group: !Find [authentik_core.group, [name, admins]]
      order: 0
    attrs:
      enabled: true
  # Superuser escape hatch, OR'd with the group binding above: ANY Authentik
  # superuser passes, independent of group naming, membership timing or
  # Authentik version — this is what guarantees the bootstrap admin (akadmin)
  # can authorize against the Controller app on a FRESH install. Replaces the
  # earlier PolicyBinding on the built-in "authentik Admins" group, which
  # depended on that group's exact name and on akadmin's membership in it
  # (is_superuser is derived from superuser-group membership, so it covers
  # every member of "authentik Admins" and any future superuser group).
  # Model + binding-with-policy syntax per Authentik's own default blueprints
  # (blueprints/default/flow-default-source-enrollment.yaml).
  - id: controller-superuser-policy
    model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: superuser-access
    attrs:
      name: superuser-access
      expression: return request.user.is_superuser
  - id: controller-superuser-binding
    model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, controller]]
      policy: !KeyOf controller-superuser-policy
      order: 1
    attrs:
      enabled: true
