# gitleaks configuration for the hostyour-cloud monorepo.
#
# The build pipeline's credential-scan step (apps/image-builder/templates/tasks/
# credential-scan.yaml) runs `gitleaks detect` over the cloned source and FAILS the
# PipelineRun on any leak. It honors this file from the source root.
#
# The allowlist below covers an upstream CRD's OpenAPI example — never real credentials. Real
# secrets live only in gitignored files on the machine and in Vault; they are never committed.
#
# The secrets template gets NO allowlist entry, and it never will. `secrets/secrets.example`
# declares every key with an EMPTY value and carries no credential-shaped text, so the scan already
# reports nothing on it and there is nothing to allow. An entry would first take effect the day
# somebody filled a real value in — and that is precisely what this scan has to catch on that path,
# because the template is the one file under `secrets/` that IS committed.
title = "hostyour-cloud gitleaks config"

# Keep all of gitleaks' default rules; this file only ADDS an allowlist.
[extend]
useDefault = true

[allowlist]
description = "Example / upstream-CRD placeholders — not real secrets"
paths = [
  # Upstream external-secrets CRD OpenAPI schema embeds a "<private-key>" example.
  '''crd-secretstore\.yaml''',
]

regexes = [
  # An ExternalSecret's remoteRef names a PATH IN VAULT and never a value — that separation is what
  # the whole mechanism exists for. gitleaks reads the line as a credential because it is
  # high-entropy text under a secret-shaped structure. Matched on the path grammar rather than on a
  # file name, so an ExternalSecret written tomorrow is covered and a real credential sitting in an
  # ordinary file still turns this red.
  '''key:\s*(secret|build|kv)/[a-z0-9<>/_-]+''',
]

# PUBLIC DEFAULTS OF A VENDORED UPSTREAM CHART, overridden by the umbrella values: plane-ce ships the two
# keys below in its own values.yaml, public in its repository, and clusters/inventories/plane/values-common.yaml
# makes the chart refuse to render with them. The allowlist sits on the rule that reports them, and both
# conditions must hold, the file and the value: a third key-shaped value added to that file, or either value
# in any other file, still turns the scan red (scripts/check.sh plants both). A global [[allowlists]] entry is
# no substitute: gitleaks 8.30.1 hid every finding of a file on its path alone there, whatever `condition` said.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "plane-ce's public default keys in its vendored values.yaml"
condition = "AND"
paths = [
  '''clusters/inventories/plane/charts/plane-ce/values\.yaml''',
]
regexes = [
  '''^(60gp0byfz2dvffa45cxl20p1scy9xbpf6d8c5y0geejgkyp1b5|htbqvBJAgpm9bzvf3r4urJer0ENReatceh)$''',
]
