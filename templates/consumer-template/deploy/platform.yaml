apiVersion: hostyour.cloud/v1
kind: ConsumerManifest
name: consumer-template
owner: platform@example.invalid
envs: [dev]
chart:
  path: deploy/chart
services: []
# The unit's ONE build: the flat image name `consumer-template` (== the build
# name — no prefix), built from the repo-root Containerfile by the unit's
# <unit>-release pipeline. The chart pins it in values-<stage>.yaml as
# builds[]{name,image,tag}, which is where the release bump writes the tag.
builds:
  - name: consumer-template
    containerfile: Containerfile
# Every secret property the chart references must be declared here (hard gate
# G7). The platform seeds all keys into the single Vault entry
# <env>/consumer/<name>/app.
secrets:
  - key: EXAMPLE_TOKEN
    description: Example secret proving the ESO path end to end.
    generate: hex32
