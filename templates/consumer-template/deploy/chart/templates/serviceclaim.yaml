{{- if .Values.serviceClaim.enabled }}
{{- /*
Optional: request a backing service from the platform's service-provisioner
(D8). The platform provisions it (a DB + user / a registry pull secret) and
writes a credentials Secret named "<release>-<service>" in this namespace —
reference it from the Deployment via `envFrom: [secretRef: ...]`.
Database names are taken VERBATIM (no auto-prefix): declare the literal,
namespace-anchored name(s) you own (e.g. <consumer>_<domain>). The app reads the
real name back from the credentials Secret (MONGODB_DATABASES / the URI path).
*/ -}}
apiVersion: platform.hostyour.cloud/v1alpha1
kind: ServiceClaim
metadata:
  name: {{ .Release.Name }}
spec:
  service: {{ .Values.serviceClaim.service }}
  {{- with .Values.serviceClaim.databases }}
  databases:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
