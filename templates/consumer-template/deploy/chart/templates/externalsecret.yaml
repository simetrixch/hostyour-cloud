# Reads EXAMPLE_TOKEN from YOUR Vault entry <env>/consumer/<name>/app.
# All declared secret keys live in that single `app` entry,
# and every remoteRef.key must equal exactly "<env>/consumer/<name>/app". The
# mount prefix is never part of the key — it comes from the SecretStore's
# path (global.vaultKvMount). Every referenced property must be declared
# in deploy/platform.yaml secrets[] (hard gate G7).
# All four defaulted remoteRef fields are emitted explicitly (ESO 2.x defaults
# them; without this the live object drifts from desired).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Chart.Name }}-app
  annotations:
    # After the SecretStore (-3) and before the workloads (0) + migration Job (-1),
    # so the Secret exists when the first pod is scheduled.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # No periodic read of Vault — the platform-wide delivery rule, stated in full in
  # hostyour-cloud charts/external-secret/templates/externalsecret.yaml: a secret
  # arrives on DEPLOY (OnChange re-syncs when this CR changes) and on target-Secret
  # DELETION (OnChange creates it when absent), never on a timer. So putting a NEW
  # value in front of the pods is three acts: write it into Vault, delete the target
  # Secret so ESO fetches it, roll the pods (the restart-workloads run).
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: {{ .Chart.Name }}-app
    creationPolicy: Owner
  data:
    - secretKey: EXAMPLE_TOKEN
      remoteRef:
        key: {{ printf "%s/consumer/%s/app" (required "global.env comes from the platform $values chain; for a local render pass -f platform/values-<stage>.yaml" .Values.global.env) .Chart.Name }}
        property: EXAMPLE_TOKEN
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
