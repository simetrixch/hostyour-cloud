# Points ESO at the platform Vault using the shared, label-bound consumer-eso
# role. No per-consumer Vault admin — the templated policy scopes reads to
# your own namespace automatically.
#
# server, path and mountPath come from the platform $values chain: one Vault
# URL and one Kubernetes auth mount per cluster (cluster/profile.yaml), one
# KV mount platform-wide (platform/values-common.yaml). Hard gate G7 asserts
# the rendered SecretStore uses all three.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  annotations:
    # After the external-secrets-sa ServiceAccount (-4, which ESO mints a token for)
    # and ahead of the ExternalSecret (-2) + workloads: the store must be valid
    # before any secret is read through it.
    argocd.argoproj.io/sync-wave: "-3"
spec:
  provider:
    vault:
      server: {{ required "global.vaultUrl comes from the platform $values chain; for a local render pass -f cluster/profile.yaml" .Values.global.vaultUrl | quote }}
      path: {{ required "global.vaultKvMount comes from the platform $values chain; for a local render pass -f platform/values-common.yaml" .Values.global.vaultKvMount | quote }}
      version: v2
      namespace: vault
      auth:
        kubernetes:
          mountPath: {{ required "global.vaultKubernetesAuthPath comes from the platform $values chain; for a local render pass -f cluster/profile.yaml" .Values.global.vaultKubernetesAuthPath | quote }}
          role: consumer-eso
          serviceAccountRef:
            name: external-secrets-sa
