# The SA the platform Vault role `consumer-eso` binds to. ESO uses it to log in
# to Vault; the label-bound role + templated policy scope it to THIS namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  annotations:
    # MUST be applied BEFORE the vault-backend SecretStore (-3): ESO validates the
    # store by minting a token for THIS SA, so it has to exist first. If it comes
    # later, the store fails "ServiceAccount not found", the sync aborts before this
    # wave, and the SA is never applied — a chicken-and-egg that deadlocks every
    # FRESH consumer sync (hostyour-cloud#18).
    argocd.argoproj.io/sync-wave: "-4"
