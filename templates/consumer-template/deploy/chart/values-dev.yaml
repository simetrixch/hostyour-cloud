# Per-env overrides for dev. The platform values (global.*) are NOT set
# here — they arrive over the platform $values chain (see values.yaml).
tlsSecretName: consumer-template-dev-tls

# The image pin — builds[]{name,image,tag}, `image` the FLAT build name. The
# release bump finds this entry by .image and writes .tag on every release to
# dev. `0.0.0` is the pre-first-release placeholder — no release mints that
# tag, so a pod stuck pulling it is a unit whose first release has not run;
# the release cycle the onboard verb triggers overwrites it with the minted
# tag.
builds:
  - name: consumer-template
    image: consumer-template
    tag: "0.0.0"
