# =============================================================================
# MongoDB — PER-UNIT TEMPLATE (one instance, one namespace).
#
# WHY THIS FILE IS values.yaml AND NOT values-common.yaml
# A stage-deployed cluster app is rendered by argocd/*/apps/applicationset.yaml,
# whose valueFiles chain names `values-common.yaml` + `values-<stage>.yaml`
# EXPLICITLY. A chart rendered into a UNIT namespace is not in that chain: it is
# an extra source of the unit's Application (argocd/*/apps/consumers-appset.yaml),
# i.e. `path: units/mongodb` plus the platform globals from $values, and Helm
# loads only the chart's own implicit `values.yaml` as the base. So the base
# values live in a file called exactly values.yaml, and there are no per-stage
# files beside it: a TEMPLATE has no stage identity of its own. Everything
# stage-dependent (vaultUrl, storageClass, timezone, secretStoreName) arrives
# through global.* from $values/platform/values-common.yaml + values-<stage>.yaml
# + cluster/profile.yaml.
#
# =============================================================================
# SIZE PRESETS — the UNIT's size, not a size of its own
#
#   preset            cpu req  mem req  cpu lim  mem lim  data volume
#   small (DEFAULT)     100m    512Mi       1       2Gi       10Gi
#   medium              250m      1Gi       2       4Gi       40Gi
#   large               500m      2Gi       4       8Gi      100Gi
#
# These are PER MEMBER. A `replicaset` runs three of them, which is why the
# Controller's quota table multiplies the mongodb row by the member count
# (hostyour-manager/shared/unit-size.ts, MONGODB_MEMBERS) — the ceiling and the
# render are summed from the same two facts.
#
# The figures are the shared instance's own, per member: apps/mongodb requests
# 250m/512Mi and limits 4 CPU/4Gi per member on every stage, on a set that
# carries every tenant. A per-unit instance carries one application, so small
# requests less memory than that and large is where the shared set stands. The
# memory LIMIT is what matters most for MongoDB: WiredTiger sizes its cache from
# the cgroup limit, so raising a size raises the cache.
#
# SMALL IS THE DEFAULT AND IT LIVES HERE — a render that names no size gets the
# frugal one, never the generous one. values-size-small.yaml exists only so every
# renderer can name its size uniformly (-f values-size-<size>.yaml) without a
# conditional; it is intentionally empty.
# =============================================================================

mongodb:
  # HOW this unit runs MongoDB — the SAME two words the consumer's manifest uses
  # (hostyour-manager/shared/unit-size.ts, MONGODB_MODE), minus `shared`: a unit
  # on the cluster's shared replica set renders no instance at all, so this chart
  # is not among its Application's sources.
  #
  #   standalone — ONE mongod, no --replSet, no keyfile, no rs-init, no PDB.
  #                MongoDB serves NO multi-document transactions from a true
  #                standalone, which is exactly what the word promises. A
  #                one-member REPLICA SET would serve them and make the word a
  #                lie, so the difference is rendered, not just counted.
  #   replicaset — THREE mongod with --replSet + --keyFile, a PostSync Job that
  #                initiates the set and a PodDisruptionBudget that keeps a
  #                quorum through a voluntary disruption.
  #
  # The member count each word means is stated once, in templates/_members.tpl,
  # and it is the same count the Controller's quota table multiplies by.
  mode: standalone

  image:
    repository: mongo
    # Managed centrally in platform/versions.yaml (images.mongodb) and stamped by
    # the version sync — do not hand-edit this tag.
    tag: "8.0.4"
    pullPolicy: IfNotPresent

  # The replica set's name, used only in `replicaset` mode. `rs0` is what the
  # shared instance uses and what the service-provisioner reads back off the
  # server when it builds a connection URI — it is never assumed there.
  replicaSetName: rs0

  containerPort: 27017

  # The official mongo image runs as uid/gid 999 (the `mongodb` user).
  podSecurityContext:
    fsGroup: 999
  containerSecurityContext:
    runAsUser: 999
    runAsNonRoot: true

  # SMALL preset — see the table above. Burstable on purpose: the request is what
  # the scheduler reserves, the limit is the ceiling WiredTiger sizes its cache
  # from.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

  # Per-member data volume (the StatefulSet's volumeClaimTemplate). The storage
  # class comes from global.storageClass; empty leaves the cluster default.
  storageSize: 10Gi

  # `mongosh --eval db.adminCommand({ping:1})` is the probe the shared instance
  # uses; ping answers before a replica set has a PRIMARY, which is what makes
  # rs-init reachable in the first place.
  livenessProbe:
    exec:
      command: ["mongosh", "--quiet", "--eval", "db.adminCommand({ping:1})"]
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 10
    failureThreshold: 6
  readinessProbe:
    exec:
      command: ["mongosh", "--quiet", "--eval", "db.adminCommand({ping:1})"]
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 6

# =============================================================================
# NetworkPolicy — the ONE cross-namespace client this database has.
#
# The unit's namespace is already deny-by-default inbound (units/networkpolicy
# admits same-namespace pods plus `ingress` and `observability`), which covers the
# unit's own application, the rs-init Job and the members talking to each other.
# The service-provisioner is the exception: it mints the consumer's users and
# databases from ITS namespace, and a claim it cannot connect to reports an Error
# forever. See templates/networkpolicy.yaml for why the name and not the label.
# =============================================================================
networkPolicy:
  # Namespaces admitted to :27017 BY NAME (namespaceSelector on
  # kubernetes.io/metadata.name), deliberately NOT by global.dbConsumerLabel —
  # every consumer namespace carries that label, so admitting by it would open
  # this database to every OTHER consumer.
  allowedNamespaces:
    # Verified against the platform catalog: the provisioner runs in namespace
    # `service-provisioner` (argocd/*/apps/applicationset.yaml).
    - service-provisioner

# =============================================================================
# The credential trio — ExternalSecret + SecretStore + its ServiceAccount.
#
# WAVES. Both sit at -21/-20, ahead of the consumer's own chart (wave -3), for
# the reason units/postgresql states at length: the consumer's own SecretStore
# `vault-backend` does not exist until its chart syncs, and an ExternalSecret
# pointed at a store that is not there yet never materializes its Secret in time.
# The workload then deadlocks in CreateContainerConfigError.
#
# NAMES. Platform-owned and DISTINCT from the consumer's own objects. Two owners
# of one object is the collision distinct names exist to prevent.
# =============================================================================
externalsecret-mongodb:
  externalSecret:
    enabled: true
    # The CR's name is platform-owned; the Secret it writes keeps the literal
    # name the workload mounts by secretKeyRef.
    name: mongodb-instance
    targetSecretName: mongodb-credentials
    secretStoreName: vault-backend-mongodb
    annotations:
      argocd.argoproj.io/sync-wave: "-20"
    # REQUIRED of the renderer: <stage>/consumer/<name>/mongodb. Left empty here
    # and `required`d by charts/external-secret, so a render that forgets it
    # fails loudly instead of silently attaching to another unit's credential.
    vaultPath: ""
    # BOTH properties in BOTH modes, and the mode decides only what is MOUNTED.
    # The keyfile authenticates traffic between replica-set members, so a
    # standalone never mounts it — but the Controller seeds both at onboarding
    # (one create-only Vault write), and a sub-chart's values cannot be made
    # conditional from a parent template anyway. Requesting a property the entry
    # does not carry is what would deadlock the sync, so the entry carries both.
    data:
      - secretKey: root-password
        property: root-password
      - secretKey: keyfile
        property: keyfile

secret-store:
  enabled: true
  annotations:
    argocd.argoproj.io/sync-wave: "-21"
  # DISTINCT platform names — must NOT equal the consumer's own `vault-backend` /
  # `external-secrets-sa`.
  name: vault-backend-mongodb
  serviceAccountName: mongodb-eso
  # The same namespace-templated read policy the consumer's own store uses, which
  # already covers <stage>/consumer/<namespace>/* — so this path needs no grant
  # of its own to be READ. Writing it is the Controller's seed-mongodb-instance
  # step, which has its own narrow policy.
  role: consumer-eso
