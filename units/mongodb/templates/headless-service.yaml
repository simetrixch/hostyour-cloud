apiVersion: v1
kind: Service
metadata:
  # The StatefulSet's governing service (spec.serviceName). It gives each pod a
  # STABLE per-pod DNS name (mongodb-<ordinal>.mongodb-headless.<ns>.svc.cluster.
  # local) that resolves directly to that pod's IP — which mongod recognises as
  # one of its own bound addresses, so a member self-identifies reliably across
  # restarts. The rs-init Job advertises exactly these names as the set's members.
  #
  # Rendered in BOTH modes: a StatefulSet requires its governing Service to exist
  # whether or not anything resolves per-pod names through it, and a standalone
  # that is later re-onboarded as a replica set finds the name already correct.
  name: mongodb-headless
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: headless
spec:
  clusterIP: None
  # So the per-pod DNS resolves during startup, before readiness passes — which
  # is when rs-init needs it.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: 27017
      targetPort: 27017
      protocol: TCP
      name: mongodb
