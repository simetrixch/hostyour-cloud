{{- /*
unit-ingress — nothing reaches a unit's pods that is not named here.

WHAT IT CLOSES. A consumer namespace and a tenant member namespace were created
with labels and nothing else, so a pod in one could open a socket on a pod in
any other: the platform is rented to other companies, and a licensee's consumer
sits in the same cluster as ours. Every backing SERVICE was already fenced by its
own policy (apps/mongodb, apps/redis, units/postgresql); what had no policy at all
was the unit's own workload.

HOW IT WORKS. A NetworkPolicy that selects a pod makes that pod deny-by-default
for the policy types it names, and rules ACROSS policies are additive. So this
one policy over podSelector: {} turns the whole namespace deny-by-default for
inbound traffic, and every other policy that names a pod here — the postgres one
above all — keeps adding its own allowances on top. Nothing existing is taken
away by this file; what is new is that everything NOT listed anywhere is refused.

WHAT STAYS OPEN, and why each one has to:

  1. same-namespace pods. The unit's own workloads, its migrate Job, its
     exporters. Without this a unit cannot talk to itself.
  2. the platform namespaces in .Values.admittedNamespaces (ingress,
     observability) — see values.yaml for what each one carries.
  3. sibling namespaces of the SAME tenant, when .Values.tenant.guid is set.
     A tenant is not one namespace. Its applications, its identity provider and
     its jobs each get their own, and they address each other by in-cluster
     Service DNS — `<service>.<guid>-<member>.svc.cluster.local` — and not by
     FQDN, because an in-cluster call must not leave the cluster to come back.
     Every one of those calls crosses a namespace boundary, so they are the
     first thing this policy would break. The selector is the
     guid label the tenant ApplicationSet stamps on every member namespace
     (argocd/apps/tenants-appset.yaml, platform/tenant), so it admits
     exactly the members of THIS tenant and no other tenant's.

WHAT NEEDS NO RULE. The kubelet's liveness/readiness probes originate on the NODE,
not in a pod, and Calico allows every connection a host makes to a workload
running on that same host precisely so health checking keeps working
(docs.tigera.io/calico — "Protect hosts"). A rule for the node addresses would
have to name a range wide enough to contain the pod CIDR, which would readmit
every pod in the cluster and undo the policy.

EGRESS IS DELIBERATELY NOT TOUCHED. This policy names no Egress type, so a unit's
outbound traffic is unchanged. Restricting it would need an allow-list of
everything a rented customer's application may legitimately dial, which is not a
knowable list — see the ticket this file belongs to.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: unit-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: unit-networkpolicy
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        {{- range .Values.admittedNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
        {{- with .Values.tenant.guid }}
        - namespaceSelector:
            matchLabels:
              platform/tenant: {{ . | quote }}
        {{- end }}
