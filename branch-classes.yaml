# branch-classes.yaml
# =============================================================================
# THE single source of truth for what every path of this repository IS — every
# tracked one, and every one about to be tracked, because a path needs its class
# BEFORE it is committed or the first commit of it is the unclassified one.
#
# Three classes, taken from hostyour-manager/shared/branches.ts, which names
# them and says why mixing them up is the defect:
#
#   product  master, the trunk. The software: charts, manifests, scripts, the
#            channel table, the release tags. A product path goes to a second
#            installation BYTE-IDENTICAL. Nothing that names one installation
#            may be produced here.
#   install  one branch per cluster, named after that cluster's FQDN. The trunk
#            at the cluster's pinned release tag, plus that machine's own
#            settings. An install path names one cluster or one machine.
#   books    what ONE installation knows about itself: its cluster maps, its
#            consumer registrations, its tenant registrations. Stands on the
#            install branch of the cluster holding the master role. A books path
#            is never tracked on the trunk.
#   mixed    NOT a fourth class. The file carries values of two classes at once
#            and no class is true of the whole of it. Every `mixed` entry has a
#            row in `uncertain:` naming the values of the second class inside it
#            and what would settle it. A mixed file is a defect, not a state to
#            keep.
#
# WHY THIS FILE EXISTS. Which paths are installation state used to be decided
# by two routines that never read this file: one greps file CONTENT for the
# domain placeholder to find what to stamp, the other matches path patterns by
# hand to find what a sync of an install branch may throw away. Neither can
# know what a path MEANS. The first once stamped a script's own placeholder
# guard, so the installer refused the domain it had just installed; the second
# once classified clusters/active/*.yaml as safe to discard, so a merge
# conflict would have resolved the installation's ledger away with the sync
# reporting success.
#
# WHAT HOLDS THE ROUTINES TO THIS FILE TODAY: NOTHING. A check used to mirror
# both of them and report where they disagreed with it; it was deleted with the
# gate package it lived in. The routines still decide for themselves — they do
# not read this file — so this file and their behaviour are two statements of one
# thing, and a drift between them is not reported by anything.
#
# That is stated here rather than left to be discovered, because of the second
# incident above: a wrong classification there is not a failed run, it is a
# successful sync that threw an installation's ledger away.
#
# THE FIX IS NOT A NEW CHECK. It is for the routines to READ this file and act on
# what it says, at which point there is one statement instead of two and nothing
# left to compare. That is what turning the stampers into configured steps is
# for.
#
# WHAT DECIDES A BRANCH'S CONTENTS. An install branch is the trunk — at the cut,
# or at the pinned release tag a regeneration merges in — PLUS what the branch
# program writes into it. There is no third term. No step of deploy-branch,
# deploy-slave-branch, regenerate-branch or regenerate-slave-branch DELETES a
# path from a branch, so every file the trunk carries stands on every branch cut
# from it, whatever its class here says. Twenty comments across five files used
# to attribute a reduction to a stamper named nowhere in either tree — the two
# stage trees a branch is not pruned away, `registrations/` taken off a branch
# whose role lacks the master part, foreign cluster maps removed. No step has
# ever done any of it (hostyour-cloud#69), and the class of a path is a
# statement about what the path IS, never about which files a branch physically
# carries.
#
# WHAT ITS ABSENCE COSTS, READ OFF THE THINGS THAT RENDER. Nothing reads a
# branch more widely than it names:
#
#   * every value chain names `values-__STAGE__.yaml` outright — the two other
#     stage files a branch carries are loaded by nothing
#     (argocd/apps/applicationset.yaml). The `revision: master` that file carries
#     is no part of this: on a branch it is not master any more, because the
#     revision stamp retargets every revision/targetRevision under argocd/ to the
#     branch, which is what the `argocd/*` row of the derived section below
#     states.
#   * the consumer and slave generators pin `revision: __BOOKS_BRANCH__` and add
#     a label selector on top, so what stands under `registrations/` or
#     `clusters/active/` on the LOCAL branch is not what either of them selects
#     (argocd/apps/consumers-appset.yaml, argocd/apps/slaves-appset.yaml).
#
# And nothing puts the pruned material there to begin with: the trunk carries no
# registration and no cluster map — `clusters/active/.gitkeep` and nothing else
# — every branch is cut from the trunk, and a branch whose role lacks the master
# part is written no map at all (regenerate-branch.yaml states it: "A slave's
# branch carries no cluster map at all").
#
# FORMAT. Sections of `  "<pattern>": <value>` lines, each with its reason on
# the ONE comment line directly above it — the shape platform/versions.yaml
# already uses, plain enough that a rule and the reason for it read together
# with no nested structure in between.
#
# PATTERNS are bash pattern-match, where `*`
# matches `/` as well: `*.sh` covers every script wherever it sits, and
# `charts/*` covers the whole subtree instead of stopping at the first `/`,
# which is the sense a shell glob or a package:glob pattern would give it.
#
# ORDER. First match OWNS the path; later rules never see it, in EVERY section.
# So a specific path stands ABOVE the glob it is an exception to —
# apps/postfix/values-*.yaml above `apps/*/values-*.yaml`. A rule that owns no
# path is DEAD, unless it is listed in `trunk-absent:` — that is how a rule
# accidentally placed below its own glob makes itself visible.
#
# THIS FILE IS NOT ITSELF STAMPED. It explains the stamp, so it names the
# placeholder literal, so a blind text substitution would rewrite it and leave
# the one file an operator opens to learn which paths must never be stamped
# saying the opposite. The domain stamp excludes it by name for that reason, and
# `never-stamp:` below holds the row that says so.
# =============================================================================

# -----------------------------------------------------------------------------
# classes — every path in the tree, in first-match order.
# -----------------------------------------------------------------------------
classes:

  # git's own attributes for this repository — no writer, no installation coordinate.
  ".gitattributes": product
  # What never enters this tree — the agent instruction files and the vendored chart dependencies; identical in every installation.
  ".gitignore": product
  # The secret-scanner's allowlist for this repository; a scanner setting, not a machine setting.
  ".gitleaks.toml": product
  # The terms the software is licensed under. They name the licensor, Simetrix GmbH, and no installation — the same words travel with every copy of the tree.
  "LICENSE.md": product
  # What the product is and what its directories hold. It names no domain and no cluster: an installation is described by its own cluster map, not here.
  "README.md": product

  # The four public addresses of the bootstrap and the certificate in front of the secret store.
  # Each names a host built on this cluster's FQDN, so the domain stamp fills them like every other
  # placeholder in the tree. Install and not product for the same reason argocd/* is: what stands in
  # them is one cluster's own name. Declared BEFORE the bootstrap rule, because the first matching
  # rule owns a path.
  "bootstrap/argocd/ingressroute.yaml": install
  "bootstrap/idp/ingressroute.yaml": install
  "bootstrap/kube/ingressroute.yaml": install
  "bootstrap/vault/ingressroute.yaml": install
  "bootstrap/vault/certificate.yaml": install

  # The identity provider's own environment, read by its bootstrap. Two of its three values are
  # built on this cluster's FQDN, so the domain stamp fills them like every other placeholder in the
  # tree — which makes the file installation state and not product, whatever its directory says.
  # Declared BEFORE the bootstrap rule below, because the first matching rule owns a path.
  "bootstrap/idp/idp-bootstrap-env.yaml": install

  # ArgoCD's own helm values, and the one file of the bootstrap that carries this installation's
  # domain: its server address and the issuer it validates tokens against are both built on the
  # cluster FQDN, so the domain stamp fills them like every other placeholder in the tree. Declared
  # BEFORE the bootstrap rule below, because the first matching rule owns a path. Install and not
  # product for the same reason argocd/* is: what stands in it is one cluster's own name.
  "bootstrap/argocd/values.yaml": install
  # What the installer applies with helm before ArgoCD exists: the identity provider, the reconciler,
  # the secret store and the dashboard. Product — the same bytes on every installation. The one
  # exception is the file above, and the two secrets the identity provider needs are not in these
  # files at all.
  "bootstrap/*": product

  # The ten library charts every app depends on: no writer at all — not in the placeholder list, not touched by the version sync.
  "charts/*": product
  # This file: the declaration itself, the same in every installation. Product because it describes the product's shape and names no cluster — and because a stamper must never rewrite the file that says what may be stamped.
  "branch-classes.yaml": product

  # Chart metadata and dependency version pins, stamped on master only, by the version sync, from platform/versions.yaml.
  "apps/*/Chart.yaml": product
  # Chart templates: every domain, cluster name and endpoint is composed at RENDER from .Values.global.*, so the file itself names no installation.
  "apps/*/templates/*": product
  # The build fan-out ApplicationSet body, held outside templates/ so ArgoCD's own {{ }} survives Helm; its __BOOKS__/__BRANCH__/__STAGE__ markers are substituted at render, not by a stamper.
  "apps/consumer-build/files/applicationset.yaml": product
  # Helm packaging directive for the image-builder chart; no writer of any kind.
  "apps/image-builder/.helmignore": product

  # Chart metadata and dependency version pins of the four per-unit charts, written by the same version sync as apps/*/Chart.yaml.
  "units/*/Chart.yaml": product
  # Chart templates of the per-unit charts: every name they emit is the software's own or arrives per unit through valuesObject, so the file names no installation.
  "units/*/templates/*": product
  # The per-consumer PostgreSQL template's base values — values.yaml and not values-common.yaml because Helm loads only the implicit file when the chart is an extra source (argocd/apps/consumers-appset.yaml:207).
  "units/postgresql/values.yaml": product
  # The three workload sizing presets a renderer selects with -f values-size-<size>.yaml; a sizing table is the software's own.
  "units/postgresql/values-size-*.yaml": product
  # The per-unit MongoDB template's base values — values.yaml and not values-common.yaml for the same reason as units/postgresql above: Helm loads only the implicit file when the chart is an extra source (argocd/apps/consumers-appset.yaml). It carries the small preset and the `standalone` default, both the software's own.
  "units/mongodb/values.yaml": product
  # Its three sizing presets, selected with -f values-size-<size>.yaml, exactly as units/postgresql's are.
  "units/mongodb/values-size-*.yaml": product
  # The unit ingress policy's base values — values.yaml and not values-common.yaml for the same reason as units/postgresql above: Helm loads only the implicit file when the chart is an extra source (argocd/apps/consumers-appset.yaml). The two names it carries, `ingress` and `observability`, are platform namespaces out of argocd/apps/applicationset.yaml, so they are the same on every installation.
  "units/networkpolicy/values.yaml": product
  # The unit quota chart's base values — values.yaml for the same reason as the sibling above (Helm loads only the implicit file when the chart is an extra source). It carries NO figures: the six numbers are empty and `required`, because the Controller resolves them per unit from its size table and the ApplicationSet passes them in. What does stand here is the LimitRange defaults, which are the same on every installation.
  "units/quota/values.yaml": product

  # The per-slave chart's metadata and its argo-cd dependency pin, written by the same version sync as apps/*/Chart.yaml.
  "slaves/*/Chart.yaml": product
  # The per-slave chart's templates: the slave's name, branch and API address arrive through the slaves generator's valuesObject, so the files themselves name no cluster.
  "slaves/*/templates/*": product
  # The per-slave chart's own cross-stage defaults, written on master only by the version sync — the same shape as apps/*/values-common.yaml.
  "slaves/*/values-common.yaml": product
  # Stage overrides of the per-slave chart's own defaults, carried on every branch and loaded only where the branch's own stage names them, exactly as apps/*/values-dev.yaml is.
  "slaves/*/values-dev.yaml": product
  # Same mechanism as slaves/*/values-dev.yaml.
  "slaves/*/values-test.yaml": product
  # Same mechanism as slaves/*/values-dev.yaml.
  "slaves/*/values-prod.yaml": product

  # The Controller's own settings. The four keys that name one machine (gateControllerAddr, gateFenceMustFail, master.sshUser, master.lanHost) moved to installation/values/manager.yaml.
  "apps/manager/values-common.yaml": product
  # The relay's tuning, ~90 keys the software's own. ALLOWED_SENDER_DOMAINS moved to installation/values/postfix.yaml, rendered per branch from the cluster map.
  "apps/postfix/values-common.yaml": product
  # Stage overrides of the relay's own defaults. myhostname moved to installation/values/postfix.yaml; the DKIM filename is composed from global.domain inside extraInitContainers, which the chart renders through tpl.
  "apps/postfix/values-dev.yaml": product
  # Same shape as apps/postfix/values-dev.yaml.
  "apps/postfix/values-test.yaml": product
  # Same shape as apps/postfix/values-dev.yaml.
  "apps/postfix/values-prod.yaml": product
  # The stack's own ~250 lines. The eleven URLs that named one installation moved to installation/values/observability.yaml, the three alert-mail links as a SECOND templateFiles entry so the ~100-line template stays here.
  "apps/observability/values-dev.yaml": product
  # Same shape as apps/observability/values-dev.yaml.
  "apps/observability/values-test.yaml": product
  # Same shape as apps/observability/values-dev.yaml.
  "apps/observability/values-prod.yaml": product

  # An app's own cross-stage defaults, written on master only by the version sync; no branch stamper writes any of them.
  "apps/*/values-common.yaml": product
  # Stage overrides of the software's own defaults. A stage is not an installation, and no branch stamper rewrites the file: an install branch carries all three, and the app generator's value chain names values-__STAGE__.yaml, so the two the branch is not are loaded by nothing.
  "apps/*/values-dev.yaml": product
  # Same as values-dev.yaml: carried on every branch, loaded only where its own name is the branch's stage.
  "apps/*/values-test.yaml": product
  # Same as values-dev.yaml, and where the release bump writes: the class-(c) loop of pipeline-release.yaml commits builds[].tag to MASTER, and an install receives it when its pin moves.
  "apps/*/values-prod.yaml": product

  # WHAT RUNS WHERE, one manifest per app on the TRUNK. `runsOn:` is the software's own statement — every-cluster, master or slave — and the app generator in argocd/apps/applicationset.yaml admits every-cluster plus the role stamped over __CLUSTER_ROLE__, so a cluster's role selects and no per-branch toggle file exists. It replaced the per-app toggle files this repository no longer carries, one per app under installation/apps/, whose `deploy:` line an install branch owned.
  "apps/*/app.yaml": product
  # Rendered whole by the branch program from the run's answers: domain, clusterName, unitApex, platformDomain, booksBranch, vaultUrl, tailnetUrl and the registry host all name one cluster.
  "installation/profile.yaml": install
  # Per-APP installation values, one level below installation/profile.yaml: keys that name one machine or one installation and belong to a SINGLE app, so they cannot ride in global.*. The ApplicationSet loads $values/installation/values/<app>.yaml after that app's own values-<stage>.yaml. The Controller's four machine keys — nothing derives them, so the installer scaffolds the file EMPTY on the branch and never rewrites it; it is absent from the trunk, which is not a machine.
  "installation/values/manager.yaml": install
  # The relay's hostname and sender allowlist, rendered in full from the cluster map by the deploy-branch pipeline.
  "installation/values/postfix.yaml": install
  # Every URL that names this cluster — Grafana's ingress and OIDC endpoints, the three alert-mail links. Rendered in full from the map.
  "installation/values/observability.yaml": install
  # ArgoCD retargeted to track THIS branch, with the __CLUSTER__ and __BOOKS_BRANCH__ markers stamped in, and on a pure slave the whole tree moved into namespace <name>.
  "argocd/*": install

  # The platform's own grammar and nothing else: releaseTagFilter, channelStages, the timezone, the storage class. global.domain used to sit here and made the file two classes at once; it is one installation's fqdn, and the branch program writes it into installation/profile.yaml.
  "platform/values-common.yaml": product

  # The empty-directory marker that lets the trunk carry clusters/active/ with no map in it — the state the installer asserts the trunk must be in.
  "clusters/active/.gitkeep": product
  # THE single source for every upstream component version, stamped into apps/*/Chart.yaml and apps/*/values-*.yaml by the version sync.
  "platform/versions.yaml": product
  # One key, global.env: dev — identical in every installation of that stage, and the same shape as apps/*/values-dev.yaml: carried on every branch, loaded only where dev is the branch's stage.
  "platform/values-dev.yaml": product
  # Same as platform/values-dev.yaml, for the test stage.
  "platform/values-test.yaml": product
  # Same as platform/values-dev.yaml, for the prod stage.
  "platform/values-prod.yaml": product

  # A unit the Controller onboarded: hostyour-manager/server/domains/onboarding/registry.ts:347 writes it, on the branch registry.ts:179 resolves to PlatformRepo.booksBranch, never onto the trunk.
  "registrations/*/build.yaml": books
  # A unit's dev registration, written by registry.ts:353 onto the same books branch; its `cluster:` field names one real cluster of one installation.
  "registrations/*/dev.yaml": books
  # A unit's test registration, same writer and same branch as the dev file.
  "registrations/*/test.yaml": books
  # A unit's prod registration, same writer and same branch. A branch whose role lacks the master part carries none of the four: the trunk has no registration to bring along and nothing writes one there.
  "registrations/*/prod.yaml": books
  # One cluster of this installation: the installer writes it once, and hostyour-manager/server/domains/inventory/cluster-marking.ts:427-433 writes it again — commitMarking, through which every map write of that file goes, and it commits on repo.booksBranch only.
  "clusters/active/*.yaml": books

# -----------------------------------------------------------------------------
# stamped — the paths whose domain placeholder IS installation state, so the
# stamp must rewrite it there. The value names the key that is stamped. A
# stamped path is installation state on the branch, so its class must be install
# or mixed — never product, which is byte-identical everywhere, and never books,
# which is not on the trunk at all.
# -----------------------------------------------------------------------------
stamped:

  # The host each route answers on, and the name on the certificate in front of it. The route and
  # the certificate of one component are in one file, so the two cannot name different hosts.
  "bootstrap/argocd/ingressroute.yaml": spec.routes.match
  "bootstrap/idp/ingressroute.yaml": spec.routes.match
  "bootstrap/kube/ingressroute.yaml": spec.routes.match
  "bootstrap/vault/ingressroute.yaml": spec.routes.match
  "bootstrap/vault/certificate.yaml": spec.dnsNames

  # global.domain, configs.cm.url and the issuer inside configs.cm."oidc.config" — three sites in one
  # file, all of them this cluster's own name, and helm reads the file after the branch was stamped.
  "bootstrap/argocd/values.yaml": global.domain

  # The per-slave generator's selector `master:` — on a branch it must name this installation's master cluster, or the generator matches no map. One entry, because the three stage trees became one parameterized tree and there is one file to stamp.
  "argocd/apps/slaves-appset.yaml": spec.generators.selector.master

# -----------------------------------------------------------------------------
# never-stamp — the paths whose domain placeholder is a guard, a fixture, an
# illustration or the documentation of the stamp itself, so the stamp must
# never rewrite it. What keeps the stamp off them is the excluded_names list the
# branch programs hand every stamp row, and this section is the statement of
# WHY each name is on it. A guard that does not carry the placeholder today is
# still declared here, because it is inside the stamp's reach the day it does.
# -----------------------------------------------------------------------------
never-stamp:

  # This file quotes the placeholder to explain the stamp; stamped, the one file naming the paths that must never be stamped would name a real FQDN instead. The domain stamp excludes it by name.
  "branch-classes.yaml": documentation

# -----------------------------------------------------------------------------
# derived — what a sync of an install branch to a new pin may resolve toward the
# pin on a merge conflict, because a step of the branch program writes it again
# a moment later. Everything not listed must NOT be derived where the branch
# owns content in it.
#
# WHO READS THIS SECTION: the `toward_ref:` list of the git_merge_ref row in
# regenerate-branch.yaml and in regenerate-slave-branch.yaml, which carries a
# COPY of it. Only the `always` rows were copied — the three narrower values
# below decide nothing on either side today, and each of them says under what
# condition it would. Both copies still name nine per-app toggle files under
# installation/apps/, which this repository no longer carries: the per-branch
# deploy toggles were replaced by an app.yaml per app on the trunk, so those
# nine entries resolve nothing and no row for them stands here.
#
# Two axes, because a branch is generated from two facts the cluster map states:
# its STAGE and whether its role has the master part. The four values are the
# only shapes those two axes produce:
#
#   always             every stage, both roles.
#   other-stages       exactly on an installation whose stage is NOT this
#                      file's own. The branch carries the file either way —
#                      nothing prunes it — and no value chain loads it, so
#                      whichever side a conflict resolves to changes no render.
#                      Only for a pattern ending in values-<stage>.yaml.
#   books-branch-only  exactly where the role LACKS the master part, at every
#                      stage: such a branch carries no registration to conflict
#                      over, because the trunk it was cut from carries none. On
#                      the branch that HOLDS the books, resolving toward the pin
#                      would delete this installation's ledger.
#   foreign-map-only   the same, one file class narrower. A branch whose role
#                      lacks the master part is written no cluster map at all,
#                      so it has none to conflict over; on the books branch
#                      regenerate-branch writes THIS cluster's own map again
#                      every run, while a FOREIGN map is the Controller's write
#                      and nothing here rewrites it.
# -----------------------------------------------------------------------------
derived:

  # Every revision/targetRevision under it is retargeted by the revision stamp, and the markers over it by the cluster, books, catalog, stage and role stamps — a run writes the whole tree again, so a conflict anywhere in it may resolve toward the pin.
  "argocd/*": always

  # Rendered whole out of the run's own answers by the branch program on every run: the trunk carries `global: {}`, so every byte a branch holds here came out of that render.
  "installation/profile.yaml": always

  # One key, global.env — the same shape as apps/*/values-dev.yaml: an installation of another stage never loads it, so which side a conflict resolves to changes no render.
  "platform/values-dev.yaml": other-stages
  # Same as platform/values-dev.yaml, kept on a test-stage installation.
  "platform/values-test.yaml": other-stages
  # Same as platform/values-dev.yaml, kept on a prod-stage installation.
  "platform/values-prod.yaml": other-stages
  # An app's dev overrides: loaded on a dev-stage installation and by nothing on the other two, whose value chains name their own stage.
  "apps/*/values-dev.yaml": other-stages
  # Same as apps/*/values-dev.yaml, kept on a test-stage installation.
  "apps/*/values-test.yaml": other-stages
  # Same as apps/*/values-dev.yaml, kept on a prod-stage installation.
  "apps/*/values-prod.yaml": other-stages
  # The per-slave chart's dev overrides: the same shape as apps/*/values-dev.yaml, and it needs its own rows because the chart no longer stands under apps/.
  "slaves/*/values-dev.yaml": other-stages
  # Same as slaves/*/values-dev.yaml, kept on a test-stage installation.
  "slaves/*/values-test.yaml": other-stages
  # Same as slaves/*/values-dev.yaml, kept on a prod-stage installation.
  "slaves/*/values-prod.yaml": other-stages
  # A unit's build declaration. On the branch that holds the books an operator's suspended:/quiesced: flip is branch-side content, so a conflict must stop the sync; on any other branch there is no such file to conflict over.
  "registrations/*/build.yaml": books-branch-only
  # Same as registrations/*/build.yaml — absent from a branch without the master role, and never regenerated on the branch that holds the books.
  "registrations/*/dev.yaml": books-branch-only
  # Same as registrations/*/dev.yaml.
  "registrations/*/test.yaml": books-branch-only
  # Same as registrations/*/dev.yaml.
  "registrations/*/prod.yaml": books-branch-only
  # A FOREIGN cluster's map: the Controller writes it onto the books branch and nothing here rewrites it, so resolving it toward the pin would throw away a write only that branch had. This cluster's OWN map is not covered by this row — regenerate-branch renders it again every run.
  "clusters/active/*.yaml": foreign-map-only

# -----------------------------------------------------------------------------
# trunk-absent — rules that legitimately own no tracked path on master, because
# what they describe stands on an install branch or on the books branch. A rule
# NOT listed here that owns nothing is dead. A rule listed here that DOES own a
# tracked path on master is a defect of the other sign: a books file or a
# machine setting has landed on the trunk. The value also fixes the class the
# rule must carry — `install-branch` means install, `books-branch` means books.
# -----------------------------------------------------------------------------
trunk-absent:

  # installation/values/ does not exist on master at all: the trunk is not a machine and not an installation, so it has no answers for any of these. the installer scaffolds controller.yaml EMPTY on the branch (operator decisions, so a rendered file would overwrite them), and the other two are rendered in full from the cluster map. The ApplicationSet tolerates all three being absent (ignoreMissingValueFiles), which is what the trunk render relies on.
  "installation/values/manager.yaml": install-branch
  # Rendered in full from the cluster map, like installation/profile.yaml.
  "installation/values/postfix.yaml": install-branch
  # Same as installation/values/postfix.yaml.
  "installation/values/observability.yaml": install-branch

  # A map is one installation's identity; the trunk holds only clusters/active/.gitkeep, which the installer asserts.
  "clusters/active/*.yaml": books-branch
  # The Controller writes an onboarded unit's build declaration onto the books branch, and the branch program writes ONE of them itself — registrations/hostyour-manager/build.yaml, so that the platform's own Controller image is built the way every other unit's is. The trunk carries none.
  "registrations/*/build.yaml": books-branch
  # A stage registration exists only where the Controller wrote it, on the books branch.
  "registrations/*/dev.yaml": books-branch
  # Same as registrations/*/dev.yaml.
  "registrations/*/test.yaml": books-branch
  # Same as registrations/*/dev.yaml.
  "registrations/*/prod.yaml": books-branch

# -----------------------------------------------------------------------------
# uncertain — what the classification could not settle. Written down as
# uncertain rather than guessed: each row says what is unresolved and what
# would resolve it.
# -----------------------------------------------------------------------------
uncertain:

  # The map of the cluster holding the master part has TWO writers on the one branch that carries it: the branch program renders clusters/active/<fqdn>.yaml from the run's answers on every regeneration, and hostyour-manager/server/domains/inventory/cluster-marking.ts writes into the same directory on repo.booksBranch. Nothing reconciles them. Whether a map is the run's render with the Controller amending it, or the Controller's row with the run seeding it, would settle it.
  "clusters/active/*.yaml": books-row-on-an-install-branch

# -----------------------------------------------------------------------------
# outside — held deliberately outside git, so no rule above can own it. Named
# here because a declaration that promises every tracked path its class must say
# what it does NOT cover. A rule here owning a TRACKED path is a defect; owning
# nothing is the normal state and is not a dead rule.
# -----------------------------------------------------------------------------
outside:

  # Vendored Helm dependency archives, fetched by `helm dependency build` and ignored by .gitignore:4; ArgoCD does its own dependency fetch when rendering.
  "apps/*/charts/*": product
  # The lockfile of that same dependency fetch, ignored beside it at .gitignore:5.
  "apps/*/Chart.lock": product
  # The same archives under the per-unit charts, ignored at .gitignore:6.
  "units/*/charts/*": product
  # The same lockfile under the per-unit charts, ignored at .gitignore:7.
  "units/*/Chart.lock": product
  # The same archives under the per-slave chart, ignored at .gitignore:8.
  "slaves/*/charts/*": product
  # The same lockfile under the per-slave chart, ignored at .gitignore:9.
  "slaves/*/Chart.lock": product
