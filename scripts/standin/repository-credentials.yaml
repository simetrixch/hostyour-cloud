# WHAT A FORGEJO INSTALLATION'S installation/values/repository-credentials.yaml SAYS, as scripts/check.sh reads
# it to render the charts that hold the credential Argo CD reads the installation's repositories with. The
# branch program writes the real file on the install branch (hostyour-deploy
# ansiwise/templates/repository-credentials-values.tpl); the platform-apps chain and the slaves chain load it
# beside the cluster map. An installation whose repositories stand on GitHub only has no such file, which is
# why this one is not in the chain of every render.
global:
  repositoryCredentials:
    forgejo:
      enabled: true
      host: forgejo.check.example.invalid
      platformRepository: check/hostyour-cloud
      deployRepository: check/check
      organisations: check
