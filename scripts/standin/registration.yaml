# The stand-in registration, for the render check only. No cluster ever reads this file.
#
# It carries the per-unit and per-slave facts an ApplicationSet hands a chart at deploy time. A unit
# chart's own values declare these keys empty and `required` on purpose — a default there would be a
# second source for a number the registration already states — so the numbers below are what lets
# those charts be rendered at all. They bound nothing.
#
# scripts/check.sh hands this one file to helm template, so the shape
# below is declared once in this repository.
suspended: false
quiesced: false
# What clusters/argocd/files/units-appset.yaml stamps onto the two charts that render a unit's
# fences: its isolation AppProject and argo-sync grant (clusters/units/reconciler) and its admission
# boundary (clusters/units/admissionpolicy). The names are the registration's own fields, so a chart
# reading one that this file does not carry says so by name at the render.
#
# `fqdn` STANDS EMPTY ON PURPOSE, and it is not an unanswered key: most units serve only
# `<name>.<unitApex>`, and the onboard writes an extra FQDN into a stage registration only after
# refusing every name the platform already serves. Empty is what the common case looks like, so it is
# the case this check renders.
registration:
  name: check
  repoURL: https://github.com/check/check.git
  fqdn: ""
  servicesJson: "[]"
# The reconciler namespace a unit's AppProject and argo-sync grant stand in. `argocd` here, which is
# what a cluster carrying the master part answers; on a pure slave the ApplicationSet fills the
# slave's own short name instead.
argoNamespace: argocd
tenant:
  guid: 00000000-0000-0000-0000-000000000000
  member: check
  appName: check
  subdomain: check
  stage: dev
quota:
  requestsCpu: "1"
  requestsMemory: 1Gi
  limitsCpu: "2"
  limitsMemory: 2Gi
  pods: "10"
  persistentVolumeClaims: "4"
slave:
  name: check
  fqdn: check.example.invalid
  branch: books.example.invalid
  apiHost: 10.0.0.1
  apiPort: "16443"
  masterFqdn: check.example.invalid
  stage: dev
externalsecret-mongodb:
  externalSecret:
    vaultPath: secret/dev/units/check/mongodb
externalsecret-postgres:
  externalSecret:
    vaultPath: secret/dev/units/check/postgres
