apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postfix-smtp-access
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mail
  policyTypes: [Ingress, Egress]
  ingress:
    # Namespaces allowed to talk to postfix on port 587 (no auth — restricted by
    # network policy only). Add your application namespaces below.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mongodb
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cronjobs
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vpn-monitoring
        # Any consumer that ATTESTED `smtp-relay` in services[]: its queue worker
        # relays here on 587. Selected by the label the consumers ApplicationSet
        # stamps on exactly those namespaces, so this base admits "a relay client"
        # without knowing which unit of which installation that is.
        #
        # Deliberately NOT platform/db-consumer, which every onboarded namespace
        # carries and would open this no-auth relay to all of them; and no longer
        # a namespace NAME, which was one installation's consumer written into the
        # product. The claim is the grant: the Controller's admission policy admits
        # this label only where the stage registration attests the service, so a
        # unit cannot label itself into this selector.
        - namespaceSelector:
            matchLabels:
              platform/smtp-relay-consumer: "true"
      ports:
        - protocol: TCP
          port: 587
  egress:
    - ports:
        - protocol: TCP
          port: 25
        - protocol: TCP
          port: 587
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
