# Shared observability config across DEV / TEST / PROD. Per-env overrides go in
# values-{dev,test,prod}.yaml.

# ============================================================================
# Monitoring chart — emits everything that ties the platform to Prometheus /
# Alertmanager:
#   - Alloy DaemonSet config (cluster-wide log shipper + OTLP receiver)
#   - Cluster-level PrometheusRule (PodCrashLooping, NodeDiskFillingUp, ...)
#   - ServiceMonitor / PodMonitor for foreign infra installed outside the
#     GitOps tree (cert-manager, Traefik, Vault, ArgoCD — bootstrapped by
#     base/ or the MicroK8s addons). These cannot ship with the
#     foreign app charts, so they live here in the observability app.
#
# Apps in apps/ that need their own monitoring depend on the same chart and
# declare their entries under their own top-level `monitoring:` key.
# ============================================================================
monitoring:
  prometheusReleaseLabel: observability

  alloy:
    logsEnabled: true
    tracesEnabled: true
    journaldEnabled: true

  # --------------------------------------------------------------------------
  # ServiceMonitors for foreign infrastructure (deployed by base/
  # or the MicroK8s addons, not by the GitOps tree). The observability app
  # owns these CRs because the upstream tools have no chart of their own here.
  # --------------------------------------------------------------------------
  serviceMonitors:
    cert-manager:
      enabled: true
      # cert-manager controller + cainjector + webhook all expose :9402.
      namespaces: [cert-manager]
      matchLabels:
        app.kubernetes.io/instance: cert-manager
      endpoints:
        - targetPort: 9402
          path: /metrics
          interval: 60s
          honorLabels: true

    vault:
      enabled: true
      # Four Services share app.kubernetes.io/name=vault:
      #   vault          — main (what we want)
      #   vault-internal — raft peer-to-peer (extra label vault-internal=true)
      # plus agent-injector and ui (different name labels). Exclude
      # vault-internal via matchExpressions.
      #
      # Vault serves /v1/sys/metrics over HTTPS with a Let's Encrypt cert valid
      # only for vault.<domain> — the in-cluster DNS name
      # doesn't match — so insecureSkipVerify. Unauthenticated metrics access
      # is enabled via listener."tcp".telemetry.unauthenticated_metrics_access
      # in the Vault config (bootstrap/vault/values.yaml).
      namespaces: [vault]
      matchLabels:
        app.kubernetes.io/name: vault
      matchExpressions:
        - { key: vault-internal, operator: DoesNotExist }
      endpoints:
        - port: https
          path: /v1/sys/metrics
          scheme: https
          params:
            format: [prometheus]
          interval: 60s
          tlsConfig:
            insecureSkipVerify: true

    external-secrets:
      enabled: true
      # ESO is installed as a single ArgoCD-managed Application
      # (apps/external-secrets/) in the external-secrets namespace.
      # The controller's metrics Service ships with the chart when
      # metrics.service.enabled=true.
      namespaces: [external-secrets]
      matchLabels:
        app.kubernetes.io/name: external-secrets
      endpoints:
        - port: metrics
          path: /metrics
          interval: 60s

  # --------------------------------------------------------------------------
  # PodMonitors — same as ServiceMonitor but the metrics port exists only on
  # the pod (not on any public Service).
  # --------------------------------------------------------------------------
  podMonitors:
    traefik:
      enabled: true
      # metrics.prometheus=true is set in Traefik args; port 9100 is on the pod
      # but not on the public Service.
      namespaces: [ingress]
      matchLabels:
        app.kubernetes.io/name: traefik
      podMetricsEndpoints:
        - port: metrics
          path: /metrics
          interval: 60s

    argocd:
      enabled: true
      # Every argocd-* component pod exposes a `metrics` container port. One
      # PodMonitor covers application-controller, applicationset-controller,
      # notifications-controller, repo-server, server.
      # dex-server exposes :5558 as `metrics` but doesn't serve a /metrics
      # handler — scraping triggers permanent TargetDown. Exclude it.
      # argocd-redis has no `metrics` port at all; the PodMonitor silently
      # skips pods where the named port doesn't exist.
      namespaces: [argocd]
      matchLabels:
        app.kubernetes.io/part-of: argocd
      matchExpressions:
        - { key: app.kubernetes.io/name, operator: NotIn, values: [argocd-dex-server] }
      podMetricsEndpoints:
        - port: metrics
          path: /metrics
          interval: 60s

  # --------------------------------------------------------------------------
  # Cluster-wide alert rules. Per-app rules live in each app's own values file.
  # --------------------------------------------------------------------------
  prometheusRules:
    kubernetes:
      enabled: true
      groups:
        - name: kubernetes
          interval: 60s
          rules:
            - alert: PodCrashLooping
              expr: rate(kube_pod_container_status_restarts_total[5m]) * 60 * 5 >= 2
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash-looping"
                description: "Container {{ $labels.container }} has restarted {{ $value }} times in the last 5 minutes."

            - alert: PodOOMKilled
              expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
              for: 1m
              labels:
                severity: critical
              annotations:
                summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} was OOMKilled"
                description: "Container {{ $labels.container }} was killed by the OOM killer."

            - alert: PodImagePullBackOff
              expr: kube_pod_container_status_waiting_reason{reason=~"ImagePullBackOff|ErrImagePull"} == 1
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} cannot pull image"
                description: "Container {{ $labels.container }}: {{ $labels.reason }}"

            - alert: PodCrashLoopBackOff
              expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} in CrashLoopBackOff"
                description: "Container {{ $labels.container }} repeatedly failing to start."

            - alert: PodStuckPending
              expr: kube_pod_status_phase{phase="Pending"} == 1
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} stuck in Pending"
                description: "Pod has been Pending for more than 15 minutes."

            - alert: PodNotReady
              expr: kube_pod_status_ready{condition="true"} == 0 and on(namespace, pod) kube_pod_status_phase{phase="Running"} == 1
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} not ready"
                description: "Pod is Running but readiness probe failing for 10 minutes."

            - alert: NodeDiskFillingUp
              expr: (node_filesystem_avail_bytes{mountpoint="/mnt/data"} / node_filesystem_size_bytes{mountpoint="/mnt/data"}) < 0.15
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "Node {{ $labels.instance }} disk almost full"
                description: "Less than 15% free on /mnt/data."

    # Vault runs with the Shamir seal, so a restart of vault-0 brings it back
    # sealed and NOTHING on the cluster gets a secret until it is unsealed again —
    # ExternalSecrets stop materializing, and every onboarding step that writes to
    # Vault fails. The node's hostyour-vault-unseal.timer unseals it again
    # within a minute; these two alerts are what says so when it does not.
    #
    # TWO alerts on purpose. VaultSealed names the cause, but it needs Vault to
    # answer /v1/sys/metrics — which the seal itself could take away.
    # VaultNotServing reads kube-state-metrics instead, so it cannot be silenced by
    # the failure it reports: the readiness probe the Vault chart ships runs `vault
    # status`, which fails while sealed. A sealed Vault that stays sealed therefore
    # raises both; a Vault that cannot start at all raises only the second.
    vault:
      enabled: true
      groups:
        - name: vault
          interval: 60s
          rules:
            - alert: VaultSealed
              expr: vault_core_unsealed == 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Vault ({{ $labels.pod }}) is SEALED — the platform is serving no secrets"
                description: >-
                  Vault reports itself sealed and the node's unsealer has not fixed it.
                  Check the unsealer on the control host: `systemctl status hostyour-vault-unseal.timer`
                  and `journalctl -u hostyour-vault-unseal -n 50`. To unseal by hand:
                  `systemctl start hostyour-vault-unseal` on that host.

            - alert: VaultNotServing
              expr: kube_pod_container_status_ready{namespace="vault", container="vault"} == 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Vault pod {{ $labels.pod }} is not serving — every ExternalSecret is stalled"
                description: >-
                  The vault container is not Ready. Its readiness probe is `vault status`,
                  so the usual cause is a sealed Vault; the other is a pod that cannot
                  start (most often a missing vault-tls Secret). Check
                  `journalctl -u hostyour-vault-unseal -n 50` first, then
                  `kubectl describe pod -n vault {{ $labels.pod }}`.

  # --------------------------------------------------------------------------
  # AlertmanagerConfig CRs.
  #
  # `platform-default` has no matchers — it's the catch-all that delivers any
  # alert not already null-routed by the global config (Watchdog / InfoInhibitor
  # / severity=info). With `emails:` omitted, the chart template falls back to
  # .Values.global.alertRecipients, which StampClusterProfile writes into
  # cluster/profile.yaml from the cluster map's alert-recipients — the
  # installation's own mailboxes, since platform/values-common.yaml is the trunk
  # and a mailbox names one installation. That is THE single source of truth for
  # this installation's alert mailbox: change the map field and stamp the branch
  # again to reroute every alert. The chart REFUSES to render an enabled entry
  # that resolves to no recipient, so the reroute cannot end in silence.
  #
  # Per-app overrides (e.g. mongodb → db-team@..., observability → ops@...)
  # live in each app's own values file as additional AlertmanagerConfig
  # entries with `matchers:` scoping them.
  # --------------------------------------------------------------------------
  alertmanagerConfigs:
    platform-default:
      enabled: true
      # No matchers → catches every alert that passes the null-routes.
      # No emails → falls back to .Values.global.alertRecipients.
      # The receiver name defaults to the entry key ("platform-default").

# ============================================================================
# kube-prometheus-stack
# ============================================================================
kube-prometheus-stack:
  fullnameOverride: observability

  # node-exporter: enable the systemd collector so failed host units
  # (snap.microk8s.*, kubelet, containerd) are scraped and alertable — B4 host
  # observability.
  prometheus-node-exporter:
    extraArgs:
      - --collector.systemd
      - --collector.systemd.unit-include=(snap\.microk8s\..+|kubelet|containerd|ssh)\.service

  # MicroK8s bundles etcd/controller-manager/scheduler/proxy as snap services
  # that don't expose the standard Prometheus endpoints. Disable those monitors
  # so their "Down" alerts don't constantly fire — Kubernetes overall health
  # is still visible via kube-state-metrics + node-exporter + apiserver.
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  kubeEtcd:
    enabled: false

  # Suppress built-in alert rules that are false-positive in this cluster:
  #   RedisMemoryPressure — fires on the redis_exporter pod (which itself
  #     has tiny limits), not the actual Redis. The metric labels aren't
  #     scoped to real Redis instances.
  defaultRules:
    disabled:
      RedisMemoryPressure: true

  prometheus:
    prometheusSpec:
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      retention: 15d
      # Remote-write receiver (Prometheus /api/v1/write). OFF here so a plain
      # full cluster is byte-identical to today (the chart default is also
      # false → the CR field is omitted entirely). The MASTER turns it ON via
      # cluster/profile.yaml (StampClusterProfile) so it can accept the slave
      # observability agents' remote_write — the D4b/I6 receive path. This one
      # field can't be gated by a Helm sub-chart `condition:` (it's a
      # kube-prometheus-stack value, not a chart of ours), so the master enables
      # it through its role profile, matching D4b "set via the global".
      enableRemoteWriteReceiver: false

  grafana:
    fullnameOverride: grafana
    admin:
      existingSecret: grafana-admin-credentials
      userKey: admin-user
      passwordKey: admin-password
    # MicroK8s hostpath doesn't allow root chown on mounted PVs — disable the
    # chown init container and let fsGroup handle ownership at mount time.
    initChownData:
      enabled: false
    securityContext:
      runAsNonRoot: true
      runAsUser: 472
      runAsGroup: 472
      fsGroup: 472
    sidecar:
      # The k8s-sidecar container fails on MicroK8s because its built-in
      # kube-apiserver CA lacks the X.509 keyUsage extension, which newer
      # Python SSL libs reject. Neither sidecar.skipTlsVerify nor the env-var
      # overrides are honored by this chart version. Since datasources are
      # fully declarative via additionalDataSources below (no runtime ConfigMap
      # discovery needed) and dashboards will be provisioned via
      # dashboardsConfigMaps, disable the sidecars entirely.
      dashboards:
        enabled: false
      datasources:
        enabled: false
    # Dashboards: each app drops a ConfigMap labelled grafana_dashboard: "1"
    # in its own namespace. Re-enable the dashboards sidecar above (and resolve
    # the MicroK8s CA issue) to have Grafana auto-discover them, or list them
    # explicitly under `dashboardsConfigMaps` here if sidecar discovery is off.
    # Provision datasources explicitly. additionalDataSources wasn't producing
    # a ConfigMap in this chart combination — explicit datasources.yaml works.
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            uid: prometheus
            access: proxy
            url: http://observability-prometheus.observability.svc.cluster.local:9090
            isDefault: true
          - name: Alertmanager
            type: alertmanager
            uid: alertmanager
            access: proxy
            url: http://observability-alertmanager.observability.svc.cluster.local:9093
            jsonData:
              implementation: prometheus
          - name: Loki
            type: loki
            uid: loki
            access: proxy
            url: http://loki-gateway.observability.svc.cluster.local
            jsonData:
              derivedFields:
                - datasourceUid: tempo
                  matcherRegex: '"traceId":"(\w+)"'
                  name: TraceID
                  url: "$${__value.raw}"
          - name: Tempo
            type: tempo
            uid: tempo
            access: proxy
            url: http://tempo.observability.svc.cluster.local:3100
            jsonData:
              tracesToLogsV2:
                datasourceUid: loki
                spanStartTimeShift: "-1h"
                spanEndTimeShift: "1h"
    ingress:
      enabled: true
      ingressClassName: public
      # Host + TLS set per-env

# ============================================================================
# Loki — single binary
# ============================================================================
loki:
  # Strip the "observability-test-" / "observability-prod-" release-name prefix
  # from Loki's services so consumers (Alloy write endpoint, Grafana Loki
  # datasource) can reference a stable DNS name across envs:
  #   loki.observability.svc.cluster.local
  #   loki-gateway.observability.svc.cluster.local
  fullnameOverride: loki
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    commonConfig: { replication_factor: 1 }
    storage: { type: filesystem }
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index: { prefix: index_, period: 24h }
    limits_config:
      retention_period: 336h
      allow_structured_metadata: true
      volume_enabled: true
    # Without retention_enabled the limits_config.retention_period above is
    # advisory only — Loki keeps every chunk forever. Single-binary mode runs
    # the compactor target by default, so flipping the flag is enough.
    compactor:
      retention_enabled: true
      retention_delete_delay: 2h
      delete_request_store: filesystem
  # loki 18.x (grafana-community) ships a HARD (requiredDuringScheduling) pod
  # anti-affinity by hostname on the gateway Deployment. On a single-node cluster
  # that deadlocks its RollingUpdate — the new gateway pod can't co-locate with
  # the old one on the only node and sits Pending forever. (affinity: {} doesn't
  # help — Helm coalesce keeps the chart default.) Use Recreate so the old pod
  # terminates before the new is created → only one gateway pod ever exists and
  # the anti-affinity never conflicts. rollingUpdate: null is required because
  # Recreate + a rollingUpdate block is rejected by the API server.
  gateway:
    deploymentStrategy:
      type: Recreate
      rollingUpdate: null
  singleBinary:
    replicas: 1
  read: { replicas: 0 }
  write: { replicas: 0 }
  backend: { replicas: 0 }
  chunksCache: { enabled: false }
  resultsCache: { enabled: false }
  # The Loki ruler-rules sidecar (k8s-sidecar) crashloops on MicroK8s: newer
  # Python SSL rejects the kube-apiserver CA (it lacks the X.509 keyUsage
  # extension), and skipTlsVerify is NOT honored by this chart version — the
  # same issue that forced disabling the Grafana sidecars above. No Loki ruler
  # rules are provisioned (log alerting is unused; metric alerts go via
  # prometheusRules), so disable the rules sidecar entirely.
  sidecar:
    rules:
      enabled: false
  monitoring:
    selfMonitoring: { enabled: false }
  # Top-level lokiCanary key (the chart moved it out of monitoring.lokiCanary;
  # the monitoring.lokiCanary key is now ignored). Disable the canary daemon —
  # it was spamming stdout with "<ts> pppppp..." lines that showed up in
  # Grafana's Drilldown Logs as service_name=unknown_service.
  lokiCanary:
    enabled: false
  test: { enabled: false }

# ============================================================================
# Tempo
# ============================================================================
tempo:
  # Same treatment as Loki: stable DNS name across envs.
  fullnameOverride: tempo
  tempo:
    retention: 168h
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: "0.0.0.0:4317" }
          http: { endpoint: "0.0.0.0:4318" }
  serviceMonitor: { enabled: true }

# ============================================================================
# Grafana Alloy (DaemonSet)
# ============================================================================
alloy:
  # Stable DNS name — apps send OTLP to alloy.observability.svc.cluster.local
  fullnameOverride: alloy
  controller:
    type: daemonset
    # Host journald needs /etc/machine-id (B2). /var/log/journal comes via
    # mounts.varlog below. Requires persistent journald on the host.
    volumes:
      extra:
        - name: etc-machine-id
          hostPath: { path: /etc/machine-id, type: File }
  alloy:
    configMap:
      create: false
      name: alloy-config
      key: config.alloy
    mounts:
      varlog: true
      extra:
        - name: etc-machine-id
          mountPath: /etc/machine-id
          readOnly: true
    extraPorts:
      - { name: otlp-grpc, port: 4317, targetPort: 4317, protocol: TCP }
      - { name: otlp-http, port: 4318, targetPort: 4318, protocol: TCP }

# ============================================================================
# Vault-backed secrets (ExternalSecret CRDs)
# Per-env vaultPath overrides go in values-{test,prod}.yaml.
# Per-app exporter secrets live in each app's chart, not here.
# ============================================================================
grafana-admin-secret:
  externalSecret:
    enabled: true
    name: grafana-admin-credentials
    namespace: observability
    secretStoreKind: SecretStore
    targetSecretName: grafana-admin-credentials
    data:
      - secretKey: admin-user
        property: admin-user
      - secretKey: admin-password
        property: grafana-admin-password

# OIDC client_secret for Grafana's auth.generic_oauth (Authentik). The
# Grafana pod mounts the resulting K8s Secret via `envFromSecret:
# idp-oidc-grafana` — `GRAFANA_OAUTH_CLIENT_SECRET` env becomes available
# to the grafana.ini.auth.generic_oauth.client_secret reference.
grafana-oidc-secret:
  externalSecret:
    enabled: true
    name: idp-oidc-grafana
    namespace: observability
    secretStoreKind: SecretStore
    targetSecretName: idp-oidc-grafana
    data:
      - secretKey: GRAFANA_OAUTH_CLIENT_SECRET
        property: grafana-client-secret

# ============================================================================
# Master receive path (D4b / I6) — rendered ONLY on the central observability
# cluster (the master). Every block below belongs to a sub-chart gated by
# `condition: global.servicesLocal.observabilityCentral` in Chart.yaml, so on a
# normal full cluster (observabilityCentral:false) these sub-charts are not
# loaded and none of this renders — the config sits here inertly.
#
# The two Ingresses expose the master's existing Prometheus + Loki to the slave
# push agents (apps/observability-agent, I5). Traffic is TLS (LE cert via the
# platform ClusterIssuer, added automatically by charts/ingress) and gated by a
# Traefik basic-auth Middleware. Hosts compose from global.domain (= the
# master's FQDN), matching StampClusterProfile, which points a pure slave's
# agents at prom-push./loki-push.<master-fqdn>.
# ============================================================================

# prom-push.<master-fqdn> → Prometheus service :9090, path /api/v1/write
# (the remote_write receiver enabled via prometheusSpec.enableRemoteWriteReceiver
# on the master). The slave agent posts to <prometheusPush>/api/v1/write
# (charts/monitoring/templates/alloy-agent-config.yaml).
ingress-prom-push:
  ingress:
    enabled: true
    className: public
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      # Cross-namespace Traefik Middleware ref: <namespace>-<name>@kubernetescrd.
      # The Middleware (push-auth-middleware below) renders in THIS namespace
      # (observability) with the fixed name obs-push-auth.
      traefik.ingress.kubernetes.io/router.middlewares: observability-obs-push-auth@kubernetescrd
    host: 'prom-push.{{ .Values.global.domain }}'
    paths:
      - path: /api/v1/write
        pathType: Prefix
        serviceName: observability-prometheus
        servicePort: 9090
    tls:
      enabled: true
      secretName: 'observability-prom-push-{{ .Values.global.env }}-tls'

# loki-push.<master-fqdn> → loki-gateway service :80, path /loki/api/v1/push.
# The slave agent posts to <lokiPush>/loki/api/v1/push.
ingress-loki-push:
  ingress:
    enabled: true
    className: public
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.middlewares: observability-obs-push-auth@kubernetescrd
    host: 'loki-push.{{ .Values.global.domain }}'
    paths:
      - path: /loki/api/v1/push
        pathType: Prefix
        serviceName: loki-gateway
        servicePort: 80
    tls:
      enabled: true
      secretName: 'observability-loki-push-{{ .Values.global.env }}-tls'

# Traefik basic-auth Middleware shared by both push Ingresses. `secret` points
# at the K8s Secret obs-push-htpasswd (key `users`, htpasswd format) that the
# ExternalSecret below materializes. fullnameOverride pins the resource name so
# the Ingress annotation ref is stable across envs.
push-auth-middleware:
  fullnameOverride: obs-push-auth
  middleware:
    enabled: true
    type: basicAuth
    basicAuth:
      secretName: obs-push-htpasswd

# ExternalSecret → K8s Secret obs-push-htpasswd with a single `users` key holding
# the htpasswd line (bcrypt). Read from the mount-relative Vault path
# <env>/app/observability, property push-htpasswd (per-env vaultPath in
# values-{dev,test,prod}.yaml). The observability namespace already binds the
# external-secrets Vault role (existing app|observability schema rows), so no new
# role-namespace wiring is needed.
push-htpasswd-secret:
  externalSecret:
    enabled: true
    name: obs-push-htpasswd
    namespace: observability
    secretStoreKind: SecretStore
    targetSecretName: obs-push-htpasswd
    data:
      - secretKey: users
        property: push-htpasswd

# Alertmanager sends mail directly via Postfix (in-cluster, no auth required)
# — no SMTP credentials secret needed.

