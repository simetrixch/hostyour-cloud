apiVersion: v1
kind: Service
metadata:
  # The client SEED endpoint, and the ONE coordinate the service-provisioner
  # needs: it resolves a mongodb claim to `mongodb.<claim's namespace>.svc.
  # cluster.local` without being told the instance is there. The name is pinned
  # for that reason — one instance per namespace, addressed by a fixed name, the
  # same discipline apps/postgresql applies to `postgres`.
  #
  # In replicaset mode a driver connecting here with ?replicaSet=<name> discovers
  # the members and is redirected to their per-pod headless FQDNs. In standalone
  # mode this is the only address there is.
  name: mongodb
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  # Keep routing to a member during a rolling restart or the init window.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.mongodb.containerPort }}
      targetPort: mongodb
      protocol: TCP
      name: mongodb
