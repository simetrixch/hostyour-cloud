# SIZE PRESET — small. Deliberately EMPTY.
#
# Small is the chart DEFAULT: values.yaml itself carries the small figures, so a
# render that names no size gets the frugal one. This file exists only so every
# renderer can name its size uniformly (-f values-size-<size>.yaml) for all three
# sizes, instead of carrying a conditional for the one size that has no file.
# Layering it changes nothing: `helm template apps/unit-mongodb` and
# `helm template apps/unit-mongodb -f values-size-small.yaml` render identically.
#
# Where the numbers come from is documented once, in the values.yaml header.
