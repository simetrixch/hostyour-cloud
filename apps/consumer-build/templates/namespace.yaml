{{- /*
The unit's build namespace <unit>-build. Rendered by the chart itself
(CreateNamespace=false on the fan-out) so the labels stand BEFORE any pod or
SecretStore exists in it — the gate-runner pattern:

  - hostyour.cloud/build=true: lets external-secrets-sa here authenticate
    with the label-bound `build-eso` Vault role, seeded with the cluster,
    whose policy templates on the SA's unit annotation — that is what stops
    this namespace from reading a sibling unit's repo-pat. The label reaches
    the API server only through this Application: the guard in
    vap-namespace-build-label.yaml refuses it on every other namespace.
  - PodSecurity enforce stays `privileged`: the buildah build/push steps run
    privileged (CAP_SYS_ADMIN for chroot — see the MicroK8s note in
    apps/image-builder/templates/tasks/buildah-build-push.yaml); `baseline`
    or `restricted` admission would reject every build pod outright. warn +
    audit are `baseline` so the violation stays visible where it matters.
*/ -}}
{{- if .Values.unit }}
{{- $unit := include "consumer-build.unitName" . -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ printf "%s-build" $unit }}
  labels:
    app.kubernetes.io/name: consumer-build
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    image-builder.io/consumer: {{ $unit | quote }}
    hostyour.cloud/build: "true"
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline
{{- end }}
