{{- /*
Per-namespace ESO setup for the unit's build credentials. Rendered EXPLICITLY
(not via the charts/secret-store dep) because the ROLE is not the default: the
SecretStore authenticates with the label-bound `build-eso` Vault role, seeded
with the cluster, over the LOCAL Vault of the build plane — the build
tier is stage-free (secret/build/<unit>/...), so it exists on exactly this one
Vault and a per-stage credential path could never sync here.

The `build-eso` policy templates every path on the UNIT the ServiceAccount is
annotated with (vault.hashicorp.com/alias-metadata-unit; Vault lifts the
annotation into the login alias metadata via use_annotations_as_alias_metadata).
That annotation is the isolation: external-secrets-sa in THIS namespace can
read secret/build/<unit>/* and nothing of any sibling unit.

Server and auth mount come from the cluster globals (installation/profile.yaml:
global.vaultUrl / global.vaultKubernetesAuthPath, written by
the branch program); the KV mount is the ONE shared mount
(global.vaultKvMount).
*/ -}}
{{- if .Values.unit }}
{{- $unit := include "consumer-build.unitName" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: {{ printf "%s-build" $unit }}
  annotations:
    vault.hashicorp.com/alias-metadata-unit: {{ $unit | quote }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.global.secretStoreName }}
  namespace: {{ printf "%s-build" $unit }}
spec:
  provider:
    vault:
      server: {{ required "global.vaultUrl must be set (installation/profile.yaml via the $values chain)" .Values.global.vaultUrl | quote }}
      path: {{ required "global.vaultKvMount must be set (platform/values-common.yaml via the $values chain)" .Values.global.vaultKvMount | quote }}
      version: "v2"
      namespace: "vault"
      auth:
        kubernetes:
          mountPath: {{ required "global.vaultKubernetesAuthPath must be set (installation/profile.yaml via the $values chain)" .Values.global.vaultKubernetesAuthPath | quote }}
          role: build-eso
          serviceAccountRef:
            # Local SA — a namespaced SecretStore cannot cross namespaces. The
            # role additionally binds this exact SA name.
            name: external-secrets-sa
{{- end }}
