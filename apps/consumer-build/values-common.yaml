# Shared values across DEV / TEST / PROD. Nothing here is stage-specific: the
# stage a release lands on arrives per run in the tag ref, and every hostname
# is composed from the platform globals.
#
# TWO RENDER MODES, one chart, told apart by `unit`:
#
#   unit: null   CATALOG mode — the consumer-build Application from the app
#                catalog (argocd/<stage>/apps/applicationset.yaml, project
#                cicd) renders ONLY templates/applicationset.yaml, which emits
#                the build fan-out ApplicationSet over registrations/*/build.yaml.
#
#   unit: {...}  UNIT mode — each Application the fan-out generates renders
#                this same chart with the unit's registration stamped in via
#                helm.valuesObject. Everything below `unit` is a LITERAL from
#                registrations/<name>/build.yaml on master — the attested
#                record, never a webhook payload:
#                  name        the unit (== basename(repoURL), the invariant
#                              the deploy-request Trigger routes by)
#                  repoURL     the unit's source repo; the pipeline pins it as
#                              the clone URL and fails a run whose webhook
#                              names any other repo
#                  buildsJson  the attested builds[] as a JSON string (toJson
#                              in the ApplicationSet: its body is emitted
#                              through Helm, which validates output as YAML —
#                              a scalar survives that parse, a rendered list
#                              would not)
unit: null

# WHO MAY LAND A RUN IN A UNIT'S BUILD NAMESPACE. The EventListener runs in its
# own namespace and creates the PipelineRun in the unit's, so the grant lives
# where the run lands — rendered per unit by templates/rbac-eventlistener.yaml,
# scoped to `create` on pipelineruns and to that one namespace.
#
# Named here rather than composed, because these are the identity of another
# release (apps/image-builder) and a chart that guessed them would fail at the
# moment a webhook arrives rather than at the moment it renders.
eventListener:
  serviceAccountName: eventlistener-sa
  namespace: image-builder

# npm registries the per-unit .npmrc points at (templates/externalsecret-npmrc.yaml).
# Only PRIVATE scopes are configured:
#   • The DEFAULT (unscoped) registry is deliberately NOT set, so pnpm resolves
#     public deps from its own default, registry.npmjs.org. The build's egress is
#     outward-open (templates/networkpolicy.yaml), and pnpm MUST resolve from
#     npmjs directly, or the tarball URLs in the unit's COMMITTED lockfile stop
#     matching (ERR_PNPM_TARBALL_URL_MISMATCH).
#   • privateScopes[] — per-scope PRIVATE routes, each DIRECT to its registry.
#     Per entry:
#       scope         npm scope WITHOUT the leading @ (e.g. simetrixch).
#       registry      full https registry URL for that scope.
#       authProperty  (optional) property name on the unit's ONE Vault entry
#                     secret/build/<name>/repo-pat whose value becomes that
#                     registry's _authToken. Omit for a scoped registry that
#                     needs no auth. Only the property NAME is a value — the
#                     credential is fetched by ESO in-cluster and never passes
#                     through the values chain.
npm:
  privateScopes:
    - scope: simetrixch
      registry: https://npm.pkg.github.com
      authProperty: pat

# Post-DNAT API-server egress pinhole for the BUMP pod only (second
# NetworkPolicy in templates/networkpolicy.yaml — the gate-runner
# reportWriter pattern): the bump's last step patches the unit's own
# Applications for the argo-sync, and Calico evaluates egress AFTER kube-proxy
# DNAT, so kubernetes.default.svc resolves to the node's apiserver endpoint
# inside the fenced private ranges. Default admits the 10/8 range on the usual
# apiserver ports; tighten to <nodeIP>/32 + the one real port (microk8s:
# 16443) on an install branch if desired.
bump:
  apiServer:
    cidr: 10.0.0.0/8
    ports:
      - 443
      - 6443
      - 16443
