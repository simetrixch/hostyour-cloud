app:
  # All env vars — Helm array-replaces (no merge with values-common.yaml `env`).
  # DBGate reads CONNECTIONS and materializes each connection
  # from per-connection LABEL_/SERVER_/PORT_/ENGINE_/USER_/PASSWORD_/URL_ vars.
  # Credentials come from Vault via the dbgate-db-credentials secret (see externalSecret below).
  env:
    # Disable DBGate's own login/JWT auth — the Authentik forwardAuth gate
    # at the ingress layer handles all access control. Without this, DBGate
    # 7.x shows its own login page AND rejects the UI's API calls with
    # "jwt malformed" because there's no valid DBGate session token.
    - name: SKIP_ALL_AUTH
      value: "true"
    - name: CONNECTIONS
      value: "mongo,redis"
    # --- MongoDB ---
    - name: LABEL_mongo
      value: "MongoDB (TEST)"
    - name: ENGINE_mongo
      value: "mongo@dbgate-plugin-mongo"
    # In-house mongodb-test: SCRAM auth is ON (--auth + --keyFile). DBGate
    # connects as the `root` SCRAM user (authSource=admin) so it can browse
    # every database. The password is injected from the dbgate-db-credentials
    # Secret via Kubernetes' native $(VAR) env expansion — MONGO_ROOT_PW MUST
    # be declared BEFORE URL_mongo for the expansion to resolve. The root
    # password is alphanumeric (URL-safe); if it ever gains URL-reserved
    # characters it must be percent-encoded here. The URL form keeps
    # ?replicaSet=rs0 so the driver follows the PRIMARY across elections.
    - name: MONGO_ROOT_PW
      valueFrom:
        secretKeyRef:
          name: dbgate-db-credentials
          key: mongodb-password
    - name: URL_mongo
      value: "mongodb://root:$(MONGO_ROOT_PW)@mongodb-test-headless.mongodb.svc.cluster.local:27017/?replicaSet=rs0&authSource=admin"
    # --- Redis (no password: REDIS_AUTH_ENABLED=false in cluster config) ---
    - name: LABEL_redis
      value: "Redis (TEST)"
    - name: ENGINE_redis
      value: "redis@dbgate-plugin-redis"
    - name: URL_redis
      value: "redis://redis-test.redis.svc.cluster.local:6379"
    # --- PostgreSQL ---
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

# Per-namespace SecretStore (visible as an ArgoCD-managed resource).
secret-store: {}

# ExternalSecret — DB passwords injected into the DBGate pod env vars
# (via valueFrom.secretKeyRef above).
externalsecret-db:
  externalSecret:
    enabled: true
    name: dbgate-db-credentials
    namespace: dbgate
    secretStoreKind: SecretStore
    targetSecretName: dbgate-db-credentials
    # No chart-level vaultPath: each entry REFERENCES the real DB's Vault path
    # (per-data vaultPath override, see charts/external-secret templates/externalsecret.yaml)
    # so there is no duplicated copy of the passwords under app/dbgate.
    data:
      - secretKey: mongodb-password
        vaultPath: test/app/mongodb
        property: mongodb-root-password
