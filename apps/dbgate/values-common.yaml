# DBGate — unified web UI for MongoDB, Redis, and PostgreSQL.
# Access is gated by the Authentik forwardAuth Middleware at the ingress
# (public FQDN gate.<domain>) — dbgate has no login of its own.
# All connections are baked in via env vars → zero-click UX after login.
# All connection passwords are pulled from Vault via ExternalSecret (vault-backend SecretStore).
app:
  image:
    repository: dbgate/dbgate
    tag: "7.2.3"
    pullPolicy: IfNotPresent
  replicas: 1
  containerPort: 3000
  service:
    enabled: true
    type: ClusterIP
    port: 3000
  # DBGate data dir — persists saved queries / last-opened tabs across pod restarts.
  volumeMounts:
    - name: dbgate-data
      mountPath: /root/.dbgate
  volumes:
    - name: dbgate-data
      persistentVolumeClaim:
        claimName: dbgate-data
  # Probes — DBGate root path returns 200 when up.
  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 30
    periodSeconds: 15
  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

pvc:
  pvc:
    enabled: true
    name: dbgate-data
    # No Prune/Delete protection: toggling dbgate off is allowed to delete its
    # data (operator decision — selective per-host deploy cleans up fully).
    # storageClassName omitted — falls back to .Values.global.storageClass
    # (platform/values-common.yaml: microk8s-hostpath).
    accessModes:
      - ReadWriteOnce
    storageSize: "1Gi"

# Ingress — env-derived hostname, Service name, and TLS Secret name composed
# from .Values.global.env + .Values.global.domain via Helm `tpl`. The ingress
# chart's templates apply tpl to `host`, `paths[].serviceName`, and
# `tls.secretName` — see charts/ingress/templates/ingress.yaml.
# cert-manager.io/cluster-issuer is auto-applied from .Values.global.clusterIssuer.
ingress:
  ingress:
    enabled: true
    className: public
    annotations:
      # Auth gate: the Authentik forwardAuth Middleware (`forwardauth` in
      # ns `idp`, referenced cross-namespace — Traefik runs with
      # allowCrossNamespace=true). dbgate itself has no built-in auth
      # (SKIP_ALL_AUTH=true), so this annotation IS the gate.
      traefik.ingress.kubernetes.io/router.middlewares: idp-forwardauth@kubernetescrd
    host: 'gate.{{ .Values.global.domain }}'
    paths:
      - path: /
        pathType: Prefix
        serviceName: 'dbgate-{{ .Values.global.env }}-app'
        servicePort: 3000
    tls:
      enabled: true
      secretName: 'dbgate-{{ .Values.global.env }}-tls'

# The IdP-bundled Postgres connection is DEV-only (only values-dev.yaml adds
# idp_postgres to CONNECTIONS). The chart-of-charts default would be
# enabled=true, which on TEST/PROD rendered an empty junk ExternalSecret
# (no name, no vaultPath, no data) — disable here; values-dev.yaml flips
# it back on with the full config.
externalsecret-idp-db:
  externalSecret:
    enabled: false

