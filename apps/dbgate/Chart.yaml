apiVersion: v2
name: dbgate
# 3.0.0 — BREAKING vs 2.0.0, and it undoes what 2.0.0 was. 2.0.0 was a per-slave
# render standing ON THE MASTER (slaves/dbgate), reached at gate-<name>.<master>,
# dialling a slave's databases at the slave's own address. That only worked if the
# slave published mongodb and redis outside its cluster, which hostyour-cloud#66
# refused. 3.0.0 is a platform application again: one release per cluster whose
# role is `slave`, in a `dbgate` namespace of THAT cluster, dialling the two
# databases by their in-cluster Service names. Nothing upgrades in place.
version: 3.0.0
appVersion: "7.2.3"
description: |
  DBGate — one web browser over the mongodb and redis of the cluster it runs in.

  WHY IT STANDS BESIDE ITS DATABASES. No application of this platform has its
  database in another cluster. dbgate has no cluster picker — its connections are
  environment variables baked into the pod — so an instance shows exactly one
  cluster's databases, and the only placement that satisfies the law in every case
  is the cluster those databases run in. app.yaml therefore carries the same
  `runsOn: slave` apps/mongodb/app.yaml and apps/redis/app.yaml carry, and the app
  generator (argocd/apps/applicationset.yaml) places all three together. Where a
  slave stands on the master's own server the three land on that one cluster; where
  it stands on a machine of its own they land on that one. One rendering, both cases.

  BOTH CONNECTIONS AUTHENTICATE. mongod runs with SCRAM (--auth) and redis with
  --requirepass, so dbgate dials each as that service's own admin user — `root` on
  mongo, `default` on redis — out of the two Secrets the ExternalSecrets below
  materialize. It has to be the admin user on both: a browser shows every database
  and every key, which is exactly what a per-claim credential is bounded away from.

  ITS INGRESS IS OFF, AND THE REASON IS IN values-common.yaml. dbgate runs with
  SKIP_ALL_AUTH, so the gate is whatever stands in front of it. This platform has
  TWO such mechanisms, and neither is available here yet: the Traefik forwardAuth
  Middleware in namespace `idp`, installed by a program that declares
  `roles: [master]`, so a cluster whose role is `slave` has no such namespace; and
  the namespace-local basicAuth Middleware charts/middleware renders, which
  apps/observability already uses and which a slave COULD carry — but no
  `vault_kv_entry` row writes this app's users, so a reader for it would turn
  external-secret-reach red. Until one of the two stands, an Ingress rendered here
  would publish a root-credentialed database browser with nothing asking who is
  calling.
type: application
dependencies:
  - name: deployment
    version: 1.0.0
    repository: file://../../charts/deployment
    alias: app

  # The public host, off until there is a gate to put in front of it — see
  # values-common.yaml, which states what has to exist before it goes on.
  - name: ingress
    version: 1.0.0
    repository: file://../../charts/ingress

  # Saved queries and last-opened tabs across pod restarts.
  - name: pvc
    version: 1.0.0
    repository: file://../../charts/pvc

  # The mongod root password, out of Vault <stage>/app/mongodb.
  - name: external-secret
    version: 1.0.0
    repository: file://../../charts/external-secret
    alias: externalsecret-db

  # The redis `default` user's password, out of Vault <stage>/app/redis. A SECOND
  # ExternalSecret rather than a second data entry on the one above: the two stand
  # at different Vault paths, and a chart-level vaultPath is one path per
  # ExternalSecret. Same shape apps/registry uses for its two.
  - name: external-secret
    version: 1.0.0
    repository: file://../../charts/external-secret
    alias: externalsecret-redis

  # Per-namespace ESO SecretStore (vault-backend) — required so the two
  # ExternalSecrets above can authenticate to Vault from THIS namespace. Requires
  # `dbgate` in Vault's external-secrets role bound_service_account_namespaces,
  # which the installation's register-slave program writes for a slave and
  # deploy-gitops for a master; this chart does not add it.
  - name: secret-store
    version: 1.0.0
    repository: file://../../charts/secret-store

  # Shared named templates (common.labels etc.) used by every library chart above.
  # Declared at APP level because Helm doesn't vendor nested file:// deps — see
  # charts/common/Chart.yaml for the consumption rule.
  - name: common
    version: 1.0.0
    repository: file://../../charts/common
