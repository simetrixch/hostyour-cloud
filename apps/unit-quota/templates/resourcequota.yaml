{{- /*
The unit's ceiling. ONE ResourceQuota over the whole namespace — not one per
workload — because the namespace IS the unit: a consumer's namespace holds its
chart plus, when it claims postgresql, its own database; a tenant member's holds
that member's charts. What the unit may take is a property of the unit, so it is
stated once.

EVERY FIGURE IS `required`. The values.yaml header says why there is no default:
a number nobody chose is worse than a render that stops.

The four resource figures carry a factor of two over the steady state, and that is
not headroom, it is arithmetic: charts/deployment/values.yaml is `replicas: 1` with
the default RollingUpdate strategy, whose maxSurge rounds UP to 1 — so during every
deploy the old pod and the new one exist at once and both count against this quota.
A quota that fits the steady state exactly does not slow a deploy down, it deadlocks
it, and the restart-workloads run with it.
*/ -}}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: unit-quota
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: unit-quota
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  hard:
    requests.cpu: {{ required "quota.requestsCpu is required — the unit's registration states it, resolved by the Controller from its size table" .Values.quota.requestsCpu | quote }}
    requests.memory: {{ required "quota.requestsMemory is required — the unit's registration states it, resolved by the Controller from its size table" .Values.quota.requestsMemory | quote }}
    limits.cpu: {{ required "quota.limitsCpu is required — the unit's registration states it, resolved by the Controller from its size table" .Values.quota.limitsCpu | quote }}
    limits.memory: {{ required "quota.limitsMemory is required — the unit's registration states it, resolved by the Controller from its size table" .Values.quota.limitsMemory | quote }}
    count/pods: {{ required "quota.pods is required — the unit's registration states it, resolved by the Controller from its size table" .Values.quota.pods | quote }}
    persistentvolumeclaims: {{ required "quota.persistentVolumeClaims is required — the unit's registration states it, resolved by the Controller from its size table" .Values.quota.persistentVolumeClaims | quote }}
