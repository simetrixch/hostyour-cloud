# WHO MAY OPEN :6379 AT ALL, and it is the FIRST of two boundaries. Redis now runs
# with --requirepass (values-common.yaml, redis.args), so reaching the port is no
# longer the grant it was — but a password is a second boundary and never a
# replacement for the first, so THIS POLICY IS UNCHANGED and stays as narrow as it
# was written: it must not admit the blanket db-consumer label every unit namespace
# carries. Admitted: platform namespaces by name (global.dbConsumerNamespaces),
# namespaces carrying the REDIS-specific global.redisConsumerLabel=true — stamped
# where the registration claims `redis` in services[] (consumers-appset
# templatePatch), where a tenant member's own registration carries the label, and on
# the service-provisioner's own namespace, which has to reach the port to write each
# claim's ACL user — the ingress controller (below), and same-namespace pods (metrics
# exporter). Any other workload is denied. Calico-enforced.
#
# From OUTSIDE this cluster, what decides who can reach the port is the address the
# entry point of templates/ingressroutetcp.yaml is bound to and the machine's own
# firewall, and neither of those is stated in this repository.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-allow-internal
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.global.dbConsumerNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
        {{- with .Values.global.redisConsumerLabel }}
        - namespaceSelector:
            matchLabels:
              {{ . }}: "true"
        {{- end }}
        # THE INGRESS CONTROLLER, and it is the second half of
        # templates/ingressroutetcp.yaml. Every connection that arrives from
        # outside this cluster is opened by a Traefik pod in this namespace, so
        # without this rule the route is admitted by the controller and refused
        # by Calico — which, from the client's side, is indistinguishable from
        # an entry point nobody ever declared.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.global.ingressNamespace | quote }}
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 6379
