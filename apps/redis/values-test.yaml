redis-data:
  pvc:
    storageSize: "10Gi"

redis:
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 6Gi

prometheus-redis-exporter:
  redisAddress: redis://redis-test.redis.svc.cluster.local:6379

# Per-namespace SecretStore — Vault URL falls back to global.vaultUrl, written
# by StampClusterProfile into installation/profile.yaml from the cluster map.
secret-store: {}

# redis-credentials ExternalSecret — reads Vault path test/app/redis.
externalsecret-redis:
  externalSecret:
    vaultPath: test/app/redis
