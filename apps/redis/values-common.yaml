# Redis cache — official `redis` image on charts/deployment. Standalone, AOF,
# no auth: templates/networkpolicy.yaml is what says who may open :6379, and
# templates/ingressroutetcp.yaml NAMES a plain-TCP entry point for that port
# (tailnetEntryPoint below). No such entry point is carried yet — deploy-cluster.yaml
# patches the controller with `ports: []` — so the route is dropped by the controller
# and the port answers nothing. Per-env storage / resources in values-{dev,test,prod}.
redis:
  image:
    repository: redis
    # Managed centrally in platform/versions.yaml (images.redis) and stamped by
    # the version sync — do not hand-edit this tag.
    tag: "8.8"
    pullPolicy: IfNotPresent
  replicas: 1
  containerPort: 6379
  # Single ReadWriteOnce data PVC → two pods must never coexist.
  strategy:
    type: Recreate
  terminationGracePeriodSeconds: 30
  # The official redis image runs as uid/gid 999 (the `redis` user).
  podSecurityContext:
    fsGroup: 999
  containerSecurityContext:
    runAsUser: 999
    runAsNonRoot: true
  # AOF durability (appendfsync everysec), data dir on the PVC.
  args:
    - redis-server
    - --appendonly
    - "yes"
    - --appendfsync
    - everysec
    - --dir
    - /data
  volumeMounts:
    - name: data
      mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: redis-data
  livenessProbe:
    exec:
      command: ["redis-cli", "ping"]
    initialDelaySeconds: 20
    periodSeconds: 15
    timeoutSeconds: 5
  readinessProbe:
    exec:
      command: ["redis-cli", "ping"]
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
  service:
    enabled: true
    type: ClusterIP
    port: 6379

# HOW THIS CACHE IS REACHED FROM OUTSIDE THE CLUSTER IT RUNS IN, and the name
# is the whole of what this repository can say about it.
#
# templates/ingressroutetcp.yaml binds the Service above to the ingress
# controller's plain-TCP entry point of this name. An entry point is STATIC
# configuration of the controller — an argument on the controller's own
# container, plus the port the address in that argument names, published on the
# machine — so NOTHING in this repository can create one. The deploy program's
# patch_container_arguments_and_ports row over daemonset/traefik
# (ansiwise/programs/deploy-cluster.yaml in the installation repository) is the
# only writer of either half, and the address it binds is what decides which of
# the machine's addresses the port answers on.
#
# REDIS RUNS WITHOUT AUTHENTICATION — the args above carry no requirepass — so
# whoever reaches this port reads every key and may FLUSHALL. Inside the
# cluster the NetworkPolicy is what says who may; outside it, the address the
# entry point is bound to and the machine's own firewall are, and neither of
# those is stated anywhere in this repository.
tailnetEntryPoint: redis

# Data PVC. Redis is a cache — toggle-off is ALLOWED to delete it (operator
# decision: only postgresql + mongodb keep delete-protection).
redis-data:
  pvc:
    enabled: true
    name: redis-data
    accessModes:
      - ReadWriteOnce
    # storageSize set per-env in values-{dev,test,prod}.yaml.

# Redis alert rules. Metrics (redis_*) come from the redis exporter, wired as a
# follow-up; until then these rules stay dormant.
monitoring:
  prometheusRules:
    redis:
      enabled: true
      groups:
        - name: redis
          interval: 60s
          rules:
            - alert: RedisDown
              expr: redis_up == 0
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: "Redis instance {{ $labels.instance }} is down"

            - alert: RedisEvictionsSpiking
              expr: rate(redis_evicted_keys_total[5m]) > 10
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "Redis evicting keys at > 10/s"

# Metrics exporter — emits redis_* metrics (the alerts above need it). The
# address is per-env (values-{dev,test,prod}); no auth.
prometheus-redis-exporter:
  serviceMonitor:
    enabled: true
    labels:
      release: observability
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
