{{- /*
The REPO credential for this slave's ArgoCD instance (D5) — the instance that runs in
its own namespace ON THE MASTER: GITOPS_REPO_READ_PAT, so it
can sync the PRIVATE monorepo (the slave's install branch). Same discovery
mechanism as the cluster: a Secret labeled
`argocd.argoproj.io/secret-type: repository` in the instance's namespace.
This instance only ever SYNCS — it reads the install branch and applies it, and
commits nothing — so it receives GITOPS_REPO_READ_PAT (Contents: read), never the
write-capable GITOPS_REPO_PAT the Controller commits with. The write token stays in
the system tier and reaches no namespace that does not write.

Provenance: GITOPS_REPO_READ_PAT is seeded at secret/<stage>/system/argocd/repo-read-pat
from the operator's own secrets — which the master's ESO CANNOT read (its policy
covers app/* + slaves/* only). Adding a slave therefore copies it into the
slaves tier. Contract (REQUIRED at that path):
  pat   the fine-grained PAT for this repo, Contents:READ — no write scope at all
The username is a constant (repo.username) exactly like the bootstrap's
repo credential.
*/ -}}
{{- $name := required "slave.name is required (pointer-file field name)" .Values.slave.name }}
{{- $vaultKey := printf "%s/slaves/%s/repo-pat" (required "slave.stage is required (injected by slaves-appset.yaml)" .Values.slave.stage) $name }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-platform
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  # No periodic read of Vault — the platform-wide delivery rule (charts/external-secret
  # carries the full statement of it). Putting a NEW PAT in front of ArgoCD:
  # update Vault and add the slave again, then DELETE the target Secret
  # `kubectl -n argocd delete secret repo-platform` — OnChange creates it again
  # from Vault. No pod roll: ArgoCD reads this Secret on every use.
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: {{ .Values.global.secretStoreName }}
    kind: SecretStore
  target:
    name: repo-platform
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          # THE label that makes this ArgoCD treat the Secret as a repo credential.
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: {{ .Values.repo.url }}
        username: {{ .Values.repo.username }}
        password: "{{ `{{ .pat }}` }}"
  data:
    # Every defaulted remoteRef field emitted explicitly so ArgoCD sees no
    # server-side drift (same convention as charts/external-secret).
    - secretKey: pat
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        key: {{ $vaultKey }}
        property: pat
