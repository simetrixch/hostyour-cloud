{{- /*
Image-pull dockerconfigjson for Zot, from the shared app-tier registry secret
secret/<stage>/app/registry (same source as apps/manager). Rendered as a
kubernetes.io/dockerconfigjson Secret that pipeline-sa lists under
imagePullSecrets — Tekton attaches the SA's pull secrets to every TaskRun
pod, so the gate step can pull the gate-runner image from the platform registry
without any pod-side credential handling.

NOTE: ESO's login from THIS namespace requires Vault's `external-secrets`
role to bind ns gate-runner — it stands on the cross-tier ESO consumer list the
cluster is seeded with (gate-runner reads app/registry like service-provisioner
does).
*/ -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gate-runner-registry-pull
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: gate-runner
spec:
  # No periodic read of Vault — the platform-wide delivery rule, stated in full in
  # hostyour-cloud charts/external-secret/templates/externalsecret.yaml: a secret
  # arrives on DEPLOY (OnChange re-syncs when this CR changes) and on target-Secret
  # DELETION (OnChange creates it when absent), never on a timer. So putting a NEW
  # value in front of the pods is three acts: write it into Vault, delete the target
  # Secret so ESO fetches it, roll the pods (the restart-workloads run).
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: {{ .Values.global.secretStoreName }}
    kind: SecretStore
  target:
    name: gate-runner-registry-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: {{ printf "%s/app/registry" .Values.global.env }}
        property: pull-dockerconfigjson
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
