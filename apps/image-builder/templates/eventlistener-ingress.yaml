{{- if and .Values.eventListener.enabled .Values.eventListener.ingress.enabled }}
{{- /*
Public Ingress for the EventListener. The host is composed at chart render
time from platform globals:
    <subdomain>.<domain>     (e.g. build.dev.<your-domain>)

cert-manager issues the TLS cert via the platform's global ClusterIssuer.
One path, /github — the deploy-request Trigger is the single webhook entry
point, and GitHub is the platform's git host. The backend Service is
`el-image-builder` (Tekton's controller names it `el-` + EventListener name).
*/ -}}
{{- $host := printf "%s.%s" .Values.eventListener.ingress.subdomain .Values.global.domain }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: image-builder-eventlistener
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: image-builder
    app.kubernetes.io/component: eventlistener-ingress
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.global.clusterIssuer | quote }}
spec:
  ingressClassName: public
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: image-builder-eventlistener-tls
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /github
            pathType: Prefix
            backend:
              service:
                name: el-image-builder
                port:
                  number: 8080
{{- end }}
