{{- /*
credential-scan — runs gitleaks across the cloned source. Fails the
PipelineRun on any leaked secret.

A PLATFORM BASE CONFIG is always in force, and the consumer's optional
`.gitleaks.toml` extends it. Without the base, every consumer that follows the
standard ESO pattern failed its own release on a false positive: an
ExternalSecret or SecretStore template only NAMES a Vault path (secretStoreRef +
remoteRef) and holds no secret value, but gitleaks' `kubernetes-secret-yaml`
rule reads the shape and reports a leak. Each consumer then had to allowlist
the same pattern in its own repo, which is one platform rule copied into every
customer's tree — and one they must know to write before their first release
can pass.

The base is the allowlist for declarative Vault REFERENCES and nothing else.
Everything gitleaks refuses by default stays refused.
*/ -}}
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: credential-scan
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: image-builder
    app.kubernetes.io/component: task
spec:
  description: Scan the source tree for leaked credentials with gitleaks.
  workspaces:
    - name: source
  steps:
    - name: gitleaks
      image: zricethezav/gitleaks:v8.21.2
      workingDir: /workspace/source
      script: |
        #!/usr/bin/env sh
        set -eu

        # The base always applies. gitleaks' [extend] takes exactly ONE parent, so the
        # config is composed here rather than asking the consumer to extend a path it
        # cannot know: with a repo config the base extends THAT (which in turn extends
        # gitleaks' defaults, or replaces them if the repo says so); without one the
        # base extends the defaults directly.
        BASE=/tmp/gitleaks-platform.toml
        if [ -f /workspace/source/.gitleaks.toml ]; then
          echo "platform base, extended by the consumer's own .gitleaks.toml"
          PARENT='path = "/workspace/source/.gitleaks.toml"'
        else
          echo "platform base, extending gitleaks' own default rules"
          PARENT="useDefault = true"
        fi
        # An ExternalSecret/SecretStore template states WHERE a value lives, never the
        # value: secretStoreRef names the store, remoteRef the Vault key, and ESO
        # materializes the Secret in the cluster. Matching gitleaks' secret-yaml rule on
        # that shape is a false positive by construction, and the same one in every
        # consumer that uses the platform's own secret mechanism.
        #
        # The two file names are the ones a consumer's chart is set up with —
        # deploy/chart/templates/{externalsecret,secretstore}.yaml — and a consumer
        # that renames them is reported, which is why the names are documented as a
        # precondition of onboarding rather than left to be discovered here. They are
        # widened by an optional hyphen and a suffix so a consumer that splits them per
        # secret (externalsecret-npmrc.yaml) is covered too. The allowlist is by PATH:
        # a repo that puts a real credential in a file of that name is still telling
        # gitleaks it is a declarative reference, which is why the names are narrow and
        # anchored under templates/.
        {
          echo "[extend]"
          echo "$PARENT"
          echo ""
          echo "[allowlist]"
          echo "description = \"Declarative Vault references: an ExternalSecret/SecretStore template names a path, it carries no secret\""
          echo "paths = ["
          echo "  '''templates/external-?secret.*[.]ya?ml\$''',"
          echo "  '''templates/secret-?store.*[.]ya?ml\$''',"
          echo "]"
        } > "$BASE"
        CONFIG_FLAG="--config=$BASE"

        echo "Running gitleaks against /workspace/source"
        # shellcheck disable=SC2086
        gitleaks detect \
          --source=/workspace/source \
          --no-banner \
          --redact \
          --exit-code=1 \
          $CONFIG_FLAG
      computeResources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
