# The path from outside this cluster to :27017, and it is one of TWO halves.
#
# This object is the ROUTE: it tells the ingress controller that whatever
# arrives on the plain-TCP entry point named in values-common.yaml
# (tailnetEntryPoint) belongs to the Service below. The other half is the entry
# point itself, which is static configuration of the controller and which
# nothing in this repository can create — see that value for who writes it and
# to which address it is bound.
#
# HostSNI(`*`) IS THE ONLY MATCH A PLAIN-TCP ROUTER CAN CARRY HERE. A TCP router
# matches on the server name a client offers in a TLS handshake, and a client
# speaking the MongoDB wire protocol offers no handshake at all. `*` is what
# Traefik requires to be written for a router that reads no SNI, so exactly one
# route may stand on this entry point: every connection that arrives on it
# matches this one.
#
# WHAT A CLIENT STILL HAS TO PRESENT. The database runs with SCRAM
# authentication (values-common.yaml, `--auth` in mongodb.args), so reaching
# the port grants nothing on its own — a connection still authenticates as a
# user the service provisioner created. This route changes WHERE the port can
# be reached from, not what reaching it is worth.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: mongodb-{{ .Values.global.env }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  entryPoints:
    - {{ .Values.tailnetEntryPoint }}
  routes:
    - match: HostSNI(`*`)
      services:
        # The stable ClusterIP seed Service (templates/service.yaml). A client
        # that follows the replica set from here is redirected to the per-pod
        # headless names, which resolve only inside the cluster — so a client
        # arriving through this route connects directly (directConnection=true)
        # and talks to whichever member the Service picked.
        - name: mongodb-{{ .Values.global.env }}
          port: {{ .Values.mongodb.containerPort }}
