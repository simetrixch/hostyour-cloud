# The manager — the standalone hostyour-cloud control product (separate repo
# `hostyourmanager`), deployed as a first-class platform app by the platform
# ApplicationSet (namespace `manager`, AppProject `services`, Application
# sync-wave 40 = installs LAST, "on top" of the platform). Native OIDC against
# the platform IdP; hostnames and URLs are composed from .Values.global.env +
# .Values.global.domain in the templates (Deployment and the ingress library
# chart), so there is nothing env-specific here.
#
# PROVIDER-ONLY: like the build plane (registry/tekton/image-builder), the
# manager runs only where the registry runs locally. master default is
# cluster/apps/manager.yaml deploy:"false"; the control-host install branch
# flips it to "true" (same toggle pattern — see cluster/README.md).
#
# The manager image pin lives in values-{dev,test,prod}.yaml as the ONE pin
# grammar builds[]{name,image,tag} — `image` is the FLAT build name
# (`manager`, no registry path to compose), and the full ref renders via
# common.buildImage from common.registryHost. The release bump searches
# apps/<app>/values-<stage>.yaml for exactly this grammar and writes the tag;
# the cluster release delivers the bumped master to running clusters.
replicas: 1

# registry-reaper — the periodic CronJob (templates/reaper-cronjob.yaml) that
# prunes aged, UNREFERENCED image tags of OUR flat, single-segment repos from
# the central zot registry. Its keep floor is the release bump's search space
# (the builds[] pins in every values-<stage>.yaml carrier — see the CronJob
# header). It runs THIS manager image + code (server/jobs/registry-reaper.ts)
# and reuses the manager-github write-pat + manager-registry-pull +
# manager-app secrets that already live in this namespace, plus the
# tenant catalog read PAT (externalsecret-deploy-repo-pat.yaml). Rendered only
# on the control/build host: gated on master.sshUser (the same toggle that
# materializes manager-github) AND github.repo.
#
# SAFETY: dryRun defaults to "true" — the reaper only OBSERVES + LOGS, deletes
# NOTHING. The entrypoint deletes ONLY when DRY_RUN is EXACTLY "false". ARM it later
# (owner) by setting reaper.dryRun: "false" once the dry-run logs confirm the
# keep/delete plan is correct. zot's own retention never touches the
# single-segment repos (the ["*"] keep-all policy in
# apps/registry/values-common.yaml) — the reaper is the sole cleaner there.
reaper:
  enabled: true
  # Nightly, off-peak. concurrencyPolicy: Forbid means a long run never overlaps
  # the next tick.
  schedule: "17 3 * * *"
  # "true" = observe only (default, SAFE). Set to "false" to ARM deletion —
  # nothing else changes.
  dryRun: "true"
  # Hard ceiling for one run (it scans every install branch's pointers); the Job
  # fails if exceeded.
  activeDeadlineSeconds: 900

# Run the manager pod on the node's host network so it can SSH to the clusters
# on the physical LAN. This is REQUIRED whenever the MicroK8s pod CIDR
# (default 10.1.0.0/16) overlaps the cluster LAN: a slave on 10.1.1.0/24 then
# looks like a pod IP from inside a pod, so Calico routes it into the overlay
# and the SSH connection times out instead of reaching the machine. Default on
# because reaching the clusters is the manager's whole job; the ingress path is
# unaffected (a pod can reach the node IP, so Traefik still reaches the pod).
# Set false only on a cluster whose pod CIDR cannot overlap the cluster LAN.
hostNetwork: true

# OIDC group required for access (config.ts ADMINS_GROUP, default "admins").
adminsGroup: admins

# GitHub access for the Branches view + the Reset wizard (config.ts GITHUB_REPO +
# GITHUB_WRITE_PAT). `repo` is the "owner/repo" of THIS GitOps monorepo — the same
# repo apps/slave/values-common.yaml `repo.url` points at, just in owner/repo form
# (not a secret). The write-capable token is GITOPS_REPO_PAT (Contents:RW), placed on the
# isolated manager-host Vault tier and materialized by manager-host-secret.yaml as
# the pod env GITHUB_WRITE_PAT — NEVER a Helm value. Both render only where master.sshUser
# is set (the control host,
# the only place the manager runs) AND repo is non-empty. Blank `repo` ⇒ the feature
# is off and the routes answer 501 (no half-enabled state). Both-or-neither is enforced
# in config.ts: when repo is set the deployment injects BOTH env vars.
github:
  repo: "simetrixch/hostyour-cloud"
  # The tenant CATALOG the registry-reaper's floor also searches
  # (reaper-cronjob.yaml CATALOG_REPO). EMPTY here on purpose: which
  # repository it is, is installation state — cluster/profile.yaml carries it as
  # global.catalogRepo and loads LAST, and the template falls back to that with a
  # `required` on it, so a branch naming no catalog fails its render instead of
  # starting a reaper whose floor cannot see the catalog's pins.
  # NOTHING HOLDS THIS KEY IN PLACE. `default` reads an absent key and an empty
  # string alike, so removing the line renders the identical CronJob, and the
  # render check never reaches the line at all: the CronJob stands behind
  # master.sshUser, which is on an install branch only. What the key states is
  # where the override goes — an installation pointing THIS app at another
  # catalog sets deployRepo in cluster/values/manager.yaml, which
  # argocd/<stage>/apps/applicationset.yaml loads after this file.
  deployRepo: ""

# Consumer onboarding (config.ts, onboarding.md §6). Chart validation runs as an in-cluster
# `gate-run` Tekton PipelineRun in the locked-down `gate-runner` namespace (apps/gate-runner) —
# NOT a host Quadlet. The manager dispatches the run + reads the report ConfigMap over its POD
# SERVICEACCOUNT (grants shipped with this chart, templates/rbac.yaml); no host loopback, no podman, no kubeconfig.
#
# The gate's product settings. The two keys that name THIS machine —
# gatemanagerAddr (whose emptiness switches consumer onboarding off entirely) and
# gateFenceMustFail — are NOT here: they stand in cluster/values/manager.yaml, which the
# operator edits on the install branch. Kube access is IN-CLUSTER via the pod ServiceAccount
# (grants shipped with this chart, templates/rbac.yaml — no Vault kubeconfig, nothing to seed).
onboarding:
  # The one egress the gate pod MUST reach (the pipeline clones from github through the fence).
  gateMustPass: "github.com:443"
  # The kubeconform target minor for the render gate (G3).
  kubeVersion: "1.30.0"

# Master self-registration (server config.ts MASTER_* + boot/seed-master.ts).
# The manager's deploy-slave Run drives the MASTER (this control host) over
# SSH; on a fresh manager DB there is no role=master server row and no key, so
# deploy-slave dies at "no master server registered". Setting master.sshUser TURNS
# ON self-registration: at boot the manager seeds the one role=master row
# (host == global.domain, this cluster's install branch) and seals its self-SSH
# key (materialized by ESO from Vault, where the installer provisions it) so it
# can SSH to its own host — zero manual SQL.
#
# sshUser and lanHost name ONE machine and stand in cluster/values/manager.yaml, which the
# operator edits on the install branch. Empty sshUser means a plain install does NOT
# self-register: none of the MASTER_* env, the key ExternalSecret or the key mount is rendered.
# Only the port is product — every sshd this reaches listens where sshd listens.
master:
  # SSH port of the master's sshd.
  sshPort: 22
  # The promotion tier of the master self-cluster row seed-master.ts seeds for this control host
  # (config.ts MASTER_TIER / clusters.tier). Keep "rehearsal": the crypto gate O-GATE-1 refuses
  # onboarding to a non-rehearsal cluster while the keystore is plaintext, so the control host stays rehearsal
  # until the keystore is hardened. Promotion to "real" is a one-way audited step (R-13).
  tier: "rehearsal"

# pino log level (config.ts LOG_LEVEL): fatal|error|warn|info|debug|trace|silent.
logLevel: info

resources:
  requests:
    cpu: "50m"
    memory: 128Mi
  limits:
    cpu: "500m"
    memory: 384Mi

# Ingress (library chart) — native OIDC, deliberately NO forwardAuth annotation
# (the manager enforces its own session chokepoint, like the old console).
# host / serviceName / tls.secretName are tpl'd from globals; the
# cert-manager.io/cluster-issuer annotation is auto-applied from
# .Values.global.clusterIssuer by the ingress chart.
ingress:
  ingress:
    enabled: true
    className: public
    host: 'manager.{{ .Values.global.domain }}'
    paths:
      - path: /
        pathType: Prefix
        serviceName: manager
        servicePort: 80
    tls:
      enabled: true
      secretName: 'manager-{{ .Values.global.env }}-tls'

# Persistent DATA_DIR (mounted at /data): SQLite manager.db (WAL) + the
# session/credstore metadata live here — LOSS = losing the manager's state,
# so the PVC is delete-protected like the data-tier stores.
# storageClassName omitted — falls back to .Values.global.storageClass.
manager-data:
  pvc:
    enabled: true
    name: manager-data
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
    accessModes:
      - ReadWriteOnce
    storageSize: "2Gi"

# Per-namespace SecretStore (library chart). vaultUrl falls back to
# .Values.global.vaultUrl; role is the app-tier `external-secrets`.
secret-store: {}
