# controller: the app pod runs as this SA. Its projected token (mounted at the
# standard path by the Deployment) is what the manager presents to Vault's
# kubernetes auth (role `manager` — bound to this SA in ns manager) for
# the Vault-backed credential store. Kubernetes RBAC for it stays minimal — see
# templates/rbac.yaml. (external-secrets-sa is created by the secret-store
# library chart.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: manager
