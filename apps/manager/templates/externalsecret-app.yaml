# The manager's own app-tier secrets from secret/<stage>/app/controller:
# OIDC client_secret + the session-sealing key. All four defaulted remoteRef
# fields are emitted explicitly (ESO 2.x defaults them).
#
# The GitHub webhook HMAC secret lives in its OWN ExternalSecret
# (externalsecret-webhook.yaml) so a build-tier read failure can never fail the
# sync of these core auth secrets (OIDC / session).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: manager-app
spec:
  # No periodic read of Vault — the platform-wide delivery rule, stated in full in
  # hostyour-cloud charts/external-secret/templates/externalsecret.yaml: a secret
  # arrives on DEPLOY (OnChange re-syncs when this CR changes) and on target-Secret
  # DELETION (OnChange creates it when absent), never on a timer. So putting a NEW
  # value in front of the pods is three acts: write it into Vault, delete the target
  # Secret so ESO fetches it, roll the pods (the restart-workloads run).
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: manager-app
    creationPolicy: Owner
  data:
    - secretKey: oidc-client-secret
      remoteRef:
        key: {{ printf "%s/app/manager" .Values.global.env }}
        property: oidc-client-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
