# The manager's own app-tier secret: the OIDC client secret, read from
# <stage>/idp/bootstrap — the SAME entry the identity provider is configured from.
#
# ONE VALUE, ONE PLACE. A client secret is agreed between two sides: the provider holds it for the
# client it registered, and the client presents it. Held in two entries they are two values that can
# drift, and what drifts is a login that stops working for a reason neither side reports. It used to
# be read from <stage>/app/manager, which nothing ever wrote — so the pod waited on a Secret that
# could not arrive, and the deployment reported nothing wrong.
#
# All four defaulted remoteRef fields are emitted explicitly. Omitting any of
# them makes the API server fill it in on write, and ArgoCD then reports a
# permanent OutOfSync against a field nobody set.
#
# The GitHub webhook HMAC secret lives in its OWN ExternalSecret
# (externalsecret-webhook.yaml) so a build-tier read failure can never fail the
# sync of this one.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: manager-app
spec:
  # No periodic read of Vault — the platform-wide delivery rule, stated in full in
  # hostyour-cloud charts/external-secret/templates/externalsecret.yaml: a secret
  # arrives on DEPLOY (OnChange re-syncs when this CR changes) and on target-Secret
  # DELETION (OnChange creates it when absent), never on a timer. So putting a NEW
  # value in front of the pods is three acts: write it into Vault, delete the target
  # Secret so ESO fetches it, roll the pods (the restart-workloads run).
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: manager-app
    creationPolicy: Owner
  data:
    - secretKey: oidc-client-secret
      remoteRef:
        key: {{ printf "%s/idp/bootstrap" .Values.global.env }}
        property: controller-client-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
