# The manager's own app-tier secret: the OIDC client secret, read from
# <stage>/app/manager. One entry, and the path is composed on the row below.
#
# All four defaulted remoteRef fields are emitted explicitly. Omitting any of
# them makes the API server fill it in on write, and ArgoCD then reports a
# permanent OutOfSync against a field nobody set.
#
# The GitHub webhook HMAC secret lives in its OWN ExternalSecret
# (externalsecret-webhook.yaml) so a build-tier read failure can never fail the
# sync of this one.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: manager-app
spec:
  # No periodic read of Vault — the platform-wide delivery rule, stated in full in
  # hostyour-cloud charts/external-secret/templates/externalsecret.yaml: a secret
  # arrives on DEPLOY (OnChange re-syncs when this CR changes) and on target-Secret
  # DELETION (OnChange creates it when absent), never on a timer. So putting a NEW
  # value in front of the pods is three acts: write it into Vault, delete the target
  # Secret so ESO fetches it, roll the pods (the restart-workloads run).
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: manager-app
    creationPolicy: Owner
  data:
    - secretKey: oidc-client-secret
      remoteRef:
        key: {{ printf "%s/app/manager" .Values.global.env }}
        property: oidc-client-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    # THE PASSWORD THAT RAISES A COMMAND TO ROOT on the machine this runs on, written into the same
    # entry by the seed. It is here because after an installation stands, the caller of every run on
    # that machine is this workload: it drives the machine's own resident surface, and every program
    # it runs carries rows that need root. A run started with no password is refused before its first
    # step, which is the right shape and also means this has to be readable here.
    - secretKey: sudo-password
      remoteRef:
        key: {{ printf "%s/app/manager" .Values.global.env }}
        property: sudo-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
