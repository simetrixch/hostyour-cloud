{{- if and .Values.reaper.enabled .Values.master.sshUser .Values.github.repo }}
# The tenant CATALOG's read credential for the registry-reaper (reaper-cronjob.yaml).
# The reaper's referenced floor is the same search the release bump runs: it reads
# the catalog's per-chart values-<stage>.yaml on every branch, so it needs
# that repository's PAT — the stage-free secret/build/catalog/repo-pat the
# installer seeds on the build plane. Which repository the catalog is, is this
# installation's own choice, so neither this path nor this comment names one.
# The manager and therefore the reaper run on the build plane, so the LOCAL
# Vault resolves it; the app-tier external-secrets role carries the one extra
# literal read grant for exactly this leaf (policy <cluster>-deploy-pat-read).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: manager-deploy-repo-pat
spec:
  # No periodic read of Vault — the platform-wide delivery rule, stated in full in
  # hostyour-cloud charts/external-secret/templates/externalsecret.yaml: a secret
  # arrives on DEPLOY (OnChange re-syncs when this CR changes) and on target-Secret
  # DELETION (OnChange creates it when absent), never on a timer. So putting a NEW
  # value in front of the pods is three acts: write it into Vault, delete the target
  # Secret so ESO fetches it, roll the pods (the restart-workloads run).
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: manager-deploy-repo-pat
    creationPolicy: Owner
  data:
    - secretKey: pat
      remoteRef:
        key: build/catalog/repo-pat
        property: pat
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
