# The image-pull dockerconfigjson for Zot, from the shared app-tier registry
# secret secret/<stage>/app/registry. Rendered as a kubernetes.io/
# dockerconfigjson Secret the Deployment references via imagePullSecrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: manager-registry-pull
spec:
  # No periodic read of Vault — the platform-wide delivery rule, stated in full in
  # hostyour-cloud charts/external-secret/templates/externalsecret.yaml: a secret
  # arrives on DEPLOY (OnChange re-syncs when this CR changes) and on target-Secret
  # DELETION (OnChange creates it when absent), never on a timer. So putting a NEW
  # value in front of the pods is three acts: write it into Vault, delete the target
  # Secret so ESO fetches it, roll the pods (the restart-workloads run).
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: manager-registry-pull
    creationPolicy: Owner
    # COMPOSED HERE FROM THE TWO ATOMIC VALUES, not read as a finished document. The store used to
    # be asked for `pull-dockerconfigjson`, which nothing ever wrote — so this Secret never
    # materialized and every pod that pulls an image from this installation waited on it. A store
    # holds values; a format belongs to whoever needs that format. Written the way the push
    # credential beside it already was.
    #
    # RAW ESO syntax in the inner braces: Helm renders this file, so the ESO expressions are quoted
    # through to be evaluated by ESO and not here.
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |-
          {"auths":{"{{ include "common.registryHost" . }}":{"username":"{{ `{{ .user }}` }}","password":"{{ `{{ .pass }}` }}","auth":"{{ `{{ printf "%s:%s" .user .pass | b64enc }}` }}"}}}
  data:
    - secretKey: user
      remoteRef:
        key: {{ printf "%s/app/registry" .Values.global.env }}
        property: pull-user
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: pass
      remoteRef:
        key: {{ printf "%s/app/registry" .Values.global.env }}
        property: pull-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
