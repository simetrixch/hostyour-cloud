{{- if and .Values.reaper.enabled .Values.master.sshUser .Values.github.repo }}
# Registry-reaper — the in-cluster PERIODIC cleaner for the central zot registry's own images
# (flat, single-segment repos — one segment, no owner prefix). It runs the CONTROLLER image (same
# image pin as the Deployment — ONE source of truth, so the reaper and the running manager are
# always the same build) and invokes the run-once entrypoint server/jobs/registry-reaper.ts. Its
# referenced safety floor IS the release bump's search space: (a) every registration's
# chartPath values-<stage>.yaml on the unit's deploy/<stage> branch, (b) the catalog's
# charts/<chart>/values-<stage>.yaml on every branch, (c) hostyour-cloud's apps/<app>/values-<stage>.yaml
# on every branch — every builds[]{name,image,tag} pin found there is kept; only aged, unreferenced
# tags fall. zot's own retention deliberately NEVER touches the single-segment repos (the ["*"]
# keep-all policy in apps/registry/values-common.yaml) — the reaper is the SOLE cleaner there;
# zot's 50-count rule only prunes the docker.io pull-through cache repos.
#
# ── SAFETY ─────────────────────────────────────────────────────────────────────────────────────
# Shipped with DRY_RUN="true" (reaper.dryRun): the reaper only OBSERVES + LOGS, deletes NOTHING.
# The entrypoint deletes ONLY when DRY_RUN is EXACTLY "false"; unset/""/"true"/anything else ⇒ a dry
# run, so a missing or garbled flag can never delete by accident. ARM it later (owner) by flipping
# reaper.dryRun to "false" once the dry-run logs confirm the keep/delete plan is correct.
#
# ── WHY THE CONTROLLER NAMESPACE (not registry) ────────────────────────────────────────────────
# The reaper needs, all ALREADY materialized in THIS namespace and nowhere else:
#   (a) GITHUB_WRITE_PAT — the write-capable GITOPS_REPO_PAT lives ONLY here, on the isolated
#       manager-host Vault tier (the role manager-host is bound to ns manager ALONE);
#       materialising it in ns registry would need a new Vault role AND would
#       widen that write PAT's read surface into the build-adjacent registry namespace.
#   (b) manager-registry-pull — the pull secret for the private manager image.
#   (c) OIDC_CLIENT_SECRET (manager-app) — the shared loadConfig() the entrypoint calls validates
#       the FULL manager env schema, so this required-no-default field must be present even though
#       the reaper never serves HTTP.
# The manager app is provider-only gated to the SAME one build/control cluster as the registry
# (cluster/apps/manager.yaml + master.sshUser), so the reaper rides an equivalent gate. It reaches
# zot cross-namespace over common.registryHost — exactly as the manager's own ensure-images
# registry probe (HttpRegistryProbe) already does.
#
# Structure mirrors apps/mongodb/templates/rs-ensure-cronjob.yaml (in-cluster periodic reconciler);
# the securityContext + image ref + base env mirror this app's own Deployment (templates/deployment.yaml).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: registry-reaper
  labels:
    app.kubernetes.io/name: manager
    app.kubernetes.io/component: registry-reaper
spec:
  schedule: {{ .Values.reaper.schedule | quote }}
  # A long run must never overlap the next tick (the branch scan + deletes are not re-entrant).
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ .Values.reaper.activeDeadlineSeconds | default 900 }}
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: manager
            app.kubernetes.io/component: registry-reaper
        spec:
          restartPolicy: OnFailure
          # The reaper talks only to git + the registry over HTTP — it needs NO Kubernetes API, so it
          # runs under the default SA with its token UN-mounted (least privilege; nothing to escalate).
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          # Pull the private manager image from zot — the SAME pull secret the Deployment uses.
          imagePullSecrets:
            - name: manager-registry-pull
          containers:
            - name: registry-reaper
              image: {{ include "common.buildImage" (dict "root" $ "builds" .Values.builds "name" "manager") | quote }}
              imagePullPolicy: Always
              command: ["node", "--import", "tsx", "server/jobs/registry-reaper.ts"]
              env:
                # ── Reaper-specific contract (server/jobs/registry-reaper.ts) ──────────────────────
                # DELETE only on EXACTLY "false"; "true" (default) = observe + log, delete nothing.
                - name: DRY_RUN
                  value: {{ .Values.reaper.dryRun | default "true" | quote }}
                # Where the reaper DELETEs manifests — this cluster's own zot (common.registryHost);
                # the push dockerconfigjson mounted below is keyed to the SAME host so the auth matches.
                - name: REGISTRY_HOST
                  value: {{ include "common.registryHost" . | quote }}
                - name: REGISTRY_PUSH_DOCKERCONFIG
                  value: /etc/manager/registry-push/.dockerconfigjson
                # ── Base manager env the shared loadConfig() REQUIRES (config.ts EnvSchema) ──────
                # The entrypoint calls loadConfig(), which validates the FULL schema — so these
                # required-no-default fields must be present even though the reaper never serves HTTP
                # or does OIDC. Composed exactly like the Deployment (templates/deployment.yaml).
                - name: PUBLIC_URL
                  value: {{ printf "https://manager.%s" .Values.global.domain | quote }}
                - name: OIDC_ISSUER
                  value: {{ printf "https://idp.%s/application/o/manager/" .Values.global.domain | quote }}
                - name: OIDC_CLIENT_ID
                  value: "manager"
                - name: OIDC_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: manager-app
                      key: oidc-client-secret
                - name: CONTROLLER_VERSION
                  value: {{ include "common.buildTag" (dict "builds" .Values.builds "name" "manager") | quote }}
                - name: DATA_DIR
                  value: /data
                - name: LOG_LEVEL
                  value: {{ .Values.logLevel | quote }}
                # ── GitHub access ──────────────────────────────────────────────────────────────────
                # Enumerate install branches + read consumer pointers (READ-only in practice — the
                # reaper never pushes). GITHUB_WRITE_PAT reuses the manager-github write-pat already
                # materialized here; both-or-neither with GITHUB_REPO (config.ts refine).
                - name: GITHUB_REPO
                  value: {{ .Values.github.repo | quote }}
                - name: GITHUB_WRITE_PAT
                  valueFrom:
                    secretKeyRef:
                      name: manager-github
                      key: write-pat
                # The catalog repo — the floor's second carrier class is
                # the CATALOG's charts/<chart>/values-<stage>.yaml on every
                # branch, read with that repository's own PAT
                # (externalsecret-deploy-repo-pat.yaml, from the stage-free
                # secret/build/catalog/repo-pat). Addressed by owner/name because
                # the reaper goes through the GitHub API, not by clone.
                - name: CATALOG_REPO
                  value: {{ .Values.github.deployRepo | default (required "controller: global.catalogRepo is required (cluster/profile.yaml, rendered per install branch from the cluster map's catalog-repo)" .Values.global.catalogRepo) | quote }}
                - name: CATALOG_WRITE_PAT
                  valueFrom:
                    secretKeyRef:
                      name: manager-deploy-repo-pat
                      key: pat
                {{- if .Values.master.sshUser }}
                # ── where this installation keeps its books ────────────────────────────────────────
                # The floor's first carrier class is the consumer registrations, and they stand on the
                # install branch of the cluster holding the master role (server/domains/registry-cleanup/
                # search.ts). The reaper's DATA_DIR is an emptyDir, so its database is empty on every
                # run and there is no inventory row to derive the branch from — the environment is the
                # only statement of it there is, and without one the job exits 1 before it scans
                # anything (fail-closed: nothing is deleted, and nothing is ever pruned either).
                #
                # MASTER_FQDN carries it because in THIS process it reaches exactly one consumer, the
                # books-branch resolution: the reaper never seeds a master row. So it is rendered from
                # global.booksBranch — the role-derived value in cluster/profile.yaml, which names the
                # cluster holding the master role whatever cluster this build plane is. MASTER_SSH_USER
                # and MASTER_STAGE ride along because the config schema requires the three together
                # (server/kernel/config.ts refines); the reaper opens no ssh session.
                - name: MASTER_FQDN
                  value: {{ required "global.booksBranch must be set (cluster/profile.yaml via the $values chain) — the registry reaper cannot say where this installation's registrations stand without it" .Values.global.booksBranch | quote }}
                - name: MASTER_SSH_USER
                  value: {{ .Values.master.sshUser | quote }}
                - name: MASTER_STAGE
                  value: {{ .Values.global.env | quote }}
                {{- end }}
                # Node needs a writable HOME (the root FS is read-only); git also writes config here.
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                # The zot PUSH credential (delete rights) as a dockerconfigjson FILE — the reaper's
                # HttpRegistryMaintenance reads .auths[REGISTRY_HOST].auth for its DELETE calls. A
                # plain directory mount (never subPath) so an ESO resync refreshes it without a restart.
                - name: registry-push
                  mountPath: /etc/manager/registry-push
                  readOnly: true
                # Ephemeral DATA_DIR — the reaper clones the GitOps repo under /data/reaper-git for the
                # branch scan; nothing here persists across runs, so an emptyDir is correct (and it must
                # NOT share the Deployment's single-writer manager-data PVC).
                - name: data
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: registry-push
              secret:
                secretName: registry-reaper-push
                defaultMode: 0440
            - name: data
              emptyDir: {}
            - name: tmp
              emptyDir: {}
{{- end }}
