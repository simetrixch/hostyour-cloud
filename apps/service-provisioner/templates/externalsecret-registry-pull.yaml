{{- if or .Values.registrySource.enabled .Values.global.servicesLocal.registry }}
{{- /*
Materialize the shared registry pull dockerconfigjson from Vault
<env>/app/registry into the service-provisioner namespace, so the `registry`
ServiceClaim backend can copy it into consumer namespaces. Gated on the build
cluster (global.servicesLocal.registry — the ONE cluster running apps/registry),
so it follows the registry to any stage; registrySource.enabled is an extra
manual override. The vault-backend SecretStore comes from the secret-store
dependency (same gate). REQUIRES the service-provisioner namespace bound in the
external-secrets Vault role — otherwise the SecretStore stays
NotReady.
*/ -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-pull-source
  namespace: {{ .Release.Namespace }}
spec:
  # No periodic read of Vault — the platform-wide delivery rule, stated in full in
  # hostyour-cloud charts/external-secret/templates/externalsecret.yaml: a secret
  # arrives on DEPLOY (OnChange re-syncs when this CR changes) and on target-Secret
  # DELETION (OnChange creates it when absent), never on a timer. So putting a NEW
  # value in front of the pods is three acts: write it into Vault, delete the target
  # Secret so ESO fetches it, roll the pods (the restart-workloads run).
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: registry-pull-source
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: {{ printf "%s/app/registry" .Values.global.env }}
        property: pull-dockerconfigjson
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
