{{- /*
The controller pod. Runs the ConfigMap-mounted provisioner.py under the stock
python image the values pin (no custom build) — pip-installs the client libs at boot
then execs the script. Each backend's admin credential is read at runtime from
that backend's own Secret via the controller's cluster-wide secret-read RBAC.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-provisioner
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: service-provisioner
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  revisionHistoryLimit: 3
  replicas: 1
  # Single active controller — never two reconcilers at once (Recreate avoids a
  # brief 2-pod overlap on rollout).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: service-provisioner
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: service-provisioner
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/script: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.controller.serviceAccountName }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: provisioner
          image: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag }}"
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          command:
            - sh
            - -c
            # Pinned deps (W4: reproducible + no unpinned-latest supply-chain
            # surface for the cluster's most secret-privileged controller). A
            # pre-baked image is the harder follow-up; pinning closes the risk.
            - >-
              pip install --no-cache-dir --quiet
              kubernetes==31.0.0 pymongo==4.10.1 psycopg2-binary==2.9.10 redis==5.2.1 &&
              exec python /app/provisioner.py
          env:
            # Non-root pip → --user install; HOME points at the writable emptyDir.
            - name: HOME
              value: /home/app
            - name: ENV
              value: {{ .Values.global.env | quote }}
            - name: POLL_INTERVAL_SECONDS
              value: {{ .Values.controller.pollIntervalSeconds | quote }}
            # --- MongoDB backend ---
            - name: MONGO_HOST
              value: {{ .Values.controller.mongo.host | quote }}
            - name: MONGO_ROOT_USER
              value: {{ .Values.controller.mongo.rootUser | quote }}
            - name: MONGO_AUTH_SOURCE
              value: {{ .Values.controller.mongo.authSource | quote }}
            - name: MONGO_REPLICA_SET
              value: {{ .Values.controller.mongo.replicaSet | quote }}
            - name: MONGO_CREDENTIALS_NAMESPACE
              value: {{ .Values.controller.mongo.credentialsNamespace | quote }}
            - name: MONGO_CREDENTIALS_SECRET
              value: {{ .Values.controller.mongo.credentialsSecret | quote }}
            - name: MONGO_CREDENTIALS_KEY
              value: {{ .Values.controller.mongo.credentialsKey | quote }}
            # Which namespaces may claim extra whitelisted roles (see values-common).
            # Fail-closed: absent/empty ⇒ no namespace may.
            - name: EXTRA_ROLES_NAMESPACES
              value: {{ .Values.controller.mongo.extraRolesNamespaces | default list | join "," | quote }}
            # --- PostgreSQL backend (PER-CONSUMER) ---
            # No PG_HOST / PG_CREDENTIALS_NAMESPACE: postgresql is per-consumer now
            # (per-consumer-postgres.md §5.4, §6), so provisioner.py resolves the host
            # (Service `postgres` in the claim's own namespace) and the admin Secret
            # (postgresql-credentials in that same namespace) from the claim itself.
            # Only the namespace-independent knobs remain.
            - name: PG_PORT
              value: {{ .Values.controller.postgres.port | quote }}
            - name: PG_ADMIN_USER
              value: {{ .Values.controller.postgres.adminUser | quote }}
            - name: PG_CREDENTIALS_SECRET
              value: {{ .Values.controller.postgres.credentialsSecret | quote }}
            - name: PG_CREDENTIALS_KEY
              value: {{ .Values.controller.postgres.credentialsKey | quote }}
            # --- Redis backend ---
            # ONE instance per cluster that runs apps/redis, so the host is a per-stage value the
            # way mongo's is, and the `default` user's password is read at runtime from
            # the admin Secret apps/redis materializes from Vault into its own namespace.
            - name: REDIS_HOST
              value: {{ .Values.controller.redis.host | quote }}
            - name: REDIS_PORT
              value: {{ .Values.controller.redis.port | quote }}
            - name: REDIS_ADMIN_USER
              value: {{ .Values.controller.redis.adminUser | quote }}
            - name: REDIS_CREDENTIALS_NAMESPACE
              value: {{ .Values.controller.redis.credentialsNamespace | quote }}
            - name: REDIS_CREDENTIALS_SECRET
              value: {{ .Values.controller.redis.credentialsSecret | quote }}
            - name: REDIS_CREDENTIALS_KEY
              value: {{ .Values.controller.redis.credentialsKey | quote }}
            # --- Registry backend — source wired on the build cluster (global.servicesLocal.registry), optional elsewhere ---
            - name: REGISTRY_SOURCE_NAMESPACE
              value: {{ .Values.controller.registry.sourceNamespace | quote }}
            - name: REGISTRY_SOURCE_SECRET
              value: {{ .Values.controller.registry.sourceSecret | quote }}
            - name: REGISTRY_SOURCE_KEY
              value: {{ .Values.controller.registry.sourceKey | quote }}
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
            - name: home
              mountPath: /home/app
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
      volumes:
        - name: script
          configMap:
            name: {{ include "service-provisioner.scriptConfigMapName" . }}
        - name: home
          emptyDir: {}
