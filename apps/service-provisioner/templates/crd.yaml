# ServiceClaim — a namespace declares "I need a backing service" (a database,
# a registry pull secret). The service-provisioner
# controller reconciles each claim: it provisions the backing resource
# idempotently and writes a namespace-local credentials Secret, then records the
# result in .status. A consumer's chart ships ServiceClaims; the platform mints
# the credentials — the consumer never sees a backend admin credential.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: serviceclaims.platform.hostyour.cloud
spec:
  group: platform.hostyour.cloud
  scope: Namespaced
  names:
    plural: serviceclaims
    singular: serviceclaim
    kind: ServiceClaim
    shortNames: [svcclaim]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [service]
              properties:
                service:
                  type: string
                  enum: [mongodb, postgresql, redis, registry]
                  description: which backing service to provision credentials for
                databases:
                  type: array
                  items: { type: string }
                  description: >-
                    mongodb/postgresql — the LITERAL database names to create + grant
                    (readWrite / owner). Used VERBATIM (platform DB-name contract): the
                    provisioner creates EXACTLY these names, with no prefix and no
                    composition. The platform controls them — the consumer's
                    deploy/platform.yaml `databases:`, injected into this ServiceClaim
                    as the chart value mongodb.databases — so a claim cannot name a
                    foreign database.
                roles:
                  type: array
                  description: >-
                    mongodb — EXTRA platform-approved role@db grants on top of the
                    per-database readWrite roles. STRICT WHITELIST via this enum
                    (mirrored in the handler's ALLOWED_EXTRA_ROLES): a claim must
                    never be able to self-grant an arbitrary role, so every new
                    value is a deliberate platform decision. May be the ONLY grant
                    (no databases) — e.g. the mongodb exporter's monitoring user.
                    PLATFORM-ONLY: every allowed role is cluster-wide by nature, so
                    the handler also rejects this field unless the claim's namespace
                    is listed in EXTRA_ROLES_NAMESPACES (controller.mongo.extraRolesNamespaces).
                    A consumer/tenant claim setting it gets a clear Error, not a grant.
                  items:
                    type: string
                    enum: [clusterMonitor@admin]
                keyPatterns:
                  type: array
                  items: { type: string }
                  minItems: 1
                  description: >-
                    redis — the LITERAL key patterns the claim's ACL user may touch,
                    each written as redis writes one after `~` (`digita:auth:*`).
                    Used VERBATIM, the same contract spec.databases carries for
                    mongodb/postgresql: the provisioner grants EXACTLY these, with no
                    prefix and no composition, and the platform is what controls the
                    value (the consumer's deploy/platform.yaml, injected into this
                    ServiceClaim as a chart value). REQUIRED for a redis claim and
                    fail-closed — a claim naming none is an Error, never a user that
                    reaches every key. Read back out of the credentials Secret as
                    REDIS_KEY_PATTERNS rather than re-derived by the reader.
                secretName:
                  type: string
                  description: name of the credentials Secret to write (default "<claim>-<service>")
            status:
              type: object
              properties:
                phase:
                  type: string
                  # Deleting/Orphaned belong to the deprovision (finalizer) lifecycle:
                  # Deleting = teardown in progress (retrying); Orphaned = the bounded
                  # escape fired, the finalizer was released and .orphanedResources
                  # names what leaked and needs manual cleanup.
                  enum: [Pending, Ready, Error, Deleting, Orphaned]
                secretName: { type: string }
                message: { type: string }
                observedGeneration: { type: integer }
                # Bounded-escape counter: failed deprovision passes so far. A NON-ZERO
                # value on a Terminating claim is the at-a-glance wedge signal (see the
                # printer column below). MUST be declared here or the apiserver PRUNES
                # the field the controller writes (proven in-repo for `roles`).
                deletionAttempts: { type: integer }
                # Machine-readable record of resources a failed teardown left behind,
                # e.g. "mongo:user:sp_<prefix>", "pg:db:<prefix>_<db>",
                # "redis:user:sp_<prefix>", "secret:<ns>/<name>". Survives only as long as
                # the object does — the LOUD log banner is the durable copy.
                orphanedResources:
                  type: array
                  items: { type: string }
      additionalPrinterColumns:
        - { name: Service, type: string, jsonPath: .spec.service }
        - { name: Phase, type: string, jsonPath: .status.phase }
        - { name: Secret, type: string, jsonPath: .status.secretName }
        # Surfaces a wedged/retrying deprovision in a plain `kubectl get svcclaim`.
        - { name: DelAttempts, type: integer, jsonPath: .status.deletionAttempts, priority: 1 }
        - { name: Age, type: date, jsonPath: .metadata.creationTimestamp }
