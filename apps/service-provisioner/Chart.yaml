apiVersion: v2
name: service-provisioner
version: 1.0.0
description: >-
  Generic, ServiceClaim-driven credential provisioner. Watches ServiceClaim CRs
  cluster-wide and, per claim, provisions the backing resource (a MongoDB /
  PostgreSQL database+user, or a registry pull secret)
  idempotently, then writes a namespace-local credentials Secret with a
  generate-once (never-rotating) password and records .status. Replaced (and
  retired) the annotation-driven mongodb-provisioner. The controller reads each backend's
  admin credential at runtime from that backend's own Secret via its cluster-wide
  secret-read RBAC — no ESO/Vault wiring of its own for mongo/postgres.
type: application
appVersion: "1.0.0"
dependencies:
  # Per-namespace SecretStore backing the registry-pull ESO source (the
  # `registry` ServiceClaim backend). Gated on the build cluster
  # (global.servicesLocal.registry), so it renders in lockstep with the
  # ExternalSecret in templates/externalsecret-registry-pull.yaml and follows the
  # registry-pull source to whichever ONE cluster runs apps/registry, at any stage.
  - name: secret-store
    version: 1.0.0
    repository: file://../../charts/secret-store
    condition: global.servicesLocal.registry
  # Shared named templates (common.labels etc.).
  - name: common
    version: 1.0.0
    repository: file://../../charts/common
