# dbgate — the whole configuration of ONE slave's instance. There are no
# per-stage files beside this one: everything that used to differ per stage is
# now either a platform global from the $values chain or a per-slave value the
# slaves ApplicationSet injects, and a template has no stage identity of its own
# (the same reason units/postgresql and units/mongodb carry one values file).
#
# Access is gated by the Traefik forwardAuth Middleware `forwardauth` in
# namespace idp, referenced cross-namespace from the Ingress annotation below —
# dbgate itself runs with SKIP_ALL_AUTH and has no login of its own.

global:
  # THE PER-SLAVE INPUTS, injected by argocd/apps/slaves-appset.yaml from the
  # slave's cluster map clusters/active/<fqdn>.yaml. They stand under `global`
  # and not under a root key of this chart because the LIBRARY SUB-CHARTS read
  # them: helm scopes a sub-chart's .Values to its own block plus `global`, so
  # `.Values.global.slave.name` resolves inside charts/ingress and inside the
  # `tpl` charts/deployment applies to the env list, and a root key would not.
  #
  # The empty defaults document the shape. All three are read through the named
  # templates in templates/_helpers.tpl, and each of those `required`s the field
  # it reads — so a render outside the ApplicationSet fails and names what is
  # missing instead of composing a host or a URL with a hole in it.
  slave:
    #   name        s1              — the slave's short name, the first label of its fqdn, and the
    #                                 namespace this instance stands in on the master
    #   masterFqdn  m1.example.com  — the master's fqdn, the right half of the gate-<name> host
    #   apiHost     100.64.0.11     — the address the master dials this slave on: its tailnet
    #                                 address once the two share that private network, its LAN
    #                                 address when it sits in the master's network. The cluster map
    #                                 carries it for the slave's kube-apiserver, and the two
    #                                 connections below dial the databases at the same address.
    #                                 NOTHING ON THE SLAVE PUBLISHES THEM THERE: apps/mongodb and
    #                                 apps/redis both serve inside the cluster and neither carries
    #                                 an Ingress, so both connections fail until a slave publishes
    #                                 the two ports on a plain-TCP entry point bound to this
    #                                 address.
    name: ""
    masterFqdn: ""
    apiHost: ""

app:
  # Constant resource names in every slave's namespace — Deployment and Service
  # `dbgate` rather than the release-derived `<name>-apps-app`, for the same
  # reason slaves/slave pins fullnameOverride on its ArgoCD: one instance stands
  # alone in its namespace, and `kubectl -n <name>` output reads the same across
  # slaves.
  fullnameOverride: dbgate
  image:
    repository: dbgate/dbgate
    tag: "7.2.3"
    pullPolicy: IfNotPresent
  replicas: 1
  containerPort: 3000
  service:
    enabled: true
    type: ClusterIP
    port: 3000
  # DBGate reads CONNECTIONS and materializes each connection from the
  # per-connection LABEL_/ENGINE_/URL_ variables beside it. charts/deployment
  # runs `tpl` over this list, which is what lets an entry call the two named
  # templates in templates/_helpers.tpl — where the per-slave fields above are
  # read and guarded. The guards cannot stand in the entries themselves; that
  # template file says why.
  env:
    # Disable DBGate's own login/JWT auth — the forwardAuth gate at the Ingress
    # handles all access control. Without this, DBGate 7.x shows its own login
    # page AND rejects the UI's API calls with "jwt malformed", because there is
    # no valid DBGate session token.
    - name: SKIP_ALL_AUTH
      value: "true"
    - name: CONNECTIONS
      value: "mongo,redis"
    # The address of the slave BOTH connections dial. Its own entry, and
    # not written into each URL, so both URLs stay short enough for toYaml to
    # leave them on one line — and so the address is stated once. Kubernetes'
    # native $(VAR) expansion substitutes it, which needs it declared BEFORE
    # both, exactly as MONGO_ROOT_PW is declared before URL_mongo.
    - name: SLAVE_ADDRESS
      value: '{{ include "dbgate.slaveAddress" $ }}'
    # --- MongoDB ---
    - name: LABEL_mongo
      value: 'MongoDB ({{ include "dbgate.slaveName" $ }})'
    - name: ENGINE_mongo
      value: "mongo@dbgate-plugin-mongo"
    # The slave's mongod runs with SCRAM auth on (--auth + --keyFile), so dbgate
    # connects as the `root` user (authSource=admin) to browse every database.
    # The password is injected from the dbgate-db-credentials Secret through
    # Kubernetes' native $(VAR) expansion — MONGO_ROOT_PW MUST be declared
    # BEFORE URL_mongo or the expansion does not resolve. The root password is
    # alphanumeric (URL-safe); if it ever gains URL-reserved characters it must
    # be percent-encoded here.
    - name: MONGO_ROOT_PW
      valueFrom:
        secretKeyRef:
          name: dbgate-db-credentials
          key: mongodb-password
    # directConnection=true, and NOT ?replicaSet=rs0 as the in-cluster instance
    # used: with a replica set named, the driver throws the seed address away
    # and re-dials the members under the names the set reports, which are the
    # per-pod headless FQDNs of apps/mongodb inside the slave's cluster
    # (apps/mongodb/templates/headless-service.yaml). Those names do not resolve
    # on the master, so every connection after the handshake would go nowhere.
    - name: URL_mongo
      value: "mongodb://root:$(MONGO_ROOT_PW)@$(SLAVE_ADDRESS):27017/?directConnection=true&authSource=admin"
    # --- Redis ---
    - name: LABEL_redis
      value: 'Redis ({{ include "dbgate.slaveName" $ }})'
    - name: ENGINE_redis
      value: "redis@dbgate-plugin-redis"
    # The slave's redis runs with --requirepass (apps/redis values-common.yaml), so
    # dbgate connects as the `default` user — the one credential that reaches every
    # key, which is what a browser needs and what a per-claim ServiceClaim user is
    # deliberately bounded away from. Same $(VAR) rule as MONGO_ROOT_PW above:
    # REDIS_DEFAULT_PW MUST be declared BEFORE URL_redis or Kubernetes' expansion
    # does not resolve. The password is whatever <stage>/app/redis carries
    # (externalsecret-redis below); if it carries URL-reserved characters it must
    # be percent-encoded here.
    - name: REDIS_DEFAULT_PW
      valueFrom:
        secretKeyRef:
          name: dbgate-redis-credentials
          key: redis-password
    - name: URL_redis
      value: "redis://default:$(REDIS_DEFAULT_PW)@$(SLAVE_ADDRESS):6379"
  # DBGate's data dir — saved queries and last-opened tabs across pod restarts.
  volumeMounts:
    - name: dbgate-data
      mountPath: /root/.dbgate
  volumes:
    - name: dbgate-data
      persistentVolumeClaim:
        claimName: dbgate-data
  # Probes — DBGate's root path returns 200 when up.
  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 30
    periodSeconds: 15
  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

pvc:
  pvc:
    enabled: true
    name: dbgate-data
    # No Prune/Delete protection: removing a slave is allowed to delete its
    # dbgate's saved queries with it.
    # storageClassName omitted — falls back to .Values.global.storageClass
    # (platform/values-common.yaml: microk8s-hostpath).
    accessModes:
      - ReadWriteOnce
    storageSize: "1Gi"

ingress:
  # `dbgate` rather than `<name>-apps-ingress`, for the reason app.fullnameOverride
  # above carries.
  fullnameOverride: dbgate
  ingress:
    enabled: true
    className: public
    annotations:
      # THE gate. dbgate has no auth of its own (SKIP_ALL_AUTH above), so this
      # annotation is what stands in front of it: the forwardAuth Middleware
      # `forwardauth` in namespace idp, referenced cross-namespace because
      # Traefik runs with allowCrossNamespace=true.
      traefik.ingress.kubernetes.io/router.middlewares: idp-forwardauth@kubernetescrd
    # gate-<name>.<masterFqdn> — one host per slave under the master's own
    # domain, the same shape the per-slave ArgoCD ingress uses for
    # argo-<name>.<masterFqdn> (slaves/slave/templates/argo-ingress.yaml).
    # charts/ingress runs `tpl` over host, paths[].serviceName and
    # tls.secretName.
    host: 'gate-{{ include "dbgate.slaveName" $ }}.{{ include "dbgate.masterFqdn" $ }}'
    paths:
      - path: /
        pathType: Prefix
        serviceName: dbgate
        servicePort: 3000
    tls:
      enabled: true
      secretName: dbgate-tls

# ExternalSecret — the mongod root password, injected into URL_mongo above
# through the dbgate-db-credentials Secret.
#
# It reads the SecretStore slaves/slave renders into this namespace
# (global.secretStoreName, `vault-backend`), which authenticates to the MASTER's
# Vault through the master's own kubernetes auth mount. The entry it reads is
# the application tier of the ONE shared KV mount, which the master and every
# slave read alike — the same tree apps/mongodb on the slave is initialised
# from, so the password here and the password there are one value.
externalsecret-db:
  externalSecret:
    enabled: true
    name: dbgate-db-credentials
    secretStoreKind: SecretStore
    targetSecretName: dbgate-db-credentials
    # The remoteRef key — <stage>/app/mongodb. Left empty and `required`ed by
    # charts/external-secret: the stage is not a fact this chart holds, and the
    # per-stage ApplicationSet injects it as a literal.
    vaultPath: ""
    data:
      - secretKey: mongodb-password
        property: mongodb-root-password

# ExternalSecret — the redis `default` user's password, injected into URL_redis
# above through the dbgate-redis-credentials Secret. Same store, same tier and the
# same one-value rule as the mongod password beside it: what this reads out of
# <stage>/app/redis is the entry apps/redis on the slave boots its server with as
# --requirepass, so the password here and the password there cannot drift.
externalsecret-redis:
  externalSecret:
    enabled: true
    name: dbgate-redis-credentials
    secretStoreKind: SecretStore
    targetSecretName: dbgate-redis-credentials
    # The remoteRef key — <stage>/app/redis. Left empty and `required`ed by
    # charts/external-secret, for the same reason the one above is: the stage is
    # not a fact this chart holds, and the ApplicationSet injects it as a literal.
    vaultPath: ""
    data:
      - secretKey: redis-password
        property: redis-password
