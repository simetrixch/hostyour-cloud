apiVersion: v2
name: dbgate
# 2.0.0 — BREAKING vs 1.0.0 on purpose. 1.0.0 was a platform application: an
# apps/dbgate directory with an app.yaml carrying runsOn: slave, one release per
# CLUSTER in a `dbgate` namespace, three per-stage values files, and connection
# URLs naming the in-cluster Services of the cluster it ran on. 2.0.0 is a
# PER-SLAVE render on the master: no app.yaml, one values file, and connection
# URLs composed from the slave's own address. Nothing upgrades in place — the
# cluster release is gone, and this is the chart that survived it.
version: 2.0.0
appVersion: "7.2.3"
description: |
  DBGate — one web browser over ONE slave's mongodb and redis, rendered per
  slave and running ON THE MASTER, in that slave's namespace, at its own
  address.

  NOT A PLATFORM APPLICATION, which is why this directory carries no app.yaml
  and no runsOn. It is a further source of the per-slave Application the slaves
  ApplicationSet renders (argocd/apps/slaves-appset.yaml), the same way
  units/postgresql and units/mongodb are further sources of a consumer's — so a
  master with no slave registered renders no instance of it at all.

  WHY IT SITS ON THE MASTER RATHER THAN ON THE SLAVE IT BROWSES. dbgate has no
  cluster picker: its connections are environment variables baked into the pod,
  so one instance can only ever show one cluster's databases. That is what makes
  it follow the per-slave ArgoCD instance (slaves/slave) rather than the shared
  kube dashboard, which has a picker and needs one instance for every cluster.
  It also puts the pod in the cluster that has an identity provider: the Ingress
  is gated by the Traefik forwardAuth Middleware `forwardauth` in namespace
  `idp`, and the program that installs bootstrap/idp declares `roles: [master]`.

  WHAT IT TAKES FROM ITS SIBLING SOURCE. The ExternalSecret names no SecretStore
  of its own: it takes global.secretStoreName, which is the `vault-backend`
  store slaves/slave renders into this same namespace. The two charts are
  sources of ONE Application, so a second SecretStore of that name here would be
  the same object rendered twice.
type: application
dependencies:
  - name: deployment
    version: 1.0.0
    repository: file://../../charts/deployment
    alias: app
  - name: ingress
    version: 1.0.0
    repository: file://../../charts/ingress
  - name: external-secret
    version: 1.0.0
    repository: file://../../charts/external-secret
    alias: externalsecret-db
  - name: pvc
    version: 1.0.0
    repository: file://../../charts/pvc
  # Shared named templates (common.labels etc.) used by every library chart
  # above. Declared at APP level because Helm doesn't vendor nested file://
  # deps — see charts/common/Chart.yaml for the consumption rule.
  - name: common
    version: 1.0.0
    repository: file://../../charts/common
