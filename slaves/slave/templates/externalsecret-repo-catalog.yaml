{{- /*
The CATALOG repo credential for the slave's ArgoCD instance — the twin
of externalsecret-repo-platform.yaml: the tenant ApplicationSets in the
slave branch's argocd tree (argocd/<stage>/apps/tenants-*-appset.yaml) read
the PRIVATE tenant catalog (tenant registrations under
registrations/<guid>/<stage>.yaml + the tenant charts), so this instance's
repo-server needs a credential for it. Same discovery mechanism as
the monorepo credential: a Secret labeled
`argocd.argoproj.io/secret-type: repository` in the instance's namespace.
The PAT is GITOPS_REPO_READ_PAT (Contents: read). This instance syncs the catalog
and commits nothing, so it never receives the write-capable token the Controller's
tenant registry commits with — that one stays in the system tier. The GitHub ruleset
protecting the catalog's `master` stays regardless (mirror of the hostyour-cloud one,
see secrets.example): a ruleset guards against a mistake by whoever legitimately
holds the write token, which is a different question from who holds it.

Provenance: adding a slave copies the PAT from secret/<stage>/system/argocd
(which the master's ESO CANNOT read — its policy covers app/* + slaves/* only)
into the slaves tier. Contract (REQUIRED at that path):
  pat   the org PAT (Contents:read+write on the catalog; read-only use here)
The username is a constant (repo.deployUsername) exactly like the monorepo
twin's repo.username.
*/ -}}
{{- $name := required "slave.name is required (pointer-file field name)" .Values.slave.name }}
{{- $vaultKey := printf "%s/slaves/%s/deploy-repo-pat" (required "slave.stage is required (injected by slaves-appset.yaml)" .Values.slave.stage) $name }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-catalog
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  # No periodic read of Vault — the platform-wide delivery rule (charts/external-secret
  # carries the full statement of it). Putting a NEW PAT in front of ArgoCD:
  # update Vault and add the slave again, then DELETE the target Secret
  # `kubectl -n argocd delete secret repo-catalog` — OnChange creates it again
  # from Vault. No pod roll: ArgoCD reads this Secret on every use.
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: {{ .Values.global.secretStoreName }}
    kind: SecretStore
  target:
    name: repo-catalog
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          # THE label that makes this ArgoCD treat the Secret as a repo credential.
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        # The catalog is installation state: cluster/profile.yaml carries it as
        # global.catalogUrl. Required and not defaulted — a repo credential
        # attached to the wrong URL is a credential ArgoCD never uses and nobody
        # misses, so a branch naming no catalog must fail here.
        url: {{ required "slave: global.catalogUrl is required (cluster/profile.yaml, rendered per install branch from the cluster map's catalog-repo)" .Values.global.catalogUrl }}
        username: {{ .Values.repo.deployUsername }}
        password: "{{ `{{ .pat }}` }}"
  data:
    # Every defaulted remoteRef field emitted explicitly so ArgoCD sees no
    # server-side drift (same convention as charts/external-secret).
    - secretKey: pat
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        key: {{ $vaultKey }}
        property: pat
