{{- /*
argo (per-slave ArgoCD ingress): the argo-<name>.<masterFqdn> Ingress in front
of the argo-cd sub-chart's Service (fullnameOverride `argocd` → Service
`argocd-server`, port 80 — see values-common.yaml). Chart-own template instead
of charts/ingress because the host is composed from PER-SLAVE values (slave.name
+ slave.masterFqdn), which a library sub-chart cannot see. Same shape as
charts/ingress otherwise (className public, cert-manager ClusterIssuer from the
platform global, LE cert via tls secretName). argocd-server must serve plaintext
behind Traefik (argo-cd.configs.params.server.insecure: true in
values-common.yaml) — same decision as the master's own ArgoCD — or it redirects
to its own TLS and this Ingress 502s/loops.
*/ -}}
{{- if .Values.argo.ingress.enabled }}
{{- $slave := .Values.slave }}
{{- $name := required "slave.name is required (pointer-file field name)" $slave.name }}
{{- $masterFqdn := required "slave.masterFqdn is required (pointer-file field masterFqdn)" $slave.masterFqdn }}
{{- $host := printf "argo-%s.%s" $name $masterFqdn }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argo-slave
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ required "global.clusterIssuer is required (platform/values-common.yaml)" .Values.global.clusterIssuer | quote }}
spec:
  ingressClassName: public
  tls:
    - hosts:
        - {{ $host }}
      secretName: argo-slave-tls
  rules:
    - host: {{ $host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
{{- end }}
