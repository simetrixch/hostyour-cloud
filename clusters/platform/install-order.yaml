# clusters/platform/install-order.yaml
# =============================================================================
# THE ORDER THE PROGRAMS OF AN INSTALLATION RUN IN, and what each of them needs
# to already stand. Before this file the order for a first master was written
# nowhere: it was carried in an operator's head and in a table in a chat window,
# while the order for a slave was written in TypeScript in a third repository
# (hostyour-manager server/domains/runs/defs/deploy-slave.ts). Two carriers of
# one fact disagree the moment one of them is edited, and neither of them can be
# read by whoever is standing in front of a bare machine.
#
# THIS FILE STATES THE ORDER. IT DOES NOT RUN IT. Nothing here starts a program
# and nothing here is a step. A driver reads the sequence and invokes the
# programs itself; putting a run inside a run is what the ticket that asked for
# this file ruled out, because a failure halfway through a child leaves a parent
# that cannot say what happened.
#
# WHO READS IT TODAY: TWO PROGRAMS, IN TWO OTHER REPOSITORIES, and neither of
# them is a driver.
#
#   hostyour-manager  server/domains/inventory/install-order.ts fetches and parses
#                     this file off the trunk, and the boot self-check
#                     `install-order.agrees` (server/boot/selfchecks.ts) holds the
#                     manager's own run kinds against what it says. The module's
#                     own header states why it is a reader and not a driver: a run
#                     that composed its steps out of a file on a remote trunk would
#                     fail to plan when that trunk is unreachable.
#   ansiwise-client   lib/domain/install_order.dart names this path and
#                     lib/infrastructure/feed_install_order.dart fetches it over
#                     the GitHub contents API to show an operator the programs of
#                     the role being installed, in order, before anything runs.
#                     THIS IS THE READER A PERSON MEETS: a row changed here changes
#                     what somebody standing in front of a bare machine is shown.
#
# WHO DOES NOT: the two drivers. hostyour-cloud lifecycle/driver.sh carries its own
# `PROGRAMS` array and says so in its own header, and the manager invokes its
# programs from step lists written in TypeScript. So a row changed here reaches
# every READER and no RUN, and that is the distinction to hold on to: this file
# tells people what an installation does, and nothing here makes it do it.
#
# It is stated rather than implied, because a declaration nothing consumes looks
# exactly like one that is obeyed, and so does one that is only read.
#
# WHY IT STANDS HERE AND NOT IN THE CATALOGUE. The catalogue holds the programs;
# it belongs to the installation that was handed it, and every installation gets
# its own. A sequence written there is written once per customer and drifts once
# per customer. This repository is the trunk every installation is cut from, so a
# fact that has to be one fact for all of them belongs on it. `versions.yaml`
# beside this file already works that way: it pins versions that are stamped into
# the catalogue's own program files (`tree: deploy`) and into the manager's tree
# (`tree: manager`), so a cross-repository statement about an installation
# already has a home, and this is the same kind of statement about the same
# programs.
#
# THE GRAMMAR
#
#   engine        where the deployment engine binary stands on the machine.
#   catalog.path  the directory every program of this sequence is run FROM, and
#                 the directory the catalogue is checked out into.
#   catalog.files what has to stand inside that directory, as paths relative to
#                 it, before the first program runs.
#   elevated      whether the whole sequence runs elevated.
#   sequence      one ordered list per role. The list order IS the order.
#   needs         the facts a program requires to already stand, each written as
#                 the thing itself — a path where it is a path — rather than as
#                 "after <program>". A reader can then see WHY a program cannot
#                 move earlier instead of taking it on trust.
#
# WHAT IS DELIBERATELY NOT HERE: THE ANSWERS EACH PROGRAM REQUIRES. Every program
# declares its own answers, which of them are required, which carry a default and
# which are derived, in its own file in the catalogue. Copying that list here
# would be a second source of it, and the first edit to a program would make this
# copy wrong while it went on being read. NOTHING about the answers is stated
# here.
#
# WHICH OF THESE PROGRAMS RUNS AGAIN ON A LATER PASS IS NOT STATED, because it
# is not measured. The one thing known is that `deploy-branch` both cuts a
# branch and rewrites it afterwards, deciding which by asking the remote whether
# it publishes one; the other four are watched only on a first install.
#
# HOW FAST THIS FILE GOES STALE, measured rather than feared. One check holds one
# thing about it — `install-order.agrees`, in another repository, comparing the
# manager's own program lists against a sequence below — and nothing in THIS
# repository holds anything. So a sentence here goes on being read after it stops
# being true and only a person reading the file finds it: a program name that
# versions.yaml beside this file stamps no site in, while it stamps four under
# another name; a `needs` path this repository has renamed; an answer whose value
# comes from a run. That is the argument for a driver, and it is also the
# warning: a row here is intent, not behaviour, and it is verified against the
# programs in the catalogue and against this tree before it is relied on.
#
# ONE SEQUENCE, ONE ACT: INSTALLING A MACHINE FROM BARE METAL. That is what every
# list below states, and it is why `needs` is the load-bearing part of this file
# rather than decoration. On a bare machine `deploy-branch` can only run after
# `deploy-host`, because its two needs — the checkout at /srv/hostyour-cloud and
# the config template inside it — do not exist until `deploy-host`'s `git_clone`
# has put them there. The needs impose the order; the list only writes it down.
#
# A CHANGE TO A MACHINE THAT IS ALREADY INSTALLED IS A DIFFERENT ACT, AND ITS
# ORDER IS NOT THIS ONE. On such a machine the checkout and the template already
# stand, so `deploy-branch`'s needs are satisfied before the run begins, the edge
# that forced host-before-branch is gone, and what decides the order instead is
# the change being made. Giving an installed master the slave part regenerates the
# branch FIRST and re-runs the machine layer off it — hostyour-manager
# server/domains/runs/defs/deploy-slave.master.ts, `masterSlavePartSteps`, which
# runs `deploy-branch` before `deploy-host` and says why in its own comment: the
# slave part has to arrive as a property of the branch the machine already reads,
# and the machine programs have to act on that branch and not on the one before it.
#
# NEITHER ORDER IS WRONG AND NEITHER IS A COPY OF THE OTHER. They answer two
# questions: what has to be true before a program can run AT ALL, which is what
# this file states, and which order carries a machine from one state to another,
# which belongs to the act making the change. A second sequence here naming the
# second act would be a list derivable from the needs already written above it, and
# a derivable list is a copy that drifts — which is the thing this file exists
# against. So it is not here, and the rule is: read the sequence as the order for a
# machine that carries nothing yet, and read the `needs` for every other case.
# =============================================================================

# The engine binary, as the path it is installed to. deploy-cluster's
# `require_cli_tool_versions` row runs `ansiwise --version` and fails the run when
# it is not on the PATH, so an installation that carried the binary somewhere else
# dies four programs in rather than at the start.
engine: /usr/local/bin/ansiwise

# Elevated, and the reason is the record directory. The engine writes its records
# under /var/lib/ansiwise, which belongs to root; an unelevated run dies on it with
# a PathAccessException that names the path and says nothing about permissions.
elevated: true

catalog:
  # ONE path, and it is not free. deploy-platform-services writes
  # /etc/systemd/system/hostyour-vault-unseal.service, whose WorkingDirectory is
  # /srv/ansiwise-catalog and whose two ExecStart lines name files under it. On an
  # installation whose catalogue stands elsewhere the enable fails with
  # "Changing to the requested working directory failed: No such file or directory",
  # the run ends at that row, and the unwind takes the unit file back with it — so
  # `systemctl cat` afterwards answers "No files found" and the cause is gone from
  # the machine. The same path is CATALOG_CHECKOUT in hostyour-manager
  # server/domains/runs/defs/place-ansiwise.ts, which is what maintains the checkout
  # once the manager exists; on a FIRST master the manager does not exist yet, and
  # nothing creates the directory before the unit needs it.
  #
  # It is also the working directory the programs are RUN from, because
  # `write_file_from_template` resolves its template against the working directory.
  path: /srv/ansiwise-catalog
  files:
    # The installation configuration the run is given with --config.
    - ansiwise.yaml
    # The programs, named with --programs. The default is `programs` beside the
    # working directory and the catalogue keeps them one level down.
    - ansiwise/programs
    # BOTH OF THE NEXT TWO ARE NAMED BY hostyour-vault-unseal.service's ExecStart
    # lines, and neither travels with `ansiwise/` plus `ansiwise.yaml`. A bootstrap
    # that carried only those two left the unit pointing at files that were not on
    # the machine.
    - ansiwise-boot.yaml
    - ansiwise/boot-programs

sequence:
  # A FIRST MASTER, measured on an installation from a bare machine. Six programs,
  # in this order.
  #
  # SIX HERE AND FIVE IN THE DRIVER, and that is not a drift. lifecycle/driver.sh
  # runs the first five and deliberately not `onboard-manager`, because that program
  # onboards this platform's own manager AS A CONSUMER and an onboarding is the
  # manager's own act rather than an installer's. Its header says so; this line
  # exists so a reader who counts both does not have to work out which is wrong.
  #
  # THE SLAVE SEQUENCE IS NOT HERE, and the reason is not that it could not be read.
  # It stands in hostyour-manager server/domains/runs/defs/deploy-slave.ts and it
  # names the same three machine programs a master runs — `deploy-host`,
  # `deploy-cluster` and `deploy-platform-services`. NO BRANCH PROGRAM IS AMONG
  # THEM: a pure slave has no install branch of its own, its map stands on the
  # books branch beside every other map of the installation, and its checkout is
  # stood on that same branch. `deploy-branch` names `master` alone in its own
  # `roles:` line, which is what holds that.
  #
  # What keeps it out of this file is that a slave's sequence is not a sequence of
  # PROGRAMS. Half of its steps are the manager's own acts — placing the engine,
  # moving the checkout onto the books branch, marking the slave in the books,
  # minting and spending a join credential — and a file that listed only the
  # program rows would state a shape nobody can follow and would read as though
  # the rest did not exist. Stating it whole means stating a run kind, and a run
  # kind belongs where it runs.
  master:
    - program: deploy-host
      # Nothing. Its `git_clone` row is what establishes the platform checkout in
      # the first place, from the platform_repo and platform_branch answers.
      needs: []

    - program: deploy-branch
      needs:
        # The checkout deploy-host made, and the template inside it that the
        # generated configuration is written from. Both are this repository: the
        # example file is tracked on the trunk exactly so this program has
        # something to make the real file out of.
        - /srv/hostyour-cloud
        - /srv/hostyour-cloud/configs/config.example

    - program: deploy-cluster
      needs:
        # The cluster map and the secret file, both written by deploy-branch. This
        # is the edge that contradicted the earlier assumption: deploy-cluster
        # cannot run before deploy-branch, because it reads two files that do not
        # exist until deploy-branch has written them.
        - /srv/hostyour-cloud/clusters/active/<fqdn>.yaml
        - /srv/hostyour-cloud/secrets/secrets.<stage>

    - program: deploy-platform-services
      needs:
        # The generated configuration, written by deploy-branch.
        - /srv/hostyour-cloud/configs/config.<stage>
        # The values of the four releases it installs before the reconciler exists.
        # The directory names are the releases: argocd, headlamp, idp and vault.
        - /srv/hostyour-cloud/clusters/bootstrap/argocd/values.yaml
        - /srv/hostyour-cloud/clusters/bootstrap/headlamp/values.yaml
        - /srv/hostyour-cloud/clusters/bootstrap/idp/values.yaml
        - /srv/hostyour-cloud/clusters/bootstrap/vault/values.yaml

    # The master joins the private network it runs the coordinator for. After the platform
    # services, because the coordinator is a workload the reconciler brings once this cluster has
    # its root application — so the program waits for it rather than assuming it.
    - program: tailnet-join-self
      needs:
        - /srv/hostyour-cloud/clusters/active/<fqdn>.yaml
    - program: onboard-manager
      needs:
        # A cluster that is up and serving, with Vault and the identity provider
        # on it — which is what deploy-platform-services leaves behind.
        - a running cluster carrying vault and idp
        # The socket this program connects to. It stands on the HOST at the path
        # clusters/inventories/manager/values-common.yaml `adminSocket.path`
        # names, and the manager pod creates it there once the reconciler has
        # synced the manager application.
        #
        # A CONSTANT PATH, AND NOT A DATA DEPENDENCY. Binding the socket under
        # DATA_DIR — a claim whose directory the storage provisioner composes
        # with a generated uid — makes the path unknowable before the cluster
        # runs, and this file would carry it as the one answer whose VALUE comes
        # from an earlier program. The chart decides the path instead, the value
        # is a constant knowable before any program starts, and the dependency is
        # an ordinary `needs` like every other.
        - /var/lib/hostyour-manager/admin.sock

  # A MACHINE CARRYING BOTH PARTS is installed exactly like a master: the same six
  # programs, in the same order, with the same needs. What differs is one answer —
  # deploy-branch is told `role: master+slave` — and the ApplicationSet's part
  # selection is what turns that answer into both parts' workloads. The list is
  # written out rather than referenced, because this file's grammar is one ordered
  # list per role and a reader of one role must not have to resolve another.
  #
  # THIS LIST STOOD AT FIVE AND WAS MISSING `tailnet-join-self`, which is a copy that
  # did not move when the master's list did. It is written back in here because the
  # rule above is what decides the content — this role IS a master plus a part — and
  # because that program declares `roles: [master]` (hostyour-deploy
  # ansiwise/programs/tailnet-join-self.yaml), which a master+slave machine carries.
  # A master that never joined the network it runs the coordinator for cannot reach
  # a slave at the address the design tells it to dial, and nothing else notices:
  # every surface answers over its public name.
  master+slave:
    - program: deploy-host
      needs: []

    - program: deploy-branch
      needs:
        - /srv/hostyour-cloud
        - /srv/hostyour-cloud/configs/config.example

    - program: deploy-cluster
      needs:
        - /srv/hostyour-cloud/clusters/active/<fqdn>.yaml
        - /srv/hostyour-cloud/secrets/secrets.<stage>

    - program: deploy-platform-services
      needs:
        - /srv/hostyour-cloud/configs/config.<stage>
        - /srv/hostyour-cloud/clusters/bootstrap/argocd/values.yaml
        - /srv/hostyour-cloud/clusters/bootstrap/headlamp/values.yaml
        - /srv/hostyour-cloud/clusters/bootstrap/idp/values.yaml
        - /srv/hostyour-cloud/clusters/bootstrap/vault/values.yaml

    - program: tailnet-join-self
      needs:
        - /srv/hostyour-cloud/clusters/active/<fqdn>.yaml

    - program: onboard-manager
      needs:
        - a running cluster carrying vault and idp
        - /var/lib/hostyour-manager/admin.sock
