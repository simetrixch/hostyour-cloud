# Platform-wide constants shared across DEV / TEST / PROD.
# Loaded by every app's ArgoCD Application via the `$values` ref source:
#
#   spec:
#     sources:
#       - repoURL: <repo>
#         targetRevision: <branch>
#         ref: values
#       - repoURL: <repo>
#         path: clusters/inventories/<app>
#         helm:
#           valueFiles:
#             - $values/clusters/platform/values-common.yaml   # ← this file
#             - $values/clusters/platform/values-<env>.yaml
#             - values-common.yaml
#             - values-<env>.yaml
#
# Helm's built-in `global:` convention propagates these keys to every subchart
# automatically. Templates reference them as `{{ .Values.global.<key> }}`.
#
# Per-env overrides live in values-{dev,test,prod}.yaml alongside this file.
global:
  # global.domain is NOT here. It is one installation's fqdn — every platform
  # hostname hangs off it (gate.<domain>, grafana.<domain>, vault.<domain>,
  # mail.<domain>, the CoreDNS rewrites) — and a value that names ONE
  # installation cannot stand in a file the trunk ships to every other. It made
  # this file two classes at once, so a reader could not tell which of its keys
  # are the platform's own grammar and which are one cluster's state, and
  # the install-branch sync had to `git show` the file off master to read
  # releaseTagFilter below out of a file the branch rewrites.
  #
  # The branch program writes it into clusters/active/<fqdn>.yaml from the branch's
  # own fqdn, beside the other globals it derives from the cluster map. That
  # file is LAST in every app's valueFiles chain, so `{{ .Values.global.domain }}`
  # resolves exactly as before — the value simply comes from the installation's
  # own file instead of the product's.

  # Timezone applied to MongoDB, PostgreSQL, and Postfix containers via their
  # respective TZ env vars. Single source of truth — flipping this here flips
  # the timezone everywhere. Resolves the prior Europe/Amsterdam vs
  # Europe/Berlin inconsistency.
  timezone: Europe/Amsterdam

  # StorageClass for PersistentVolumeClaims. Our own `clusters/charts/pvc/` chart reads
  # this; upstream charts (Bitnami, kube-prometheus-stack, loki, tempo) still
  # have it hardcoded in their per-app values blocks for now — those would
  # need invasive wrapper templates to fully dedupe. See plan note on Step 3.
  storageClass: microk8s-hostpath

  # The cert-manager ClusterIssuer every public Ingress and every Certificate of
  # this platform is issued by, written as the name that object carries.
  #
  # WHAT CREATES IT: the cluster-issuer rows of deploy-cluster (digita-deploy
  # ansiwise/programs/deploy-cluster.yaml), which write this same name. No key of
  # configs/config.<stage> holds it and nothing composes it — the two places are
  # held together by being spelled alike, and a name here that the cluster does
  # not carry leaves every GitOps-deployed Certificate Pending forever on
  # "ClusterIssuer not found".
  #
  # IT SAYS NOTHING ABOUT WHICH AUTHORITY. That is the `letsencrypt_server`
  # answer of that same program, and it varies per installation while this name
  # may not: every manifest that asks for a certificate references it by this
  # exact string.
  clusterIssuer: __CLUSTER_ISSUER__

  # The ONE Vault KV-v2 mount every SecretStore reads. Word-identical on every
  # cluster and every role — what differs per cluster is only the Kubernetes
  # auth mount (global.vaultKubernetesAuthPath, clusters/active/<fqdn>.yaml).
  vaultKvMount: secret

  # Name of the per-namespace ESO SecretStore that every app's ExternalSecret
  # references. The actual SecretStore is rendered by the local `secret-store`
  # chart dep in each app's namespace; this is just the consistent name.
  secretStoreName: vault-backend

  # Default Alertmanager recipients — catches all alerts not routed to an
  # app-specific AlertmanagerConfig CR. Add per-team mailboxes in app values
  # under `monitoring.alertmanagerConfigs.<name>.emails`.
  #
  # EMPTY HERE, AND IT STAYS EMPTY. A mailbox names one installation, and this
  # file is the trunk every future installation is cut from. The value arrives
  # from the operator: the answer is written as alert-recipients into
  # clusters/active/<fqdn>.yaml, and the branch program renders it into
  # clusters/active/<fqdn>.yaml, which loads last and replaces this list.
  # clusters/charts/monitoring refuses to render an enabled route that resolves to no
  # recipient, so an installation that never set it is stopped rather than
  # dropping its alerts in silence.
  alertRecipients: []

  # ── Shared-service endpoints — the ONLY cross-cluster surface ──────────────
  # Every address at which THIS cluster reaches a service that ONE cluster of
  # the installation runs. One sub-map per service, one field name per address.
  # Empty on the trunk; the branch program writes each key into
  # clusters/active/<fqdn>.yaml, which loads LAST in every app's valueFiles chain,
  # from the cluster map's own predicates.
  endpoints:
    registry:
      # Empty -> zot.<domain> (this cluster's own registry), composed by the
      # `common.registryHost` helper (clusters/charts/common). On a NON-build
      # cluster this is the build cluster's host, e.g. zot.m1.example.com.
      host: ""
    mail:
      # Where units on this cluster reach the installation's shared mail
      # service. Empty ONLY on the trunk: the post_url answer is mandatory
      # (an install is refused without it, because every tenant's auth and
      # report chart hard-requires this value), and the branch program writes
      # it on every branch.
      url: ""
    vault:
      # The ONE Vault of this installation, as vault.<master>: it stands on the
      # cluster carrying the master part and every cluster's SecretStores dial
      # it over that public address. What differs per cluster is only the
      # Kubernetes auth mount (global.vaultKubernetesAuthPath). Empty ONLY on
      # the trunk — every reader wraps it in `required`, so a cluster that was
      # given no address is stopped rather than dialling nothing.
      url: ""
    tailnet:
      # The coordination server of the private tailnet every host of this
      # installation logs in to, as tale.<master> — one coordinator per
      # installation, on the same cluster as Vault, reached over a public
      # Ingress because a host that has not joined yet has no other path to it.
      # Empty ONLY on the trunk.
      url: ""

  # ── The addresses of this cluster's own nodes ─────────────────────────────
  # Every address a workload of this cluster is reached at because it stands ON
  # A NODE rather than in the pod network: the Kubernetes API server, anything
  # with hostNetwork (clusters/inventories/manager sets it, values-common.yaml
  # hostNetwork), and the ingress controller's host ports. Written as IPv4
  # CIDRs, one entry per address or range.
  #
  # IPv4 ONLY, and that is not a limitation. The reader below carves these out
  # of an ipBlock whose cidr is 0.0.0.0/0, and Kubernetes refuses an `except`
  # that does not lie inside its own cidr. An IPv6 destination needs no entry:
  # the fence's only egress rules are IPv4, and a pod under an egress policy
  # may go nowhere a rule does not name, so IPv6 is already denied whole.
  #
  # WHO READS IT, and it is a DENY list there:
  # clusters/inventories/gate-runner/templates/networkpolicy.yaml fences the
  # gate sandbox by carving the private ranges out of an allow-all-internet
  # ipBlock. That carve-out covers a node whose address is private and NOTHING
  # of a node whose address is public — which a cloud node's is — so the API
  # server, the manager and every Ingress of the cluster stayed reachable from
  # a sandbox holding partially tenant-authored chart code. The addresses of a
  # node are not derivable at render time and no cluster fact in this tree
  # carries them, so they are stated here.
  #
  # Empty ONLY on the trunk. It belongs in clusters/active/<fqdn>.yaml, which
  # loads LAST in every app's valueFiles chain, beside the other globals an
  # installation is given. THE BRANCH PROGRAM MEASURES IT OFF THE MACHINE AND
  # WRITES IT THERE — digita-deploy ansiwise/programs/deploy-branch.yaml reads
  # the host's own addresses with measure_host_addresses and fills the map's
  # nodeCidrs slot, so every branch generated since 2026-08-26 carries the list.
  # A branch cut before that step existed carries none, and for it the fence
  # STOPS ITS RENDER on an empty list rather than rendering a boundary that
  # names nothing to deny.
  #
  # A /32 PER NODE ADDRESS, AND NOT THE PREFIX THEY SIT IN. This list is read
  # TWICE, with opposite polarity, and only one of the two readings is a deny.
  # The fence carves these addresses OUT of an allow-all ipBlock, where a wider
  # entry is a wider deny and costs nothing. The report-writer pinhole in the
  # same file uses the identical list as the ipBlock it ALLOWS — the publish
  # step has to reach the API server through the fence — and there a wider entry
  # is a wider allow: writing the cluster LAN's /24 here does not widen a deny,
  # it lets that one pod reach every host on the segment.
  #
  # So the convenience of not rewriting the branch when a node is added is paid
  # for in the pinhole, and it is not the sandbox's to give away. Add the node's
  # /32 when the node is added.
  nodeCidrs: []

  # Whether a shared service is deployed LOCALLY on this cluster — gates the
  # CoreDNS hairpin rewrites (a chart can't see the deploy toggle). All false
  # on the trunk; the branch program writes each key from the cluster map's
  # predicates: registry follows the build plane (the ONE cluster running
  # clusters/inventories/registry); vault and observability follow the master
  # part (the base layer stands Vault up there, and the master is the cluster
  # its slaves push to).
  servicesLocal:
    registry: false
    vault: false
    # Gates clusters/inventories/observability's receive path: the prom-push. /
    # loki-push. Ingresses + the basic-auth Middleware + its htpasswd
    # ExternalSecret (clusters/inventories/observability Chart.yaml
    # `condition:`).
    #
    # IT DOES NOT OPEN THE ENDPOINT THOSE INGRESSES ROUTE TO. Prometheus serves
    # /api/v1/write only where prometheusSpec.enableRemoteWriteReceiver is true;
    # that key stands at false in
    # clusters/inventories/observability/values-common.yaml, no file of this
    # tree sets it, and the branch program writes no such key either — the
    # cluster map it renders has no slot for it. So on every installation the
    # prom-push Ingress routes to a path Prometheus never registered: a slave's
    # obs-agent push lands nowhere, the master holds no up{cluster="<fqdn>"}
    # series, and the Manager's metrics probe answers `empty` for every slave.
    # Measured 2026-08-28 by rendering this application for dev, test and prod
    # against an install branch's cluster map: the Prometheus CR carries no such
    # field in any of the three.
    observability: false

  # Data-service NetworkPolicy consumers — who may reach the in-house data
  # services, see clusters/inventories/{mongodb,redis}/templates/networkpolicy.yaml.
  # Platform components are admitted by NAME (dataConsumerNamespaces); unit
  # namespaces admit themselves by LABEL (consumerLabels). Same-namespace pods
  # are always allowed by the template.
  #
  # The name list carries one entry, `dbgate`: the database browser runs on the
  # cluster its databases do (clusters/inventories/dbgate/app.yaml carries the
  # `runsOn: slave` that clusters/inventories/mongodb and
  # clusters/inventories/redis carry), so it is admitted by name like any other
  # platform namespace and needs no route out of the cluster to reach either
  # port.
  #
  # consumerLabels is keyed by the SERVICE the label opens, and the two labels
  # are handed out to different widths on purpose. Both services require a
  # credential now that clusters/inventories/redis boots with --requirepass, so
  # they no longer differ in what reach MEANS:
  #   mongodb — stamped on EVERY unit namespace. A provisioned per-unit
  #             credential still gates, so a namespace that never claimed one
  #             gains nothing by carrying it.
  #   redis   — stamped ONLY where the registration claims `redis` in
  #             services[] (consumers-appset templatePatch), on the tenant
  #             member whose own registration carries the label (the tenant
  #             appset stamps a member's namespaceLabels and names none
  #             itself), and on clusters/inventories/service-provisioner's own
  #             namespace, which has to reach :6379 to write each claim's ACL
  #             user. The password is a SECOND boundary, never a replacement
  #             for the first, so the policy is not widened because one exists.
  # clusters/units/postgresql carries no key here: it admits by namespace NAME
  # only (networkPolicy.allowedNamespaces), because a label every unit namespace
  # wears would open one unit's database to every other unit.
  # The label VALUES are stamped on live namespaces by the ApplicationSets in
  # clusters/argocd/apps and by hostyour-manager, both of which carry them as
  # literals.
  dataConsumerNamespaces:
    - dbgate
  consumerLabels:
    mongodb: platform/db-consumer
    redis: platform/redis-consumer

  # The namespace the ingress controller runs in. It is the MicroK8s ingress
  # addon's own name, not one this platform chooses, and the deploy program
  # patches the controller there (ansiwise/programs/deploy-cluster.yaml, the
  # patch_container_arguments_and_ports row over daemonset/traefik).
  #
  # ONE READER, and it reads it as an EGRESS destination:
  # clusters/inventories/consumer-build/templates/networkpolicy.yaml lets a build pod out to
  # Traefik on 8443/443. NO DATABASE POLICY NAMES IT ANY MORE. The two that did
  # were the second half of an IngressRouteTCP publishing mongodb and redis
  # outside their own cluster, and hostyour-cloud#66 removed route and rule
  # together — a database this platform runs is reached from its own cluster, so
  # the controller has no part in reaching it.
  ingressNamespace: ingress

  # ── Release-tag grammar — the ONE build-plane copy ─────────────────────────
  # The shell/CEL-side MIRROR of hostyour-manager shared/release.ts
  # RELEASE_TAG_RE, kept here (a `global.*` key) so every build-plane chart that
  # needs it reads the SAME literal through the shared $values chain:
  #   - clusters/inventories/image-builder github-deploy-request Trigger CEL
  #     (^refs/tags/deploy/(dev|test|prod)/<filter>$),
  #   - clusters/inventories/consumer-build pipeline-release gate-stage re-verify.
  # It is the INNER pattern only (no ^/$ anchors) so it composes as above (CEL)
  # and as `^<filter>$` (shell / release.ts source).
  # Numeric segments reject leading zeros (a lone 0 excepted). The other side of
  # the grammar is RELEASE_TAG_RE in hostyour-manager/shared/release.ts,
  # imported by hostyour-manager/server/domains/inventory/cluster-marking.ts:67.
  # `^<filter>$` and that regular expression must stay byte-identical — a change
  # to either is a change to both. Nothing measures that: this repository does
  # not depend on the other, and a check here could only read it where somebody
  # happened to have it cloned.
  releaseTagFilter: '(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-(alpha|beta|stable)-([0-9]{14})'

  # ── The pin a stage carries before its first release ───────────────────────
  # WHAT TO WRITE WHEN AN APPLICATION IS ADDED. Every image this platform builds
  # is pinned per stage as a builds[] entry — {name, image, tag} in
  # clusters/inventories/<app>/values-<stage>.yaml — and the entry has to EXIST before the
  # release that writes its tag: the bump task rewrites the tag of an entry it
  # finds by `image` and creates none
  # (clusters/inventories/consumer-build/templates/pipeline-release.yaml, bump_file), and the
  # reach check at the end of that same task FAILS the release when a declared
  # image is carried by no pin at all. So a new application is added with its
  # entry already written in every values-<stage>.yaml, its tag THIS value, and
  # the first release of the unit that builds it writes the minted image tag
  # over it.
  # Until that release has run the value is refused where it would otherwise be
  # believed: clusters/charts/common common.buildTag stops the render naming the entry,
  # so nothing is scheduled against an image tag no release minted.
  placeholderTag: "0.0.0-placeholder"

  # ── Where this platform's own images are published ─────────────────────────
  # The registry namespace every builds[] pin composes its ref under. It is a
  # property of the PRODUCT and not of an installation — the same value on every
  # cluster, decided by where our releases are published — so it stands here on
  # the trunk rather than in endpoints below, which holds the addresses at which
  # ONE cluster reaches a service of THIS installation.
  #
  # THE PODS PULL IT DIRECTLY, and no longer through the cluster's own registry.
  # The images of the open-source repositories this platform is built from are
  # published to ghcr.io/<owner>/<build name> by release-images, the workflow that
  # runs on the release tag (hostyour-manager .github/workflows/release-images.yml),
  # and they are public — measured anonymously on 2026-08-28: manager,
  # gate-runner and dbtools each answer 200 to an unauthenticated manifest GET.
  # So a pull needs no credential and no cluster of ours in the path.
  #
  # WHAT STAYS ON zot IS WHAT IS BUILT IN A CLUSTER: every consumer and tenant
  # image the release pipeline builds, which is customer code and belongs on no
  # public registry. Those compose their ref from endpoints.registry.host
  # through `common.registryHost`, a different helper reached by a different
  # path, so nothing here touches them.
  buildRegistry: "ghcr.io/simetrixch"

  # ── Channel ceiling — the ONE literal table ────────────────────────────────
  # Which stages a release channel may reach. The channel is read FROM THE TAG
  # (the tag is the truth, not a parameter), and the rule is enforced at three
  # points. The gate-stage task of every <unit>-release Pipeline
  # (clusters/inventories/consumer-build/templates/pipeline-release.yaml) checks the
  # requested stage against this table BEFORE any clone, and the bump task
  # re-checks it before every pin write; both read it as the CHANNEL_STAGES
  # env var that same template renders from .Values.global.channelStages —
  # the values chain. A cluster release does NOT come that way, and it
  # enforces the ceiling BEFORE its writing point: the ceilingCheck of the
  # release run kind
  # (hostyour-manager/server/domains/runs/defs/release.ts) runs as
  # attest-target's own check and refuses the run before the set-pin step
  # commits `release:` into a cluster map. It reads this file off the trunk
  # through the controller's platform-repo git port — readChannelStages in
  # hostyour-manager/server/domains/inventory/channel-stages.ts — never a copy.
  # Nothing else carries a copy — a release script may check it locally as a
  # courtesy, but nothing relies on that.
  # It measures this repository only — the controller side named above is
  # another repository's file and is held to nothing from here.
  channelStages:
    alpha: [dev]
    beta: [dev, test]
    stable: [dev, test, prod]
