# clusters/platform/versions.yaml
# =============================================================================
# THE single source of truth for every platform component version — what each
# component IS: its pinned version, WHERE that pin is written, and WHERE its
# upstream lives.
#
# Edit a version HERE, then run the sync-versions program (ansiwise) — it
# stamps every `stamps:` site below. Review `git diff` in every stamped
# checkout, commit → ArgoCD (apps) / the deploy programs (bootstrap, cliTools)
# carry the change. The versions-upstream program reads the SAME entries and
# reports each pin against what its upstream serves now; both operations read
# this one file, so the writer and the reader cannot drift apart.
#
# Do NOT hand-edit the version fields in clusters/inventories/*/Chart.yaml,
# clusters/inventories/*/values-*.yaml, clusters/units/*/Chart.yaml or the deploy
# programs — they are stamped from this file. The stamp touches only the version
# token, so comments and formatting are preserved.
#
# THE GRAMMAR is the ansiwise-versions plugin's (its declaration.dart states it
# in full). What matters when editing:
#   version:   the pin, ALWAYS QUOTED — YAML would read 8.8 as a number and
#              26.04 as a number that lost its trailing zero.
#   sha256:    the digest of the file the pin fetches, where a site holds the
#              fetched file against one, quoted like the version: for an
#              image, the manifest its tag names, which the node then pulls by
#              digest. A stamp with `writes: sha256` writes it instead of the
#              version.
#   stamps:    every place the pin is written. `tree` is a LABEL the program
#              row maps to a checkout: `platform` is this repository, `deploy`
#              the installation repository carrying the ansiwise programs,
#              `manager` the manager repository beside this one. An `anchor` is
#              the exact trimmed line that opens the block the stamped key
#              stands in, and every site must match exactly once or the stamp
#              refuses — a stamp that cannot find its site never skips it.
#   upstream:  where the report asks. `git_tags` reads the tag list of the
#              project's Git repository and keeps the tags `matching` accepts
#              whole; where the pattern holds a group, the version is the first
#              group. A tag names SOURCE, so the report prints beside the value
#              that no artifact is known to be served for it. `chart_repository`
#              means: read the repository out of the Chart.yaml the
#              chart_dependency stamp names — the repository differs per chart
#              in ways that are easy to guess wrong, and the Chart.yaml is the
#              one place that knows.
#   note:      one line the report appends beside the upstream answer, for a
#              pin that is deliberate.
# =============================================================================

# Official upstream images run via our own clusters/charts/deployment (no Bitnami, no
# operator). The value is the container image tag of each app. Asked of the
# REGISTRY each image is actually pulled from: a project can tag a release with
# no image behind it, and a cluster runs the image. zot and headscale are the
# exception, because their registry is ghcr.io, which the report does not ask;
# they read the project's Git tags, and the report says beside the value that a
# tag is source and no image is known to be served for it.
images:
  # Argo CD's own cache. The chart defaults to an older tag, so the bootstrap values name it.
  argocd-redis:
    version: "8.10.2-alpine"
    upstream:
      kind: docker_hub
      image: library/redis
      matching: '^8\.[0-9]+\.[0-9]+-alpine$'
    stamps:
      - kind: yaml_value
        tree: platform
        file: clusters/bootstrap/argocd/values.tpl
        key: tag
        anchor: 'repository: ecr-public.aws.com/docker/library/redis'
  zot:
    version: "v2.1.22"
    sha256: "46f688dc26315a35a247e1784368829e66a67bf91de94c7d8d1645044fac1d5b"
    upstream:
      kind: git_tags
      project: project-zot/zot
      matching: '^v[0-9]+\.[0-9]+\.[0-9]+$'
    stamps:
      - kind: yaml_value
        tree: platform
        file: clusters/inventories/registry/values-common.yaml
        key: tag
        anchor: 'repository: zot.master.digitacloud.app/simetrixch/ghcr.io/project-zot/zot-linux-amd64'
      - kind: yaml_value
        tree: platform
        file: clusters/inventories/registry/values-common.yaml
        key: sha256
        anchor: 'repository: zot.master.digitacloud.app/simetrixch/ghcr.io/project-zot/zot-linux-amd64'
        writes: sha256
      - kind: yaml_value
        tree: platform
        file: clusters/inventories/registry/Chart.yaml
        key: appVersion
  dbgate:
    version: "7.2.3"
    upstream:
      kind: docker_hub
      image: dbgate/dbgate
      matching: '^[0-9]+\.[0-9]+\.[0-9]+$'
    stamps:
      - kind: yaml_value
        tree: platform
        file: clusters/inventories/dbgate/values-common.yaml
        key: tag
        anchor: 'repository: dbgate/dbgate'
      # Chart.yaml's own appVersion, stamped so it cannot contradict the image
      # this chart runs — it said 7.2.1 while the pin was 7.2.3. It reaches no
      # rendered object: this chart has no template of its own, and the charts it
      # composes declare their own appVersion.
      - kind: yaml_value
        tree: platform
        file: clusters/inventories/dbgate/Chart.yaml
        key: appVersion
  # Tailnet coordination server. Only this half of the tailnet is an image —
  # the client on each host is a CLI tool the installer places, pinned under
  # cliTools below.
  headscale:
    version: "v0.29.2"
    sha256: "d337f1be4a9155b330aa9077bf6c82d24ff0581b8e69390ebc6d7c623bb339ce"
    upstream:
      kind: git_tags
      project: juanfont/headscale
      matching: '^v[0-9]+\.[0-9]+\.[0-9]+$'
    stamps:
      - kind: yaml_value
        tree: platform
        file: clusters/inventories/headscale/values-common.yaml
        key: tag
        anchor: 'repository: zot.master.digitacloud.app/simetrixch/ghcr.io/juanfont/headscale'
      - kind: yaml_value
        tree: platform
        file: clusters/inventories/headscale/values-common.yaml
        key: sha256
        anchor: 'repository: zot.master.digitacloud.app/simetrixch/ghcr.io/juanfont/headscale'
        writes: sha256
      - kind: yaml_value
        tree: platform
        file: clusters/inventories/headscale/Chart.yaml
        key: appVersion
  # In-house datastores — official images via clusters/charts/deployment (mongodb:
  # own StatefulSet templates); the Bitnami-chart era is fully migrated out.
  #
  # postgresql is the ONE values.yaml here, not values-common.yaml: it is no
  # longer a stage-deployed cluster app but a per-unit template, and such a
  # chart is rendered off its implicit Helm values.yaml.
  #
  # The dump/restore clients must speak to the servers pinned here: the
  # MongoDB apt-repo series is the server's <major>.<minor> and the PostgreSQL
  # client major the server's <major>, which is what the two dockerfile_arg
  # stamps into the manager's dbtools image cut with `segments`. That image
  # builds in the manager repository because its caller lives there; it cannot
  # read this file across the repository boundary, and a copy there would be a
  # second source for a version that must have exactly one — so the values are
  # stamped in from here.
  postgres:
    version: "18.4"
    upstream:
      kind: docker_hub
      image: library/postgres
      matching: '^1[0-9]+\.[0-9]+$'
    stamps:
      - kind: yaml_value
        tree: platform
        file: clusters/units/postgresql/values.yaml
        key: tag
        anchor: 'repository: postgres'
      - kind: dockerfile_arg
        tree: manager
        file: plugins/unit/docker/dbtools.Dockerfile
        argument: PG_MAJOR
        segments: 1
  # Plane's bundled PostgreSQL, Valkey, RabbitMQ, object store and its bucket client, one entry each
  # and none of them the units' `postgres` above. The plane-ce chart reads each image as ONE string,
  # repository and tag, so no stamp writes it: the version is written BY HAND in
  # clusters/inventories/plane/values-common.yaml, as `image:` under `plane-ce.postgres`,
  # `plane-ce.redis`, `plane-ce.rabbitmq` and `plane-ce.minio`, and as `image_mc:` under
  # `plane-ce.minio`. Nothing holds the two files to each other but scripts/plane.test.mjs, in the push
  # gate; a bump edits both.
  # The entries carry `upstream` so the report shows how far each has fallen behind.
  plane-postgres:
    version: "18.6-alpine"
    upstream:
      kind: docker_hub
      image: library/postgres
      matching: '^18\.[0-9]+-alpine$'
  plane-redis:
    version: "9.1.2-alpine"
    upstream:
      kind: docker_hub
      image: valkey/valkey
      matching: '^9\.[0-9]+\.[0-9]+-alpine$'
  plane-rabbitmq:
    version: "4.3.6-management-alpine"
    upstream:
      kind: docker_hub
      image: library/rabbitmq
      matching: '^4\.[0-9]+\.[0-9]+-management-alpine$'
  plane-silo:
    version: "RELEASE.2026-10-18T00-00-00Z"
    upstream:
      kind: docker_hub
      image: pgsty/silo
      matching: '^RELEASE\.[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}Z$'
  plane-mc:
    version: "RELEASE.2026-10-18T00-00-00Z"
    upstream:
      kind: docker_hub
      image: pgsty/mc
      matching: '^RELEASE\.[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}Z$'
  # THIS PIN PROTECTS NOTHING. Measured by
  # probing the images: neither the entrypoint nor the mongod binary of 8.0.4,
  # 8.0.28 or 8.2 carries a kernel check. The refusal that circulates comes from
  # a third-party image. So the official image does not decline on an affected
  # kernel — it starts, serves for about thirty seconds, and segfaults, in a
  # cycle, accepting writes in between.
  #
  # The fault is real here. Every machine is Ubuntu 26.04, whose kernel is 7.0.0:
  # the package version 7.0.0-28.28 is <upstream>-<abi>.<upload>, so it is 7.0.0
  # and not 7.0.28. MongoDB's vendored TCMalloc and kernels 6.19 through 7.0.13
  # disagree over rseq; 7.0.14 and later resolve it. Every 8.0.x vendors the same
  # TCMalloc, so 8.0.4 crashes exactly like 8.0.28 — the pin only costs us
  # twenty-four releases of fixes. An image carries no kernel; it shares the
  # machine's, so no image choice avoids this.
  #
  # The blocker is the KERNEL, not the version, so no raise fixes it. Ubuntu
  # offers nothing newer for 26.04 — the GA and hardware-enablement stacks are
  # both on 7.0, and the next bump arrives with 26.04.2 — so a kernel of 7.0.14
  # or later means a mainline one. The cheaper mitigation is
  # GLIBC_TUNABLES=glibc.pthread.rseq=1 on the Deployment, reported to stop the
  # segfault at the cost of allocation performance; it belongs in clusters/inventories/mongodb,
  # not here, and it comes out when the kernel moves.
  #
  # Watch mongod by hand for two minutes on the first install. Nothing here does
  # it: the probes in clusters/inventories/mongodb are ordinary 10- and 15-second ones, and a
  # process that serves for half a minute and then segfaults passes them on the
  # way past. A restart count climbing on its own IS this defect.
  mongodb:
    # THE TAG CARRIES THE DIGEST OF ITS linux/amd64 MANIFEST, so a pull asks the registry mirror
    # (zot) for that one manifest and never for the index. Docker Hub's index for this image mixes
    # OCI manifests with Docker-v2 manifests for Windows, and zot commits such an index only while
    # clusters/inventories/registry accepts Docker v2 schema 2 (http.compat): without it zot refuses
    # it as "invalid manifest content", and a pull by tag never arrives on a slave. Measured with
    # zot v2.1.18 and compat on: the index of 8.0.4 syncs and is served by tag.
    # The digest moves with the tag: read it off the index's linux/amd64 entry when this moves.
    version: "8.0.4@sha256:6b0f3b8898c09d1d15753978cd8a733834f692d70aa3d424f680bccd2896f6a1"
    note: pinned deliberately until the kernel moves — see the comment above this entry
    upstream:
      kind: docker_hub
      image: library/mongo
      matching: '^[0-9]+\.[0-9]+\.[0-9]+$'
    stamps:
      - kind: yaml_value
        tree: platform
        file: clusters/inventories/mongodb/values-common.yaml
        key: tag
        anchor: 'repository: mongo'
      - kind: yaml_value
        tree: platform
        file: clusters/units/mongodb/values.yaml
        key: tag
        anchor: 'repository: mongo'
      - kind: dockerfile_arg
        tree: manager
        file: plugins/unit/docker/dbtools.Dockerfile
        argument: MONGO_SERIES
        segments: 2
  redis:
    version: "8.8"
    upstream:
      kind: docker_hub
      image: library/redis
      matching: '^[0-9]+\.[0-9]+$'
    stamps:
      - kind: yaml_value
        tree: platform
        file: clusters/inventories/redis/values-common.yaml
        key: tag
        anchor: 'repository: redis'
      - kind: yaml_value
        tree: platform
        file: clusters/units/redis/values.yaml
        key: tag
        anchor: 'repository: redis'
      - kind: dockerfile_arg
        tree: manager
        file: plugins/unit/docker/dbtools.Dockerfile
        argument: REDIS_SERIES
        segments: 2
  # The Git server on the master. The chart (charts.forgejo below) runs its own appVersion when the
  # values name no tag, so the image is pinned here and written beside `rootless: true`, which makes
  # the chart append -rootless to the tag. The pin is the tag alone: the chart's image.digest needs
  # the sha256: form, which `writes: sha256` does not write.
  forgejo:
    version: "17.0.0"
    upstream:
      kind: oci_tags
      host: code.forgejo.org
      image: forgejo/forgejo
      matching: '^17\.0\.[0-9]+$'
    stamps:
      - kind: yaml_value
        tree: platform
        file: clusters/inventories/forgejo/values-common.yaml
        key: tag
        anchor: 'rootless: true'
  # A consumer's own MariaDB (clusters/units/mariadb) and the Manager's dump and restore client
  # beside it, on the long-term-support line mariadb.org names (12.3 on 2026-10-05). The upstream
  # report also lists the newer rolling lines; moving to one is a decision, not a sync.
  mariadb:
    version: "12.3"
    upstream:
      kind: docker_hub
      image: library/mariadb
      matching: '^1[0-9]+\.[0-9]+$'
    stamps:
      - kind: yaml_value
        tree: platform
        file: clusters/units/mariadb/values.yaml
        key: tag
        anchor: 'repository: mariadb'
      - kind: dockerfile_arg
        tree: manager
        file: plugins/unit/docker/dbtools.Dockerfile
        argument: MARIADB_SERIES
        segments: 2
  # The interpreter clusters/inventories/service-provisioner runs its reconciler on. Not a
  # product of its own: the chart mounts the reconciler as a ConfigMap and the
  # container pip-installs the client libraries at boot, so this pin decides
  # which Python every ServiceClaim on this platform is resolved by. The site statistics
  # service of clusters/inventories/observability is mounted the same way and runs on the same pin.
  python:
    version: "3.12-slim"
    upstream:
      kind: docker_hub
      image: library/python
      matching: '^3\.[0-9]+-slim$'
    stamps:
      - kind: yaml_value
        tree: platform
        file: clusters/inventories/service-provisioner/values-common.yaml
        key: tag
        anchor: 'repository: python'
      - kind: yaml_value
        tree: platform
        file: clusters/inventories/observability/values-common.yaml
        key: tag
        anchor: 'repository: python'

# Upstream Helm charts wrapped by a Chart.yaml under clusters/inventories/ or
# clusters/units/ (dependency versions).
# Every upstream here is `git_tags`, except forgejo's: the report reads the tag
# list of the repository the chart is cut in, never the chart's own repository,
# which is a Pages site or a ghcr.io registry. Each `matching` captures the
# version the pin spells out of the tag the project cuts for the chart:
# <chart>-<version> in a repository that holds several charts, v<version> in one
# that holds one. forgejo stays `chart_repository`: the report reads the
# repository out of the very Chart.yaml the stamp writes (oci://code.forgejo.org),
# named exactly once, where Helm itself reads it.
charts:
  # VENDORED: clusters/inventories/external-secrets/charts/<chart>-<version>.tgz, held by its line in
  # clusters/platform/charts.sha256. A bump stamps the version, and scripts/check.sh stays red until the
  # archive of that version replaces the old one and its line is rewritten. The chart is pulled from the registry
  # ghcr.io/external-secrets/charts, as the oci address <registry>/external-secrets with the scheme in front:
  #   helm pull oci://<registry>/external-secrets --version <version> -d clusters/inventories/external-secrets/charts/
  #   git rm clusters/inventories/external-secrets/charts/external-secrets-<old version>.tgz
  #   sha256sum clusters/inventories/external-secrets/charts/external-secrets-<version>.tgz
  # The new line is the sha256 of the chart layer of that tag's manifest on ghcr.io and of the release asset
  # helm-chart-<version>/external-secrets-<version>.tgz; both are read before the line is committed.
  external-secrets:
    version: "2.8.0"
    upstream:
      kind: git_tags
      project: external-secrets/external-secrets
      # The chart is published to the registry ghcr.io/external-secrets/charts, which has no
      # index; its source repository tags every chart release helm-chart-<version>.
      matching: '^helm-chart-([0-9]+\.[0-9]+\.[0-9]+)$'
    stamps:
      - kind: chart_dependency
        tree: platform
        file: clusters/inventories/external-secrets/Chart.yaml
        dependency: external-secrets
  forgejo:
    version: "17.3.0"
    upstream:
      kind: chart_repository
    stamps:
      - kind: chart_dependency
        tree: platform
        file: clusters/inventories/forgejo/Chart.yaml
        dependency: forgejo
  # VENDORED, PATCHED, UNPACKED: clusters/inventories/plane/charts/plane-ce is the upstream chart plus
  # clusters/inventories/plane/vendor/plane-ce-<version>.patch, which names the chart's two Jobs by a hash of
  # the images they run, where the chart names them by the Helm release revision (Argo CD renders it as 1
  # every time, so a new Plane version never got a new migration Job). The folder stands unpacked because the
  # plane chart also depends on charts of this repository, and Helm takes a dependency without a repository
  # only as a folder. A bump stamps the version into Chart.yaml, and scripts/check.sh stays red until the folder
  # follows. The chart is pulled from the chart repository helm.plane.so, as the address <repository> with the
  # https scheme in front:
  #   helm pull plane-ce --repo <repository> --version <version> -d <folder>
  #   curl -fsS <repository>/index.yaml
  # The sha256 of the pulled archive is the `digest:` of the plane-ce entry at <version> in that index:
  #   echo "<digest>  <folder>/plane-ce-<version>.tgz" | sha256sum --check
  # The archive of 1.8.5 has the digest 9d68ae1eb2d9e1a6181d1779063fa7feb949fcd48de31b2df4d847ea1eece755. That
  # hex is declared here, and no check reads it. To prove it again: pull the archive, check it against the digest
  # of the index, unpack it, and run `sha256sum --check --strict` of vendor/plane-ce-1.8.5.upstream.sha256 in the
  # unpacked folder once its README.md is deleted, which scripts/check-mirror-consumers.sh would refuse for the
  # upstream addresses it names, and which holds the list of files to upstream. Then, for the new version:
  #   delete README.md from the unpacked archive, write vendor/plane-ce-<version>.upstream.sha256 from it, one line
  #     per file (find plane-ce -type f | sort | xargs sha256sum), and unpack it into clusters/inventories/plane/charts/
  #   patch -p1 < the old patch file, run inside charts/ (a hunk that no longer applies means upstream moved)
  #   write the patch file anew as vendor/plane-ce-<version>.patch, and git rm the old folder and the old vendor files
  # scripts/check.sh stays red until all of it is done together.
  plane-ce:
    version: "1.8.5"
    upstream:
      kind: git_tags
      project: makeplane/helm-charts
      # helm.plane.so is a CNAME to makeplane.github.io; the chart's tag is of
      # makeplane/helm-charts, which holds several charts.
      matching: '^plane-ce-([0-9]+\.[0-9]+\.[0-9]+)$'
    stamps:
      - kind: chart_dependency
        tree: platform
        file: clusters/inventories/plane/Chart.yaml
        dependency: plane-ce
  kube-prometheus-stack:
    version: "87.21.0"
    upstream:
      kind: git_tags
      project: prometheus-community/helm-charts
      matching: '^kube-prometheus-stack-([0-9]+\.[0-9]+\.[0-9]+)$'
    stamps:
      - kind: chart_dependency
        tree: platform
        file: clusters/inventories/observability/Chart.yaml
        dependency: kube-prometheus-stack
  loki:
    version: "18.7.0"
    upstream:
      kind: git_tags
      project: grafana-community/helm-charts
      matching: '^loki-([0-9]+\.[0-9]+\.[0-9]+)$'
    stamps:
      - kind: chart_dependency
        tree: platform
        file: clusters/inventories/observability/Chart.yaml
        dependency: loki
  tempo:
    version: "2.2.3"
    upstream:
      kind: git_tags
      project: grafana-community/helm-charts
      matching: '^tempo-([0-9]+\.[0-9]+\.[0-9]+)$'
    stamps:
      - kind: chart_dependency
        tree: platform
        file: clusters/inventories/observability/Chart.yaml
        dependency: tempo
  # alloy is declared in TWO charts. Both sites are stamped from the one key,
  # or a raise moves one and strands the other.
  alloy:
    version: "1.11.0"
    upstream:
      kind: git_tags
      project: grafana/helm-charts
      matching: '^alloy-([0-9]+\.[0-9]+\.[0-9]+)$'
    stamps:
      - kind: chart_dependency
        tree: platform
        file: clusters/inventories/observability/Chart.yaml
        dependency: alloy
      - kind: chart_dependency
        tree: platform
        file: clusters/inventories/observability-agent/Chart.yaml
        dependency: alloy
  # The upstream chart is named `mail` in the Chart.yaml that wraps it — the
  # dependency below is what couples this key to that name, for the stamp and
  # the report alike.
  postfix-mail:
    version: "5.1.0"
    upstream:
      kind: git_tags
      project: bokysan/docker-postfix
      # The chart is served from bokysan.github.io/docker-postfix (a Pages file,
      # mail-<version>.tgz); its tag, v<version>, is of the chart's source repository.
      matching: '^v([0-9]+\.[0-9]+\.[0-9]+)$'
    stamps:
      - kind: chart_dependency
        tree: platform
        file: clusters/inventories/postfix/Chart.yaml
        dependency: mail
  prometheus-postgres-exporter:
    version: "8.2.0"
    upstream:
      kind: git_tags
      project: prometheus-community/helm-charts
      matching: '^prometheus-postgres-exporter-([0-9]+\.[0-9]+\.[0-9]+)$'
    stamps:
      - kind: chart_dependency
        tree: platform
        file: clusters/units/postgresql/Chart.yaml
        dependency: prometheus-postgres-exporter
  prometheus-mongodb-exporter:
    version: "3.20.0"
    upstream:
      kind: git_tags
      project: prometheus-community/helm-charts
      matching: '^prometheus-mongodb-exporter-([0-9]+\.[0-9]+\.[0-9]+)$'
    stamps:
      - kind: chart_dependency
        tree: platform
        file: clusters/inventories/mongodb/Chart.yaml
        dependency: prometheus-mongodb-exporter
      - kind: chart_dependency
        tree: platform
        file: clusters/units/mongodb/Chart.yaml
        dependency: prometheus-mongodb-exporter
  prometheus-redis-exporter:
    version: "6.28.0"
    upstream:
      kind: git_tags
      project: prometheus-community/helm-charts
      matching: '^prometheus-redis-exporter-([0-9]+\.[0-9]+\.[0-9]+)$'
    stamps:
      - kind: chart_dependency
        tree: platform
        file: clusters/inventories/redis/Chart.yaml
        dependency: prometheus-redis-exporter
  prometheus-mysql-exporter:
    version: "2.15.0"
    upstream:
      kind: git_tags
      project: prometheus-community/helm-charts
      matching: '^prometheus-mysql-exporter-([0-9]+\.[0-9]+\.[0-9]+)$'
    stamps:
      - kind: chart_dependency
        tree: platform
        file: clusters/units/mariadb/Chart.yaml
        dependency: prometheus-mysql-exporter
  # The push agent a cluster without the master part runs; the receiving
  # side is kube-prometheus-stack above, which carries its own copy.
  kube-state-metrics:
    version: "8.0.0"
    upstream:
      kind: git_tags
      project: prometheus-community/helm-charts
      matching: '^kube-state-metrics-([0-9]+\.[0-9]+\.[0-9]+)$'
    stamps:
      - kind: chart_dependency
        tree: platform
        file: clusters/inventories/observability-agent/Chart.yaml
        dependency: kube-state-metrics

# Bootstrap components installed by the deploy programs (NOT ArgoCD-managed).
# Their pins live as literals in the program rows that install them — a
# program file computes nothing, so the stamp writes the literal and the
# fingerprint of the program changes with the pin, which is exactly what makes
# a re-run of a changed program need a fresh dry run.
bootstrap:
  # argo-cd is installed by the bootstrap AND declared in clusters/slaves/slave/Chart.yaml
  # (the namespaced instance a cluster without the master part runs). Both
  # sites are stamped from this one key, so master + slave stay on one chart
  # version and ONE set of CRDs fits both. The report reads the tags of
  # argoproj/argo-helm, the repository the chart is cut in; the program's
  # release names the chart in the owner's mirror.
  argocd:
    version: "10.10.5"
    upstream:
      kind: git_tags
      project: argoproj/argo-helm
      matching: '^argo-cd-([0-9]+\.[0-9]+\.[0-9]+)$'
    stamps:
      - kind: chart_dependency
        tree: platform
        file: clusters/slaves/slave/Chart.yaml
        dependency: argo-cd
      - kind: yaml_value
        tree: deploy
        file: ansiwise/programs/deploy-platform-services.yaml
        key: chart_version
        anchor: 'release: argocd'
  vault:
    version: "0.34.0"
    upstream:
      kind: helm_index
      repository: https://helm.releases.hashicorp.com
      chart: vault
    stamps:
      - kind: yaml_value
        tree: deploy
        file: ansiwise/programs/deploy-platform-services.yaml
        key: chart_version
        anchor: 'release: vault'
  # The release is named `idp` in the program, the chart is authentik
  # (CalVer == app version). The report reads the tags of goauthentik/helm,
  # where the index of charts.goauthentik.io points every chart.
  authentik:
    version: "2026.5.6"
    upstream:
      kind: git_tags
      project: goauthentik/helm
      matching: '^authentik-([0-9]+\.[0-9]+\.[0-9]+)$'
    stamps:
      - kind: yaml_value
        tree: deploy
        file: ansiwise/programs/deploy-platform-services.yaml
        key: chart_version
        anchor: 'release: idp'
  # The cluster UI the bootstrap installs beside the reconciler.
  headlamp:
    version: "0.46.0"
    upstream:
      kind: git_tags
      project: kubernetes-sigs/headlamp
      matching: '^headlamp-helm-([0-9]+\.[0-9]+\.[0-9]+)$'
    stamps:
      - kind: yaml_value
        tree: deploy
        file: ansiwise/programs/deploy-platform-services.yaml
        key: chart_version
        anchor: 'release: headlamp'
  # 1.35, NOT the newest channel. Owner's decision: 1.36 breaks on Ubuntu 26.04
  # and has to be rolled back. Raise this only after
  # a rehearsal cluster on 26.04 comes up clean; it is a decision, not a lag.
  # (The channel also drives cert-manager + Traefik addons.)
  microk8s:
    version: "1.35/stable"
    note: raise only after a rehearsal cluster on the pinned Ubuntu comes up clean
    upstream:
      kind: snap_channel
      snap: microk8s
    stamps:
      - kind: yaml_value
        tree: deploy
        file: ansiwise/programs/deploy-cluster.yaml
        key: channel
        anchor: '- step: install_snap'

# The Ubuntu release every host runs. Nothing here installs it — it is the
# ground the pins above stand on: the microk8s channel is proven on exactly
# this release (1.36 breaks on it, see its note), and the mongodb note above
# describes this release's kernel. The installer reads this value in its
# preflight and refuses any other release before its first write. No stamps
# and no upstream, on purpose: nothing carries this pin but the preflight that
# reads it here, and a newer Ubuntu is never a bump but a rehearsal.
ubuntu:
  version: "26.04"
  note: the ground the pins stand on — nothing installs it, the preflight reads it here

# Base images of the images this platform BUILDS. These never reach a cluster:
# they are the ground a build stands on. A raise here is felt at the next
# build, not at the next sync.
baseImages:
  # 12-slim (bookworm), NOT 13. MEASURED: on trixie the build dies
  # with "Unable to locate package mongodb-database-tools" — MongoDB's apt repo
  # answers for the trixie suite but carries no packages for the 8.0 series
  # there, so a reachable repository is not a usable one. Raise this once
  # MongoDB publishes the series for trixie, and rebuild the image to prove it.
  debian:
    version: "12-slim"
    note: 12-slim until MongoDB publishes its series for the newer suite — see the comment above
    upstream:
      kind: docker_hub
      image: library/debian
      matching: '^[0-9]+-slim$'
    stamps:
      - kind: dockerfile_from
        tree: manager
        file: plugins/unit/docker/dbtools.Dockerfile
        image: library/debian

# The SDKs our own source is BUILT with. Neither an image nor a tool on a host:
# a toolchain is what a build machine compiles against, and the binary that
# comes out is whatever that toolchain made of the same commit.
toolchains:
  # The client's own pubspec states `flutter: ^3.44.0` under `environment:`, and
  # that is the LOWEST SDK the package accepts, not a pin — every Flutter at or
  # above it satisfies the constraint, so two machines building one commit
  # produce two different binaries and neither is wrong. This key is what
  # decides which one.
  #
  # 3.47.1 is the stable release of 2026-08-19, and it ships Dart 3.13.1, which
  # the client's `sdk: ^3.12.0` accepts. MEASURED from the channel
  # Flutter publishes to, never recalled:
  # https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json
  # — its `current_release.stable` names a commit hash, and the entry in its
  # `releases` list carrying that hash states the version, the release date and
  # the Dart SDK inside it.
  #
  # NO `upstream:`, because none of the grammar's kinds can ask that channel and
  # the near miss would lie. Measured the same way: the GitHub Releases feed of
  # flutter/flutter answers "3.19.0-0.1.pre" of 11 January 2024 — the newest
  # release that feed carries, since the project stopped publishing there — so
  # declaring it would print an upstream many minor versions BEHIND the pin and
  # invite a downgrade. The report answers "?" with the reason instead,
  # which is a finding about the report and not about the pin.
  #
  # THE SITE IS ansiwise-client/tool/ci.dart, and this entry stamps nowhere, so
  # the report says "(stamped nowhere)" and it is right. The client's release
  # workflow is NOT the site: .github/workflows/release.yml states no
  # version at all — its `read the pinned Flutter version` step reads
  # `const String flutterVersion` out of tool/ci.dart and hands it to the Flutter
  # action — so the client has ONE spelling and that Dart constant is it.
  #
  # A `stamps:` site for it needs two things that are not this file's to decide,
  # and until both stand the entry carries none: the stamp is whole or nothing
  # (sync-versions states `on_failure: exit`), so ONE site nothing can write
  # stops every other pin in this file from being written at all.
  #   * a stamp kind that writes a Dart constant. The grammar has five —
  #     yaml_value, chart_dependency, list_pin, dockerfile_from, dockerfile_arg —
  #     and the ansiwise-versions plugin switches over exactly those, so a
  #     `dart_constant` kind is a plugin change.
  #   * a fourth tree label. The sync-versions row maps platform, deploy and
  #     manager; the client is a fourth checkout, and a stamp into a label the row
  #     does not map is refused rather than skipped.
  #
  # Until then ansiwise-client's tool/flutter_pin.dart is what refuses a drift,
  # on the client's side; this line is stated here and held nowhere.
  flutter:
    version: "3.47.2"
    note: |
      Read by hand from the Flutter release channel on 2026-09-03 — no upstream
      kind can ask it. A pin is for reproducing a build and not for being current:
      ansiwise-client/tool/ci.dart refuses every SDK but the pinned one, so a
      version nobody has installed turns that gate red everywhere. 3.47.2 is the
      one the client is built and tested with, and it moves only together with
      that constant. versions-upstream never fails on this line.

# CLI tools installed to /usr/local/bin on every host. They were fetched as
# "latest" until they were pinned here: two hosts installed a month apart got
# different tools and neither could be reproduced. Each pin is stamped into
# the install row of deploy-cluster AND into the assert list at the end of its
# tool phase, from this one key. The upstream of each is the tag list of its
# project's Git repository. The install fetches the release file of that tag, and
# a tag names source, so the report prints beside the value that no artifact is
# known to be served for it.
#
# EVERY TOOL AN install_pinned_tool ROW FETCHES CARRIES THE SHA-256 OF THAT
# FILE, stamped into the same row: argocd, vault, yq and jq. The row removes a
# fetched file whose digest differs before it reaches /usr/local/bin, so a bump
# moves the version and the digest together, and a version moved alone fails
# that row on every machine that fetches it. The digest is read off the list
# each project publishes beside the release: argocd cli_checksums.txt, vault
# vault_<version>_SHA256SUMS (the digest of the zip, which is what the row
# fetches), yq checksums (the SHA-256 column, per checksums_hashes_order), jq
# sha256sum.txt. tailscale carries none: it comes from its package
# repository. The engine carries one for each of its two executables, beside
# this file (cliTools.ansiwise says where and who writes it).
cliTools:
  argocd:
    version: "v3.5.5"
    sha256: "c3ddfa606fc3e89ab14f55bda6600b207c355b028f8eaabe69b817a4c4621aba"
    upstream:
      kind: git_tags
      project: argoproj/argo-cd
      # Stable only. Read off the Git tags: every stable is vX.Y.Z and every
      # candidate carries a suffix the stable shape has no room for — v3.6.0-rc1,
      # -rc2, -rc3 stand in the list before v3.6.0 does. The same list holds
      # gitops-engine/v3.6.0-rc1 and a moving `stable` tag, which the anchors keep
      # out too. Without them a candidate sorts above the stable it precedes and
      # reads as a version to bump to.
      matching: '^v[0-9]+\.[0-9]+\.[0-9]+$'
    stamps:
      - kind: yaml_value
        tree: deploy
        file: ansiwise/programs/deploy-cluster.yaml
        key: version
        anchor: 'tool: argocd'
      - kind: yaml_value
        tree: deploy
        file: ansiwise/programs/deploy-cluster.yaml
        key: sha256
        anchor: 'tool: argocd'
        writes: sha256
      - kind: list_pin
        tree: deploy
        file: ansiwise/programs/deploy-cluster.yaml
        anchor: 'tools:'
        entry: argocd
  vault:
    version: "v2.0.3"
    sha256: "1e0ffb7a82491219c7242da6e05e2d756b05d1097c29799a42228661f229bc2a"
    upstream:
      kind: hashicorp_release
      product: vault
    stamps:
      - kind: yaml_value
        tree: deploy
        file: ansiwise/programs/deploy-cluster.yaml
        key: version
        anchor: 'tool: vault'
      - kind: yaml_value
        tree: deploy
        file: ansiwise/programs/deploy-cluster.yaml
        key: sha256
        anchor: 'tool: vault'
        writes: sha256
      - kind: list_pin
        tree: deploy
        file: ansiwise/programs/deploy-cluster.yaml
        anchor: 'tools:'
        entry: vault
  yq:
    version: "v4.53.3"
    sha256: "fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4"
    upstream:
      kind: git_tags
      project: mikefarah/yq
      # The v-prefixed stables. Read off the Git tags: every tag carrying this
      # shape is a stable and the refused tags are UNPREFIXED (1.12, 2.0-beta,
      # 4.0.0-alpha2, 4.0.0-beta2), the era this project left behind, or are not
      # versions at all (v3, v4, vTestA, vTestB). The leading `v` and the three
      # numbers together separate them, which is why nothing else has to.
      matching: '^v[0-9]+\.[0-9]+\.[0-9]+$'
    stamps:
      - kind: yaml_value
        tree: deploy
        file: ansiwise/programs/deploy-cluster.yaml
        key: version
        anchor: 'tool: yq'
      - kind: yaml_value
        tree: deploy
        file: ansiwise/programs/deploy-cluster.yaml
        key: sha256
        anchor: 'tool: yq'
        writes: sha256
      - kind: list_pin
        tree: deploy
        file: ansiwise/programs/deploy-cluster.yaml
        anchor: 'tools:'
        entry: yq
  # upstream tags its releases jq-<version>, and the pin is written in that
  # same shape so the assert can hold the two against each other.
  jq:
    version: "jq-1.8.2"
    sha256: "b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f"
    upstream:
      kind: git_tags
      project: jqlang/jq
      # THE PATCH NUMBER IS OPTIONAL, and that is measured rather than defensive.
      # Read off the Git tags: this project publishes stables
      # with two numbers as readily as with three — jq-1.7, jq-1.6, jq-1.5,
      # jq-1.4, jq-1.3, jq-1.2, jq-1.1 and jq-1.0 stand beside jq-1.8.2, jq-1.8.1,
      # jq-1.8.0 and jq-1.7.1. A pattern demanding three would refuse the next
      # jq-1.9 and go on reporting jq-1.8.2 as current with a newer stable in the
      # list it just read. The candidates are jq-1.7rc1, jq-1.7rc2, jq-1.5rc1,
      # jq-1.5rc2 and jq-1.8.2rc1, which append `rc<n>` with no separator, so
      # ending the pattern after the numbers is what keeps them out.
      #
      # THE GROUP IS NON-CAPTURING, because the version a tag stands for is the
      # first group when the pattern holds one: a capturing patch group would read
      # jq-1.8.2 as `.2` and skip jq-1.7, whose group is empty. With no group the
      # version is the whole tag, which is how the pin is spelled.
      matching: '^jq-[0-9]+\.[0-9]+(?:\.[0-9]+)?$'
    stamps:
      - kind: yaml_value
        tree: deploy
        file: ansiwise/programs/deploy-cluster.yaml
        key: version
        anchor: 'tool: jq'
      - kind: yaml_value
        tree: deploy
        file: ansiwise/programs/deploy-cluster.yaml
        key: sha256
        anchor: 'tool: jq'
        writes: sha256
      - kind: list_pin
        tree: deploy
        file: ansiwise/programs/deploy-cluster.yaml
        anchor: 'tools:'
        entry: jq
  # The client half of the tailnet; the server is images.headscale.
  tailscale:
    version: "v1.102.4"
    upstream:
      kind: git_tags
      project: tailscale/tailscale
      # Read off the Git tags. Three shapes are not vX.Y.Z and each is one
      # this pin must not see: cmd/cigocacher/<sha>, a tag cut for one
      # sub-command; v0.100.0-153, a build-numbered tag of the 0.x era; and v0.98,
      # which has two numbers. Nothing here narrows to tailscale's own
      # stable/unstable convention — even minor stable, odd minor unstable —
      # because the v1 minors this list carries are even, apart from the old
      # v1.1.0, which sorts far below the pin. A pattern refusing odd minors
      # would state a rule this list does not exercise.
      matching: '^v[0-9]+\.[0-9]+\.[0-9]+$'
    stamps:
      - kind: yaml_value
        tree: deploy
        file: ansiwise/programs/deploy-cluster.yaml
        key: version
        anchor: '- step: install_tailscale_client'
      - kind: list_pin
        tree: deploy
        file: ansiwise/programs/deploy-cluster.yaml
        anchor: 'tools:'
        entry: tailscale
  # The deployment engine itself — the binary that is executing deploy-cluster
  # while deploy-cluster fetches the tools of this block, now held to a pin like
  # every one of them.
  #
  # WHO PUTS IT ON A MACHINE FIRST, and it is one mechanism in two callers:
  # the client places it on a master over SSH, and
  # place-ansiwise places it on a slave. Both write
  # /usr/local/bin/ansiwise-<version> and link /usr/local/bin/ansiwise at it. The
  # install row the stamps below write is what keeps it AT the pin afterwards; it
  # replaces the file the link points at while a run of this very program is in
  # flight, which is safe because a running process keeps the inode it started
  # from and the next invocation is the new binary.
  #
  # THE RELEASE CARRIES TWO EXECUTABLES and one pin names both:
  # ansiwise-<tag>-linux-x64 and ansiwise-rest-<tag>-linux-x64 are built from one
  # tag, and ansiwise-rest starts a run by invoking the ansiwise standing in its
  # own directory — with none there it exits 78 at start rather than at the first
  # request (ansiwise-cli bin/ansiwise_rest.dart, deploymentToolBesideThis). Only
  # ansiwise is stamped, because only ansiwise has a site: the install row for the
  # REST binary is deliberately absent, since replacing the file a service was
  # started from leaves that service on the old code until its unit is restarted,
  # and no step of the framework restarts one. The install row states that in full.
  #
  # WHO ELSE READS THIS PIN, with no stamp between them and it: hostyour-manager
  # server/domains/inventory/ansiwise-pin.ts reads cliTools.ansiwise.version off
  # this repository over git before it touches a machine, and lifecycle/driver.sh
  # and lifecycle/regenerate-driver.sh read the same key off
  # raw.githubusercontent.com before they fetch either binary. None has a
  # default — a placement that guessed a version would put one on a machine that
  # no file states.
  #
  # The version is a whole release tag and not three numbers, because the
  # grammar is the platform's own — hostyour-manager/shared/release.ts,
  # <major>.<minor>.<patch>-<channel>-<ts14> — and the release, the artefact and
  # the download address are all named by it. Nothing takes a prefix off it:
  # deploy-cluster's `pin_prefixes` strips at most one of `v` or `jq-` before
  # comparing, and a tag that begins with a digit loses nothing, so the whole tag
  # is what the machine's own --version is held against.
  #
  # THE DIGESTS OF BOTH EXECUTABLES stand beside this file in ansiwise.sha256, one
  # sha256sum line per release asset: ansiwise-<tag>-linux-x64 and
  # ansiwise-rest-<tag>-linux-x64. The release writes them in the same commit as
  # this pin, off the digests GitHub recorded when the build uploaded the assets.
  # lifecycle/driver.sh, lifecycle/regenerate-driver.sh and the Manager's placement
  # hold each fetched executable against its line before placing it, and a pin
  # whose assets the file does not name is refused rather than placed unchecked.
  # They stand outside this file because one pin names two files, and the
  # grammar's sha256 holds one digest.
  #
  # THE PIN CANNOT GO BELOW 0.1.0-alpha-20260823002740, which is the first release
  # whose executables answer --version at all. Everything holding a machine to this
  # pin does so by ASKING the binary, so an earlier release is one nothing can read
  # a version out of — a machine carrying it can never be reported as at the pin or
  # off it, only as absent.
  ansiwise:
    version: "0.8.326-stable-20261021090149"
    upstream:
      # THE TAGS OF THE MANIFESTS THE OWNER'S REGISTRY HOLDS, read without a credential:
      # every release of ansiwise-cli is published there by the master's Tekton as one
      # manifest simetrixch/ansiwise-cli:<tag> (hostyour-cloud clusters/inventories/
      # consumer-build templates/pipeline-publish.yaml), and GitHub carries no release
      # of it. The image is the path of the binaries in that registry, and the publish pipeline
      # derives it from the engine repository's owner and name (pipeline-publish.yaml), so it is also
      # the engine's own <owner>/<repository> on the platform's forge. hostyour-manager reads the
      # release line over it (inventory/ansiwise-pin.ts) and composes the engine's URL from it, with
      # the host of global.platformUrl. It stands in the platform repository's organisation until the
      # engine is moved to the forge. The versions grammar takes no other key on an oci_tags upstream.
      kind: oci_tags
      host: zot.master.digitacloud.app
      image: simetrixch/ansiwise-cli
      # ALL THREE CHANNELS, and that is the decision this pin carries.
      # Every release of this project is cut under one grammar,
      # <major>.<minor>.<patch>-<channel>-<ts14> with channel one of alpha, beta
      # and stable (hostyour-manager shared/release.ts, and ansiwise-cli
      # release/build.sh, which refuses any tag of another shape).
      #
      # An `alpha`-only pattern would match one channel exactly and be wrong for
      # the pin: on the day a stable is cut, it would go on reporting alphas
      # and never say a riper release exists. Admitting all three lets the highest
      # version win whatever channel it stands on. Ordering across channels is by
      # number, and the ts14 is the last number, so a stable cut after an alpha of
      # the same version sorts above it.
      #
      # WHERE THIS IS WIDER THAN THE GRAMMAR: a leading zero. 01.2.3-alpha-<ts14>
      # matches here and release.ts refuses it. Nothing can reach the gap —
      # ansiwise-cli's release/build.sh refuses to build such a tag — so this stays
      # the pattern a reader can read rather than a third copy of the grammar literal
      # that nothing holds against the other two.
      matching: '^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|stable)-[0-9]{14}$'
    # ONE SITE, AND IT IS AN ASSERTION RATHER THAN AN INSTALL. deploy-cluster names this
    # version in its assert row and fetches the binary nowhere: /usr/local/bin/ansiwise has a
    # single writer and it is the placement, so an
    # install_pinned_tool row there would be a second one writing a plain file over the link
    # that placement maintains. The pin still has to reach the program, because the assert is
    # what tells an operator the engine drifted — it just reaches one row and not two.
    stamps:
      - kind: list_pin
        tree: deploy
        file: ansiwise/programs/deploy-cluster.yaml
        anchor: 'tools:'
        entry: ansiwise
