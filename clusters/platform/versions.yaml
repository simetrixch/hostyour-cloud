# clusters/platform/versions.yaml
# =============================================================================
# THE single source of truth for every platform component version — what each
# component IS: its pinned version, WHERE that pin is written, and WHERE its
# upstream lives.
#
# Edit a version HERE, then run the sync-versions program (ansiwise) — it
# stamps every `stamps:` site below. Review `git diff` in every stamped
# checkout, commit → ArgoCD (apps) / the deploy programs (bootstrap, cliTools)
# carry the change. The versions-upstream program reads the SAME entries and
# reports each pin against what its upstream serves now; both operations read
# this one file, so the writer and the reader cannot drift apart.
#
# Do NOT hand-edit the version fields in clusters/inventories/*/Chart.yaml,
# clusters/inventories/*/values-*.yaml, clusters/units/*/Chart.yaml or the deploy
# programs — they are stamped from this file. The stamp touches only the version
# token, so comments and formatting are preserved.
#
# THE GRAMMAR is the ansiwise-versions plugin's (its declaration.dart states it
# in full). What matters when editing:
#   version:   the pin, ALWAYS QUOTED — YAML would read 8.8 as a number and
#              26.04 as a number that lost its trailing zero.
#   stamps:    every place the pin is written. `tree` is a LABEL the program
#              row maps to a checkout: `platform` is this repository, `deploy`
#              the installation repository carrying the ansiwise programs,
#              `manager` the manager repository beside this one. An `anchor` is
#              the exact trimmed line that opens the block the stamped key
#              stands in, and every site must match exactly once or the stamp
#              refuses — a stamp that cannot find its site never skips it.
#   upstream:  where the report asks. `chart_repository` means: read the
#              repository out of the Chart.yaml the chart_dependency stamp
#              names — the repository differs per chart in ways that are easy
#              to guess wrong, and the Chart.yaml is the one place that knows.
#   note:      one line the report appends beside the upstream answer, for a
#              pin that is deliberate.
# =============================================================================

# Official upstream images run via our own clusters/charts/deployment (no Bitnami, no
# operator). The value is the container image tag of each app. Asked of the
# REGISTRY each image is actually pulled from, never of a release feed: a
# project can tag a release with no image behind it, and a cluster runs the
# image.
images:
  zot:
    version: "v2.1.18"
    upstream:
      kind: oci_tags
      host: ghcr.io
      image: project-zot/zot-linux-amd64
      matching: '^v[0-9]+\.[0-9]+\.[0-9]+$'
    stamps:
      - kind: yaml_value
        tree: platform
        file: clusters/inventories/registry/values-common.yaml
        key: tag
        anchor: 'repository: ghcr.io/project-zot/zot-linux-amd64'
      - kind: yaml_value
        tree: platform
        file: clusters/inventories/registry/Chart.yaml
        key: appVersion
  dbgate:
    version: "7.2.3"
    upstream:
      kind: docker_hub
      image: dbgate/dbgate
      matching: '^[0-9]+\.[0-9]+\.[0-9]+$'
    stamps:
      - kind: yaml_value
        tree: platform
        file: clusters/inventories/dbgate/values-common.yaml
        key: tag
        anchor: 'repository: dbgate/dbgate'
      # Chart.yaml's own appVersion, stamped so it cannot contradict the image
      # this chart runs — it said 7.2.1 while the pin was 7.2.3. It reaches no
      # rendered object: this chart has no template of its own, and the charts it
      # composes declare their own appVersion.
      - kind: yaml_value
        tree: platform
        file: clusters/inventories/dbgate/Chart.yaml
        key: appVersion
  # Tailnet coordination server. Only this half of the tailnet is an image —
  # the client on each host is a CLI tool the installer places, pinned under
  # cliTools below.
  headscale:
    version: "v0.29.2"
    upstream:
      kind: oci_tags
      host: ghcr.io
      image: juanfont/headscale
      matching: '^v[0-9]+\.[0-9]+\.[0-9]+$'
    stamps:
      - kind: yaml_value
        tree: platform
        file: clusters/inventories/headscale/values-common.yaml
        key: tag
        anchor: 'repository: ghcr.io/juanfont/headscale'
      - kind: yaml_value
        tree: platform
        file: clusters/inventories/headscale/Chart.yaml
        key: appVersion
  # In-house datastores — official images via clusters/charts/deployment (mongodb:
  # own StatefulSet templates); the Bitnami-chart era is fully migrated out.
  #
  # postgresql is the ONE values.yaml here, not values-common.yaml: it is no
  # longer a stage-deployed cluster app but a per-unit template, and such a
  # chart is rendered off its implicit Helm values.yaml.
  #
  # The dump/restore clients must speak to the servers pinned here: the
  # MongoDB apt-repo series is the server's <major>.<minor> and the PostgreSQL
  # client major the server's <major>, which is what the two dockerfile_arg
  # stamps into the manager's dbtools image cut with `segments`. That image
  # builds in the manager repository because its caller lives there; it cannot
  # read this file across the repository boundary, and a copy there would be a
  # second source for a version that must have exactly one — so the values are
  # stamped in from here.
  postgres:
    version: "18.4"
    upstream:
      kind: docker_hub
      image: library/postgres
      matching: '^1[0-9]+\.[0-9]+$'
    stamps:
      - kind: yaml_value
        tree: platform
        file: clusters/units/postgresql/values.yaml
        key: tag
        anchor: 'repository: postgres'
      - kind: dockerfile_arg
        tree: manager
        file: docker/dbtools.Dockerfile
        argument: PG_MAJOR
        segments: 1
  # THIS PIN PROTECTS NOTHING. Measured by
  # probing the images: neither the entrypoint nor the mongod binary of 8.0.4,
  # 8.0.28 or 8.2 carries a kernel check. The refusal that circulates comes from
  # a third-party image. So the official image does not decline on an affected
  # kernel — it starts, serves for about thirty seconds, and segfaults, in a
  # cycle, accepting writes in between.
  #
  # The fault is real here. Every machine is Ubuntu 26.04, whose kernel is 7.0.0:
  # the package version 7.0.0-28.28 is <upstream>-<abi>.<upload>, so it is 7.0.0
  # and not 7.0.28. MongoDB's vendored TCMalloc and kernels 6.19 through 7.0.13
  # disagree over rseq; 7.0.14 and later resolve it. Every 8.0.x vendors the same
  # TCMalloc, so 8.0.4 crashes exactly like 8.0.28 — the pin only costs us
  # twenty-four releases of fixes. An image carries no kernel; it shares the
  # machine's, so no image choice avoids this.
  #
  # The blocker is the KERNEL, not the version, so no raise fixes it. Ubuntu
  # offers nothing newer for 26.04 — the GA and hardware-enablement stacks are
  # both on 7.0, and the next bump arrives with 26.04.2 — so a kernel of 7.0.14
  # or later means a mainline one. The cheaper mitigation is
  # GLIBC_TUNABLES=glibc.pthread.rseq=1 on the Deployment, reported to stop the
  # segfault at the cost of allocation performance; it belongs in clusters/inventories/mongodb,
  # not here, and it comes out when the kernel moves.
  #
  # Watch mongod by hand for two minutes on the first install. Nothing here does
  # it: the probes in clusters/inventories/mongodb are ordinary 10- and 15-second ones, and a
  # process that serves for half a minute and then segfaults passes them on the
  # way past. A restart count climbing on its own IS this defect.
  mongodb:
    version: "8.0.4"
    note: pinned deliberately until the kernel moves — see the comment above this entry
    upstream:
      kind: docker_hub
      image: library/mongo
      matching: '^[0-9]+\.[0-9]+\.[0-9]+$'
    stamps:
      - kind: yaml_value
        tree: platform
        file: clusters/inventories/mongodb/values-common.yaml
        key: tag
        anchor: 'repository: mongo'
      - kind: yaml_value
        tree: platform
        file: clusters/units/mongodb/values.yaml
        key: tag
        anchor: 'repository: mongo'
      - kind: dockerfile_arg
        tree: manager
        file: docker/dbtools.Dockerfile
        argument: MONGO_SERIES
        segments: 2
  redis:
    version: "8.8"
    upstream:
      kind: docker_hub
      image: library/redis
      matching: '^[0-9]+\.[0-9]+$'
    stamps:
      - kind: yaml_value
        tree: platform
        file: clusters/inventories/redis/values-common.yaml
        key: tag
        anchor: 'repository: redis'
  # The interpreter clusters/inventories/service-provisioner runs its reconciler on. Not a
  # product of its own: the chart mounts the reconciler as a ConfigMap and the
  # container pip-installs the client libraries at boot, so this pin decides
  # which Python every ServiceClaim on this platform is resolved by.
  python:
    version: "3.12-slim"
    upstream:
      kind: docker_hub
      image: library/python
      matching: '^3\.[0-9]+-slim$'
    stamps:
      - kind: yaml_value
        tree: platform
        file: clusters/inventories/service-provisioner/values-common.yaml
        key: tag
        anchor: 'repository: python'

# Upstream Helm charts wrapped by a Chart.yaml under clusters/inventories/ or
# clusters/units/ (dependency versions).
# Every upstream here is `chart_repository`: the report reads the repository
# to ask out of the very Chart.yaml the stamp writes, so the repository is
# named exactly once, where Helm itself reads it.
charts:
  external-secrets:
    version: "2.8.0"
    upstream:
      kind: chart_repository
    stamps:
      - kind: chart_dependency
        tree: platform
        file: clusters/inventories/external-secrets/Chart.yaml
        dependency: external-secrets
  kube-prometheus-stack:
    version: "87.21.0"
    upstream:
      kind: chart_repository
    stamps:
      - kind: chart_dependency
        tree: platform
        file: clusters/inventories/observability/Chart.yaml
        dependency: kube-prometheus-stack
  loki:
    version: "18.7.0"
    upstream:
      kind: chart_repository
    stamps:
      - kind: chart_dependency
        tree: platform
        file: clusters/inventories/observability/Chart.yaml
        dependency: loki
  tempo:
    version: "2.2.3"
    upstream:
      kind: chart_repository
    stamps:
      - kind: chart_dependency
        tree: platform
        file: clusters/inventories/observability/Chart.yaml
        dependency: tempo
  # alloy is declared in TWO charts. Both sites are stamped from the one key,
  # or a raise moves one and strands the other.
  alloy:
    version: "1.11.0"
    upstream:
      kind: chart_repository
    stamps:
      - kind: chart_dependency
        tree: platform
        file: clusters/inventories/observability/Chart.yaml
        dependency: alloy
      - kind: chart_dependency
        tree: platform
        file: clusters/inventories/observability-agent/Chart.yaml
        dependency: alloy
  # The upstream chart is named `mail` in the Chart.yaml that wraps it — the
  # dependency below is what couples this key to that name, for the stamp and
  # the report alike.
  postfix-mail:
    version: "5.1.0"
    upstream:
      kind: chart_repository
    stamps:
      - kind: chart_dependency
        tree: platform
        file: clusters/inventories/postfix/Chart.yaml
        dependency: mail
  prometheus-postgres-exporter:
    version: "8.2.0"
    upstream:
      kind: chart_repository
    stamps:
      - kind: chart_dependency
        tree: platform
        file: clusters/units/postgresql/Chart.yaml
        dependency: prometheus-postgres-exporter
  prometheus-mongodb-exporter:
    version: "3.20.0"
    upstream:
      kind: chart_repository
    stamps:
      - kind: chart_dependency
        tree: platform
        file: clusters/inventories/mongodb/Chart.yaml
        dependency: prometheus-mongodb-exporter
  prometheus-redis-exporter:
    version: "6.28.0"
    upstream:
      kind: chart_repository
    stamps:
      - kind: chart_dependency
        tree: platform
        file: clusters/inventories/redis/Chart.yaml
        dependency: prometheus-redis-exporter
  # The push agent a cluster without the master part runs; the receiving
  # side is kube-prometheus-stack above, which carries its own copy.
  kube-state-metrics:
    version: "8.0.0"
    upstream:
      kind: chart_repository
    stamps:
      - kind: chart_dependency
        tree: platform
        file: clusters/inventories/observability-agent/Chart.yaml
        dependency: kube-state-metrics

# Bootstrap components installed by the deploy programs (NOT ArgoCD-managed).
# Their pins live as literals in the program rows that install them — a
# program file computes nothing, so the stamp writes the literal and the
# fingerprint of the program changes with the pin, which is exactly what makes
# a re-run of a changed program need a fresh dry run.
bootstrap:
  # argo-cd is installed by the bootstrap AND declared in clusters/slaves/slave/Chart.yaml
  # (the namespaced instance a cluster without the master part runs). Both
  # sites are stamped from this one key, so master + slave stay on one chart
  # version and ONE set of CRDs fits both. The report reads the repository out
  # of the slave Chart.yaml — the same repository the program's helm_repository
  # row names.
  argocd:
    version: "10.2.1"
    upstream:
      kind: chart_repository
    stamps:
      - kind: chart_dependency
        tree: platform
        file: clusters/slaves/slave/Chart.yaml
        dependency: argo-cd
      - kind: yaml_value
        tree: deploy
        file: ansiwise/programs/deploy-platform-services.yaml
        key: chart_version
        anchor: 'release: argocd'
  vault:
    version: "0.34.0"
    upstream:
      kind: helm_index
      repository: https://helm.releases.hashicorp.com
      chart: vault
    stamps:
      - kind: yaml_value
        tree: deploy
        file: ansiwise/programs/deploy-platform-services.yaml
        key: chart_version
        anchor: 'release: vault'
  # The release is named `idp` in the program, the chart is authentik
  # (CalVer == app version).
  authentik:
    version: "2026.5.6"
    upstream:
      kind: helm_index
      repository: https://charts.goauthentik.io
      chart: authentik
    stamps:
      - kind: yaml_value
        tree: deploy
        file: ansiwise/programs/deploy-platform-services.yaml
        key: chart_version
        anchor: 'release: idp'
  # The cluster UI the bootstrap installs beside the reconciler. Its pin stood
  # ONLY in the program row before this entry existed — a version outside the
  # single source, which is the drift this file exists to end.
  headlamp:
    version: "0.42.0"
    upstream:
      kind: helm_index
      repository: https://kubernetes-sigs.github.io/headlamp/
      chart: headlamp
    stamps:
      - kind: yaml_value
        tree: deploy
        file: ansiwise/programs/deploy-platform-services.yaml
        key: chart_version
        anchor: 'release: headlamp'
  # 1.35, NOT the newest channel. Owner's decision: 1.36 breaks on Ubuntu 26.04
  # and has to be rolled back. Raise this only after
  # a rehearsal cluster on 26.04 comes up clean; it is a decision, not a lag.
  # (The channel also drives cert-manager + Traefik addons.)
  microk8s:
    version: "1.35/stable"
    note: raise only after a rehearsal cluster on the pinned Ubuntu comes up clean
    upstream:
      kind: snap_channel
      snap: microk8s
    stamps:
      - kind: yaml_value
        tree: deploy
        file: ansiwise/programs/deploy-cluster.yaml
        key: channel
        anchor: '- step: install_snap'

# The Ubuntu release every host runs. Nothing here installs it — it is the
# ground the pins above stand on: the microk8s channel is proven on exactly
# this release (1.36 breaks on it, see its note), and the mongodb note above
# describes this release's kernel. The installer reads this value in its
# preflight and refuses any other release before its first write. No stamps
# and no upstream, on purpose: nothing carries this pin but the preflight that
# reads it here, and a newer Ubuntu is never a bump but a rehearsal.
ubuntu:
  version: "26.04"
  note: the ground the pins stand on — nothing installs it, the preflight reads it here

# Base images of the images this platform BUILDS. These never reach a cluster:
# they are the ground a build stands on. A raise here is felt at the next
# build, not at the next sync.
baseImages:
  # 12-slim (bookworm), NOT 13. MEASURED: on trixie the build dies
  # with "Unable to locate package mongodb-database-tools" — MongoDB's apt repo
  # answers for the trixie suite but carries no packages for the 8.0 series
  # there, so a reachable repository is not a usable one. Raise this once
  # MongoDB publishes the series for trixie, and rebuild the image to prove it.
  debian:
    version: "12-slim"
    note: 12-slim until MongoDB publishes its series for the newer suite — see the comment above
    upstream:
      kind: docker_hub
      image: library/debian
      matching: '^[0-9]+-slim$'
    stamps:
      - kind: dockerfile_from
        tree: manager
        file: docker/dbtools.Dockerfile
        image: library/debian

# The SDKs our own source is BUILT with. Neither an image nor a tool on a host:
# a toolchain is what a build machine compiles against, and the binary that
# comes out is whatever that toolchain made of the same commit.
toolchains:
  # The client's own pubspec states `flutter: ^3.44.0` under `environment:`, and
  # that is the LOWEST SDK the package accepts, not a pin — every Flutter at or
  # above it satisfies the constraint, so two machines building one commit
  # produce two different binaries and neither is wrong. This key is what
  # decides which one.
  #
  # 3.47.1 is the stable release of 2026-08-19, and it ships Dart 3.13.1, which
  # the client's `sdk: ^3.12.0` accepts. MEASURED from the channel
  # Flutter publishes to, never recalled:
  # https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json
  # — its `current_release.stable` names a commit hash, and the entry in its
  # `releases` list carrying that hash states the version, the release date and
  # the Dart SDK inside it.
  #
  # NO `upstream:`, because none of the grammar's kinds can ask that channel and
  # the near miss would lie. Measured the same way: `github_release` over
  # flutter/flutter answers "3.19.0-0.1.pre" of 11 January 2024 — the newest
  # release that feed carries, since the project stopped publishing there — so
  # declaring it would print an upstream many minor versions BEHIND the pin and
  # invite a downgrade. The report answers "?" with the reason instead,
  # which is a finding about the report and not about the pin.
  #
  # THE SITE IS ansiwise-client/tool/ci.dart, and this entry stamps nowhere, so
  # the report says "(stamped nowhere)" and it is right. The workflow of
  # ansiwise-client#17 is NOT the site: .github/workflows/release.yml states no
  # version at all — its `read the pinned Flutter version` step reads
  # `const String flutterVersion` out of tool/ci.dart and hands it to the Flutter
  # action — so the client has ONE spelling and that Dart constant is it.
  #
  # A `stamps:` site for it needs two things that are not this file's to decide,
  # and until both stand the entry carries none: the stamp is whole or nothing
  # (sync-versions states `on_failure: exit`), so ONE site nothing can write
  # stops every other pin in this file from being written at all.
  #   * a stamp kind that writes a Dart constant. The grammar has five —
  #     yaml_value, chart_dependency, list_pin, dockerfile_from, dockerfile_arg —
  #     and the ansiwise-versions plugin switches over exactly those, so a
  #     `dart_constant` kind is a plugin change.
  #   * a fourth tree label. The sync-versions row maps platform, deploy and
  #     manager; the client is a fourth checkout, and a stamp into a label the row
  #     does not map is refused rather than skipped.
  #
  # Until then ansiwise-client's tool/flutter_pin.dart is what refuses a drift,
  # on the client's side; this line is stated here and held nowhere.
  flutter:
    version: "3.47.2"
    note: |
      Read by hand from the Flutter release channel on 2026-09-03 — no upstream
      kind can ask it. A pin is for reproducing a build and not for being current:
      ansiwise-client/tool/ci.dart refuses every SDK but the pinned one, so a
      version nobody has installed turns that gate red everywhere. 3.47.2 is the
      one the client is built and tested with, and it moves only together with
      that constant. versions-upstream never fails on this line.

# CLI tools installed to /usr/local/bin on every host. They were fetched as
# "latest" until they were pinned here: two hosts installed a month apart got
# different tools and neither could be reproduced. Each pin is stamped into
# the install row of deploy-cluster AND into the assert list at the end of its
# tool phase, from this one key — jq and tailscale have no install row that
# takes a version (package manager and vendor installer), so only the assert
# list carries theirs, and the program reports rather than fails where those
# two drift. The upstream of each is its own release feed, because that is
# what the install fetches from.
cliTools:
  argocd:
    version: "v3.4.5"
    upstream:
      kind: github_release
      project: argoproj/argo-cd
      # Stable only. Read off the release list: every stable is vX.Y.Z and every
      # candidate carries a suffix the stable shape has no room for — v3.5.0-rc1,
      # -rc2, -rc3 stand beside v3.5.0 itself, each marked a pre-release. Without
      # the anchors a candidate sorts above the stable it precedes and reads as a
      # version to bump to.
      matching: '^v[0-9]+\.[0-9]+\.[0-9]+$'
    stamps:
      - kind: yaml_value
        tree: deploy
        file: ansiwise/programs/deploy-cluster.yaml
        key: version
        anchor: 'tool: argocd'
      - kind: list_pin
        tree: deploy
        file: ansiwise/programs/deploy-cluster.yaml
        anchor: 'tools:'
        entry: argocd
  vault:
    version: "v2.0.3"
    upstream:
      kind: hashicorp_release
      product: vault
    stamps:
      - kind: yaml_value
        tree: deploy
        file: ansiwise/programs/deploy-cluster.yaml
        key: version
        anchor: 'tool: vault'
      - kind: list_pin
        tree: deploy
        file: ansiwise/programs/deploy-cluster.yaml
        anchor: 'tools:'
        entry: vault
  yq:
    version: "v4.53.3"
    upstream:
      kind: github_release
      project: mikefarah/yq
      # The v-prefixed stables. Read off the release list: every tag carrying this
      # shape is a stable and every refused tag is UNPREFIXED, the newest of them
      # 4.0.0 — the era this project left behind. The unprefixed ones fall in these
      # shapes: 1.12 and 2.0-beta (two numbers), 4.0.0 (three), and 4.0.0-alpha2,
      # 4.0.0-beta2 and 3.0.0-beta. The leading `v` alone separates the two eras,
      # which is why nothing else has to.
      matching: '^v[0-9]+\.[0-9]+\.[0-9]+$'
    stamps:
      - kind: yaml_value
        tree: deploy
        file: ansiwise/programs/deploy-cluster.yaml
        key: version
        anchor: 'tool: yq'
      - kind: list_pin
        tree: deploy
        file: ansiwise/programs/deploy-cluster.yaml
        anchor: 'tools:'
        entry: yq
  # upstream tags its releases jq-<version>, and the pin is written in that
  # same shape so the assert can hold the two against each other.
  jq:
    version: "jq-1.8.2"
    upstream:
      kind: github_release
      project: jqlang/jq
      # THE PATCH NUMBER IS OPTIONAL, and that is measured rather than defensive.
      # Read off the release list: this project publishes stables
      # with two numbers as readily as with three — jq-1.7, jq-1.6, jq-1.5,
      # jq-1.4, jq-1.3, jq-1.2, jq-1.1 and jq-1.0 stand beside jq-1.8.2, jq-1.8.1,
      # jq-1.8.0 and jq-1.7.1. A pattern demanding three would refuse the next
      # jq-1.9 and go on reporting jq-1.8.2 as current with a newer stable in the
      # list it just read. The candidates are jq-1.7rc1, jq-1.7rc2, jq-1.5rc1 and
      # jq-1.5rc2, which append `rc<n>` with no separator, so ending the pattern
      # after the numbers is what keeps them out.
      matching: '^jq-[0-9]+\.[0-9]+(\.[0-9]+)?$'
    stamps:
      - kind: list_pin
        tree: deploy
        file: ansiwise/programs/deploy-cluster.yaml
        anchor: 'tools:'
        entry: jq
  # The client half of the tailnet; the server is images.headscale.
  tailscale:
    version: "v1.98.10"
    upstream:
      kind: github_release
      project: tailscale/tailscale
      # Read off the release list. Three shapes are not vX.Y.Z and each is one
      # this pin must not see: cmd/cigocacher/<sha>, a pre-release cut for one
      # sub-command; v0.100.0-153, a build-numbered tag of the 0.x era; and v0.98,
      # which has two numbers. Nothing here narrows to tailscale's own
      # stable/unstable convention — even minor stable, odd minor unstable —
      # because the v1 minors this feed carries are even, with no odd one
      # published as a release at all. A pattern refusing odd minors would state a
      # rule this feed does not exercise.
      matching: '^v[0-9]+\.[0-9]+\.[0-9]+$'
    stamps:
      - kind: list_pin
        tree: deploy
        file: ansiwise/programs/deploy-cluster.yaml
        anchor: 'tools:'
        entry: tailscale
  # The deployment engine itself — the binary that is executing deploy-cluster
  # while deploy-cluster fetches the tools of this block, now held to a pin like
  # every one of them.
  #
  # WHO PUTS IT ON A MACHINE FIRST, and it is one mechanism in two callers
  # (hostyour-manager#14): the client places it on a master over SSH, and
  # place-ansiwise places it on a slave. Both write
  # /usr/local/bin/ansiwise-<version> and link /usr/local/bin/ansiwise at it. The
  # install row the stamps below write is what keeps it AT the pin afterwards; it
  # replaces the file the link points at while a run of this very program is in
  # flight, which is safe because a running process keeps the inode it started
  # from and the next invocation is the new binary.
  #
  # THE RELEASE CARRIES TWO EXECUTABLES and one pin names both:
  # ansiwise-<tag>-linux-x64 and ansiwise-rest-<tag>-linux-x64 are built from one
  # tag, and ansiwise-rest starts a run by invoking the ansiwise standing in its
  # own directory — with none there it exits 78 at start rather than at the first
  # request (ansiwise-cli bin/ansiwise_rest.dart, deploymentToolBesideThis). Only
  # ansiwise is stamped, because only ansiwise has a site: the install row for the
  # REST binary is deliberately absent, since replacing the file a service was
  # started from leaves that service on the old code until its unit is restarted
  # and no step of the framework restarts one (ansiwise-plugins#141).
  # The install row states that in full.
  #
  # WHO ELSE READS THIS PIN, with no stamp between them and it: hostyour-manager
  # server/domains/inventory/ansiwise-pin.ts reads cliTools.ansiwise.version
  # off this repository over git before it touches a machine, and ansiwise-client
  # reads the same key over the GitHub API before it places anything on a master.
  # Neither has a default — a placement that guessed a version would put one on a
  # machine that no file states.
  #
  # The version is a whole release tag and not three numbers, because the
  # grammar is the platform's own — hostyour-manager/shared/release.ts,
  # <major>.<minor>.<patch>-<channel>-<ts14> — and the release, the artefact and
  # the download address are all named by it. Nothing takes a prefix off it:
  # deploy-cluster's `pin_prefixes` strips at most one of `v` or `jq-` before
  # comparing, and a tag that begins with a digit loses nothing, so the whole tag
  # is what the machine's own --version is held against.
  #
  # THE PIN CANNOT GO BELOW 0.1.0-alpha-20260823002740, which is the first release
  # whose executables answer --version at all. Everything holding a machine to this
  # pin does so by ASKING the binary, so an earlier release is one nothing can read
  # a version out of — a machine carrying it can never be reported as at the pin or
  # off it, only as absent.
  ansiwise:
    version: "0.8.109-stable-20260905011245"
    upstream:
      kind: github_release
      project: simetrixch/ansiwise-cli
      # ALL THREE CHANNELS, and that is the decision this pin carries.
      # Every release of this project is cut under one grammar,
      # <major>.<minor>.<patch>-<channel>-<ts14> with channel one of alpha, beta
      # and stable (hostyour-manager shared/release.ts, and the three tag
      # filters of ansiwise-cli .github/workflows/release.yml that admit only
      # tags of that shape).
      #
      # An `alpha`-only pattern would match one channel exactly and be wrong for
      # the pin: on the day a stable is cut, it would go on reporting alphas
      # and never say a riper release exists. Admitting all three lets the highest
      # version win whatever channel it stands on, and the reading says "the
      # project marks this release a pre-release" when the winner carries the
      # marking, so a pre-release is never passed off as a plain newer version.
      # Ordering across channels is by number, and the ts14 is the last number, so
      # a stable cut after an alpha of the same version sorts above it.
      #
      # WHERE THIS IS WIDER THAN THE GRAMMAR: a leading zero. 01.2.3-alpha-<ts14>
      # matches here and release.ts refuses it. Nothing can reach the gap —
      # ansiwise-cli's own release program refuses to compose such a tag, and the
      # workflow builds only pushed tags — so this stays the pattern a reader can
      # read rather than a third copy of the grammar literal that nothing holds
      # against the other two.
      matching: '^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|stable)-[0-9]{14}$'
    # ONE SITE, AND IT IS AN ASSERTION RATHER THAN AN INSTALL. deploy-cluster names this
    # version in its assert row and fetches the binary nowhere: /usr/local/bin/ansiwise has a
    # single writer and it is the placement (hostyour-manager#14), so an
    # install_pinned_tool row there would be a second one writing a plain file over the link
    # that placement maintains. The pin still has to reach the program, because the assert is
    # what tells an operator the engine drifted — it just reaches one row and not two.
    stamps:
      - kind: list_pin
        tree: deploy
        file: ansiwise/programs/deploy-cluster.yaml
        anchor: 'tools:'
        entry: ansiwise
