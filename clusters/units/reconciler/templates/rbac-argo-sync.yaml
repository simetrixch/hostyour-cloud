{{- /*
The one grant that lets a unit's release pipeline tell the reconciler to sync the bump it has just
committed: get and patch, on exactly this unit's Application AT THIS STAGE, in the reconciler
namespace it lives in.

IT STANDS BESIDE THE PROJECT AND NOT IN THE BUILD NAMESPACE, because its scope is not the build's.
The two build-namespace grants belong to the UNIT and a build is stage-free — one namespace per unit,
one image per release — so a unit deployed at two stages has one of each, and they are rendered from
registrations/<unit>/build.yaml by clusters/inventories/consumer-build. This grant belongs to the
unit AT ONE STAGE: one per (unit, stage), named `<name>-<stage>-argo-sync`, in the reconciler
namespace of the unit's target cluster — and two stages of one unit on one cluster are two grants
told apart by that name. Calling the set "the per-unit build RBAC" is what once made a one-stage
teardown delete all three.

THE ONE APPLICATION THIS GRANT REACHES, NAMED OUTRIGHT. The reconciler namespace holds every unit's
Applications, so a rule without resourceNames would reach all of them. The name is `<name>-<stage>`,
which is what the consumers ApplicationSet stamps; the pipeline releasing at this stage patches
exactly that one and nothing beside it.

`list` AND `watch` ARE DELIBERATELY ABSENT. Kubernetes ignores resourceNames for those two verbs, so
granting either would silently widen this Role back to every Application in the namespace. A sync is
a read plus a patch of the named object, which needs neither.

WHY THE MANAGER COULD NOT LEAVE THIS TO THE UNIT'S OWN CHART: the unit's AppProject beside this file
blacklists Role and RoleBinding, which is the point — a unit that could mint its own Role could grant
itself anything. So the platform is the only writer left, and rendering it here is that same platform
writing it through the one mechanism it uses for everything else.
*/ -}}
{{- $name := required "unit-reconciler: registration.name is required — the grant names this unit's own Application and binds this unit's own build pipeline" .Values.registration.name }}
{{- $stage := required "unit-reconciler: registration.stage is required — the Application this grant reaches is <name>-<stage>, and the grant is named for the same pair" .Values.registration.stage }}
{{- $namespace := required "unit-reconciler: argoNamespace is required — the grant stands where the Application it names stands" .Values.argoNamespace }}
{{- $application := printf "%s-%s" $name $stage }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $application }}-argo-sync
  namespace: {{ $namespace }}
  labels:
    hostyour.cloud/consumer: "true"
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    resourceNames:
      - {{ $application }}
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $application }}-argo-sync
  namespace: {{ $namespace }}
  labels:
    hostyour.cloud/consumer: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $application }}-argo-sync
subjects:
  - kind: ServiceAccount
    name: {{ required "unit-reconciler: buildPipelineServiceAccount is required — the identity every release PipelineRun of this unit runs as" .Values.buildPipelineServiceAccount }}
    # The build namespace is stage-free: one pipeline per unit releases at every stage.
    namespace: {{ printf "%s-build" $name }}
