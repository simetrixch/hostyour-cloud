apiVersion: v2
name: postgresql
# 2.0.0 — BREAKING vs 1.0.0 on purpose. 1.0.0 was a stage-deployed CLUSTER app
# (one singleton in namespace `postgresql`, per-stage values files, a hardcoded
# stage-suffixed Service FQDN). 2.0.0 is a per-consumer TEMPLATE: the values file
# layout, the ExternalSecret wiring and the workload name all changed. Nothing
# upgrades in place from 1.0.0 — the shared release was retired, not migrated.
version: 2.0.0
description: |
  PostgreSQL — the OFFICIAL `postgres` image on our own clusters/charts/deployment
  (no Bitnami, no operator). ONE standalone primary per RENDER, living entirely
  inside the namespace it is rendered into.

  NOT A CLUSTER APP ANY MORE. Until 2026-07-22 this chart was deployed once per
  stage into a singleton `postgresql` namespace by the platform ApplicationSet.
  That shared instance was retired by owner decision — every consumer that needs
  PostgreSQL now gets its OWN instance in its OWN namespace — and the CHART is
  what survived it: the template each per-consumer instance is rendered from.
  Retiring the app and deleting the chart are different things; only the first
  happened. There is therefore deliberately no apps/postgresql/ directory for
  clusters/argocd/apps/applicationset.yaml to glob an app.yaml out of, and re-adding one
  would resurrect the singleton this chart no longer models.

  WHAT MAKES IT RENDERABLE PER CONSUMER. Every cluster-singleton assumption is
  gone: no hardcoded namespace (the ExternalSecret and the SecretStore follow
  .Release.Namespace), no stage-suffixed Service FQDN (the exporter reaches the
  database through same-namespace DNS), no per-stage values files (a template
  has no stage identity — the stage-dependent globals arrive from
  $values/clusters/platform/values-<stage>.yaml, exactly as for every other chart the
  platform renders into a consumer namespace). The one coordinate a renderer
  MUST still supply is the Vault path of the superuser credential
  (externalsecret-postgres.externalSecret.vaultPath); the chart `required`s it
  rather than silently defaulting to a shared path.

  SIZING. Three presets — values-size-{small,medium,large}.yaml — each covering
  CPU/memory requests, CPU/memory limits and the data PVC. SMALL is the chart
  DEFAULT (it is what values.yaml itself carries), so a render that names no
  size gets the frugal one, never the generous one. See the values.yaml header
  for what each size is for and where its numbers come from.

  The image tag is managed centrally in clusters/platform/versions.yaml (images.postgres)
  and stamped by the version sync. A single ReadWriteOnce data PVC (Recreate
  strategy) — two pods must never open the data directory at once.
type: application
dependencies:
  # PostgreSQL pod — Deployment + ClusterIP Service via the shared library chart.
  - name: deployment
    version: 1.0.0
    repository: file://../../charts/deployment
    alias: postgres

  # Data directory (/var/lib/postgresql/data). Prune=false,Delete=false so the
  # database survives ArgoCD prune / Application deletion.
  - name: pvc
    version: 1.0.0
    repository: file://../../charts/pvc
    alias: postgres-data

  # ExternalSecret — materializes the `postgresql-credentials` K8s Secret
  # (superuser password) from the Vault path the renderer injects.
  #
  # This replaces a chart-local templates/externalsecret.yaml that was a FORK of
  # clusters/charts/external-secret: a second copy of the same resource, drifting on its
  # own, multiplied by the number of consumers. The fork is gone and the shared
  # chart is the single source — including its "0" refreshInterval, which is the
  # platform-wide rule (no periodic Vault read anywhere). Putting a NEW superuser
  # password in front of the database therefore means: write it into Vault, delete
  # the postgresql-credentials Secret, roll the database pod.
  - name: external-secret
    version: 1.0.0
    repository: file://../../charts/external-secret
    alias: externalsecret-postgres

  # The platform-owned ESO credential store (§5.3): SecretStore `vault-backend-postgres`
  # + ServiceAccount `postgres-eso`. ON (values.yaml: `secret-store.enabled: true`).
  # The consumer namespace already owns a `vault-backend` SecretStore that the consumer's
  # OWN chart renders. This one uses DISTINCT names on purpose — that is exactly what avoids
  # the two-Applications-one-object collision — so the platform's superuser ExternalSecret
  # (wave -21) materializes `postgresql-credentials` BEFORE the pod mounts it (wave -20),
  # rather than depending on the consumer's store which only exists at wave -3.
  - name: secret-store
    version: 1.0.0
    repository: file://../../charts/secret-store
    condition: secret-store.enabled

  # NOTE — the PostgreSQL alert rules (PostgreSQLDown etc.) are NOT a
  # clusters/charts/monitoring dependency here: they are an INLINE template,
  # templates/prometheusrule.yaml, gated on the same metrics.enabled. The subchart
  # renders rules from values verbatim (toYaml, no tpl) and so cannot scope an
  # alert expression to .Release.Namespace, which per-consumer isolation requires
  # (finding 5 / per-consumer-postgres.md §10.3) — see the WHY at the top of that
  # template. metrics.enabled is still the ONE switch for the whole monitoring
  # pair: it gates BOTH the exporter dependency below (via `condition`) AND the
  # inline PrometheusRule (via `{{ if }}`), so the two can never be half-configured.

  # Metrics exporter — emits the pg_* metrics the inline PrometheusRule watches.
  # Connects to the in-NAMESPACE postgres as the superuser, reading the same
  # postgresql-credentials Secret the database itself is initialised from.
  #
  # DEPENDENCY-GATING CAVEAT (finding 8): this is a transitive Helm dependency from
  # prometheus-community, and ArgoCD fetches it at render time (the vendored
  # charts/ are gitignored). ArgoCD gates dependency repos by the Application's
  # AppProject.sourceRepos — the platform already lists this repo in the `data` and
  # `observability` projects for exactly this reason (clusters/argocd/apps/projects.yaml).
  # The PER-CONSUMER project (hostyour-manager appproject.ts renderConsumerAppProject)
  # currently permits only [consumerRepo, platformRepo], so a per-consumer render
  # with metrics.enabled would be REJECTED until that project also allows
  # https://prometheus-community.github.io/helm-charts. That fix lives in
  # hostyour-manager (part of slice S4), NOT in this chart.
  - name: prometheus-postgres-exporter
    version: 8.2.0
    repository: https://prometheus-community.github.io/helm-charts
    condition: metrics.enabled

  # Shared named templates (common.labels / common.fullname) used by the
  # library charts above. Declared at APP level — Helm doesn't vendor nested
  # file:// deps (see clusters/charts/common/Chart.yaml).
  - name: common
    version: 1.0.0
    repository: file://../../charts/common
