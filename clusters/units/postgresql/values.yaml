# =============================================================================
# PostgreSQL — PER-CONSUMER TEMPLATE (one instance, one namespace).
#
# WHY THIS FILE IS values.yaml AND NOT values-common.yaml
# A stage-deployed cluster app is rendered by clusters/argocd/files/platform-apps-appset.yaml,
# whose valueFiles chain names `values-common.yaml` + `values-<stage>.yaml`
# EXPLICITLY. A chart rendered into a CONSUMER namespace is not in that chain:
# it is an extra source of the consumer's Application
# (clusters/argocd/files/consumers-appset.yaml), i.e. `path: clusters/units/postgresql` plus the
# platform globals from $values, and
# Helm loads only the chart's own implicit `values.yaml` as the base. So the
# base values must live in a file called exactly values.yaml, and no per-stage
# file sits next to it: a TEMPLATE has no stage identity of its own. Everything
# stage-dependent (domain, endpoints.vault.url, storageClass,
# timezone, secretStoreName) already arrives through global.* from
# $values/clusters/platform/values-common.yaml + values-<stage>.yaml + clusters/active/<fqdn>.yaml.
#
# =============================================================================
# SIZE PRESETS — pick by WORKLOAD, not by optimism
#
#   preset            cpu req  mem req  cpu lim  mem lim  data PVC
#   small (DEFAULT)      25m    256Mi     500m    512Mi      5Gi
#   medium              100m      1Gi       1       2Gi     20Gi
#   large               250m      2Gi       2       4Gi     50Gi
#
#   small  — the honest default. One consumer application, a working set that
#            fits in PostgreSQL's stock 128MB shared_buffers, single-digit
#            concurrent connections, data measured in hundreds of megabytes.
#   medium — the working set no longer fits the stock cache, or reporting
#            queries run next to the OLTP traffic: tens of connections, sorts
#            and index builds that need real work_mem, low gigabytes of data.
#   large  — the ceiling we are still willing to put on a shared node: sustained
#            write volume, many connections, large joins. Its limits are exactly
#            what a single SHARED cluster instance is allowed, so a database
#            migrated off one provably cannot need more.
#
# SMALL IS THE DEFAULT AND IT LIVES HERE, in this file — a render that names no
# size gets the frugal one, never the generous one. values-size-small.yaml
# exists only so every renderer can name its size uniformly
# (-f values-size-<size>.yaml) without a conditional; it is intentionally empty.
#
# WHERE THE NUMBERS COME FROM (measured on a live master)
#   • a shared cluster instance, EMPTY database: 6-7m CPU / 55-56Mi memory,
#     while REQUESTING 500m/1Gi and being LIMITED to 2 CPU/4Gi on a 50Gi PVC.
#     That is the trap this file exists to avoid: copying those figures once per
#     consumer requests 10Gi and promises 40Gi of limits for ten consumers, on a
#     node whose limits already sum to 122% CPU / 146% memory.
#   • idp-postgresql in namespace `idp` — a genuinely USED instance (Authentik
#     keeps sessions, cache and its task queue in it): 12-17m CPU / 231Mi memory,
#     162MB of data on an 8Gi PVC. That, not the empty one, is the honest
#     baseline for "small".
#   • the node is 24 vCPU / 30GB with requests at 18%/34% — RAM and CPU are not
#     the scarce resource here. STORAGE is: the instruction is to be frugal with
#     disk even though /mnt/data is a 1TB volume at 3%.
#   Ten SMALL instances therefore cost 250m CPU / 2.5Gi of requests, 5 CPU / 5Gi
#   of limits and 50Gi of disk — the whole of ten consumers fitting in what ONE
#   shared instance is permitted.
# =============================================================================

# --- the PostgreSQL workload (clusters/charts/deployment, alias `postgres`) ------------
postgres:
  # Deployment + Service name, FIXED rather than derived from the release name.
  # common.fullname would otherwise produce "<release>-postgres", so the DNS name
  # a consumer application has to connect to would depend on whatever release
  # name the renderer happened to choose. Pinned here, every instance is reachable
  # at the same, namespace-anchored address:
  #     postgres.<consumer-namespace>.svc.cluster.local:5432
  #
  # ONE INSTANCE PER NAMESPACE — a second one is UNSUPPORTED, not a config knob.
  # This chart is the per-consumer template of design decision 2 (per-consumer-
  # postgres.md §2): exactly one PostgreSQL instance lives in a consumer's own
  # namespace, reaped by namespace deletion. SEVEN of its object names are fixed,
  # not release-derived, and every one of them would collide if a second instance
  # were rendered into the same namespace:
  #   • Deployment + Service   `postgres`                (this fullnameOverride)
  #   • data PVC               `postgres-data`           (postgres-data.pvc.name)
  #   • ExternalSecret         `postgres-superuser`      (externalsecret-postgres.name)
  #   • credential Secret      `postgresql-credentials`  (externalsecret-postgres.targetSecretName)
  #   • SecretStore            `vault-backend-postgres`  (secret-store.name)
  #   • ServiceAccount         `postgres-eso`            (secret-store.serviceAccountName)
  #   • PrometheusRule         `postgresql`              (templates/prometheusrule.yaml)
  # So overriding THIS one field alone would NOT make a second same-namespace
  # instance work — the PVC, the credential objects and the rule would still clash.
  # If per-namespace multi-instance is ever needed, ALL of them must move to
  # release-derived names together; until then, treat one-per-namespace as a hard
  # invariant, not a default.
  fullnameOverride: postgres

  image:
    repository: postgres
    # Managed centrally in clusters/platform/versions.yaml (images.postgres) and stamped
    # by the version sync — do not hand-edit this tag.
    tag: "18.4"
    pullPolicy: IfNotPresent
  replicas: 1
  containerPort: 5432
  # Single ReadWriteOnce data PVC → two pods must never coexist.
  strategy:
    type: Recreate

  # Wave -20 on the DEPLOYMENT resource itself (clusters/charts/deployment `.annotations`,
  # NOT the pod-template `podAnnotations`), per per-consumer-postgres.md §4.3: the
  # database pod belongs to the database-infra wave, ahead of anything the consumer
  # declares (floor -10). Paired with -20 on the Service below, the PVC and the
  # NetworkPolicy; the credential trio (ExternalSecret + SecretStore + ServiceAccount)
  # sits one wave earlier at -21 so `postgresql-credentials` exists before this pod
  # mounts it.
  annotations:
    argocd.argoproj.io/sync-wave: "-20"

  # SECURITY CONTEXT — sized for Pod Security Admission `restricted`, which is
  # ENFORCED on every consumer namespace (the consumers ApplicationSet stamps
  # pod-security.kubernetes.io/enforce=restricted via managedNamespaceMetadata).
  # The shared cluster app only set runAsUser/runAsNonRoot, which was enough for
  # its own unlabelled namespace and would be REJECTED outright in a consumer
  # namespace. All four restricted requirements are therefore explicit here.
  podSecurityContext:
    # The official postgres image runs as uid/gid 999 (the `postgres` user);
    # fsGroup 999 makes the mounted data volume group-writable for it, which is
    # what lets the entrypoint create and chmod 0700 the PGDATA sub-directory
    # without ever being root.
    fsGroup: 999
    runAsUser: 999
    runAsGroup: 999
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    runAsUser: 999
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
    # readOnlyRootFilesystem is deliberately NOT set: the official image writes
    # its unix socket to /var/run/postgresql and temp files to /tmp, and PSA
    # `restricted` does not require a read-only root filesystem.

  # SERVER CONFIG — bound the memory footprint so the pod PROVABLY fits its
  # limit instead of OOM-killing before an alert can fire.
  #
  # WHY THIS EXISTS. With PostgreSQL's stock config the deterministic baseline is
  # shared_buffers 128MB + up to 3 autovacuum workers × maintenance_work_mem 64MB
  # = 320MB, on top of which up to max_connections=100 backends allocate private
  # memory. Against the SMALL preset's 512Mi hard limit that peaks past the ceiling
  # and the kernel OOM-kills the pod — and it does so at a connection count far
  # below the PostgreSQLConnectionsSaturated alert's 80%-of-100 trip point, so the
  # alert never warns first. The fix is to make the footprint deterministic and
  # smaller than the limit, per preset. medium/large restate this whole list (Helm
  # replaces list values, it does not merge them) with their own numbers.
  #
  # These are passed as `postgres -c <key>=<val>` server flags: the official
  # image's entrypoint prepends `postgres` when the first arg starts with `-`
  # (docker-entrypoint.sh), so the container runs the tuned server, and initdb
  # still runs on first boot exactly as before.
  #
  # SMALL numbers and their reasons:
  args:
    # shared_buffers 128MB — PostgreSQL's standard starting value and the working
    # set the "small" tier is defined around (see the header). It is a fixed
    # allocation; at 128MB it is half the 256Mi request, so an idle instance
    # (shared_buffers + a few backends) lives inside its guaranteed request and
    # the request→limit headroom absorbs bursts.
    - "-c"
    - "shared_buffers=128MB"
    # max_connections 50 — small is "single-digit concurrent connections" (header),
    # so 50 is already generous headroom for a pooled app while halving stock's
    # 100-backend memory ceiling. This is the lever that makes the bound provable:
    # 50 backends' worst-case working set fits the 512Mi limit next to
    # shared_buffers + autovacuum, so the instance reaches the saturation alert
    # (80% = 40 connections) with memory to spare instead of OOM-killing first.
    - "-c"
    - "max_connections=50"
    # autovacuum_work_mem 32MB — caps EACH of the 3 default autovacuum workers at
    # 32MB (worst case 96MB) instead of inheriting maintenance_work_mem's 64MB
    # (192MB). Baseline becomes shared_buffers 128 + autovacuum 96 = 224MB (44% of
    # the 512Mi limit), leaving ~310MB for the 50 backends + OS/page cache.
    - "-c"
    - "autovacuum_work_mem=32MB"

  env:
    # Superuser password from Vault (ESO → postgresql-credentials).
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: postgresql-credentials
          key: postgres-password
    # PGDATA in a sub-directory of the mount: the official image refuses to
    # initdb into a volume root that already contains lost+found.
    - name: PGDATA
      value: /var/lib/postgresql/data/pgdata
    # Timezone from the platform single-source-of-truth (env is tpl-rendered).
    - name: TZ
      value: '{{ .Values.global.timezone }}'
  volumeMounts:
    - name: data
      mountPath: /var/lib/postgresql/data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: postgres-data
  livenessProbe:
    exec:
      command: ["pg_isready", "-U", "postgres"]
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 5
  readinessProbe:
    exec:
      command: ["pg_isready", "-U", "postgres"]
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
  service:
    enabled: true
    type: ClusterIP
    port: 5432
    # Wave -20 — same database-infra wave as the Deployment (§4.3), so the Service
    # name a consumer connects to is created in the same step as the pod behind it.
    annotations:
      argocd.argoproj.io/sync-wave: "-20"

  # SMALL preset — see the size table in the header for the reasoning.
  # The CPU and MEMORY request:limit ratios are DELIBERATELY DIFFERENT, because
  # the two resources fail differently and that must not be papered over as one
  # "2x" number:
  #   • MEMORY  256Mi → 512Mi  = 2x. Memory is an incompressible, OOM-KILLED
  #     limit, so the request is kept close (half the limit): the scheduler
  #     reserves what the instance actually resides at (a real in-use small
  #     instance, idp-postgresql, sits at 231Mi → 256Mi rounded up one step) and
  #     the 2x headroom covers a checkpoint / autovacuum / REINDEX burst without
  #     the deterministic footprint (bounded by the `args` above) ever crossing
  #     the limit.
  #   • CPU  25m → 500m  = 20x. CPU is compressible — over the limit the process
  #     is THROTTLED, never killed — so the request reflects the few millicores
  #     the database idles at (measured 12-17m, request 25m ≈ 1.5x that) while the
  #     limit lets one query, checkpoint or index build burst up to half a core.
  #     A high CPU limit costs nothing while idle and, unlike memory, cannot
  #     OOM anything; reserving idle cores on a node whose LIMITS already sum to
  #     122% CPU / 146% memory (measured on a live master) is what we must NOT do.
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# --- data PVC ----------------------------------------------------------------
# Prune=false,Delete=false so the database survives an ArgoCD prune / Application
# deletion — offboarding a consumer must not silently destroy its data.
postgres-data:
  pvc:
    enabled: true
    name: postgres-data
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
      # Wave -20 — database infra, ahead of anything a consumer declares (contract
      # floor -10), per per-consumer-postgres.md §4.3. Set in slice S2a alongside
      # -20 on the Deployment/Service/NetworkPolicy and -21 on the credential trio,
      # now that the shared library charts can emit metadata.annotations. BOTH the
      # wave AND the Prune=false,Delete=false sync-option ride on this one
      # annotations map — the wave is added ALONGSIDE Prune, it does not replace it.
      argocd.argoproj.io/sync-wave: "-20"
    accessModes:
      - ReadWriteOnce
    # SMALL preset: 5Gi. The one instance we can measure a real footprint on
    # (idp-postgresql) holds 162MB, so 5Gi is ~30x its live usage and still ten
    # times smaller than the 50Gi the retired shared instance held for an empty
    # database. Storage is the scarce resource — grow deliberately by picking
    # `medium`/`large`, not by defaulting large.
    storageSize: "5Gi"

# =============================================================================
# Vault-backed superuser credential. The official postgres image only needs
# POSTGRES_PASSWORD; the key below maps to the Vault property `postgres-password`.
#
# vaultPath is deliberately EMPTY and clusters/charts/external-secret `required`s it, so a
# render that forgets it FAILS LOUDLY instead of quietly attaching this instance
# to another consumer's credential.
#
# THIS FIELD IS THE ExternalSecret's remoteRef.KEY, NOT the KV mount.
# clusters/charts/external-secret renders
# externalSecret.vaultPath as spec.data[].remoteRef.key
# (clusters/charts/external-secret/templates/externalsecret.yaml), and the KV mount is a
# SEPARATE coordinate carried by the SecretStore's `path`. The two must never be
# conflated: putting the KV MOUNT (the literal `secret`, IDENTICAL for every
# consumer) here would make
# every consumer resolve to one nonexistent shared key.
#
# ── APPSET ANCHOR ────────────────────────────────────────────────────────────
# The renderer (the platform's PostgreSQL source in
# clusters/argocd/files/consumers-appset.yaml) MUST SET this per consumer on its
# valuesObject, a per-stage LITERAL in each per-stage appset file:
#     externalsecret-postgres:
#       externalSecret:
#         vaultPath: "<stage>/consumer/{{ .name }}/postgres"
# → remoteRef.key = "<stage>/consumer/<name>/postgres". Same shape as the manager's
# own app ExternalSecret, which builds "<env>/app/manager" from
# `printf "%s/app/manager" .Values.global.env` (clusters/inventories/manager/templates/
# externalsecret-app.yaml) — a leaf under a tier, composed from the stage.
# =============================================================================
externalsecret-postgres:
  externalSecret:
    enabled: true
    # ExternalSecret CR name — the DISTINCT platform name `postgres-superuser`
    # (per-consumer-postgres.md §5.3), deliberately NOT the target Secret's name.
    # The Secret it writes stays `postgresql-credentials` (targetSecretName below),
    # which is what the postgres pod and the exporter mount by secretKeyRef. The CR
    # is platform-owned and platform-named; the Secret it produces keeps the literal
    # name the workloads reference.
    name: postgres-superuser
    # No `namespace:` — clusters/charts/external-secret falls back to .Release.Namespace.
    # Hardcoding `postgresql` here is precisely the singleton assumption this
    # chart does not make.
    #
    # SecretStore — bind explicitly to the PLATFORM-OWNED store `vault-backend-postgres`
    # that the secret-store dependency below renders, NOT the consumer's own
    # `vault-backend`. Without this name clusters/charts/external-secret falls back to
    # .Values.global.secretStoreName (= `vault-backend`, `global.secretStoreName` in
    # clusters/platform/values-common.yaml),
    # i.e. the consumer's store — which the consumer's OWN chart creates only at its
    # wave -3, far AFTER the postgres pod at wave -20 (§4.3). An ExternalSecret pointed
    # at a store that does not exist yet never materialises `postgresql-credentials` in
    # time, so the pod deadlocks in CreateContainerConfigError (§4.3, §5.3). The
    # platform store is rendered here, in the platform's own credential wave (-21).
    secretStoreName: vault-backend-postgres
    secretStoreKind: SecretStore
    targetSecretName: postgresql-credentials
    vaultPath: ""
    data:
      - secretKey: postgres-password
        property: postgres-password
    # Wave -21 (clusters/charts/external-secret `.externalSecret.annotations`) — the third
    # of the credential trio (with the SecretStore + ServiceAccount below). The
    # whole trio sits one wave BEFORE the pod at -20 so `postgresql-credentials` is
    # materialized before the postgres container mounts it (§4.3). It is settable
    # because clusters/charts/external-secret emits metadata.annotations.
    annotations:
      argocd.argoproj.io/sync-wave: "-21"

# =============================================================================
# PLATFORM-OWNED ESO SecretStore + ServiceAccount for the superuser credential.
#
# The platform source ships its OWN credential objects under DISTINCT names — so it
# never fights the consumer's chart for a resource, and never depends on an object
# the consumer renders late.
#
# The consumer's chart owns SecretStore `vault-backend` + ServiceAccount
# `external-secrets-sa` and creates them at the consumer's wave -3. The postgres pod
# is at wave -20. Reusing `vault-backend` for the credential ExternalSecret would
# therefore point it at a store that does not exist until FAR AFTER the pod that
# needs the Secret, so `postgresql-credentials` would never materialise in time and
# the pod would deadlock in CreateContainerConfigError. That is the deadlock this
# design removes, and it is why `enabled: false` (reuse the consumer's store) is
# wrong rather than safe.
#
# The fix is to render a SECOND, platform-named store in the platform's own wave:
#   • SecretStore     `vault-backend-postgres`   (.name)
#   • ServiceAccount  `postgres-eso`             (.serviceAccountName)
# Both names are DISTINCT from the consumer's `vault-backend` / `external-secrets-sa`,
# so there is NO two-owners-one-object collision — that collision, not late ordering,
# is the real objection to reusing the consumer's names, and distinct names remove
# it (§5.3).
#
# Vault binding: role `consumer-eso` — NOT the subchart default `external-secrets`,
# which is the platform-namespace role. A consumer namespace is authorised only for
# the label-bound `consumer-eso` role, whose read policy is templated on the
# NAMESPACE, not the ServiceAccount, so `postgres-eso` reads exactly what
# `external-secrets-sa` reads in the same namespace and nothing more. This requires
# the consumer-eso Vault role to admit the second SA name
# (bound_service_account_names=external-secrets-sa,postgres-eso) — a Vault-side
# change, made where the cluster's Vault is seeded and not by this chart.
# The Vault address / KV mount / auth mount all arrive through the platform globals the
# subchart already reads (global.endpoints.vault.url, global.vaultKvMount,
# global.vaultKubernetesAuthPath), the same way every other app's SecretStore does.
#
# WAVE -21 (clusters/charts/secret-store `.annotations`): the SecretStore and the
# ServiceAccount this dependency renders are two of the credential trio and sit in
# wave -21 — one wave BEFORE the pod at -20 — so `postgresql-credentials` is
# materialized before the postgres container mounts it (§4.3). Set in slice S2a now
# that clusters/charts/secret-store emits metadata.annotations; the ONE `.annotations` map
# stamps BOTH objects (the third of the trio is the ExternalSecret above, also -21).
# =============================================================================
secret-store:
  enabled: true
  # Wave -21 — clusters/charts/secret-store applies this one `.annotations` map to BOTH the
  # SecretStore and the ServiceAccount it renders (they are one ESO unit). See the
  # header block above for why the whole credential trio sits at -21.
  annotations:
    argocd.argoproj.io/sync-wave: "-21"
  # DISTINCT platform names — must NOT equal the consumer's `vault-backend` /
  # `external-secrets-sa` (§5.3): distinct names are exactly what prevents the
  # two-owners-one-object collision.
  name: vault-backend-postgres
  serviceAccountName: postgres-eso
  # The same Vault role the consumer's own store uses (namespace-templated read
  # policy) — overrides the subchart default `external-secrets`.
  role: consumer-eso

# =============================================================================
# NetworkPolicy — a per-consumer database must NOT be reachable on 5432 from
# every namespace in the cluster (templates/networkpolicy.yaml). See the long
# WHY there. The two names below are the ONLY cross-namespace clients the design
# admits; everything else reaches postgres only from inside this namespace.
# =============================================================================
networkPolicy:
  enabled: true
  # Namespaces admitted to :5432 BY NAME (namespaceSelector on
  # kubernetes.io/metadata.name), deliberately NOT by global.consumerLabels.mongodb —
  # every consumer namespace carries that label, so admitting by it would open
  # this database to every OTHER consumer (per-consumer-postgres.md §9.1).
  allowedNamespaces:
    # service-provisioner connects cross-namespace to create databases[1..] and
    # to mint / re-mint the consumer role (§5.4). Verified live: the provisioner
    # runs in namespace `service-provisioner`
    # (clusters/argocd/files/platform-apps-appset.yaml element namespace: service-provisioner).
    - service-provisioner
    # backup runs the nightly pg_dumpall once apps/backup exists (§9.1, §11).
    # Harmless before then — the namespace simply does not exist, so the
    # namespaceSelector matches nothing.
    - backup

# =============================================================================
# Metrics + alerting. ONE switch (metrics.enabled) governs BOTH halves so they
# can never be half-configured: it gates the prometheus-postgres-exporter
# dependency (Chart.yaml `condition: metrics.enabled`) AND the inlined
# PrometheusRule (templates/prometheusrule.yaml, `{{ if .Values.metrics.enabled }}`).
# =============================================================================
metrics:
  enabled: true

# Alert tuning for the inlined PrometheusRule (templates/prometheusrule.yaml).
#
# WHY THE RULE IS A LOCAL TEMPLATE, NOT the shared clusters/charts/monitoring subchart:
# per-consumer isolation requires every alert EXPRESSION to be scoped to this
# instance's own namespace (finding 5 / §10.3) — otherwise, because the live
# Prometheus has an empty enforcedNamespaceLabel, one consumer's PostgreSQLDown
# fires whenever ANY other consumer's database is down. The monitoring subchart
# renders rules from values verbatim (toYaml, no tpl), so it structurally cannot
# inject .Release.Namespace into an expr. A local template can — at the price of
# escaping Prometheus's own {{ $labels }} vars, which the template does.
monitoring:
  # Storage early-warning threshold, in GiB — design §10.3 / risk R12. The PVC
  # size is a declaration, not a bound (the hostpath provisioner enforces no
  # capacity), so a runaway consumer can fill the node's single filesystem and
  # take Vault/zot/Prometheus/etc. down with it. This alert names WHICH consumer
  # is growing before the node does. Set to ~80% of this preset's data PVC
  # (small 5Gi → 4Gi); overridden per size preset. Converted to bytes at render.
  dataAlertThresholdGi: 4

# Metrics exporter (upstream prometheus-community chart). Connects as the
# postgres superuser using the password from the postgresql-credentials Secret.
prometheus-postgres-exporter:
  config:
    datasource:
      # SAME-NAMESPACE Service DNS — this is what replaced the hardcoded
      # postgresql-<stage>.postgresql.svc.cluster.local of the shared app.
      # The upstream chart passes this string through Helm's `tpl` with ITS OWN
      # subchart context, so .Release.Namespace resolves but the parent's
      # postgres.* values do NOT. The service name below must therefore stay a
      # literal, and it must match `postgres.fullnameOverride` above — the one
      # coupling in this file, noted at both ends.
      host: 'postgres.{{ .Release.Namespace }}.svc.cluster.local'
      user: postgres
      passwordSecret:
        name: postgresql-credentials
        key: postgres-password
      port: "5432"
      database: postgres
      sslmode: disable
  serviceMonitor:
    enabled: true
    labels:
      release: observability
  # No Role/RoleBinding. The upstream chart's rbac.create renders an EMPTY Role
  # (it declares no rules at all) plus its RoleBinding — dead weight anywhere,
  # and outright REJECTED in a consumer namespace: the per-consumer AppProject
  # blacklists rbac.authorization.k8s.io Role and RoleBinding, so the sync would
  # fail. The exporter needs no Kubernetes API access; it only talks to postgres.
  rbac:
    create: false
  # Exporter cost is FIXED across the three size presets: it runs the same
  # handful of pg_stat queries regardless of how big the database is. Measured
  # 1m CPU / 21Mi memory next to a shared instance, versus the upstream-style
  # 50m/64Mi request and 200m/128Mi limit — which, multiplied per consumer, is
  # exactly the waste these numbers avoid.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
