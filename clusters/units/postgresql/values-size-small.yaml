# SIZE PRESET — small (the chart DEFAULT).
#
#   cpu req 25m · mem req 256Mi · cpu lim 500m · mem lim 512Mi · data PVC 5Gi
#
# FOR: one consumer application whose working set fits in PostgreSQL's stock
# 128MB shared_buffers, single-digit concurrent connections, data measured in
# hundreds of megabytes. This covers every consumer we run today.
#
# THIS FILE IS INTENTIONALLY EMPTY — that is the whole point of it.
# The small values live in values.yaml itself — not just the four resource
# numbers but also the server config (postgres.args: shared_buffers=128MB,
# max_connections=50, autovacuum_work_mem=32MB) and the storage-alert threshold
# (monitoring.dataAlertThresholdGi: 4) — so that a render which names NO size
# gets the frugal preset rather than the generous one, and so that the small
# numbers exist exactly once (a values-size-small.yaml restating them would be a
# second copy free to drift from the default). The file exists purely so that
# every renderer can name its size uniformly with
#
#     -f values-size-<size>.yaml
#
# for all three sizes, instead of carrying a conditional for the one size that
# has no file. Layering it changes nothing: `helm template clusters/units/postgresql` and
# `helm template clusters/units/postgresql -f values-size-small.yaml` render identically.
#
# Where the numbers come from is documented once, in the values.yaml header.
