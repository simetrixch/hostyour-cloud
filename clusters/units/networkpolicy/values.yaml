# The platform namespaces admitted to every pod of the unit namespace, BY NAME
# (namespaceSelector on kubernetes.io/metadata.name, the label the API server
# sets on every namespace). Both names are fixed by the platform catalog
# clusters/argocd/files/platform-apps-appset.yaml, not per installation:
#
#   ingress         Traefik. THE public path into the unit — and also the path
#                   every cross-unit call takes, because a unit addresses another
#                   unit by its public FQDN and CoreDNS hairpins that name back to
#                   the Traefik ClusterIP.
#   observability   Prometheus. It scrapes the postgres exporter on :9187 inside
#                   the consumer's OWN namespace (clusters/units/postgresql/templates/networkpolicy.yaml
#                   leaves that pod unpoliced on purpose) and whatever a unit
#                   declares through clusters/charts/monitoring.
#
# A name removed here is a path closed for every unit at once.
admittedNamespaces:
  - ingress
  - observability

# The unit's SMTP entry, when its registration declares one: `port` alone, set by the consumer
# ApplicationSet, which also loads the books cluster's map for the address it admits. EMPTY for
# every other unit, and a tenant never has one. See the third opening in
# templates/networkpolicy.yaml.
smtpEntry: {}

# The namespace the installation's mail relay runs in (clusters/inventories/postfix/app.yaml), admitted
# on the SMTP entry's port beside the books cluster's tailnet address — for a unit that stands on the
# books cluster itself. See the third opening in templates/networkpolicy.yaml.
relayNamespace: postfix
