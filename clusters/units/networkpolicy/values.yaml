# The platform pods admitted to every pod of the unit namespace: per namespace, named BY NAME
# (kubernetes.io/metadata.name, the label the API server sets on every namespace), the
# app.kubernetes.io/name of the pods there that have to reach a unit. Both namespaces are fixed by
# the platform catalog clusters/argocd/files/platform-apps-appset.yaml, not per installation, and
# every other pod in them is refused:
#
#   ingress         traefik. THE public path into the unit — and also the path every cross-unit
#                   call takes, because a unit addresses another unit by its public FQDN and
#                   CoreDNS hairpins that name back to the Traefik ClusterIP.
#   observability   prometheus, which scrapes on the master, and alloy, which scrapes on every
#                   other cluster (clusters/charts/monitoring/templates/alloy-agent-config.yaml):
#                   the postgres exporter on :9187 inside the consumer's OWN namespace
#                   (clusters/units/postgresql/templates/networkpolicy.yaml leaves that pod unpoliced
#                   on purpose) and whatever a unit declares through clusters/charts/monitoring.
#
# A name removed here is a path closed for every unit at once.
admittedNamespaces:
  ingress:
    - traefik
  observability:
    - prometheus
    - alloy

# The unit's SMTP entry, when its registration declares one: `port` alone, set by the consumer
# ApplicationSet, which also loads the books cluster's map for the address it admits. EMPTY for
# every other unit, and a tenant never has one. See the third opening in
# templates/networkpolicy.yaml.
smtpEntry: {}

# The namespace the installation's mail relay runs in (clusters/inventories/postfix/app.yaml), admitted
# on the SMTP entry's port beside the books cluster's tailnet address — for a unit that stands on the
# books cluster itself. See the third opening in templates/networkpolicy.yaml.
relayNamespace: postfix
