{{- /*
Who may open :6379 on the consumer's own server: the consumer's own pods (its application,
the exporter, the Manager's dump and restore jobs) and the namespaces named in
.Values.networkPolicy.allowedNamespaces — the service-provisioner, which writes the ACL user a
redis claim gets. The namespace's own policy (clusters/units/networkpolicy) already admits the
same-namespace pods; this one is the server's own fence, as clusters/units/postgresql has.
*/ -}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-allow-internal
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        {{- range .Values.networkPolicy.allowedNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 6379
{{- end }}
