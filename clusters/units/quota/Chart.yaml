apiVersion: v2
name: unit-quota
version: 1.0.0
description: The resource ceiling for ONE unit namespace — a consumer's, or one tenant member's. A ResourceQuota that caps what the namespace may request and burst to, and the LimitRange without which that cap would reject every pod that declares no resources of its own. Rendered as an extra source of the unit's own Application (clusters/argocd/apps/consumers-appset.yaml and tenants-appset.yaml), so it is created, healed and pruned with the namespace it bounds. The numbers arrive per unit from its registration; this chart holds none of its own.
type: application
