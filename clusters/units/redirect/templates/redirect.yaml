{{- /* Per old host: its certificate from the platform authority, a redirectRegex that keeps path and
query (Traefik matches the whole request URL), and a route over websecure to noop@internal, which
answers nothing itself, so the redirect is all an old host serves. permanent answers GET with 301
and every other method with 308. Each object is named by its old host with dashes for dots, so no
reference rests on Traefik reading a dotted name, and a short hash of the host keeps two hosts a dot
apart (shop.dev.<apex>, shop-dev.<apex>) from sharing a name in the namespace. */ -}}
{{- $issuer := required "unit-redirect: global.clusterIssuer is required (clusters/platform/values-common.yaml)" .Values.global.clusterIssuer }}
{{- range .Values.redirects }}
{{- $name := printf "%s-%s" (replace "." "-" .from) (sha256sum .from | trunc 8) }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $name | quote }}
spec:
  secretName: {{ printf "%s-tls" $name | quote }}
  dnsNames:
    - {{ .from | quote }}
  issuerRef:
    kind: ClusterIssuer
    name: {{ $issuer | quote }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $name | quote }}
spec:
  redirectRegex:
    regex: '^https?://[^/]+(.*)$'
    replacement: {{ printf "https://%s${1}" .to | quote }}
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $name | quote }}
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: {{ printf "Host(`%s`)" .from | quote }}
      middlewares:
        - name: {{ $name | quote }}
      services:
        - name: noop@internal
          kind: TraefikService
  tls:
    secretName: {{ printf "%s-tls" $name | quote }}
{{- end }}
