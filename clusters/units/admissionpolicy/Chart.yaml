apiVersion: v2
name: unit-admissionpolicy
version: 1.0.0
description: The admission boundary of ONE unit — a ValidatingAdmissionPolicy and its Binding, cluster-scoped on the cluster the unit runs on. Its AppProject fences what the unit may SUBMIT; this fences what the resulting objects may SAY — which FQDNs an Ingress serves, that a Service is ClusterIP, and that a Namespace the unit creates is its own and carries no platform label it was not granted. Rendered per registration by clusters/argocd/files/units-appset.yaml; the granted set arrives from registrations/<unit>/<stage>.yaml and this chart holds none of its own.
type: application
