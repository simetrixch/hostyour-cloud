{{- /*
The unit's admission boundary — what its objects may SAY, once its AppProject has decided what it may
submit. The two hold together whatever the unit deploys, which is what makes a per-release check
unnecessary. One policy per (unit, stage): the unit's namespace is `<name>-<stage>`, and so is
everything this file pins to it.

SEVEN CLAUSES, FOUR RESOURCES, AND EACH CLAUSE IS A WHOLE ANSWER:

  Ingress         every rule's FQDN is one the platform GRANTED: `<name>-<stage>.<unitApex>` always,
                  plus the unit's attested `fqdn` where its stage registration carries one. A rule
                  with no host serves every FQDN that reaches the ingress, so an absent field is a
                  violation and not an exemption. NOT `*.<name>-<stage>`: the platform's DNS carries
                  one record per unit and stage, so no resolver exists for a sub-host.
  Ingress         spec.tls is held to the SAME granted set, because a tls host drives an ACME order
                  against the shared cluster-issuer — a name is a claim there even when no rule
                  serves it.
  Ingress         the platform address stands in a tls entry of its OWN. cert-manager builds one
                  Certificate per entry and an ACME order is atomic, so a granted customer domain
                  sharing the entry would tie the platform certificate's renewal to a DNS record the
                  platform does not control, and its expiry would take the unit's own address down
                  weeks after an onboard nobody remembers.
  Service         type ClusterIP only. A LoadBalancer or a NodePort reaches past the ingress the
                  host clauses just pinned, and past the NetworkPolicy that follows the namespace.
  ServiceAccount  the two Vault alias annotations may claim only this unit and this stage. The
                  Kubernetes auth mount lifts `vault.hashicorp.com/alias-metadata-unit` and
                  `vault.hashicorp.com/alias-metadata-stage` off the calling ServiceAccount into
                  its login alias, and the consumer read policy binds its path on that pair:
                  `secret/data/<stage>/consumer/<unit>/*`. So the annotation is a CLAIM the
                  workload makes about who it is, and nothing in Vault checks it — a
                  ServiceAccount annotated with a neighbour's name and stage reads the neighbour's
                  entry. This clause is what makes the claim true: absent is fine (such an account
                  reads nothing), and any value but the unit's own name and own stage is refused.
  Namespace       a unit may only create the namespace it IS.
  Namespace       and that namespace may say nothing in the platform's own label namespaces beyond
                  the pairs the platform itself stamps. This is the clause that keeps a namespace
                  label from being a self-service grant: a ServiceAccount named
                  `external-secrets-sa` beside a self-written `hostyour.cloud/workload` label reads
                  the whole app tier of the cluster's Vault mount, and a self-written
                  `pod-security.kubernetes.io/enforce: privileged` runs a privileged pod on a shared
                  node.

THE NAMESPACE CLAUSES DICTATE HOW THIS IS SCOPED, and the scope lives in matchConditions rather than
in the Binding. A Binding's namespaceSelector is evaluated, for an object that IS a Namespace,
against that object's OWN labels — the API server stamps `kubernetes.io/metadata.name` on every
namespace — so a selector pinned to the unit's namespace would SKIP every foreign namespace name, and
the clause that refuses a foreign name could never fire. So: namespaced kinds are confined to the
unit's own namespace by `request.namespace` (a false matchCondition SKIPS the request, which is scope
and not a verdict), while every Namespace admission on the cluster is evaluated and the reach
limiter for those is the reconciler's tracking id.

THE STAGE IS THE REGISTRATION'S AND NOT global.env. The two are the same value on the wire — the
ApplicationSet loads the platform file of the unit's stage — but the registration path is the one
writer of a unit's stage, and a policy reading it from a values file would fence the unit against a
stage a second source named.

WHY THE VALUES CANNOT ESCAPE THE SINGLE-QUOTED CEL LITERALS: every one of them comes from a validated
grammar before it is written into a registration — the unit name alphabet, the stage vocabulary, the
public-FQDN grammar the onboard's attestation applies, and a fixed service vocabulary. None of the
four admits an apostrophe.
*/ -}}
{{- $name := required "unit-admissionpolicy: registration.name is required — it names the policy, the namespace the clauses fence, and the platform address they admit" .Values.registration.name }}
{{- $stage := required "unit-admissionpolicy: registration.stage is required — it is read off registrations/<unit>/<stage>.yaml by clusters/argocd/files/units-appset.yaml; the unit's namespace and Application are <name>-<stage>, and that name is the prefix of every tracking id the Namespace clauses read" .Values.registration.stage }}
{{- $unitApex := required "unit-admissionpolicy: global.unitApex is required (clusters/active/<fqdn>.yaml) — a unit's platform address is <name>-<stage>.<unitApex>, and a host clause rendered against a guessed apex fences the unit off its own ingress" .Values.global.unitApex }}
{{- $trackingId := required "unit-admissionpolicy: trackingIdAnnotation is required — without it the cluster-scoped clauses would reach every namespace on the cluster instead of the ones this unit owns" .Values.trackingIdAnnotation }}
{{- $services := required "unit-admissionpolicy: registration.servicesJson is required — the attested claim list decides two of the granted namespace labels, and an absent one would grant them to a unit that never claimed them" .Values.registration.servicesJson | fromJsonArray }}
{{- $keyPatterns := required "unit-admissionpolicy: registration.keyPatternsJson is required — it is the granted set every ServiceClaim of this namespace is held to, and an absent one would leave the clause comparing against nothing" .Values.registration.keyPatternsJson | fromJsonArray }}
{{- $namespace := printf "%s-%s" $name $stage }}
{{- $policyName := printf "consumer-%s" $namespace }}
{{- $host := printf "%s.%s" $namespace $unitApex }}
{{- $fqdns := list $host }}
{{- if .Values.registration.fqdn }}
{{- $fqdns = append $fqdns .Values.registration.fqdn }}
{{- end }}
{{- $ownedByUnit := printf "has(object.metadata.annotations) && '%s' in object.metadata.annotations && object.metadata.annotations['%s'].startsWith('%s:')" $trackingId $trackingId $namespace }}
{{- /* The granted patterns as ONE CEL list literal. Written as a list rather than a chain of
       comparisons because the clause asks whether every pattern a claim names is IN it, which is
       the shape `all(p, p in [...])` wants. An empty registration renders `[]`, and every claim
       naming a pattern is then refused - the fail-closed direction. */}}
{{- $grantedPatterns := list }}
{{- range $keyPatterns }}
{{- $grantedPatterns = append $grantedPatterns (printf "'%s'" .) }}
{{- end }}
{{- $ruleHosts := list }}
{{- $tlsHosts := list }}
{{- range $fqdns }}
{{- $ruleHosts = append $ruleHosts (printf "r.host == '%s'" .) }}
{{- $tlsHosts = append $tlsHosts (printf "h == '%s'" .) }}
{{- end }}
{{- $said := ternary "the FQDN" "the FQDNs" (eq (len $fqdns) 1) }}
{{- $granted := list
      (list "pod-security.kubernetes.io/enforce" "restricted")
      (list "hostyour.cloud/consumer" "true")
      (list "hostyour.cloud/consumer-name" $name)
      (list "hostyour.cloud/consumer-stage" $stage)
      (list "platform/db-consumer" "true") }}
{{- if has "redis" $services }}
{{- $granted = append $granted (list "platform/redis-consumer" "true") }}
{{- end }}
{{- if has "postfix" $services }}
{{- $granted = append $granted (list "platform/postfix-consumer" "true") }}
{{- end }}
{{- $grantedPair := list }}
{{- $grantedText := list }}
{{- range $granted }}
{{- $grantedPair = append $grantedPair (printf "(k == '%s' && object.metadata.labels[k] == '%s')" (index . 0) (index . 1)) }}
{{- $grantedText = append $grantedText (printf "%s=%s" (index . 0) (index . 1)) }}
{{- end }}
{{- $reservedPrefixes := required "unit-admissionpolicy: reservedLabelPrefixes is required — an empty list would reserve nothing and the label clause would admit every platform label a unit wrote on itself" .Values.reservedLabelPrefixes }}
{{- $reservedKey := list }}
{{- range $reservedPrefixes }}
{{- $reservedKey = append $reservedKey (printf "k.startsWith('%s')" .) }}
{{- end }}
{{- $aliasUnit := "vault.hashicorp.com/alias-metadata-unit" }}
{{- $aliasStage := "vault.hashicorp.com/alias-metadata-stage" }}
{{- $aliasClaims := printf "(!('%s' in object.metadata.annotations) || object.metadata.annotations['%s'] == '%s') && (!('%s' in object.metadata.annotations) || object.metadata.annotations['%s'] == '%s')" $aliasUnit $aliasUnit $name $aliasStage $aliasStage $stage }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $policyName }}
  labels:
    hostyour.cloud/consumer: "true"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["ingresses"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["services"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["serviceaccounts"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
      - apiGroups: ["platform.hostyour.cloud"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["serviceclaims"]
  matchConditions:
    - name: unit-scope
      expression: {{ printf "request.resource.resource == 'namespaces' || request.namespace == '%s'" $namespace | quote }}
  validations:
    - expression: {{ printf "request.resource.resource != 'ingresses' || (has(object.spec.rules) && object.spec.rules.all(r, has(r.host) && (%s)))" (join " || " $ruleHosts) | quote }}
      message: {{ printf "a consumer Ingress may only serve %s %s" $said (join " and " $fqdns) | quote }}
    - expression: {{ printf "request.resource.resource != 'ingresses' || !has(object.spec.tls) || object.spec.tls.all(t, has(t.hosts) && t.hosts.all(h, %s))" (join " || " $tlsHosts) | quote }}
      message: {{ printf "a consumer Ingress tls entry may only carry %s %s — a certificate is only ordered for granted names" $said (join " and " $fqdns) | quote }}
    - expression: {{ printf "request.resource.resource != 'ingresses' || !has(object.spec.tls) || object.spec.tls.all(t, !(has(t.hosts) && ('%s' in t.hosts) && t.hosts.size() > 1))" $host | quote }}
      message: {{ printf "the platform FQDN %s must stand in a tls entry of its own — a shared entry is one atomic certificate order, and a name pointed elsewhere would block its renewal" $host | quote }}
    - expression: "request.resource.resource != 'services' || !has(object.spec.type) || object.spec.type == 'ClusterIP'"
      message: "a consumer Service must be of type ClusterIP"
    - expression: {{ printf "request.resource.resource != 'serviceclaims' || !has(object.spec.keyPatterns) || object.spec.keyPatterns.all(p, p in [%s])" (join ", " $grantedPatterns) | quote }}
      message: {{ printf "a consumer ServiceClaim may ask for the redis key patterns its registration grants and no others (%s) — one redis serves every consumer of this cluster out of ONE keyspace, and the patterns an ACL user may touch are the only thing that separates two of them in it, so a pattern a chart wrote for itself is a self-granted read of a neighbour's keys" (default "none" (join ", " $keyPatterns)) | quote }}
    - expression: {{ printf "request.resource.resource != 'serviceaccounts' || !has(object.metadata.annotations) || (%s)" $aliasClaims | quote }}
      message: {{ printf "a consumer ServiceAccount may claim %s only as %s and %s only as %s — the Vault login alias reads that pair, and the consumer policy opens secret/<stage>/consumer/<unit>/* on it" $aliasUnit $name $aliasStage $stage | quote }}
    - expression: {{ printf "request.resource.resource != 'namespaces' || !(%s) || object.metadata.name == '%s'" $ownedByUnit $namespace | quote }}
      message: {{ printf "a consumer may only create its own namespace %s" $namespace | quote }}
    - expression: {{ printf "request.resource.resource != 'namespaces' || !(%s) || !has(object.metadata.labels) || object.metadata.labels.all(k, !(%s) || %s)" $ownedByUnit (join " || " $reservedKey) (join " || " $grantedPair) | quote }}
      message: {{ printf "a consumer namespace may carry no label under %s beyond the ones the platform stamps on it (%s) — those label namespaces bind Vault roles, admit network reach and set pod security, so a self-written one is a self-granted permission" (join ", " $reservedPrefixes) (join ", " $grantedText) | quote }}
---
{{- /*
NO matchResources ON THE BINDING. It arms the policy for everything matchConstraints names, and every
scope this boundary has lives in the policy's own matchConditions. A namespaceSelector here would be
matched against a Namespace object's own labels and would skip every foreign namespace name — the
exact admission the own-name clause exists to refuse.
*/ -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $policyName }}
  labels:
    hostyour.cloud/consumer: "true"
spec:
  policyName: {{ $policyName }}
  validationActions:
    - Deny
