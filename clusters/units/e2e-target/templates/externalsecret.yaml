{{- /*
The Secret e2e-<guid>-<stage> a run of the E2E runner names (clusters/inventories/e2e-runner,
templates/task-run-case.yaml): the tenant's E2E password and the host it belongs to, in one object,
so a run cannot pair a password with another tenant's host.

The password is read through the e2e-runner's own SecretStore, whose Vault role reads the E2E
entries and nothing else. The store's name comes from the e2e-runner's values-common.yaml, which
the ApplicationSet loads into this chart's chain.

NO PERIODIC READ OF VAULT (the platform rule, stated in full in
clusters/charts/external-secret/templates/externalsecret.yaml). That holds the password current
here because the Manager mints a new one only when a tenant is switched to demo, and a switch to
demo follows a switch off, which takes the tenant out of the ApplicationSet's selection: this
Application and its Secret are deleted, and the next switch on fetches the new value.
*/ -}}
{{- $guid := required "target.guid is empty: the ApplicationSet hands it from the registration's path" .Values.target.guid }}
{{- $stage := required "target.stage is empty: the ApplicationSet hands it from the registration's file name" .Values.target.stage }}
{{- $host := required "target.host is empty: the ApplicationSet hands it from the registration's own domain or zone" .Values.target.host }}
{{- $store := required "e2e-password-store.name is empty: the ApplicationSet loads clusters/inventories/e2e-runner/values-common.yaml, which names the store" (index .Values "e2e-password-store" | default dict).name }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: e2e-{{ $guid }}-{{ $stage }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: {{ $store }}
    kind: SecretStore
  target:
    name: e2e-{{ $guid }}-{{ $stage }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        password: "{{ `{{ .password }}` }}"
        host: {{ $host | quote }}
  data:
    - secretKey: password
      remoteRef:
        key: {{ printf "%s/tenants/%s/e2e" $stage $guid }}
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
