apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.fullname" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
  {{- /*
  Resource-level annotations on the Deployment OBJECT itself — deliberately
  distinct from .Values.podAnnotations below, which annotates the POD TEMPLATE
  (spec.template.metadata). This block is for annotations a controller reads off
  the workload resource, e.g. an ArgoCD sync-wave (argocd.argoproj.io/sync-wave).
  Optional + guarded: unset (default {}) renders NOTHING, so every app that sets
  no annotations is byte-identical to before. Same idiom as clusters/charts/pvc's
  .Values.pvc.annotations (clusters/charts/pvc/templates/pvc.yaml).
  */}}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  revisionHistoryLimit: 3
  replicas: {{ .Values.replicas }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      {{- /* e.g. a config-revision string bumped when a mounted ConfigMap changes,
             so the pod rolls and re-reads config the process only loads at startup. */}}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "common.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccountName }}
      serviceAccountName: {{ .Values.serviceAccountName }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "common.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- /*
          Optional container lifecycle hooks (e.g. a postStart that runs
          rs.initiate() for a single-node MongoDB replica set). Only rendered
          when set, so existing consumers are unaffected.
          */}}
          {{- with .Values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- /*
          The env vars come from .Values.env alone. Merging .Values.global.env in
          as well is the one thing that must not be added back: that key carries
          the platform-wide `global.env: dev|test|prod` string, not a list.

          Apply Helm `tpl` to the env YAML so a value can compose itself from
          `.Values.global.*` instead of being written out per stage or per
          cluster. Only `global` is reachable from here: `$` is the root of THIS
          sub-chart's render, so its `.Values` is the consuming chart's block for
          this dependency plus the globals, and never that chart's other keys.
          */}}
          {{- with .Values.env }}
          env:
            {{- tpl (toYaml .) $ | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
