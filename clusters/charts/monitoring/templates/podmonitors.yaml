{{- /*
Emit one PodMonitor per entry under .Values.podMonitors. Same shape as
servicemonitors.yaml but with podMetricsEndpoints. Use a PodMonitor when the
metrics port exists on the pod but not on any Service (e.g. Traefik :9100,
ArgoCD's per-component metrics ports).

ONLY WHERE THE CLUSTER SERVES THE KIND. ArgoCD hands helm the destination cluster's API
versions, and the CRDs of monitoring.coreos.com arrive with observability (wave 30 on a
master, the agent on a slave). An application before it that renders this kind fails its
sync's dry run — "could not find monitoring.coreos.com/…" — and under the RollingSync
its step never ends (measured on apps1: tekton at wave 3 held twelve applications). So
nothing is emitted until the API has the kind; the next refresh after observability
renders it, and the controller syncs the difference.
*/ -}}
{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1" }}
{{- range $name, $cfg := .Values.podMonitors }}
{{- if $cfg.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ $name }}
  namespace: {{ default $.Release.Namespace $cfg.namespace }}
  labels:
    release: {{ $.Values.prometheusReleaseLabel }}
spec:
  {{- with $cfg.namespaces }}
  namespaceSelector:
    matchNames: {{ toYaml . | nindent 6 }}
  {{- end }}
  selector:
    matchLabels: {{ toYaml $cfg.matchLabels | nindent 6 }}
    {{- with $cfg.matchExpressions }}
    matchExpressions: {{ toYaml . | nindent 6 }}
    {{- end }}
  podMetricsEndpoints: {{ toYaml $cfg.podMetricsEndpoints | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
