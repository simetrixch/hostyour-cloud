{{- /*
Emit one ServiceMonitor per entry under .Values.serviceMonitors. The values key
becomes metadata.name. Each entry's `enabled` flag gates the CR.

Defaults: namespace falls back to .Release.Namespace; consumers that need to
emit a CR in a *different* namespace (clusters/inventories/observability/ does this for the 5
foreign-infra monitors) set .namespace explicitly.

ONLY WHERE THE CLUSTER SERVES THE KIND. ArgoCD hands helm the destination cluster's API
versions, and the CRDs of monitoring.coreos.com arrive with observability (wave 30 on a
master, the agent on a slave). An application before it that renders this kind fails its
sync's dry run — "could not find monitoring.coreos.com/…" — and under the RollingSync
its step never ends (measured on apps1: tekton at wave 3 held twelve applications). So
nothing is emitted until the API has the kind; the next refresh after observability
renders it, and the controller syncs the difference.
*/ -}}
{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1" }}
{{- range $name, $cfg := .Values.serviceMonitors }}
{{- if $cfg.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  namespace: {{ default $.Release.Namespace $cfg.namespace }}
  labels:
    release: {{ $.Values.prometheusReleaseLabel }}
spec:
  {{- with $cfg.namespaces }}
  namespaceSelector:
    matchNames: {{ toYaml . | nindent 6 }}
  {{- end }}
  selector:
    {{- /* tpl so label VALUES may compose from globals (e.g. registry's
    'registry-{{ .Values.global.env }}' instance label). Without tpl the
    literal braces land in the CR and the monitor never matches its
    Service. Static maps pass through tpl unchanged. */}}
    matchLabels: {{ tpl (toYaml $cfg.matchLabels) $ | nindent 6 }}
    {{- with $cfg.matchExpressions }}
    matchExpressions: {{ toYaml . | nindent 6 }}
    {{- end }}
  endpoints: {{ toYaml $cfg.endpoints | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
