{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecret.name | default (include "common.fullname" .) }}
  namespace: {{ .Values.externalSecret.namespace | default .Release.Namespace }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
  {{- /* Resource-level annotations on the ExternalSecret (e.g. an ArgoCD
         sync-wave, so the materialized Secret lands before the pod that mounts
         it). Optional + guarded — unset renders nothing, byte-identical for apps
         that set none. Same idiom as clusters/charts/pvc's .Values.pvc.annotations. */}}
  {{- with .Values.externalSecret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # THE SECRET DELIVERY RULE OF THIS TREE, stated here once and carried by every
  # ExternalSecret in it: a secret reaches a cluster in exactly two moments —
  # when it is DEPLOYED, and when its target Secret is DELETED. Nothing here
  # reads Vault on a timer.
  #
  # The two lines below are that sentence, and they are LITERALS rather than
  # values on purpose: a per-app override is how one namespace ends up on a
  # different delivery model than every other, and the difference stays invisible
  # until somebody puts a new value behind one of them.
  #
  # A check reads every document of kind ExternalSecret in this tree and reports
  # each one stating either line as anything but the literal below — a values
  # reference and a template expression included. It is not named here by path.
  # It lives in another repository and has already moved once, and the comment
  # that named where it used to be went on asserting a file that is not there,
  # which is worse than saying nothing: it claims this rule is enforced from a
  # place a reader can check, and the place is empty.
  #
  # OnChange is what makes the DEPLOY half true, and it is not the default —
  # `Periodic` is. The two differ exactly where it matters (upstream
  # external-secrets.io/latest/api/externalsecret, and the vendored CRD's own
  # description in clusters/apps/external-secrets/templates/crd-externalsecret.yaml):
  #   Periodic + refreshInterval 0 — "creates the secret once without further
  #     updates". A chart change that alters this CR does NOT re-read Vault, which
  #     is what an earlier measurement here ran into and mistook for an ESO fault.
  #   OnChange — "Update the Kind=Secret only when the ExternalSecret's metadata
  #     or specification changes", and "Creates the target Secret if absent",
  #     independent of refreshInterval. Both halves of the rule, by contract.
  # refreshInterval stays "0" beside it: OnChange ignores it, and a stated 0 is
  # what makes a reader see at a glance that nothing here polls.
  #
  # PUTTING A NEW VALUE IN FRONT OF THE PODS is therefore three explicit acts,
  # none of them automatic: write it into Vault, DELETE the target Secret so ESO
  # fetches it, then roll the pods (the restart-workloads run) — env vars are read
  # once at container start, so a running pod keeps the old value until it
  # restarts. Nothing on this platform performs those three as one act, and no
  # component performs even one of them by itself.
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    # Defaults to .Values.global.secretStoreName (clusters/platform/values-common.yaml).
    # Set externalSecret.secretStoreName explicitly only to override.
    name: {{ .Values.externalSecret.secretStoreName | default .Values.global.secretStoreName }}
    kind: {{ .Values.externalSecret.secretStoreKind | default "SecretStore" }}
  target:
    name: {{ .Values.externalSecret.targetSecretName | default (include "common.fullname" .) }}
    creationPolicy: Owner
    {{- with .Values.externalSecret.template }}
    # Optional: assemble derived secret keys (e.g. connection URIs) from pulled
    # properties via ESO templating. Values use ESO's own {{ `{{ .secretKey }}` }}
    # syntax, NOT Helm's — set engineVersion: v2 to enable.
    template:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  data:
  {{- range .Values.externalSecret.data }}
  - secretKey: {{ .secretKey }}
    remoteRef:
      # Emit EVERY defaulted remoteRef field explicitly — including
      # `nullBytePolicy` — so ArgoCD doesn't see them as server-side drift.
      # The vendored ESO CRDs (clusters/apps/external-secrets/templates/, chart
      # 2.6.x) declare all four fields with these defaults; omitting any of
      # them makes the API server fill it in on write and ArgoCD then shows
      # a permanent OutOfSync. When bumping ESO, keep this list in sync
      # with the vendored CRD schema.
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
      key: {{ .vaultPath | default $.Values.externalSecret.vaultPath | required (printf "externalSecret.vaultPath is required (data entry %q has no per-entry vaultPath and no chart-level default)" .secretKey) }}
      property: {{ .property }}
  {{- end }}
{{- end }}
