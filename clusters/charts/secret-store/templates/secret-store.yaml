{{- /*
Per-namespace ESO setup. ESO's namespaced SecretStore can only reference a
ServiceAccount in its OWN namespace (unlike ClusterSecretStore which can
cross namespaces). So this chart creates both:

  1. A local ServiceAccount that Vault's `external-secrets` role accepts.
     Vault's bound_service_account_namespaces list must include this
     release's namespace — it is set where the cluster's Vault is seeded.
  2. A SecretStore referencing the local SA.

The SA gets a token automatically (Kubernetes 1.22+ TokenRequest API);
ESO presents that token to Vault during the kubernetes auth login.
*/ -}}
{{- if .Values.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  {{- /* Resource-level annotations applied to BOTH objects this chart renders
         (this ServiceAccount and the SecretStore below), since the two are one
         ESO unit that always belongs together — e.g. a single ArgoCD sync-wave
         placing the credential-store pair ahead of the workload that consumes
         the Secret. Optional + guarded — unset renders nothing, byte-identical
         for apps that set none. Same idiom as clusters/charts/pvc's pvc.annotations. */}}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  {{- /* Same .Values.annotations map as the ServiceAccount above — the two
         resources are one ESO unit and share their annotations (e.g. sync-wave).
         Guarded, so unset is byte-identical. */}}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  provider:
    vault:
      {{- /*
      Vault URL: explicit secret-store.vaultUrl wins; otherwise falls back to
      .Values.global.endpoints.vault.url (installation/profile.yaml, via the
      $values chain).
      */}}
      server: {{ required "vaultUrl must be set: either secret-store.vaultUrl in the app's values, or global.endpoints.vault.url in installation/profile.yaml" (.Values.vaultUrl | default .Values.global.endpoints.vault.url) | quote }}
      {{- /*
      KV mount: the ONE KV-v2 mount, word-identical on every cluster
      (clusters/platform/values-common.yaml). Required, no chart default — a render
      outside the $values chain must fail loudly, not point ESO at a mount
      that happens to exist.
      */}}
      path: {{ required "global.vaultKvMount must be set (clusters/platform/values-common.yaml via the $values chain)" .Values.global.vaultKvMount | quote }}
      version: {{ .Values.kvVersion | quote }}
      namespace: {{ .Values.vaultNamespace | quote }}
      auth:
        kubernetes:
          {{- /*
          K8s auth mount: every cluster authenticates against its OWN named
          mount `kubernetes-<name>` (installation/profile.yaml, written by
          the branch program); on a pure slave that mount lives on the master's
          Vault and TokenReviews over the LAN. Required, no chart default.
          */}}
          mountPath: {{ required "global.vaultKubernetesAuthPath must be set (installation/profile.yaml via the $values chain)" .Values.global.vaultKubernetesAuthPath | quote }}
          role: {{ .Values.role | quote }}
          serviceAccountRef:
            # Local SA — namespaced SecretStore cannot cross namespaces.
            name: {{ .Values.serviceAccountName | quote }}
{{- end }}
