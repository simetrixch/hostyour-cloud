# yaml-language-server: $schema=
# Authentik blueprint — the digita-post OIDC client (staff-only).
# digita-post is the platform's mail service; its admin UI is served at
# https://post.${IDP_UNIT_APEX}/, below the unit apex like every consumer, and
# only operators log in there. Mirrors 99-manager.yaml: a confidential client
# with the authorization code flow, after which post keeps a session of its
# own, and ONE group PolicyBinding on the platform's `admins` group
# (99-manager.yaml says why a second binding is the worse answer).
# client_secret is !Env IDP_POST_CLIENT_SECRET: deploy-platform-services mints
# it into the secret store and hands it to the pods in idp-bootstrap-secrets.
# The public route post serves the Manager (/api/public/sender-domains/…) asks
# no login and is not this client's business.
# Waits for the admins group to exist first.
version: 1
metadata:
  name: post OIDC client
  labels:
    blueprints.goauthentik.io/instantiate: "true"
conditions:
  - !Find [authentik_core.group, [name, admins]]
entries:
  - id: post-provider
    model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: Post
    attrs:
      name: Post
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      client_type: confidential
      client_id: post
      client_secret: !Env IDP_POST_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://post.%s/api/auth/callback", !Env IDP_UNIT_APEX]
        # RP-initiated logout: Authentik validates the post_logout_redirect_uri against this list,
        # and post sends its site root.
        - matching_mode: strict
          url: !Format ["https://post.%s/", !Env IDP_UNIT_APEX]
      access_token_validity: hours=1
      refresh_token_validity: days=30
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      grant_types:
        - authorization_code
        - refresh_token
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
  - id: post-app
    model: authentik_core.application
    identifiers:
      slug: post
    attrs:
      name: Post
      slug: post
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Post]]
      meta_launch_url: !Format ["https://post.%s/", !Env IDP_UNIT_APEX]
      open_in_new_tab: true
      group: Platform
      # The OR across the bindings, pinned for the reason 99-manager.yaml gives.
      policy_engine_mode: any
  # Restrict the post application to the `admins` group (deny everyone else).
  - id: post-admins-binding
    model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, post]]
      group: !Find [authentik_core.group, [name, admins]]
      order: 0
    attrs:
      enabled: true
