# yaml-language-server: $schema=
# Authentik blueprint — OAuth2 provider + Application for the PER-SLAVE ArgoCD
# instances (argo-<name>.<manager-fqdn>, e.g. argo-s1.m1.example.com).
#
# ONE SHARED client `argo-slave` serves EVERY per-slave ArgoCD: its redirect URI
# is a REGEX that matches any argo-<name> callback, so onboarding a new slave needs
# NO new IdP client — the slave's argocd-cm just points its oidc.config at this
# provider (injected by clusters/argocd/files/slaves-appset.yaml). PUBLIC client +
# PKCE: there is NO client_secret to seal/rotate per slave (the browser performs
# PKCE); authorization is per-instance ArgoCD RBAC by group, not by the OIDC client.
#
# Mounted into the Authentik pod at /blueprints/local/99-argo-slave.yaml via the
# idp-blueprints ConfigMap (the pipeline picks up every *.yaml in this dir). The
# worker auto-applies on startup; idempotent on re-apply. ${IDP_DOMAIN} resolves
# from the idp-bootstrap Secret mounted as envFrom. Mirrors 99-argocd.yaml (the
# master's own ArgoCD), which is a confidential client with a static redirect.
version: 1
metadata:
  name: ArgoCD Slave OIDC client
  labels:
    blueprints.goauthentik.io/instantiate: "true"
# Same gate as 99-argocd.yaml: wait for the `groups` scope mapping to exist.
conditions:
  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]
entries:
  - id: argo-slave-provider
    model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: ArgoCD Slave
    attrs:
      name: ArgoCD Slave
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # RS256 signing (same as 99-argocd.yaml) so ArgoCD verifies via JWKS.
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      # PUBLIC client → no client_secret; ArgoCD uses PKCE (enablePKCEAuthentication).
      client_type: public
      client_id: argo-slave
      # ONE regex covers every per-slave callback argo-<name>.<manager-fqdn>.
      # The controller fqdn's own dots stay unescaped `.` (regex any-char) — the
      # `argo-` prefix + `/auth/callback` anchors make that harmless.
      redirect_uris:
        - matching_mode: regex
          url: !Format ["^https://argo-[a-z0-9-]+\\.%s/auth/callback$", !Env IDP_DOMAIN]
      access_token_validity: hours=1
      refresh_token_validity: days=30
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      grant_types:
        - authorization_code
        - refresh_token
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]
  - id: argo-slave-app
    model: authentik_core.application
    identifiers:
      slug: argo-slave
    attrs:
      name: ArgoCD (slaves)
      slug: argo-slave
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, ArgoCD Slave]]
      # No single launch URL — the instances live at per-slave argo-<name> hosts.
      meta_launch_url: ""
      open_in_new_tab: true
      group: Platform
