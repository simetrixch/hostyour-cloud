# yaml-language-server: $schema=
# Authentik blueprint — the removal of the test account `platform-sign-in` and of the group `platform-readers`. They served a
# sign-in proof of Argo CD and Headlamp. Those are the owner's own consoles and get no test account and no proof run, so both
# are declared absent.
#
# THE FILE STAYS, AND DECLARES THE REMOVAL. An entry that a blueprint stops declaring does not delete its object in Authentik,
# so the account and the group would stay on every installation that holds them. An entry of `state: absent` deletes the
# instance its identifiers find, skips when none is there, and needs no attrs. The three bindings of the group, to the
# applications argocd, headlamp and headlamp-forward-auth, fall with the group (PolicyBinding.group is a ForeignKey with
# on_delete CASCADE), so they get no entry of their own. scripts/platform-test-accounts.test.mjs holds this file to these two
# entries, and holds every other blueprint from declaring either of them again.
version: 1
metadata:
  name: Platform sign-in test account
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - id: platform-sign-in-account
    model: authentik_core.user
    state: absent
    identifiers:
      username: platform-sign-in
  - id: platform-readers-group
    model: authentik_core.group
    state: absent
    identifiers:
      name: platform-readers
