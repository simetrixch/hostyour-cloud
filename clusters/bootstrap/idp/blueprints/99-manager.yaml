# yaml-language-server: $schema=
# Authentik blueprint — the Manager OIDC client (staff-only).
# The Manager is the standalone provider admin UI served at
# https://manager.${IDP_DOMAIN}/ (built from the separate hostyour-manager
# repo, deployed by the `manager` app). Mirrors 99-grafana.yaml (native
# OIDC, confidential client) and the retired 99-console.yaml: restricts the
# Manager application to staff: ONE group PolicyBinding, on the platform's
# `admins` group, which is the same group every other product of this
# installation admits on: the master's ArgoCD
# (clusters/bootstrap/argocd/values.yaml rbac.policy.csv), a slave's ArgoCD
# (clusters/slaves/slave/values-common.yaml rbac.policy.csv) and Grafana
# (role_attribute_path in clusters/inventories/observability/values-{dev,test,
# prod}.yaml).
#
# There used to be a second binding OR'd beside it — an ExpressionPolicy
# `return request.user.is_superuser` — because on a fresh install nobody was
# really in `admins` yet and the first operator would have been shut out. That
# admitted people on a value computed at authorization time rather than on a
# membership anyone can look at. The deployment now puts the first operator
# INTO the group (ansiwise step `authentik_group_membership`), so the gap it
# covered is closed and the one binding is the whole rule.
# `policy_engine_mode: any` stays pinned on the app entry below: it is the
# model default, and the access design reads correctly only where the OR
# semantics are stated rather than inherited.
# client_secret stays ${IDP_MANAGER_CLIENT_SECRET} in git — it is
# sed-resolved into the idp-blueprints ConfigMap at apply time (see
# deploy-idp.sh:_idp_apply_blueprints_configmap), not baked in here.
# Waits for the groups scope mapping AND the admins group to exist first.
version: 1
metadata:
  name: manager OIDC client
  labels:
    blueprints.goauthentik.io/instantiate: "true"
conditions:
  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]
  - !Find [authentik_core.group, [name, admins]]
entries:
  - id: manager-provider
    model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: Manager
    attrs:
      name: Manager
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      client_type: confidential
      client_id: manager
      client_secret: !Env IDP_MANAGER_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://manager.%s/auth/callback", !Env IDP_DOMAIN]
        # RP-initiated logout (/auth/logout): Authentik validates the post_logout_redirect_uri
        # against THIS list. The Manager sends config.publicUrl (the site root, no path), so it
        # must be registered too — otherwise Authentik rejects the logout redirect and "logout
        # does nothing". Matches PUBLIC_URL exactly (https://manager.<domain>, no trailing slash).
        - matching_mode: strict
          url: !Format ["https://manager.%s", !Env IDP_DOMAIN]
      access_token_validity: hours=1
      refresh_token_validity: days=30
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      grant_types:
        - authorization_code
        - refresh_token
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]
  - id: manager-app
    model: authentik_core.application
    identifiers:
      slug: manager
    attrs:
      name: Manager
      slug: manager
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Manager]]
      meta_launch_url: !Format ["https://manager.%s/", !Env IDP_DOMAIN]
      open_in_new_tab: true
      group: Platform
      # Explicit OR across the bindings below: a sign-in passes when ANY
      # binding passes. `any` IS the model default
      # (authentik_policies.PolicyBindingModel.policy_engine_mode defaults to
      # MODE_ANY), but the whole access design depends on the OR semantics, so
      # pin it here instead of trusting a default that a future Authentik
      # release could change.
      policy_engine_mode: any
  # Restrict the Manager application to the `admins` group (deny everyone else).
  - id: manager-admins-binding
    model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, manager]]
      group: !Find [authentik_core.group, [name, admins]]
      order: 0
    attrs:
      enabled: true
