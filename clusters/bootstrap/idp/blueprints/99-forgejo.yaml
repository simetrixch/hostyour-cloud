# yaml-language-server: $schema=
# Authentik blueprint — the Forgejo OIDC client, Forgejo's one sign-in source
# (named `authentik` on the Forgejo side, so its callback is
# /user/oauth2/authentik/callback). Mirrors 99-grafana.yaml and adds the
# access rule of 99-manager.yaml: a group PolicyBinding on the platform's
# `admins` group, and one on `plane-users`, the group of the Plane sign-in
# test accounts (20-plane-test-accounts.yaml).
#
# WHY THE BINDINGS. Forgejo makes an account at the first sign-in
# (ENABLE_AUTO_REGISTRATION), and an account may create repositories whose
# pushes the build plane builds, privileged, on the master. Without the
# bindings every account of this identity provider could do that; with them, a
# person outside `admins` and `plane-users` is refused here and never reaches
# Forgejo.
#
# WHY plane-users IS NOT A WEAKER ADMINS. Plane's sign-in goes through
# Forgejo, so an account that proves it must be admitted there, and `admins`
# would make that account an administrator of Authentik. Forgejo makes a
# member of `plane-users` a restricted account (restrictedGroup in
# ansiwise/templates/forgejo-values.tpl of hostyour-deploy), and the
# deployment's plane-sign-in step sets max_repo_creation 0 and no creation of
# organizations on the test accounts, so none of them can create a repository.
# Waits for the groups scope mapping AND both groups to exist first.
version: 1
metadata:
  name: Forgejo OIDC client
  labels:
    blueprints.goauthentik.io/instantiate: "true"
conditions:
  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]
  - !Find [authentik_core.group, [name, admins]]
  - !Find [authentik_core.group, [name, plane-users]]
entries:
  - id: forgejo-provider
    model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: Forgejo
    attrs:
      name: Forgejo
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      client_type: confidential
      client_id: forgejo
      client_secret: !Env IDP_FORGEJO_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://forgejo.%s/user/oauth2/authentik/callback", !Env IDP_DOMAIN]
      access_token_validity: hours=1
      refresh_token_validity: days=30
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      grant_types:
        - authorization_code
        - refresh_token
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]
  - id: forgejo-app
    model: authentik_core.application
    identifiers:
      slug: forgejo
    attrs:
      name: Forgejo
      slug: forgejo
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Forgejo]]
      meta_launch_url: !Format ["https://forgejo.%s/", !Env IDP_DOMAIN]
      open_in_new_tab: true
      group: Platform
      policy_engine_mode: any
  - id: forgejo-admins-binding
    model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, forgejo]]
      group: !Find [authentik_core.group, [name, admins]]
      order: 0
    attrs:
      enabled: true
  - id: forgejo-plane-users-binding
    model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, forgejo]]
      group: !Find [authentik_core.group, [name, plane-users]]
      order: 1
    attrs:
      enabled: true
