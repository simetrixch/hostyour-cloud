# Traefik forwardAuth Middleware → Authentik's embedded Outpost.
# clusters/inventories/tekton's Ingress references this cross-namespace as
# `idp-forwardauth@kubernetescrd`. Traefik carries
# --providers.kubernetescrd.allowCrossNamespace=true for that, written by
# hostyour-deploy ansiwise/programs/deploy-cluster.yaml, step
# `patch_container_arguments_and_ports`.
#
# THIS MIDDLEWARE REACHES ONLY THE CLUSTER IT STANDS IN. Its address is the
# in-cluster Service idp-authentik-server.idp.svc.cluster.local, and the program
# that installs this directory gates every step of it on
# `when: [idp_enabled, books_here_in_config]` (hostyour-deploy
# ansiwise/programs/deploy-platform-services.yaml) — so on a cluster that does not
# keep the books nothing here is applied, and an Ingress there names a middleware
# that is not present. That is why
# clusters/inventories/dbgate, which stands beside the databases it browses, renders its Ingress
# off rather than gated by a reference that resolves to nothing.
#
# Authentik's `/outpost.goauthentik.io/auth/traefik` endpoint speaks the
# Traefik forwardAuth protocol natively — returns 2xx with X-authentik-*
# headers when the apex session cookie is valid, or 302 to the Authentik
# sign-in flow when not.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forwardauth
  namespace: idp
spec:
  forwardAuth:
    address: http://idp-authentik-server.idp.svc.cluster.local:80/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
