# ArgoCD Helm Values

# Global Configuration
global:
  domain: argo.master.digitacloud.app

  # WHAT EVERY COMPONENT OF THE RECONCILER TRUSTS.
  #
  # Signing in is not only a browser talking to this server. Once the browser comes back with an
  # authorization code, the argocd-server POD exchanges it for a token by calling
  # https://idp.master.digitacloud.app itself, and it verifies that certificate against its own container's trust
  # store — the public root list its image was built with. On an installation issuing from an
  # authority it minted for itself, that call is refused and what a person sees is `invalid_client`,
  # a message about the client rather than about the trust. This platform has produced that message
  # once already.
  #
  # ON `global` AND NOT ON THE SERVER ALONE: the repository server speaks to forges and chart
  # repositories, and the application controller speaks to every registered cluster — including, on
  # a master, the remote slaves. All of them verify, all of them read the same variable, and naming
  # them one by one would leave the next component to be added out.
  #
  # WHY NOT `oidc.config.rootCA`, which this chart also offers: it holds for the sign-in exchange and
  # for nothing else, so every other outbound call would go on using the image's list. This says what
  # the process trusts rather than configuring one call.
  #
  # The file is a SUPERSET — the public roots are in it in both states of the certificate switch —
  # so this adds an authority and takes none away. See
  # clusters/inventories/trust-manager-bundles/templates/bundle.yaml.
  env:
    - name: SSL_CERT_FILE
      value: /etc/platform-trust/ca-certificates.crt

  extraVolumes:
    - name: platform-trust
      configMap:
        name: platform-trust

  extraVolumeMounts:
    - name: platform-trust
      mountPath: /etc/platform-trust
      readOnly: true

# THE CPU REQUESTS OF THE RECONCILER. When a heavy build saturates the node, a pod with no CPU request gets the
# smallest share of it, and the master's GitOps would slow down with the build. Each request is the p95 of that
# pod's CPU use over seven days (container_cpu_usage_seconds_total, 5 minute rate, read from the master's
# Prometheus on 2026-10-15), rounded up to the next 10m, and to the next 50m from 100m on:
#
#   application controller 219m -> 250m    repo server 144m -> 150m      applicationset controller 18m -> 20m
#   server 2m -> 10m                       redis 2m -> 10m               dex 0m -> 10m      notifications 1m -> 10m
#
# scripts/check.sh fails when one of these renders without its request, and clusters/inventories/consumer-build
# (releaseCapacity.standingCpuRequests) counts them in the budget of the node's cores.

# Server Configuration
server:
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 10m

  # Chart-bundled k8s Ingress disabled — we ship our own Traefik IngressRoute
  # (clusters/bootstrap/argocd/ingressroute.yaml) for consistency with Vault and the
  # IdP. Middlewares + native TLS lives in the IngressRoute spec.
  ingress:
    enabled: false

  # TLS terminated at the IngressRoute → talk plaintext to argocd-server.
  extraArgs:
    - --insecure

# Manager Configuration
controller:
  replicas: 1
  resources:
    requests:
      cpu: 250m

# Repo Server Configuration
repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 150m

# Redis Configuration
redis:
  enabled: true
  image:
    repository: ecr-public.aws.com/docker/library/redis
    tag: "8.10.2-alpine"
  resources:
    requests:
      cpu: 10m

applicationSet:
  resources:
    requests:
      cpu: 20m

dex:
  # THE CHART'S OWN DEX, AT ITS DIGEST, FROM THE OWNER'S MIRROR. The chart composes the image from its
  # repository and tag fields and has no field for a digest, so the digest rides on the tag.
  # scripts/check.sh holds the tag before the @ to the one the chart itself names, so a bump of the chart
  # cannot leave the image behind.
  image:
    repository: zot.master.digitacloud.app/simetrixch/ghcr.io/dexidp/dex
    tag: "v2.46.0@sha256:933fcd3f523338c847b88ef84a7145fb2fcb7b9917f08418612afeaaa2001777"
  resources:
    requests:
      cpu: 10m

notifications:
  resources:
    requests:
      cpu: 10m

# Configs
configs:
  params:
    server.insecure: true
    # WITHOUT THIS THE WAVE ORDER OF THE PLATFORM APPLICATIONS IS INERT. The chart writes every key
    # here into the ConfigMap argocd-cmd-params-cm and wires this one into the applicationset
    # controller as ARGOCD_APPLICATIONSET_CONTROLLER_ENABLE_PROGRESSIVE_SYNCS; with it unset the
    # controller ignores the RollingSync strategy of
    # clusters/argocd/files/platform-apps-appset.yaml and creates every Application at once, so an
    # app applying a custom resource reaches the API before the app installing that CRD is done.
    # The controller Deployment carries a checksum of this ConfigMap, so the pod restarts on its own
    # when the value lands.
    applicationsetcontroller.enable.progressive.syncs: true
  # Disable the built-in `admin` user — OIDC via Authentik is the sole
  # login path. The `argocd-initial-admin-secret` K8s Secret is left in
  # place so emergency CLI access (`argocd login --username admin
  # --password` with the value out of that Secret) still works on the host, but
  # the web UI's password form is removed and admin can't sign in to it.
  #
  # Recovery if Authentik is unreachable: set `admin.enabled: "true"`
  # here and `helm upgrade` (i.e. re-run --deploy-argocd). Or use the
  # `argocd-cm` ConfigMap directly via kubectl.
  cm:
    admin.enabled: "false"
    url: https://argo.master.digitacloud.app
    # Which Application manages an object is written into the annotation
    # argocd.argoproj.io/tracking-id, and ArgoCD overwrites it on every apply —
    # which is what makes it evidence rather than a claim. Two admission
    # policies decide on it: the build-namespace guard
    # (clusters/inventories/consumer-build/templates/vap-namespace-build-label.yaml) and the
    # per-consumer policy the Manager renders. Stated here rather than left
    # to the version default, because the alternative (`label`) carries the
    # tracking mark in app.kubernetes.io/instance, which any chart may set —
    # both policies would then read a value the unit itself supplies.
    application.resourceTrackingMethod: annotation
    # Custom health check for Ingress on bare-metal (MicroK8s)
    # Default check requires status.loadBalancer.ingress which is never
    # populated without a cloud LoadBalancer. Mark Ingress as Healthy
    # once it has rules assigned by the controller.
    resource.customizations.health.networking.k8s.io_Ingress: |
      hs = {}
      hs.status = "Healthy"
      hs.message = ""
      return hs
    # A SERVICE CLAIM IS HEALTHY WHEN THE PROVISIONER HAS ANSWERED IT, and ArgoCD
    # has to be told, because it knows no custom resource of ours. Without this it
    # takes every ServiceClaim for Healthy the moment the object exists, walks on to
    # the next sync wave, and a workload that needs what the claim delivers starts
    # before it is there: swissbookai's migrate Job (its chart's wave -1) came up
    # ahead of its own registry-pull claim (wave -3) and could not pull at all —
    # "no basic auth credentials", because the pull Secret was not in the namespace
    # yet. The kubelet's backoff healed it a minute later, which is a race healing
    # itself rather than an order being kept.
    #
    # `.status.phase` is the provisioner's own answer (service-provisioner crd.yaml:
    # Pending | Ready | Error | Deleting | Orphaned, written by set_status in its
    # configmap.yaml), so this reads what that controller states and invents nothing.
    # A claim carrying no status at all is Progressing, never Healthy: the absence of
    # an answer is not an answer, and treating it as one is the very defect above.
    resource.customizations.health.platform.hostyour.cloud_ServiceClaim: |
      hs = {}
      if obj.status ~= nil and obj.status.phase ~= nil then
        if obj.status.phase == "Ready" then
          hs.status = "Healthy"
        elseif obj.status.phase == "Error" or obj.status.phase == "Orphaned" then
          hs.status = "Degraded"
        else
          hs.status = "Progressing"
        end
        hs.message = obj.status.message or obj.status.phase
      else
        hs.status = "Progressing"
        hs.message = "the service provisioner has not answered this claim yet"
      end
      return hs
    # OIDC client config — Authentik provides the OIDC issuer at
    # idp.master.digitacloud.app. The clientSecret is read from the K8s Secret
    # `argocd-oidc` (key `clientSecret`) which is created in
    # this namespace. ArgoCD's `$secret-name:key` syntax substitutes it
    # at runtime.
    oidc.config: |
      name: Authentik
      issuer: https://idp.master.digitacloud.app/application/o/argocd/
      clientID: argocd
      clientSecret: $argocd-oidc:clientSecret
      requestedScopes:
        - openid
        - profile
        - email
        - groups
      requestedIDTokenClaims:
        groups:
          essential: true
  # Map the platform's own `admins` group to this component's admin role.
  # `admins` is the one name for the platform's staff, admitted as
  # administrators by the manager (adminsGroup in
  # clusters/inventories/manager/values-common.yaml, and the group PolicyBinding
  # in clusters/bootstrap/idp/blueprints/99-manager.yaml), by this ArgoCD
  # (`g, admins, role:admin` below), by a slave's ArgoCD
  # (clusters/slaves/slave/values-common.yaml rbac.policy.csv) and by Grafana
  # (role_attribute_path in clusters/inventories/observability/values-common.yaml).
  # The group is created by blueprints/15-group-admins.yaml, the
  # deployment puts the first operator into it with the
  # `authentik_group_membership` step, and anybody later is added to it in the
  # provider.
  # This ArgoCD also admits `platform-readers`, bound beside `admins` in
  # clusters/bootstrap/idp/blueprints/99-argocd.yaml for the sign-in proof of the
  # e2e runner. No line of `policy.csv` names that group, so its members get
  # `policy.default: role:readonly` below. scripts/plane-test-accounts.test.mjs
  # holds which group each application admits beside `admins`, and
  # scripts/platform-test-accounts.test.mjs holds `platform-readers` out of every
  # line of `policy.csv`.
  rbac:
    policy.csv: |
      g, admins, role:admin
    policy.default: role:readonly
    scopes: '[groups]'