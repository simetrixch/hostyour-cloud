# THE OBJECT EVERY CERTIFICATE ON THIS CLUSTER NAMES, in the form it takes while the switch is off.
#
# It stands apart from platform-authority.yaml, which carries the chain behind it, because the two
# have different lives: the chain is applied while certificates are withheld and taken off again
# when they are not, and this object is never taken off at all — it is REPLACED, by the public form
# the cluster-issuer rows render when the switch is on.
#
# ITS NAME IS THE CHOICE, WHICH IS WHY THERE ARE TWO OBJECTS AND NOT TWO FORMS OF ONE. The public
# authority stands under `platform-acme`, written by the cluster-issuer rows of deploy-cluster; this
# one stands under `platform-local` and is the whole of what an installation issuing from itself
# uses. Every certificate names one or the other through the value stamped into the values chain,
# so turning the switch over CHANGES the name a certificate is issued by — and that is the one thing
# the certificate service watches. It re-issues everything by itself, with no row anywhere having to
# ask it to.
#
# The shape this replaces had both authorities under ONE name. Measured on apps5 on 2026-09-01: the
# object was rewritten from `ca:` to `acme:`, nothing was re-issued, and the cluster went on serving
# certificates signed by the root the same run had deleted.
# The object every certificate on this cluster names, in the form it takes while the switch is off.
#
# THE FLIP IS ONE APPLY. With the switch on, the cluster-issuer rows render the public form of this
# same object and apply it, which replaces `ca:` with `acme:` — and that step reads
# `.spec.acme.server` back afterwards, so a flip that did not take is a failure with a name rather
# than a cluster quietly issuing from the wrong authority. Every certificate is then re-issued by
# the service, because its issuer changed.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: platform-local
spec:
  ca:
    secretName: platform-ca
