# IngressRoute for Headlamp. Its certificate is the base layer's one,
# served by the TLSStore bootstrap/ingress/certificate.yaml puts in Traefik's own namespace.
# Replaces the previous k8s Ingress + annotation pattern. Auth is handled
# by Headlamp's own OIDC client talking to the IdP — no Traefik forwardAuth
# Middleware needed.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headlamp
  # THE ADDRESS STAYS kube.apps3.digitacloud.app WHILE THE NAMESPACE BECOMES headlamp: what a component is
  # called and what a browser types are two different names. The identity provider registers
  # this product at https://kube.apps3.digitacloud.app/oidc-callback (blueprints/99-headlamp.yaml), so moving
  # the host would take the login with it and cost a certificate for nothing.
  namespace: headlamp
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`kube.apps3.digitacloud.app`)
      kind: Rule
      services:
        - name: headlamp
          port: 80
  tls:
    store:
      name: default
      namespace: vault
