# Vault Helm Values

# Global Configuration
global:
  enabled: true
  tlsDisable: false

# Server Configuration
server:
  # Standalone mode (not HA for single node)
  ha:
    enabled: false

  standalone:
    enabled: true
    config: |
      ui = true

      listener "tcp" {
        tls_disable = 0
        address = "[::]:8200"
        cluster_address = "[::]:8201"
        tls_cert_file = "/vault/userconfig/platform-tls/tls.crt"
        tls_key_file  = "/vault/userconfig/platform-tls/tls.key"

        # /v1/sys/metrics needs a token unless this is set — and a sealed Vault
        # can issue none, which is exactly the state the platform must be able to
        # see. The ServiceMonitor in clusters/inventories/observability scrapes this endpoint
        # anonymously, so without this flag Vault answers 400 and the platform
        # collects no Vault metric at all: no vault_core_unsealed, nothing for the
        # VaultSealed alert to fire on.
        telemetry {
          unauthenticated_metrics_access = true
        }
      }

      # disable_hostname keeps the metric names as Prometheus expects them
      # (vault_core_unsealed); left at its default, go-metrics prefixes every name
      # with the pod's hostname and no alert expression matches. The retention time
      # must stay well above the 60s scrape interval — 0 switches the Prometheus
      # endpoint off entirely.
      telemetry {
        disable_hostname = true
        prometheus_retention_time = "24h"
      }

      storage "file" {
        path = "/vault/data"
      }

  # Service
  service:
    enabled: true
    type: ClusterIP
    port: 8200
    targetPort: 8200

  # Data Storage
  #
  # 5Gi, and it is a ceiling rather than a measurement: what Vault stores is its
  # own seal metadata, nine policies, thirteen auth roles and one KV entry per
  # unit — kilobytes that grow with the number of consumers and tenants, never
  # with their data. An operator who outgrows it edits this on the install
  # branch; the claim cannot be resized in place on the storage class below.
  dataStorage:
    enabled: true
    size: 5Gi
    storageClass: microk8s-hostpath
    accessMode: ReadWriteOnce

  # Ingress (disabled here — applied as a standalone manifest from
  # manifests/vault/ingress.yaml so we can pass nginx-specific annotations
  # to talk to Vault's HTTPS listener).
  ingress:
    enabled: false

  # WHAT THIS PROCESS TRUSTS, and it is not the same question as what it serves.
  #
  # The store does not only ANSWER over TLS, it also SPEAKS it: telling it where the identity
  # provider stands makes it fetch that provider's discovery document itself, and it verifies that
  # certificate against its own container's trust store. An image ships the public roots and nothing
  # else, so on an installation issuing from an authority it minted for itself the store refuses its
  # own identity provider — measured on apps5 on 2026-08-31 as
  # `400 error checking oidc discovery URL`, with everything else on that cluster already working.
  #
  # SSL_CERT_FILE AND NOT THE AUTH METHOD'S OWN FIELD. `oidc_discovery_ca_pem` would fix the
  # discovery document and only that; every other outbound call this process makes would go on using
  # the image's list. The variable is read by the runtime this binary is built with and covers all of
  # them at once, which is the difference between configuring one call and telling a process what it
  # trusts.
  #
  # THE FILE IS A SUPERSET, so pointing at it takes nothing away: trust-manager writes the public
  # roots into it in both states of the certificate switch, and this installation's own authority
  # beside them only where there is one. See clusters/bootstrap/cert-manager/trust-bundle-public.yaml.
  extraEnvironmentVars:
    SSL_CERT_FILE: /vault/userconfig/platform-trust/ca-certificates.crt

  # Volume for TLS cert
  volumes:
    - name: platform-tls
      secret:
        secretName: platform-tls
        # 256 IS 0400, AND IT IS WRITTEN AS THE NUMBER ON PURPOSE. Two readers read this file: helm,
        # which follows YAML 1.1 and reads a leading zero as octal, and the deploy step that compares
        # the file against what the release actually holds, which follows YAML 1.2 and has no bare
        # octal at all. Written 0400 the first stores 256 and the second reads 400, so the two never
        # agree — and what an operator is told is that a release installed perfectly is "still not in
        # the state it produces", on every run, forever. Neither reader is wrong; the file has to be
        # written in the subset both agree on, and a plain decimal is that subset.
        defaultMode: 256
    # NOT `optional: true`, deliberately. A store started without this file would read SSL_CERT_FILE,
    # find nothing, and trust NOTHING — every outbound call refused, including ones that worked
    # before. Waiting for the ConfigMap is what deploy-platform-services does with the row that
    # stands between the namespace and this release.
    - name: platform-trust
      configMap:
        name: platform-trust

  volumeMounts:
    - name: platform-tls
      mountPath: /vault/userconfig/platform-tls
      readOnly: true
    - name: platform-trust
      mountPath: /vault/userconfig/platform-trust
      readOnly: true

  # Resources
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m

# UI Configuration
ui:
  enabled: true
  serviceType: ClusterIP

# Vault Agent Injector — DISABLED. The platform delivers secrets exclusively via
# External-Secrets-Operator (ESO), never Vault Agent sidecar injection (no pod
# carries a vault.hashicorp.com/agent-inject annotation). The injector is dead
# weight here — an unused Deployment + MutatingWebhookConfiguration — and it ships
# a HARD podAntiAffinity that deadlocks its own rolling update on a single node.
injector:
  enabled: false
