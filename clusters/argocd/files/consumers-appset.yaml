# Consumer delivery — one ApplicationSet per cluster, driven by the registrations
# registrations/<unit>/<stage>.yaml IN THIS INSTALLATION'S BOOKS. A unit's stage file there IS the
# deployment of that unit at that stage; the Manager writes and removes it, and removing it
# offboards. The generator names the three stage files outright: the stage-free build declaration
# registrations/<unit>/build.yaml never reaches this ApplicationSet, so a build-only unit generates
# nothing here.
#
# A UNIT CARRIES ITS OWN STAGE, AND THE PLATFORM KEEPS THE CLUSTER'S. The stage is read off the
# registration's file name, once, in the generator's values block, and it decides everything a
# stage decides for this unit: the Application, the AppProject and the namespace are `<name>-<stage>`,
# the values chain loads clusters/platform/values-<stage>.yaml so global.env and every Vault path
# follow it, and source 1 follows the consumer's delivery branch deploy/<stage>. So one cluster
# carries a test instance of a unit beside its prod instance, and the platform's own applications
# stay at the stage the cluster map states.
#
# The registration's fields (name, repoURL, chartPath, cluster, suspended,
# quiesced, databases, services) become the template parameters. NOTE the
# field is chartPath, NOT path — the git files generator reserves .path for
# file metadata.
#
# No commit SHA and no image tag of a consumer lives in this repo: source 1
# follows the consumer's delivery branch deploy/<stage> as a LITERAL. What that
# branch points at is decided in the consumer's repo, not here.
#
# THE TWO MARKERS IN THE GENERATOR ARE BOTH FILLED BY THE CHART ABOVE. The post-selector pins
# cluster=__CLUSTER_NAME__ — the install branch's cluster short name, which is the
# fqdn's first DNS label and the name the Manager writes into a
# registration's `cluster:` field; the cluster map carries it as
# global.clusterName, derived from the fqdn rather than answered twice. The
# generator revision is __BOOKS_FQDN__ and deliberately
# not this branch: the registrations stand on the install branch of the cluster
# holding the master role, which on a pure slave is another branch, and the map
# carries it as global.booksCluster — the same value the map's own
# `books-cluster` is written from.
#
# SO WHAT THIS BRANCH CARRIES IS NOT WHAT THIS SELECTS. The generator names the
# ref it reads, so registrations/ standing on this branch, or absent from it,
# changes nothing here. Nothing takes them off a branch either: no step of any
# branch program deletes a path, and the trunk every branch is cut from carries
# no customer registration at all.
#
# suspended and quiesced are NOT selectors and never prune: both reach the
# chart as values (source 1 below) and the chart renders the off state —
# replicas 0, no Ingress. The reason prune is off the table sits in the
# service-provisioner: its finalizer platform.hostyour.cloud/deprovision
# runs on EVERY ServiceClaim deletion, an ArgoCD prune included
# (clusters/inventories/service-provisioner/templates/configmap.yaml), and drops the user
# AND the databases — a prune-based suspend would be destructive by
# construction.
#
# ArgoCD creates the Namespace (CreateNamespace) with platform-enforced
# restricted PSA + the consumer-eso label + Delete=false via
# managedNamespaceMetadata; the per-unit AppProject `<name>-<stage>` (Application, AppProject,
# Role and RoleBinding blacklisted; sourceRepos pinned to the consumer's repo + this
# hostyour-cloud repo for the $values source; destination pinned to the unit's namespace) is the
# isolation — clusters/units/reconciler renders it from the SAME registration, generated by
# units-appset.yaml at an earlier sync wave, so this template's `project:` resolves.
# No app-of-apps, no floating child.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: consumer-apps
  namespace: __ARGOCD_NAMESPACE__
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/simetrixch/hostyour-cloud.git
        revision: __BOOKS_FQDN__  # the chart fills it from global.booksCluster — the registrations stand on the install branch of the cluster holding the MASTER role, which on a pure slave is not this branch
        files:
          # THE THREE STAGES, ONE PATH EACH. The generator hands a path to `git ls-files`, whose
          # globbing knows no brace alternation, so `{dev,test,prod}.yaml` matches no file and
          # generates nothing in silence; and `*.yaml` would also read registrations/<unit>/build.yaml,
          # the stage-free build declaration that belongs to clusters/inventories/consumer-build.
          - path: "registrations/*/dev.yaml"
          - path: "registrations/*/test.yaml"
          - path: "registrations/*/prod.yaml"
        values:
          # THE UNIT'S STAGE IS THE FILE NAME. The body carries no stage — the path is its one
          # writer — so it is derived here once, the way tenants-appset.yaml derives the guid.
          # `.path.segments` splits the DIRECTORY alone (registrations, <unit>), so `.path.filename`
          # is the one field that carries it.
          stage: '{{ trimSuffix ".yaml" .path.filename }}'
      selector:
        matchLabels:
          cluster: __CLUSTER_NAME__  # the chart fills it from global.clusterName — the short name is DERIVED from the fqdn, not answered
  template:
    metadata:
      name: "{{ .name }}-{{ .values.stage }}"
      namespace: __ARGOCD_NAMESPACE__
      annotations:
        # After the platform apps (waves 0-31) and the units (40); consumers come last.
        argocd.argoproj.io/sync-wave: "50"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: "{{ .name }}-{{ .values.stage }}"
      # NOTE: spec.sources is set entirely in templatePatch below (the
      # databases range + the conditional PostgreSQL source require a block
      # scalar). Keeping it out of the typed template keeps this file
      # parseable as static YAML.
      destination:
        # THE CLUSTER, NEVER A SERVER URL — see projects.yaml for the whole reasoning. A consumer
        # Application generated here is refused by its project unless both name the same cluster,
        # and `https://kubernetes.default.svc` names "the cluster this ArgoCD runs in", which is
        # the master even when the unit belongs to a slave.
        name: __CLUSTER_NAME__
        # One unit at one stage, one namespace: `<name>-<stage>`, prod included, so two stages of
        # one unit stand apart on one cluster. The ingress host `<name>-<stage>.<unitApex>` keys on
        # the namespace; the Vault path `<stage>/consumer/<name>/*` keys on the name and the stage
        # separately, which is why the two travel to Vault as two alias annotations (sources 2
        # and 2b below) and not as the namespace.
        namespace: "{{ .name }}-{{ .values.stage }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        # The namespace metadata the platform stamps: restricted PodSecurity, the
        # consumer-eso label (so ESO in-namespace reads only
        # secret/<stage>/consumer/<name>/*), the unit's name and stage, and data
        # protection (Delete=false on the NAMESPACE — the empty namespace survives
        # offboard; a per-PVC Delete=false is the consumer.s responsibility for data
        # survival).
        #
        # What makes these NOT the consumer's to change is a separate object: the
        # per-unit ValidatingAdmissionPolicy clusters/units/admissionpolicy renders
        # from the same registration admits, on a Namespace this unit's Application
        # owns, only the exact label pairs listed below under hostyour.cloud/,
        # platform/ and pod-security.kubernetes.io/. Without it a unit's own chart
        # could render `kind: Namespace` carrying any of them — the AppProject
        # whitelists that cluster-scoped kind — and ArgoCD would apply the unit's
        # version. So this list and that policy's granted set are ONE statement: a
        # label added here has to be added there in the same change, or every sync
        # of every consumer is refused.
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: restricted
            hostyour.cloud/consumer: "true"
            hostyour.cloud/consumer-name: "{{ .name }}"
            hostyour.cloud/consumer-stage: "{{ .values.stage }}"
            # The mongodb consumer label (global.consumerLabels.mongodb): admits this
            # namespace through the CREDENTIALED backing-service NetworkPolicy of mongodb.
            # Harmless without a claim — those services still require a provisioned
            # per-unit credential. Redis requires one too (clusters/inventories/redis boots with
            # --requirepass), and is STILL not admitted by this label: its
            # NetworkPolicy is deliberately narrower than the credentialed pair's and
            # admits only the redis-consumer label the templatePatch below stamps when
            # the registration claims `redis` in services[].
            platform/db-consumer: "true"
          annotations:
            argocd.argoproj.io/sync-options: Prune=false,Delete=false
        syncOptions:
          - CreateNamespace=true

  # The sources live here (block scalar): the databases range and the
  # conditional PostgreSQL source cannot be expressed in the typed template
  # without breaking a static YAML parse. templatePatch is rendered by the
  # ApplicationSet's go-template and merge-patched onto the Application above
  # (arrays are replaced, so the full sources list is authoritative here).
  # The chart above fills the marker carrying global.domain in every targetRevision of
  # this file, like every other file of clusters/argocd/files. The consumer's own
  # `deploy/<stage>` below carries no such marker, so the retarget never reaches it.
  templatePatch: |
    spec:
      {{- if or (has "redis" .services) (has "postfix" .services) }}
      # Namespace labels the platform grants on an ATTESTED claim, and only then.
      # The mail relay answers without authenticating the caller, so there REACH is the
      # grant; redis requires a password now, and its policy stays this narrow
      # anyway, because a credential is a second boundary and not a reason to widen
      # the first. Either way a unit that never claimed the service must not be able
      # to write itself into the selector. ONE syncPolicy block for both: maps
      # deep-merge in the patch, so the labels of the template above are kept, but a
      # second syncPolicy key would not be YAML.
      syncPolicy:
        managedNamespaceMetadata:
          labels:
            {{- if has "redis" .services }}
            platform/redis-consumer: "true"
            {{- end }}
            {{- if has "postfix" .services }}
            platform/postfix-consumer: "true"
            {{- end }}
      {{- end }}
      sources:
        # 0. Values-only source — makes $values/... resolvable for the sources below.
        - repoURL: https://github.com/simetrixch/hostyour-cloud.git
          targetRevision: __BRANCH__
          ref: values
        # 1. The consumer's CHART on its delivery branch deploy/<stage> — a
        #    LITERAL, never a pin. The platform values reach the chart as
        #    global.* over the SAME $values chain every platform app loads:
        #    platform files first, the chart's own values in between,
        #    this cluster's own map LAST (highest precedence). The stage in every
        #    file name is the UNIT'S, so global.env is the unit's stage here and
        #    not the cluster's.
        - repoURL: "{{ .repoURL }}"
          targetRevision: deploy/{{ .values.stage }}
          path: "{{ .chartPath }}"
          helm:
            valueFiles:
              - $values/clusters/platform/values-common.yaml
              - $values/clusters/platform/values-{{ .values.stage }}.yaml
              - values.yaml
              - values-{{ .values.stage }}.yaml
              - $values/clusters/active/__FQDN__.yaml
            valuesObject:
              # suspended pauses the unit; quiesced closes it for a move or
              # backup. The chart renders the off state from these two values
              # (replicas 0, no Ingress) — see the prune note in the header.
              # Bare access is safe under goTemplateOptions missingkey=error:
              # both fields are mandatory in the registration, written
              # explicitly by the Manager every time.
              suspended: {{ .suspended }}
              quiesced: {{ .quiesced }}
              # DB-name contract: the registration's `databases` (copied
              # VERBATIM from the consumer's platform.yaml `databases:`)
              # reaches the chart as .Values.mongodb.databases — the LITERAL
              # Mongo DB name(s), the single source of truth the chart's
              # mongodb ServiceClaim passes through with no prefix. Bare
              # access is safe under missingkey=error: in a stage
              # registration the deploy group stands or falls together
              # (ConsumerRegistrationSchema), so `databases` is always
              # present — an empty list when the consumer requests none.
              mongodb:
                databases:
                  {{- range .databases }}
                  - "{{ . }}"
                  {{- end }}
        # 2. Per-consumer PostgreSQL instance (clusters/units/postgresql), rendered ONLY
        #    when the registration's services[] includes "postgresql": a
        #    consumer that claims postgresql gets its OWN instance in its OWN
        #    namespace, as a source of its single Application. The
        #    service-provisioner then resolves the claim to this in-namespace
        #    instance. Bare access to `services` is safe under
        #    missingkey=error: the field is mandatory in the deployable
        #    registration (an empty list is allowed).
        {{- if has "postgresql" .services }}
        - repoURL: https://github.com/simetrixch/hostyour-cloud.git
          targetRevision: __BRANCH__
          path: clusters/units/postgresql
          helm:
            # Platform globals only — the SAME $values chain source 1 reads.
            # The chart's own values.yaml (the small-preset per-consumer
            # template) is Helm's implicit base; a template has no stage
            # identity of its own, so there is deliberately no
            # values-<stage>.yaml for it (clusters/units/postgresql/Chart.yaml
            # description).
            valueFiles:
              - $values/clusters/platform/values-common.yaml
              - $values/clusters/platform/values-{{ .values.stage }}.yaml
              # The size preset, named by the consumer's OWN size — the same word that bounds its
              # namespace, because a unit has exactly one. Relative to the chart path above, so it is
              # the chart's OWN file — not a $values reference. Bare access is safe under
              # missingkey=error: `size` is part of the deploy group and the Manager writes a
              # literal on every commit ("small" when the manifest expressed no preference, which is
              # what the chart's values.yaml carries anyway).
              - values-size-{{ .size }}.yaml
              - $values/clusters/active/__FQDN__.yaml
            valuesObject:
              # WHO THIS STORE'S ServiceAccount IS, TOLD TO VAULT. The Kubernetes auth mount
              # lifts every vault.hashicorp.com/alias-metadata-* annotation of the calling
              # ServiceAccount into its login alias, and the consumer read policy hostyour-deploy
              # writes binds its path on the two of them: secret/data/<stage>/consumer/<unit>/*,
              # templated on the alias metadata `stage` and `unit`. The namespace can carry
              # neither fact alone any more — it is <name>-<stage> — and the role stays
              # `consumer-eso` at every stage, because the engine refuses a policy that names a
              # stage literally, so the stage travels in the alias exactly as the unit does.
              # Merged onto the chart's own annotations map, which carries the sync wave, and
              # onto both objects the library chart renders — the ServiceAccount is the one
              # Vault reads.
              secret-store:
                annotations:
                  vault.hashicorp.com/alias-metadata-unit: "{{ .name }}"
                  vault.hashicorp.com/alias-metadata-stage: "{{ .values.stage }}"
              externalsecret-postgres:
                externalSecret:
                  # The ExternalSecret's remoteRef.KEY (clusters/charts/external-secret
                  # renders externalSecret.vaultPath as remoteRef.key) — the
                  # per-consumer path INSIDE the KV mount, NOT the mount
                  # itself. The stage is the UNIT'S, read off the registration
                  # path above. The chart leaves this value empty and
                  # `required`s it, so a render that forgets it fails loudly
                  # rather than silently attaching to another consumer's
                  # credential.
                  vaultPath: "{{ .values.stage }}/consumer/{{ .name }}/postgres"
        {{- end }}
        # 2b. Per-consumer MongoDB instance (clusters/units/mongodb), rendered ONLY
        #    when the registration's `mongodb` is not "shared". `shared` means the
        #    CLUSTER's own replica set in namespace `mongodb` — the one every
        #    tenant runs on — and a unit on it renders no instance of its own. The
        #    other two words give it an instance in its OWN namespace, and the
        #    difference between them is capability: `standalone` is one mongod
        #    with no replica set, which serves no multi-document transactions,
        #    while `replicaset` is three members that do. The chart refuses any
        #    other word rather than guessing a member count.
        #
        #    The service-provisioner needs no switch of its own: it resolves a
        #    mongodb claim to the Service `mongodb` in the claim's OWN namespace
        #    when the instance credential is there, exactly as it does for
        #    postgresql. Bare access to `mongodb` is safe under missingkey=error —
        #    it is part of the deploy group, so the Manager writes a literal on
        #    every commit.
        {{- if ne .mongodb "shared" }}
        - repoURL: https://github.com/simetrixch/hostyour-cloud.git
          targetRevision: __BRANCH__
          path: clusters/units/mongodb
          helm:
            # Platform globals only — the SAME $values chain source 1 reads. The
            # chart's own values.yaml (the small-preset per-unit template) is
            # Helm's implicit base; a template has no stage identity of its own,
            # so there is deliberately no values-<stage>.yaml for it.
            valueFiles:
              - $values/clusters/platform/values-common.yaml
              - $values/clusters/platform/values-{{ .values.stage }}.yaml
              # The unit's ONE size, naming the preset — the same word that bounds
              # its namespace and sizes its PostgreSQL.
              - values-size-{{ .size }}.yaml
              - $values/clusters/active/__FQDN__.yaml
            valuesObject:
              mongodb:
                # The word itself, passed through. The chart derives the member
                # count from it, and the Manager's quota table multiplied the
                # mongodb row by the same count when it priced the unit.
                mode: "{{ .mongodb }}"
              # The unit and its stage in the login alias — the same two annotations
              # source 2 hands, for the same policy; the note there says why the
              # namespace cannot carry them.
              secret-store:
                annotations:
                  vault.hashicorp.com/alias-metadata-unit: "{{ .name }}"
                  vault.hashicorp.com/alias-metadata-stage: "{{ .values.stage }}"
              externalsecret-mongodb:
                externalSecret:
                  # The ExternalSecret's remoteRef.KEY — the per-consumer path
                  # INSIDE the KV mount, not the mount itself. The stage is the
                  # UNIT'S, read off the registration path above. The chart
                  # leaves it empty and `required`s it, so a render that
                  # forgets it fails loudly rather than silently attaching to
                  # another unit's credential.
                  vaultPath: "{{ .values.stage }}/consumer/{{ .name }}/mongodb"
        {{- end }}
        # 3. The platform's own ingress policy for this consumer's namespace
        #    (clusters/units/networkpolicy on the trunk, one NetworkPolicy and nothing else):
        #    the namespace is deny-by-default inbound, with same-namespace pods, Traefik
        #    and Prometheus open. UNCONDITIONAL, unlike source 2 — a namespace with no
        #    policy is the gap this closes, so a consumer that claims no service is
        #    exactly the case that must not be skipped. It rides in the consumer's OWN
        #    Application so it is created, healed and pruned with the namespace it
        #    protects. No $values file: the chart reads no platform value, and the
        #    tenant-sibling rule its values.yaml carries stays off for a consumer, which
        #    is one namespace with no siblings.
        - repoURL: https://github.com/simetrixch/hostyour-cloud.git
          targetRevision: __BRANCH__
          path: clusters/units/networkpolicy
        # 4. The platform's own resource ceiling for this consumer's namespace
        #    (clusters/units/quota on the trunk: a ResourceQuota and the LimitRange that keeps it from
        #    rejecting a pod which declares no resources of its own). UNCONDITIONAL, like the policy
        #    above and for the same reason — a namespace with no ceiling is the gap this closes, so a
        #    consumer that claims no service is exactly the case that must not be skipped.
        #    The figures come from the REGISTRATION, where the Manager resolved them from its size
        #    table when it wrote the file; no $values file and no preset name, because the table lives
        #    in the Manager's database and no cluster can read it.
        - repoURL: https://github.com/simetrixch/hostyour-cloud.git
          targetRevision: __BRANCH__
          path: clusters/units/quota
          helm:
            valuesObject:
              quota:
                requestsCpu: "{{ .quota.requestsCpu }}"
                requestsMemory: "{{ .quota.requestsMemory }}"
                limitsCpu: "{{ .quota.limitsCpu }}"
                limitsMemory: "{{ .quota.limitsMemory }}"
                pods: "{{ .quota.pods }}"
                persistentVolumeClaims: "{{ .quota.persistentVolumeClaims }}"
