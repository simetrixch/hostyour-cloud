# The NAMED registration of THIS cluster's own apiserver for its ArgoCD.
# ArgoCD discovers clusters declaratively: any Secret in its namespace
# labeled argocd.argoproj.io/secret-type: cluster IS a registered cluster.
# The built-in in-cluster entry carries no NAME, but the tenant
# ApplicationSets pin their destination by name — the registration's cluster
# field — so on a master that name must resolve to the master's OWN
# apiserver, or a master cannot carry tenants. __CLUSTER_NAME__ is the install
# branch's cluster short name — the fqdn's first DNS label, the same value the
# tenant appset selectors admit — and the chart above fills it from the map's
# global.clusterName, which is derived from the fqdn rather than answered twice.
#
# On a PURE SLAVE branch this file has to GO: the slave's ArgoCD instance
# already registers the slave under that same name with the slave's real
# apiserver (clusters/slaves/slave/templates/externalsecret-cluster-slave.yaml), and a
# second Secret claiming the same cluster name with server
# kubernetes.default.svc — the MASTER's apiserver from the instance's point
# of view — would point the tenant Applications at the wrong apiserver.
# THE CHART ABOVE IS WHAT KEEPS IT OFF ONE: it emits this file, slaves-appset.yaml
# and repo-catalog.yaml only where the map says global.servicesLocal.vault, which
# is the cluster that keeps the books. A pure slave's map says false, so its
# reconciler never sees this Secret, and no file has to be deleted from a branch
# for that to hold.
apiVersion: v1
kind: Secret
metadata:
  name: cluster-self
  namespace: __ARGOCD_NAMESPACE__
  labels:
    argocd.argoproj.io/secret-type: cluster
stringData:
  name: __CLUSTER_NAME__  # the chart fills it from global.clusterName — the short name is DERIVED from the fqdn, not answered
  server: https://kubernetes.default.svc
