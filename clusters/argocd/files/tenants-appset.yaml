# Tenant fan-out — ONE Application "<guid>-<member>-<stage>" per (tenant, stage, member), from the
# tenant registrations registrations/<guid>/<stage>.yaml IN THIS INSTALLATION'S BOOKS, in the tenant
# catalog. A tenant's stage file there IS the deployment of that tenant at that stage; the Manager
# writes and removes it, and removing it offboards the whole fan-out of that stage. One
# ApplicationSet per cluster reads every stage file, so a tenant may stand at more than one stage
# under one guid, each stage in namespaces of its own.
#
# THE MEMBER SET IS DATA. `members` in the registration lists every member the tenant has, each with
# the charts it deploys into its own namespace <guid>-<member>-<stage>. The Manager resolved that
# list from the tenant product's own manifest — its standing services and one member per app the
# tenant selected — so this file names no member, no chart and no app. The alternative is FOUR files
# per stage, one per member family, each carrying a chart path and a values block of one particular
# product, and it cannot deploy a product with a different member set at all.
#
# What this file still decides is what is TRUE OF EVERY MEMBER: the naming, the namespace, the
# isolation project, the sync policy, and the tenant facts each chart is handed. What a member IS
# comes out of the registration.
#
# The registration's flat fields (cluster, subdomain, apps, seedUsers, suspended, quiesced) become
# the template parameters. The body carries NO guid and NO stage — the path
# registrations/<guid>/<stage>.yaml is the identity — so both are derived from the file path ONCE,
# in the generator's values block: the guid from the directory, the stage from the file name.
#
# EVERY LINE NAMING THE CATALOG NAMES ONE REVISION OF IT — the BOOKS branch, which is the install
# branch of the cluster holding the master role, in the catalog. The generator reads the tenant
# registrations there, the pins source reads this installation's own image versions there, and the
# chart source reads the member charts there. ArgoCD's repo-server refuses to generate a manifest
# for an Application whose `ref` source stands on the Application's own repository at another
# commit, so a chart source on the trunk beside a pins source on this branch produces NOTHING and
# the tenant never syncs. The branch carries the member charts because the Manager brings the
# catalog's trunk into it, at the act that creates it — the same shape the platform install branch
# has, where a release reaches a cluster by a merge and never by a second revision on a source.
# A tenant only ever lands on a slave, whose own branch does not exist in the catalog at all, so
# every one of these lines takes the books branch and not this cluster's own. The $values source is
# the ONE hostyour-cloud line, and it names that same one branch there: the chart above fills
# __BRANCH__ from global.booksCluster, so the platform values chain follows the installation's
# install branch too.
#
# THE THREE MARKERS IN THIS FILE, AND WHAT PUTS A VALUE IN EACH.
#
# The generator's repoURL carries the catalog marker, and the chart above fills it from the map's
# global.catalogRepo — an owner and a name, with the forge
# and the .git suffix staying as the lines below write them. That marker is deliberately NOT spelled
# out anywhere else in this file: the replace rewrites every occurrence of it on any line it reaches,
# so a sentence quoting it would come out of a render stating a repository instead of explaining one.
#
# __BOOKS_FQDN__ and __CLUSTER_NAME__ are filled by the chart above from global.booksCluster and
# global.clusterName, and neither is answered twice: the books branch is this cluster's own
# domain where it holds the master role and the named master's domain where it does not, and the
# cluster is the first DNS label of this cluster's domain — the name the Manager writes into a
# registration's `cluster:` field and the name the destination below resolves (on a master from the
# cluster Secret in cluster-self.yaml, on a slave from the instance's ESO-materialized one). Both
# stand in the map as those two keys, so a map short of either refuses the render by name rather
# than leaving this ApplicationSet reading a ref that does not exist.
#
# Deliberately NO suspended clause in the selector: suspended and quiesced are NOT selectors and
# never prune — both reach the chart as values and the chart renders the off state (replicas 0, no
# Ingress). The reason prune is off the table sits in the service-provisioner: its finalizer
# platform.hostyour.cloud/deprovision runs on EVERY ServiceClaim deletion, an ArgoCD prune included
# (clusters/inventories/service-provisioner/templates/configmap.yaml), and drops the user AND the databases — a
# prune-based suspend would be destructive by construction. Destructive is only offboard
# (registration removal), where the ServiceClaim finalizers and the Tenant CR cascade are SUPPOSED to
# run.
#
# ArgoCD creates the member namespace (CreateNamespace) and labels it via managedNamespaceMetadata:
# platform/tenant + platform/tenant-managed are the tenant ESO Vault role's precondition (its
# namespace selector matches tenant-managed, and the secret kit's ServiceAccount annotation resolves
# the per-tenant Vault path); platform/db-consumer admits the namespace through the credentialed
# backing-service NetworkPolicies (mongodb). Anything BEYOND those three is the member's own
# `namespaceLabels` out of the registration — data, so that a rule like `if member == auth`, granting
# reach to a no-auth service that only that member uses, never has to stand in this file. The
# per-member AppProject <guid>-<member>-<stage> (name == the destination namespace, destinations
# pinned to exactly that namespace) is the isolation — the Manager renders it BEFORE it writes the
# registration, so this template's project: always resolves.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenants
  namespace: __ARGOCD_NAMESPACE__
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/__CATALOG_REPO__.git  # the chart writes global.catalogRepo into the marker — the owner and the name of the repository holding the member charts, named in the cluster map
              revision: __BOOKS_FQDN__  # the chart fills it from global.booksCluster — the tenant registrations in the catalog stand on the books branch, and so does every source below
              files:
                # The three stages named outright, as consumers-appset.yaml names them and for the
                # reasons it states there.
                - path: "registrations/*/dev.yaml"
                - path: "registrations/*/test.yaml"
                - path: "registrations/*/prod.yaml"
              values:
                guid: "{{ index .path.segments 1 }}"
                # `.path.segments` splits the DIRECTORY alone, so the file name is the one field
                # carrying the stage.
                stage: '{{ trimSuffix ".yaml" .path.filename }}'
          - list:
              elementsYaml: "{{ .members | toJson }}"
      selector:
        matchLabels:
          cluster: __CLUSTER_NAME__  # the chart fills it from global.clusterName — the short name is DERIVED from the fqdn, not answered
  template:
    metadata:
      name: "{{ .values.guid }}-{{ .name }}-{{ .values.stage }}"
      namespace: __ARGOCD_NAMESPACE__
      labels:
        platform/tenant: "{{ .values.guid }}"
        platform/member: "{{ .name }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: "{{ .values.guid }}-{{ .name }}-{{ .values.stage }}"
      # NOTE: spec.sources is set entirely in templatePatch below (a member carries a LIST of charts,
      # which needs a range). Keeping it out of the typed template keeps this file parseable as
      # static YAML.
      destination:
        name: "{{ .cluster }}"
        namespace: "{{ .values.guid }}-{{ .name }}-{{ .values.stage }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
  # The namespace labels and the sources live here (block scalar): both range over registration data
  # and cannot be expressed in the typed template without breaking a static YAML parse. templatePatch
  # is rendered by the ApplicationSet's go-template and merge-patched onto the Application above
  # (arrays are replaced, so the full sources list is authoritative here).
  templatePatch: |
    spec:
      syncPolicy:
        managedNamespaceMetadata:
          labels:
            platform/tenant: "{{ .values.guid }}"
            platform/tenant-managed: "true"
            platform/db-consumer: "true"
            {{- range $k, $v := .namespaceLabels }}
            {{ $k }}: {{ $v | quote }}
            {{- end }}
      sources:
        # 0. Values-only source — makes $values/... resolvable for the sources below. Filled
        #    from global.booksCluster like every other one: the chain follows the install branch.
        - repoURL: https://github.com/simetrixch/hostyour-cloud.git
          targetRevision: __BRANCH__
          ref: values
        # 0b. Pins-only source — this installation's OWN image versions, on the catalog's books
        #    branch. A tag says which version THIS installation runs, so it cannot stand on the
        #    catalog's trunk, which every installation reads: one installation's build would decide
        #    another's version, and the next bump would overwrite it. The release pipeline's bump
        #    writes <chart>/pins-<stage>.yaml here; until it has, the chart's own values.yaml carries
        #    the product default and the file is simply absent (ignoreMissingValueFiles).
        - repoURL: https://github.com/__CATALOG_REPO__.git  # filled from global.catalogRepo, as the generator above is
          targetRevision: __BOOKS_FQDN__  # filled from global.booksCluster, the cluster that keeps this installation's books
          ref: pins
        # 1..n. The member's own charts, in the order the registration lists them, on the SAME
        #    revision of the catalog the pins above stand on — one repository, one revision, or the
        #    repo-server generates nothing for this Application. The platform values reach every one
        #    of them as global.* over the SAME $values chain every platform app loads: platform files
        #    first, the chart's own values in between, the chart's extra value files after those,
        #    this cluster's own map LAST (highest precedence). The stage in every file name is the
        #    TENANT'S, read off the registration path, so global.env is the tenant's stage here.
        {{- range .sources }}
        - repoURL: https://github.com/__CATALOG_REPO__.git  # filled from global.catalogRepo, as the two sources above are
          targetRevision: __BOOKS_FQDN__  # filled from global.booksCluster — the Manager brings the catalog's trunk into this branch, so it carries the member charts
          path: {{ .chart | quote }}
          helm:
            valueFiles:
              - $values/clusters/platform/values-common.yaml
              - $values/clusters/platform/values-{{ $.values.stage }}.yaml
              - values.yaml
              - values-{{ $.values.stage }}.yaml
              {{- range .valueFiles }}
              - {{ . | quote }}
              {{- end }}
              # This installation's own pin, after every product file, so nothing shipped can
              # decide the version it runs. Absent until the bump has written one.
              - $pins/{{ .chart }}/pins-{{ $.values.stage }}.yaml
              - $values/clusters/active/__FQDN__.yaml
            # The pins file above is the ONE file MEANT to be missing, and only until this
            # installation has built. The flag permits more than that one file: a values file named
            # here but not carried by the repository it stands in renders from whatever files are
            # left, with no sync error anywhere. NOTHING GUARDS EITHER HALF of this list — no audit
            # requires a $values/ path named here to exist in this repository, and the member
            # chart's own values.yaml, its stage file and whatever the registration's valueFiles
            # adds are read by nothing here, since they stand in the tenant catalog. So the flag is
            # a silence an installation accepts, on every path in the list.
            ignoreMissingValueFiles: true
            valuesObject:
              # THE TENANT'S OWN FACTS, handed to every source of every member. Bare access is safe
              # under goTemplateOptions missingkey=error: every field read here is mandatory in the
              # registration, written explicitly by the Manager on every commit. A chart takes
              # what it needs and ignores the rest — which is what keeps this block the same for all
              # of them, and keeps every member-specific value out of this file.
              tenant:
                guid: "{{ $.values.guid }}"
                member: "{{ $.name }}"
                # The member name under the key the per-app charts already read. A standing member
                # gets its own name here, which those charts never look at.
                appName: "{{ $.name }}"
                subdomain: "{{ $.subdomain }}"
                # The tenant's stage, off the registration path: a member's host is
                # <member>-<stage>.<subdomain>.<unitApex>, composed by the chart from this and the
                # two above.
                stage: "{{ $.values.stage }}"
                # suspended pauses the tenant; quiesced closes it for a move or backup. The chart
                # renders the off state from these two values (replicas 0, no Ingress) — see the
                # prune note in the header.
                suspended: {{ $.suspended }}
                quiesced: {{ $.quiesced }}
                # The tenant's user boot-seed opt-in, and the apps it owns with their per-app seed
                # tiers. Both are TENANT facts rather than member ones, so every member gets them:
                # the identity provider grants roles per app and mounts the app bundle from them, and
                # an app's engine reads its own seed tiers out of the list by appName.
                seedUsers: {{ $.seedUsers }}
                apps: {{ $.apps | toJson }}
              # The member's own values, out of the registration — the product's keys, resolved by
              # the Manager from the product's manifest. Rendered LAST so a product may override
              # anything above for one member.
              {{- with .values }}
              {{- toYaml . | nindent 10 }}
              {{- end }}
        {{- end }}
        # LAST. The platform's own ingress policy for this member namespace
        #    (clusters/units/networkpolicy in this repository, one NetworkPolicy and nothing else):
        #    the namespace is deny-by-default inbound, with same-namespace pods, the
        #    tenant's SIBLING members, Traefik and Prometheus open. It rides in the
        #    member's OWN Application on purpose — created, healed and pruned with the
        #    namespace it protects, so no member namespace can exist unprotected.
        #    Reads no platform value, so it loads no $values file; the tenant guid is
        #    what makes the sibling rule this tenant's and not every tenant's.
        - repoURL: https://github.com/simetrixch/hostyour-cloud.git
          targetRevision: __BRANCH__
          path: clusters/units/networkpolicy
          helm:
            valuesObject:
              tenant:
                guid: "{{ .values.guid }}"
        # AND LAST. The platform's own resource ceiling for this member namespace (clusters/units/quota
        #    in this repository: a ResourceQuota and the LimitRange that keeps it from rejecting a pod
        #    which declares no resources of its own). Rides in the member's OWN Application for the same
        #    reason the policy above does — created, healed and pruned with the namespace it bounds.
        #    The figures come from the tenant REGISTRATION, resolved there by the Manager from its
        #    size table. PER MEMBER, not per tenant: a tenant owns one namespace for each of its
        #    members, so each gets this ceiling and one member filling its own cannot take another's
        #    room.
        - repoURL: https://github.com/simetrixch/hostyour-cloud.git
          targetRevision: __BRANCH__
          path: clusters/units/quota
          helm:
            valuesObject:
              quota:
                requestsCpu: "{{ $.quota.requestsCpu }}"
                requestsMemory: "{{ $.quota.requestsMemory }}"
                limitsCpu: "{{ $.quota.limitsCpu }}"
                limitsMemory: "{{ $.quota.limitsMemory }}"
                pods: "{{ $.quota.pods }}"
                persistentVolumeClaims: "{{ $.quota.persistentVolumeClaims }}"
