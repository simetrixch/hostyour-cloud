apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-apps-__STAGE__
  namespace: __ARGOCD_NAMESPACE__
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error

  generators:
    - git:
        repoURL: https://github.com/simetrixch/hostyour-cloud.git
        revision: __BRANCH__
        files:
          - path: "clusters/inventories/*/app.yaml"
      # THE SELECTION IS BY PART, NEVER BY ONE ROLE WORD. A cluster's role names every part it
      # carries — `master`, `slave`, or both as `master+slave` — and an app.yaml's `runsOn` names
      # the ONE part its app belongs to, or `every-cluster`. The two slots below are filled by the
      # chart above with the FIRST and the LAST part of this cluster's role
      # (clusters/argocd/templates/apps.yaml splits the map's `role` on `+`),
      # so a machine carrying both parts admits `master` AND `slave` and renders both
      # parts' workloads, while a single-part role fills the two slots with the same word — a
      # duplicate an In match reads as one value. An app.yaml whose runsOn matches neither slot nor
      # `every-cluster` stays unselected on every cluster, exactly as under the one-slot form.
      selector:
        matchExpressions:
          - key: runsOn
            operator: In
            values:
              - every-cluster
              - __CLUSTER_ROLE_FIRST_PART__
              - __CLUSTER_ROLE_LAST_PART__

  template:
    metadata:
      name: "{{ .name }}-__STAGE__"
      namespace: __ARGOCD_NAMESPACE__
      annotations:
        argocd.argoproj.io/sync-wave: "{{ .syncWave }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: "{{ .project }}"
      sources:
        - repoURL: &repo "https://github.com/simetrixch/hostyour-cloud.git"
          targetRevision: &branch __BRANCH__
          ref: values
        - repoURL: *repo
          targetRevision: *branch
          path: "clusters/inventories/{{ .name }}"
          helm:
            valueFiles:
              - $values/clusters/platform/values-common.yaml
              - $values/clusters/platform/values-__STAGE__.yaml
              - values-common.yaml
              - values-__STAGE__.yaml
              - $values/installation/values/{{ .name }}.yaml
              - $values/clusters/active/__FQDN__.yaml
            ignoreMissingValueFiles: true
      # BY NAME, NOT "IN-CLUSTER". The apps of this appset belong to the cluster this branch
      # describes, and "in-cluster" answers a different question: it names the cluster the ArgoCD
      # INSTANCE runs on. For the cluster that keeps the books those are the same machine, and this
      # line is right only while that is the only case. A slave's instance runs on the master, so
      # in-cluster there IS the master — every app of the slave would be applied to the wrong
      # machine.
      #
      # The name is registered on both: on the books cluster by cluster-self.yaml beside this file,
      # on a slave by its own chart, both under the cluster's short name. tenants-appset addresses
      # its destination the same way.
      destination:
        name: "__CLUSTER_NAME__"
        namespace: "{{ .namespace }}"

  # The patch is rendered by the same go template as the fields above and under the same
  # goTemplateOptions, so missingkey=error binds here too. Under that option a bare `.key` against a
  # generator parameter map that does not carry the key is an ERROR, and one such error ends the
  # whole reconcile: the controller records an ErrorOccurred condition and creates NO Application at
  # all — not even for the apps whose parameters were complete.
  #
  # So the two kinds of parameter are read differently, and the difference is the contract:
  #   MANDATORY — `prune` and `createNamespace` are read bare. Every app.yaml carries them, and an
  #     app.yaml that does not is meant to be refused.
  #   OPTIONAL — `serverSideApply` and `ignoreDifferences` describe an app that needs an exception.
  #     Most do not, so they are looked up with a default and the line is written only for an app
  #     that declared one. `with` rebinds the dot to the looked-up value, which keeps a second bare
  #     lookup from creeping back inside the block.
  templatePatch: |
    spec:
      syncPolicy:
        automated:
          prune: {{ .prune }}
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        managedNamespaceMetadata:
          labels:
            hostyour.cloud/workload: "true"
        syncOptions:
          - CreateNamespace={{ .createNamespace }}
          {{- with dig "serverSideApply" "" . }}
          - ServerSideApply={{ . }}
          {{- end }}
      {{- with dig "ignoreDifferences" "" . }}
      ignoreDifferences:
        {{- . | nindent 8 }}
      {{- end }}
