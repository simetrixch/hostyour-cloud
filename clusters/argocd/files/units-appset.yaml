# The per-unit FENCES — two ApplicationSets over the same registrations the consumer delivery reads,
# each standing where the objects it renders have to land. One of each per cluster: every stage
# file of a unit is read here, and the stage is read off its file name, so every fence object is
# rendered per (unit, stage) and named `<name>-<stage>` where the unit's Application is.
#
# WHY TWO AND NOT ONE. An Application has ONE destination, and this set does not have one. A unit's
# isolation AppProject and its argo-sync grant live in the ArgoCD namespace the unit belongs to, which
# is always ON THE CLUSTER THIS RECONCILER RUNS IN — `argocd` on a master, and the per-slave
# instance's own namespace, which stands on the master, for a unit on a slave. Its
# ValidatingAdmissionPolicy is cluster-scoped and has to stand ON THE UNIT'S OWN CLUSTER, which for a
# per-slave instance is a REMOTE one. So the first set answers `server: https://kubernetes.default.svc`
# and the second answers `name: __CLUSTER_NAME__`, and on a cluster carrying the master part those two
# are the same cluster, said two ways.
#
# `server:` HERE IS THE ONE PLACE IT IS RIGHT, and projects.yaml states why it is wrong everywhere
# else: it means "the cluster this ArgoCD runs in", which is the master even when the unit belongs to
# a slave. That is exactly what the first set needs, because a slave's AppProject and its Application
# CRs do not stand on the slave — they stand in the per-slave instance's namespace on the master, and
# that instance's own in-cluster registration is restricted to that one namespace
# (clusters/slaves/slave/templates/cluster-in-cluster.yaml).
#
# WHAT IS NOT HERE. Two of the objects the Manager
# writes per unit land in namespaces neither instance manages:
#
#   <unit>-build   the EventListener's create grant and the manager's read grant. They are stage-FREE
#                  — one build namespace per unit, one image per release — and they are rendered from
#                  registrations/<unit>/build.yaml by clusters/inventories/consumer-build, which is
#                  the Application that creates that namespace in the first place.
#   postfix        the smtp-ops grant, rendered only where a stage registration attests `smtp-ops`.
#                  The relay runs on the master (clusters/inventories/postfix/app.yaml, runsOn:
#                  master) and a per-slave instance cannot reach its namespace at all, so this stays
#                  the Manager's to write, exactly as the repository credential does.
#
# THE GENERATOR REVISION IS __BOOKS_FQDN__ AND NOT THIS BRANCH, for the reason
# consumers-appset.yaml states at length: the registrations stand on the install branch of the
# cluster holding the master role, which on a pure slave is another branch. The post-selector then
# keeps this instance to the units that named ITS cluster, off the same `cluster` field the consumer
# delivery selects on — so a unit's fences and its Application are generated by the same instance or
# by neither.
#
# THE SYNC WAVE IS EARLIER THAN THE DELIVERY'S, because the generated Application says
# `project: <name>-<stage>` and ArgoCD refuses an Application whose project is absent. Between
# ApplicationSets the wave is a statement of intent rather than an ordering the controller enforces —
# these Applications are not children of one parent sync — so the retry block below is what actually
# converges it, and whether it does has to be measured on a real onboard.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: unit-reconciler
  namespace: __ARGOCD_NAMESPACE__
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/simetrixch/hostyour-cloud.git
        revision: __BOOKS_FQDN__  # the chart fills it from global.booksCluster — the registrations stand on the install branch of the cluster holding the MASTER role
        files:
          # The three stages named outright, as consumers-appset.yaml names them and for the reasons
          # it states there: `git ls-files` knows no brace alternation, and `*.yaml` would read the
          # stage-free build.yaml.
          - path: "registrations/*/dev.yaml"
          - path: "registrations/*/test.yaml"
          - path: "registrations/*/prod.yaml"
        values:
          # The unit's stage, read off the file name once — the same derivation consumers-appset.yaml
          # makes, so the fence and the Application it fences are named from one reading.
          stage: '{{ trimSuffix ".yaml" .path.filename }}'
      selector:
        matchLabels:
          cluster: __CLUSTER_NAME__  # the chart fills it from global.clusterName — the same field the consumer delivery selects on, so a unit's fences and its Application are generated together or not at all
  template:
    metadata:
      name: "{{ .name }}-reconciler-{{ .values.stage }}"
      namespace: __ARGOCD_NAMESPACE__
      annotations:
        # Before the consumers (50): the Application generated there names this project.
        argocd.argoproj.io/sync-wave: "40"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: units
      # ONE SOURCE, BECAUSE THIS CHART READS NO PLATFORM VALUE. Its whole content is the
      # registration's own fields plus URLs that are the same for every installation, so there is
      # no $values chain to give it and no cluster map to load. A values-only source added here would
      # be a second ref standing on the install branch for nothing to read.
      source:
        repoURL: https://github.com/simetrixch/hostyour-cloud.git
        targetRevision: __BRANCH__
        path: clusters/units/reconciler
        helm:
          valuesObject:
            registration:
              name: "{{ .name }}"
              stage: "{{ .values.stage }}"
              repoURL: "{{ .repoURL }}"
            argoNamespace: __ARGOCD_NAMESPACE__
      destination:
        # THE CLUSTER THIS RECONCILER RUNS IN, which is where a unit's AppProject and its Application
        # CRs stand whichever cluster the unit itself runs on. See the header.
        server: https://kubernetes.default.svc
        namespace: __ARGOCD_NAMESPACE__
      syncPolicy:
        automated:
          # PRUNE IS THE OFFBOARD. Removing the registration removes the Application and its two
          # objects with it, which is what lets the Manager stop deleting them one by one.
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: unit-admissionpolicy
  namespace: __ARGOCD_NAMESPACE__
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/simetrixch/hostyour-cloud.git
        revision: __BOOKS_FQDN__
        files:
          - path: "registrations/*/dev.yaml"
          - path: "registrations/*/test.yaml"
          - path: "registrations/*/prod.yaml"
        values:
          stage: '{{ trimSuffix ".yaml" .path.filename }}'
      selector:
        matchLabels:
          cluster: __CLUSTER_NAME__
  template:
    metadata:
      name: "{{ .name }}-admissionpolicy-{{ .values.stage }}"
      namespace: __ARGOCD_NAMESPACE__
      annotations:
        # Before the consumers (50): the boundary is armed before the unit deploys anything into it.
        argocd.argoproj.io/sync-wave: "40"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: units
      sources:
        # 0. Values-only source — makes $values/... resolvable for the chart below.
        - repoURL: &repo https://github.com/simetrixch/hostyour-cloud.git
          # TWO REFS AND NO ANCHOR BETWEEN THEM. The values chain is this installation's own and
          # stands on its branch; the chart is the product and stands on the release tag.
          targetRevision: __BRANCH__
          ref: values
        # 1. The boundary itself. It reads ONE platform value — global.unitApex, which composes
        #    the one FQDN every unit is granted — and takes the stage from the registration below,
        #    which is the same stage the unit's Application is named after and therefore the prefix
        #    of every tracking id the Namespace clauses read. The chain still loads the platform's
        #    file of the UNIT'S stage, as every source of the unit does.
        - repoURL: *repo
          targetRevision: __BRANCH__
          path: clusters/units/admissionpolicy
          helm:
            valueFiles:
              - $values/clusters/platform/values-common.yaml
              - "$values/clusters/platform/values-{{ .values.stage }}.yaml"
              - $values/clusters/active/__FQDN__.yaml
            valuesObject:
              registration:
                name: "{{ .name }}"
                stage: "{{ .values.stage }}"
                # THE ATTESTED EXTRA FQDN, and it is optional in the registration. `dig` answers ""
                # where the field is absent, which is what the chart reads as "granted nothing beyond
                # the platform address" — a bare `{{ .fqdn }}` under missingkey=error would produce
                # no Application at all for the units that have none, which is most of them.
                fqdn: "{{ dig \"fqdn\" \"\" . }}"
                # A JSON STRING and not a list: this file is emitted through Helm, which validates
                # its output as YAML, and a quoted scalar survives that parse where a rendered list
                # would not. The same shape the build fan-out stamps its builds[] in.
                servicesJson: "{{ .services | toJson }}"
                # THE REDIS GRANT, and the fence holds every ServiceClaim of this namespace to it.
                # A JSON string for the same reason servicesJson is one. `dig` answers "[]" where
                # the field is absent, which the chart reads as granted NOTHING — the direction that
                # matters, because a unit whose registration predates the field must not come out
                # granted every key in a shared keyspace.
                keyPatternsJson: "{{ dig \"keyPatterns\" (list) . | toJson }}"
      destination:
        # THE UNIT'S OWN CLUSTER, by name — a cluster-scoped policy has to stand where the workloads
        # it admits or refuses run, and for a per-slave instance that is a remote cluster.
        name: __CLUSTER_NAME__
        namespace: __ARGOCD_NAMESPACE__
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
