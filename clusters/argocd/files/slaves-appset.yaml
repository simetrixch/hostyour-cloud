apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: slaves-__STAGE__
  namespace: __ARGOCD_NAMESPACE__
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/simetrixch/hostyour-cloud.git
        revision: __BOOKS_FQDN__
        files:
          - path: "clusters/active/*.yaml"
        values:
          cluster: '{{ index (splitList "." .global.domain) 0 }}'
      selector:
        matchLabels:
          # EXACTLY the word `slave`, and the exactness is load-bearing: a map whose role is
          # `master+slave` carries the slave part but manages itself — its own root ArgoCD renders
          # that part's workloads through the platform appset's part selection. Generating this
          # plane for it would stand a second reconciler over the same branch on the same cluster.
          # The plane is only for a cluster whose WHOLE role is slave, managed from the books.
          role: slave
          stage: __STAGE__
          # THE CLUSTER THAT KEEPS THE BOOKS, in the marker the branch programs stamp from the
          # `books_cluster` answer — the same answer the map's own `books-cluster` is written from,
          # so the two sides of this comparison can never be answered apart. It is the same value
          # the generator's revision above carries, because a books branch is named for the cluster
          # whose books it holds. A literal here would be one installation's domain in a file every
          # installation is cut from, and a selector matching nothing produces zero Applications and
          # reports no error at all.
          booksCluster: __BOOKS_FQDN__
  template:
    metadata:
      name: "{{ .values.cluster }}-apps"
      namespace: __ARGOCD_NAMESPACE__
      annotations:
        argocd.argoproj.io/sync-wave: "45"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: "{{ .values.cluster }}"
      sources:
        - repoURL: &repo "https://github.com/simetrixch/hostyour-cloud.git"
          targetRevision: &branch __BRANCH__
          ref: values
        - repoURL: *repo
          targetRevision: *branch
          path: clusters/slaves/slave
          helm:
            valueFiles:
              - $values/clusters/platform/values-common.yaml
              - $values/clusters/platform/values-__STAGE__.yaml
              - values-common.yaml
              - values-__STAGE__.yaml
              - $values/clusters/active/__FQDN__.yaml
            valuesObject:
              slave:
                name: "{{ .values.cluster }}"
                # THE SLAVE'S INSTALL BRANCH, WHICH IS ITS DOMAIN. Read from `global.domain`, the
                # one place a cluster map states it — the generator's `cluster` value above reads
                # the same key. It said `.fqdn`, which is a key no cluster map has: the top level of
                # a map carries stage, role, booksCluster and release and nothing else, and with
                # `missingkey=error` above, a template naming a key that is not there produces no
                # Application at all for the slave it was generating.
                branch: "{{ .global.domain }}"
                apiHost: "{{ .global.apiHost }}"
                apiPort: "{{ .global.apiPort }}"
                masterFqdn: "{{ .global.master }}"
                stage: "{{ .stage }}"
              argo-cd:
                configs:
                  cm:
                    installationID: "{{ .values.cluster }}"
                    url: "https://argo-{{ .values.cluster }}.{{ .global.master }}"
                    # THE ONLY WAY INTO A SLAVE'S RECONCILER. values-common.yaml of
                    # clusters/slaves/slave switches the local account off
                    # (configs.cm.admin.enabled "false"), so without this key the sign-in
                    # page offers neither a provider button nor a password form and nobody
                    # can open the instance at all — while the workload runs, the
                    # certificate is issued and every check reads green.
                    #
                    # IT IS INJECTED HERE AND NOWHERE ELSE because the issuer names the
                    # cluster holding the master part, and a static values file of the slave
                    # chart cannot see it: `configs.cm` belongs to the argo-cd sub-chart, and
                    # `.global.master` is a generator value that only this ApplicationSet
                    # holds. It is the same value the `url` above is built from, so the
                    # address a browser is sent back to and the address it signs in at cannot
                    # be answered apart.
                    #
                    # ONE CLIENT FOR EVERY SLAVE, and no secret. The provider in
                    # clusters/bootstrap/idp/blueprints/99-argo-slave.yaml is `client_type:
                    # public` with a REGEX redirect_uri covering every
                    # argo-<name>.<master>/auth/callback, so onboarding a slave needs no new
                    # client and there is nothing per slave to seal or rotate. A public
                    # client has no client_secret, and ArgoCD then refuses the exchange
                    # unless enablePKCEAuthentication is set: OAuth2UsePKCE() reads exactly
                    # that key off oidc.config (argo-cd util/settings/settings.go).
                    #
                    # The application slug is `argo-slave`, and the per-application issuer
                    # path is built from the slug — so a rename there moves the issuer and
                    # this line has to move with it.
                    #
                    # `groups` is asked for as an essential ID-token claim because the RBAC
                    # below decides admission on it, and ArgoCD reads the group claim by
                    # default (DefaultScopes = ["groups"], argo-cd util/rbac/rbac.go), so
                    # nothing sets rbac.scopes here.
                    oidc.config: |
                      name: Authentik
                      issuer: https://idp.{{ .global.master }}/application/o/argo-slave/
                      clientID: argo-slave
                      enablePKCEAuthentication: true
                      requestedScopes:
                        - openid
                        - profile
                        - email
                        - groups
                      requestedIDTokenClaims:
                        groups:
                          essential: true
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .values.cluster }}"
      syncPolicy:
        # THE NAMESPACE THIS CREATES IS A WORKLOAD NAMESPACE, AND HAS TO SAY SO.
        # Vault's external-secrets role on the master admits a caller by the label
        # below, not by a list of names — so the slave instance's own secret reader,
        # which runs in this namespace on the master, is let in because the namespace
        # carries it. Without the label the namespace is created bare and every login
        # out of it is refused with "namespace not authorized"; the answer is not to
        # write the role from the register program (one object, two writers, and the
        # last one blinds the other side) but to mark the namespace the way
        # platform-apps-appset.yaml marks every other one.
        managedNamespaceMetadata:
          labels:
            hostyour.cloud/workload: "true"
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
