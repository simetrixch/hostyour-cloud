apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-applications
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  # TWO SOURCES, BECAUSE clusters/argocd IS A CHART. The tree it syncs is rendered from this
  # cluster's own map, and a chart reaches a file outside its own directory only through a source
  # declared `ref:`. The first entry carries no path and exists only to give `$values` a meaning.
  #
  # ONE PLACEHOLDER ANSWERS THE BRANCH NAME AND THE MAP'S FILE NAME, because an install branch is
  # named after the cluster's own domain and its map is the file named for that domain. The
  # placeholder is the domain the trunk carries wherever one installation would carry its own, and
  # the branch programs replace it everywhere in the checkout. It is deliberately NOT spelled out in
  # this comment: that row names no keys, so it rewrites every occurrence on any line it reaches,
  # comments included, and a sentence quoting it would come out of a run stating one installation's
  # domain instead of explaining the placeholder. Nothing renders this file — it is the object that
  # starts the reconciler, so it cannot come from the reconciler — and the branch is therefore the
  # only place its two values become this installation's own.
  sources:
    - repoURL: &repo "https://github.com/simetrixch/hostyour-cloud.git"
      targetRevision: &branch example.invalid
      ref: values
    - repoURL: *repo
      targetRevision: *branch
      path: clusters/argocd
      helm:
        valueFiles:
          - $values/clusters/active/example.invalid.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # THE BUDGET HAS TO OUTLAST A FIRST INSTALLATION, and five attempts backing off to three minutes
    # does not. This application applies two objects of a kind whose CRD one of its own children
    # installs, and on a cluster where every image is being pulled for the first time that child
    # takes several minutes to become ready. Measured on a real machine: the CRDs appear about
    # seven minutes after the root sync begins, the retries are spent in three, and ArgoCD does not
    # begin a fresh sync of a revision whose last one FAILED — so the two objects are never created
    # and nothing afterwards goes back for them. The whole installation then stands one hard
    # refresh short of working, with no message saying so.
    #
    # Ten attempts backing off to five minutes covers about forty, which is a first pull of every
    # image on a cold node. A later sync of an installation that is already up reaches its work on
    # the first attempt and never touches any of this.
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 5m
