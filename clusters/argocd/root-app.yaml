apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-applications
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/simetrixch/hostyour-cloud.git
    # THE INSTALLATION'S OWN BRANCH, and never the trunk. What stands here is what the reconciler
    # reads every appset out of, and the trunk carries them with their placeholders unstamped -
    # so a handover pointing at master hands over a set of names Kubernetes refuses, and the
    # reconciler holds the cluster while it can create nothing on it. Stamped from __FQDN__ by the
    # branch program, which is why the trunk shows the placeholder: the trunk is not an installation.
    targetRevision: __FQDN__
    path: clusters/argocd/apps

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # THE BUDGET HAS TO OUTLAST A FIRST INSTALLATION, and five attempts backing off to three minutes
    # does not. This application applies two objects of a kind whose CRD one of its own children
    # installs, and on a cluster where every image is being pulled for the first time that child
    # takes several minutes to become ready. Measured on apps1: the root sync began at 18:37 and the
    # CRDs appeared at 18:44:23 — the retries were spent by 18:40 and ArgoCD does not begin a fresh
    # sync of a revision whose last one FAILED, so the two objects were never created and nothing
    # afterwards went back for them. The whole installation then stood one hard refresh short of
    # working, with no message saying so.
    #
    # Ten attempts backing off to five minutes covers about forty, which is a first pull of every
    # image on a cold node. A later sync of an installation that is already up reaches its work on
    # the first attempt and never touches any of this.
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 5m
