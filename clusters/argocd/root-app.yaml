apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-applications
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/simetrixch/hostyour-cloud.git
    targetRevision: master
    path: clusters/argocd/apps

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # THE BUDGET HAS TO OUTLAST A FIRST INSTALLATION, and five attempts backing off to three minutes
    # does not. This application applies two objects of a kind whose CRD one of its own children
    # installs, and on a cluster where every image is being pulled for the first time that child
    # takes several minutes to become ready. Measured on a real machine: the CRDs appear about
    # seven minutes after the root sync begins, the retries are spent in three, and ArgoCD does not
    # begin a fresh sync of a revision whose last one FAILED — so the two objects are never created
    # and nothing afterwards goes back for them. The whole installation then stands one hard
    # refresh short of working, with no message saying so.
    #
    # Ten attempts backing off to five minutes covers about forty, which is a first pull of every
    # image on a cold node. A later sync of an installation that is already up reaches its work on
    # the first attempt and never touches any of this.
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 5m
