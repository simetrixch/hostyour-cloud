{{- /*
THE RECONCILER'S OWN TREE, RENDERED FROM THE CLUSTER MAP.

The manifests stand in files/ and not in templates/. ArgoCD reads its own
{{ }} goTemplate expressions inside them, and anything under templates/ is read
by Helm first, so a manifest placed there would lose those expressions. This
template reads each file whole with .Files.Get and puts this cluster's own
values in place of the markers. The idiom is the one
clusters/inventories/consumer-build/templates/applicationset.yaml:29 already
uses, for the same reason.

A REPLACE HAS NO KEY AND NO KEEP MARKER. `replace` rewrites every occurrence of
its literal, in a comment as well as in a value, and it cannot be narrowed to
the value of one key the way the `keys:` argument of the
stamp_placeholder_in_tracked_files step narrows a stamp row. So every value this
template writes stands behind a marker of its own, and no plain word is
replaced. The word `argocd` stands inside the annotation domain
argocd.argoproj.io, and the word `master` stands in prose and once as the deploy
repository's own branch, so files/ carries __ARGOCD_NAMESPACE__ and __BRANCH__ at
the sites where those two are values.

ONE REPOSITORY, ONE REVISION, AND IT IS THE ROOT APPLICATION'S. Every source and
every git generator that names this repository stands on __BRANCH__, which is
the commit the root Application synced, handed to this chart as `revision`
(root-app.yaml, and clusters/slaves/slave/templates/root-application.yaml for a
slave). A generated Application therefore reaches a commit only after the root
Application has applied that commit's AppProjects at wave -1. One that followed
the branch on its own could sync a kind before its project admits it, and its
sync would fail until a retry. A release reaches a cluster BY ARRIVING ON THE
BOOKS BRANCH: the branch program merges the release tag into it, the root
Application syncs that commit, and this chart hands it on. ArgoCD's repo-server
also refuses an Application whose `ref` source and the source referencing it
resolve one repository to two commits — "cannot reference a different revision
of the same repository" — so where two sources must name the same ref, they take
it from one YAML anchor, and moving one cannot leave the other behind.

__BRANCH__, __BOOKS_FQDN__ AND __FQDN__ ARE THREE QUESTIONS. __FQDN__ is what
this cluster is called: it names the cluster map, and it is a fqdn a selector
compares. __BOOKS_FQDN__ is the cluster that keeps this installation's books:
the name of the one install branch an installation has, which a selector
compares and which the deploy repository's branch is named after. __BRANCH__ is
the commit of this repository a source or a generator reads, and only the root
Application knows it.

`# file: <name>` opens each emitted document. Helm writes one `# Source:` line
for this template, and all the documents come from it, so that line cannot
tell them apart.
*/ -}}
{{- /*
THE BLOCK BEFORE THE KEYS IN IT. This chart is the ONE chart of this repository
whose whole values chain is a single file: root-app.yaml beside this template
and clusters/slaves/slave/templates/root-application.yaml both hand it
$values/clusters/active/<fqdn>.yaml and the parameter `revision` and nothing
else, so `global` reaches it from the cluster map or from nowhere. Every other chart is handed
clusters/platform/values-common.yaml first, and that file carries the block.
A guard written as `required "..." .Values.global.clusterName` cannot answer for
a map with no block at all: the dereference of the missing block fails before
`required` is ever called, and helm stops with `nil pointer evaluating
interface {}.clusterName`, which names neither the file nor the block. So the
block is bound once here and every key below is read out of the binding.
*/ -}}
{{- $stage := required "argocd-apps: stage is required (clusters/active/<fqdn>.yaml) — it is the PLATFORM'S stage: platform-apps-appset.yaml, slaves-appset.yaml and projects.yaml are cut for it. The unit sets (consumers, units, tenants) carry no stage of the cluster's: they read every stage file of a registration and take the unit's stage from its path" .Values.stage }}
{{- $role := required "argocd-apps: role is required (clusters/active/<fqdn>.yaml) — the platform app selector admits the parts this cluster carries, and a cluster admitting no part runs no platform application" .Values.role }}
{{- $global := required "argocd-apps: the cluster map states no global: block (clusters/active/<fqdn>.yaml), and this chart is handed that one file and nothing else. Every value below stands under global: in it. A map written before the block existed carries those values flat at the top level instead, and no chart of this tree can be rendered against it" .Values.global }}
{{- $clusterName := required "argocd-apps: global.clusterName is required (clusters/active/<fqdn>.yaml) — this cluster registers itself under that name and the unit generators select the registrations carrying it" $global.clusterName }}
{{- $fqdn := required "argocd-apps: global.domain is required (clusters/active/<fqdn>.yaml) — this cluster's own domain, which names its cluster map, the file the value chains load last" $global.domain }}
{{- $booksFqdn := required "argocd-apps: global.booksCluster is required (clusters/active/<fqdn>.yaml) — the install branch of the cluster holding the master role. It carries this installation's registrations AND every cluster map of it, and the deploy repository's branch is named after it: a cluster carrying only the slave part has no branch of its own" $global.booksCluster }}
{{- $revision := required "argocd-apps: revision is required — the commit of this repository the root Application synced, which it hands this chart as the Helm parameter revision ($ARGOCD_APP_REVISION in clusters/argocd/root-app.yaml, the slave's own commit in clusters/slaves/slave/templates/root-application.yaml). Every source and generator of this repository stands at it" .Values.revision }}
{{- $deployRepo := required "argocd-apps: global.deployRepo is required (clusters/active/<fqdn>.yaml) — the deploy repository as bare owner/name, written inside a URL these files already carry" $global.deployRepo }}
{{- $holdsBooks := required "argocd-apps: global.servicesLocal.vault is required (clusters/active/<fqdn>.yaml) — it says whether this cluster keeps the books, and the two files below exist only on the cluster that does" (dig "servicesLocal" "vault" "" $global) }}
{{- /* THIS CLUSTER'S TAILNET ADDRESS, read by consumers-appset.yaml alone: a unit that declares an
SMTP entry gets it as the address its chart opens the entry on. A slave's map carries it from
deploy-slave, a master's once tailnet-join-self has written it; a map without it fills "". */ -}}
{{- $apiHost := dig "apiHost" "" $global }}
{{- /* THE STAGE ZONES, composed ONCE for the whole tree (simetrixch/hostyour-cloud#208). A unit's
public host is `<label>.<stage apex>` and a tenant's members stand at `<member>.<subdomain>.<stage
apex>`, where the stage apex is the unit apex itself for prod and `<stage>.<unit apex>` otherwise.
The three ApplicationSets below hand the finished zone to the charts they generate (`unitHost`,
`global.stageApex`, `tenant.zone`) by picking the marker of the registration's stage, so no chart and
no appset spells the rule again; hostyour-manager's shared/unit-host.ts composes the same strings. */ -}}
{{- $unitApex := required "argocd-apps: global.unitApex is required (clusters/active/<fqdn>.yaml) — every unit's public host stands under a zone of it" $global.unitApex }}
{{- $stageApexDev := printf "dev.%s" $unitApex }}
{{- $stageApexTest := printf "test.%s" $unitApex }}
{{- $stageApexProd := $unitApex }}
{{- /* THE OLD STAGE ZONES, of an installation whose units moved to another apex. While the cluster map
keeps the apex they stood under as `global.previousUnitApex`, every old unit host answers with a
permanent redirect to its twin under the unit apex, path and query kept (files/redirects-appset.yaml,
rendered only then; absent, the output is the same byte for byte). The old apex is neither the unit
apex nor a zone above or below it: an old host would then be one a unit answers at today, and its
redirect would take that unit's traffic. */ -}}
{{- $previousUnitApex := dig "previousUnitApex" "" $global }}
{{- if and $previousUnitApex (or (eq $previousUnitApex $unitApex) (hasSuffix (printf ".%s" $unitApex) $previousUnitApex) (hasSuffix (printf ".%s" $previousUnitApex) $unitApex)) }}
{{- fail (printf "argocd-apps: global.previousUnitApex %s is the unit apex %s or a zone above or below it (clusters/active/<fqdn>.yaml), so an old host would be one a unit answers at today" $previousUnitApex $unitApex) }}
{{- end }}
{{- $previousStageApexDev := printf "dev.%s" $previousUnitApex }}
{{- $previousStageApexTest := printf "test.%s" $previousUnitApex }}
{{- $previousStageApexProd := $previousUnitApex }}
{{- /* THE PARTS A ROLE CARRIES. A master carries the slave part as well (hostyour-cloud#232): the
data services and every workload a slave runs stand on it too, so a unit can be placed on any
cluster of the installation. So `master` fills the two part slots with `master` and `slave`, and a
`slave` with `slave` twice. The third slot is the role as ONE word, for an application that belongs
to one machine shape only: `pure-slave` on a slave — observability-agent collects for a master's
stack, and a master carries that stack itself — and `master` on a master. */ -}}
{{- $roleParts := ternary (list "master" "slave") (list $role) (eq $role "master") }}
{{- $roleWhole := ternary "pure-slave" $role (eq $role "slave") }}
{{- /*
WHERE THIS CLUSTER'S ARGOCD OBJECTS STAND. On a cluster that carries the master
part the reconciler runs in the namespace `argocd`. A slave's instance does not:
it runs on the master, in a namespace named after the slave, and an object still
naming `argocd` is outside what that instance manages, so ArgoCD refuses to
compare it at all ("namespace argocd for ... is not managed"), the whole tree
stands Unknown, and a deployment's verification waits out its clock on it.
*/ -}}
{{- $namespace := ternary "argocd" $clusterName (eq (first $roleParts) "master") }}
{{- /*
THE WAVE ORDER OF THE PLATFORM APPLICATIONS, AS ROLLINGSYNC STEPS. The
ApplicationSet in files/platform-apps-appset.yaml carries the mechanism and what
it costs; this builds the ordered list it needs. One step per wave, in ascending
order, and the applicationset controller admits a step only once every
Application of the step before it is Healthy.

IT REPEATS NO WAVE VALUE. `clusters/inventories/<name>/app.yaml` is the one
place a wave is declared, and a step list naming the waves in use would be a
second one that nothing compares against the first. A step per integer states
the ORDER instead: a wave that is added, changed or dropped in an inventory
needs no edit here, and the steps a cluster has no application for stay empty
and cost a comparison each.

A STEP LIST CANNOT BE COMPUTED FROM THE INVENTORIES. Helm reads files only from
inside its own chart, and `clusters/inventories/` is outside this one — which is
why the ApplicationSet reaches those files with a git generator rather than with
.Files. So the range is fixed here, and the `NotIn` step below is what keeps a
wave outside it from being an Application that never syncs at all.

THE LABEL KEY IS WRITTEN FROM HERE TOO. The steps select on a label of the
generated Application, so the key these expressions name and the key the
Application carries are one value in two places. A key changed on one side alone
selects nothing, and every Application then falls into the catch-all step and
syncs at once — the state the steps exist to end, arrived at in silence.
*/ -}}
{{- $waveLabel := "hostyour.cloud/sync-wave" }}
{{- $waveCount := 50 }}
{{- $waveSteps := list }}
{{- $waveValues := list }}
{{- range $wave := until $waveCount }}
{{- $waveSteps = append $waveSteps (printf "        - matchExpressions: [{ key: %q, operator: In, values: [%q] }]" $waveLabel (toString $wave)) }}
{{- $waveValues = append $waveValues (quote (toString $wave)) }}
{{- end }}
{{- $waveSteps = append $waveSteps (printf "        - matchExpressions: [{ key: %q, operator: NotIn, values: [%s] }]" $waveLabel (join ", " $waveValues)) }}
{{- $waveStepList := printf "\n%s" (join "\n" $waveSteps) }}
{{- $booksOnly := list "cluster-self.yaml" "e2e-targets-appset.yaml" "slaves-appset.yaml" }}
{{- $docs := list }}
{{- $names := list "cluster-self.yaml" "consumers-appset.yaml" "e2e-targets-appset.yaml" "platform-apps-appset.yaml" "projects.yaml" "slaves-appset.yaml" "tenants-appset.yaml" "units-appset.yaml" }}
{{- if $previousUnitApex }}
{{- $names = append $names "redirects-appset.yaml" | sortAlpha }}
{{- end }}
{{- range $name := $names }}
{{- if or $holdsBooks (not (has $name $booksOnly)) }}
{{- $doc := $.Files.Get (printf "files/%s" $name) | replace "__CLUSTER_NAME__" $clusterName | replace "__STAGE__" $stage | replace "__BOOKS_FQDN__" $booksFqdn | replace "__FQDN__" $fqdn | replace "__DEPLOY_REPO__" $deployRepo | replace "__CLUSTER_ROLE_FIRST_PART__" (first $roleParts) | replace "__CLUSTER_ROLE_LAST_PART__" (last $roleParts) | replace "__CLUSTER_ROLE_WHOLE__" $roleWhole | replace "__BRANCH__" $revision | replace "__ARGOCD_NAMESPACE__" $namespace | replace "__SYNC_WAVE_LABEL__" $waveLabel | replace "__SYNC_WAVE_STEPS__" $waveStepList | replace "__STAGE_APEX_DEV__" $stageApexDev | replace "__STAGE_APEX_TEST__" $stageApexTest | replace "__STAGE_APEX_PROD__" $stageApexProd | replace "__API_HOST__" $apiHost | replace "__PREVIOUS_STAGE_APEX_DEV__" $previousStageApexDev | replace "__PREVIOUS_STAGE_APEX_TEST__" $previousStageApexTest | replace "__PREVIOUS_STAGE_APEX_PROD__" $previousStageApexProd }}
{{- $docs = append $docs (printf "# file: %s\n%s" $name $doc) }}
{{- end }}
{{- end }}
{{- join "---\n" $docs -}}
