apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-apps-__STAGE__
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error

  generators:
    - git:
        repoURL: https://github.com/simetrixch/hostyour-cloud.git
        revision: master
        files:
          - path: "clusters/inventories/*/app.yaml"
      selector:
        matchExpressions:
          - key: runsOn
            operator: In
            values:
              - every-cluster
              - __CLUSTER_ROLE__

  template:
    metadata:
      name: "{{ .name }}-__STAGE__"
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "{{ .syncWave }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: "{{ .project }}"
      sources:
        - repoURL: &repo "https://github.com/simetrixch/hostyour-cloud.git"
          targetRevision: &branch master
          ref: values
        - repoURL: *repo
          targetRevision: *branch
          path: "clusters/inventories/{{ .name }}"
          helm:
            valueFiles:
              - $values/clusters/platform/values-common.yaml
              - $values/clusters/platform/values-__STAGE__.yaml
              - values-common.yaml
              - values-__STAGE__.yaml
              - $values/installation/values/{{ .name }}.yaml
              - $values/installation/profile.yaml
            ignoreMissingValueFiles: true
      destination:
        server: "https://kubernetes.default.svc"
        namespace: "{{ .namespace }}"

  # The patch is rendered by the same go template as the fields above and under the same
  # goTemplateOptions, so missingkey=error binds here too. Under that option a bare `.key` against a
  # generator parameter map that does not carry the key is an ERROR, and one such error ends the
  # whole reconcile: the controller records an ErrorOccurred condition and creates NO Application at
  # all — not even for the apps whose parameters were complete.
  #
  # So the two kinds of parameter are read differently, and the difference is the contract:
  #   MANDATORY — `prune` and `createNamespace` are read bare. Every app.yaml carries them, and an
  #     app.yaml that does not is meant to be refused.
  #   OPTIONAL — `serverSideApply` and `ignoreDifferences` describe an app that needs an exception.
  #     Most do not, so they are looked up with a default and the line is written only for an app
  #     that declared one. `with` rebinds the dot to the looked-up value, which keeps a second bare
  #     lookup from creeping back inside the block.
  templatePatch: |
    spec:
      syncPolicy:
        automated:
          prune: {{ .prune }}
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        managedNamespaceMetadata:
          labels:
            hostyour.cloud/workload: "true"
        syncOptions:
          - CreateNamespace={{ .createNamespace }}
          {{- with dig "serverSideApply" "" . }}
          - ServerSideApply={{ . }}
          {{- end }}
      {{- with dig "ignoreDifferences" "" . }}
      ignoreDifferences:
        {{- . | nindent 8 }}
      {{- end }}
