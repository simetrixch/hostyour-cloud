{{- /*
THE CREDENTIAL THIS RECONCILER READS EVERY REPOSITORY OF THE INSTALLATION'S FORGEJO WITH, as an ArgoCD credential
template (secret-type repo-creds): ArgoCD uses it for every repoURL under the Forgejo host that no repository
Secret names, so one Secret reads the platform repository, the deploy repository and the units of every
organisation of that Forgejo. The machine user `argocd` behind it reads every repository of the organisations,
read-only (hostyour-deploy ansiwise/programs/deploy-platform-services.yaml, the argocd-forge entry).

The twin of clusters/inventories/argocd-secrets/templates/externalsecret-repo-creds-forgejo.yaml, for the instance a
slave runs on the master. The key is read through this cluster's own store.

RENDERED ONLY WHERE THE FORGE EXISTS. installation/values/repository-credentials.yaml sets
global.repositoryCredentials.forgejo.enabled and .host, and the platform-apps chain loads it. An installation
without that file renders no Secret here and reads its repositories with the GitHub credentials beside this one.

THE URL IS THE HOST ALONE, ending in the slash. ArgoCD matches a credential template by plain prefix and the
organisations are configuration of the installation, so the prefix cannot name one. It comes from the forge's
host and never from global.platformUrl or global.deployUrl, so a repository on GitHub is never matched by it.
*/ -}}
{{- $forgejo := dig "repositoryCredentials" "forgejo" dict .Values.global }}
{{- if $forgejo.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-creds-forgejo
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  # No periodic read of Vault — the platform-wide delivery rule (clusters/charts/external-secret
  # carries the full statement of it). Putting a NEW password in front of ArgoCD: update Vault, then
  # DELETE the target Secret `kubectl -n {{ .Release.Namespace }} delete secret repo-creds-forgejo` — OnChange creates
  # it again from Vault. No pod roll: ArgoCD reads this Secret on every use.
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: {{ .Values.global.secretStoreName }}
    kind: SecretStore
  target:
    name: repo-creds-forgejo
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: git
        url: https://{{ required "slave: global.repositoryCredentials.forgejo.host is required when the Forgejo credential is enabled (installation/values/repository-credentials.yaml)" $forgejo.host }}/
        username: '{{ `{{ .username }}` }}'
        password: '{{ `{{ .password }}` }}'
  data:
    {{- range $field := list "username" "password" }}
    - secretKey: {{ $field }}
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        key: {{ printf "%s/app/argocd-forge" (required "slave.stage is required (injected by slaves-appset.yaml)" $.Values.slave.stage) }}
        property: {{ $field }}
    {{- end }}
{{- end }}
