{{- /*
THE APP FOR EVERY REPOSITORY OF ITS OWNER, as an ArgoCD credential template (secret-type repo-creds):
ArgoCD uses it for every repoURL under the owner that no repository Secret names — the charts of
the units this ArgoCD generates Applications for. The same Vault entry as repo-deploy beside it, so
no token stands anywhere and nothing expires, and it is rendered from git and Vault like every other
credential of this ArgoCD: a deleted Application refetches with it, and a deleted Secret is written
again by the operator's store.

THE OWNER IS THE ENTRY'S FOURTH FIELD, and the credential is GitHub's whichever forge the platform and
deploy repositories stand on: the units of an owner stay on GitHub when the platform moves to Forgejo, and
this is the credential that reads them. Taking the prefix from global.deployUrl would point it at
Forgejo as soon as the deploy repository moves.
*/ -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-creds-owner
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: {{ .Values.global.secretStoreName }}
    kind: SecretStore
  target:
    name: repo-creds-owner
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: git
        # The owner's URL: GitHub, the owner out of the entry, ending in the slash. ArgoCD matches a
        # credential template by plain prefix, so without the slash it would also match an owner whose
        # name begins with this one.
        url: 'https://github.com/{{ `{{ .owner }}` }}/'
        githubAppID: '{{ `{{ index . "app-id" }}` }}'
        githubAppInstallationID: '{{ `{{ index . "installation-id" }}` }}'
        githubAppPrivateKey: '{{ `{{ index . "private-key" | replace "\\n" "\n" }}` }}'
  data:
    {{- range $field := list "app-id" "installation-id" "private-key" "owner" }}
    - secretKey: {{ $field }}
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        key: {{ printf "%s/app/github-app" (required "slave.stage is required (injected by slaves-appset.yaml)" $.Values.slave.stage) }}
        property: {{ $field }}
    {{- end }}
