{{- /*
The DEPLOY repo credential for the slave's ArgoCD instance — the twin
of externalsecret-repo-platform.yaml: the tenant ApplicationSets in the
argocd tree rendered for this slave (clusters/argocd/files/tenants-appset.yaml) read
the PRIVATE deploy repository (tenant registrations under
registrations/<guid>/<stage>.yaml + the tenant charts), so this instance's
repo-server needs a credential for it. Same discovery mechanism as
the monorepo credential: a Secret labeled
`argocd.argoproj.io/secret-type: repository` in the instance's namespace.
The credential is the platform's GitHub App (#237) — its id, its installation id and its
private key out of <stage>/app/github-app, read through this cluster's own store, the native
GitHub-App repository credential ArgoCD reads at every use. This instance syncs the deploy repository
and commits nothing.
*/ -}}
{{- $name := required "slave.name is required (pointer-file field name)" .Values.slave.name }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-deploy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  # No periodic read of Vault — the platform-wide delivery rule (clusters/charts/external-secret
  # carries the full statement of it). Putting a NEW PAT in front of ArgoCD:
  # update Vault and add the slave again, then DELETE the target Secret
  # `kubectl -n argocd delete secret repo-deploy` — OnChange creates it again
  # from Vault. No pod roll: ArgoCD reads this Secret on every use.
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: {{ .Values.global.secretStoreName }}
    kind: SecretStore
  target:
    name: repo-deploy
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          # THE label that makes this ArgoCD treat the Secret as a repo credential.
          argocd.argoproj.io/secret-type: repository
      # THE APP ITSELF (#228, #237): no token stands anywhere for the deploy repository.
      data:
        type: git
        # The deploy repository is installation state: clusters/active/<fqdn>.yaml carries it as
        # global.deployUrl. Required and not defaulted — a repo credential
        # attached to the wrong URL is a credential ArgoCD never uses and nobody
        # misses, so a branch naming no deploy repository must fail here.
        url: {{ required "slave: global.deployUrl is required (clusters/active/<fqdn>.yaml, rendered per install branch from the cluster map's deploy-repo)" .Values.global.deployUrl }}
        githubAppID: '{{ `{{ index . "app-id" }}` }}'
        githubAppInstallationID: '{{ `{{ index . "installation-id" }}` }}'
        githubAppPrivateKey: '{{ `{{ index . "private-key" | replace "\\n" "\n" }}` }}'
  data:
    {{- range $field := list "app-id" "installation-id" "private-key" }}
    - secretKey: {{ $field }}
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        key: {{ printf "%s/app/github-app" (required "slave.stage is required (injected by slaves-appset.yaml)" $.Values.slave.stage) }}
        property: {{ $field }}
    {{- end }}
