{{- /*
The slave CLUSTER registration for the slave's ArgoCD instance (D5). ArgoCD
discovers clusters declaratively: any Secret in its namespace labeled
`argocd.argoproj.io/secret-type: cluster` IS a registered cluster. ESO
composes that Secret here (target.template adds the label + assembles the
config JSON) from the master's Vault at secret/<stage>/slaves/<name>/cluster
— written when a slave is added, from the JSON that slave emits about its own
management credentials. Contract (both properties REQUIRED at that Vault path):
  bearerToken  the long-lived token of the slave's argocd-manager SA
               (cluster-admin, created on the slave when it is added)
  caData       the slave cluster's CA bundle, base64-encoded
The cluster NAME is the slave's `<name>` (D1): each ArgoCD instance registers
ITS slave under that name, which is what lets a branch run stamp every destination
on the slave branch to `name: <name>` generically. The SERVER is git-owned
(cluster-map fields apiHost/apiPort), NOT read from Vault — git stays the source
of truth for addressing. apiHost is the address this master reaches the slave
on, which is its tailnet address once the two share that private network; the
slave's own bring-up composes the SAME address into Vault's kubernetes_host and
the shared dashboard's kubeconfig, so a disagreement between the two leaves the
master reaching the slave for some things and not for others.
*/ -}}
{{- $slave := .Values.slave }}
{{- $name := required "slave.name is required (cluster-map field name)" $slave.name }}
{{- $apiHost := required "slave.apiHost is required (cluster-map field apiHost)" $slave.apiHost }}
{{- $apiPort := required "slave.apiPort is required (cluster-map field apiPort)" $slave.apiPort | toString }}
{{- $vaultKey := printf "%s/slaves/%s/cluster" (required "slave.stage is required (injected by slaves-appset.yaml)" .Values.slave.stage) $name }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-slave
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  # No periodic read of Vault — the platform-wide delivery rule (clusters/charts/external-secret
  # carries the full statement of it). Putting a NEW bearer in front of ArgoCD:
  # add the slave again (that run is idempotent), then DELETE the target Secret
  # `kubectl -n argocd delete secret cluster-slave` — OnChange creates it again from
  # Vault. No pod roll here, unlike a unit's secrets: ArgoCD reads this Secret on
  # every use rather than into an env var at start.
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: {{ .Values.global.secretStoreName }}
    kind: SecretStore
  target:
    name: cluster-slave
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          # THE label that makes this ArgoCD treat the Secret as a cluster.
          argocd.argoproj.io/secret-type: cluster
      data:
        name: {{ $name }}
        server: "https://{{ $apiHost }}:{{ $apiPort }}"
        # ESO's own {{ `{{ .key }}` }} templating (NOT Helm's) substitutes the
        # pulled properties below. Safe to inline raw into JSON: a SA JWT and
        # base64 CA data contain no JSON metacharacters.
        config: |
          {
            "bearerToken": "{{ `{{ .bearerToken }}` }}",
            "tlsClientConfig": {
              "insecure": false,
              "caData": "{{ `{{ .caData }}` }}"
            }
          }
  data:
    # Every defaulted remoteRef field emitted explicitly so ArgoCD sees no
    # server-side drift (same convention as clusters/charts/external-secret — keep in
    # sync with the vendored ESO CRD defaults when bumping ESO).
    - secretKey: bearerToken
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        key: {{ $vaultKey }}
        property: bearerToken
    - secretKey: caData
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        key: {{ $vaultKey }}
        property: caData
