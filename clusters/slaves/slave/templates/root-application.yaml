{{- /*
The HANDOFF root Application (D5) — the moment GitOps takes over for the slave.

This Application CR lands in ns <name>. The MASTER's ArgoCD (which deploys
this chart) only watches Applications in ns `argocd`, so for the master it is
an inert managed resource; the slave's own ArgoCD controller watches its OWN
namespace, picks it up, and syncs the clusters/argocd chart off the BOOKS
branch (projects.yaml + platform-apps-appset.yaml + consumers-appset.yaml +
tenants-appset.yaml, rendered from the slave's own cluster map to ns <name> /
destination name:<name>) into ns <name>. From there the books branch drives
everything — the exact per-cluster mechanism clusters/argocd/root-app.yaml
implements on a full cluster (the installer's GitOps handoff), relocated onto
the master.

A PURE SLAVE HAS NO BRANCH OF ITS OWN, and the two values below are why that
costs nothing. One installation keeps every cluster map on ONE branch, the
books, so the tree this Application syncs and the map it renders that tree from
both stand there — the branch names WHICH tree, the fqdn names WHICH map inside
it. They were one word while a slave had a branch named after its own domain,
and separating them is the whole of what this template needed.

project `default`: the instance's own auto-created allow-all default project —
this root app CREATES the slave tree's AppProjects, so it cannot reference one
(the same first-sync chicken-and-egg the MASTER solves imperatively for the
slave's own AppProject <name> — see the per-slave projects note in
clusters/argocd/files/projects.yaml; here `default` always exists, so no
imperative step is needed).

NAME COLLISION WITH THE MASTER'S ROOT APP is survived by design: the master's
own root Application is ALSO named root-applications
(clusters/argocd/root-app.yaml), and both instances share one physical cluster — with ArgoCD
v3's default annotation tracking the master would attribute everything this
app syncs (tracking-id `root-applications:...`) to ITS root app and
auto-prune it on creation. The per-slave instance therefore runs with
argocd-cm installationID=<name> (slaves-appset.yaml valuesObject), which
namespaces resource attribution per instance and makes the shared name safe.

NO resources-finalizer on purpose (root-app.yaml has one; this one must not):
on slave teardown (pointer file removed) the master prunes the instance's
Deployments and this CR concurrently — a finalizer here would need the slave's
own controller alive to cascade, deadlocking namespace cleanup. Without it the
CR deletes cleanly and the slave's workloads are untouched; the instance's own
generated child Applications remain as inert CRs in ns <name> (offboard/rebuild
cleanup is the job of removing the slave).
*/ -}}
{{- $slave := .Values.slave }}
{{- $branch := required "slave.branch is required (clusters/argocd/files/slaves-appset.yaml valuesObject — the BOOKS branch, the one branch an installation keeps every cluster map on)" $slave.branch }}
{{- $fqdn := required "slave.fqdn is required (clusters/argocd/files/slaves-appset.yaml valuesObject — this slave's own domain, which names its cluster map on the books branch)" $slave.fqdn }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-applications
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  project: default

  # TWO SOURCES, BECAUSE clusters/argocd IS A CHART. It renders the slave's reconciler tree from the
  # slave's OWN cluster map, and a chart reaches a file outside its own directory only through a
  # source declared `ref:`. The first entry carries no path and exists only to give `$values` a
  # meaning. Both entries stand on the BOOKS branch, and which map the chart reads is decided by the
  # file name below rather than by the branch.
  sources:
    - repoURL: {{ .Values.repo.url }}
      targetRevision: {{ $branch }}
      ref: values
    - repoURL: {{ .Values.repo.url }}
      targetRevision: {{ $branch }}
      # THE TREE HAS NO STAGE SEGMENT. A path carrying one — `clusters/argocd/<stage>` — names a
      # layout that does not exist: ArgoCD answers `app path does not exist`, the Application stands
      # Unknown, and the deployment's verification waits its whole 30 minutes on it.
      path: clusters/argocd
      helm:
        valueFiles:
          # THE SLAVE'S OWN MAP AND NEVER THE MASTER'S, which is the one thing the branch above no
          # longer says: the books branch carries a map per cluster of this installation, so the
          # file name is what picks this instance's. It is also what makes the chart render the
          # slave's namespace rather than `argocd` — role there does not open with `master`, so
          # __ARGOCD_NAMESPACE__ becomes the slave's short name. Named with the master's map here,
          # this instance would render role master, namespace argocd and the three books-only
          # manifests, into a namespace it does not manage.
          - $values/clusters/active/{{ $fqdn }}.yaml

  destination:
    # In-cluster from the instance's perspective = the MASTER: the directory's
    # contents are argocd-tree CRs applied into the instance's own namespace (the
    # tree rendered for this slave puts their in-app destinations on the remote name:<name>).
    server: https://kubernetes.default.svc
    namespace: {{ .Release.Namespace }}

  # Mirrors clusters/argocd/root-app.yaml (automated + retry — cold-bootstrap
  # syncs can race; retry converges without waiting for the selfHeal cycle).
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
