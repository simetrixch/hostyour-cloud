{{- /*
gate-egress-fence: the security boundary of the gate sandbox, which runs chart code a tenant
wrote. A gate run needs exactly DNS and the public internet, for the github clone and the
chart-dependency fetch; common.publicEgressFence states what it denies and why.

The gate CLI's own fail-closed self-probe (fence.ts) verifies this fence from INSIDE before running
any gate: the must-fail targets (Manager, API server, cluster LAN) must be unreachable and the
must-pass target (github.com) reachable, otherwise the run refuses to validate anything.
*/ -}}
{{ include "common.publicEgressFence" (dict "root" $ "name" "gate-egress-fence") }}
---
{{- $nodeCidrs := .Values.global.nodeCidrs | default list }}
{{/*
gate-report-writer-apiserver — the ONE additive pinhole on top of the fence:
the publish-report finally task must kubectl-apply the GateReport ConfigMap,
i.e. reach the API server. Calico evaluates egress AFTER kube-proxy DNAT, so
kubernetes.default.svc resolves to the node's apiserver endpoint — inside the
very addresses the fence denies. Rather than widening the fence for the whole
namespace, this policy binds to exactly the publish pod via the
tekton.dev/pipelineTask label Tekton stamps on every TaskRun pod (value = the
Pipeline task name). That pod runs only the platform-pinned kubectl step —
never tenant code — and is the only pod holding an API token (SA
gate-report-writer, ConfigMap-write-only; see rbac.yaml).

IT READS THE SAME global.nodeCidrs THE FENCE DENIES, on the apiserver ports
alone. One value for both sides is what makes them impossible to disagree
about: an address the fence closes and a pinhole that was left pointing
somewhere else is a publish step that cannot write the report, and then the
Manager's poll finds no ConfigMap at all — the one thing pipeline.yaml says
must never happen. Splitting them into two keys would put that outage one
mistyped CIDR away, and nothing would report it until a run.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gate-report-writer-apiserver
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: gate-runner
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  podSelector:
    matchLabels:
      tekton.dev/pipelineTask: publish-report
  policyTypes:
    - Egress
  egress:
    # Post-DNAT apiserver endpoint, on the apiserver ports only (443 service
    # VIP, 6443 kubeadm, 16443 microk8s) — see values-common.yaml
    # reportWriter.apiServer.ports.
    - to:
        {{- range $nodeCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        {{- range .Values.reportWriter.apiServer.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
