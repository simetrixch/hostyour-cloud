{{- /*
gate-run — the onboarding gate Pipeline the Manager dispatches (one
PipelineRun per gate job; replaces the host-podman Quadlet gate-runner). Flow:

  clone           the SHARED image-builder git-clone Task via the cluster
                  resolver (no second copy of the clone logic; the fence
                  allows the github egress) — checks out the pinned SHA.
  gate            the gate-runner image's one-shot CLI over the cloned
                  workspace; writes the GateReport to
                  <workspace>/.gate-report.json. A gate FAIL is a report
                  verdict (exit 0); only an internal error exits non-zero.
  publish-report  finally — Tekton finally tasks run after all tasks complete,
                  which subsumes the contract's "runAfter gate, even if gate
                  fails" (finally cannot declare runAfter). Hands the report
                  back as ConfigMap gate-report-<run-id> under key
                  report.json; when the gate wrote none, the same ConfigMap
                  carries key incomplete.json instead, so the Manager's poll
                  always finds something and never hangs.

RUNTIME WIRING — the Manager's PipelineRun MUST set:
  - workspaces[source]: volumeClaimTemplate, accessModes [ReadWriteOnce]
    (single-node clusters; on multi-node use RWX or expect co-scheduling — same
    note as image-builder's pipeline-validate-gates.yaml), ~2Gi,
    storageClassName from global.storageClass.
  - spec.taskRunSpecs:
      - pipelineTaskName: publish-report
        serviceAccountName: gate-report-writer     # the ONLY pod with a token
    (a Pipeline cannot pin a per-task SA — SA binding is a PipelineRun field.)
  - spec.podTemplate.securityContext.fsGroup: 1000 — the clone step writes the
    workspace as root (alpine/git); each pod's mount-time fsGroup pass makes
    it group-writable for the non-root gate step (runAsUser 1000), which must
    create REPORT_OUT there.
  - spec.serviceAccountName: pipeline-sa — default SA for clone + gate: zero
    RBAC, automountServiceAccountToken false (rbac.yaml).
*/ -}}
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: gate-run
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: gate-runner
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  params:
    - name: git-url
      type: string
      description: HTTPS git URL of the repo under validation.
    - name: git-revision
      type: string
      description: The pinned 40-char commit SHA to validate (never a branch).
    - name: chart-path
      type: string
      description: Path of the chart inside the repo (gate CLI CHART_PATH).
    - name: stage
      type: string
      description: Stage the run validates against (dev|test|prod).
    - name: target-name
      type: string
      description: Onboarding target name (gate CLI TARGET_NAME).
    - name: cluster-value-files
      type: string
      description: >-
        The cluster's values chain as JSON — clusters/platform/values-common.yaml,
        platform/values-<stage>.yaml and clusters/active/<fqdn>.yaml, each with its path
        and its verbatim content (gate CLI CLUSTER_VALUE_FILES). The render gate
        layers these with -f, so it renders the chart exactly as ArgoCD will.
      default: "[]"
    - name: run-id
      type: string
      description: >-
        Manager-issued run id; names the report ConfigMap
        gate-report-<run-id>, so it must be a valid DNS-1123 name fragment
        (lowercase alphanumerics + dashes).
    - name: repo-credential-secret
      type: string
      description: >-
        Name of the per-run Secret the Manager creates in this namespace;
        its GITCREDENTIALS key is empty for a public repo and carries a read
        credential for a private one. No default: the clone step envFroms this
        name non-optionally, so an unset param would name no Secret at all and
        the clone pod would never start.
    # The Manager owns the run's identity + the fence it must prove: it is the
    # dispatcher (its config lives in clusters/inventories/manager values, GitOps-reproducible),
    # and confirmed-listening is a PER-RUN attestation that cannot be a static value.
    - { name: requested-ref, type: string, description: "The ref the operator submitted (report metadata; gate CLI REQUESTED_REF)." }
    - { name: must-fail-targets, type: string, description: "CSV of internal host:port the fenced pod MUST NOT reach (gate CLI MUST_FAIL_TARGETS)." }
    - { name: manager-addr, type: string, description: "The Manager's own host:port the pod MUST NOT reach (gate CLI MANAGER_ADDR)." }
    - { name: must-pass-target, type: string, description: "The one egress the pod MUST reach — github (gate CLI MUST_PASS_TARGET)." }
    - { name: confirmed-listening, type: string, description: "Manager attestation the must-fail targets are up (gate CLI CONFIRMED_LISTENING; fail-closed unless \"true\")." }
    - { name: runner-version, type: string, description: "runnerVersion stamped into the report." }
    - { name: kube-version, type: string, description: "kubeconform target minor, e.g. 1.30.0 (gate CLI KUBE_VERSION)." }
    - { name: job-budget-ms, type: string, description: "Whole-job ceiling in ms (gate CLI JOB_BUDGET_MS)." }
  workspaces:
    - name: source
      description: >-
        Shared per-run workspace: clone target, gate input (SOURCE_DIR) and
        report hand-off (.gate-report.json). PVC-backed via the PipelineRun's
        volumeClaimTemplate; auto-cleaned with the run.
  tasks:
    - name: clone
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: git-clone }
          - { name: namespace, value: {{ .Values.pipeline.builderNamespace }} }
      params:
        - { name: url, value: $(params.git-url) }
        - { name: revision, value: $(params.git-revision) }
        # The Manager always creates a per-run credential Secret (empty
        # GITCREDENTIALS for a public repo, a real read credential for a
        # private one), so the clone uses THIS run's credential and no other.
        - { name: credentials-secret, value: $(params.repo-credential-secret) }
        # Default depth=1 applies: github serves a direct fetch of a full
        # commit SHA (allow-anySHA1InWant), so the pin needs no history.
      workspaces:
        - { name: source, workspace: source }

    - name: gate
      runAfter: [clone]
      taskRef:
        name: gate
      params:
        - { name: target-name, value: $(params.target-name) }
        - { name: stage, value: $(params.stage) }
        - { name: chart-path, value: $(params.chart-path) }
        - { name: cluster-value-files, value: $(params.cluster-value-files) }
        - { name: repo-url, value: $(params.git-url) }
        - { name: resolved-sha, value: $(params.git-revision) }
        - { name: requested-ref, value: $(params.requested-ref) }
        - { name: must-fail-targets, value: $(params.must-fail-targets) }
        - { name: manager-addr, value: $(params.manager-addr) }
        - { name: must-pass-target, value: $(params.must-pass-target) }
        - { name: confirmed-listening, value: $(params.confirmed-listening) }
        - { name: runner-version, value: $(params.runner-version) }
        - { name: kube-version, value: $(params.kube-version) }
        - { name: job-budget-ms, value: $(params.job-budget-ms) }
      workspaces:
        - { name: source, workspace: source }

  finally:
    - name: publish-report
      taskRef:
        name: publish-report
      params:
        - { name: run-id, value: $(params.run-id) }
      workspaces:
        - { name: source, workspace: source }
