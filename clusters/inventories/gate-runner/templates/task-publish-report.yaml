{{- /*
publish-report — the report hand-off. A small kubectl step that reads
<workspace>/.gate-report.json and applies it as ConfigMap
gate-report-<run-id> in THIS namespace, where the Manager's poll picks it
up (and later deletes it with its own RBAC).

THE CONFIGMAP CARRIES EXACTLY ONE OF TWO KEYS, AND THE KEY IS THE
DISCRIMINATOR:

  report.json      the gate wrote a report. Handed over byte for byte.
  incomplete.json  the gate wrote none. A different and deliberately small
                   object: incompleteVersion, runId, reason, generatedAt.

A second KEY rather than a second shape under report.json, because the
report's contractVersion is a literal: the Manager refuses a report written
against any other version instead of reading it half-right, and it has to,
since the runner and the Manager are separate images and a pin set by hand
can pair a new Manager with an old runner. The absence of report.json is
not a malformed report, it is no report, so that version check never has to
be loosened to say the gate did not finish.

The small object may NOT be dressed up as a GateReport. A GateReport carries
a sandbox attestation and a reportHash, and this step observed neither the
fence nor a report: filling those two in would attest to a fence nobody
watched and hash a file that does not exist.

Runs as the pipeline's `finally` task under SA gate-report-writer (bound by
the Manager's PipelineRun taskRunSpecs — see pipeline.yaml): the ONLY pod
in the sandbox holding an API token, and that token can only write ConfigMaps
here (rbac.yaml). Its API-server egress comes from the additive
gate-report-writer-apiserver NetworkPolicy pinhole.
*/ -}}
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: publish-report
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: gate-runner
    app.kubernetes.io/component: task
spec:
  description: >-
    Publish <workspace>/.gate-report.json as ConfigMap gate-report-<run-id>
    under key report.json; publish key incomplete.json in the same ConfigMap
    instead when the gate wrote no report file.
  workspaces:
    - name: source
      description: The run workspace carrying .gate-report.json (if the gate wrote one).
  params:
    - name: run-id
      type: string
      description: Manager-issued run id — names the ConfigMap gate-report-<run-id>.
  steps:
    - name: publish
      image: {{ .Values.reportWriter.image }}
      env:
        # kubectl writes its discovery/http cache under $HOME — point it at
        # the writable emptyDir (rootfs is read-only).
        - name: HOME
          value: /tmp
      script: |
        #!/usr/bin/env sh
        set -eu

        REPORT="$(workspaces.source.path)/.gate-report.json"

        # The key IS the discriminator, so the branch that produces the payload
        # is also the branch that names the key. /tmp is the only writable path
        # in this step (read-only rootfs, emptyDir mounted below).
        if [ -s "$REPORT" ]; then
          KEY=report.json
          OUT="/tmp/$KEY"
          cp "$REPORT" "$OUT"
        else
          # All this step can observe is that REPORT_OUT is absent or empty
          # after the pipeline finished. WHY the gate task wrote nothing is
          # recorded only in the PipelineRun's TaskRun statuses, so the reason
          # points there instead of naming a cause this step never saw. One of
          # the ways the gate step never starts at all is a failed clone: gate
          # declares runAfter: [clone] (pipeline.yaml).
          KEY=incomplete.json
          OUT="/tmp/$KEY"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > "$OUT" <<EOF
        {
          "incompleteVersion": "1",
          "runId": "$(params.run-id)",
          "reason": "the gate task produced no report file at $(workspaces.source.path)/.gate-report.json, so this run has no verdict; why it produced none is recorded only in this PipelineRun's clone and gate TaskRun statuses, and gate runs after clone, so a failed clone means the gate step never started",
          "generatedAt": "${NOW}"
        }
        EOF
        fi

        # create-or-update (idempotent across ArgoCD/Tekton retries of this
        # finally task). The hostyour.cloud/gate-report label lets operators
        # GC orphaned reports in bulk; the Manager itself deletes by name.
        kubectl create configmap "gate-report-$(params.run-id)" \
          --from-file="$KEY=$OUT" \
          --namespace {{ .Release.Namespace }} \
          --dry-run=client -o yaml \
          | kubectl label --local -f - hostyour.cloud/gate-report=true -o yaml \
          | kubectl apply -f -
      securityContext:
        runAsNonRoot: true
        # Same uid as the gate step so the report file is readable here no
        # matter what mode the CLI created it with.
        runAsUser: {{ .Values.gate.runAsUser }}
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
        readOnlyRootFilesystem: true
      volumeMounts:
        - name: tmp
          mountPath: /tmp
      computeResources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
  volumes:
    - name: tmp
      emptyDir: {}
