# PROD pin of the gate-runner image — the ONE grammar the release bump
# searches (builds[]{name,image,tag}; `image` is the FLAT build name). The
# tag is written by the bump on a hostyour-manager release; edit it by hand
# only to roll back.
builds:
  - name: gate-runner
    image: gate-runner
    tag: "0.8.330-stable-20260929083014-0ade1fd"
