# service-provisioner — the dev stage's database host names. Everything else about
# this controller stands in values-common.yaml.
controller:
  mongo:
    host: mongodb-dev-headless.mongodb.svc.cluster.local
  redis:
    host: redis-dev.redis.svc.cluster.local
  # No postgres.host — postgresql is per-consumer, and the provisioner resolves
  # the host from the claim's own namespace.
