{{- /*
The controller's own namespace, carrying the two labels the backing services'
NetworkPolicies admit it through. ArgoCD's CreateNamespace=true also creates the
namespace, but rendering it here lets us attach the labels up front.

  db-consumer    — clusters/inventories/mongodb admits :27017 by this label (postgresql ships no
                   NetworkPolicy, so it is reachable without one).
  redis-consumer — clusters/inventories/redis admits :6379 by ITS OWN label and deliberately not
                   by db-consumer, so the controller has to carry both. Reaching
                   the port is what lets this controller write a claim's ACL user
                   (handle_redis); the `default` user's password still gates what
                   happens once the connection is open.
*/ -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  labels:
    # Same label the ApplicationSet's managedNamespaceMetadata stamps on every platform workload
    # namespace, written here for the reason the comment above gives: rendering the namespace in
    # this chart REPLACES what ArgoCD would have created, and with it that label. Without it Vault's
    # external-secrets role does not admit this namespace, the SecretStore in it reports "unable to
    # create client", and the ExternalSecret behind it never resolves - measured on a real machine,
    # where this is the one application left degraded. clusters/inventories/gate-runner
    # renders its own namespace too and carries the label for the same reason.
    hostyour.cloud/workload: "true"
    {{ .Values.global.consumerLabels.mongodb }}: "true"
    {{ .Values.global.consumerLabels.redis }}: "true"
