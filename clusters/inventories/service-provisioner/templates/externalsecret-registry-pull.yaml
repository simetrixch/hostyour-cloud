{{- if or .Values.registrySource.enabled .Values.global.servicesLocal.registry }}
{{- /*
Materialize the shared registry pull dockerconfigjson from Vault
<env>/app/registry into the service-provisioner namespace, so the `registry`
ServiceClaim backend can copy it into consumer namespaces. Gated on the build
cluster (global.servicesLocal.registry — the ONE cluster running clusters/inventories/registry),
so it follows the registry to any stage; registrySource.enabled is an extra
manual override. The vault-backend SecretStore comes from the secret-store
dependency (same gate). REQUIRES the service-provisioner namespace bound in the
external-secrets Vault role — otherwise the SecretStore stays
NotReady.
*/ -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-pull-source
  namespace: {{ .Release.Namespace }}
spec:
  # No periodic read of Vault — the platform-wide delivery rule, stated in full in
  # hostyour-cloud clusters/charts/external-secret/templates/externalsecret.yaml: a secret
  # arrives on DEPLOY (OnChange re-syncs when this CR changes) and on target-Secret
  # DELETION (OnChange creates it when absent), never on a timer. So putting a NEW
  # value in front of the pods is three acts: write it into Vault, delete the target
  # Secret so ESO fetches it, roll the pods (the restart-workloads run).
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: registry-pull-source
    creationPolicy: Owner
    # COMPOSED HERE, from the two values the store holds. Asking the store for a finished document
    # under `pull-dockerconfigjson` asks for a field nothing writes: the store deliberately holds no
    # pre-composed text, only the four values a registry account is made of. Every consumer of this
    # entry composes it itself — clusters/inventories/gate-runner composes exactly this — and one
    # that does not stands Ready False with "could not get secret data from provider", with the whole
    # application reading Degraded and no message anywhere naming a field.
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |-
          {"auths":{"{{ include "common.registryHost" . }}":{"username":"{{ `{{ .user }}` }}","password":"{{ `{{ .pass }}` }}","auth":"{{ `{{ printf "%s:%s" .user .pass | b64enc }}` }}"}}}
  data:
    - secretKey: user
      remoteRef:
        key: {{ printf "%s/app/registry" .Values.global.env }}
        property: pull-user
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: pass
      remoteRef:
        key: {{ printf "%s/app/registry" .Values.global.env }}
        property: pull-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
