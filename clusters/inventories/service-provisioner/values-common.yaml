# service-provisioner — env-agnostic defaults. Per-env values-{dev,test,prod}.yaml
# set the mongo + redis hosts (their env-suffixed Service DNS). global.env comes
# from clusters/platform/values-<env>.yaml, global.consumerLabels.{mongodb,redis}
# from clusters/platform/values-common.yaml. Each backend's
# admin credential is read at runtime from that backend's own Secret via the
# controller's cluster-wide secret-read RBAC — no ESO/Vault wiring here.
#
# THE SAME VALUES ON EVERY CLUSTER. app.yaml says runsOn: every-cluster, and a
# values file cannot see the cluster's role — clusters/inventories/deploy-state/values-common.yaml
# states that rule. clusters/inventories/mongodb/app.yaml and clusters/inventories/redis/app.yaml say
# runsOn: slave, and a master carries the slave part as well (hostyour-cloud#232), so the two hosts
# below name Services every cluster of the installation has got. A mongodb claim in a namespace
# carrying a mongodb-credentials Secret is resolved namespace-locally by templates/configmap.yaml,
# which never reads MONGO_HOST for it. postgresql is served with no host at all, resolved from the
# claim's own namespace, and registry from the pull secret that stands on every cluster.

controller:
  serviceAccountName: service-provisioner
  image:
    repository: python
    tag: "3.12-slim"
    pullPolicy: IfNotPresent
  pollIntervalSeconds: 15

  mongo:
    host: ""                              # per-env (mongodb-<env>-headless...)
    rootUser: root
    authSource: admin
    replicaSet: rs0
    credentialsNamespace: mongodb
    credentialsSecret: mongodb-credentials
    credentialsKey: root-password
    # Namespaces whose claims may use spec.roles (extra, whitelisted role@db
    # grants). PLATFORM-ONLY on purpose: every whitelisted role is cluster-wide
    # by nature — clusterMonitor@admin reads stats for EVERY database — so it
    # steps outside the per-claim `<namespace>_<claim>` prefix that is the whole
    # isolation guarantee. A consumer or tenant namespace must therefore never be
    # able to grant itself one, however harmless the role looks. Empty ⇒ nobody
    # may (fail-closed); today only mongodb, for its own exporter's claim.
    extraRolesNamespaces:
      - mongodb

  postgres:
    # PER-CONSUMER (per-consumer-postgres.md §5.4, §6): no `host` and no
    # `credentialsNamespace`. provisioner.py resolves the host (Service `postgres`
    # in the claim's own namespace) and the admin Secret (postgresql-credentials in
    # that same namespace) from the claim itself — there is no shared instance to
    # point at. Only the namespace-independent knobs remain.
    port: "5432"
    adminUser: postgres
    credentialsSecret: postgresql-credentials
    credentialsKey: postgres-password

  redis:
    # ONE instance per cluster that runs clusters/inventories/redis, so unlike postgresql there IS
    # a shared instance to point at and the host is a per-env value
    # (values-{dev,test,prod}).
    # The admin credential is the `default` user's password — the same value
    # clusters/inventories/redis boots the server with as `--requirepass`, materialized by that
    # chart's ExternalSecret from Vault <env>/app/redis into the Secret below, and
    # read here through the controller's cluster-wide secret-read RBAC.
    host: ""                              # per-env (redis-<env>.redis.svc...)
    port: "6379"
    adminUser: default
    credentialsNamespace: redis
    credentialsSecret: redis-credentials
    credentialsKey: redis-password

  registry:
    # The `registry` ServiceClaim backend copies the pull dockerconfigjson (Vault
    # <env>/app/registry) from this source Secret into consumer namespaces. The
    # Secret stands on EVERY cluster — templates/externalsecret-registry-pull.yaml
    # materialises it wherever this chart runs — because a consumer deploys on a
    # slave and pulls from the build cluster's registry across clusters. handle_registry
    # in templates/configmap.yaml raises "registry source secret not configured" when
    # the two keys below are empty and "registry pull dockerconfigjson not available
    # yet" while the Secret they name is absent or holds no sourceKey — the state a
    # claim reports until ESO has delivered it.
    sourceNamespace: service-provisioner
    sourceSecret: registry-pull-source
    sourceKey: .dockerconfigjson

# Per-namespace SecretStore for the registry-pull ESO source (external-secrets
# app-tier role; vaultUrl from global), on every cluster like the source itself.
secret-store: {}
