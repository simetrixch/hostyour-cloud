# TEST pins of the manager app's images — the ONE grammar the release bump
# searches (builds[]{name,image,tag}; `image` is the FLAT build name). The
# tag is written by the bump on a release; edit it by hand only to roll back.
# The manager entry also carries `plugins`, the PLUGINS of that image. No
# release writes it: the change that alters hostyour-manager's compiledPlugins
# changes it here by hand, and so does a rollback, because the image refuses a
# PLUGINS naming a plugin it does not carry, and a setting of a plugin PLUGINS
# leaves out (hostyour-manager server/boot/plugin-set.ts, activatePlugins).
builds:
  - name: manager
    image: manager
    tag: "0.8.511-stable-20261016134726-be22144"
    plugins: "unit"
  # The dbtools job image (hostyour-manager/docker/dbtools.Dockerfile): the
  # Deployment projects it as DBTOOLS_IMAGE and the manager runs every
  # move/backup/restore Job on it. It builds in hostyour-manager because that
  # is where its caller lives, so a hostyour-manager release bumps this pin.
  - name: dbtools
    image: dbtools
    tag: "0.8.511-stable-20261016134726-be22144"
