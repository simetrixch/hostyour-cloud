# DEV pins of the manager app's images — the ONE grammar the release bump
# searches (builds[]{name,image,tag}; `image` is the FLAT build name). The
# tag is written by the bump on a release; edit it by hand only to roll back.
builds:
  - name: manager
    image: manager
    tag: "0.6.20-beta-20260829174459-5453ddc"
  # The dbtools job image (hostyour-manager/docker/dbtools.Dockerfile): the
  # Deployment projects it as DBTOOLS_IMAGE and the manager runs every
  # move/backup/restore Job on it. It builds in hostyour-manager because that
  # is where its caller lives, so a hostyour-manager release bumps this pin.
  - name: dbtools
    image: dbtools
    tag: "0.6.20-beta-20260829174459-5453ddc"
