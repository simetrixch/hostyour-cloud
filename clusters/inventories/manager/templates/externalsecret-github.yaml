{{- if and .Values.master.sshUser .Values.github.repo }}
# The manager's GitHub write PAT (Branches view + Reset wizard). Carries the
# write-capable GITOPS_REPO_PAT, placed on the isolated manager-host surface
# (secretstore-manager-host.yaml, the same surface as the SSH self-key) so the
# manager-host-eso SA can read it via the manager-host
# Vault policy (wildcard on secret/<env>/manager-host/*) — the manager cannot reach
# the system tier where ArgoCD's copy of the same token lives. It is seeded with the
# cluster at <env>/manager-host/github, property `write-pat`. The pod reads it
# as env GITHUB_WRITE_PAT. (GITOPS_REPO_PAT also reaches a slave when that slave
# is added; since it is write-capable, a GitHub ruleset must protect `master`
# — see secrets.example.)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: manager-github
spec:
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: vault-backend-manager
    kind: SecretStore
  target:
    name: manager-github
    creationPolicy: Owner
  data:
    - secretKey: write-pat
      remoteRef:
        key: {{ printf "%s/manager-host/github" .Values.global.env }}
        property: write-pat
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
