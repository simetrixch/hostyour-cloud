# The Zone Settings Edit Cloudflare token from secret/<stage>/app/cloudflare-zone-settings — the
# manager turns Email Obfuscation off on the zone of every proxied record it writes with it.
# A token of its own beside the DNS-only one (externalsecret-cloudflare-dns.yaml): it can change
# every setting of every zone of the account, and only the manager Deployment reads it, so no
# inventory of cert-manager or the mail publishers holds it. Its OWN ExternalSecret, like the
# DNS token: a read failure here must never fail the sync of the manager's core auth secrets or
# of the DNS token. All four defaulted remoteRef fields are emitted explicitly (ESO 2.x
# defaults them).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: manager-cloudflare-zone-settings
spec:
  # No periodic read of Vault — the platform-wide delivery rule, stated in full in
  # externalsecret-cloudflare-dns.yaml: a secret arrives on DEPLOY and on target-Secret DELETION,
  # never on a timer.
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: manager-cloudflare-zone-settings
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: {{ printf "%s/app/cloudflare-zone-settings" .Values.global.env }}
        property: api-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
