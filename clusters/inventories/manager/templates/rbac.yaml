# Narrow local RBAC: read ConfigMaps in the manager's OWN namespace (mirrors
# the old console's in-chart Role).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: manager-configmap-reader
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: manager-configmap-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: manager-configmap-reader
subjects:
  - kind: ServiceAccount
    name: manager
{{- /*
manager ONBOARDING RBAC — shipped WITH the workload (Model A), exactly like
clusters/inventories/service-provisioner/templates/rbac.yaml, instead of the satellite RBAC app
that used to carry these grants under a privileged AppProject. Emitted through
the clusters/charts/rbac library helper `rbac.grants` (one building block, RBAC with the
workload). Bound to THIS chart's own ServiceAccount `manager`
(serviceaccount.yaml) — not recreated here. These are the exact in-cluster kube
surface of the manager's onboarding adapters; byte-equivalent to the
dissolved satellite app (same verbs/resources/apiGroups/namespaces/
resourceNames — only relocated):

  * manager-gate-dispatch (Role, ns gate-runner) — TektonGateRunner: create/
    delete the per-run `gate-cred-<runid>` Secret; create/get/delete the
    `gate-run` PipelineRun; get/delete the `gate-report-<runid>` ConfigMap; and
    LIST PipelineRuns, which is the one thing here not addressed by name.
    The sweep that collects orphans has to enumerate what is there before it can
    say what is left over — hostyour-manager
    server/adapters/gate-runner/gate-runner-tekton.ts:154 listPipelineRunNames,
    called from reapOrphans at :259. Without the verb that sweep fails on every
    pass, and what it leaves standing is the per-run credential Secrets it exists
    to remove. Measured on apps3, 2026-08-26, before the verb was granted:

      pipelineruns.tekton.dev is forbidden: User
      "system:serviceaccount:manager:manager" cannot list resource "pipelineruns"
      in API group "tekton.dev" in the namespace "gate-runner"

    logged as "gate-runner: orphan sweep failed — leftover gate-run objects
    (including credential Secrets) may still stand", and `kubectl auth can-i` for
    that account answered get yes, create yes, delete yes, list NO, watch NO. The
    comment here said "No list/watch anywhere (every object addressed by name)",
    which the adapter had stopped being true of.

    TASKRUNS ARE LISTED FOR THE SAME KIND OF REASON, and it is the more important
    one. When a gate-run produces no report, the ONLY place the cause exists is the
    TaskRun statuses of that PipelineRun, and the adapter reads them before it reaps
    (hostyour-manager gate-runner-tekton.ts:370 states it, and the call is
    listNamespacedCustomObject over tekton.dev/taskruns at :182). Without the verb
    the operator is handed a raw 403 where the sentence saying why the gate died
    belongs. Measured on apps3 before it was granted:

      taskruns.tekton.dev is forbidden: User
      "system:serviceaccount:manager:manager" cannot list resource "taskruns" in
      API group "tekton.dev" in the namespace "gate-runner"

    Watch is granted on neither, and neither list reaches outside this namespace.
  * manager-argocd-onboarding (ClusterRole) — get,list Applications (deploy
    convergence); get,create,update,delete the manager-OWNED per-consumer AND
    per-tenant isolation AppProjects. NOT applicationsets/secrets. Cluster
    scope (was ns argocd) because a tenant's fan-out + operator Application live in
    the per-slave ArgoCD namespace (<slaveName>, e.g. s1), and slaves are added
    dynamically — the SAME "namespaces not known ahead of time" reason that makes
    manager-smoke-reader cluster-scoped. The AppProject writes stay guarded in
    code (assertWritableProjectName refuses reserved platform projects).
  * manager-deploy-state-reader (Role, ns kube-system) — get on the ONE named
    ConfigMap hostyour-deploy-state (attest-target), resourceNames-scoped.
  * manager-smoke-reader (ClusterRole) — read-only smoke over DYNAMIC consumer
    namespaces: get Namespaces; list Deployments/StatefulSets/DaemonSets and
    ExternalSecrets. Cluster scope because consumer namespaces are not known
    ahead of time; deliberately NO secret/configmap access, NO write verbs.
  * manager-namespace-reaper (ClusterRole) — delete Namespaces only, cluster
    scope (consumer namespaces are dynamic). The offboard's delete-namespace step
    reaps the empty consumer namespace after the prune (ArgoCD's CreateNamespace
    never deletes it). Kept SEPARATE from manager-smoke-reader so that role
    stays read-only; the read (`get`) it pairs with comes from smoke-reader.
  * manager-tenant-reaper (ClusterRole) — get,create,update,delete,patch on
    tenants.operator.hostyour.cloud, plus list on namespaces. The manager is the
    only writer of the CR: no chart renders it, so create-tenant provisions it
    and a purge deletes it. `patch` is the relocating annotation: the migrate
    run merge-patches it onto the CR BEFORE deleting the source CR, so the
    tenant operator releases the CR without running its deprovision — the one
    write that makes a CR delete mean "let go" instead of "destroy".
    The namespace list is how a purge finds every member
    of a tenant — they carry platform/tenant=<guid>, and a member added after
    the frozen inventory would otherwise survive its own tenant.
    The Tenant CR is CLUSTER-scoped and carries the
    operator's deprovision finalizer, so the namespace delete never reaches it;
    the tenant-purge teardown deletes it explicitly and then polls until it is
    gone (hostyour-manager kube.ts deleteTenantCr + readTenantCr). Cluster scope
    because the object is: a guid-named cluster-scoped CR has no namespace to
    bind a Role in. On a SLAVE the purge runs over the harvested cluster-admin
    bearer, which already covers this; on a cluster the manager reaches with
    its OWN pod ServiceAccount — the master, and a master+slave — nothing granted
    it operator.hostyour.cloud, so the delete would 403 mid-run.
  * manager-tenant-bootstrap-reader (ClusterRole) — get on Secrets, narrowed
    by resourceNames to the ONE name `hostyour-app-secrets`. The tenant first-admin
    invite reads AUTH_BOOTSTRAP_TOKEN out of that Secret in the tenant's own
    <guid> namespace to authenticate the one-shot bootstrap call to the tenant's
    identity provider. Cluster scope for the same reason as manager-smoke-reader
    (tenant namespaces are guids, not known ahead of time); the resourceNames
    narrowing is what keeps a cluster-wide secrets grant from being a blanket
    one — no other Secret on the cluster is readable through it.
  * manager-relocation-jobs (ClusterRole) — the job carrier of move/backup/
    restore (hostyour-manager kube-job.ts behind ClusterReader.runJob): every
    dump, restore, listing and clear runs as a batch/v1 Job of the pinned
    dbtools image, in the namespace whose Secrets it needs. create/get/delete
    on jobs is the Job lifecycle (replace a leftover of the same name, create,
    poll to completion — the poll is a `get`, never a watch); list on pods
    finds the Job's pod by its job-name label, and get on pods/log collects
    its output — the channel a listing job answers through; list on
    persistentvolumeclaims is how the consumer dump learns which PVCs of the
    unit's namespace to tar (PVC names are chart-chosen, only the cluster can
    answer). Cluster scope because the jobs run where their credentials are —
    the mongodb namespace, a consumer's own namespace, a tenant member's —
    none known ahead of time. create and delete on secrets, and deliberately
    NOT get: the Storage Box credentials the job needs exist nowhere in the
    unit's namespace, so the manager places a Secret named after the job
    before it starts and reaps it in the same call that waited for it. It is
    named after the JOB and not the unit because the mongodb namespace hosts
    every unit's jobs and a shared name would let one unit's reap kill
    another's starting pod. Writing without reading is what keeps this from
    being a way to read the unit's own Secrets; the database credentials still
    ride the Job spec as secretKeyRef and are resolved by kubelet.
  * manager-workload-restarter (ClusterRole) — patch on deployments and
    statefulsets, cluster scope (unit namespaces are dynamic, the same reason
    manager-smoke-reader has it). It is the last of the three acts that put a
    NEW secret value in front of a unit — write it into Vault, delete the target
    Secret so ESO fetches it, roll the pods: a unit reads its secrets as env
    vars, which are materialised once at container start, so a value already
    sitting in the Secret reaches a RUNNING pod only when something rolls it. The patch stamps the pod
    TEMPLATE's annotations, which is what `kubectl rollout restart` does and
    what makes the workload replace its pods within its own surge budget.
    DaemonSets are deliberately NOT in the rule although smoke-reader lists
    them: a unit runs none, and the ones on the cluster belong to the base
    layer, which this grant must never be able to roll. Kept SEPARATE from
    manager-smoke-reader so that role stays read-only; the list it pairs
    with comes from there.
  * manager-relocation-marker (ClusterRole) — patch on namespaces, cluster scope
    (unit namespaces are dynamic). The move's repoint annotates every SOURCE
    namespace of the unit platform.hostyour.cloud/relocating before it commits the
    new cluster. That annotation is what stops the service-provisioner from dropping
    the unit's databases when the repoint prunes the source Application and its
    ServiceClaims fall with it (clusters/inventories/service-provisioner/templates/configmap.yaml).
    It is the consumer's equivalent of the Tenant CR's relocating annotation above —
    a consumer has no CR, and the namespace is the object the cascade cannot take
    away. Kept SEPARATE from manager-namespace-reaper so that one stays
    delete-only; the read it pairs with comes from manager-smoke-reader.

Build-plane-only, like the whole manager app: renders wherever the app
deploys (clusters/inventories/manager/app.yaml says runsOn: master, and the app generator in
clusters/argocd/apps/platform-apps-appset.yaml admits every-cluster and the role stamped over
__CLUSTER_ROLE__ and nothing else) — no separate toggle, exactly like
serviceaccount.yaml / deployment.yaml.
*/ -}}
{{- include "rbac.grants" (dict
    "root" $
    "subject" (dict "name" "manager" "namespace" "manager")
    "grants" (list
      (dict "name" "manager-gate-dispatch" "namespace" "gate-runner" "rules" (list
        (dict "apiGroups" (list "") "resources" (list "secrets") "verbs" (list "create" "delete"))
        (dict "apiGroups" (list "tekton.dev") "resources" (list "pipelineruns") "verbs" (list "create" "get" "list" "delete"))
        (dict "apiGroups" (list "tekton.dev") "resources" (list "taskruns") "verbs" (list "list"))
        (dict "apiGroups" (list "") "resources" (list "configmaps") "verbs" (list "get" "delete"))
      ))
      (dict "name" "manager-argocd-onboarding" "rules" (list
        (dict "apiGroups" (list "argoproj.io") "resources" (list "applications") "verbs" (list "get" "list"))
        (dict "apiGroups" (list "argoproj.io") "resources" (list "appprojects") "verbs" (list "get" "create" "update" "delete"))
      ))
      (dict "name" "manager-deploy-state-reader" "namespace" "kube-system" "rules" (list
        (dict "apiGroups" (list "") "resources" (list "configmaps") "resourceNames" (list "hostyour-deploy-state") "verbs" (list "get"))
      ))
      (dict "name" "manager-smoke-reader" "rules" (list
        (dict "apiGroups" (list "") "resources" (list "namespaces") "verbs" (list "get"))
        (dict "apiGroups" (list "apps") "resources" (list "deployments" "statefulsets" "daemonsets") "verbs" (list "list"))
        (dict "apiGroups" (list "external-secrets.io") "resources" (list "externalsecrets") "verbs" (list "list"))
      ))
      (dict "name" "manager-namespace-reaper" "rules" (list
        (dict "apiGroups" (list "") "resources" (list "namespaces") "verbs" (list "delete"))
      ))
      (dict "name" "manager-tenant-reaper" "rules" (list
        (dict "apiGroups" (list "operator.hostyour.cloud") "resources" (list "tenants") "verbs" (list "get" "create" "update" "delete" "patch"))
        (dict "apiGroups" (list "") "resources" (list "namespaces") "verbs" (list "list"))
      ))
      (dict "name" "manager-tenant-bootstrap-reader" "rules" (list
        (dict "apiGroups" (list "") "resources" (list "secrets") "resourceNames" (list "hostyour-app-secrets") "verbs" (list "get"))
      ))
      (dict "name" "manager-relocation-jobs" "rules" (list
        (dict "apiGroups" (list "batch") "resources" (list "jobs") "verbs" (list "create" "get" "delete"))
        (dict "apiGroups" (list "") "resources" (list "pods") "verbs" (list "list"))
        (dict "apiGroups" (list "") "resources" (list "pods/log") "verbs" (list "get"))
        (dict "apiGroups" (list "") "resources" (list "persistentvolumeclaims") "verbs" (list "list"))
        (dict "apiGroups" (list "") "resources" (list "secrets") "verbs" (list "create" "delete"))
      ))
      (dict "name" "manager-workload-restarter" "rules" (list
        (dict "apiGroups" (list "apps") "resources" (list "deployments" "statefulsets") "verbs" (list "patch"))
      ))
      (dict "name" "manager-relocation-marker" "rules" (list
        (dict "apiGroups" (list "") "resources" (list "namespaces") "verbs" (list "patch"))
      ))
    )) }}
