# The key Forgejo signs its deliveries with, for the hooks the Manager sets on a unit's repository on the
# installation's Forgejo (the setup-webhook onboard step, the move to another forge). It MUST equal the
# value the Forgejo Triggers of the image-builder validate, so it is read from the Vault entry they read,
# secret/<stage>/app/forgejo-webhook property `forgejo-webhook-secret`, and not from a copy of its own.
#
# An ExternalSecret of its own, apart from manager-webhook, for the reason the Triggers' has: the entry is
# minted by deploy-platform-services, after the release that brings this chart reaches the cluster.
# deletionPolicy Delete makes a missing entry no error: the ExternalSecret stays Ready with no Secret, the
# Deployment reads it with optional:true, and the Manager's setup-webhook step on a Forgejo repository
# fails LOUD naming FORGEJO_WEBHOOK_SECRET. A property missing from manager-webhook's entry, which exists,
# would instead fail that ExternalSecret.
#
# Rendered under the same gate as the setup-webhook step: consumer onboarding on.
{{- if .Values.onboarding.gatemanagerAddr }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: manager-forgejo-webhook
spec:
  # No periodic read of Vault — the platform-wide delivery rule, stated in full in
  # hostyour-cloud clusters/charts/external-secret/templates/externalsecret.yaml.
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: manager-forgejo-webhook
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: forgejo-webhook-secret
      remoteRef:
        key: {{ printf "%s/app/forgejo-webhook" .Values.global.env }}
        property: forgejo-webhook-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
