# The GitHub webhook HMAC secret in its OWN ExternalSecret, isolated from the
# manager's core auth secrets (externalsecret-app.yaml) so a build-tier read
# failure can only affect this (optional) webhook secret, never OIDC / session.
#
# The setup-webhook onboard step sets THIS HMAC on every consumer repo's GitHub
# webhook (which points at build.<domain>/github, the Tekton EventListener). It
# MUST equal the value the EventListener validates, so it is read from the
# EventListener's own source — secret/<stage>/app/image-builder property
# `github-webhook-secret` (also materialized build-side into the
# image-builder-webhook-secrets Secret key `github`) — not a manager-private
# copy that could drift. The manager's app-tier SecretStore (vault-backend,
# role `external-secrets`) is granted read on secret/<stage>/app/*
# when the cluster is seeded, so no dedicated tier or duplicated value is needed.
#
# Rendered only with consumer onboarding on (onboarding.gatemanagerAddr set on
# the control-host install branch) — the same gate as the setup-webhook step. The
# Deployment consumes it with optional:true, so a missing/unsynced value never
# blocks manager boot; the onboard step fails LOUD instead.
{{- if .Values.onboarding.gatemanagerAddr }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: manager-webhook
spec:
  # No periodic read of Vault — the platform-wide delivery rule, stated in full in
  # hostyour-cloud clusters/charts/external-secret/templates/externalsecret.yaml: a secret
  # arrives on DEPLOY (OnChange re-syncs when this CR changes) and on target-Secret
  # DELETION (OnChange creates it when absent), never on a timer. So putting a NEW
  # value in front of the pods is three acts: write it into Vault, delete the target
  # Secret so ESO fetches it, roll the pods (the restart-workloads run).
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: manager-webhook
    creationPolicy: Owner
  data:
    - secretKey: github-webhook-secret
      remoteRef:
        key: {{ printf "%s/app/image-builder" .Values.global.env }}
        property: github-webhook-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
