{{- if .Values.master.sshUser }}
{{- /*
Dedicated, tightly-scoped Vault surface for the manager's own control-host
credentials — the master SSH-to-self key and the GitHub write PAT.

The manager's deploy-slave Run SSHes to the MASTER (this control host); the
private key is root on the master → all clusters, so it must NOT live under the broad
app/* tier that external-secrets-sa in EVERY app namespace can read. Instead it
gets its own isolated surface, all scoped to the `manager` namespace:

  * Vault path   secret/<env>/manager-host/*     (ssh + github)
  * Vault policy manager-host                     (read ONLY that path)
  * Vault role   manager-host                     (bound to SA manager-host-eso
                                                       in ns manager ONLY)
      — both created when the cluster is seeded, and the key itself is
        written into that path with a clean `kv put`.
  * SA           manager-host-eso                 (dedicated; NOT external-secrets-sa)
  * SecretStore  vault-backend-manager            (authenticates with that role)
  * the two ExternalSecrets that read through this store, each in its own file:
    templates/externalsecret-master-key.yaml and templates/externalsecret-github.yaml

Rendered where the manager is the control host (master.sshUser set). Onboarding
kube access is NOT part of this surface: the manager talks to its own
cluster in-cluster via the pod ServiceAccount (grants shipped with this chart,
templates/rbac.yaml),
so no kubeconfig lives in Vault. The mount path / KV mount match the app
SecretStore: `secret` KV-v2, the cluster's own auth mount kubernetes-<name>
(global.vaultKubernetesAuthPath, clusters/active/<fqdn>.yaml), Vault ns `vault`.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: manager-host-eso
  namespace: {{ .Release.Namespace }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend-manager
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    vault:
      server: {{ required "global.endpoints.vault.url must be set (clusters/active/<fqdn>.yaml via the $values chain)" .Values.global.endpoints.vault.url | quote }}
      path: "secret"
      version: "v2"
      namespace: "vault"
      auth:
        kubernetes:
          mountPath: {{ required "global.vaultKubernetesAuthPath must be set (clusters/active/<fqdn>.yaml via the $values chain)" .Values.global.vaultKubernetesAuthPath | quote }}
          role: "manager-host"
          serviceAccountRef:
            # Local, DEDICATED SA — the namespaced SecretStore cannot cross namespaces,
            # and this SA (unlike external-secrets-sa) is bound ONLY to the tight
            # manager-host role, so nothing else can read the key path.
            name: "manager-host-eso"
{{- end }}
