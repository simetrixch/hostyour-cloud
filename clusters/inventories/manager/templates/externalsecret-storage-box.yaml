# The Hetzner Storage Box credential from secret/<stage>/app/storage-box — the
# one remote filesystem the manager moves, backs up and restores units over.
# Its OWN ExternalSecret, like the webhook secret: a read failure here must
# never fail the sync of the manager's core auth secrets (OIDC / session).
# All four defaulted remoteRef fields are emitted explicitly (ESO 2.x defaults
# them).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: manager-storage-box
spec:
  # No periodic read of Vault — the platform-wide delivery rule, stated in full in
  # hostyour-cloud clusters/charts/external-secret/templates/externalsecret.yaml: a secret
  # arrives on DEPLOY (OnChange re-syncs when this CR changes) and on target-Secret
  # DELETION (OnChange creates it when absent), never on a timer. So putting a NEW
  # value in front of the pods is three acts: write it into Vault, delete the target
  # Secret so ESO fetches it, roll the pods (the restart-workloads run).
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: manager-storage-box
    creationPolicy: Owner
  data:
    - secretKey: host
      remoteRef:
        key: {{ printf "%s/app/storage-box" .Values.global.env }}
        property: host
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: user
      remoteRef:
        key: {{ printf "%s/app/storage-box" .Values.global.env }}
        property: user
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: password
      remoteRef:
        key: {{ printf "%s/app/storage-box" .Values.global.env }}
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
