# The object storage credential from secret/<stage>/app/cloudflare-r2 — a MANAGING
# token, the account it manages and the jurisdiction it manages there. The
# manager makes each tenant's bucket with it and mints a key scoped to that one
# bucket, so no tenant ever holds this token and no tenant's key reaches another
# tenant's objects.
#
# THREE FIELDS AND ONE ENTRY, like the storage box: a token without the account it
# signs for addresses nothing, and a materialization failure has to fail the whole
# credential rather than half of one. Its OWN ExternalSecret, beside the DNS token
# rather than in it — two different products, two different permissions, and a read
# failure here must never fail the sync of the manager's core auth secrets
# (OIDC / session). All four defaulted remoteRef fields are emitted explicitly
# (ESO 2.x defaults them).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: manager-cloudflare-r2
spec:
  # No periodic read of Vault — the platform-wide delivery rule, stated in full in
  # hostyour-cloud clusters/charts/external-secret/templates/externalsecret.yaml: a secret
  # arrives on DEPLOY (OnChange re-syncs when this CR changes) and on target-Secret
  # DELETION (OnChange creates it when absent), never on a timer. So putting a NEW
  # value in front of the pods is three acts: write it into Vault, delete the target
  # Secret so ESO fetches it, roll the pods (the restart-workloads run).
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: manager-cloudflare-r2
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: {{ printf "%s/app/cloudflare-r2" .Values.global.env }}
        property: api-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: account-id
      remoteRef:
        key: {{ printf "%s/app/cloudflare-r2" .Values.global.env }}
        property: account-id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: jurisdiction
      remoteRef:
        key: {{ printf "%s/app/cloudflare-r2" .Values.global.env }}
        property: jurisdiction
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
