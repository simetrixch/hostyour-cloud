{{- if .Values.master.sshUser }}
# The master SSH-to-self key, read through the isolated manager-host surface
# (secretstore-manager-host.yaml) rather than the broad app tier: the manager's
# deploy-slave Run SSHes to the MASTER with it, and that key is root on the
# master → all clusters.
#
# boot/seed-master.ts reads the mounted private key + the host-key-fp env once and
# seals/pins them; it degrades gracefully if the Secret is briefly absent (the pod
# still starts — this surface is independent of the manager's core boot secret).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: manager-master-key
spec:
  # No periodic read of Vault — the platform-wide delivery rule, stated in full in
  # hostyour-cloud clusters/charts/external-secret/templates/externalsecret.yaml: a secret
  # arrives on DEPLOY (OnChange re-syncs when this CR changes) and on target-Secret
  # DELETION (OnChange creates it when absent), never on a timer. So putting a NEW
  # value in front of the pods is three acts: write it into Vault, delete the target
  # Secret so ESO fetches it, roll the pods (the restart-workloads run).
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: vault-backend-manager
    kind: SecretStore
  target:
    name: manager-master-key
    creationPolicy: Owner
  data:
    - secretKey: ssh-private-key
      remoteRef:
        key: {{ printf "%s/manager-host/ssh" .Values.global.env }}
        property: ssh-private-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: host-key-fp
      remoteRef:
        key: {{ printf "%s/manager-host/ssh" .Values.global.env }}
        property: host-key-fp
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
