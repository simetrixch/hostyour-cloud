{{- if gt (int .Values.replicas) 1 }}
{{- fail "manager must run exactly 1 replica: DATA_DIR is a single-writer SQLite DB on a ReadWriteOnce PVC (a 2nd pod would corrupt or fail to open it)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: manager
  labels:
    app.kubernetes.io/name: manager
spec:
  revisionHistoryLimit: 3
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: manager
  # Single-writer SQLite on an RWO PVC — never run old+new pod concurrently.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: manager
    spec:
      {{- if .Values.hostNetwork }}
      # Run in the node's network namespace so the manager can SSH to the
      # clusters on the physical LAN. The MicroK8s pod CIDR (10.1.0.0/16) can
      # OVERLAP a cluster LAN (e.g. 10.1.1.0/24): from a pod, a slave IP looks
      # like a pod IP, so Calico swallows the traffic into the overlay and it
      # never reaches the LAN. On the host network the pod uses the node's
      # routing table (the LAN /24 is a more-specific, directly-connected
      # route), exactly like `ssh` from the host. ClusterFirstWithHostNet keeps
      # CoreDNS (Vault/zot rewrites + cluster services) — the credential store's
      # Vault backend depends on it.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      serviceAccountName: manager
      # The SA token is NOT auto-mounted; it is projected ONLY into the app
      # container below. The manager presents exactly this token to Vault's
      # kubernetes auth (config.ts VAULT_SA_TOKEN_PATH defaults to the standard
      # /var/run/secrets/kubernetes.io/serviceaccount/token path).
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        # The process's PRIMARY group, and with it the group of every inode it
        # creates under /data. The one that matters is $DATA_DIR/admin.sock: a
        # caller that is not a browser takes an operator session off that socket
        # (hostyour-manager server/domains/access/emergency.ts), connect(2) on it
        # needs the write bit, and ADMIN_SOCKET_MODE below opens that bit to the
        # GROUP. Without runAsGroup the primary gid is whatever the runtime
        # derives from the image and the uid override, so the socket lands in a
        # group no host account can be put in and the group bit grants nobody.
        # fsGroup does NOT do this job: it lands on the volume, and a
        # hostPath-backed volume (microk8s-hostpath) is left alone by the kubelet.
        runAsGroup: 65532
        # Make the PVC group-writable for the non-root uid, where the storage class
        # manages ownership (microk8s-hostpath dirs are world-writable anyway, so
        # this is belt-and-braces there). It is also added to the process's
        # supplementary groups, which happens on every storage class.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: manager-registry-pull
      containers:
        - name: manager
          image: {{ include "common.buildImage" (dict "root" $ "builds" .Values.builds "name" "manager") | quote }}
          imagePullPolicy: Always
          ports:
            - containerPort: 8484
          env:
            - name: PORT
              value: "8484"
            # The running version the UI footer + /healthz report: explicitly the
            # deployed image tag (the builds[] pin = the single GitOps source of
            # truth), never typed twice. Required by the app (config.ts) — no
            # silent default, so a forgotten value fails the pod at boot.
            - name: MANAGER_VERSION
              value: {{ include "common.buildTag" (dict "root" $ "builds" .Values.builds "name" "manager") | quote }}
            - name: PUBLIC_URL
              value: {{ printf "https://manager.%s" .Values.global.domain | quote }}
            - name: OIDC_ISSUER
              value: {{ printf "https://idp.%s/application/o/manager/" .Values.global.domain | quote }}
            - name: OIDC_CLIENT_ID
              value: "manager"
            - name: ADMINS_GROUP
              value: {{ .Values.adminsGroup | quote }}
            - name: DATA_DIR
              value: /data
            # The permission bits the manager puts on $DATA_DIR/admin.sock
            # (config.ts ADMIN_SOCKET_MODE). That socket mints an operator session
            # with NO password, and connect(2) on a unix socket needs only the write
            # bit — so this value is the whole boundary in front of it, and it is
            # stated here rather than left to the code, because who has to reach the
            # socket is a fact of the machine and not of the product. 0770 admits the
            # pod's own uid 65532 and the gid 65532 above; an account on the host is
            # inside it only once somebody puts that account in that gid.
            - name: ADMIN_SOCKET_MODE
              value: {{ .Values.adminSocket.mode | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            # Vault secrets backend (config.ts: VAULT_ADDR set => credential
            # VALUES live in Vault KV; auth = kubernetes-auth with the projected
            # SA token above). VAULT_KV_MOUNT/PREFIX keep their config.ts
            # defaults (secret / manager/cred); the auth mount is this
            # cluster's own kubernetes-<name> (clusters/active/<fqdn>.yaml) — an
            # unnamed `kubernetes` mount does not exist.
            - name: VAULT_ADDR
              value: {{ .Values.global.endpoints.vault.url | quote }}
            - name: VAULT_K8S_ROLE
              value: "manager"
            - name: VAULT_K8S_AUTH_MOUNT
              value: {{ required "global.vaultKubernetesAuthPath must be set (clusters/active/<fqdn>.yaml via the $values chain)" .Values.global.vaultKubernetesAuthPath | quote }}
            {{- if .Values.master.sshUser }}
            # Master self-registration (server config.ts + boot/seed-master.ts):
            # on the control host, seed the one role=master server row (this host)
            # + seal its self-SSH key so deploy-slave finds a master on a fresh DB
            # with zero manual SQL. Rendered only where master.sshUser is set (the
            # control-host install branch). MASTER_FQDN == this cluster's domain ==
            # the master's install branch (masterFqdnOf reads it as the host).
            - name: MASTER_FQDN
              value: {{ .Values.global.domain | quote }}
            - name: MASTER_SSH_USER
              value: {{ .Values.master.sshUser | quote }}
            - name: MASTER_SSH_PORT
              value: {{ .Values.master.sshPort | default 22 | quote }}
            {{- if .Values.master.lanHost }}
            - name: MASTER_LAN_HOST
              value: {{ .Values.master.lanHost | quote }}
            {{- end }}
            # The master is ALSO a cluster in the manager's inventory (seed-master.ts seeds a
            # clusters row for this control host, slaveId=NULL). MASTER_STAGE is that self-cluster's
            # stage — the deployed environment, which IS global.env (dev|test|prod). MASTER_TIER is
            # its promotion tier; it defaults to "rehearsal" because the crypto gate O-GATE-1 refuses
            # onboarding to a non-rehearsal cluster under a plaintext keystore.
            - name: MASTER_STAGE
              value: {{ .Values.global.env | quote }}
            - name: MASTER_TIER
              value: {{ .Values.master.tier | default "rehearsal" | quote }}
            # The ESO-materialized private key (manager-master-key Secret, from the
            # dedicated vault-backend-manager SecretStore) mounted below; seed-master.ts
            # reads it at boot and re-reads it during the bounded background reconcile,
            # then seals it.
            - name: MASTER_SSH_KEY_FILE
              value: /etc/manager/master-key/ssh-private-key
            # The master sshd host-key fingerprint (SHA256:…), from the SAME dedicated
            # Secret. optional: absent until the install's key step ran ⇒ env unset.
            # Authenticates the SSH-to-self (getSsh pins preflightJson.hostKey), so it
            # is not MITM-able. STATIC fallback only — an env var is fixed at container
            # start; the FILE below is the fresh source.
            - name: MASTER_SSH_HOST_KEY_FP
              valueFrom:
                secretKeyRef:
                  name: manager-master-key
                  key: host-key-fp
                  optional: true
            # The SAME fingerprint as a FILE. The whole manager-master-key Secret is
            # mounted at /etc/manager/master-key (no items filter), so host-key-fp is
            # already a file there. Unlike the env above, kubelet REFRESHES secret-volume
            # files in a RUNNING pod, so seed-master's bounded background reconcile picks
            # up a late-materialized secret (the fresh-install ESO/Vault-role race) and
            # pins + seals WITHOUT a pod restart.
            - name: MASTER_SSH_HOST_KEY_FP_FILE
              value: /etc/manager/master-key/host-key-fp
            {{- if .Values.github.repo }}
            # Branches view + Reset wizard (config.ts GITHUB_REPO + GITHUB_WRITE_PAT,
            # both-or-neither). GITHUB_REPO is the "owner/repo" of this monorepo (public,
            # a plain value). GITHUB_WRITE_PAT carries the write-capable GITOPS_REPO_PAT,
            # placed on the isolated manager-host tier (manager-github ExternalSecret)
            # so the manager's own SA can read it — it cannot reach the system tier where
            # ArgoCD's copy lives. Rendered only on the control host (master.sshUser) with
            # repo set; a blank repo leaves both unset and the routes answer 501.
            - name: GITHUB_REPO
              value: {{ .Values.github.repo | quote }}
            - name: GITHUB_WRITE_PAT
              valueFrom:
                secretKeyRef:
                  name: manager-github
                  key: write-pat
            # CATALOG_WRITE_PAT — the tenant (multi-app) registry pushes tenant pointers to
            # the tenant catalog@master (config.ts default CATALOG_REPO). It REUSES the
            # same org GITOPS_REPO_PAT, which must therefore carry write scope for the catalog too; its
            # presence is the discriminator that registers the tenant Run family (config.ts). The
            # family's kube access rides the pod ServiceAccount in-cluster (grants shipped with this
            # chart: templates/rbac.yaml).
            - name: CATALOG_WRITE_PAT
              valueFrom:
                secretKeyRef:
                  name: manager-github
                  key: write-pat
            {{- end }}
            {{- end }}
            # How this manager reaches the ansiwise deployment engine on a machine
            # (config.ts ANSIWISE_DOWNLOAD_URL + ANSIWISE_SERVE_COMMAND, neither with a
            # default). UNCONDITIONAL, unlike the MASTER_* block above: those name one
            # machine and stand on an install branch, while these two are the same on
            # every installation this platform ships — the release surface and the
            # catalogue path are the manager's own code, not an operator's choice.
            #
            # The download address carries `<version>` and `<name>` as MARKERS. The
            # placement fills them in from the one pin (clusters/platform/versions.yaml
            # cliTools.ansiwise.version) and from the binary it is fetching, so the pin
            # and the file that lands on the machine cannot state different versions.
            # Nothing here may resolve them: a rendered version would be a second pin,
            # written by a chart that never reads the first.
            - name: ANSIWISE_DOWNLOAD_URL
              value: {{ .Values.ansiwise.downloadUrl | quote }}
            # The command that serves the machine's programs over the run's SSH session.
            # It names ansiwise-rest, which is where `serve` lives, and reads the
            # catalogue checkout the placement writes — both stated in values-common.yaml
            # beside the value, because both are facts of the machine rather than of this
            # rendering.
            - name: ANSIWISE_SERVE_COMMAND
              value: {{ .Values.ansiwise.serveCommand | quote }}
            {{- if .Values.onboarding.gatemanagerAddr }}
            # Consumer onboarding (config.ts, onboarding.md §6). Validation runs as an in-cluster
            # `gate-run` Tekton PipelineRun (NOT a host Quadlet). Set gatemanagerAddr ⇒ the onboarding
            # Run family registers its real adapters (git over GITHUB_*, kube IN-CLUSTER via the pod
            # ServiceAccount — grants in this chart's templates/rbac.yaml — and the Tekton gate-runner) and the
            # mutating consumer routes go live; unset ⇒ they answer 501. Deliberately NO KUBECONFIG_PATH
            # here: the Vault-kubeconfig design was retired; the env stays a dev/test file override only.
            # gatemanagerAddr is the manager's OWN host:port the fenced gate pod must PROVE it
            # cannot reach; the extra must-fail targets + the one must-pass egress + the kubeconform
            # version complete the CLI's fail-closed fence self-probe.
            #
            # THE VARIABLE'S NAME IS THE READER'S AND NOT THIS TREE'S. config.ts calls it
            # ONBOARD_GATE_MANAGER_ADDR, and it is the sole discriminator that registers the
            # onboarding Run family: a name this chart chose for itself is a value the process never
            # reads, and the routes then answer 501 while everything here says they are configured.
            # The three below it were never renamed and already agree; this one is the only name in
            # this Deployment that has to be spelled the way the process spells it.
            - name: ONBOARD_GATE_MANAGER_ADDR
              value: {{ .Values.onboarding.gatemanagerAddr | quote }}
            - name: ONBOARD_GATE_FENCE_MUST_FAIL
              value: {{ .Values.onboarding.gateFenceMustFail | quote }}
            - name: ONBOARD_GATE_MUST_PASS
              value: {{ .Values.onboarding.gateMustPass | quote }}
            - name: ONBOARD_KUBE_VERSION
              value: {{ .Values.onboarding.kubeVersion | quote }}
            # The setup-webhook onboard step sets this HMAC on each consumer repo's
            # GitHub webhook so the Tekton EventListener (build.<domain>/github)
            # accepts the delivery. Sourced from the manager-webhook Secret (its
            # OWN ExternalSecret, externalsecret-webhook.yaml), read from the SAME
            # Vault entry the EventListener validates (<stage>/app/image-builder,
            # property github-webhook-secret) — so signatures match by construction.
            # optional:true so a missing/unsynced secret never blocks manager
            # boot; the setup-webhook onboard step fails LOUD if the value is absent.
            # Renders under the same onboarding.gatemanagerAddr gate.
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: manager-webhook
                  key: github-webhook-secret
                  optional: true
            {{- end }}
            # The provision-dns onboard step writes one record per unit through the
            # Cloudflare API — <name>.<unitApex> for a consumer, a wildcard under the
            # subdomain for a tenant — and offboard removes it. Sourced from the
            # manager-cloudflare-dns Secret (externalsecret-cloudflare-dns.yaml),
            # a DNS-edit-only token. optional:true so a missing or unsynced secret
            # never blocks manager boot; provision-dns fails LOUD without it,
            # which is the right place to notice, because a unit whose address does
            # not resolve is not onboarded.
            - name: CLOUDFLARE_DNS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: manager-cloudflare-dns
                  key: api-token
                  optional: true
            # The pinned dbtools job image (config.ts DBTOOLS_IMAGE): the
            # manager puts this full ref into every move/backup/restore
            # jobSpec — the dumps, restores and listings run as in-cluster
            # Jobs of this image, because the databases are reachable there
            # and the manager carries no database clients. Composed from
            # the builds[] pin exactly like the manager image above; the
            # release bump writes the tag.
            - name: DBTOOLS_IMAGE
              value: {{ include "common.buildImage" (dict "root" $ "builds" .Values.builds "name" "dbtools") | quote }}
            # The Hetzner Storage Box staging area (config.ts STORAGE_BOX_*,
            # all three or none): every relocation dump lands on it and every
            # restore reads from it. Sourced from the manager-storage-box
            # Secret (externalsecret-storage-box.yaml). optional:true so a
            # missing or unsynced Secret never blocks manager boot; the
            # dump/restore steps fail LOUD without the config. The three keys
            # sync as one Secret, so they appear together — a partial set
            # (which config.ts refuses at boot) cannot arise from this source.
            - name: STORAGE_BOX_HOST
              valueFrom:
                secretKeyRef:
                  name: manager-storage-box
                  key: host
                  optional: true
            - name: STORAGE_BOX_USER
              valueFrom:
                secretKeyRef:
                  name: manager-storage-box
                  key: user
                  optional: true
            - name: STORAGE_BOX_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: manager-storage-box
                  key: password
                  optional: true
            # Node tooling needs a writable HOME; the root FS is read-only.
            - name: HOME
              value: /tmp
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: manager-app
                  key: oidc-client-secret
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8484
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8484
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: kube-api-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            # The manager-registry-pull dockerconfigjson (externalsecret-registry.yaml) as a
            # FILE: the tenant ensure-images build gate's registry probe (hostyour-manager
            # HttpRegistryProbe) parses its basic auth to GET /v2/<repo>/manifests/<tag> on zot —
            # the SAME pull credential the imagePullSecrets above reference. NEVER add subPath: a
            # plain directory mount refreshes in the running pod after an ESO resync.
            - name: registry-pull
              mountPath: /etc/manager/registry-pull
              readOnly: true
            {{- if .Values.master.sshUser }}
            # Master self-SSH key (ESO Secret manager-master-key). optional so a
            # briefly-absent key never blocks pod start (seed-master.ts degrades).
            # NEVER add subPath here: a subPath mount is frozen at container start and
            # would silently kill the restart-free reconcile (seed-master re-reads these
            # files in the running pod; only a plain directory mount refreshes).
            - name: master-key
              mountPath: /etc/manager/master-key
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        # Replicates the default SA-token mount, projected into the app only.
        - name: kube-api-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        # Persistent DATA_DIR — SQLite manager.db + credstore metadata.
        - name: data
          persistentVolumeClaim:
            claimName: manager-data
        - name: tmp
          emptyDir: {}
        # Pull creds for the ensure-images registry probe (mounted read-only above). optional: on
        # a FRESH install ESO has not created the Secret yet — the pod must still start; the probe
        # then fails LOUD at run time (fail-closed, never a guess), instead of blocking boot.
        - name: registry-pull
          secret:
            secretName: manager-registry-pull
            optional: true
            defaultMode: 0440
        {{- if .Values.master.sshUser }}
        # Master self-SSH key from the manager-master-key ExternalSecret.
        # optional: the pod starts even if the Secret is not present yet (fresh
        # cluster before ESO synced it); mode 0440 so the non-root uid reads it
        # via fsGroup (65532). seed-master.ts tolerates its absence.
        - name: master-key
          secret:
            secretName: manager-master-key
            optional: true
            defaultMode: 0440
        {{- end }}
