# The platform's GitHub App identity from secret/<stage>/app/github-app — the App
# installed with the owner of every tenant repository that the manager creates a tenant's own
# apps repository under (the tenant-apps-repo run). Not a person's token and not the
# write PAT of externalsecret-github.yaml: a repository made for a customer is made
# by the platform, under a name that is the platform's.
#
# THREE FIELDS AND ONE ENTRY, like the storage box: an App id without its
# installation id signs a token for no owner, and a key without either signs
# nothing. Its OWN ExternalSecret, beside the DNS token rather than in it — a read
# failure here must never fail the sync of the manager's core auth secrets
# (OIDC / session). All four defaulted remoteRef fields are emitted explicitly
# (ESO 2.x defaults them).
#
# ALWAYS RENDERED: the App is required of every installation (hostyour-cloud#237), and the seed
# always writes this entry.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: manager-github-app
spec:
  # No periodic read of Vault — the platform-wide delivery rule, stated in full in
  # hostyour-cloud clusters/charts/external-secret/templates/externalsecret.yaml: a secret
  # arrives on DEPLOY (OnChange re-syncs when this CR changes) and on target-Secret
  # DELETION (OnChange creates it when absent), never on a timer. So putting a NEW
  # value in front of the pods is three acts: write it into Vault, delete the target
  # Secret so ESO fetches it, roll the pods (the restart-workloads run).
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: manager-github-app
    creationPolicy: Owner
  data:
    - secretKey: app-id
      remoteRef:
        key: {{ printf "%s/app/github-app" .Values.global.env }}
        property: app-id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: installation-id
      remoteRef:
        key: {{ printf "%s/app/github-app" .Values.global.env }}
        property: installation-id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: private-key
      remoteRef:
        key: {{ printf "%s/app/github-app" .Values.global.env }}
        property: private-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
