{{- if .Values.githubApp.appId }}
# The platform's GitHub App identity from secret/<stage>/app/github-app — the App
# installed in the customer's organisation that the manager creates a tenant's own
# apps repository under (the tenant-apps-repo run). Not a person's token and not the
# write PAT of externalsecret-github.yaml: a repository made in the customer's
# organisation is made by the platform, under a name that is the platform's.
#
# THREE FIELDS AND ONE ENTRY, like the storage box: an App id without its
# installation id signs a token for no organisation, and a key without either signs
# nothing. Its OWN ExternalSecret, beside the DNS token rather than in it — a read
# failure here must never fail the sync of the manager's core auth secrets
# (OIDC / session). All four defaulted remoteRef fields are emitted explicitly
# (ESO 2.x defaults them).
#
# RENDERED ONLY WHERE THE INSTALLATION HAS THE APP. An installation may run no
# tenant repository at all, and then the seed writes no entry at this path — and an
# ExternalSecret naming an entry that is not there fails whole, which holds the
# manager Application Degraded for as long as it exists (the registry's Docker Hub
# secret stood that way once, clusters/inventories/registry/values-common.yaml).
# githubApp.appId stands in installation/values/manager.yaml, written by the branch
# program from the same answer the seed reads, so the switch and the entry come from
# one statement.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: manager-github-app
spec:
  # No periodic read of Vault — the platform-wide delivery rule, stated in full in
  # hostyour-cloud clusters/charts/external-secret/templates/externalsecret.yaml: a secret
  # arrives on DEPLOY (OnChange re-syncs when this CR changes) and on target-Secret
  # DELETION (OnChange creates it when absent), never on a timer. So putting a NEW
  # value in front of the pods is three acts: write it into Vault, delete the target
  # Secret so ESO fetches it, roll the pods (the restart-workloads run).
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: manager-github-app
    creationPolicy: Owner
  data:
    - secretKey: app-id
      remoteRef:
        key: {{ printf "%s/app/github-app" .Values.global.env }}
        property: app-id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: installation-id
      remoteRef:
        key: {{ printf "%s/app/github-app" .Values.global.env }}
        property: installation-id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: private-key
      remoteRef:
        key: {{ printf "%s/app/github-app" .Values.global.env }}
        property: private-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
