# The manager — the standalone hostyour-cloud control product (separate repo
# `hostyourmanager`), deployed as a first-class platform app by the platform
# ApplicationSet (namespace `manager`, AppProject `services`, Application
# sync-wave 40 = installs LAST, "on top" of the platform). Native OIDC against
# the platform IdP; hostnames and URLs are composed from .Values.global.env +
# .Values.global.domain in the templates (Deployment and the ingress library
# chart), so there is nothing env-specific here.
#
# PROVIDER-ONLY: like the build plane (registry/tekton/image-builder), the
# manager runs only where the registry runs locally. app.yaml says
# runsOn: master, and the app generator admits every-cluster plus the parts of
# the cluster's role, stamped over __CLUSTER_ROLE_FIRST_PART__ and
# __CLUSTER_ROLE_LAST_PART__ — so a master+slave machine renders it too — the
# same placement every provider-only app carries.
#
# The manager image pin lives in values-{dev,test,prod}.yaml as the ONE pin
# grammar builds[]{name,image,tag} — `image` is the FLAT build name
# (`manager`, no registry path to compose), and the full ref renders via
# common.buildImage from common.buildRegistry — ghcr.io, where the release-images
# workflow of hostyour-manager publishes it on the release tag, pulled directly
# and not through this cluster's own registry. The release bump searches
# clusters/inventories/<app>/values-<stage>.yaml for exactly this grammar and
# writes the tag (the bump's own glob stands in
# clusters/inventories/consumer-build/templates/pipeline-release.yaml); the
# cluster release delivers the bumped master to running clusters.
replicas: 1

# registry-reaper — the periodic CronJob (templates/reaper-cronjob.yaml) that
# prunes aged, UNREFERENCED image tags of OUR flat, single-segment repos from
# the central zot registry.
#
# WHAT IS LEFT FOR IT TO PRUNE, now that the builds[] pins compose against
# ghcr.io: what zot already holds. Copies fetched by its on-demand ghcr seed
# before the switch, and the tags an older install branch still pins, stay in
# that registry with nothing pulling them — which is exactly the aged and
# unreferenced state this job exists to clear. It reads the same keep floor as
# before, so a pin an installation is still running is never taken out from
# under it. Its keep floor is the release bump's search space
# (the builds[] pins in every values-<stage>.yaml carrier — see the CronJob
# header). It runs THIS manager image + code (server/jobs/registry-reaper.ts)
# and reuses the manager-github write-pat + manager-registry-pull +
# manager-app secrets that already live in this namespace, plus the
# tenant catalog read PAT (externalsecret-deploy-repo-pat.yaml). Rendered only
# on the control/build host: gated on master.sshUser (the same toggle that
# materializes manager-github) AND github.repo.
#
# SAFETY: dryRun defaults to "true" — the reaper only OBSERVES + LOGS, deletes
# NOTHING. The entrypoint deletes ONLY when DRY_RUN is EXACTLY "false". ARM it later
# (owner) by setting reaper.dryRun: "false" once the dry-run logs confirm the
# keep/delete plan is correct. zot's own retention never touches the
# single-segment repos (the ["*"] keep-all policy in
# clusters/inventories/registry/values-common.yaml) — the reaper is the sole cleaner there.
reaper:
  enabled: true
  # Nightly, off-peak. concurrencyPolicy: Forbid means a long run never overlaps
  # the next tick.
  schedule: "17 3 * * *"
  # "true" = observe only (default, SAFE). Set to "false" to ARM deletion —
  # nothing else changes.
  dryRun: "true"
  # Hard ceiling for one run (it scans every install branch's pointers); the Job
  # fails if exceeded.
  activeDeadlineSeconds: 900

# Run the manager pod on the node's host network so it can SSH to the clusters
# on the physical LAN. This is REQUIRED whenever the MicroK8s pod CIDR
# (default 10.1.0.0/16) overlaps the cluster LAN: a slave on 10.1.1.0/24 then
# looks like a pod IP from inside a pod, so Calico routes it into the overlay
# and the SSH connection times out instead of reaching the machine. Default on
# because reaching the clusters is the manager's whole job; the ingress path is
# unaffected (a pod can reach the node IP, so Traefik still reaches the pod).
# Set false only on a cluster whose pod CIDR cannot overlap the cluster LAN.
hostNetwork: true

# OIDC group required for access (config.ts ADMINS_GROUP, default "admins").
adminsGroup: admins

# The manager's admin socket. This map carries exactly the two values the manager
# reads for it — config.ts ADMIN_SOCKET_PATH and ADMIN_SOCKET_MODE — and nothing
# else. The socket answers one request: an operator session, minted with no
# password and no identity provider.
adminSocket:
  # WHERE the socket file stands (config.ts ADMIN_SOCKET_PATH: required there, no
  # default, refused at boot when it does not fit the ceiling below).
  #
  # ONE value for three spellings that have to be the same string: the path the
  # manager binds, the HOST directory templates/deployment.yaml mounts, and the
  # directory that mount lands on inside the pod. The caller is a program on the
  # host — the account operating the master takes its session off this socket —
  # so the host spelling and the container spelling are both addresses somebody
  # uses, and writing the path once is what holds them equal. The manager's own
  # boot check then covers both, because they are one string.
  #
  # NOT UNDER DATA_DIR, and that is arithmetic. sun_path in struct sockaddr_un is
  # 108 bytes on Linux and a pathname socket is NUL-terminated inside it
  # (man 7 unix), so 107 are usable. DATA_DIR is a ReadWriteOnce claim and where
  # that claim lands on the host is the storage provisioner's choice: with
  # microk8s-hostpath, the storage class global.storageClass names, a from-zero
  # master composed
  # /var/snap/microk8s/common/default-storage/manager-manager-data-<uid>/admin.sock
  # at 114 bytes. onboard-manager's connect(2) answered ENAMETOOLONG there, and
  # the same ceiling bounds the manager's own bind(2), so neither side could use
  # the path. 40 of those bytes are a generated uid and nothing on this platform
  # shortens it. The path below is 36 bytes.
  #
  # /var/lib AND NOT /run: /run is a tmpfs and is empty after a reboot, so a
  # socket directory there is gone at boot and the manager comes up with its
  # break-glass door shut.
  #
  # THE DIRECTORY MUST ALREADY EXIST ON THE HOST, owned so uid 65532 can create a
  # file in it. The volume is `type: Directory`, so the kubelet requires it and
  # does not create one; a kubelet-created directory would be root-owned 0755 and
  # the bind would answer EACCES with the pod running and the socket absent.
  path: /var/lib/hostyour-manager/admin.sock
  # The permission bits the manager puts on that socket (config.ts
  # ADMIN_SOCKET_MODE), written as an octal file mode.
  #
  # WHAT IT DECIDES. The socket has no address off the machine, so the file's
  # permissions are the entire boundary in front of it — connect(2) on a unix
  # socket needs the write bit and nothing else. Three sets are inside: the pod's
  # own uid 65532, every account in gid 65532 (the deployment's runAsGroup, which
  # is the group the socket is created in), and root.
  #
  # WHY 0770 AND NOT 0700. The account that operates the master onboards this
  # manager by asking that socket for a session, and it runs on the host, not in
  # the pod — 0700 leaves it with an empty triad and connect() answers EACCES.
  # 0770 opens the GROUP, which by itself admits nobody: no host account is in gid
  # 65532 until one is deliberately put there. Narrow it to "0700" on an
  # installation that does no such onboarding; nothing else on this platform opens
  # the socket.
  mode: "0770"

# GitHub access for the Branches view + the Reset wizard (config.ts GITHUB_REPO +
# GITHUB_WRITE_PAT). `repo` is the "owner/repo" of THIS GitOps monorepo — the same
# repo clusters/slaves/slave/values-common.yaml `repo.url` points at, just in owner/repo form
# (not a secret). The write-capable token is GITOPS_REPO_PAT (Contents:RW), placed on the
# isolated manager-host Vault tier and materialized by externalsecret-github.yaml as
# the pod env GITHUB_WRITE_PAT — NEVER a Helm value. Both render only where master.sshUser
# is set (the control host,
# the only place the manager runs) AND repo is non-empty. Blank `repo` ⇒ the feature
# is off and the routes answer 501 (no half-enabled state). Both-or-neither is enforced
# in config.ts: when repo is set the deployment injects BOTH env vars.
github:
  repo: "simetrixch/hostyour-cloud"
  # The tenant CATALOG the registry-reaper's floor also searches
  # (reaper-cronjob.yaml CATALOG_REPO). EMPTY here on purpose: which
  # repository it is, is installation state — clusters/active/<fqdn>.yaml carries it as
  # global.catalogUrl and loads LAST, and the template falls back to that with a
  # `required` on it and trims the owner/name off the address, so a branch naming no
  # catalog fails its render instead of starting a reaper whose floor cannot see the
  # catalog's pins.
  # NOTHING HOLDS THIS KEY IN PLACE. `default` reads an absent key and an empty
  # string alike, so removing the line renders the identical CronJob, and the
  # render check never reaches the line at all: the CronJob stands behind
  # master.sshUser, which is on an install branch only. What the key states is
  # where the override goes — an installation pointing THIS app at another
  # catalog sets deployRepo in installation/values/manager.yaml, which
  # clusters/argocd/apps/platform-apps-appset.yaml loads after this file.
  deployRepo: ""

# Consumer onboarding (config.ts, onboarding.md §6). Chart validation runs as an in-cluster
# `gate-run` Tekton PipelineRun in the locked-down `gate-runner` namespace (clusters/inventories/gate-runner) —
# NOT a host Quadlet. The manager dispatches the run + reads the report ConfigMap over its POD
# SERVICEACCOUNT (grants shipped with this chart, templates/rbac.yaml); no host loopback, no podman, no kubeconfig.
#
# The gate's product settings. The two keys that name THIS machine —
# gatemanagerAddr (whose emptiness switches consumer onboarding off entirely) and
# gateFenceMustFail — are NOT here: they stand in installation/values/manager.yaml, which the
# branch program writes when it cuts the install branch, from the address that machine answers on
# inside the cluster network (digita-deploy ansiwise/programs/deploy-branch.yaml renders
# ansiwise/templates/manager-values.tpl). Kube access is IN-CLUSTER via the pod ServiceAccount
# (grants shipped with this chart, templates/rbac.yaml — no Vault kubeconfig, nothing to seed).
onboarding:
  # The one egress the gate pod MUST reach (the pipeline clones from github through the fence).
  gateMustPass: "github.com:443"
  # The kubeconform target minor for the render gate (G3).
  kubeVersion: "1.30.0"

# Master self-registration (server config.ts MASTER_* + boot/seed-master.ts).
# The manager's deploy-slave Run drives the MASTER (this control host) over
# SSH; on a fresh manager DB there is no role=master server row and no key, so
# deploy-slave dies at "no master server registered". Setting master.sshUser TURNS
# ON self-registration: at boot the manager seeds the one role=master row
# (host == global.domain, this cluster's install branch) and seals its self-SSH
# key (materialized by ESO from Vault, where the installer provisions it) so it
# can SSH to its own host — zero manual SQL.
#
# sshUser and lanHost name ONE machine and stand in installation/values/manager.yaml, which the
# branch program writes when it cuts the install branch, from the account that operates the machine
# and the address it answers on inside the cluster network (the same file and template as the
# onboarding pair above). Empty sshUser means a plain install does NOT
# self-register: none of the MASTER_* env, the key ExternalSecret or the key mount is rendered.
# Only the port is product — every sshd this reaches listens where sshd listens.
master:
  # SSH port of the master's sshd.
  sshPort: 22
  # The promotion tier of the master self-cluster row seed-master.ts seeds for this control host
  # (config.ts MASTER_TIER / clusters.tier). Keep "rehearsal": the crypto gate O-GATE-1 refuses
  # onboarding to a non-rehearsal cluster while the keystore is plaintext, so the control host stays rehearsal
  # until the keystore is hardened. Promotion to "real" is a one-way audited step (R-13).
  tier: "rehearsal"

# The ansiwise deployment engine, as this manager reaches it on a machine
# (config.ts ANSIWISE_DOWNLOAD_URL + ANSIWISE_SERVE_COMMAND). Both are PRODUCT
# and not installation state, which is why they stand here and not in
# installation/values/manager.yaml beside master.sshUser: the release surface is
# this organisation's own, and the paths named below are the ones the manager's
# OWN placement writes, so an installation that chose either differently would be
# choosing against the code in this same platform. Absent, each of them stops its
# step with errNotConfigured — the download address stops deploy-slave's
# placement, the serve command stops every step that reaches a machine's
# programs, and neither has a default in config.ts.
#
# WHAT HOLDS EITHER KEY IN PLACE. Both halves below were rendered to see it.
# Taking this whole block away fails the render, because the Deployment reads
# `.Values.ansiwise.downloadUrl` bare: helm answers "nil pointer evaluating
# interface {}.downloadUrl" and no manifest is produced. Taking away ONE of the
# two lines does NOT — `quote` passes an absent value through as nothing, so the
# Deployment renders `value:` with no value after it and the container is handed
# the variable empty. What refuses that is the manager's own config.ts, whose
# schema is `.min(1)` on both: it prints the field and exits 1 before the logger
# exists. So the single-line deletion is caught at BOOT and not at render, and
# nothing in this repository's gate reads these two lines at all.
ansiwise:
  # WHERE a machine's executables are fetched from. The two markers are filled in
  # by the placement, never here: `<version>` from cliTools.ansiwise.version in
  # clusters/platform/versions.yaml — the ONE pin, read off this repository's trunk by
  # hostyour-manager server/domains/inventory/ansiwise-pin.ts with no default —
  # and `<name>` from the binary being fetched, `ansiwise` or `ansiwise-rest`.
  #
  # ONE ADDRESS REACHES BOTH FILES, which is why the binary is a marker and not a
  # second setting. The release carries ansiwise-<tag>-linux-x64 and
  # ansiwise-rest-<tag>-linux-x64; two settings could name two releases, and a
  # machine would then carry a pair that no pin describes and nothing could name
  # afterwards. A pin that stands in this address instead of a marker would be the
  # same defect one step earlier — config.ts refuses an address without
  # `<version>` for exactly that reason.
  downloadUrl: "https://github.com/simetrixch/ansiwise-cli/releases/download/<version>/<name>-<version>-linux-x64"
  # The command that serves a machine's programs over the run's own SSH session,
  # started on the session's stdio and speaking HTTP over it.
  #
  # ansiwise-rest AND NOT ansiwise. `serve` and `service` are the two programs of
  # the REST binary (ansiwise-cli lib/src/rest/resident_service.dart:48,52); the
  # deployment tool answers "no program is called serve" — measured, not read off
  # a help text. The REST binary in turn starts each run by invoking the ansiwise
  # standing in its own directory, so this command works only on a machine
  # carrying both halves of the release above.
  #
  # IT READS THE CATALOGUE THE PLACEMENT WROTE. /srv/ansiwise-catalog is
  # CATALOG_CHECKOUT in hostyour-manager server/domains/runs/defs/place-ansiwise.ts
  # — the checkout that placement clones the installation repository into, and the
  # one path a command reading anywhere else would serve different programs than
  # were placed. It is CHANGED INTO rather than merely named, because the working
  # directory is what every relative path of a program resolves against: the
  # `ansiwise.yaml` naming the active plugins, and each `template:` a step renders.
  # `--programs` is named on top of that because its default is `programs` beside
  # the working directory, and the catalogue keeps them under `ansiwise/programs`.
  # The resident service the same placement installs is started with exactly these
  # two facts (ansiwise-cli lib/service_installation.dart composes its ExecStart
  # and WorkingDirectory from them), so the session door and the address door
  # serve one catalogue rather than two that agree by accident.
  #
  # A BARE NAME, AND IT IS SAFE BECAUSE ONE STEP NOW OWNS THAT PATH. The placement
  # transfers both executables into the operating account's home — SFTP
  # authenticates as that account and has no elevation to offer — and then copies
  # them into /usr/local/bin with the run's elevation password, reading both back
  # off the path afterwards (PATH_HOME in hostyour-manager
  # server/domains/runs/defs/place-ansiwise.ts). Until it did, nothing wrote that
  # directory at all and a bare name reached whatever an earlier installation had
  # left there: "ansiwise-rest: command not found" on a machine that never had one,
  # and a binary at another version serving programs written for this one on a
  # machine that did. Naming the path is what makes THIS door, the resident door
  # and deploy-cluster's require_cli_tool_versions row all ask the same file.
  serveCommand: "cd /srv/ansiwise-catalog && ansiwise-rest serve --programs /srv/ansiwise-catalog/ansiwise/programs"

# WHERE THIS MANAGER ASKS WHETHER A SLAVE IS REPORTING METRICS (config.ts
# METRICS_QUERY_URL). The deploy-slave run ends with a soft probe that asks one
# question — is the new slave's obs-agent pushing? — as
# GET <this>/api/v1/query?query=up{cluster="<fqdn>"} against the observability
# stack's Prometheus-compatible query API. The `cluster` label is what a slave's
# agent stamps on every series it pushes (clusters/charts/monitoring
# alloy-agent-config.yaml external_labels), so the answer is per-machine.
#
# A BASE ADDRESS AND NOT THE FINISHED QUERY. The path grammar and the shape of
# the JSON that comes back are one thing and belong in one place — the code that
# parses the answer. A chart that wrote the path would be the second half of an
# API contract whose first half it cannot read, and the two would drift the next
# time either moved. What is a fact of the DEPLOYMENT, and the only part stated
# here, is which host answers.
#
# THE ADDRESS IS THIS PLATFORM'S OWN SERVICE, which is why the value stands here
# with the product settings and not in installation/values/manager.yaml beside
# master.sshUser: clusters/inventories/observability renders that Service, its
# name composes from that chart's kube-prometheus-stack.fullnameOverride, and
# both apps carry runsOn: master, so on every installation this platform builds
# the Manager and the query API stand on one cluster and the name below is the
# name that resolves. It is NOT in global.endpoints either — that map is
# declared as the cross-cluster surface and is empty on the trunk, written per
# install branch; this address crosses nothing and has a correct value on the
# trunk. An installation that runs its query API somewhere else overrides the
# key in installation/values/manager.yaml, which the ApplicationSet loads after
# this file, the same override path github.deployRepo above states.
#
# TWO CHARTS SPELL ONE SERVICE NAME AND NOTHING HOLDS THEM EQUAL. A Helm release
# cannot read another release's values, so a changed fullnameOverride in
# clusters/inventories/observability renames the Service and leaves this address
# pointing at a name that no longer resolves. The probe is soft, so the run does
# not fail — it reports the check as unreachable. That is the honest outcome and
# it is also why the Manager must say WHICH of the two soft outcomes it hit: an
# address it was never given, and an address that answered nothing, are
# different faults with different fixes, and one marker for both would hide the
# rename behind a machine that is simply not pushing yet.
#
# EMPTY MEANS THE CHECK IS SKIPPED, NOT THAT IT PASSED. There is no default and
# no fallback address: a Manager given no value renders no METRICS_QUERY_URL at
# all (templates/deployment.yaml gates the whole env entry on this key being
# non-empty), config.ts treats the variable as optional, and the probe answers
# "skipped: this Manager was given no metrics query address" instead of running.
# The step downgrades that to a meta note the same way it downgrades a miss. What
# must never happen is the third answer — a silent green — which is what a
# default address would produce on every installation that never configured one.
#
# BLANKING THE KEY IS THEREFORE A DECISION AND NOT AN ACCIDENT, and it is the
# only way to switch the probe off. An installation whose Manager may not reach
# the query API sets metrics.queryUrl: "" in installation/values/manager.yaml and
# gets a run that says so at every deploy-slave.
#
# WHAT HOLDS THE KEY IN PLACE. The Deployment reads `.Values.metrics.queryUrl`
# through a `with`, and queryUrl is this map's only key, so deleting the LINE and
# deleting the BLOCK are one act: the map is left null and helm answers "nil
# pointer evaluating interface {}.queryUrl" with no manifest produced. Both
# measured, 2026-08-27. That is deliberate and it is what makes the blank a
# statement rather than a gap — the way to switch the probe off is to WRITE the
# empty value in installation/values/manager.yaml, which loads after this file
# and leaves the map standing, and never to take the line away.
metrics:
  queryUrl: "http://observability-prometheus.observability.svc.cluster.local:9090"

# pino log level (config.ts LOG_LEVEL): fatal|error|warn|info|debug|trace|silent.
logLevel: info

resources:
  requests:
    cpu: "50m"
    memory: 128Mi
  limits:
    cpu: "500m"
    memory: 384Mi

# Ingress (library chart) — native OIDC, deliberately NO forwardAuth annotation
# (the manager enforces its own session chokepoint, like the old console).
# host / serviceName / tls.secretName are tpl'd from globals; the
# cert-manager.io/cluster-issuer annotation is auto-applied from
# .Values.global.clusterIssuer by the ingress chart.
ingress:
  ingress:
    enabled: true
    className: public
    host: 'manager.{{ .Values.global.domain }}'
    paths:
      - path: /
        pathType: Prefix
        serviceName: manager
        servicePort: 80
    tls:
      enabled: true
      secretName: 'manager-{{ .Values.global.env }}-tls'

# Persistent DATA_DIR (mounted at /data): SQLite manager.db (WAL) + the
# session/credstore metadata live here — LOSS = losing the manager's state,
# so the PVC is delete-protected like the data-tier stores.
# storageClassName omitted — falls back to .Values.global.storageClass.
#
# The namespace is named for the same reason it is named on the tailnet
# coordinator: this component was already renamed once, and a rename moves the
# release into a new namespace while the volume stays behind in the old one with
# the database in it. Declaring the namespace refuses that render instead, and
# changing this line is the act that says the data was moved too.
manager-data:
  pvc:
    enabled: true
    name: manager-data
    namespace: manager
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
    accessModes:
      - ReadWriteOnce
    storageSize: "2Gi"

# Per-namespace SecretStore (library chart). vaultUrl falls back to
# .Values.global.endpoints.vault.url; role is the app-tier `external-secrets`.
secret-store: {}
