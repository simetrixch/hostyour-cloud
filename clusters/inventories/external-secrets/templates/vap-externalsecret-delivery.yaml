{{- /*
THE SECRET DELIVERY RULE OF THIS PLATFORM, held by the API server rather than by
a scan of the tree.

WHAT THE RULE IS. A secret reaches a cluster in exactly two moments: when it is
DEPLOYED, and when its target Secret is DELETED. Nothing on this platform reads
Vault on a timer. In an ExternalSecret that sentence is one field,
`spec.refreshPolicy: OnChange`, and upstream states both halves of it:

  "Create the Kind=Secret if it doesn't exist. Update the Kind=Secret only when
   the ExternalSecret's metadata or specification changes."

Both halves are load-bearing. The second is why nothing polls. The FIRST is what
the only rotation procedure on this platform rests on — write the new value into
Vault, delete the target Secret so it is fetched again, roll the pods so the
containers read it. Under a policy that does not create an absent Secret, the
middle step deletes a Secret that never comes back and the pods mounting it stop
starting.

WHY THE DEFAULT IS THE DANGER, AND WHY IT IS SILENT. crd-externalsecret.yaml
beside this file sets `refreshInterval` to a default of 1h0m0s, and states no
default for `refreshPolicy` at all — the controller's own default applies, and it
is Periodic. So an ExternalSecret written WITHOUT thinking about this does not
fail, does not warn, and does not look different in any dashboard: it quietly
reads Vault every hour for the life of the cluster. That is the opposite of what
this platform wants, and nothing about a running cluster says it is happening.

WHY THIS IS AN ADMISSION POLICY AND NOT A CHECK OVER THE TREE. A check reads the
files somebody remembered to point it at, and it goes green both when every
document is right and when the check stopped finding them. This reads every
ExternalSecret the API server is asked to admit, whatever produced it — a chart
of ours, a tenant's chart, an operator, or a person with kubectl — and a document
that would poll is never created at all. There is nothing to keep in step with a
tree that changes.

WHAT THIS DOES NOT HOLD, said plainly rather than left to be assumed:

  - `refreshInterval` is not held. Upstream describes OnChange without any
    reference to it, so under OnChange a document has no timer whatever the
    interval says. The charts of this tree state "0" beside the policy so a
    reader sees at a glance that nothing polls, and that is a convention for
    readers rather than a behaviour, so refusing a document over it would refuse
    it for a field that decides nothing.
  - A document that is never applied to a cluster is not seen. This admits and
    refuses; it does not read git.
  - Only v1 is matched, which is the whole of it: crd-externalsecret.yaml serves
    v1 and carries v1beta1 with `served: false`, so nothing can be submitted
    under the older version.
*/ -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: externalsecret-delivery
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["external-secrets.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["externalsecrets"]
  validations:
    # `has()` is what catches the dangerous case rather than only the wrong one:
    # an absent refreshPolicy is not an empty string, it is the controller's
    # Periodic default, and that is the document that polls.
    - expression: "has(object.spec.refreshPolicy) && object.spec.refreshPolicy == 'OnChange'"
      message: "spec.refreshPolicy must be OnChange: a secret on this platform is read when it is deployed and when its target Secret is deleted, never on a timer. Left unset it defaults to Periodic and this ExternalSecret would read Vault every hour."
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: externalsecret-delivery
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  policyName: externalsecret-delivery
  # Deny, never Audit: an admitted document polls, and a warning in an audit log
  # is read after the polling has been happening.
  validationActions:
    - Deny
