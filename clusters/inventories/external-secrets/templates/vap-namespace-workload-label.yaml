{{- /*
ONE cluster-scoped policy on every cluster, because this inventory runs on every cluster and owns the
secret store side that the label below binds.

The label `hostyour.cloud/workload` is the whole binding of the Vault role `external-secrets`: a
ServiceAccount named external-secrets-sa in ANY namespace carrying the label reads the policy
`<cluster>-eso`, which holds the storage box login that opens every backup of the installation — the
master backups, every tenant and consumer backup, and the recovery folder. A chart of an outside unit
renders Namespace objects of its own (the AppProject of a unit whitelists that cluster-scoped kind), so
without this policy the label, and with it that login, is a unit's to claim.

WHO MAY CARRY IT. A Namespace carrying the label is admitted when

  - it has no `argocd.argoproj.io/tracking-id` annotation: it is the namespace an Application's
    managedNamespaceMetadata marks (clusters/argocd/files/platform-apps-appset.yaml and slaves-appset.yaml),
    which stamps no tracking id on it. An outside chart cannot reach that path: ArgoCD stamps every
    object it applies with the name of the Application that applies it, OVERWRITING whatever the manifest
    carried, and the AppProject of a unit (clusters/units/reconciler/templates/appproject.yaml) and of a
    tenant blacklist the kind Application. Or

  - its tracking id is one of the four ids below: the platform applications that render their own
    Namespace so that the label stands before their first pod
    (clusters/inventories/{e2e-runner,forgejo-build,gate-runner,service-provisioner}/templates/namespace.yaml).
    The id is `<application>-<stage>:/Namespace:<namespace>/<namespace>`, the string ArgoCD wrote on the
    four namespaces of the master and of apps1 to apps8 when this policy was written.

Every other tracking id — a `<unit>-build` namespace under its build fan-out Application, a
`<unit>-<stage>` namespace under its delivery Application, a tenant namespace, a platform namespace
under another Application — is refused, on create and on update. A Namespace without the label is
admitted unread, and so is an update that takes the label off.

The ids are rendered from `workloadNamespaceApplications` in values-common.yaml and from `global.env`,
never from a literal stage. scripts/workload-label.test.mjs holds that list to the inventories whose
templates render a labelled Namespace, so a new one cannot be forgotten and a stale one cannot stay.

THE CHECK IS INSIDE THE VALIDATION, and the binding carries no namespaceSelector and the policy no
matchCondition. The label a selector would read is the very thing under review, and scripts/vap-eval
evaluates only the variables and the validations: a condition outside them would make the policy it
tests another policy than the one that ships.

WHAT THIS DOES NOT HOLD, said plainly rather than left to be assumed:

  - A cluster-admin and a person with kubectl who applies a Namespace without a tracking id are not
    refused: that is the path of managedNamespaceMetadata, which no user-name rule can tell apart,
    because on a slave the controller signs in as another user and the controller also writes the
    objects of outside units.
  - The guard trusts that the name of an Application belongs to one owner. The policy
    consumer-build-namespace-label (clusters/inventories/consumer-build) relies on the same fact.
  - A tracking id on a Namespace created by hand is taken at its word, as it would be on any object.
*/ -}}
{{- $ids := list }}
{{- range .Values.workloadNamespaceApplications }}
{{- $ids = append $ids (printf "'%s-%s:/Namespace:%s/%s'" . $.Values.global.env . .) }}
{{- end }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: namespace-workload-label
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
  variables:
    - name: claimsWorkload
      expression: "has(object.metadata.labels) && 'hostyour.cloud/workload' in object.metadata.labels"
    - name: trackingId
      expression: >-
        (has(object.metadata.annotations) && 'argocd.argoproj.io/tracking-id' in object.metadata.annotations)
          ? object.metadata.annotations['argocd.argoproj.io/tracking-id'] : ''
  validations:
    - expression: {{ printf "!variables.claimsWorkload || variables.trackingId == '' || variables.trackingId in [%s]" (join ", " $ids) | quote }}
      message: "the label hostyour.cloud/workload binds the Vault role that reads the storage box login of every backup — only a namespace no Application stamped, or one of the platform applications that render their own namespace, may carry it."
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: namespace-workload-label
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  policyName: namespace-workload-label
  # Deny, never Audit: an admitted label is a login, and a warning in an audit log is read after the
  # login has been used.
  validationActions:
    - Deny
