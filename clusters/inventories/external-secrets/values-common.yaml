# ESO controller install. CRDs come from templates/ in this chart (just the
# 2 we use: ExternalSecret + SecretStore), not from the upstream chart.
external-secrets:
  # We ship the 2 CRDs we need as static manifests in templates/, so disable
  # the chart's CRD installation. Each cluster gets ExternalSecret +
  # SecretStore CRDs via this Application; everything else (generators,
  # cluster-scoped variants, PushSecret) stays out.
  installCRDs: false

  # The actual controller Deployment. ONE controller per cluster — it
  # watches every namespace where clusters/charts/secret-store/ has rendered a local
  # SecretStore + external-secrets-sa ServiceAccount. Vault's
  # bound_service_account_namespaces (set where the cluster's Vault is seeded)
  # is what gates which namespaces' SAs are actually allowed to read secrets.
  createOperator: true

  # The chart's harmless servicebindings-aggregation ClusterRole — drop it,
  # we don't run any servicebinding-aware controller.
  rbac:
    servicebindings:
      create: false

  # No admission webhook. Skipping the cluster-wide
  # ValidatingWebhookConfiguration + the webhook pod + the cert-controller
  # (which exists only to rotate the webhook's TLS cert). CR validation
  # moves from admission-time to reconcile-time; bad CRs surface in
  # ExternalSecret .status instead of failing at apply.
  webhook:
    create: false
  certController:
    create: false

  # We don't use Cluster* CRs anywhere in this platform — disable the
  # corresponding reconcile loops (otherwise the controller logs reconcile
  # errors looking for CRDs we deliberately didn't install).
  processClusterExternalSecret: false
  processClusterPushSecret: false
  processClusterStore: false
  processClusterGenerator: false
  processPushSecret: false

  replicaCount: 1
  leaderElect: false

  # WHAT THIS CONTROLLER TRUSTS WHEN IT DIALS THE STORE.
  #
  # Every SecretStore on this cluster names `global.endpoints.vault.url` — an https address of this
  # installation, and on a slave that address belongs to the MASTER. The controller verifies that
  # certificate against its own container's trust store, which is the public root list its image was
  # built with and nothing else. On an installation issuing from an authority it minted for itself,
  # every secret of every application therefore fails to materialize, and what an operator reads is
  # `vault-backend ... unable to create client` — measured on this platform once already.
  #
  # THE CONTROLLER AND NOT EACH SecretStore. The provider offers `caProvider` per store, and there is
  # one store per application: the same fact would be written in every chart, and each copy would
  # have to be taken out again the day the switch is flipped. One variable on the one process that
  # opens all those connections says it once.
  #
  # The file is a SUPERSET — trust-manager writes the public roots into it in both states of the
  # certificate switch — so this adds an authority and takes none away.
  extraEnv:
    - name: SSL_CERT_FILE
      value: /etc/platform-trust/ca-certificates.crt

  extraVolumes:
    - name: platform-trust
      configMap:
        name: platform-trust

  extraVolumeMounts:
    - name: platform-trust
      mountPath: /etc/platform-trust
      readOnly: true

  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 384Mi

  # Expose /metrics so clusters/inventories/observability/'s external-secrets ServiceMonitor
  # discovers the controller.
  metrics:
    service:
      enabled: true
  serviceMonitor:
    enabled: false   # owned by clusters/inventories/observability/
