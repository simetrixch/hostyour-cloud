name: argocd-secrets
project: core
# AFTER external-secrets, whose operator and CRDs this reads through, and after the reconciler that
# consumes the Secrets is standing. Nothing the rollout brings later reads through this namespace's
# store, and ArgoCD reconciles perfectly well without the sign-in: arriving late costs a person one
# refreshed login page, and the tenants ApplicationSet one failed generation until the catalogue
# credential stands.
syncWave: "5"
namespace: argocd
prune: "true"
# TRUE ON A NAMESPACE THAT ALREADY EXISTS, and that is what it is here for: it is how ArgoCD is asked
# to own the namespace's METADATA, and the platform appset stamps `hostyour.cloud/workload` through
# exactly that. The store's role binds on that label, so the namespace this renders into is admitted
# at login by the same rule as every other namespace of this platform.
createNamespace: "true"
# MASTER AND NOT every-cluster. This app materialises the Secrets the reconciler reads into the
# namespace `argocd` — the OIDC client secret and the catalogue credential. A SLAVE HAS NO ARGOCD:
# its applications are driven by an instance that stands on its master, in a namespace named after
# the slave. Nothing on a slave would ever read this Secret, and the namespace it asks for is not
# among the ones its project allows there.
#
# Measured on a real machine: even with every project's destination named by cluster, this app
# placed on a slave is refused — "destination server 'apps6' and namespace 'argocd' do not match any
# of the allowed destinations in project 'core'". Signing in to the slave's instance is the master's
# business, because that is where the instance is.
runsOn: master
