{{- /*
THE APP FOR EVERY REPOSITORY OF ITS OWNER, as an ArgoCD credential template (secret-type repo-creds):
ArgoCD uses it for every repoURL under the owner that no repository Secret names — the charts of
the units this ArgoCD generates Applications for. The same Vault entry as repo-catalog beside it, so
no token stands anywhere and nothing expires, and it is rendered from git and Vault like every other
credential of this ArgoCD: a deleted Application refetches with it, and a deleted Secret is written
again by the operator's store.
*/ -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-creds-owner
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: {{ .Values.global.secretStoreName }}
    kind: SecretStore
  target:
    name: repo-creds-owner
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: git
        # The owner's URL: the catalogue's scheme, host and owner, ending in the slash. ArgoCD matches
        # a credential template by plain prefix, so without the slash it would also match an owner
        # whose name begins with this one.
        url: {{ required "argocd-secrets: global.catalogUrl must read https://<host>/<owner>/<repository> - the credential template matches the owner by that prefix" (regexFind "^https://[^/]+/[^/]+/" (required "argocd-secrets: global.catalogUrl is required (clusters/active/<fqdn>.yaml, written by deploy-branch from the cluster map's catalog-repo)" .Values.global.catalogUrl)) }}
        githubAppID: '{{ `{{ index . "app-id" }}` }}'
        githubAppInstallationID: '{{ `{{ index . "installation-id" }}` }}'
        githubAppPrivateKey: '{{ `{{ index . "private-key" | replace "\\n" "\n" }}` }}'
  data:
    {{- range $field := list "app-id" "installation-id" "private-key" }}
    - secretKey: {{ $field }}
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        key: {{ printf "%s/app/github-app" (required "global.env is required" $.Values.global.env) }}
        property: {{ $field }}
    {{- end }}
