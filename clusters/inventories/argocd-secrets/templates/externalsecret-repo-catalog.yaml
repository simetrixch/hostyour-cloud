{{- /*
THE CREDENTIAL THIS RECONCILER READS THE PRIVATE TENANT CATALOGUE WITH — the twin of
clusters/slaves/slave/templates/externalsecret-repo-catalog.yaml, which does the same for a slave's
own instance. The tenants ApplicationSet generates its parameters from the catalogue over git, and the
catalogue is private on purpose: its per-installation branches say which customer runs which version,
which is not a fact to publish. ArgoCD discovers a repository credential the same way it discovers a
cluster — a Secret in its own namespace labelled argocd.argoproj.io/secret-type: repository.

WHERE THE CREDENTIAL COMES FROM. The platform's GitHub App is the catalogue's identity (#237): ArgoCD
holds the App itself — its id, its installation id and its private key, the native GitHub-App
repository credential, read at every use and never expiring — out of secret/<stage>/app/github-app,
which the role the store beside this logs in under already reads. Nothing new is granted here.

WRITTEN OUT RATHER THAN TAKEN FROM clusters/charts/external-secret: the URL is composed from a global
the map carries, and that chart passes its target template through verbatim.
*/ -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-catalog
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  # No periodic read of Vault — the platform-wide delivery rule (clusters/charts/external-secret
  # carries the full statement of it). Putting a NEW token in front of ArgoCD: update Vault, then
  # DELETE the target Secret `kubectl -n argocd delete secret repo-catalog` — OnChange creates it
  # again from Vault. No pod roll: ArgoCD reads this Secret on every use.
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: {{ .Values.global.secretStoreName }}
    kind: SecretStore
  target:
    name: repo-catalog
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          # THE label that makes this ArgoCD treat the Secret as a repo credential.
          argocd.argoproj.io/secret-type: repository
      # THE APP ITSELF (#228, #237): no token stands anywhere for the catalog.
      data:
        type: git
        # The URL must match the repoURL the generator names, character for character: ArgoCD picks
        # a credential by comparing the two as text, and a trailing slash or a missing .git is a
        # credential it will not find. The catalogue is installation state and the map carries it
        # as global.catalogUrl — required and not defaulted, because a credential attached to the
        # wrong URL is one ArgoCD never uses and nobody misses.
        url: {{ required "argocd-secrets: global.catalogUrl is required (clusters/active/<fqdn>.yaml, written by deploy-branch from the cluster map's catalog-repo)" .Values.global.catalogUrl }}
        githubAppID: '{{ `{{ index . "app-id" }}` }}'
        githubAppInstallationID: '{{ `{{ index . "installation-id" }}` }}'
        githubAppPrivateKey: '{{ `{{ index . "private-key" | replace "\\n" "\n" }}` }}'
  data:
    {{- range $field := list "app-id" "installation-id" "private-key" }}
    - secretKey: {{ $field }}
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        key: {{ printf "%s/app/github-app" (required "global.env is required" $.Values.global.env) }}
        property: {{ $field }}
    {{- end }}
