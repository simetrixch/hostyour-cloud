# dbgate — the two Vault paths of the prod stage, written as literals for the
# reason every other application writes them as literals: the stage is not a fact
# a chart holds, and a path composed at render time is a path no check can hold to
# the entries the installation's programs actually write.
externalsecret-db:
  externalSecret:
    vaultPath: prod/app/mongodb

externalsecret-redis:
  externalSecret:
    vaultPath: prod/app/redis
