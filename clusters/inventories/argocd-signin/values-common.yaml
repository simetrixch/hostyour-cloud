# The SecretStore this namespace reads through, rendered by the shared chart exactly as every other
# workload namespace renders one: the cluster's own auth mount, its own ServiceAccount, its own role.

# WHERE THE CLIENT SECRET STANDS. `<env>/idp/bootstrap` is written when the identity provider is
# seeded, on the cluster that keeps the books, and every cluster of the installation reads that one
# entry — the reconcilers are separate but the provider is one, so the client is one.
#
# TWO THINGS OUTSIDE THIS REPOSITORY have to hold for the read to succeed, and the seed states both:
#   * the `<cluster>-eso` policy grants read on secret/data/<env>/idp/bootstrap;
#   * `argocd` is admitted by the store's `external-secrets` role — which it is by carrying
#     `hostyour.cloud/workload`, the label app.yaml asks ArgoCD to put on the namespace.
externalsecret-oidc:
  externalSecret:
    enabled: true
    name: argocd-oidc
    namespace: argocd
    secretStoreKind: SecretStore
    targetSecretName: argocd-oidc
    annotations: {}
    # THE LABEL IS WHAT MAKES THE SECRET READABLE AT ALL, and it goes on the SECRET rather than on
    # the ExternalSecret that produces it — so it is stated in ESO's target template, which is the
    # only thing that reaches the object itself.
    #
    # The reconciler resolves `$argocd-oidc:clientSecret` out of argocd-cm by reading Secrets in its
    # own namespace that carry `app.kubernetes.io/part-of: argocd`, which is the label its own chart
    # puts on everything it owns. A Secret without it is not consulted, the reference resolves to
    # nothing, and the reconciler then presents an EMPTY client secret at the token endpoint — which
    # the identity provider answers with `invalid_client`, a message about the client rather than
    # about the secret it never received.
    #
    # Measured on a real machine: the provider holds exactly the secret the platform gave it, the
    # ExternalSecret is SecretSynced, the redirect address matches, and sign-in still fails. The
    # only difference from the reconciler's own argocd-secret is this one label.
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
    data:
      - secretKey: clientSecret
        property: argocd-client-secret
