apiVersion: v2
name: argocd-signin
version: 1.0.0
description: |
  THE ONE SECRET A PERSON NEEDS TO OPEN A CLUSTER'S RECONCILER — `argocd-oidc`, key `clientSecret`,
  which clusters/bootstrap/argocd/values.yaml resolves as `$argocd-oidc:clientSecret` in its
  oidc.config. Without it the sign-in reaches the token exchange and is answered `invalid_client`,
  because an unresolved reference is sent as an empty secret; and the local account is off, so there
  is no password form to fall back to.

  IT IS READ, NOT WRITTEN IN. It used to be placed by a row of deploy-platform-services holding the
  store's ROOT TOKEN, which exists only on the cluster that keeps the books — so a cluster keeping
  none could not have it at all, and the run that tried died at that row (apps4, 2026-08-29).

  Here it arrives the way every other secret on every other cluster does: this cluster's own ESO
  logs in at this cluster's own auth mount and reads the entry with this cluster's own policy. One
  mechanism instead of two, no root token, and the object is a resource of a GitOps Application —
  visible in the reconciler it belongs to, like everything else the platform deploys.
  THE STORE IS NOT RENDERED HERE. The `argocd` namespace already carries `SecretStore/vault-backend`
  and `ServiceAccount/external-secrets-sa`, both written by clusters/argocd/apps/repo-catalog.yaml,
  which is a resource of the root-applications Application. Rendering them again would put the same
  two objects under two Applications, which ArgoCD reports as a SharedResourceWarning and which makes
  each sync of one of them contend with the other. The ExternalSecret below names no store and falls
  back to `global.secretStoreName` — `vault-backend`, in clusters/platform/values-common.yaml — so it
  reads through the store that is already there.
dependencies:
  - name: external-secret
    version: 1.0.0
    repository: file://../../charts/external-secret
    alias: externalsecret-oidc
  # Shared named templates the two library charts above resolve their names through.
  - name: common
    version: 1.0.0
    repository: file://../../charts/common
