# Values-driven DNS rewrites applied on every env — an extension surface for
# an install branch (e.g. a host LAN name an operator must resolve in-cluster).
# `from` is evaluated as a Go template (Helm `tpl`) so an entry can compose
# from .Values.global.env / .Values.global.domain. Empty on the trunk: every
# platform-service hairpin (vault, zot) is emitted by configmap.yaml
# itself, gated on global.servicesLocal.* — the service being LOCAL on this
# cluster — so a rewrite never outlives the service it points at.
rewrites: []

# Additional values-driven rewrites for one installation, set in
# clusters/active/<fqdn>.yaml when a mapping makes sense only on one cluster.
# Empty here so no cluster silently inherits a one-off mapping.
extraRewrites: []

# Upstream DNS forwarding for non-cluster names. Default forwards to the node's
# /etc/resolv.conf over UDP, the same as the MicroK8s `dns` addon. A cluster
# overrides `forward.upstreams` and/or `forward.forceTcp` in
# clusters/active/<fqdn>.yaml. This chart owns kube-system/coredns, so it
# replaces whatever the addon wrote, and Argo CD's self heal restores it if the
# addon is enabled again.
forward:
  upstreams: "/etc/resolv.conf"
  forceTcp: false

# Whether outside names are cached for their own TTL and served stale while they
# refresh (the `cache` block of the Corefile). Temporary: off here, turned on for
# one cluster in clusters/active/<fqdn>.yaml with `cache: {serveStale: true}`, and
# deleted with the old `cache 30` once that cluster has been measured.
cache:
  serveStale: false
