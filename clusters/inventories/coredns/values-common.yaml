# Values-driven DNS rewrites applied on every env — an extension surface for
# an install branch (e.g. a host LAN name an operator must resolve in-cluster).
# `from` is evaluated as a Go template (Helm `tpl`) so an entry can compose
# from .Values.global.env / .Values.global.domain. Empty on the trunk: every
# platform-service hairpin (vault, zot) is emitted by configmap.yaml
# itself, gated on global.servicesLocal.* — the service being LOCAL on this
# cluster — so a rewrite never outlives the service it points at.
rewrites: []

# Additional values-driven rewrites for one installation, set in
# clusters/active/<fqdn>.yaml when a mapping makes sense only on one cluster.
# Empty here so no cluster silently inherits a one-off mapping.
extraRewrites: []

# Upstream DNS forwarding for non-cluster names. Default mirrors the MicroK8s
# `dns` addon: forward to the node's /etc/resolv.conf (UDP). Override it in
# clusters/active/<fqdn>.yaml when the host LAN needs explicit resolvers and/or
# force_tcp. NOTE: this Corefile OWNS kube-system/coredns, so it overrides
# whatever the installer's fix_coredns_upstream patched — the value that reaches
# a cluster must match that host's DNS_UPSTREAM_SERVERS + DNS_FORCE_TCP in
# configs/config.<stage>.
forward:
  upstreams: "/etc/resolv.conf"
  forceTcp: false
