# Shared observability config across DEV / TEST / PROD. Per-env overrides go in
# values-{dev,test,prod}.yaml.

# ============================================================================
# Monitoring chart — emits everything that ties the platform to Prometheus /
# Alertmanager:
#   - Alloy DaemonSet config (cluster-wide log shipper + OTLP receiver)
#   - Cluster-level PrometheusRule (PodCrashLooping, NodeDiskFillingUp, ...)
#   - ServiceMonitor / PodMonitor for foreign infra installed outside the
#     GitOps tree (cert-manager, Traefik, Vault, ArgoCD — bootstrapped by
#     base/ or the MicroK8s addons). These cannot ship with the
#     foreign app charts, so they live here in the observability app.
#
# Apps in apps/ that need their own monitoring depend on the same chart and
# declare their entries under their own top-level `monitoring:` key.
# ============================================================================
monitoring:
  prometheusReleaseLabel: observability

  alloy:
    logsEnabled: true
    tracesEnabled: true
    journaldEnabled: true

  # --------------------------------------------------------------------------
  # ServiceMonitors for foreign infrastructure (deployed by base/
  # or the MicroK8s addons, not by the GitOps tree). The observability app
  # owns these CRs because the upstream tools have no chart of their own here.
  # --------------------------------------------------------------------------
  serviceMonitors:
    cert-manager:
      enabled: true
      # cert-manager controller + cainjector + webhook all expose :9402.
      namespaces: [cert-manager]
      matchLabels:
        app.kubernetes.io/instance: cert-manager
      endpoints:
        - targetPort: 9402
          path: /metrics
          interval: 60s
          honorLabels: true

    vault:
      enabled: true
      # Four Services share app.kubernetes.io/name=vault:
      #   vault          — main (what we want)
      #   vault-internal — raft peer-to-peer (extra label vault-internal=true)
      # plus agent-injector and ui (different name labels). Exclude
      # vault-internal via matchExpressions.
      #
      # Vault serves /v1/sys/metrics over HTTPS with a Let's Encrypt cert valid
      # only for vault.<domain> — the in-cluster DNS name
      # doesn't match — so insecureSkipVerify. Unauthenticated metrics access
      # is enabled via listener."tcp".telemetry.unauthenticated_metrics_access
      # in the Vault config (clusters/bootstrap/vault/values.yaml).
      namespaces: [vault]
      matchLabels:
        app.kubernetes.io/name: vault
      matchExpressions:
        - { key: vault-internal, operator: DoesNotExist }
      endpoints:
        - port: https
          path: /v1/sys/metrics
          scheme: https
          params:
            format: [prometheus]
          interval: 60s
          tlsConfig:
            insecureSkipVerify: true

    external-secrets:
      enabled: true
      # ESO is installed as a single ArgoCD-managed Application
      # (clusters/inventories/external-secrets/) in the external-secrets namespace.
      # The controller's metrics Service ships with the chart when
      # metrics.service.enabled=true.
      namespaces: [external-secrets]
      matchLabels:
        app.kubernetes.io/name: external-secrets
      endpoints:
        - port: metrics
          path: /metrics
          interval: 60s

  # --------------------------------------------------------------------------
  # PodMonitors — same as ServiceMonitor but the metrics port exists only on
  # the pod (not on any public Service).
  # --------------------------------------------------------------------------
  podMonitors:
    traefik:
      enabled: true
      # metrics.prometheus=true is set in Traefik args; port 9100 is on the pod
      # but not on the public Service.
      namespaces: [ingress]
      matchLabels:
        app.kubernetes.io/name: traefik
      podMetricsEndpoints:
        - port: metrics
          path: /metrics
          interval: 60s

    argocd:
      enabled: true
      # Every argocd-* component pod exposes a `metrics` container port. One
      # PodMonitor covers application-controller, applicationset-controller,
      # notifications-controller, repo-server, server.
      # dex-server exposes :5558 as `metrics` but doesn't serve a /metrics
      # handler — scraping triggers permanent TargetDown. Exclude it.
      # argocd-redis has no `metrics` port at all; the PodMonitor silently
      # skips pods where the named port doesn't exist.
      namespaces: [argocd]
      matchLabels:
        app.kubernetes.io/part-of: argocd
      matchExpressions:
        - { key: app.kubernetes.io/name, operator: NotIn, values: [argocd-dex-server] }
      podMetricsEndpoints:
        - port: metrics
          path: /metrics
          interval: 60s

  # --------------------------------------------------------------------------
  # Cluster-wide alert rules. Per-app rules live in each app's own values file.
  # --------------------------------------------------------------------------
  prometheusRules:
    kubernetes:
      enabled: true
      groups:
        - name: kubernetes
          interval: 60s
          rules:
            - alert: PodCrashLooping
              expr: rate(kube_pod_container_status_restarts_total[5m]) * 60 * 5 >= 2
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash-looping"
                description: >-
                  Container {{ $labels.container }} is restarting. {{ $value }} is what
                  rate(kube_pod_container_status_restarts_total[5m]) extrapolates over those five
                  minutes and multiplies back up, so it is a decimal estimate of the restart count
                  and not a counted number of restarts.

            - alert: PodOOMKilled
              expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
              for: 1m
              labels:
                severity: critical
              annotations:
                summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} was OOMKilled"
                description: "Container {{ $labels.container }} was killed by the OOM killer."

            - alert: PodImagePullBackOff
              expr: kube_pod_container_status_waiting_reason{reason=~"ImagePullBackOff|ErrImagePull"} == 1
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} cannot pull image"
                description: "Container {{ $labels.container }}: {{ $labels.reason }}"

            - alert: PodCrashLoopBackOff
              expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} in CrashLoopBackOff"
                description: "Container {{ $labels.container }} repeatedly failing to start."

            # The one state on this platform that produces no event, no error and no timeout of
            # its own. A container that has NEVER started holds its pod in Pending while it lasts,
            # so PodStuckPending below would reach the same pod five minutes later; its `unless`
            # clause takes the pod out while every waiting container of it carries a reason another
            # rule of this group owns, which for a pod that is only creating its containers leaves
            # it to this rule alone. The two DO meet on a pod whose second container waits for a
            # reason nobody owns, and then each names its own half. A container being RE-created
            # after a restart never meets PodStuckPending at all: kubelet's getPhase counts a
            # waiting container whose LastTerminationState is Terminated as stopped rather than
            # waiting (kubernetes pkg/kubelet/kubelet_pods.go), so it does not hold its pod in
            # Pending, and a pod nothing else holds there never enters that rule's first operand.
            # This one says the pod HAS a node and kubelet is already working on the container,
            # which narrows the cause to what happens between those points — creating the pod
            # sandbox, fetching the image, and mounting a volume. It reads
            # kube_pod_container_status_waiting_reason, which kube-state-metrics generates over
            # p.Status.ContainerStatuses alone (internal/store/pod.go), so an INIT container kubelet
            # is still creating carries its waiting reason in a second family this rule never sees.
            #
            # The description names the IMAGE REF before it names the registry, because only some
            # of the pulls go through the registry. Every image this platform BUILDS is pulled by
            # its <registryHost>/<name>:<tag> ref, so the registry is in the path of those; every
            # third-party image is pulled straight from the public registry its ref names, and
            # that includes the registry's own zot image — ghcr.io/project-zot/zot-linux-amd64 in
            # clusters/inventories/registry/values-common.yaml, which is the pod this rule's
            # description would otherwise send an operator to read the logs of while it is the pod
            # that is not up. On a cluster that does not host the registry, containerd mirrors
            # docker.io to it as well, and that mirror falls back to Docker Hub when the registry
            # does not ANSWER, which does not cover a request that hangs instead of refusing.
            # Measured once at 25 minutes with Events: <none>, on the cluster that hosts the
            # registry, ended by restarting the registry.
            #
            # THIS RULE CANNOT FIRE DURING A FIRST INSTALLATION. The registry is syncWave 7 and
            # this stack is syncWave 30 (clusters/inventories/*/app.yaml), so every application
            # between them pulls its images before Prometheus exists. What covers that window is
            # the bound in clusters/inventories/registry/values-common.yaml, which turns a fetch
            # that will not finish into a failed pull kubectl itself reports.
            - alert: PodStuckContainerCreating
              expr: kube_pod_container_status_waiting_reason{reason="ContainerCreating"} == 1
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been ContainerCreating for 10+ minutes"
                description: >-
                  Container {{ $labels.container }} is scheduled and kubelet has been trying to
                  create it for over 10 minutes. Read the pod's events first, because a volume
                  that will not mount says so there. An empty event list points at the image
                  fetch, and the container's image ref says which registry is being waited on: a
                  ref naming this platform's own registry host goes through the registry, while a
                  ref naming ghcr.io, quay.io, registry.k8s.io or docker.io is pulled from that
                  public registry directly — except on a cluster whose containerd mirrors
                  docker.io to the registry. For a ref that does go through the registry, read
                  `kubectl -n registry logs -l app.kubernetes.io/name=app --tail=100`: "image
                  already demanded, waiting on channel" says a fetch is in progress and every
                  later request for that same image is queued behind it. Restarting the registry
                  deployment drops that queue, which lives only in the pod's memory, so the next
                  request starts a fetch of its own.

            # This rule stands over everything about a Pending pod that no other rule of THIS group
            # reports, and the exclusion is what keeps it off what they do. It keeps it off nothing
            # else. kube-prometheus-stack ships KubePodNotReady, which selects
            # phase=~"Pending|Unknown" with no exclusion at all, at the same `for: 15m` and the same
            # severity: warning, and defaultRules.disabled below turns off RedisMemoryPressure and
            # nothing else — so the operator is told about the same pod at the same minute whatever
            # this exclusion does, and what it saves is a second line in this group rather than a
            # page. hostyour-cloud#119.
            #
            # The ALERT is per pod, because kube_pod_status_phase carries no container dimension.
            # The JOIN is on (namespace, pod), which is not the narrowest available:
            # kube-state-metrics puts `namespace`, `pod` AND `uid` on every pod metric family
            # (wrapPodFunc merging descPodLabelsDefaultLabels, internal/store/pod.go), so both
            # operands carry `uid` too, and upstream KubePodNotReady narrows the same kind of join
            # with `cluster` instead. What the wider join can match is a phase series and a
            # waiting-reason series belonging to two DIFFERENT pods that share a namespace and a
            # name, which takes a second cluster's series in this Prometheus:
            # enableRemoteWriteReceiver is false below, so it accepts none.
            #
            # The DECISION to exclude is per container, and the nested `unless` is what makes
            # it so: the inner operand keeps an owned container only while the same pod has NO
            # container waiting for a reason nobody owns, so a pod is taken out only when EVERY
            # waiting container of it is already reported elsewhere.
            #
            # A single `unless on (namespace, pod)` over the reason set removes the whole pod on ONE
            # owned container, and this platform runs the pods where that is the wrong answer:
            # DaemonSet alloy runs alloy beside config-reloader and Deployment loki-gateway runs
            # nginx beside exporter, each pair pulling from a different registry, and a TaskRun of
            # clusters/inventories/image-builder/templates/tasks/buildah-build-push.yaml puts the
            # build and the push step in one pod, each with its own ExternalSecret reference. A
            # sidecar that cannot pull would take the alert off a main container stuck on something
            # nothing else reports.
            #
            # THE TWO REASON SETS ARE ONE SET WRITTEN TWICE AND HAVE TO STAY IDENTICAL. The positive
            # matcher is the reasons another rule of this group owns; the negative one is its
            # complement, the reasons nobody owns. A reason in one and not the other either silences
            # a pod nothing else reports or lets the duplicate back in. The owners: ContainerCreating
            # is PodStuckContainerCreating's, ImagePullBackOff and ErrImagePull are
            # PodImagePullBackOff's — the two halves of its own regex — and CrashLoopBackOff is
            # PodCrashLoopBackOff's. A container in CrashLoopBackOff has terminated before, so
            # kubelet's getPhase counts it as stopped and not as waiting — but the `waiting > 0`
            # branch of that switch stands ABOVE the one that reads stopped
            # (kubernetes pkg/kubelet/kubelet_pods.go), so a pod holding a CrashLoopBackOff
            # container BESIDE one that has never started stands in phase Pending and does reach
            # this rule. It takes that second container: with its other containers RUNNING the pod
            # comes out Running on the `running > 0 && unknown == 0` branch, and with EVERY container
            # crash-looping it comes out Running as well, because the stopped-only branch below ends
            # in Running whenever the restart policy will restart them.
            #
            # THE SET COVERS REGULAR CONTAINERS ONLY. kube_pod_container_status_waiting_reason is
            # generated over p.Status.ContainerStatuses; an init container's waiting reason goes to
            # kube_pod_init_container_status_waiting_reason over p.Status.InitContainerStatuses
            # (kube-state-metrics internal/store/pod.go). No rule of this group reads the second
            # family, and the reason is its stability level: the first is declared STABLE and the
            # second ALPHA, so a rule built on the second can stop matching at an upgrade with
            # nothing going red. What that costs is that an init container which cannot pull its
            # image raises no PodImagePullBackOff, and this platform holds more of them than it
            # DECLARES: postfix's fix-dkim-permissions on busybox:latest and mongodb's keyfile-perms
            # stand in the charts, while Tekton Pipelines (clusters/inventories/tekton/) puts
            # `prepare` on EVERY TaskRun pod from pkg/pod/pod.go and pulls its entrypoint image
            # straight from ghcr.io, adds `place-scripts` for a step carrying a `script:`, and adds
            # `working-dir-initializer` where a step needs its working directory made;
            # consumer-build, gate-runner and image-builder run TaskRuns. Such a pod still arrives
            # HERE, because kubelet gives every app container of a pod that HAS init containers the
            # waiting reason PodInitializing, and nothing owns that reason.
            #
            # THE EXCLUSION DOES NOT PROMISE THAT THE OWNING RULE FIRES FIRST. PodImagePullBackOff's
            # `for: 2m` runs per alert LABEL SET and `reason` is one of its labels, so a pull whose
            # reason alternates between ErrImagePull and ImagePullBackOff restarts that clock on
            # every flip. Kubelet's image backoff grows towards a cap, so a real alternation slows
            # down and the alert arrives late rather than never. Neither the flip rate a kubelet
            # actually produces nor how late the alert then arrives has been measured; what stands
            # here is the `for` semantics alone, and nothing about how often they are reached.
            #
            # What is left for this rule is a Pending pod with a container waiting for a reason
            # nobody owns, or with no container status at all. The description sends the reader to
            # the node assignment first, which is what tells those two apart.
            - alert: PodStuckPending
              expr: |-
                kube_pod_status_phase{phase="Pending"} == 1
                unless on (namespace, pod) (
                  kube_pod_container_status_waiting_reason{reason=~"ContainerCreating|ImagePullBackOff|ErrImagePull|CrashLoopBackOff"} == 1
                  unless on (namespace, pod)
                  kube_pod_container_status_waiting_reason{reason!~"ContainerCreating|ImagePullBackOff|ErrImagePull|CrashLoopBackOff"} == 1
                )
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} stuck in Pending"
                description: >-
                  The pod has been Pending for more than 15 minutes and something about it is
                  reported by no other rule of this group: a container waiting for a reason none of
                  them matches, or no container status at all. A pod drops out of this alert only
                  while EVERY waiting container of it carries ContainerCreating, ImagePullBackOff,
                  ErrImagePull or CrashLoopBackOff, which PodStuckContainerCreating,
                  PodImagePullBackOff and PodCrashLoopBackOff report — so a pod whose sidecar cannot
                  pull while another container of it is stuck on something else is named here as
                  well as there. Read
                  `kubectl describe pod -n {{ $labels.namespace }} {{ $labels.pod }}` and look at
                  the node first. With no node the scheduler could not place the pod, and the usual
                  causes are an unbound PersistentVolumeClaim, a node selector or taint no node
                  satisfies, and a namespace quota that the pod's requests exceed. With a node, read
                  the State of every container, INIT CONTAINERS INCLUDED: it names the reason, and
                  an init container's reason reaches no alert of this group. A placed pod whose
                  containers carry no status at all is a kubelet that has not reported.

            - alert: PodNotReady
              expr: kube_pod_status_ready{condition="true"} == 0 and on(namespace, pod) kube_pod_status_phase{phase="Running"} == 1
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} not ready"
                description: >-
                  The pod is Running and its READY CONDITION has not been true for 10 minutes. That
                  condition is what this reads, not a probe: kube-state-metrics writes one
                  kube_pod_status_ready series per condition value out of the pod's Ready condition,
                  so `condition="true"` is 0 while Ready is False AND while it is Unknown, and the
                  alert stands on a pod that has no readiness probe anywhere in it. A failing
                  readiness probe is one cause of a false Ready; a container that never started is
                  another, and a readinessGate no controller has set is a third. Read
                  `kubectl describe pod -n {{ $labels.namespace }} {{ $labels.pod }}` and compare
                  the pod's Conditions block with the READY column of its containers: a container
                  that is not ready names its own reason there, while a false Ready condition over
                  containers that are all ready points at a readinessGate.

            - alert: NodeDiskFillingUp
              expr: (node_filesystem_avail_bytes{mountpoint="/mnt/data"} / node_filesystem_size_bytes{mountpoint="/mnt/data"}) < 0.15
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "Node {{ $labels.instance }} disk almost full"
                description: >-
                  Less than 15% of /mnt/data is left for a non-root writer.
                  node_filesystem_avail_bytes over node_filesystem_size_bytes is the space an
                  unprivileged process can still take, so the blocks the filesystem reserves for
                  root are not in it and `df` will report a larger free figure.

    # Vault runs with the Shamir seal, so a restart of vault-0 brings it back
    # sealed and NOTHING on the cluster gets a secret until it is unsealed again —
    # ExternalSecrets stop materializing, and every onboarding step that writes to
    # Vault fails. The node's hostyour-vault-unseal.timer unseals it again
    # within a minute; these two alerts are what says so when it does not.
    #
    # TWO alerts on purpose. VaultSealed names the cause, but it needs Vault to
    # answer /v1/sys/metrics — which the seal itself could take away.
    # VaultNotServing reads kube-state-metrics instead, so it cannot be silenced by
    # the failure it reports: the readiness probe the Vault chart ships runs `vault
    # status`, which fails while sealed. A sealed Vault that stays sealed therefore
    # raises both. A Vault that cannot start raises only the second, and only once kubelet has
    # written a container status: kube_pod_container_status_ready is generated over
    # p.Status.ContainerStatuses (kube-state-metrics internal/store/pod.go), so a vault-0 that was
    # never scheduled has no series at all here and `== 0` matches nothing. That pod is
    # PodStuckPending's instead: it stands in phase Pending with no waiting container to exclude
    # it, and that rule's description sends the reader to the node assignment first.
    vault:
      enabled: true
      groups:
        - name: vault
          interval: 60s
          rules:
            - alert: VaultSealed
              expr: vault_core_unsealed == 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Vault ({{ $labels.pod }}) is SEALED — the platform is serving no secrets"
                description: >-
                  Vault reports itself sealed and the node's unsealer has not fixed it.
                  Check the unsealer on the control host: `systemctl status hostyour-vault-unseal.timer`
                  and `journalctl -u hostyour-vault-unseal -n 50`. To unseal by hand:
                  `systemctl start hostyour-vault-unseal` on that host.

            - alert: VaultNotServing
              expr: kube_pod_container_status_ready{namespace="vault", container="vault"} == 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Vault pod {{ $labels.pod }} is not serving — every ExternalSecret is stalled"
                description: >-
                  The vault container is not Ready. Its readiness probe is `vault status`,
                  so the usual cause is a sealed Vault; the other is a pod that cannot
                  start (most often a missing vault-tls Secret). Check
                  `journalctl -u hostyour-vault-unseal -n 50` first, then
                  `kubectl describe pod -n vault {{ $labels.pod }}`.

  # --------------------------------------------------------------------------
  # AlertmanagerConfig CRs.
  #
  # `platform-default` has no matchers — it's the catch-all that delivers any
  # alert not already null-routed by the global config (Watchdog / InfoInhibitor
  # / severity=info). With `emails:` omitted, the chart template falls back to
  # .Values.global.alertRecipients, which the branch program renders into
  # clusters/active/<fqdn>.yaml from the operator's alert_recipients ANSWER while the
  # install branch is generated — the installation's own mailboxes, since
  # clusters/platform/values-common.yaml is the trunk and a mailbox names one
  # installation. clusters/active/<fqdn>.yaml states the same answer as
  # alert-recipients; that is a second rendering of it and NOT what the profile
  # is read out of, so editing that field by hand reroutes nothing and the next
  # run writes the answer back over it. Generating the branch again with a
  # different answer reroutes every entry that carries no `emails` of its own —
  # an entry that carries them keeps them, which is what the per-app overrides
  # below are. The chart REFUSES to render an enabled entry that resolves to no
  # recipient, so the reroute cannot end in silence.
  #
  # Per-app overrides (e.g. mongodb → db-team@..., observability → ops@...)
  # live in each app's own values file as additional AlertmanagerConfig
  # entries with `matchers:` scoping them.
  # --------------------------------------------------------------------------
  alertmanagerConfigs:
    platform-default:
      enabled: true
      # No matchers → catches every alert that passes the null-routes.
      # No emails → falls back to .Values.global.alertRecipients.
      # The receiver name defaults to the entry key ("platform-default").

# ============================================================================
# kube-prometheus-stack
# ============================================================================
kube-prometheus-stack:
  fullnameOverride: observability

  # node-exporter: enable the systemd collector so failed host units
  # (snap.microk8s.*, kubelet, containerd) are scraped and alertable — B4 host
  # observability.
  prometheus-node-exporter:
    extraArgs:
      - --collector.systemd
      - --collector.systemd.unit-include=(snap\.microk8s\..+|kubelet|containerd|ssh)\.service

  # MicroK8s bundles etcd/controller-manager/scheduler/proxy as snap services
  # that don't expose the standard Prometheus endpoints. Disable those monitors
  # so their "Down" alerts don't constantly fire — Kubernetes overall health
  # is still visible via kube-state-metrics + node-exporter + apiserver.
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  kubeEtcd:
    enabled: false

  # Suppress built-in alert rules that are false-positive in this cluster:
  #   RedisMemoryPressure — fires on the redis_exporter pod (which itself
  #     has tiny limits), not the actual Redis. The metric labels aren't
  #     scoped to real Redis instances.
  defaultRules:
    disabled:
      RedisMemoryPressure: true

  prometheus:
    prometheusSpec:
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      retention: 15d
      # Remote-write receiver (Prometheus /api/v1/write). OFF here, which is also
      # the chart default → the CR field is omitted entirely. The master needs it
      # ON to accept the slave observability agents' remote_write, and it cannot
      # be gated by a Helm sub-chart `condition:` on
      # global.servicesLocal.observability the way the push Ingresses in
      # Chart.yaml are: it is a kube-prometheus-stack value, not a chart of ours.
      #
      # NOTHING IN THIS TREE TURNS IT ON. clusters/active/<fqdn>.yaml carries global.*
      # keys only and the branch program writes no such key, so the profile is
      # not the surface it was once set from. The only place an installation can
      # set it today is its own installation/values/observability.yaml, which the
      # ApplicationSet loads just before the profile. Until one does, the master
      # serves no /api/v1/write and the prom-push Ingress below leads to an
      # endpoint Prometheus never registered.
      enableRemoteWriteReceiver: false

  grafana:
    fullnameOverride: grafana
    admin:
      existingSecret: grafana-admin-credentials
      userKey: admin-user
      passwordKey: admin-password
    # MicroK8s hostpath doesn't allow root chown on mounted PVs — disable the
    # chown init container and let fsGroup handle ownership at mount time.
    initChownData:
      enabled: false
    securityContext:
      runAsNonRoot: true
      runAsUser: 472
      runAsGroup: 472
      fsGroup: 472
    sidecar:
      # The k8s-sidecar container fails on MicroK8s because its built-in
      # kube-apiserver CA lacks the X.509 keyUsage extension, which newer
      # Python SSL libs reject. Neither sidecar.skipTlsVerify nor the env-var
      # overrides are honored by this chart version. Since datasources are
      # fully declarative via additionalDataSources below (no runtime ConfigMap
      # discovery needed) and dashboards will be provisioned via
      # dashboardsConfigMaps, disable the sidecars entirely.
      dashboards:
        enabled: false
      datasources:
        enabled: false
    # Dashboards: each app drops a ConfigMap labelled grafana_dashboard: "1"
    # in its own namespace. Re-enable the dashboards sidecar above (and resolve
    # the MicroK8s CA issue) to have Grafana auto-discover them, or list them
    # explicitly under `dashboardsConfigMaps` here if sidecar discovery is off.
    # Provision datasources explicitly. additionalDataSources wasn't producing
    # a ConfigMap in this chart combination — explicit datasources.yaml works.
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            uid: prometheus
            access: proxy
            url: http://observability-prometheus.observability.svc.cluster.local:9090
            isDefault: true
          - name: Alertmanager
            type: alertmanager
            uid: alertmanager
            access: proxy
            url: http://observability-alertmanager.observability.svc.cluster.local:9093
            jsonData:
              implementation: prometheus
          - name: Loki
            type: loki
            uid: loki
            access: proxy
            url: http://loki-gateway.observability.svc.cluster.local
            jsonData:
              derivedFields:
                - datasourceUid: tempo
                  matcherRegex: '"traceId":"(\w+)"'
                  name: TraceID
                  url: "$${__value.raw}"
          - name: Tempo
            type: tempo
            uid: tempo
            access: proxy
            url: http://tempo.observability.svc.cluster.local:3100
            jsonData:
              tracesToLogsV2:
                datasourceUid: loki
                spanStartTimeShift: "-1h"
                spanEndTimeShift: "1h"
    ingress:
      enabled: true
      ingressClassName: public
      # THE NAME AND THE CERTIFICATE, here and not per-env: both are built out of the
      # installation's own domain, so a per-env copy would be the same line three times.
      # The comment that stood here said they were set per-env, and none of the three
      # files set them. What that cost, measured on an installation from nothing: the
      # Ingress rendered with NO host, which Traefik reads as "any name", so the
      # dashboard had neither a certificate nor an address anybody could open — while
      # the identity provider had been registering it at grafana.<domain> the whole
      # time (clusters/bootstrap/idp/blueprints/99-grafana.yaml:31).
      hosts:
        - 'grafana.{{ .Values.global.domain }}'
      tls:
        - secretName: 'observability-grafana-{{ .Values.global.env }}-tls'
          hosts:
            - 'grafana.{{ .Values.global.domain }}'

# ============================================================================
# Loki — single binary
# ============================================================================
loki:
  # Strip the "observability-test-" / "observability-prod-" release-name prefix
  # from Loki's services so consumers (Alloy write endpoint, Grafana Loki
  # datasource) can reference a stable DNS name across envs:
  #   loki.observability.svc.cluster.local
  #   loki-gateway.observability.svc.cluster.local
  fullnameOverride: loki
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    commonConfig: { replication_factor: 1 }
    storage: { type: filesystem }
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index: { prefix: index_, period: 24h }
    limits_config:
      retention_period: 336h
      allow_structured_metadata: true
      volume_enabled: true
    # Without retention_enabled the limits_config.retention_period above is
    # advisory only — Loki keeps every chunk forever. Single-binary mode runs
    # the compactor target by default, so flipping the flag is enough.
    compactor:
      retention_enabled: true
      retention_delete_delay: 2h
      delete_request_store: filesystem
  # loki 18.x (grafana-community) ships a HARD (requiredDuringScheduling) pod
  # anti-affinity by hostname on the gateway Deployment. On a single-node cluster
  # that deadlocks its RollingUpdate — the new gateway pod can't co-locate with
  # the old one on the only node and sits Pending forever. (affinity: {} doesn't
  # help — Helm coalesce keeps the chart default.) Use Recreate so the old pod
  # terminates before the new is created → only one gateway pod ever exists and
  # the anti-affinity never conflicts. rollingUpdate: null is required because
  # Recreate + a rollingUpdate block is rejected by the API server.
  gateway:
    deploymentStrategy:
      type: Recreate
      rollingUpdate: null
  singleBinary:
    replicas: 1
  read: { replicas: 0 }
  write: { replicas: 0 }
  backend: { replicas: 0 }
  chunksCache: { enabled: false }
  resultsCache: { enabled: false }
  # The Loki ruler-rules sidecar (k8s-sidecar) crashloops on MicroK8s: newer
  # Python SSL rejects the kube-apiserver CA (it lacks the X.509 keyUsage
  # extension), and skipTlsVerify is NOT honored by this chart version — the
  # same issue that forced disabling the Grafana sidecars above. No Loki ruler
  # rules are provisioned (log alerting is unused; metric alerts go via
  # prometheusRules), so disable the rules sidecar entirely.
  sidecar:
    rules:
      enabled: false
  monitoring:
    selfMonitoring: { enabled: false }
  # Top-level lokiCanary key (the chart moved it out of monitoring.lokiCanary;
  # the monitoring.lokiCanary key is now ignored). Disable the canary daemon —
  # it was spamming stdout with "<ts> pppppp..." lines that showed up in
  # Grafana's Drilldown Logs as service_name=unknown_service.
  lokiCanary:
    enabled: false
  test: { enabled: false }

# ============================================================================
# Tempo
# ============================================================================
tempo:
  # Same treatment as Loki: stable DNS name across envs.
  fullnameOverride: tempo
  tempo:
    retention: 168h
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: "0.0.0.0:4317" }
          http: { endpoint: "0.0.0.0:4318" }
  serviceMonitor: { enabled: true }

# ============================================================================
# Grafana Alloy (DaemonSet)
# ============================================================================
alloy:
  # Stable DNS name — apps send OTLP to alloy.observability.svc.cluster.local
  fullnameOverride: alloy
  controller:
    type: daemonset
    # Host journald needs /etc/machine-id (B2). /var/log/journal comes via
    # mounts.varlog below. Requires persistent journald on the host.
    volumes:
      extra:
        - name: etc-machine-id
          hostPath: { path: /etc/machine-id, type: File }
  alloy:
    configMap:
      create: false
      name: alloy-config
      key: config.alloy
    mounts:
      varlog: true
      extra:
        - name: etc-machine-id
          mountPath: /etc/machine-id
          readOnly: true
    extraPorts:
      - { name: otlp-grpc, port: 4317, targetPort: 4317, protocol: TCP }
      - { name: otlp-http, port: 4318, targetPort: 4318, protocol: TCP }

# ============================================================================
# Vault-backed secrets (ExternalSecret CRDs)
# Per-env vaultPath overrides go in values-{test,prod}.yaml.
# Per-app exporter secrets live in each app's chart, not here.
# ============================================================================
externalsecret-grafana-admin:
  externalSecret:
    enabled: true
    name: grafana-admin-credentials
    namespace: observability
    secretStoreKind: SecretStore
    targetSecretName: grafana-admin-credentials
    data:
      - secretKey: admin-user
        property: admin-user
      - secretKey: admin-password
        property: grafana-admin-password

# OIDC client_secret for Grafana's auth.generic_oauth (Authentik). The
# Grafana pod mounts the resulting K8s Secret via `envFromSecret:
# idp-oidc-grafana` — `GRAFANA_OAUTH_CLIENT_SECRET` env becomes available
# to the grafana.ini.auth.generic_oauth.client_secret reference.
externalsecret-grafana-oidc:
  externalSecret:
    enabled: true
    name: idp-oidc-grafana
    namespace: observability
    secretStoreKind: SecretStore
    targetSecretName: idp-oidc-grafana
    data:
      - secretKey: GRAFANA_OAUTH_CLIENT_SECRET
        property: grafana-client-secret

# ============================================================================
# Master receive path (D4b / I6) — rendered ONLY on the central observability
# cluster (the master). Every block below belongs to a sub-chart gated by
# `condition: global.servicesLocal.observability` in Chart.yaml, so on a
# normal full cluster (servicesLocal.observability:false) these sub-charts are not
# loaded and none of this renders — the config sits here inertly.
#
# The two Ingresses expose the master's existing Prometheus + Loki to the slave
# push agents (clusters/inventories/observability-agent, I5). Traffic is TLS (LE cert via the
# platform ClusterIssuer, added automatically by clusters/charts/ingress) and gated by a
# Traefik basic-auth Middleware. Hosts compose from global.domain (= the
# master's FQDN), matching the branch program, which points a pure slave's
# agents at prom-push./loki-push.<master-fqdn>.
# ============================================================================

# prom-push.<master-fqdn> → Prometheus service :9090, path /api/v1/write. The
# slave agent posts to <prometheusPush>/api/v1/write
# (clusters/charts/monitoring/templates/alloy-agent-config.yaml).
#
# THE PATH IT POSTS TO DOES NOT EXIST UNTIL SOMEBODY TURNS THE RECEIVER ON.
# prometheusSpec.enableRemoteWriteReceiver stands at false above, which is also
# the chart's own default, and nothing in this tree sets it — so this route
# reaches a Prometheus that never registered /api/v1/write. An installation that
# wants it sets the value in its own installation/values/observability.yaml, which the
# ApplicationSet loads just before the profile.
ingress-prom-push:
  ingress:
    enabled: true
    className: public
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      # Cross-namespace Traefik Middleware ref: <namespace>-<name>@kubernetescrd.
      # The Middleware (push-auth-middleware below) renders in THIS namespace
      # (observability) with the fixed name obs-push-auth.
      traefik.ingress.kubernetes.io/router.middlewares: observability-obs-push-auth@kubernetescrd
    host: 'prom-push.{{ .Values.global.domain }}'
    paths:
      - path: /api/v1/write
        pathType: Prefix
        serviceName: observability-prometheus
        servicePort: 9090
    tls:
      enabled: true
      secretName: 'observability-prom-push-{{ .Values.global.env }}-tls'

# loki-push.<master-fqdn> → loki-gateway service :80, path /loki/api/v1/push.
# The slave agent posts to <lokiPush>/loki/api/v1/push.
ingress-loki-push:
  ingress:
    enabled: true
    className: public
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.middlewares: observability-obs-push-auth@kubernetescrd
    host: 'loki-push.{{ .Values.global.domain }}'
    paths:
      - path: /loki/api/v1/push
        pathType: Prefix
        serviceName: loki-gateway
        servicePort: 80
    tls:
      enabled: true
      secretName: 'observability-loki-push-{{ .Values.global.env }}-tls'

# Traefik basic-auth Middleware shared by both push Ingresses. `secret` points
# at the K8s Secret obs-push-htpasswd (key `users`, htpasswd format) that the
# ExternalSecret below materializes. fullnameOverride pins the resource name so
# the Ingress annotation ref is stable across envs.
push-auth-middleware:
  fullnameOverride: obs-push-auth
  middleware:
    enabled: true
    type: basicAuth
    basicAuth:
      secretName: obs-push-htpasswd

# ExternalSecret → K8s Secret obs-push-htpasswd with a single `users` key holding
# the htpasswd line. COMPOSED HERE from the two atomic values, not read as a finished
# line: the store used to be asked for `push-htpasswd`, which nothing wrote, so this
# Secret never materialized and the middleware in front of both push endpoints had no
# credentials to check against. A store holds values; a format belongs to whoever needs
# that format.
#
# RAW ESO syntax — Helm does not template values files, so it passes through verbatim
# into the ExternalSecret where ESO evaluates it. `bcrypt` and not `htpasswd`: the
# engine's htpasswd takes three arguments, and this is the two-argument shape spelled
# out, which is what an htpasswd line is.
externalsecret-push-htpasswd:
  externalSecret:
    enabled: true
    name: obs-push-htpasswd
    namespace: observability
    secretStoreKind: SecretStore
    targetSecretName: obs-push-htpasswd
    template:
      engineVersion: v2
      data:
        users: |-
          {{ .user }}:{{ bcrypt .password }}
    data:
      - secretKey: user
        property: push-user
      - secretKey: password
        property: push-password

# Alertmanager sends mail directly via the mail relay (in-cluster, no auth required)
# — no SMTP credentials secret needed.

