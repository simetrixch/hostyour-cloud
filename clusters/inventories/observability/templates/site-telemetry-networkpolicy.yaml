{{- /*
WHO MAY OPEN THE SITE STATISTICS SERVICE: the ingress controller, which carries the public route to it,
and nothing else. Its pod is new, so no pod of this namespace relied on reaching it before this policy
selected it, and the node addresses are not named: its probes run inside the pod.

INGRESS ONLY. The service dials Loki, the API server of this cluster and the identity provider of each
tenant by its public host, which no list of destinations could name.
*/ -}}
{{- if .Values.global.servicesLocal.observability }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: site-telemetry-allow
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "site-telemetry.selectorLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "site-telemetry.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.siteTelemetry.ingressNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.siteTelemetry.port }}
{{- end }}
