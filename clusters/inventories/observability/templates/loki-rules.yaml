{{- /*
The master's log alerts, evaluated by the single-binary Loki's ruler (values-common.yaml
loki.loki.rulerConfig, mounted at /etc/loki/rules/fake) and sent to Alertmanager, whose
AlertmanagerConfig platform-default routes every alert but severity=info.

The Manager writes a failed run as one error line `"msg":"run failed"` (with runId, kind and the
masked runError), and a nightly backup that did not start as a warning "nightly backup was not
started today" (hostyour-manager server/executor/executor.ts, server/boot/nightly-backup-schedule.ts).
A run queued behind a failed or cancelled run's lock is one warning `"msg":"a run waits behind a failed
run's lock"` per waiting run and holder, with waitingRunId, holderRunId, holderFailedStep and holderError
(server/executor/queue-dispatch.ts). A failed run that wrote something keeps its locks until it is
retried, aborted or deleted, so that wait has no end of its own; a run that failed before it wrote
anything lets its locks go as it fails and is never a holder.

A digita engine writes one error line `"msg":"Engine plugin switched off after repeated failures"` (with
plugin, reason and ports) when three failed calls in a row switch an engine plugin off (digita-platform
packages/engine/src/core/plugins/engine-plugin-registry.ts, failed). For storage-s3 that leaves the tenant's
files unserved until a restart or an Administrator switches it on again.

Traefik in namespace ingress writes one JSON access line per request, with "DownstreamStatus" among its
fields (hostyour-deploy ansiwise/programs/deploy-cluster.yaml); its own log is a text line. A slave's
Alloy labels the stream with its cluster, the master's labels it with none. An ingress that wrote access
lines in the last day and none in the last hour has lost its stream, or served nobody for an hour: the
rule cannot tell the two apart. Its reach is the day: an ingress that never wrote an access line, or has
been silent longer than a day, is not named, and an alert that resolves after a day of silence has not
been fixed. The day is read every 5 minutes, not every minute, because each evaluation reads it whole.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-rules
  namespace: {{ .Release.Namespace }}
data:
  manager.yaml: |
    groups:
      - name: manager
        rules:
          - alert: ManagerRunFailed
            expr: 'sum by (kind) (count_over_time({namespace="manager"} |= "\"msg\":\"run failed\"" | json kind="kind" [15m])) > 0'
            labels:
              severity: warning
            annotations:
              summary: 'A Manager run of kind {{`{{ $labels.kind }}`}} failed'
              description: 'The run is in the Manager''s run list; its log line in Loki carries runId and runError.'
          - alert: ManagerRunWaitsBehindFailedRun
            expr: 'sum by (holderRunId) (count_over_time({namespace="manager"} |= "\"msg\":\"a run waits behind a failed run''s lock\"" | json holderRunId="holderRunId" [15m])) > 0'
            labels:
              severity: warning
            annotations:
              summary: 'A Manager run waits behind the failed run {{`{{ $labels.holderRunId }}`}}'
              description: 'The failed run wrote something before it failed, so it keeps its locks, and the waiting run stays queued until the failed run is retried, aborted or deleted on the Manager''s Runs page. Its log line in Loki carries waitingRunId, holderRunId, holderFailedStep and holderError.'
          - alert: NightlyBackupNotStarted
            expr: 'sum(count_over_time({namespace="manager"} |= "nightly backup was not started today" [1h])) > 0'
            labels:
              severity: warning
            annotations:
              summary: 'A nightly backup was not started today'
              description: 'No generation was taken tonight for that family; the Manager''s log line says why.'
  digita-engine.yaml: |
    groups:
      - name: digita-engine
        rules:
          - alert: EnginePluginSwitchedOff
            expr: 'sum by (namespace, plugin) (count_over_time({container="engine"} |= "\"msg\":\"Engine plugin switched off after repeated failures\"" | json plugin="plugin" [15m])) > 0'
            labels:
              severity: warning
            annotations:
              summary: 'Engine plugin {{`{{ $labels.plugin }}`}} in {{`{{ $labels.namespace }}`}} was switched off after repeated failures'
              description: 'What the plugin served stays unserved until the engine restarts or an Administrator switches it on under Engine Plugins; for storage-s3 every upload and file view refuses. Its log line in Loki carries plugin and ports.'
  ingress.yaml: |
    groups:
      - name: ingress
        interval: 5m
        rules:
          - alert: IngressAccessLogMissing
            expr: 'sum by (cluster) (count_over_time({namespace="ingress", container="traefik"} |= "\"DownstreamStatus\":" [1d])) unless sum by (cluster) (count_over_time({namespace="ingress", container="traefik"} |= "\"DownstreamStatus\":" [1h]))'
            labels:
              severity: warning
            annotations:
              summary: 'The ingress of {{`{{ with $labels.cluster }}{{ . }}{{ else }}the master{{ end }}`}} wrote no access line for an hour'
              description: 'Traefik wrote access lines in the last day and none in the last hour. Either nobody reached it for an hour, or its access log is lost: the access-log arguments of ds/traefik in namespace ingress, Alloy on that cluster, or its push to the master''s Loki. A silence longer than a day leaves this rule''s reach, and the alert then resolves without a fix.'
