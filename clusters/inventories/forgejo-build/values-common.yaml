secret-store:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"

# The identity of the build plane's EventListener, which creates the runs here. Named rather than
# composed, because it is another release's (clusters/inventories/image-builder).
eventListener:
  serviceAccountName: eventlistener-sa
  namespace: image-builder

# Forgejo's http Service (clusters/inventories/forgejo, fullnameOverride forgejo), which the clone
# reads from inside the cluster, never through Traefik.
forgejo:
  url: http://forgejo-http.forgejo.svc:3000

# The HTTP/API workloads of the releases forgejo-prod and plane in their app.yaml namespaces.
egress:
  forgejo:
    namespace: forgejo
    port: 3000
    podLabels:
      app.kubernetes.io/name: forgejo
      app.kubernetes.io/instance: forgejo-prod
  plane:
    namespace: plane
    port: 8000
    podLabels:
      app.name: plane-plane-api

plane:
  workspace: simplidigita
  projects:
    - prefixes: [ansiwise-]
      id: e5c01046-3739-4af7-abc4-3c13b28dd232
    - prefixes: [hostyour-]
      id: 7bbca0da-56a0-4c33-bf6d-aaef3eb327d1
    - prefixes: [simplidigita-, digita-]
      id: 252cf88e-3c7d-4b13-a444-13403ddcb976

# The image of the check before the build: bash, grep and date, the image the build plane's own
# kubectl steps run.
checkImage: alpine/k8s:1.35.6
