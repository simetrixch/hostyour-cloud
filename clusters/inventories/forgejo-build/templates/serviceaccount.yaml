{{- /*
The identity of every task pod of a run, which the PipelineRun guard requires. NO TOKEN IS MOUNTED:
the build step runs the repository's own Containerfile, privileged, and the runs need no API grant.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-sa
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: forgejo-build
    app.kubernetes.io/component: pipeline-sa
automountServiceAccountToken: false
