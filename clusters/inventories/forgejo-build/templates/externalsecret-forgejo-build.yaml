{{- /*
THE INSTALLER'S CREDENTIAL ENTRY: <env>/app/forgejo-build, with three fields in one write:
forgejo-user and forgejo-api-token (the restricted Forgejo machine user that clones, sets the commit
status and creates the release), and plane-api-token. The workspace and repository targets are
non-secret pipeline values.

deletionPolicy Delete MAKES A MISSING ENTRY NO ERROR. Until the entry is written, both
ExternalSecrets stand Ready with no Secret, so this application is Healthy and holds up no sync wave
and no redeploy, and a run that starts finds no credential and fails on it. After the write, ESO
fetches the entry once the ExternalSecrets change: the last step of a master redeploy in
hostyour-manager, refresh-external-secrets, sets the annotation hostyour.cloud/refreshRequestedAt on
every ExternalSecret of the master and names these two as waiting for their entry while it is
absent. A field missing from an entry that exists is an error, which is why the three go in in one
write.

TWO SECRETS, so each step holds only its own: forgejo-build-git carries the clone credential for
git-clone alone, and forgejo-build-tokens the API tokens, which reach the three API Tasks by key and
no build step.
*/ -}}
{{- $env := required "forgejo-build: global.env is required (platform values chain)" .Values.global.env -}}
{{- $entry := printf "%s/app/forgejo-build" $env -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-build-tokens
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: forgejo-build
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: {{ .Values.global.secretStoreName }}
    kind: SecretStore
  target:
    name: forgejo-build-tokens
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
{{- range $field := list "forgejo-api-token" "plane-api-token" }}
    - secretKey: {{ $field }}
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        key: {{ $entry }}
        property: {{ $field }}
{{- end }}
---
# The git credential store record of the clone, one line, for Forgejo's http Service.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-build-git
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: forgejo-build
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: {{ .Values.global.secretStoreName }}
    kind: SecretStore
  target:
    name: forgejo-build-git
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        GITCREDENTIALS: {{ printf "%s://{{ .user }}:{{ .token }}@%s" (urlParse .Values.forgejo.url).scheme (urlParse .Values.forgejo.url).host | quote }}
  data:
    - secretKey: user
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        key: {{ $entry }}
        property: forgejo-user
    - secretKey: token
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        key: {{ $entry }}
        property: forgejo-api-token
