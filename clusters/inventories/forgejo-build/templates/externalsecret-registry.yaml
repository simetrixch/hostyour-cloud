{{- /*
Zot pull and push credentials for the build, the same two Secrets every <unit>-build namespace holds
(clusters/inventories/consumer-build/templates/externalsecret-registry.yaml): buildah-build-push
envFroms them by name, the read-only pull identity in its build step and the push identity in its
push step alone. Both read <env>/app/registry, which stands from the cluster's first install on.
*/ -}}
{{- $env := required "forgejo-build: global.env is required (platform values chain)" .Values.global.env -}}
{{- range $secret := list (dict "name" (include "common.registryPullSecretName" $) "user" "pull-user" "password" "pull-password") (dict "name" "image-builder-registry-push" "user" "push-user" "password" "push-password") }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secret.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: forgejo-build
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
spec:
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: {{ $.Values.global.secretStoreName }}
    kind: SecretStore
  target:
    name: {{ $secret.name }}
    creationPolicy: Owner
  data:
    - secretKey: REGISTRY_USERNAME
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        key: {{ printf "%s/app/registry" $env }}
        property: {{ $secret.user }}
    - secretKey: REGISTRY_PASSWORD
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        key: {{ printf "%s/app/registry" $env }}
        property: {{ $secret.password }}
{{- end }}
