apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postfix-access
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mail
  policyTypes: [Ingress, Egress]
  ingress:
    # Namespaces allowed to talk to the mail relay on port 587 (no auth — restricted by
    # network policy only). Add your application namespaces below.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mongodb
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cronjobs
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vpn-monitoring
        # Any consumer that ATTESTED `postfix` in services[]: its queue worker
        # relays here on 587. Selected by the label the consumers ApplicationSet
        # stamps on exactly those namespaces, so this base admits "a relay client"
        # without knowing which unit of which installation that is.
        #
        # Deliberately NOT platform/db-consumer, which every onboarded namespace
        # carries and would open this no-auth relay to all of them; and not a
        # namespace NAME, which would write one installation's consumer into the
        # product. The claim is the grant: the Manager's admission policy admits
        # this label only where the stage registration attests the service, so a
        # unit cannot label itself into this selector.
        - namespaceSelector:
            matchLabels:
              platform/postfix-consumer: "true"
      ports:
        - protocol: TCP
          port: 587
  egress:
    - ports:
        - protocol: TCP
          port: 25
        - protocol: TCP
          port: 587
    {{- with .Values.relayTarget }}
    # THE ONE ENTRY THIS RELAY HANDS ITS MAIL TO, where a unit of this stage declares an SMTP entry
    # (hostyour-cloud#242): the Manager writes its address and port beside RELAYHOST into
    # installation/values/postfix-<stage>.yaml, and exactly that destination opens here — the entry
    # listens on a port of its own, which the two above do not name.
    - to:
        - ipBlock:
            cidr: {{ printf "%s/32" (required "relayTarget.address is required beside relayTarget.port — the Manager writes both into installation/values/postfix-<stage>.yaml" .address) | quote }}
      ports:
        - protocol: TCP
          port: {{ required "relayTarget.port is required beside relayTarget.address — the Manager writes both into installation/values/postfix-<stage>.yaml" .port }}
    {{- end }}
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
