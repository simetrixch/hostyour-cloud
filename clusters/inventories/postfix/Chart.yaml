apiVersion: v2
name: postfix
version: 1.0.0
description: Send-only SMTP for cluster-internal email delivery
type: application
dependencies:
  # Vendored as the folder charts/mail, upstream plus the patch in vendor/: the chart has no value for
  # `enableServiceLinks`, so the patch adds one, and it drops the chart's `icon:` address, which
  # scripts/check-mirror-consumers.sh refuses. The image turns every POSTFIX_ variable into a Postfix
  # parameter, and Kubernetes gives the pod one such variable per port of the Service postfix-<stage>.
  - name: mail
    alias: postfix
    version: 5.1.0
  - name: external-secret
    version: 1.0.0
    repository: file://../../charts/external-secret
  - name: secret-store
    version: 1.0.0
    repository: file://../../charts/secret-store
  - name: monitoring
    version: 2.0.0
    repository: file://../../charts/monitoring
  # Shared named templates (common.labels etc.) used by the external-secret
  # library chart above. Declared at APP level because Helm doesn't vendor
  # nested file:// deps — see clusters/charts/common/Chart.yaml.
  - name: common
    version: 1.0.0
    repository: file://../../charts/common
