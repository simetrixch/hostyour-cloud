mongodb:
  # replicas is set in values-common.yaml (3 on every stage); override here only
  # if this host needs a different member count.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

# mongodb-credentials ExternalSecret — reads Vault path dev/app/mongodb.
externalsecret-mongodb:
  externalSecret:
    vaultPath: dev/app/mongodb
