# PROD overrides for the observability push agent.

# Push credentials ExternalSecret — reads mount-relative Vault path
# prod/app/observability (mount = global.vaultKvMount, the shared `secret`), which is
# the entry the master's push middleware composes its htpasswd line from.
externalsecret-agent-push:
  externalSecret:
    vaultPath: prod/app/observability
