{{- if .Values.eventListener.enabled }}
{{- /*
GitHub DEPLOY-REQUEST push → the unit's own release pipeline. The ONE entry
point of the release cycle: a push of the ref deploy/<stage>/<release-tag>
fires ONE PipelineRun in the unit's build namespace. The release tag itself is
STAGE-FREE (one image per release, never one per stage) — the stage travels in
the REF and reaches the pipeline as a param; putting the same release on a
further stage is a re-push of the same tag under another stage ref, which the
pipeline's registry probe turns into a probe + bump, never a rebuild.

ROUTING carries no lookup: the unit is body.repository.name, and the name
invariant (registrations: name == basename(repoURL), enforced at the writer)
makes namespace `<unit>-build` and pipelineRef `<unit>-release` derivable from
the webhook alone. A repo that is not registered resolves to a namespace that
does not exist, so the PipelineRun creation fails and nothing is built; the
pipeline's own first task additionally compares the webhook's clone_url
fail-closed against its pinned repoURL, so a repo whose name merely COLLIDES
with a registered unit dies before any credential is in reach.

HMAC is unchanged: the built-in `github` ClusterInterceptor validates
X-Hub-Signature-256 against image-builder-webhook-secrets.github — the same
webhook secret as before.

TAG DELETION is NOT a release: GitHub sends the SAME push event when a tag is
deleted (deleted:true, after:000…0, head_commit:null, matching ref), so
without the deleted guard every deletion fires a run that can only die at
clone — a guaranteed failing PipelineRun. has()-wrapped so a payload without
the field cannot error the cel interceptor either.

The grammar in the filter is the single build-plane copy
(global.releaseTagFilter, clusters/platform/values-common.yaml) of shared/release.ts
RELEASE_TAG_RE. It MUST sit in a CEL RAW string (r'...'): the grammar contains
`\.`, which CEL's own string lexer rejects as an invalid escape — a plain
'...' fails to parse and the trigger is silently dropped on every push.
*/ -}}
apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: github-deploy-request
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: image-builder
    app.kubernetes.io/component: trigger
    provider: github
spec:
  interceptors:
    - ref:
        name: github
      params:
        - name: secretRef
          value:
            secretName: image-builder-webhook-secrets
            secretKey: github
        - name: eventTypes
          value: ["push"]
    - ref:
        name: cel
      params:
        - name: overlays
          value:
            # The unit, by the name invariant: body.repository.name IS
            # basename(repoURL) of the registration this push belongs to.
            - key: unit
              expression: body.repository.name.lowerAscii()
            # The pushed ref splits as
            # ["refs","tags","deploy","<stage>","<release-tag>"] — the filter
            # below has already proven exactly that shape, and the tag itself
            # contains no '/'.
            - key: stage
              expression: body.ref.split('/')[3]
            - key: release-tag
              expression: body.ref.split('/')[4]
            # The webhook's own claim of the repo — the pipeline's first task
            # compares it fail-closed against its pinned repoURL.
            - key: git-url
              expression: body.repository.clone_url
        - name: filter
          value: >-
            body.ref.matches(r'^refs/tags/deploy/(dev|test|prod)/{{ .Values.global.releaseTagFilter }}$') &&
            !(has(body.deleted) && body.deleted)
  bindings:
    - ref: github-deploy-request-binding
  template:
    ref: deploy-request
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: github-deploy-request-binding
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: image-builder
    app.kubernetes.io/component: trigger
    provider: github
spec:
  params:
    - name: unit
      value: $(extensions.unit)
    - name: stage
      value: $(extensions.stage)
    - name: release-tag
      value: $(extensions.release-tag)
    - name: git-url
      value: $(extensions.git-url)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: deploy-request
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: image-builder
    app.kubernetes.io/component: trigger
    provider: github
spec:
  params:
    - name: unit
    - name: stage
    - name: release-tag
    - name: git-url
  resourcetemplates:
    # ONE PipelineRun in the unit's own build namespace. The EventListener's SA
    # holds create-pipelineruns there through the per-unit grant provisioned at
    # onboarding — an unregistered unit has neither namespace nor grant, so the
    # creation fails closed.
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: $(tt.params.unit)-release-
        namespace: $(tt.params.unit)-build
        labels:
          # The ownership key every consumer-build resource carries; the
          # Manager's release watch selects runs by it.
          image-builder.io/consumer: $(tt.params.unit)
      spec:
        pipelineRef:
          name: $(tt.params.unit)-release
        taskRunTemplate:
          serviceAccountName: pipeline-sa
        timeouts:
          pipeline: 1h0m0s
        params:
          - name: release-tag
            value: $(tt.params.release-tag)
          - name: stage
            value: $(tt.params.stage)
          - name: git-url
            value: $(tt.params.git-url)
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                resources:
                  requests:
                    storage: {{ .Values.workspaces.sourceSize }}
{{- end }}
