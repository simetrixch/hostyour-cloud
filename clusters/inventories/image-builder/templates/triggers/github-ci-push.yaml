{{- if .Values.eventListener.enabled }}
{{- $owners := (default (dict) .Values.ciPush).owners -}}
{{- if not $owners }}{{ fail "image-builder: ciPush.owners is required: list the GitHub owners whose repositories run their check here" }}{{ end -}}
{{- $pinIdentity := required "image-builder: ciPush.pinIdentity is required: the git author of the release pins, which the ci trigger does not run again" (default (dict) .Values.ciPush).pinIdentity -}}
{{- $pinName := required "image-builder: ciPush.pinIdentity.name is required" $pinIdentity.name -}}
{{- $pinEmail := required "image-builder: ciPush.pinIdentity.email is required" $pinIdentity.email -}}
{{- $timeouts := (default (dict) .Values.ciPush).timeouts | default (dict) -}}
{{- $pipelineTimeout := required "image-builder: ciPush.timeouts.pipeline is required: the longest a ci run may take after its start, tasks and finally together" $timeouts.pipeline -}}
{{- $tasksTimeout := required "image-builder: ciPush.timeouts.tasks is required: the longest the tasks of a ci run may take after its start" $timeouts.tasks -}}
{{- $finallyTimeout := required "image-builder: ciPush.timeouts.finally is required: the longest the finally tasks of a ci run may take, on a clock of their own" $timeouts.finally -}}
{{- /* The stages a release reaches, from the one table of the channels: the stage files of the pins are named after them. */ -}}
{{- $stages := list -}}
{{- range $reached := values (required "image-builder: global.channelStages is required (clusters/platform/values-common.yaml): the ci trigger names the stage files of the release pins after it" .Values.global.channelStages) }}{{ range $stage := $reached }}{{ $stages = append $stages $stage }}{{ end }}{{ end -}}
{{- $booksBranch := required "image-builder: global.booksCluster is required (clusters/active/<fqdn>.yaml, the install branch of the cluster holding the master role): the ci trigger leaves that branch out" (.Values.global).booksCluster -}}
{{- /*
A GitHub push of the DEFAULT BRANCH or of a `ci/` BRANCH → the unit's own ci
pipeline. Such a push fires ONE PipelineRun `<unit>-ci-…` in the unit's build
namespace, which runs the repository's scripts/check.sh at the pushed commit,
so a red check is seen on the build plane and not only on the machine of
whoever pushed.

ONLY THE DEFAULT BRANCH runs by itself. Every other branch is judged by the
push gate on the machine that pushes it, which runs the same check, so a run
per push of an issue branch would only repeat it. The default branch is read
from the push (repository.default_branch), never named here, because each
repository names its own.

A `ci/` BRANCH is the deliberate run of any other commit, such as a planted
defect pushed as `ci/<issue>-planted-<n>` to show that the check goes red on
the build plane. The prefix is matched from refs/heads/, so a branch that only
contains `ci/` further on runs nothing.

It is NOT a release. The run is created waiting (spec.status PipelineRunPending)
and the ci run keeper (templates/ci-run-keeper.yaml) starts it while fewer than
ciRunKeeper.maxRunning ci runs run. It never passes through the release queue,
and it carries image-builder.io/ci, never image-builder.io/consumer, which the release queue and the Manager select
releases by. Tekton copies a Pipeline's labels onto its runs, so the ci
Pipeline must not carry the consumer label either
(clusters/inventories/consumer-build/templates/pipeline-ci.yaml).

ONLY A PUBLIC REPOSITORY runs a check here. A private repository's push gate on the
machine is its only check, and scripts/check.sh holds everything that check has to
prove, so a run on the build plane would only repeat it and hold the build node. The
filter reads repository.visibility of the push, at the moment of the push, so a
repository that turns public starts running and one that turns private stops, with no
list to keep. It is fail closed: a payload without the field, and a value other than
`public` (`private`, `internal`), starts nothing. The release of a private repository
is untouched, because the deploy and publish triggers below do not read it.

ONLY THE LISTED OWNERS (ciPush.owners): a repository's check is its owner's code,
run here with build-npmrc in reach, and only the listed owners have
asked for it to run on this build plane. A push from any other owner, a customer
repository registered for its releases among them, matches nothing. The deploy
trigger has no such list: every registered repository may still be released.

ROUTING is the deploy trigger's: the unit is body.repository.name, the name
invariant makes namespace `<unit>-build` and pipelineRef `<unit>-ci` derivable
from the webhook alone, an unregistered repository resolves to a namespace
that does not exist so the run is never created, and the pipeline's own first
task compares clone_url fail-closed against its pinned repoURL.

The two triggers never overlap. This filter takes refs/heads/ only, and the
deploy trigger takes refs/tags/deploy/ only, so a branch push never builds a
release and a tag push never runs the check.

DELIVERY BRANCHES are NOT pushed to check, even in a repository whose default
branch is one. The release bump force-pushes deploy/<stage> of the unit's
repository (templates/pipeline-release.yaml, the bump's place_delivery_branch)
with the release commit plus its pins, a commit that was checked on its branch
before its tag was cut.

THE BOOKS BRANCH is NOT pushed to check, even in a repository whose default
branch is the books branch. It is named after the cluster that holds the master
role (global.booksCluster), and the Manager commits to it in every repository
that carries the installation's books, the deploy repository among them:
registrations and pins, written by a program, not code a person pushed, and the
check of the trunk fails on content the books branch does not carry.

A PUSH THAT ONLY MOVES RELEASE PINS is NOT pushed to check, on the default branch. A release pins
the tag of the image it built by committing it to clusters/inventories/<app>/values-<stage>.yaml of
the default branch (templates/pipeline-release.yaml in consumer-build, the bump), after the release
run itself proved the commit it pins, so a full check of the pin commit repeats what has been proven
and holds the build node for it. The filter reads what the webhook lists for each commit of the push
(its author and committer, and added, removed, modified: paths) and never the subject, and takes the
push as a pin move only when EVERY commit comes from the identity the release bump commits with
(ciPush.pinIdentity, as author and as committer) and modifies pin files and nothing else: a person's
commit to a pin file, one other path in any commit, a pin file that is added or removed, a commit
that lists no path (the webhook lists none for an extremely large commit) or no author, and a push
whose list of commits may be cut short (20 or more) all start the run, and so does a forced
push, whose list holds only the new commits while it drops the ones it rewound. A `ci/` branch is the
deliberate run of any commit, a pin commit included. The webhook lists paths and not lines, so the
identity is what tells a pin move from an edit of another line of a pin file: someone who commits
as that identity is not told from the bump.

BRANCH DELETION is NOT a push to check: deleting a `ci/` branch sends the SAME
push event (deleted:true, after:000…0, head_commit:null), and a run for it could
only die at clone. The deleted guard is has()-wrapped so a payload without the field
cannot error the cel interceptor, and the all-zero `after` is refused on its
own because the commit is the one thing the run cannot do without.
*/ -}}
apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: github-ci-push
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: image-builder
    app.kubernetes.io/component: trigger
    provider: github
spec:
  interceptors:
    - ref:
        name: github
      params:
        - name: secretRef
          value:
            secretName: image-builder-webhook-secrets
            secretKey: github
        - name: eventTypes
          value: ["push"]
    - ref:
        name: cel
      params:
        - name: overlays
          value:
            # The unit, by the name invariant: body.repository.name IS
            # basename(repoURL) of the registration this push belongs to.
            - key: unit
              expression: body.repository.name.lowerAscii()
            # Everything after `refs/heads/` (11 characters). A branch name
            # may contain '/', so the ref is cut, not split.
            - key: branch
              expression: body.ref.substring(11)
            - key: commit
              expression: body.after
            # The commit the branch stood at before this push, all zeros for
            # a new branch: a check that compares the push against its base
            # reads it, because on a master push the merge base is the push.
            - key: before
              expression: body.before
            # The webhook's own claim of the repo — the pipeline's first task
            # compares it fail-closed against its pinned repoURL.
            - key: git-url
              expression: body.repository.clone_url
        - name: filter
          value: >-
            has(body.repository.visibility) && body.repository.visibility == 'public' &&
            (body.ref == 'refs/heads/' + body.repository.default_branch || body.ref.startsWith('refs/heads/ci/')) &&
            !body.ref.startsWith('refs/heads/deploy/') &&
            body.ref != {{ printf "refs/heads/%s" $booksBranch | squote }} &&
            !(has(body.deleted) && body.deleted) &&
            !body.after.matches(r'^0+$') &&
            !(body.ref == 'refs/heads/' + body.repository.default_branch && !(has(body.forced) && body.forced) && has(body.commits) && size(body.commits) > 0 && size(body.commits) < 20 &&
            body.commits.all(c, has(c.added) && has(c.removed) && has(c.modified) && has(c.author) && has(c.author.name) && has(c.author.email) &&
            has(c.committer) && has(c.committer.name) && has(c.committer.email) && size(c.added) == 0 && size(c.removed) == 0 && size(c.modified) > 0 &&
            c.author.name == {{ $pinName | squote }} && c.author.email == {{ $pinEmail | squote }} &&
            c.committer.name == {{ $pinName | squote }} && c.committer.email == {{ $pinEmail | squote }} &&
            c.modified.all(path, path.matches(r'^clusters/inventories/[^/]+/values-({{ $stages | uniq | sortAlpha | join "|" }})[.]yaml$')))) &&
            body.repository.owner.login in [{{ range $index, $owner := $owners }}{{ if $index }}, {{ end }}{{ $owner | squote }}{{ end }}]
  bindings:
    - ref: github-ci-push-binding
  template:
    ref: ci-push
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: github-ci-push-binding
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: image-builder
    app.kubernetes.io/component: trigger
    provider: github
spec:
  params:
    - name: unit
      value: $(extensions.unit)
    - name: branch
      value: $(extensions.branch)
    - name: commit
      value: $(extensions.commit)
    - name: before
      value: $(extensions.before)
    - name: git-url
      value: $(extensions.git-url)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: ci-push
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: image-builder
    app.kubernetes.io/component: trigger
    provider: github
spec:
  params:
    - name: unit
    - name: branch
    - name: commit
    - name: before
    - name: git-url
  resourcetemplates:
    # ONE PipelineRun in the unit's own build namespace, under the same
    # per-unit create grant the release run uses
    # (clusters/inventories/consumer-build/templates/rbac-eventlistener.yaml).
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: $(tt.params.unit)-ci-
        namespace: $(tt.params.unit)-build
        labels:
          # Not image-builder.io/consumer: the release queue counts a run
          # carrying that label as a release that holds the next one back,
          # and the Manager shows it as a release.
          image-builder.io/ci: $(tt.params.unit)
        annotations:
          # What the ci run keeper groups by: a newer push to this branch
          # replaces the older run. An annotation, because a label value
          # cannot hold the `/` of a branch name.
          image-builder.io/ci-branch: $(tt.params.branch)
      spec:
        # Created waiting: the ci run keeper starts it once a ci slot is free. Tekton starts the
        # clock of the timeouts below at the start, not at the creation, so the wait uses none of it.
        status: PipelineRunPending
        pipelineRef:
          name: $(tt.params.unit)-ci
        taskRunTemplate:
          serviceAccountName: pipeline-sa
          # Below every other pod, and counted by the quota of the build
          # namespace (clusters/inventories/consumer-build/templates/
          # resourcequota-ci.yaml): a pod over the cap waits, it does not fail.
          podTemplate:
            priorityClassName: {{ .Values.priorityClasses.ci.name }}
        # The pod of report-failure carries another class, which the quota does
        # not count. With one ci pod per unit it would otherwise wait for the
        # check of another branch, and the mail would come late. Tekton merges
        # this entry over taskRunTemplate for that one task, so its priority
        # class replaces the ci class there.
        taskRunSpecs:
          - pipelineTaskName: report-failure
            podTemplate:
              priorityClassName: {{ .Values.priorityClasses.ciReport.name }}
        # A run whose pod waits for the quota holds the tasks budget as well, because
        # its clock runs from the start of the run; the tasks carry their own
        # timeouts (templates/pipeline-ci.yaml in consumer-build), and Tekton
        # restarts a task's clock while its pod is refused for the quota.
        #
        # THE THREE ARE SET TOGETHER so that the failure mail is sent after a
        # timeout too. With the pipeline timeout alone, Tekton cancels the
        # finally tasks together with the rest when it runs out; with a budget
        # for the tasks and one for the finally tasks, a run that exhausts the
        # tasks budget still runs report-failure inside the finally budget.
        # pipeline must not be shorter than tasks plus finally. The values are
        # ciPush.timeouts, where their measurement is written, and every run
        # carries all three: a run that meets one ends, and none runs for ever.
        timeouts:
          pipeline: {{ $pipelineTimeout }}
          tasks: {{ $tasksTimeout }}
          finally: {{ $finallyTimeout }}
        params:
          - name: commit
            value: $(tt.params.commit)
          - name: before
            value: $(tt.params.before)
          - name: branch
            value: $(tt.params.branch)
          - name: git-url
            value: $(tt.params.git-url)
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                resources:
                  requests:
                    storage: {{ .Values.workspaces.sourceSize }}
{{- end }}
