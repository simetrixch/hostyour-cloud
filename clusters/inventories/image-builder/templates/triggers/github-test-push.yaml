{{- if and .Values.eventListener.enabled .Values.digitaTests.events.enabled }}
{{- $root := . -}}
{{- range $repo := .Values.digitaTests.repositories }}
{{- if ne $repo.name "digita-catalog-show" }}
apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: {{ $repo.name }}-test-push
  namespace: {{ $root.Release.Namespace }}
spec:
  interceptors:
    - ref: {name: github}
      params:
        - name: secretRef
          value: {secretName: image-builder-webhook-secrets, secretKey: github}
        - {name: eventTypes, value: [push]}
    - ref: {name: cel}
      params:
        - name: filter
          value: >-
            body.repository.full_name == {{ printf "digitaplatform/%s" $repo.name | squote }} &&
            body.repository.clone_url == {{ $repo.repositoryURL | squote }} &&
            body.repository.name == {{ $repo.name | squote }} &&
            has(body.after) && body.after.matches(r'^[a-f0-9]{40}$') &&
            body.after != '0000000000000000000000000000000000000000' &&
            !(has(body.deleted) && body.deleted) &&
            (body.ref.matches(r'^refs/tags/(deploy/(dev|test|prod)/)?{{ $root.Values.global.releaseTagFilter }}$')
{{- if eq $repo.visibility "PRIVATE" }}
            || body.ref == {{ printf "refs/heads/%s" $repo.branch | squote }}
            || body.ref.matches(r'^refs/heads/issue-[1-9][0-9]{0,8}(-[A-Za-z0-9._-]+)?$')
{{- end }}
            )
  bindings:
    - {name: unit, value: {{ $repo.name | quote }}}
    - {name: git-url, value: {{ $repo.repositoryURL | quote }}}
    - {name: commit, value: "$(body.after)"}
    - {name: ref, value: "$(body.ref)"}
  template: {ref: digita-test-push}
---
{{- end }}
{{- end }}
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: digita-test-push
  namespace: {{ .Release.Namespace }}
spec:
  params:
    - {name: unit}
    - {name: git-url}
    - {name: commit}
    - {name: ref}
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: $(tt.params.unit)-tests-
        namespace: $(tt.params.unit)-build
        labels:
          hostyour.cloud/test-managed: "true"
      spec:
        pipelineRef: {name: $(tt.params.unit)-tests}
        taskRunTemplate: {serviceAccountName: pipeline-sa}
        params:
          - {name: git-url, value: "$(tt.params.git-url)"}
          - {name: commit, value: "$(tt.params.commit)"}
          - {name: ref, value: "$(tt.params.ref)"}
        timeouts: {pipeline: 40m, tasks: 30m, finally: 10m}
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                resources:
                  requests: {storage: 10Gi}
{{- end }}
