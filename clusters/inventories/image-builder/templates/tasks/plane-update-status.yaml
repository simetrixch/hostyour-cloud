{{- /*
plane-update-status — moves the Plane work items a release names to the state Released and completes
the module named after its tag (files/plane-update-status.sh). The Pipeline forgejo-release of
clusters/inventories/forgejo-build runs it on a tag push, after the Forgejo release.

THE TOKEN, THE WORKSPACE AND THE PROJECT reach this step alone, from the run namespace's Secret named
by tokens-secret: keys plane-api-token, plane-workspace and plane-project. Plane is called inside the
cluster, through its API Service, never through Traefik.
*/ -}}
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: plane-update-status
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: image-builder
    app.kubernetes.io/component: task
spec:
  description: >-
    Move the Plane work items the commits of a release name to the state Released, and complete
    the module named after the tag.
  workspaces:
    - name: source
      description: The cloned history of the tag.
  params:
    - name: tag
      description: The pushed tag, which names the module.
      type: string
    - name: previous-commit
      description: The commit of the tag before this one, empty for the first tag.
      type: string
    - name: tokens-secret
      description: The Secret of the run namespace holding plane-api-token, plane-workspace and plane-project.
      type: string
  steps:
    - name: update-plane
      image: {{ .Values.forgejoRelease.image }}
      env:
        - name: PLANE_TOKEN
          valueFrom:
            secretKeyRef:
              name: $(params.tokens-secret)
              key: plane-api-token
        - name: PLANE_WORKSPACE
          valueFrom:
            secretKeyRef:
              name: $(params.tokens-secret)
              key: plane-workspace
        - name: PLANE_PROJECT
          valueFrom:
            secretKeyRef:
              name: $(params.tokens-secret)
              key: plane-project
        - name: PLANE_API
          value: {{ .Values.forgejoRelease.planeApi | quote }}
        - name: TAG
          value: $(params.tag)
        - name: PREVIOUS_COMMIT
          value: $(params.previous-commit)
        - name: SOURCE
          value: $(workspaces.source.path)
      script: |
{{ .Files.Get "files/plane-update-status.sh" | indent 8 }}
      computeResources:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { cpu: 200m, memory: 256Mi }
