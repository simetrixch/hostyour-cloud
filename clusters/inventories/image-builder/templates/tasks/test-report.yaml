apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: test-report
  namespace: {{ .Release.Namespace }}
spec:
  params:
    - {name: repository-url, type: string}
    - {name: commit, type: string}
    - {name: ref, type: string}
    - {name: recipe-json, type: string}
    - {name: recipe-digest, type: string}
    - {name: receipt-mode, type: string, default: "run"}
    - {name: require-success, type: string, default: "true"}
    - {name: run-id, type: string}
    - {name: run-name, type: string}
    - {name: run-namespace, type: string}
  results:
    - {name: passed, type: string}
    - {name: receipt, type: string}
  volumes:
    - name: scratch
      emptyDir: {sizeLimit: 1Gi}
  steps:
    - name: runner
      image: {{ required "tests.nodeImage is required" .Values.tests.nodeImage | quote }}
      command: [node]
      args:
        - --input-type=module
        - --eval
        - |
{{ include "image-builder.testCode" (dict "root" . "file" "files/test-report.mjs") | indent 10 }}
      env:
        - {name: TEST_REGISTRATION, value: "$(params.recipe-json)"}
        - {name: TEST_REPOSITORY_URL, value: "$(params.repository-url)"}
        - {name: TEST_COMMIT, value: "$(params.commit)"}
        - {name: TEST_REF, value: "$(params.ref)"}
        - {name: TEST_RUN_UID, value: "$(params.run-id)"}
        - {name: TEST_RUN_NAME, value: "$(params.run-name)"}
        - {name: TEST_RUN_NAMESPACE, value: "$(params.run-namespace)"}
        - name: TEST_RECIPE_DIGEST
          value: "$(params.recipe-digest)"
        - name: TEST_RUNNER_DIGEST
          value: {{ include "image-builder.testRunnerDigest" . | quote }}
        - {name: TEST_PASSED_PATH, value: "$(results.passed.path)"}
        - {name: TEST_RECEIPT_PATH, value: "$(results.receipt.path)"}
        - {name: TEST_RECEIPT_MODE, value: "$(params.receipt-mode)"}
        - {name: TEST_REQUIRE_SUCCESS, value: "$(params.require-success)"}
        - name: TEST_REPORTER_URL
          value: {{ printf "http://%s.%s.svc.cluster.local:%v" .Values.digitaTests.reporter.name .Release.Namespace .Values.digitaTests.reporter.port | quote }}
      volumeMounts:
        - {name: scratch, mountPath: /tmp}
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        privileged: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
        seccompProfile: {type: RuntimeDefault}
      computeResources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: 250m, memory: 128Mi}
