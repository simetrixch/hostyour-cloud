{{- $root := . -}}
{{- range $profile := list "node" "mongo" "mongo-redis" "report" }}
{{- if ne $profile "node" }}
---
{{- end }}
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: test-suites{{ if ne $profile "node" }}-{{ $profile }}{{ end }}
  namespace: {{ $root.Release.Namespace }}
spec:
  params:
    - {name: repository-url, type: string}
    - {name: commit, type: string}
    - {name: ref, type: string}
    - {name: recipe-json, type: string}
    - {name: recipe-digest, type: string}
    - {name: run-id, type: string}
    - {name: run-name, type: string}
    - {name: run-namespace, type: string}
  workspaces:
    - name: source
    - name: fixtures
      readOnly: true
    - name: deps
      readOnly: true
  results:
    - name: result-json
      type: string
  volumes:
{{- if ne $profile "node" }}
    - name: mongo-data
      emptyDir: {sizeLimit: 2Gi}
    - name: mongo-scratch
      emptyDir: {sizeLimit: 128Mi}
{{- if eq $profile "mongo-redis" }}
    - name: redis-scratch
      emptyDir: {sizeLimit: 128Mi}
{{- end }}
{{- end }}
    - name: scratch
      emptyDir: {sizeLimit: 10Gi}
{{- if ne $profile "node" }}
  sidecars:
{{ include "image-builder.mongoFixture" $root | indent 4 }}
{{- if eq $profile "mongo-redis" }}
{{ include "image-builder.redisFixture" $root | indent 4 }}
{{- end }}
{{- end }}
  steps:
    - name: runner
      image: {{ (ternary (printf "%s/%s" (include "common.registryHost" $root) $root.Values.tests.reportImage) $root.Values.tests.nodeImage (eq $profile "report")) | quote }}
      command: [node]
      args:
        - --input-type=module
        - --eval
        - |
{{ include "image-builder.testCode" (dict "root" $root "file" "files/test-suites.mjs") | indent 10 }}
      env:
        - {name: TEST_REGISTRATION, value: "$(params.recipe-json)"}
        - {name: TEST_REPOSITORY_URL, value: "$(params.repository-url)"}
        - {name: TEST_COMMIT, value: "$(params.commit)"}
        - {name: TEST_REF, value: "$(params.ref)"}
        - {name: TEST_RUN_UID, value: "$(params.run-id)"}
        - {name: TEST_RUN_NAME, value: "$(params.run-name)"}
        - {name: TEST_RUN_NAMESPACE, value: "$(params.run-namespace)"}
        - name: TEST_RECIPE_DIGEST
          value: "$(params.recipe-digest)"
        - name: TEST_RUNNER_DIGEST
          value: {{ include "image-builder.testRunnerDigest" $root | quote }}
        - {name: TEST_FIXTURES, value: "$(workspaces.fixtures.path)"}
        - {name: TEST_SOURCE, value: "$(workspaces.source.path)"}
        - {name: TEST_DEPENDENCIES, value: "$(workspaces.deps.path)"}
        - {name: TEST_FIXTURE_PROFILE, value: {{ $profile | quote }}}
        - {name: TEST_RESULT_PATH, value: "$(results.result-json.path)"}
      volumeMounts:
        - {name: scratch, mountPath: /tmp}
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        privileged: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
          add: [CHOWN, SETUID, SETGID, KILL]
        seccompProfile: {type: RuntimeDefault}
      computeResources:
        requests: {cpu: 250m, memory: 4Gi}
        limits: {cpu: "2", memory: 4Gi}
{{- end }}
