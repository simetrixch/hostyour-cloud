apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: test-input
  namespace: {{ .Release.Namespace }}
spec:
  params:
    - {name: repository-url, type: string}
    - {name: commit, type: string}
    - {name: ref, type: string}
    - {name: recipe-json, type: string}
    - {name: recipe-digest, type: string}
    - {name: run-id, type: string}
    - {name: run-name, type: string}
    - {name: run-namespace, type: string}
  volumes:
    - name: scratch
      emptyDir: {sizeLimit: 1Mi}
  steps:
    - name: validate
      image: {{ .Values.tests.nodeImage | quote }}
      command: [node]
      args:
        - --input-type=module
        - --eval
        - |
{{ include "image-builder.testCode" (dict "root" . "file" "files/test-input.mjs") | indent 10 }}
      env:
        - {name: TEST_VALIDATE_INPUT, value: "true"}
        - {name: TEST_REGISTRATION, value: "$(params.recipe-json)"}
        - {name: TEST_REPOSITORY_URL, value: "$(params.repository-url)"}
        - {name: TEST_COMMIT, value: "$(params.commit)"}
        - {name: TEST_REF, value: "$(params.ref)"}
        - {name: TEST_RECIPE_DIGEST, value: "$(params.recipe-digest)"}
        - {name: TEST_RUN_UID, value: "$(params.run-id)"}
        - {name: TEST_RUN_NAME, value: "$(params.run-name)"}
        - {name: TEST_RUN_NAMESPACE, value: "$(params.run-namespace)"}
        - {name: TEST_RELEASE_TAG_FILTER, value: {{ .Values.global.releaseTagFilter | quote }}}
        - {name: TEST_RUNNER_DIGEST, value: {{ include "image-builder.testRunnerDigest" . | quote }}}
      volumeMounts:
        - {name: scratch, mountPath: /tmp}
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
        seccompProfile: {type: RuntimeDefault}
      computeResources:
        requests: {cpu: 25m, memory: 64Mi}
        limits: {cpu: 100m, memory: 128Mi}
