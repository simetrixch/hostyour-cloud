{{- /*
THE CI RUN KEEPER. Every push of a default or `ci/` branch creates one ci run, and each finished run keeps its PipelineRun and
TaskRuns on the master until it is deleted. This CronJob starts a tick each minute, and the tick decides every
ciRunKeeper.decisionSeconds for ciRunKeeper.tickSeconds (five decisions, at 0, 10, 20, 30 and 40 seconds), and does these
things at each decision, to the ci runs only (the runs that carry image-builder.io/ci):

  - it cancels a run that has not finished while a newer push to the same branch has a run of its own,
    because the newer push replaces it. The branch travels on each run as the annotation
    image-builder.io/ci-branch, set by the ci-push TriggerTemplate; a label cannot hold the `/` of a
    branch name. The same patch writes the annotation image-builder.io/cancelled-by on the run: the
    commit and the run of the newest push to the branch, so the cancelled run says by which push it was
    replaced.
  - it cancels a run that has not finished and is not replaced, whose `ci/` branch no longer exists on the
    remote of the run (the parameter git-url): deleting a branch sends no push, so nothing else would end
    the runs of a deleted branch, which would hold the ci slot of their unit one after the other. A waiting
    run is cancelled outright and a started one gracefully, as above, and the patch writes the annotation
    image-builder.io/branch-deleted with the branch. The keeper reads the remote with `git ls-remote`,
    anonymously, over https, at the same time for every repository that has such a run, each within ten
    seconds; so the namespace image-builder needs a way out to github.com, and it holds no secret for it,
    which is why only public repositories run a check here (templates/triggers/github-ci-push.yaml). The
    default branch is never cancelled this way, and neither is a run of the first two minutes, which the
    remote may not list yet. The remotes are read at the first decision of a tick and their answers serve
    its other decisions. A remote that cannot be read is judged on nothing: a failure to read it fails
    the tick after the rest of the tick is done, so that the failed Job and the stalled alert show it, and
    a repository that asks for a login (a private one, or one that is gone) is named in the log and costs
    the tick nothing.
  - it starts the oldest waiting runs while fewer than ciRunKeeper.maxRunning ci runs have started and
    not finished, at most one run per build namespace and none in a namespace that has a started run,
    because the ci quota of a unit lets one task pod run (its second slot only covers the finished pod
    before it) and a second started run would hold a slot without running. The ci-push TriggerTemplate creates every ci run waiting (spec.status
    PipelineRunPending), because the memory limits of the ci pods of every unit together do not fit the
    build node: the cap is what scripts/build-contract.test.mjs adds up. A run that stays waiting carries
    the annotation image-builder.io/queued-behind with the reason (a ci run of its unit runs, or all
    slots are in use), and a waiting run that a newer push replaces is cancelled and never started. A start
    takes up to ciRunKeeper.decisionSeconds inside a tick, and up to the pause between two ticks (about 20 seconds)
    across the end of one; nothing starts while this CronJob does not run.
  - it deletes the finished runs of a build namespace beyond the newest 20, so the newest twenty keep recent failures
    readable in the Tekton Dashboard.

files/ci-run-keeper.jq decides; files/ci-run-keeper.sh applies; scripts/ci-run-keeper.test.mjs runs
the decision on planted runs. Release runs carry no image-builder.io/ci label and are never listed; the
release queue (templates/release-queue.yaml) starts those.

ITS RIGHTS. Read on PipelineRuns cluster-wide (the build namespaces come and go with the units), and
patch and delete only in each <unit>-build namespace, rendered there by clusters/inventories/consumer-build
(templates/rbac-ci-run-keeper.yaml). A patch can rewrite any field, so the admission policy
image-builder-pipelinerun-guard limits this identity on a ci run to setting spec.status Cancelled or
CancelledRunFinally together with the annotation image-builder.io/cancelled-by or
image-builder.io/branch-deleted, to
dropping the waiting flag, and to its own annotation image-builder.io/queued-behind, and a delete by it to a finished run of the unit's own ci
Pipeline.

ITS OWN END. The Job gets ciRunKeeper.tickSeconds (activeDeadlineSeconds), and no retry: the next minute is the retry. The
last decision of a tick starts ciRunKeeper.decisionSeconds before the Job's deadline, so a tick ends by itself as long as
a decision takes less than that; one that takes longer is cut by the deadline, and the next tick replays its changes. A tick that fails shows as a failed Job, and a keeper whose last success is more than ten
minutes old, or that has none, raises the alert CIRunKeeperStalled (values-common.yaml, monitoring).
*/ -}}
{{- if .Values.eventListener.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ci-run-keeper
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: image-builder
    app.kubernetes.io/component: ci-run-keeper
data:
  ci-run-keeper.jq: |
{{ .Files.Get "files/ci-run-keeper.jq" | indent 4 }}
  ci-run-keeper.sh: |
{{ .Files.Get "files/ci-run-keeper.sh" | indent 4 }}
  list-pipelineruns.sh: |
{{ .Files.Get "files/list-pipelineruns.sh" | indent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-run-keeper
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: image-builder
    app.kubernetes.io/component: ci-run-keeper
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: image-builder-ci-run-keeper-read
  labels:
    app.kubernetes.io/name: image-builder
    app.kubernetes.io/component: ci-run-keeper
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: image-builder-ci-run-keeper-read
  labels:
    app.kubernetes.io/name: image-builder
    app.kubernetes.io/component: ci-run-keeper
subjects:
  - kind: ServiceAccount
    name: ci-run-keeper
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: image-builder-ci-run-keeper-read
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ci-run-keeper
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: image-builder
    app.kubernetes.io/component: ci-run-keeper
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ required "image-builder: ciRunKeeper.tickSeconds is required" .Values.ciRunKeeper.tickSeconds }}
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: {{ .Values.ciRunKeeper.tickSeconds }}
      ttlSecondsAfterFinished: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: image-builder
            app.kubernetes.io/component: ci-run-keeper
        spec:
          serviceAccountName: ci-run-keeper
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
          containers:
            - name: ci-run-keeper
              image: {{ required "image-builder: ciRunKeeper.image is required" .Values.ciRunKeeper.image | quote }}
              command: ["bash", "/keeper/ci-run-keeper.sh"]
              env:
                - name: KEEPER_DIR
                  value: /keeper
                - name: CI_MAX_RUNNING
                  value: {{ required "image-builder: ciRunKeeper.maxRunning is required" .Values.ciRunKeeper.maxRunning | quote }}
                - name: CI_KEEPER_TICK_SECONDS
                  value: {{ .Values.ciRunKeeper.tickSeconds | quote }}
                - name: CI_KEEPER_DECISION_SECONDS
                  value: {{ required "image-builder: ciRunKeeper.decisionSeconds is required" .Values.ciRunKeeper.decisionSeconds | quote }}
                # kubectl keeps its discovery cache under HOME; the root filesystem is read only.
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              # Every remote is asked at once, by a git and a git-remote-https of their own (the larger of the two
              # measured 18 MB at its peak), so the limits hold as many of them as there are repositories with a run.
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: keeper
                  mountPath: /keeper
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
            - name: keeper
              configMap:
                name: ci-run-keeper
{{- end }}
