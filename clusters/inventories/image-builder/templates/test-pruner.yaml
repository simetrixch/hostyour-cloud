{{- if .Values.digitaTests.retention.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: digita-test-pruner
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: digita-test-pruner-code
  namespace: {{ .Release.Namespace }}
data:
  registrations.json: {{ .Values.digitaTests.repositories | toJson | quote }}
{{- range $file := list "test-contract.mjs" "test-reporter-api.mjs" "test-reporter-list.mjs" "test-retention.mjs" "test-pruner.mjs" }}
  {{ $file }}: |
{{ $.Files.Get (printf "files/%s" $file) | indent 4 }}
{{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: digita-test-pruner
  namespace: {{ .Release.Namespace }}
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: digita-test-pruner
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: pruner
              image: {{ .Values.tests.nodeImage | quote }}
              command: [node, /pruner-code/test-pruner.mjs]
              resources:
                requests: {cpu: 25m, memory: 64Mi}
                limits: {cpu: 100m, memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: code, mountPath: /pruner-code, readOnly: true}
          volumes:
            - name: code
              configMap: {name: digita-test-pruner-code}
---
# The new identity cannot use its namespace delete verb against release runs.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: digita-test-pruner-delete-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [tekton.dev]
        apiVersions: [v1]
        operations: [DELETE]
        resources: [pipelineruns]
  matchConditions:
    - name: pruner-identity
      expression: request.userInfo.username == {{ printf "system:serviceaccount:%s:digita-test-pruner" .Release.Namespace | squote }}
  validations:
    - expression: >-
        has(oldObject.metadata.labels) && oldObject.metadata.labels['hostyour.cloud/test-managed'] == 'true' &&
        has(oldObject.spec.pipelineRef) && has(oldObject.spec.pipelineRef.name) &&
        !has(oldObject.spec.pipelineRef.resolver) && !has(oldObject.spec.pipelineSpec) &&
        request.namespace.endsWith('-build') &&
        oldObject.spec.pipelineRef.name == request.namespace.substring(0, request.namespace.size() - 6) + '-tests' &&
        has(oldObject.status) && has(oldObject.status.completionTime) && has(oldObject.status.conditions) &&
        oldObject.status.conditions.exists(c, c.type == 'Succeeded' && c.status in ['True', 'False'])
      message: "the retention identity deletes only terminal managed test PipelineRuns; release and running runs are protected."
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: digita-test-pruner-delete-guard
spec:
  policyName: digita-test-pruner-delete-guard
  validationActions: [Deny, Audit]
{{- end }}
