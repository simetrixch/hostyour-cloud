{{- /*
ValidatingAdmissionPolicy on tekton.dev/v1 PipelineRuns in the per-unit build
namespaces (label hostyour.cloud/build=true — the label clusters/inventories/consumer-build
stamps on every <unit>-build namespace).

MODE: ENFORCING — validationActions is [Deny], and failurePolicy is Fail, so a
PipelineRun that breaks any clause below is refused at admission. The
namespaces it covers hold the ExternalSecret bump-git-https, i.e. the unit's
PAT plus the write PATs of hostyour-cloud and of the deploy repository; a run that reaches
them under its own definition holds the platform's GitOps credentials.

The namespaceSelector reads hostyour.cloud/build, which is admitted only on a
namespace the build fan-out writes (clusters/inventories/consumer-build/templates/
vap-namespace-build-label.yaml) — so the set of guarded namespaces cannot be
altered by whoever the guard is aimed at.

WHAT IT BINDS (CEL, fail-closed logic):
  1. only a referenced Pipeline runs: this policy requires pipelineRef;
     Tekton's fail-closed validating webhook rejects pipelineRef + pipelineSpec
     together. pipelineSpec is untyped preserved data in the upstream CRD and
     is deliberately unavailable to CEL; do not select it here.
  2. a bare spec.pipelineRef.name is required  — nothing anonymous;
  3. no resolver on pipelineRef                — no remote/cluster-resolved
     PIPELINE ref (the pipeline's own taskRefs may resolve the shared Tasks;
     this rule is about which Pipeline runs, not which Tasks it uses);
  4. taskRunTemplate.serviceAccountName == pipeline-sa — the isolation SA;
  5. the referenced Pipeline is the NAMESPACE's own: in <unit>-build only
     <unit>-release and <unit>-ci may run. This is the ownership binding — a
     PipelineRun smuggled into a foreign build namespace cannot start that
     unit's pipeline under its credentials;
  6. no taskRunSpecs entry names another ServiceAccount. Without this, clause
     4 says nothing: a per-task override picks the SA the task pods actually
     run as;
  6a. taskRunSpecs is refused altogether, with one exception: a ci run may
     carry exactly one entry, for the task report-failure, whose only field
     besides pipelineTaskName is a podTemplate that sets priorityClassName to
     the report class. That pod must not take a slot of the ci quota
     (the quota counts the ci class only), or the failure mail of a run waits
     for the check of another branch. Every other key of the entry is refused,
     among them serviceAccountName, stepSpecs, sidecarSpecs, metadata,
     computeResources and timeout, and so is any other field of its
     podTemplate;
  7. the release queue (templates/release-queue.yaml) changes a run only by
     dropping spec.status PipelineRunPending, which starts it, and by its own
     annotation image-builder.io/queued-behind. Its RBAC grant is `patch`, and a patch can rewrite any field;
     without this clause the identity that only starts runs could change what
     they run. It touches release runs only: the ci runs have their own
     identity (clause 9), so the same grant cannot be turned on them.
     Its grant also holds `delete`, for the finished release runs beyond the
     newest 20. This policy matches CREATE and UPDATE only, so which runs it
     deletes rests on files/release-queue.jq and its tests, as it does for
     the ci run keeper.
  8. the only podTemplate a run may carry sets priorityClassName, to the class
     of its pipeline: the release class on a release run, the ci class on a
     ci run. A ci run MUST carry it, because the capacity quota of the build
     namespace counts the pods of that class and no others, and a ci run
     without the class would run outside the cap. Every other field is refused,
     among them automountServiceAccountToken: pipeline-sa ships it off
     (clusters/inventories/consumer-build/templates/serviceaccount.yaml) so the
     step that runs the unit's own build holds no API credential, and a pod
     spec that sets it true overrides the ServiceAccount. The fields of a
     podTemplate are listed here one by one because CEL cannot ask an object
     which fields it has; scripts/build-contract.test.mjs checks the list
     against the Tekton CRD the repository renders.
  9. the ci run keeper (templates/ci-run-keeper.yaml) changes a run only on a
     ci run, and only in one of two ways: by setting spec.status to Cancelled, or
     as the release queue does in clause 7, by dropping spec.status
     PipelineRunPending, which starts the run, and by its own annotation
     image-builder.io/queued-behind. Its RBAC grant is `patch` and `delete`; a
     patch can rewrite any field, so without this clause the identity that only
     cancels, starts and notes could change what the runs run, and the cap on
     the ci runs that run at once could be lifted by starting a run it did not
     count. Starting a release run stays the queue's alone.
*/ -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: image-builder-pipelinerun-guard
  labels:
    app.kubernetes.io/name: image-builder
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["tekton.dev"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pipelineruns"]
  variables:
    - name: refName
      expression: >-
        (has(object.spec.pipelineRef) && has(object.spec.pipelineRef.name))
          ? object.spec.pipelineRef.name : ''
    # <unit>-build -> <unit>-release and <unit>-ci: the two pipelines this namespace owns.
    - name: ownPipelines
      expression: >-
        request.namespace.endsWith('-build')
          ? [request.namespace.substring(0, request.namespace.size() - 6) + '-release',
             request.namespace.substring(0, request.namespace.size() - 6) + '-ci'] : []
    - name: isReleaseQueue
      expression: >-
        request.userInfo.username == 'system:serviceaccount:' + {{ .Release.Namespace | squote }} + ':release-queue'
    - name: isCiRunKeeper
      expression: >-
        request.userInfo.username == 'system:serviceaccount:' + {{ .Release.Namespace | squote }} + ':ci-run-keeper'
    # Every field but spec.status and the annotations, unchanged by an update.
    - name: sameBody
      expression: >-
        request.operation != 'UPDATE' || (
          has(object.spec.pipelineRef) == has(oldObject.spec.pipelineRef) &&
          (!has(object.spec.pipelineRef) || object.spec.pipelineRef == oldObject.spec.pipelineRef) &&
          has(object.spec.params) == has(oldObject.spec.params) &&
          (!has(object.spec.params) || object.spec.params == oldObject.spec.params) &&
          has(object.spec.taskRunTemplate) == has(oldObject.spec.taskRunTemplate) &&
          (!has(object.spec.taskRunTemplate) || object.spec.taskRunTemplate == oldObject.spec.taskRunTemplate) &&
          has(object.spec.timeouts) == has(oldObject.spec.timeouts) &&
          (!has(object.spec.timeouts) || object.spec.timeouts == oldObject.spec.timeouts) &&
          has(object.spec.workspaces) == has(oldObject.spec.workspaces) &&
          (!has(object.spec.workspaces) || object.spec.workspaces == oldObject.spec.workspaces) &&
          has(object.spec.taskRunSpecs) == has(oldObject.spec.taskRunSpecs) &&
          (!has(object.spec.taskRunSpecs) || object.spec.taskRunSpecs == oldObject.spec.taskRunSpecs) &&
          has(object.spec.managedBy) == has(oldObject.spec.managedBy) &&
          (!has(object.spec.managedBy) || object.spec.managedBy == oldObject.spec.managedBy) &&
          has(object.metadata.labels) == has(oldObject.metadata.labels) &&
          (!has(object.metadata.labels) || object.metadata.labels == oldObject.metadata.labels) &&
          has(object.metadata.finalizers) == has(oldObject.metadata.finalizers) &&
          (!has(object.metadata.finalizers) || object.metadata.finalizers == oldObject.metadata.finalizers))
    - name: sameAnnotations
      expression: >-
        request.operation != 'UPDATE' || (
          has(object.metadata.annotations) == has(oldObject.metadata.annotations) &&
          (!has(object.metadata.annotations) || object.metadata.annotations == oldObject.metadata.annotations))
    # Every field but spec.status and the annotation of the queue and the keeper, unchanged by an update.
    - name: unchangedButStatus
      expression: >-
        variables.sameBody && (request.operation != 'UPDATE' || (
          (!has(object.metadata.annotations) || object.metadata.annotations.all(k, k == 'image-builder.io/queued-behind' ||
            (has(oldObject.metadata.annotations) && k in oldObject.metadata.annotations &&
             oldObject.metadata.annotations[k] == object.metadata.annotations[k]))) &&
          (!has(oldObject.metadata.annotations) || oldObject.metadata.annotations.all(k, k == 'image-builder.io/queued-behind' ||
            (has(object.metadata.annotations) && k in object.metadata.annotations)))))
    # The status stays as it was, or a waiting run is started.
    - name: startsOrKeepsStatus
      expression: >-
        request.operation != 'UPDATE' || (
          has(object.spec.status)
            ? (has(oldObject.spec.status) && object.spec.status == oldObject.spec.status)
            : (!has(oldObject.spec.status) || oldObject.spec.status == 'PipelineRunPending'))
    # The class a run of this pipeline carries in its podTemplate.
    - name: priorityClass
      expression: >-
        variables.refName.endsWith('-release')
          ? {{ .Values.priorityClasses.release.name | squote }} : {{ .Values.priorityClasses.ci.name | squote }}
    # The one per-task override a run may carry: the report class on the task report-failure of a ci run.
{{- $otherFields := list "affinity" "automountServiceAccountToken" "dnsConfig" "dnsPolicy" "enableServiceLinks" "env" "hostAliases" "hostNetwork" "hostUsers" "imagePullSecrets" "nodeSelector" "runtimeClassName" "schedulerName" "securityContext" "tolerations" "topologySpreadConstraints" "volumes" }}
{{- $otherEntryFields := list "computeResources" "metadata" "serviceAccountName" "sidecarSpecs" "stepSpecs" "timeout" }}
    - name: onlyReportOverride
      expression: >-
        !has(object.spec.taskRunSpecs) || object.spec.taskRunSpecs.size() == 0 || (
          variables.refName.endsWith('-ci') && object.spec.taskRunSpecs.size() == 1 &&
          object.spec.taskRunSpecs.all(s, has(s.pipelineTaskName) && s.pipelineTaskName == 'report-failure' &&
            {{ range $field := $otherEntryFields }}!has(s.{{ $field }}) && {{ end }}
            has(s.podTemplate) && has(s.podTemplate.priorityClassName) &&
            s.podTemplate.priorityClassName == {{ .Values.priorityClasses.ciReport.name | squote }} &&
            {{ range $index, $field := $otherFields }}{{ if $index }} && {{ end }}!has(s.podTemplate.{{ $field }}){{ end }}))
    - name: carriedPriorityClass
      expression: >-
        (has(object.spec.taskRunTemplate) && has(object.spec.taskRunTemplate.podTemplate)
            && has(object.spec.taskRunTemplate.podTemplate.priorityClassName))
          ? object.spec.taskRunTemplate.podTemplate.priorityClassName : ''
    # True when the podTemplate sets none of its fields but priorityClassName.
    - name: onlyPriorityClass
      expression: >-
        !(has(object.spec.taskRunTemplate) && has(object.spec.taskRunTemplate.podTemplate)) ||
          ({{ range $index, $field := $otherFields }}{{ if $index }} && {{ end }}!has(object.spec.taskRunTemplate.podTemplate.{{ $field }}){{ end }})
    # Every ServiceAccount a per-task override would substitute for the one in
    # taskRunTemplate.
    - name: overrideSAs
      expression: >-
        has(object.spec.taskRunSpecs)
          ? object.spec.taskRunSpecs.filter(s, has(s.serviceAccountName)).map(s, s.serviceAccountName)
          : []
  validations:
    # Native exactly-one validation: Tekton v1.12.0
    # pkg/apis/pipeline/v1/pipelinerun_validation.go:56-62.
    # Inline-only fails this required reference; inline + reference fails Tekton.
    - expression: "has(object.spec.pipelineRef) && has(object.spec.pipelineRef.name) && size(object.spec.pipelineRef.name) > 0"
      message: "spec.pipelineRef.name is required (a bare Pipeline name)."
      reason: Forbidden
    - expression: "!has(object.spec.pipelineRef) || !has(object.spec.pipelineRef.resolver)"
      message: "resolver-based / remote pipelineRef is not allowed — use a bare name."
      reason: Forbidden
    - expression: "has(object.spec.taskRunTemplate) && has(object.spec.taskRunTemplate.serviceAccountName) && object.spec.taskRunTemplate.serviceAccountName == 'pipeline-sa'"
      message: "PipelineRuns must run under taskRunTemplate.serviceAccountName: pipeline-sa."
      reason: Forbidden
    - expression: "variables.refName in variables.ownPipelines"
      message: "a build namespace runs only its own release and ci Pipelines."
      reason: Forbidden
    - expression: "variables.overrideSAs.all(n, n == 'pipeline-sa')"
      message: "taskRunSpecs may not run a task under another ServiceAccount — every task pod runs as pipeline-sa."
      reason: Forbidden
    - expression: "variables.onlyReportOverride"
      message: "per-task pod, step, sidecar, metadata and account overrides are not allowed, except the report class on the task report-failure of a ci run."
      reason: Forbidden
    - expression: "!has(object.spec.taskRunTemplate) || !has(object.spec.taskRunTemplate.podTemplate) || (variables.onlyPriorityClass && variables.carriedPriorityClass == variables.priorityClass)"
      message: "a managed run's podTemplate sets priorityClassName to the class of its pipeline and nothing else."
      reason: Forbidden
    - expression: "!variables.refName.endsWith('-ci') || variables.carriedPriorityClass == variables.priorityClass"
      message: "a ci run carries the ci priority class: the capacity quota of its build namespace counts the pods of that class only."
      reason: Forbidden
    - expression: "!has(object.metadata.labels) || object.metadata.labels.all(k, !k.startsWith('tekton.dev/') || k == 'tekton.dev/pipeline')"
      message: "caller labels may not impersonate Tekton task or pod identities."
      reason: Forbidden
    - expression: >-
        has(object.spec.workspaces) && object.spec.workspaces.size() == 1 &&
        object.spec.workspaces.all(w, w.name == 'source' &&
          !has(w.subPath) && !has(w.persistentVolumeClaim) && !has(w.secret) && !has(w.configMap) &&
          !has(w.emptyDir) && !has(w.projected) && !has(w.csi))
      message: "a managed run uses only a new source PVC, with no secret, projected, CSI or shared-claim workspace."
      reason: Forbidden
    - expression: "!variables.isReleaseQueue || (request.operation == 'UPDATE' && variables.refName.endsWith('-release') && variables.unchangedButStatus && variables.startsOrKeepsStatus)"
      message: "the release queue may only start a waiting release run or note what it waits for."
      reason: Forbidden
    - expression: "!variables.isCiRunKeeper || (request.operation == 'UPDATE' && variables.refName.endsWith('-ci') && (
        (variables.sameBody && variables.sameAnnotations && has(object.spec.status) && object.spec.status == 'Cancelled') ||
        (variables.unchangedButStatus && variables.startsOrKeepsStatus)))"
      message: "the ci run keeper may only cancel a ci run, start a waiting one, or note what it waits for."
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: image-builder-pipelinerun-guard
  labels:
    app.kubernetes.io/name: image-builder
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  policyName: image-builder-pipelinerun-guard
  # Deny, and Audit beside it so a refused run leaves a record in the audit
  # log rather than only an API error at its creator.
  validationActions:
    - Deny
    - Audit
  matchResources:
    namespaceSelector:
      matchLabels:
        hostyour.cloud/build: "true"
