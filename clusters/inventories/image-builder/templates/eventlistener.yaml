{{- if .Values.eventListener.enabled }}
{{- /*
The ONE webhook of the build plane. Two Triggers attach (templates/triggers/),
and no push matches both:
github-deploy-request — a push of the ref deploy/<stage>/<release-tag> routes
into the unit's own <unit>-release Pipeline in namespace <unit>-build, the
release cycle. github-ci-push — a push of a branch routes into the unit's own
<unit>-ci Pipeline there, which runs the repository's check. GitHub does
nothing else here: it only fires this webhook; build, push, bump, sync and
check all run in the build plane.

The Service backing the EventListener is named `el-image-builder` by Tekton's
controller (prefix `el-` + EventListener name). Our Ingress points at it.
*/ -}}
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: image-builder
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: image-builder
    app.kubernetes.io/component: eventlistener
spec:
  serviceAccountName: {{ .Values.pipeline.eventListenerServiceAccountName }}
  triggers:
    - triggerRef: github-deploy-request # deploy/<stage>/<release-tag> push → <unit>-release in <unit>-build
    - triggerRef: github-ci-push # branch push → <unit>-ci in <unit>-build
  resources:
    kubernetesResource:
      spec:
        template:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    cpu: 200m
                    memory: 256Mi
{{- end }}
