# Shared values across DEV / TEST / PROD. Per-env Vault paths in
# values-{dev,test,prod}.yaml.
#
# What lives in this namespace after the per-unit release fan-out
# (clusters/inventories/consumer-build): the EventListener + its Ingress (the ONE webhook
# entry point), the webhook HMAC Secret it verifies against, and the three
# SHARED Tasks (git-clone, credential-scan, buildah-build-push) every
# <unit>-release Pipeline resolves via the cluster resolver. The PipelineRuns
# themselves run in the per-unit <unit>-build namespaces, with per-unit
# credentials rendered there — nothing builds in this namespace any more.

pipeline:
  # SA for the EventListener pod — carries the Tekton Triggers ClusterRole
  # bindings (incl. namespace Secret read for webhook HMAC interceptor
  # secretRefs). The PipelineRun pods run in the unit namespaces under their
  # own pipeline-sa (clusters/inventories/consumer-build), never under this identity.
  eventListenerServiceAccountName: eventlistener-sa

# Workspace sizing. The `source` workspace holds the cloned source for the
# duration of one PipelineRun (PVC-backed; Kubernetes deletes the claim with
# its PipelineRun). Read by the volumeClaimTemplate of the deploy-request and
# ci-push TriggerTemplates.
workspaces:
  sourceSize: 10Gi

# WHO GOES FIRST ON THE BUILD NODE. Every release run carries the release class and every ci run the ci
# class (taskRunTemplate.podTemplate of the two TriggerTemplates; the admission policy of this chart admits
# no other pod template). The release class is above every pod without a class and the ci class below it, so
# the scheduler puts a waiting release pod ahead of a waiting ci pod. Neither class preempts: a release build
# never evicts a platform pod, and a ci pod never evicts anything. A class does not decide who the kernel
# kills when the node runs out of memory: that follows the QoS class of a pod, so the memory the ci pods may
# take is bounded by the sum of their limits instead (ciCapacity in clusters/inventories/consumer-build).
# How much ci runs at once is capped by the ResourceQuota that clusters/inventories/consumer-build renders
# in each build namespace for the ci class.
#
# ciReport is the class of the one pod of a ci run that reports its failure. It ranks like ci, and the quota
# does not count it: the quota caps the ci pods of a unit, so a report pod that took a slot could wait for the check
# of another branch, and the failure mail would come up to 20 minutes late. The ci-push TriggerTemplate gives
# it to the task report-failure alone, and the admission policy admits no other per-task pod template.
priorityClasses:
  release:
    name: image-builder-release
    value: 1000
  ci:
    name: image-builder-ci
    value: -100
  ciReport:
    name: image-builder-ci-report
    value: -100

# The GitHub owners whose repositories run their scripts/check.sh on the build plane for every
# push of the default branch (except one that only moves release pins) or of a `ci/` branch (templates/triggers/github-ci-push.yaml). A repository of any other owner is released
# through the deploy trigger as before, but its check never runs here. Required: an empty list fails
# the render. digitaplatform is the owner of the product repositories and simetrixch the owner of
# this platform's own (hostyour-*, ansiwise-*): each is an organisation of the operator, and a push
# needs write access to its repositories.
#
# WHO MOVES A RELEASE PIN. A release pins the tag of the image it built by committing it to the default branch
# as this identity, which the bump of clusters/inventories/consumer-build sets with git config
# (templates/pipeline-release.yaml; scripts/build-contract.test.mjs fails when the two differ). A push whose
# every commit comes from it, as author and as committer, and only modifies the stage files of the pins is not run
# again: the release proved the commit it pins. A person's commit to the same files is run, whatever its subject.
# The webhook names the author and the committer of a commit and not what the commit says it changed in a file,
# so the identity is what tells a pin move from an edit of another line of a pin file.
ciPush:
  owners:
    - digitaplatform
    - simetrixch
  pinIdentity:
    name: image-builder
    email: image-builder@platform

# EventListener config — exposed publicly so GitHub can call it on a branch
# push and on a deploy/<stage>/<release-tag> tag push.
eventListener:
  enabled: true

  ingress:
    enabled: true
    # Composed at chart render time as <subdomain>.<domain>
    # (e.g. build.dev.<your-domain>) using platform globals + tpl.
    subdomain: build

# ExternalSecret — the GitHub webhook signing secret. The deploy-request
# Trigger's github Interceptor validates X-Hub-Signature-256 against the
# `github` key of this Secret.
# The release queue (templates/release-queue.yaml) starts up to maxRunning releases at a time on the build
# plane, of different units: never two releases of one unit, and a publish run is a release of its unit.
# The memory budget and the pod limit of the node hold the two largest releases together with the ci runs
# (ciCapacity in clusters/inventories/consumer-build, proved by scripts/build-contract.test.mjs), which is
# why a third release waits; raising maxRunning fails that test until the budget is raised with it.
# The image is the one the release pipeline's own kubectl steps use; it carries bash, kubectl and jq.
releaseQueue:
  image: &kubectlImage alpine/k8s:1.35.6
  maxRunning: 2

# The ci run keeper (templates/ci-run-keeper.yaml) starts the waiting ci runs, cancels the ones that a
# newer push replaces and deletes the oldest finished ones with their workspace claims. It runs the same
# kubectl image as the release queue. maxRunning is the number of ci runs that run at once across all
# units, and each unit has at most one of them, because the keeper starts no second run of a unit. The memory budget
# test in scripts/build-contract.test.mjs multiplies the memory limits of a ci pod and of the report pod
# by it, and fails when the sum with the largest releases that run at once (releaseQueue.maxRunning) leaves
# the budget of ciCapacity in clusters/inventories/consumer-build.
ciRunKeeper:
  image: *kubectlImage
  maxRunning: 6

externalsecret-webhooks:
  externalSecret:
    enabled: true
    name: image-builder-webhook-secrets
    namespace: image-builder
    targetSecretName: image-builder-webhook-secrets
    data:
      - secretKey: github
        property: github-webhook-secret

# THE KEY FORGEJO SIGNS ITS DELIVERIES WITH, for the Triggers of templates/triggers/forgejo-release.yaml.
# An entry of its own and an ExternalSecret of its own, because it waits for a later act: the release
# that brings it reaches the cluster before deploy-platform-services mints <stage>/app/forgejo-webhook.
# deletionPolicy Delete makes a missing entry no error: the ExternalSecret stays Ready with no Secret,
# so this application and every sync wave after it go on, and every Forgejo delivery is refused until
# the Secret stands. A property missing from an entry that exists would be an error, which is why the
# key does not join github's entry. The Secret is fetched once the ExternalSecret changes: the last
# step of a master redeploy in hostyour-manager, refresh-external-secrets, sets the annotation
# hostyour.cloud/refreshRequestedAt on every ExternalSecret of the master.
externalsecret-forgejo-webhook:
  externalSecret:
    enabled: true
    name: image-builder-forgejo-webhook-secret
    namespace: image-builder
    targetSecretName: image-builder-forgejo-webhook-secret
    deletionPolicy: Delete
    data:
      - secretKey: forgejo
        property: forgejo-webhook-secret

# The Tasks of the Forgejo release flow (templates/tasks/forgejo-*.yaml, plane-update-status.yaml)
# call Forgejo and Plane inside the cluster, through the Services their inventories name: Forgejo's
# http Service (clusters/inventories/forgejo, fullnameOverride forgejo) and Plane's API Service
# (clusters/inventories/plane, release plane).
forgejoRelease:
  image: *kubectlImage
  forgejoApi: http://forgejo-http.forgejo.svc:3000/api/v1
  planeApi: http://plane-api.plane.svc:8000/api/v1

# Monitoring chart — Pipeline alerting. The Tekton operator's own
# ServiceMonitor lives in clusters/inventories/tekton/. The pipelinerun metrics are
# controller-wide, so these alerts cover the per-unit <unit>-build runs.
monitoring:
  prometheusRules:
    image-builder:
      enabled: true
      groups:
        - name: image-builder
          interval: 60s
          rules:
            - alert: PipelineRunFailed
              expr: increase(tekton_pipelines_controller_pipelinerun_count{status="failed"}[10m]) > 0
              for: 1m
              labels:
                severity: warning
              annotations:
                summary: "Release PipelineRun failed in last 10 minutes"
                description: "Check `tkn pipelinerun list -A`."

            - alert: PipelineRunRunningTooLong
              expr: time() - max(tekton_pipelines_controller_running_pipelineruns_count > 0) > 1800
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Release PipelineRun running > 30 minutes"
                description: "Check for stuck Buildah steps."
