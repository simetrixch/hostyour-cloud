# The Vault path the image-builder reads its webhook HMAC secret from on the dev
# stage. The build plane itself runs on the one build cluster of an installation;
# what it is stands in values-common.yaml.
externalsecret-webhooks:
  externalSecret:
    vaultPath: dev/app/image-builder

# The Vault entry the key Forgejo signs its deliveries with is read from on the dev stage.
externalsecret-forgejo-webhook:
  externalSecret:
    vaultPath: dev/app/forgejo-webhook
