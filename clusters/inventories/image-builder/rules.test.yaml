# `promtool test rules` over this chart's PrometheusRules as they render. scripts/check.sh sets
# rule_files to the rules of each stage's render before it runs this file, so it names none here.
#
# EVERY TEST READS ALERTS, NOT alert_rule_test: alert_rule_test compares the annotations byte for
# byte, so a reworded description would turn a test red while the rule is right. ALERTS carries
# the labels alone, and an alert on a run it should not name is a sample the test did not expect.
#
# THE SERIES ARE THE ONES THE METRICS REFERENCE OF THE VENDORED TEKTON RELEASE LISTS (the counter
# tekton_pipelines_controller_pipelinerun_total) and the ones clusters/inventories/observability
# makes kube-state-metrics read from tekton.dev/v1 PipelineRun (tekton_pipelinerun_*_timestamp_seconds);
# scripts/tekton-feature-flags.test.mjs holds the names. The join is the `unless on (cluster,
# namespace, pipelinerun)`: scripts/check.sh runs this file once more with cluster taken out of it
# and with the join taken out, and both runs must fail.
evaluation_interval: 1m
tests:
  - name: PipelineRunFailed alerts when the failed counter of the Tekton controller rises, and not when a run succeeds
    interval: 1m
    input_series:
      # The failed counter stands at 26 and then takes a run.
      - series: tekton_pipelines_controller_pipelinerun_total{cluster="master", status="failed"}
        values: 26x4 27x25
      # The success counter rises on every minute and the failed one of another cluster does not move.
      - series: tekton_pipelines_controller_pipelinerun_total{cluster="master", status="success"}
        values: 1+1x29
      - series: tekton_pipelines_controller_pipelinerun_total{cluster="apps1", status="failed"}
        values: 5x29
    promql_expr_test:
      - expr: ALERTS{alertname="PipelineRunFailed"}
        eval_time: 3m
      - expr: ALERTS{alertname="PipelineRunFailed"}
        eval_time: 8m
        exp_samples:
          - labels: ALERTS{alertname="PipelineRunFailed", alertstate="firing", cluster="master", status="failed", severity="warning"}
            value: 1

  - name: PipelineRunRunningTooLong alerts on the run that started more than 30 minutes ago and has not completed, not on a finished run, a young run, or a run whose name another cluster completed
    interval: 1m
    input_series:
      # shop-ci-old started at second 0 and never completed: 40 minutes old at the evaluation.
      - series: tekton_pipelinerun_start_timestamp_seconds{cluster="master", namespace="shop-build", pipelinerun="shop-ci-old"}
        values: 0x40
      # shop-ci-done started at second 0 and completed at second 600.
      - series: tekton_pipelinerun_start_timestamp_seconds{cluster="master", namespace="shop-build", pipelinerun="shop-ci-done"}
        values: 0x40
      - series: tekton_pipelinerun_completion_timestamp_seconds{cluster="master", namespace="shop-build", pipelinerun="shop-ci-done"}
        values: 600x40
      # shop-ci-young started at second 1500, so it is 15 minutes old at the evaluation.
      - series: tekton_pipelinerun_start_timestamp_seconds{cluster="master", namespace="shop-build", pipelinerun="shop-ci-young"}
        values: 1500x40
      # shop-ci-twin runs on master and has not completed there; the run of the same name on apps1 completed.
      - series: tekton_pipelinerun_start_timestamp_seconds{cluster="master", namespace="shop-build", pipelinerun="shop-ci-twin"}
        values: 0x40
      - series: tekton_pipelinerun_start_timestamp_seconds{cluster="apps1", namespace="shop-build", pipelinerun="shop-ci-twin"}
        values: 0x40
      - series: tekton_pipelinerun_completion_timestamp_seconds{cluster="apps1", namespace="shop-build", pipelinerun="shop-ci-twin"}
        values: 600x40
    promql_expr_test:
      - expr: ALERTS{alertname="PipelineRunRunningTooLong"}
        eval_time: 40m
        exp_samples:
          - labels: ALERTS{alertname="PipelineRunRunningTooLong", alertstate="firing", cluster="master", namespace="shop-build", pipelinerun="shop-ci-old", severity="warning"}
            value: 1
          - labels: ALERTS{alertname="PipelineRunRunningTooLong", alertstate="firing", cluster="master", namespace="shop-build", pipelinerun="shop-ci-twin", severity="warning"}
            value: 1

  # THE SERIES ARE kube-state-metrics' (kube_pod_container_status_restarts_total, the restarts of a container of a pod,
  # and kube_deployment_status_replicas_available), which clusters/inventories/observability scrapes. The liveness probe
  # of the keeper restarts its container when no tick has succeeded for ten minutes, so a restart is a stalled keeper.
  - name: CIRunKeeperStalled alerts when the container of the keeper restarted, and not before
    interval: 1m
    input_series:
      # The probe restarted the keeper at minute 10; its Deployment keeps one available pod throughout.
      - series: kube_pod_container_status_restarts_total{cluster="master", namespace="image-builder", pod="ci-run-keeper-a", container="ci-run-keeper"}
        values: 0x10 1x30
      - series: kube_deployment_status_replicas_available{cluster="master", namespace="image-builder", deployment="ci-run-keeper"}
        values: 1x40
    promql_expr_test:
      # Before the restart nothing fires; four minutes after it the alert is still pending.
      - expr: ALERTS{alertname="CIRunKeeperStalled", alertstate="firing"}
        eval_time: 9m
      - expr: ALERTS{alertname="CIRunKeeperStalled", alertstate="firing"}
        eval_time: 14m
      - expr: ALERTS{alertname="CIRunKeeperStalled", alertstate="firing"}
        eval_time: 17m
        exp_samples:
          - labels: ALERTS{alertname="CIRunKeeperStalled", alertstate="firing", cluster="master", namespace="image-builder", pod="ci-run-keeper-a", container="ci-run-keeper", severity="warning"}
            value: 1
      # Fifteen minutes after the restart the window holds it no longer, and the alert has cleared.
      - expr: ALERTS{alertname="CIRunKeeperStalled"}
        eval_time: 32m

  - name: CIRunKeeperStalled stays silent while the keeper runs, whatever another container of the namespace does
    interval: 1m
    input_series:
      - series: kube_pod_container_status_restarts_total{cluster="master", namespace="image-builder", pod="ci-run-keeper-a", container="ci-run-keeper"}
        values: 0x40
      - series: kube_deployment_status_replicas_available{cluster="master", namespace="image-builder", deployment="ci-run-keeper"}
        values: 1x40
      # The event listener restarting is no stalled keeper.
      - series: kube_pod_container_status_restarts_total{cluster="master", namespace="image-builder", pod="el-image-builder-a", container="event-listener"}
        values: 0+1x40
    promql_expr_test:
      - expr: ALERTS{alertname="CIRunKeeperStalled"}
        eval_time: 30m

  - name: CIRunKeeperStalled alerts when the Deployment of the keeper has no available pod
    interval: 1m
    input_series:
      - series: kube_deployment_status_replicas_available{cluster="master", namespace="image-builder", deployment="ci-run-keeper"}
        values: 0x40
    promql_expr_test:
      - expr: ALERTS{alertname="CIRunKeeperStalled", alertstate="firing"}
        eval_time: 3m
      - expr: ALERTS{alertname="CIRunKeeperStalled", alertstate="firing"}
        eval_time: 10m
        exp_samples:
          - labels: ALERTS{alertname="CIRunKeeperStalled", alertstate="firing", cluster="master", namespace="image-builder", deployment="ci-run-keeper", severity="warning"}
            value: 1

  - name: CIRunKeeperStalled alerts when the keeper is gone, a Deployment with no series at all
    interval: 1m
    input_series:
      - series: kube_deployment_status_replicas_available{cluster="master", namespace="image-builder", deployment="el-image-builder"}
        values: 1x40
    promql_expr_test:
      - expr: ALERTS{alertname="CIRunKeeperStalled", alertstate="firing"}
        eval_time: 3m
      - expr: ALERTS{alertname="CIRunKeeperStalled", alertstate="firing"}
        eval_time: 10m
        exp_samples:
          - labels: ALERTS{alertname="CIRunKeeperStalled", alertstate="firing", namespace="image-builder", deployment="ci-run-keeper", severity="warning"}
            value: 1
