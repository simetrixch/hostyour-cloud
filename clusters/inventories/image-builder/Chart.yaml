apiVersion: v2
name: image-builder
version: 1.0.0
description: The build plane's shared surface — the EventListener + deploy-request Trigger (the ONE webhook entry point of the release cycle) and the 3-Task library (git-clone -> credential-scan -> buildah-build-push) every <unit>-release Pipeline resolves via the cluster resolver. The per-unit pipelines, namespaces and credentials are rendered by clusters/inventories/consumer-build; images push to the GitOps-managed Zot registry at clusters/inventories/registry/ under their FLAT build names.
type: application

dependencies:
  # Pulls the GitHub webhook signing secret from Vault into the Secret the
  # deploy-request Trigger's github Interceptor verifies X-Hub-Signature-256
  # against.
  - name: external-secret
    version: 1.0.0
    repository: file://../../charts/external-secret
    alias: externalsecret-webhooks

  # Per-namespace SecretStore (visible as an ArgoCD-managed resource).
  - name: secret-store
    version: 1.0.0
    repository: file://../../charts/secret-store

  # PrometheusRules + ServiceMonitor for the build pipeline.
  - name: monitoring
    version: 2.0.0
    repository: file://../../charts/monitoring

  # Shared named templates (common.labels etc.) used by every library chart
  # above. Declared at APP level because Helm doesn't vendor nested file://
  # deps — see clusters/charts/common/Chart.yaml for the consumption rule.
  - name: common
    version: 1.0.0
    repository: file://../../charts/common
