{{- /*
THE PUSH IDENTITY THE SEED OF A FIRST OWNER'S MASTER PUSHES WITH. On a first installation of the owner's
master, lifecycle/driver.sh fills this zot from the images it imported into the node, once zot answers, and
reads this Secret for the login: push-user and push-password at secret/<stage>/app/registry, the same entry
externalsecret-htpasswd composes zot's password file from, through this namespace's own SecretStore. The
driver writes the decoded value into a root-only file and hands skopeo its path, so the value is never an
argument. The auths key is common.registryHost, the host the seed pushes to. The backquoted braces below
are the operator's own template (engineVersion v2), which Helm passes through as raw strings.
*/ -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-seed-push
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  # The platform-wide delivery rule, stated in full in clusters/charts/external-secret/templates/externalsecret.yaml:
  # the Secret is written when this ExternalSecret is deployed or changed and when the Secret is deleted.
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: {{ .Values.global.secretStoreName }}
    kind: SecretStore
  target:
    name: registry-seed-push
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |-
          {"auths":{"{{ include "common.registryHost" . }}":{"auth":"{{ `{{ printf "%s:%s" .user .pass | b64enc }}` }}"}}}
  data:
    - secretKey: user
      remoteRef:
        key: {{ printf "%s/app/registry" .Values.global.env }}
        property: push-user
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: pass
      remoteRef:
        key: {{ printf "%s/app/registry" .Values.global.env }}
        property: push-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
