# Zot OCI registry — shared values across all stages.
#
# In every stage's catalog; deployed on exactly ONE build cluster (app.yaml says
# runsOn: master), because promote test->prod reuses the SAME built image. Its
# own hostname is zot.<domain>; every OTHER cluster addresses it via
# global.endpoints.registry.host.
#
# Push:  image-builder/buildah-build-push logs in with push-user from Vault.
# Pull:  any workload that consumes a registry image gets an imagePullSecret
#        of its own — each app carries an ExternalSecret template that reads
#        secret/<env>/app/registry/pull-dockerconfigjson into its namespace.

# ----- Zot pod (Deployment + Service via clusters/charts/deployment/) ----------------
app:
  image:
    # Single-binary OCI registry. Tag MUST match Chart.yaml appVersion above.
    repository: ghcr.io/project-zot/zot-linux-amd64
    tag: "v2.1.18"
    pullPolicy: IfNotPresent
  replicas: 1
  podAnnotations:
    # Bump when config.json below changes so ArgoCD rolls the zot pod and it
    # re-reads the file — zot loads config ONLY at startup, and a ConfigMap mount
    # update alone does not restart it. Value is arbitrary; changing it = a roll.
    hostyour.cloud/config-revision: "sync-timeout-bounds-the-on-demand-fetch"
  # Recreate (not RollingUpdate) — the image-store PVC is RWO and Zot
  # holds an exclusive boltdb file lock on /var/lib/registry/cache.db.
  # With RollingUpdate, the new pod fails to start until the old pod
  # releases the lock, and Tekton's healthcheck timeout fires.
  strategy:
    type: Recreate
  # Zot listens on 5000 by default; matched in configFiles.config.json below.
  containerPort: 5000
  service:
    enabled: true
    type: ClusterIP
    port: 5000

  # Zot reads its config from /etc/zot/config.json. The command line is just
  # `zot serve <config-path>`; the default ENTRYPOINT in the image runs zot.
  args:
    - "serve"
    - "/etc/zot/config.json"

  volumeMounts:
    # htpasswd Secret (materialized by externalsecret-htpasswd) — Zot's
    # http.auth.htpasswd.path reads this file.
    - name: htpasswd
      mountPath: /secret
      readOnly: true
    # Inline ConfigMap → /etc/zot/config.json
    - name: config
      mountPath: /etc/zot
      readOnly: true
    # Persistent image + DB store.
    - name: data
      mountPath: /var/lib/registry
    # Docker Hub sync credentials (materialized by externalsecret-sync-credentials);
    # Zot's extensions.sync.credentialsFile reads /sync/credentials.json.
    - name: sync-credentials
      mountPath: /sync
      readOnly: true

  volumes:
    - name: htpasswd
      secret:
        secretName: zot-htpasswd
    - name: config
      configMap:
        name: zot-config
    - name: sync-credentials
      secret:
        secretName: zot-sync-credentials
        # OPTIONAL, because what it holds is optional. An installation with no Docker Hub account
        # writes no such credentials, and the mirror in front of that registry then pulls
        # anonymously — rate-limited and working, which is the documented fallback. Mounted as
        # required, the whole registry does not start for want of a credential nobody promised, and
        # what an operator sees is a platform with no registry rather than a rate limit.
        optional: true
    - name: data
      persistentVolumeClaim:
        claimName: zot-data

  # Plain TCP probe — Zot's /v2/ requires auth when configured, so a TCP
  # connect is the simplest indicator that the process is listening.
  livenessProbe:
    tcpSocket:
      port: 5000
    initialDelaySeconds: 10
    periodSeconds: 15
  readinessProbe:
    tcpSocket:
      port: 5000
    initialDelaySeconds: 5
    periodSeconds: 5

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      # Pushes / GC bursts can be CPU-heavy on large layers; one full core
      # is a reasonable ceiling for a low-traffic dev registry.
      cpu: "1"
      memory: "1Gi"

# ----- Image + DB storage ---------------------------------------------------
pvc:
  pvc:
    enabled: true
    name: zot-data
    accessModes:
      - ReadWriteOnce
    # storageClassName intentionally omitted — falls back to
    # .Values.global.storageClass (microk8s-hostpath on the platform default).
    storageSize: "50Gi"

# ----- Public Ingress (zot.<CLUSTER_FQDN>) ---------------------------------
# `host` + service name + TLS secret name use Helm tpl to pull
# .Values.global.env and .Values.global.domain at render time — so the build
# cluster serves its registry at its own zot.<domain>. Deployed only where
# app.yaml's runsOn: master admits it (the ONE build cluster).
#
# Zot's bundled web UI is served from the SAME hostname (extensions.ui.enable
# = true in config.json below); no second hostname needed.
ingress:
  ingress:
    enabled: true
    className: public
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    host: 'zot.{{ .Values.global.domain }}'
    paths:
      - path: /
        pathType: Prefix
        serviceName: 'registry-{{ .Values.global.env }}-app'
        servicePort: 5000
    tls:
      enabled: true
      secretName: 'registry-{{ .Values.global.env }}-tls'

# ----- Zot config.json (mounted into the pod) -------------------------------
# Access-control policy:
#   - admin     → accessControl.adminPolicy (read+create+update+delete across
#                 ALL repositories + UI "settings", GC, browse-all). Use this
#                 for interactive ops via the Zot web UI.
#   - push-user → read+create+update+delete on every repo (consumed by
#                 image-builder's buildah-build-push).
#   - pull-user → read-only on every repo (consumed by imagePullSecrets).
#   - Anonymous access disabled (defaultPolicy + anonymousPolicy both []).
# Prometheus metrics extension enabled on /metrics (scraped by the
# ServiceMonitor below). Default storage: filesystem at /var/lib/registry
# (bound to the PVC above).
#
# docker.io pull-through cache (extensions.sync, onDemand): a pull of any
# repo NOT found locally triggers an on-demand fetch from registry-1.docker.io,
# cached under the SAME repo name (library/redis, ...). Each slave's containerd
# mirrors docker.io -> this Zot (a hosts.toml the installer writes on the node),
# so the platform hits Docker Hub's anonymous rate limit once per image from the
# master instead of once per node per pull. Local repos always win (sync only
# fires on a local miss); the retention policy below also evicts stale cached
# upstream tags. Requires a Zot image built with the sync extension (the
# official ghcr.io/project-zot/zot images bundle it).
#
# ghcr.io SEED (extensions.sync, onDemand, listed FIRST): where the images of
# THIS platform come from on an installation that has never built one. The
# builds[] pins name a tag a release minted, the release pipeline pushes that
# tag here — and the pipeline exists only once a Manager has written the
# registration it is rendered from. So the Manager's own image, and the two
# images that ship with it, cannot come out of this registry the first time.
# They are published to ghcr.io/simetrixch/<build name> by the release of the
# repository they build from, and this entry fetches them on the first pull.
#
# THE LOCAL REPO NAME STAYS FLAT, which is what makes the rest of the file keep
# working: `content` maps the upstream namespace away rather than caching under
# it. zot's on-demand path inverts the rule to find the remote name of a repo it
# was asked for (GetRepoSource, pkg/extensions/sync/content.go): with
# stripPrefix true and destination "/", a pull of `manager` resolves upstream to
# `simetrixch/manager` and is stored back as `manager`. Without stripPrefix the
# repo would be `simetrixch/manager` — two segments, which is a docker.io cache
# path to the retention policy below and a name no builds[] pin can compose.
#
# The prefix MUST carry a glob. GetContentByLocalRepo matches the local name
# against the meta-character part of the prefix, so a prefix naming one repo
# outright matches the empty pattern and never fires on demand. The glob is also
# what lets one entry serve every image this platform seeds instead of one entry
# per image — and the price of that is stated plainly: any single-segment repo
# missing locally is attempted against ghcr.io/simetrixch/<name> before the pull
# fails.
#
# Listed BEFORE docker.io because on demand zot walks the registries in order
# and moves to the next one when a repo is absent there (pkg/extensions/sync/
# on_demand.go). Our flat names are not on Docker Hub, so the other order buys
# every seed pull a failed round trip first.
#
# NO CREDENTIAL, and that is a property of the packages rather than an omission:
# they are published public, so this entry pulls anonymously the way the cluster
# already pulls Tekton and headscale from the same host. credentialsFile below
# holds Docker Hub alone. Publishing them private is possible and costs a token
# in the store plus a second key in that file — and it puts the first image of
# an installation behind a credential that installation does not yet have.
#
# WHICH IS WHY credentialsFile IS WRITTEN ONLY WHERE THE FILE WILL EXIST. Zot reads
# ONE file for EVERY upstream, and a path that is named and absent fails credential
# loading for all of them — measured on a bare machine, logged once per registry as
# it starts: "couldn't get registry credentials from configured path". The file holds
# the Docker Hub login, which is off unless an installation says it has an account,
# so naming it unconditionally broke THIS entry, the one that needs no credential.
# A fresh installation could pull no new image at all, and the pod said only
# ImagePullBackOff — three systems from the line that caused it.
#
# syncTimeout IS WHAT TURNS A SLOW PULL INTO A FAILED ONE, AND ONLY A FAILED ONE IS VISIBLE.
# An on-demand fetch that has not finished shows up on the consuming pod as ContainerCreating
# with no event, no error and no timeout of its own — measured once at 25 minutes. Kubernetes
# reports a pull that FAILS very well (ImagePullBackOff, an event on the pod, and the
# PodImagePullBackOff alert in clusters/inventories/observability/values-common.yaml) and a pull
# that is merely slow not at all. So the bound below is not tuning; it is the thing that decides
# whether an operator ever sees a red field.
#
# WITHOUT THIS KEY THE BOUND IS THREE HOURS PER ENTRY. Read in zot v2.1.18, the version
# clusters/platform/versions.yaml pins: pkg/extensions/config/sync/config.go declares SyncTimeout,
# pkg/cli/server/root.go fills an unset one with syncConstants.DefaultSyncTimeout, and
# pkg/extensions/sync/constants/constants.go sets that to 3 * time.Hour. The value is used twice —
# as the context deadline around one on-demand fetch (pkg/extensions/sync/on_demand.go) and as
# http.Client.Timeout for every sync request (pkg/extensions/sync/service.go). On demand zot walks
# the entries in the order they stand here and moves to the next one when this one has nothing, so
# an unset key bounds ONE pull at ghcr.io plus docker.io = six hours.
#
# THAT IS MEASURED, AND CHECKING IT NEEDS NO CLUSTER. The zot binary of the pinned release carries
# `zot verify <config>`, which runs the same LoadConfiguration as `zot serve` with no storage, no
# port and no volume: against the config.json this file renders it answers "config file is valid".
# Acceptance is not a formality — the same command rejects "20 minutes" with
# 'Extensions.Sync.Registries[0].SyncTimeout' time: unknown unit and rejects a misspelled key with
# 'has invalid keys', so a config it accepts is one where this key was READ and parsed as a
# duration rather than skipped. `zot serve` on the same config then prints the bound it will use:
# on_demand.go logs timeout 1200000000000 ns (20m) for both entries at debug level, and
# 10800000000000 ns (3h) with the key taken out again.
#
# 20m, AND THE FLOOR UNDER IT IS THE RETRY BUDGET TWO LINES ABOVE. maxRetries 3 and retryDelay 5m
# become regclient's WithRetryLimit and WithDelay, so a single failing fetch can spend 15 minutes
# in retry delays before it has transferred anything. A syncTimeout at or below 15m would cut that
# budget off unspent, which is a second setting silently disabling a first. 20m leaves five
# minutes beyond a fully spent budget and bounds one pull at 40 minutes across both entries.
# THE NUMBER IS THE ONE THING HERE THAT IS NOT MEASURED: what it must also exceed is the slowest
# legitimate copy of the largest image over the slowest link an installation runs on, and no
# installation was running when it was chosen. An installation that pulls over a slow link raises
# it in installation/values/registry.yaml, which the ApplicationSet loads after this file.
#
# WHY THE PROBES ARE STILL A TCP CONNECT AND NOT AN HTTP CHECK. A wedged fetch does not stop zot
# serving: each request is its own goroutine, and every repo other than the one being fetched
# answers normally. So no probe against /v2/ or / can tell the two apart, and a probe that could
# would be the wrong instrument anyway — a liveness probe that restarts zot for a slow fetch would
# kill the fetch it was waiting on, and a first installation, which pulls every image cold, is
# exactly where it would fire hardest and loop.
#
# WHY THERE IS NO ALERT HERE THAT NAMES A STUCK FETCH. zot v2.1.18 publishes no sync metric at
# all: pkg/extensions/monitoring/extension.go registers http_*, repo_*, storage_lock_*,
# scheduler_* and gc_* under the zot namespace and nothing for sync, so neither a fetch in flight
# nor a fetch that failed is a number Prometheus can read. Correlating from the consuming pod
# instead does not work either: the alert would have to match the registry's own host in
# image_spec, clusters/charts/monitoring/templates/prometheusrules.yaml passes groups through
# toYaml with no tpl so the host cannot reach the expression, and on every cluster that does not
# host this registry containerd mirrors docker.io to it, which leaves a mirrored image's
# image_spec naming docker.io and not the registry it is actually fetched through. Such a matcher
# would cover our own build images and silently miss those. The rule that CAN be written does not
# name the registry and stands with the other pod-state rules in
# clusters/inventories/observability/values-common.yaml.
#
# WHY NO WARM-UP JOB. It would pull every pinned image once before the workloads do, and on a
# first installation it would meet the same cold cache and stall the same way — with the one
# difference that a Job failing is visible. That difference is bought by a second component that
# has to be told which images exist, which is clusters/platform/versions.yaml and the builds[]
# pins restated in a third place. The bound above gets the same visibility out of a key that
# already exists.
#
# RETENTION POLICIES (below) — ORDER MATTERS: zot applies the FIRST policy whose
# `repositories` glob matches a repo, so the single-segment ["*"] policy is
# listed BEFORE the ["**"] catch-all.
#   1. ["*"] — OUR images: a build name is FLAT, one segment with no owner
#      prefix, so after the registry wipe every single-segment repo is one of
#      ours. Keep ALL tags (patterns [".*"], no count) and
#      deleteUntagged false, so zot NEVER prunes one of our image tags. The
#      registry-reaper CronJob (clusters/inventories/manager) is the SOLE cleaner here: it
#      alone knows which tags are still pinned by a values-<stage>.yaml on any
#      branch, so zot's blind 50-count rule must not race it and evict a
#      referenced tag. (Blob-level GC still reclaims space after the reaper
#      deletes a manifest — storage.gc/gcDelay is independent of these
#      per-repo retention policies.)
#   2. ["**"] — the docker.io pull-through cache repos (library/**, ...): every
#      multi-segment repo is a cache path zot manages itself. Keep the 50
#      most-recently-pushed tags, deleteUntagged true.
#
# WHO MAY READ AND WHO MAY PUSH, BY NAME. accessControl below grants by account name, so the two it
# lists must be the same names the credentials carry — and the credentials get theirs out of the
# secret store, where the installer seeded them. Both sides therefore read ONE per-installation
# value: global.registryPullUser and global.registryPushUser in clusters/active/<fqdn>.yaml, written from
# the same answer that seeded the credential. clusters/charts/configmap runs tpl over this data, so the two
# expressions resolve before the file reaches zot — and they must stay Helm expressions rather than
# JSON comments, because what is below becomes config.json literally and JSON has no comments.
#
# Spelled out literally, the two disagreed the moment an operator chose a name: the credential said
# platform-pull, this policy said pull-user, and every probe against the registry answered 403 —
# authenticated and then refused, which is neither present nor absent and the one answer a probe that
# decides whether to build cannot act on.
configmap:
  configmap:
    enabled: true
    name: zot-config
    data:
      config.json: |-
        {{- if eq .Values.global.registryPullUser .Values.global.registryPushUser }}
        {{- fail (printf "global.registryPullUser and global.registryPushUser are both %q, and they are two accounts distinguished by nothing else. The password file gets two lines under one name, the matcher takes the first, and the second password authenticates nothing at all — measured: the reading credential answered 401 while the writing one answered 200, so every image pull from this registry was refused and no manifest anywhere said why. Answer them differently." .Values.global.registryPullUser) }}
        {{- end }}
        {
          "distSpecVersion": "1.1.0",
          "storage": {
            "rootDirectory": "/var/lib/registry",
            "dedupe": true,
            "gc": true,
            "gcDelay": "2h",
            "gcInterval": "1h",
            "retention": {
              "dryRun": false,
              "policies": [
                {
                  "repositories": ["*"],
                  "deleteUntagged": false,
                  "keepTags": [
                    {
                      "patterns": [".*"]
                    }
                  ]
                },
                {
                  "repositories": ["**"],
                  "deleteUntagged": true,
                  "keepTags": [
                    {
                      "patterns": [".*"],
                      "mostRecentlyPushedCount": 50
                    }
                  ]
                }
              ]
            }
          },
          "http": {
            "address": "0.0.0.0",
            "port": "5000",
            "realm": "zot",
            "auth": {
              "htpasswd": {
                "path": "/secret/htpasswd"
              }
            },
            "accessControl": {
              "adminPolicy": {
                "users": ["admin"],
                "actions": ["read", "create", "update", "delete"]
              },
              "repositories": {
                "**": {
                  "policies": [
                    {
                      "users": ["{{ .Values.global.registryPushUser }}"],
                      "actions": ["read", "create", "update", "delete"]
                    },
                    {
                      "users": ["{{ .Values.global.registryPullUser }}"],
                      "actions": ["read"]
                    }
                  ],
                  "defaultPolicy": [],
                  "anonymousPolicy": []
                }
              }
            }
          },
          "log": {
            "level": "info"
          },
          "extensions": {
            "metrics": {
              "enable": true,
              "prometheus": {
                "path": "/metrics"
              }
            },
            "search": {
              "enable": true
            },
            "ui": {
              "enable": true
            },
            "sync": {
              "enable": true,
              {{- if (index .Values "externalsecret-sync-credentials").externalSecret.enabled }}
              "credentialsFile": "/sync/credentials.json",
              {{- end }}
              "registries": [
                {
                  "urls": ["https://ghcr.io"],
                  "onDemand": true,
                  "tlsVerify": true,
                  "maxRetries": 3,
                  "retryDelay": "5m",
                  "syncTimeout": "20m",
                  "content": [
                    {
                      "prefix": "/simetrixch/*",
                      "destination": "/",
                      "stripPrefix": true
                    }
                  ]
                },
                {
                  "urls": ["https://registry-1.docker.io"],
                  "onDemand": true,
                  "tlsVerify": true,
                  "maxRetries": 3,
                  "retryDelay": "5m",
                  "syncTimeout": "20m"
                }
              ]
            }
          }
        }

# ----- ExternalSecret: htpasswd, COMPOSED from the two atomic values ----------
# Vault path is filled in by the per-env values file (vaultPath: <env>/app/registry).
#
# THE STORE HOLDS A USER AND A PASSWORD, NOT AN HTPASSWD LINE. It used to be asked for the finished
# line, which nothing wrote — so this Secret never materialized, the registry's pod could not mount
# it, and everything that pulls an image from this installation waited on a pod that would not start.
# A store is for values; a format is for whoever needs it in that format.
#
# ESO's own templating does the hashing, the same way the sync credentials below assemble their JSON.
# RAW ESO syntax: Helm does not template values files, so it passes through verbatim into the
# ExternalSecret where ESO evaluates it.
#
# BOTH ACCOUNTS, ONE LINE EACH. The access policy above grants two — one that reads and one that
# reads and writes — and a policy naming an account the password file never heard of grants nothing:
# the registry refuses the login before any policy is consulted. This file carried the reading
# account alone, so the release pipeline built its image, tagged it, and was turned away at the push
# with "invalid username/password" for an account this installation had seeded, granted and named
# everywhere except in the one file that decides who may log in.
externalsecret-htpasswd:
  externalSecret:
    enabled: true
    name: zot-htpasswd
    namespace: registry
    targetSecretName: zot-htpasswd
    template:
      engineVersion: v2
      data:
        htpasswd: |-
          {{ .pullUser }}:{{ bcrypt .pullPassword }}
          {{ .pushUser }}:{{ bcrypt .pushPassword }}
    data:
      - secretKey: pullUser
        property: pull-user
      - secretKey: pullPassword
        property: pull-password
      - secretKey: pushUser
        property: push-user
      - secretKey: pushPassword
        property: push-password

# ----- ExternalSecret: Docker Hub creds for the docker.io pull-through ---------
# ESO templates Zot's sync credentialsFile JSON from the app/registry dockerhub-user
# + dockerhub-token properties (installer-seeded) into zot-sync-credentials, mounted
# at /sync/credentials.json. vaultPath is per-env (values-<env>.yaml). Without a
# real Docker Hub token the pull-through falls back to anonymous (rate-limited).
externalsecret-sync-credentials:
  externalSecret:
    # OFF UNLESS AN INSTALLATION SAYS IT HAS A DOCKER HUB ACCOUNT, for the same reason the volume two
    # hundred lines up is mounted optional: what this holds is optional, and the fallback — pulling
    # anonymously, rate-limited — is the documented behaviour rather than a failure.
    #
    # An ExternalSecret has no per-property optionality: it names two properties and fails whole when
    # either is absent. So an installation that promised no Docker Hub account carried a secret that
    # could never sync, its app stood Degraded for as long as it existed, and the registry it was
    # about ran perfectly the entire time. What an operator reads from that is a broken registry.
    #
    # Turned on in the per-installation values beside vaultPath, which is where the rest of what one
    # installation knows about this secret already stands.
    enabled: false
    name: zot-sync-credentials
    namespace: registry
    targetSecretName: zot-sync-credentials
    # ESO's own templating (engineVersion v2): assemble the credentialsFile JSON from
    # the two pulled properties. RAW ESO syntax {{ .key }} — Helm does NOT template
    # values files, so it passes through verbatim into the ExternalSecret's template
    # where ESO (not Helm) evaluates it.
    template:
      engineVersion: v2
      data:
        credentials.json: |-
          {"registry-1.docker.io":{"username":"{{ .dockerhubUser }}","password":"{{ .dockerhubToken }}"}}
    data:
      - secretKey: dockerhubUser
        property: dockerhub-user
      - secretKey: dockerhubToken
        property: dockerhub-token


# ----- ESO SecretStore in this namespace ------------------------------------
secret-store:
  enabled: true
  name: vault-backend
  # vaultUrl is left empty here: the template falls back to
  # global.endpoints.vault.url (clusters/active/<fqdn>.yaml via the $values chain).

# ----- ServiceMonitor + alerts ----------------------------------------------
monitoring:
  serviceMonitors:
    registry:
      enabled: true
      namespaces:
        - registry
      # Matches the Service auto-created by the `app` deployment chart
      # (selector labels are app.kubernetes.io/{name=app, instance=registry-<env>}).
      matchLabels:
        app.kubernetes.io/name: app
        app.kubernetes.io/instance: 'registry-{{ .Values.global.env }}'
      endpoints:
        - port: http
          path: /metrics
          interval: 30s
  prometheusRules:
    registry:
      enabled: true
      groups:
        - name: registry
          interval: 60s
          rules:
            - alert: RegistryDown
              expr: up{job=~".*registry.*"} == 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Zot registry pod has been unreachable for 5+ minutes"
                description: "Pulls + pushes are failing platform-wide. Check `microk8s kubectl -n registry get pods,events`."

            - alert: RegistryStorageFillingUp
              expr: (kubelet_volume_stats_available_bytes{persistentvolumeclaim="zot-data"}
                     / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim="zot-data"}) < 0.20
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "Zot image-store PVC has < 20% free space"
                description: "Consider running Zot GC or growing the PVC. df-style check: kubectl -n registry exec deploy/registry-dev-app -- du -sh /var/lib/registry"
