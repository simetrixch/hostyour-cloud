name: cert-manager
project: core
syncWave: "0"
namespace: cert-manager
# Never pruned: the CRDs hold every Certificate of the cluster, and with the owner-ref flag every
# TLS Secret hangs off one. An object a later chart stops rendering is removed by an operator.
prune: "false"
createNamespace: "true"
serverSideApply: "true"
# Every cluster hands cert-manager from the addon to Argo CD: apps8 first, then all of them, as one value
# of the selector holds no list. Never narrowed (platform-apps-appset.yaml, the selector): an
# Application the selection drops is deleted with what it adopted.
runsOn: every-cluster
# The addon's release name: the chart builds names and Deployment selectors from it, and a selector
# cannot change, so only this name lets Argo CD adopt the running cert-manager in place.
releaseName: cert-manager
# The cainjector writes each webhook's caBundle, which the chart renders empty; compared with the
# live object it would stand OutOfSync for good, and wave 0 would hold every later wave back.
ignoreDifferences: |
  - group: admissionregistration.k8s.io
    kind: ValidatingWebhookConfiguration
    jqPathExpressions:
      - '.webhooks[]?.clientConfig.caBundle'
  - group: admissionregistration.k8s.io
    kind: MutatingWebhookConfiguration
    jqPathExpressions:
      - '.webhooks[]?.clientConfig.caBundle'
