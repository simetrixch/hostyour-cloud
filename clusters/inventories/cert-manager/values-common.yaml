cert-manager:
  # The CRDs come with the chart, as the addon installed them; they are larger than the annotation a
  # client-side apply keeps, which is why app.yaml syncs server-side.
  crds:
    enabled: true
  # A Certificate owns its Secret: when Argo CD prunes a Certificate a chart no longer renders, its
  # Secret goes with it instead of standing behind as a stray TLS key.
  enableCertificateOwnerRef: true
  # A Helm post-install hook that checks the API once after an install. Argo CD would run it as a
  # PostSync hook at every sync, beside the objects the addon's release holds; nothing waits on it.
  startupapicheck:
    enabled: false
  # THE CPU REQUESTS. A pod with no request gets the smallest share of the node while a heavy build saturates it,
  # and a certificate that is not renewed in time is an outage. Each request is the p95 of that pod's CPU use over
  # seven days (Prometheus on the master, 2026-10-15: controller 2m, cainjector 3m, webhook 1m), rounded up to the
  # next 10m, which is the least a request here can be.
  resources:
    requests:
      cpu: 10m
  cainjector:
    resources:
      requests:
        cpu: 10m
  webhook:
    resources:
      requests:
        cpu: 10m
