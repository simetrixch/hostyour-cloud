apiVersion: v2
name: tekton
version: 1.0.0
description: |
  Tekton Pipelines + Triggers + Dashboard — installs the operators, CRDs,
  and the web UI (Dashboard) that clusters/inventories/image-builder depends on.
  Vendored upstream release YAML in templates/release-*.yaml; community
  Helm charts lag the release cadence.

  Dashboard is gated on `.Values.dashboard.enabled OR
  .Values.global.servicesLocal.registry` — it renders only on the ONE build
  cluster (any stage), following that flag. Elsewhere none of the dashboard
  resources render — only the operator + Triggers + Interceptors install.

  Dashboard auth is delegated to the platform IdP (Authentik) via the
  Traefik forwardAuth Middleware `idp-forwardauth@kubernetescrd`. No
  per-app oauth2-proxy, no per-app htpasswd, no per-app Vault entry — one
  login at idp.dev.<CLUSTER_FQDN> carries to every gated subdomain via
  the apex session cookie.
type: application

dependencies:
  # The monitoring dep gives us ServiceMonitor + PrometheusRule emission for
  # the Tekton controllers' :9090/metrics endpoints. Tekton itself is installed
  # via the templates/ raw manifests (see templates/release-pipelines.yaml +
  # release-triggers.yaml).
  - name: monitoring
    version: 2.0.0
    repository: file://../../charts/monitoring

  # Public Ingress at tekton.<CLUSTER_FQDN>. cert-manager LE cert.
  # Backend = tekton-dashboard Service directly. Auth is gated by a
  # Traefik forwardAuth Middleware annotation pointing at the
  # `forwardauth` Middleware in the `idp` namespace (cross-namespace ref
  # `idp-forwardauth@kubernetescrd`).
  #
  # `condition` gates the WHOLE sub-chart on the build-cluster flag: this
  # Ingress renders only where global.servicesLocal.registry is true (the ONE
  # build cluster, clusters/active/<fqdn>.yaml) — the same gate as the Dashboard it
  # fronts. We gate via `condition` here rather than the sub-chart's own
  # `ingress.enabled` because a static values file can't express "on iff a
  # global flag", and we must not teach the shared clusters/charts/ingress library about
  # global.servicesLocal.registry (other apps reuse it). When the condition is
  # true the sub-chart's `ingress.ingress.enabled: true` (values-common) lets it
  # render; when false the sub-chart isn't loaded at all.
  - name: ingress
    version: 1.0.0
    repository: file://../../charts/ingress
    condition: global.servicesLocal.registry

  # Shared named templates (common.labels etc.) used by the ingress library
  # chart above. Declared at APP level because Helm doesn't vendor nested
  # file:// deps — see clusters/charts/common/Chart.yaml.
  - name: common
    version: 1.0.0
    repository: file://../../charts/common
