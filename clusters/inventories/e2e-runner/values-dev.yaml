# DEV pin of the E2E cases image — the ONE grammar the release bump searches
# (builds[]{name,image,tag}; `image` is the FLAT build name). The tag is written by
# the bump on a release of digita-testkit to dev; edit it by hand only to roll back.
builds:
  - name: digita-testkit-e2e
    image: digita-testkit-e2e
    tag: "0.0.0-placeholder"
