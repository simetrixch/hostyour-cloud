{{- /*
The passwords of the two Authentik test accounts of the Plane sign-in proof (task-run-plane-sign-in.yaml):
the account Plane holds a workspace invitation for, and the one it does not.

THE DEFAULT SECRETSTORE READS THEM, NOT e2e-passwords. The role behind e2e-passwords reads
`secret/data/+/tenants/+/e2e` and nothing else (hostyour-deploy's deploy-platform-services program), and
it stays that way: widening it for these two values would let the same login read more than the E2E
passwords. The default store's role reads the app tier, and the deployment writes this entry there, from
the values the identity provider sets, <stage>/app/plane-test-account.

NO PERIODIC READ OF VAULT, the platform rule stated in full in
clusters/charts/external-secret/templates/externalsecret.yaml: the Secret arrives on deploy and when it is
deleted. The deployment mints each password once and never changes it, so the Secret has no value to
refresh.
*/ -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plane-test-account
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: {{ .Values.global.secretStoreName }}
    kind: SecretStore
  target:
    name: plane-test-account
    creationPolicy: Owner
  data:
    {{- range $property := list "password" "uninvited-password" }}
    - secretKey: {{ $property }}
      remoteRef:
        key: {{ printf "%s/app/plane-test-account" $.Values.global.env }}
        property: {{ $property }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    {{- end }}
