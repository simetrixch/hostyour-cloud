{{- /*
The password of the Authentik test account `platform-sign-in` of the Argo CD and Headlamp sign-in proofs
(task-run-argocd-sign-in.yaml and task-run-headlamp-sign-in.yaml), the one account of the group
platform-readers. The proofs take the account of the wrong group, `plane-sign-in-uninvited`, from the Secret
plane-test-account (externalsecret-plane-test-account.yaml).

THE DEFAULT SECRETSTORE READS IT, NOT e2e-passwords, for the reason externalsecret-plane-test-account.yaml
gives: the default store's role reads the app tier, and the deployment writes this entry there, from the
value the identity provider sets, <stage>/app/platform-test-account.

NO PERIODIC READ OF VAULT, the platform rule stated in full in
clusters/charts/external-secret/templates/externalsecret.yaml: the Secret arrives on deploy and when it is
deleted. The deployment mints the password once and never changes it, so the Secret has no value to
refresh.
*/ -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-test-account
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: {{ .Values.global.secretStoreName }}
    kind: SecretStore
  target:
    name: platform-test-account
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: {{ printf "%s/app/platform-test-account" .Values.global.env }}
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
