{{- /*
THE TEST MAILBOX KEY: the read-only Gmail key the contact cases of digita-testkit read the test
mailbox with, at e2e/test-mailbox in the master's Vault. templates/task-run-case.yaml hands each of
its three properties, client-id, client-secret and refresh-token, to the step as its environment.

It is read through the e2e-runner's own SecretStore, whose Vault role reads the E2E passwords and
this key and nothing else. hostyour-deploy's deploy-platform-services program grants that read, and
its policy row must stand on the master before this file does: Vault refuses a read the policy does
not grant, that refusal is an error under every deletionPolicy, and this Application would turn
Degraded.

deletionPolicy Delete MAKES A MISSING ENTRY NO ERROR. Until the owner writes the entry, the
ExternalSecret stands Ready with no Secret, so this Application stays Healthy and holds up no sync
wave, and only a case that reads the mailbox stops, naming the setting it misses. A property missing
from an entry that exists is an error, which is why the owner writes the three in one save.

NO PERIODIC READ OF VAULT (the platform rule, stated in full in
clusters/charts/external-secret/templates/externalsecret.yaml). Changing the value of the
annotation hostyour.cloud/refreshRequestedOn to the day of the change, and releasing hostyour-cloud
to the master, has ESO read the entry again, after the owner's first write or a renewal. It is a
key of its own: the Manager's refresh-external-secrets sets hostyour.cloud/refreshRequestedAt on
every ExternalSecret of the master, and a chart that declared that key would take the Manager's
value back at the next sync.
*/ -}}
{{- $store := required "e2e-password-store.name is empty: values-common.yaml of this chart names the store" (index .Values "e2e-password-store" | default dict).name }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: e2e-test-mailbox
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    hostyour.cloud/refreshRequestedOn: "2026-10-17"
spec:
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: {{ $store }}
    kind: SecretStore
  target:
    name: e2e-test-mailbox
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
{{- range $property := list "client-id" "client-secret" "refresh-token" }}
    - secretKey: {{ $property }}
      remoteRef:
        key: e2e/test-mailbox
        property: {{ $property }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
