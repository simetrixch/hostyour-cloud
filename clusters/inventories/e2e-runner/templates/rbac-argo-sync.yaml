{{- /*
The grant that lets the release pipeline of the unit building this inventory's image refresh this
inventory's Application once its bump pinned the new tag on the install branch, so the release is
live when its pipeline is green: the argo-sync step of
clusters/inventories/consumer-build/templates/pipeline-release.yaml, and its `platform` hits.

IT STANDS IN NS argocd, beside the Application: the master's own ArgoCD keeps there the Applications
the platform-apps ApplicationSet stamps, `<name>-<stage>`. The project cicd admits that namespace.

IT NAMES THIS INVENTORY'S APPLICATION AT EVERY STAGE OF THE CHANNEL TABLE, and nothing beside them.
A release pins the value file of its own stage, and the pipeline refreshes `<name>-<stage>` for it.
Where the master runs another stage, that Application does not exist, and the pipeline must hear
NotFound, which it logs and passes. A grant on one name alone answers Forbidden for every other
name, and the pipeline fails a Forbidden as a missing grant.

`list` and `watch` are absent: Kubernetes ignores resourceNames for those two verbs, so either would
reach every Application in the namespace.
*/ -}}
{{- $unit := required "e2e-runner: releasedBy is required — the unit whose release pipeline builds this inventory's image, bound by this grant" .Values.releasedBy }}
{{- $stages := list }}
{{- range $channel, $channelStages := .Values.global.channelStages }}
{{- $stages = concat $stages $channelStages }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-{{ .Chart.Name }}-argo-sync
  namespace: argocd
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    resourceNames:
      {{- range uniq $stages | sortAlpha }}
      - {{ printf "%s-%s" $.Chart.Name . }}
      {{- end }}
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-{{ .Chart.Name }}-argo-sync
  namespace: argocd
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-{{ .Chart.Name }}-argo-sync
subjects:
  # The account every release PipelineRun of a unit runs as, in its stage-free build namespace
  # (clusters/inventories/consumer-build/templates/serviceaccount.yaml).
  - kind: ServiceAccount
    name: pipeline-sa
    namespace: {{ printf "%s-build" $unit }}
