{{- /*
Zot pull + push credentials for the unit's build namespace. The shared
buildah-build-push Task (clusters/inventories/image-builder/templates/tasks/, resolved into
this namespace's PipelineRuns via the cluster resolver) envFroms these two
Secrets BY NAME — the common.registryPullSecretName helper in its build step,
image-builder-registry-push in its push step. The helper keeps producers and
consumers on one identity. The build/push split holds unchanged: the pull identity is
read-only and the push identity is never in the step that runs untrusted code.

The push identity renders for EVERY unit, a unit that builds nothing included,
because every unit renders the publish pipeline (templates/pipeline-publish.yaml),
whose push task alone mounts it to push the npm packages of a release tag. The pull
identity renders only beside a release pipeline, the one reader of it here.

Both ride the namespace's build-eso SecretStore. The registry entry is the
LOCAL cluster's app tier (<env>/app/registry — the registry runs on the build
plane, so this is the one stage that exists here); the build-eso policy grants
exactly that entry alongside the templated build/<unit>/ paths, and it is
seeded with the cluster.
*/ -}}
{{- if .Values.unit }}
{{- $unit := include "consumer-build.unitName" . -}}
{{- $env := required "consumer-build: global.env is required (platform values chain)" .Values.global.env -}}
{{- if eq (include "consumer-build.hasBuilds" .) "true" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "common.registryPullSecretName" . }}
  namespace: {{ printf "%s-build" $unit }}
  labels:
    app.kubernetes.io/name: consumer-build
    app.kubernetes.io/component: registry-pull
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    image-builder.io/consumer: {{ $unit | quote }}
spec:
  # No periodic read of Vault — the platform-wide delivery rule, stated in full in
  # hostyour-cloud clusters/charts/external-secret/templates/externalsecret.yaml: a secret
  # arrives on DEPLOY (OnChange re-syncs when this CR changes) and on target-Secret
  # DELETION (OnChange creates it when absent), never on a timer. So putting a NEW
  # value in front of the pods is three acts: write it into Vault, delete the target
  # Secret so ESO fetches it, roll the pods (the restart-workloads run).
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: {{ .Values.global.secretStoreName }}
    kind: SecretStore
  target:
    name: {{ include "common.registryPullSecretName" . }}
    creationPolicy: Owner
    template:
      type: Opaque
      mergePolicy: Merge
  data:
    - secretKey: REGISTRY_USERNAME
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        key: {{ printf "%s/app/registry" $env }}
        property: pull-user
    - secretKey: REGISTRY_PASSWORD
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        key: {{ printf "%s/app/registry" $env }}
        property: pull-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  # The same pull identity as a dockerconfigjson, the kind the kubelet reads as
  # an imagePullSecret: pipeline-sa lists it for the images check-definitions
  # runs (templates/pipeline-release.yaml). The format is composed here from the
  # two atoms of the entry, as common.registryPullExternalSecret does for the
  # namespaces whose release is their own; this unit's resources name their
  # namespace.
  name: build-registry-pull
  namespace: {{ printf "%s-build" $unit }}
  labels:
    app.kubernetes.io/name: consumer-build
    app.kubernetes.io/component: registry-pull
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    image-builder.io/consumer: {{ $unit | quote }}
spec:
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: {{ .Values.global.secretStoreName }}
    kind: SecretStore
  target:
    name: build-registry-pull
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |-
          {"auths":{"{{ include "common.registryHost" . }}":{"username":"{{ `{{ .user }}` }}","password":"{{ `{{ .pass }}` }}","auth":"{{ `{{ printf "%s:%s" .user .pass | b64enc }}` }}"}}}
  data:
    - secretKey: user
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        key: {{ printf "%s/app/registry" $env }}
        property: pull-user
    - secretKey: pass
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        key: {{ printf "%s/app/registry" $env }}
        property: pull-password
---
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: image-builder-registry-push
  namespace: {{ printf "%s-build" $unit }}
  labels:
    app.kubernetes.io/name: consumer-build
    app.kubernetes.io/component: registry-push
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    image-builder.io/consumer: {{ $unit | quote }}
spec:
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: {{ .Values.global.secretStoreName }}
    kind: SecretStore
  target:
    name: image-builder-registry-push
    creationPolicy: Owner
  data:
    - secretKey: REGISTRY_USERNAME
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        key: {{ printf "%s/app/registry" $env }}
        property: push-user
    - secretKey: REGISTRY_PASSWORD
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        key: {{ printf "%s/app/registry" $env }}
        property: push-password
{{- end }}
