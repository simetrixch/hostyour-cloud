{{- /*
The unit's release pipeline `<unit>-release` — ONE generic pipeline, rendered
per unit from this template. Every unit runs the same chain, consumer and
build-only alike:

  gate-stage → clone@tag (+verify: tag → commit, sha7) → builds (manifest vs
  attestation) → probe per build → build/push per missing build → bump (the
  reach search) → argo-sync.

The trust split:

  PINNED LITERALS (a crafted PipelineRun param can never move them): repoURL,
  the registry host, the ATTESTED build names from
  registrations/<unit>/build.yaml, the channel table and the tag grammar.

  RUN INPUTS (from the deploy-request webhook, proven in-pipeline):
  release-tag + stage arrive from the pushed ref deploy/<stage>/<release-tag>;
  git-url is the webhook's own claim of the repo and is compared fail-closed
  against the pinned repoURL before anything else happens.

BUILD ONLY WHEN THIS COMMIT'S IMAGE IS MISSING: the probe asks the registry,
and then asks the IMAGE whether it is ours — a 200 alone proves nothing,
because the registry answers a local miss by fetching from its sync upstreams
on demand. Reuse needs the image's own org.opencontainers.image.revision to be
the commit this run cloned and its .source to be the pinned repoURL; that makes
promoting a release to a further stage one probe and one pin commit over an
image built from the same commit of the same repository. 404 means build; a tag
that exists and cannot be proven fails the run. There is no change detection:
at the tag, every declared build whose probe says absent is built.

THE BUMP IS THE REACH SEARCH: which units consume an image is FOUND, never
looked up in a list. For each declared image P and the requested stage S the
bump searches every carrier of the one pin grammar builds[]{name,image,tag} —
(a) every registration with a chartPath on THIS INSTALLATION'S books branch of
hostyour-cloud, read at <repoURL>@deploy/<S>:<chartPath>/values-<S>.yaml under
THAT registration's OWN credential, which the bump reads out of Vault at run
time (see the class-(a) note in the search below), (b) the catalog's
per-chart pins-<S>.yaml on THIS INSTALLATION'S books branch, seeded from
the chart's product default on the trunk the first time and bumped in place
after, (c) hostyour-cloud master clusters/inventories/<app>/values-<S>.yaml — and bumps every
hit. An image with NO hit anywhere fails the run loudly: a release nothing
pins deploys nowhere, and silently succeeding would hide exactly the rot the
derived reach exists to prevent.

Class (b) is the one that does NOT write where it reads. A tag says which
version this installation runs, so writing it to the catalog's trunk — which
every installation reads — would let one installation's build decide another's
version and let the next bump overwrite it. The charts stay product on the
trunk; the pin goes to the books branch beside the tenant registrations.

THE SYNC FOLLOWS THE SAME DERIVATION: a class-(a) hit is the unit's own
Application; a class-(b) hit is a catalog chart that tenant member
Applications render, and WHICH member Applications is derived from the tenant
ApplicationSets + the registrations on the books branch, never from a member
list. Class-(c) pins are never synced from here — they live on master and the
cluster release delivers them.

The shared Tasks (git-clone, credential-scan, buildah-build-push) stay in ns
image-builder and are resolved via the cluster resolver; they RUN in this
namespace, so the credential Secrets they envFrom by name are rendered here
(templates/externalsecret-registry.yaml).
*/ -}}
{{- if .Values.unit }}
{{- $unit := include "consumer-build.unitName" . -}}
{{- $repoURL := required "consumer-build: unit.repoURL is required (stamped by the fan-out ApplicationSet)" .Values.unit.repoURL -}}
{{- $registry := include "common.registryHost" . -}}
{{- $releaseTagRe := printf "^%s$" (required "consumer-build: global.releaseTagFilter is required (platform values chain)" .Values.global.releaseTagFilter) -}}
{{- $builds := include "consumer-build.builds" . | fromJsonArray -}}
{{- $channelStages := required "consumer-build: global.channelStages is required (platform values chain)" .Values.global.channelStages -}}
{{- /* The channel table, serialized for shell consumption: one line per
       channel, `<channel> <stage> <stage>…`. Helm ranges maps key-sorted, so
       the serialization is deterministic. */ -}}
{{- $channelLines := list -}}
{{- range $ch, $stages := $channelStages -}}
{{- $channelLines = append $channelLines (printf "%s %s" $ch (join " " $stages)) -}}
{{- end -}}
{{- $channelTable := join "\n" $channelLines -}}
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: {{ printf "%s-release" $unit }}
  namespace: {{ printf "%s-build" $unit }}
  labels:
    app.kubernetes.io/name: consumer-build
    app.kubernetes.io/component: release-pipeline
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    image-builder.io/consumer: {{ $unit | quote }}
spec:
  params:
    - name: release-tag
      type: string
      default: ""
    - name: stage
      type: string
      default: ""
    - name: git-url
      type: string
      default: ""
  workspaces:
    - name: source
  results:
    - name: image-tag
      description: The immutable image tag <release-tag>-<sha7> this run resolved.
      value: "$(tasks.verify.results.image-tag)"
  tasks:
    # ── 1. gate-stage — the channel ceiling, BEFORE any clone ────────────────
    # The channel is read from the TAG (the tag is the truth, not a
    # parameter); the requested stage must be inside that channel's ceiling,
    # or the run fails here — visibly, before a single file is touched and
    # before any credential is in reach. The same step binds the webhook's
    # repo claim to the pinned repoURL, fail-closed.
    - name: gate-stage
      params:
        - { name: release-tag, value: "$(params.release-tag)" }
        - { name: stage, value: "$(params.stage)" }
        - { name: git-url, value: "$(params.git-url)" }
      taskSpec:
        params:
          - name: release-tag
            type: string
          - name: stage
            type: string
          - name: git-url
            type: string
        steps:
          - name: gate
            image: alpine/git:2.45.2
            env:
              - name: REPO_URL
                value: {{ $repoURL | quote }}
              # `^<filter>$` — the anchored build-plane copy of
              # shared/release.ts RELEASE_TAG_RE (global.releaseTagFilter).
              - name: RELEASE_TAG_RE
                value: {{ $releaseTagRe | quote }}
              # One line per channel: `<channel> <stage>…` — serialized at
              # render from global.channelStages, the one literal table.
              # toJson, not quote: the value is multi-line, and a JSON string
              # keeps the newlines as \n escapes a YAML double-quoted scalar
              # preserves (a plain quote would FOLD them into spaces).
              - name: CHANNEL_STAGES
                value: {{ $channelTable | toJson }}
            script: |
              #!/usr/bin/env sh
              set -eu
              TAG="$(params.release-tag)"
              STAGE="$(params.stage)"
              GIT_URL="$(params.git-url)"

              if [ "${GIT_URL}" != "${REPO_URL}" ]; then
                echo "gate-stage: REJECT — webhook repo '${GIT_URL}' is not the registered repoURL '${REPO_URL}'" >&2
                exit 1
              fi
              if ! printf '%s' "${TAG}" | grep -Eq "${RELEASE_TAG_RE}"; then
                echo "gate-stage: REJECT — release-tag '${TAG}' does not match ${RELEASE_TAG_RE}" >&2
                exit 1
              fi
              case "${STAGE}" in dev|test|prod) ;; *)
                echo "gate-stage: REJECT — stage '${STAGE}' is not one of dev|test|prod" >&2
                exit 1
              esac

              # The channel is the (alpha|beta|stable) segment of the proven tag.
              CHANNEL="$(printf '%s' "${TAG}" | sed -E 's/^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|stable)-[0-9]{14}$/\1/')"
              ALLOWED="$(printf '%s\n' "${CHANNEL_STAGES}" | awk -v c="${CHANNEL}" '$1 == c { $1=""; sub(/^ /,""); print }')"
              if [ -z "${ALLOWED}" ]; then
                echo "gate-stage: REJECT — channel '${CHANNEL}' is not in the channel table:" >&2
                printf '%s\n' "${CHANNEL_STAGES}" >&2
                exit 1
              fi
              if ! printf '%s\n' ${ALLOWED} | grep -qx "${STAGE}"; then
                echo "gate-stage: REJECT — channel '${CHANNEL}' may not reach stage '${STAGE}' (allowed: ${ALLOWED})" >&2
                exit 1
              fi
              echo "gate-stage: ok — ${TAG} (channel ${CHANNEL}) may reach ${STAGE}"
            computeResources:
              requests: { cpu: 50m, memory: 64Mi }
              limits: { cpu: 200m, memory: 128Mi }

    # ── 2. clone — at the pushed deploy ref, from the PINNED repoURL ─────────
    # The revision is the exact ref that fired the webhook; checking it out
    # peels the annotated release tag to its commit, which the clone Task
    # returns as its result — the value everything downstream binds to.
    - name: clone
      runAfter: [gate-stage]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: git-clone }
          - { name: namespace, value: image-builder }
      params:
        - { name: url, value: {{ $repoURL | quote }} }
        - { name: revision, value: "deploy/$(params.stage)/$(params.release-tag)" }
        # Full clone so annotated-tag peeling + rev-parse are reliable.
        - { name: depth, value: "0" }
        # The unit's OWN clone credential (templates/externalsecret-git-https.yaml)
        # — required for an external private repo; the shared platform
        # credential must not reach a unit build.
        - { name: credentials-secret, value: build-git-https }
      workspaces:
        - { name: source, workspace: source }

    # ── 3. verify — tag → commit, sha7, the immutable image tag ──────────────
    - name: verify
      runAfter: [clone]
      params:
        - { name: release-tag, value: "$(params.release-tag)" }
        - { name: commit, value: "$(tasks.clone.results.commit)" }
      taskSpec:
        params:
          - name: release-tag
            type: string
          - name: commit
            type: string
        results:
          - name: image-tag
            description: <release-tag>-<sha7>, the immutable push/pin tag.
          - name: build-timestamp
            description: ISO-8601 UTC build time (OCI .created label).
        steps:
          - name: verify
            image: alpine/git:2.45.2
            script: |
              #!/usr/bin/env sh
              set -eu
              COMMIT="$(params.commit)"
              if [ -z "${COMMIT}" ]; then
                echo "verify: REJECT — the clone resolved no commit" >&2
                exit 1
              fi
              SHA7="$(printf '%s' "${COMMIT}" | cut -c1-7)"
              IMAGE_TAG="$(params.release-tag)-${SHA7}"
              STAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "verify: ok — $(params.release-tag) @ ${COMMIT} -> image tag ${IMAGE_TAG}"
              printf '%s' "${IMAGE_TAG}" > $(results.image-tag.path)
              printf '%s' "${STAMP}"     > $(results.build-timestamp.path)
            computeResources:
              requests: { cpu: 50m, memory: 64Mi }
              limits: { cpu: 200m, memory: 128Mi }

    # ── 4. builds — the manifest, checked against the attestation ────────────
    # Reads builds[] from the TAGGED deploy/platform.yaml and checks every
    # declared build against the ATTESTED names the fan-out stamped from
    # registrations/<unit>/build.yaml. A build that appears in the manifest
    # but is not attested FAILS here — before anything is built or pushed;
    # adding a build therefore means running the onboard verb again, which
    # re-attests. Per attested build the task emits the manifest's
    # containerfile / context as results the build tasks consume; an attested
    # build the manifest no longer declares is marked undeclared and skipped
    # downstream.
    #
    # containerfile and context are the only manifest fields that become a
    # PATH the build plane resolves, and the manifest is written by whoever
    # can push a deploy tag. Both are checked here against a relative-path
    # grammar before they leave this task: nothing else downstream looks at
    # them again, and the build step that consumes them runs privileged.
    - name: builds
      runAfter: [clone]
      workspaces:
        - { name: source, workspace: source }
      taskSpec:
        workspaces:
          - name: source
        results:
          {{- range $b := $builds }}
          - name: {{ printf "%s-declared" $b }}
          - name: {{ printf "%s-containerfile" $b }}
          - name: {{ printf "%s-context" $b }}
          {{- end }}
        steps:
          - name: check
            image: alpine/k8s:1.35.6
            env:
              - name: UNIT
                value: {{ $unit | quote }}
              - name: ATTESTED
                value: {{ join " " $builds | quote }}
            workingDir: /workspace/source
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              MANIFEST=deploy/platform.yaml
              [ -f "${MANIFEST}" ] || { echo "builds: FAIL — ${MANIFEST} missing in the tagged tree" >&2; exit 1; }

              # relpath <field> <build> <value> — the grammar for a manifest
              # path: one or more segments of [A-Za-z0-9._-], joined by single
              # slashes, never absolute and never containing a `..` segment.
              # It admits Containerfile, docker/Dockerfile and apps/api, and
              # refuses an empty value, a walk out of the checkout, and every
              # character a shell or a flag parser would read as syntax.
              relpath() {
                local field="$1" build="$2" value="$3"
                if ! printf '%s' "${value}" | grep -Eq '^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$'; then
                  echo "builds: FAIL — ${build}.${field} '${value}' is not a relative path of [A-Za-z0-9._-] segments" >&2
                  exit 1
                fi
                if printf '%s' "${value}" | tr '/' '\n' | grep -qx '\.\.'; then
                  echo "builds: FAIL — ${build}.${field} '${value}' leaves the checkout with a '..' segment" >&2
                  exit 1
                fi
              }

              NAME="$(yq eval '.name' "${MANIFEST}")"
              if [ "${NAME}" != "${UNIT}" ]; then
                echo "builds: FAIL — manifest name '${NAME}' != unit '${UNIT}' (the name invariant: name == basename(repoURL))" >&2
                exit 1
              fi

              # Every manifest build must be attested — checked BEFORE any
              # probe, build or push.
              for b in $(yq eval '.builds[].name' "${MANIFEST}"); do
                if ! printf '%s\n' ${ATTESTED} | grep -qx "${b}"; then
                  echo "builds: FAIL — build '${b}' is declared in ${MANIFEST} but not attested in registrations/${UNIT}/build.yaml — run the onboard verb again to re-attest" >&2
                  exit 1
                fi
              done

              for b in ${ATTESTED}; do
                declared="$(yq eval "[.builds[] | select(.name == \"${b}\")] | length" "${MANIFEST}")"
                if [ "${declared}" = "0" ]; then
                  echo "builds: attested build '${b}' is not declared in ${MANIFEST} — skipping it"
                  printf 'false' > "/tekton/results/${b}-declared"
                  printf '' > "/tekton/results/${b}-containerfile"
                  printf '.' > "/tekton/results/${b}-context"
                  continue
                fi
                cf="$(yq eval ".builds[] | select(.name == \"${b}\") | .containerfile // \"\"" "${MANIFEST}")"
                ctx="$(yq eval ".builds[] | select(.name == \"${b}\") | .context // \".\"" "${MANIFEST}")"
                relpath containerfile "${b}" "${cf}"
                relpath context "${b}" "${ctx}"
                echo "builds: ${b} — containerfile ${cf}, context ${ctx}"
                printf 'true' > "/tekton/results/${b}-declared"
                printf '%s' "${cf}"  > "/tekton/results/${b}-containerfile"
                printf '%s' "${ctx}" > "/tekton/results/${b}-context"
              done
            computeResources:
              requests: { cpu: 50m, memory: 64Mi }
              limits: { cpu: 200m, memory: 128Mi }

    # ── 5. scan — the shared preliminary of every build ──────────────────────
    # The unit's authenticated .npmrc never enters the workspace: the build
    # step mounts the Secret build-npmrc (templates/externalsecret-npmrc.yaml)
    # beside the build context and hands it to buildah as a BUILD SECRET, so a
    # `COPY . .` in the unit's own Containerfile cannot pick the credential up.
    - name: scan
      runAfter: [clone]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: credential-scan }
          - { name: namespace, value: image-builder }
      workspaces:
        - { name: source, workspace: source }
{{ range $b := $builds }}
    # ── probe: {{ $b }} — build only when THIS COMMIT's image is missing ─────
    # A 200 IS NOT PROOF THE PLATFORM BUILT THE IMAGE. The registry answers a
    # local miss by fetching from its sync upstreams on demand
    # (clusters/inventories/registry/values-common.yaml, extensions.sync: ghcr.io
    # with content prefix /simetrixch/* stripped to /, then registry-1.docker.io
    # unfiltered), so a repo this installation has never pushed to still answers
    # 200 with whatever an upstream publishes under that name and tag. Taking
    # that for "already built" would skip the build and pin an image nobody
    # here made from a commit nobody here verified.
    #
    # So the probe reads the image's PROVENANCE back out of it: buildah stamps
    # org.opencontainers.image.revision and .source on every build
    # (clusters/inventories/image-builder/templates/tasks/buildah-build-push.yaml),
    # and this step reuses the image only when .revision is the commit this run
    # cloned and .source is the repoURL its registration pins. That is the whole
    # of what the pin needs: the tag names an image built from this commit of
    # this repository. It is NOT a claim about bytes — two builds of one commit
    # differ — so an image reused across stages is the same image, and an image
    # the seed workflow published for the same commit is the same source.
    #
    # A tag that exists but cannot be proven is neither present nor absent: the
    # run fails rather than build over bytes another installation may already be
    # running under that same version.
    #
    # 404 = build. Anything else, including a timeout, fails the run.
    - name: {{ printf "probe-%s" $b }}
      when:
        - input: "$(tasks.builds.results.{{ $b }}-declared)"
          operator: in
          values: ["true"]
      params:
        - { name: image-tag, value: "$(tasks.verify.results.image-tag)" }
        - { name: commit, value: "$(tasks.clone.results.commit)" }
      taskSpec:
        params:
          - name: image-tag
            type: string
          - name: commit
            type: string
        results:
          - name: exists
            description: present (this commit's image is in the registry) or absent (build it).
        steps:
          - name: probe
            image: alpine/k8s:1.35.6
            env:
              - name: REGISTRY
                value: {{ $registry | quote }}
              - name: IMAGE
                value: {{ $b | quote }}
              - name: REPO_URL
                value: {{ $repoURL | quote }}
              # Read-only pull identity — enough for a manifest and a config
              # blob, and the only credential this step may hold.
              - name: RESULT_PATH
                value: /tekton/results/exists
            envFrom:
              - secretRef:
                  name: image-builder-registry-pull
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              TAG="$(params.image-tag)"
              COMMIT="$(params.commit)"
              ACCEPT='application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.docker.distribution.manifest.list.v2+json'
              BASE="https://${REGISTRY}/v2/${IMAGE}"

              # EVERY registry call is bounded. Without a ceiling a miss can
              # hold the connection open for as long as the registry's own sync
              # takes — maxRetries 3 at retryDelay 5m against two upstreams —
              # and the only limit left is the PipelineRun's 1h timeout, which
              # names no cause. 600s is far above a local answer (milliseconds)
              # and far below that timeout, so a step that hits it says so.
              CURL=(curl -sS --connect-timeout 10 --max-time 600
                    -u "${REGISTRY_USERNAME}:${REGISTRY_PASSWORD}" -H "Accept: ${ACCEPT}")

              # fetch <url> <outfile> — echoes the HTTP status, or fails the
              # step naming the transport error. curl's own non-zero exit is
              # caught here rather than left to set -e, which would abort with
              # no message at all.
              fetch() {
                local url="$1" out="$2" code rc
                set +e
                code="$("${CURL[@]}" -o "${out}" -w '%{http_code}' "${url}")"
                rc=$?
                set -e
                if [ "${rc}" != "0" ]; then
                  echo "probe: FAIL — ${url}: curl exited ${rc} (28 is the 600s ceiling above, reached when the registry is still fetching from an upstream); neither present nor absent is proven" >&2
                  exit 1
                fi
                printf '%s' "${code}"
              }

              CODE="$(fetch "${BASE}/manifests/${TAG}" /tmp/manifest.json)"
              case "${CODE}" in
                200) ;;
                404)
                  echo "probe: ${IMAGE}:${TAG} absent — build"
                  printf 'absent' > "${RESULT_PATH}"
                  exit 0 ;;
                *)
                  echo "probe: FAIL — ${BASE}/manifests/${TAG} answered ${CODE}; neither present nor absent is proven, refusing to guess" >&2
                  exit 1 ;;
              esac

              # An index carries no config of its own — descend to the first
              # manifest it lists, which is the whole of what this platform
              # pushes (buildah builds one architecture per build).
              if [ "$(yq -p=json -o=y '.manifests // "" | length' /tmp/manifest.json)" != "0" ]; then
                CHILD="$(yq -p=json -o=y '.manifests[0].digest' /tmp/manifest.json)"
                CODE="$(fetch "${BASE}/manifests/${CHILD}" /tmp/manifest.json)"
                [ "${CODE}" = "200" ] || { echo "probe: FAIL — ${BASE}/manifests/${CHILD}, named by the index at ${TAG}, answered ${CODE}" >&2; exit 1; }
              fi

              CFG="$(yq -p=json -o=y '.config.digest // ""' /tmp/manifest.json)"
              [ -n "${CFG}" ] || { echo "probe: FAIL — the manifest at ${IMAGE}:${TAG} names no config blob, so its provenance cannot be read" >&2; exit 1; }
              CODE="$(fetch "${BASE}/blobs/${CFG}" /tmp/config.json)"
              [ "${CODE}" = "200" ] || { echo "probe: FAIL — the config blob ${CFG} of ${IMAGE}:${TAG} answered ${CODE}" >&2; exit 1; }

              REV="$(yq -p=json -o=y '.config.Labels."org.opencontainers.image.revision" // ""' /tmp/config.json)"
              SRC="$(yq -p=json -o=y '.config.Labels."org.opencontainers.image.source" // ""' /tmp/config.json)"
              if [ "${REV}" = "${COMMIT}" ] && [ "${SRC}" = "${REPO_URL}" ]; then
                echo "probe: ${IMAGE}:${TAG} present and built from ${COMMIT} of ${REPO_URL} — reuse, no build"
                printf 'present' > "${RESULT_PATH}"
                exit 0
              fi
              echo "probe: FAIL — ${REGISTRY}/${IMAGE}:${TAG} exists but is not a build of this release." >&2
              echo "  this run cloned ${REPO_URL} at ${COMMIT}" >&2
              echo "  the image says source '${SRC:-<no org.opencontainers.image.source label>}', revision '${REV:-<no org.opencontainers.image.revision label>}'" >&2
              echo "  The registry answers a local miss from its sync upstreams, so this is what a tag" >&2
              echo "  fetched from ghcr.io or docker.io under the same name looks like. Building over it" >&2
              echo "  would leave two sets of bytes under one version, so the run stops here." >&2
              exit 1
            computeResources:
              requests: { cpu: 50m, memory: 64Mi }
              limits: { cpu: 200m, memory: 128Mi }

    # ── build: {{ $b }} — the flat build name IS the push target ─────────────
    - name: {{ printf "build-%s" $b }}
      runAfter: [scan]
      when:
        - input: "$(tasks.builds.results.{{ $b }}-declared)"
          operator: in
          values: ["true"]
        - input: "$(tasks.{{ printf "probe-%s" $b }}.results.exists)"
          operator: in
          values: ["absent"]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: buildah-build-push }
          - { name: namespace, value: image-builder }
      params:
        - { name: image-name, value: {{ $b | quote }} }
        - { name: image-tag, value: "$(tasks.verify.results.image-tag)" }
        - { name: registry, value: {{ $registry | quote }} }
        - { name: containerfile, value: "$(tasks.builds.results.{{ $b }}-containerfile)" }
        - { name: context, value: "$(tasks.builds.results.{{ $b }}-context)" }
        - { name: git-url, value: {{ $repoURL | quote }} }
        - { name: git-revision, value: "$(tasks.clone.results.commit)" }
        - { name: build-timestamp, value: "$(tasks.verify.results.build-timestamp)" }
        - { name: version, value: "$(params.release-tag)" }
      workspaces:
        - { name: source, workspace: source }
{{ end }}
    # ── bump — the reach search, then the sync ───────────────────────────────
    # Step 1 searches the three carrier classes for every declared image,
    # writes the pins and derives the Applications each hit reaches; step 2
    # pokes ArgoCD for those Applications — the unit's own for a class-(a)
    # hit, the tenant member Applications for a class-(b) hit. The two
    # platform PATs live ONLY in this task (bump-git-https), and the task
    # runs no unit code.
    - name: bump
      runAfter:
        # builds and scan are named directly, not left to the build tasks to
        # imply. A unit with NO attested build renders none of them, and the
        # list below would then be empty — the bump would start BESIDE the two
        # tasks that judge what it is about to write. It reads .builds[].name
        # straight off the pushed manifest and pushes pins for it, so it must
        # not begin until `builds` has held that manifest against the attested
        # names and `scan` has read the tree for credentials. A registration
        # with an empty builds[] and a manifest that grew one is exactly the
        # state where the pins would otherwise be pushed while the attestation
        # check that fails the run is still running.
        - builds
        - scan
        {{- range $b := $builds }}
        - {{ printf "build-%s" $b }}
        {{- end }}
      params:
        - { name: release-tag, value: "$(params.release-tag)" }
        - { name: stage, value: "$(params.stage)" }
        - { name: image-tag, value: "$(tasks.verify.results.image-tag)" }
      workspaces:
        - { name: source, workspace: source }
      taskSpec:
        params:
          - name: release-tag
            type: string
          - name: stage
            type: string
          - name: image-tag
            type: string
        workspaces:
          - name: source
        volumes:
          - name: bump-scratch
            emptyDir: {}
          # The Vault credential of the search-and-write step, and of nothing
          # else: the JWT it presents at the kubernetes-auth login that opens
          # the per-registration carrier PATs. Vault reads the account and the
          # namespace out of the reviewed token itself and dials no API server
          # of ours, so this projection carries the token alone — no cluster CA
          # and no namespace file, unlike the kubectl one below.
          - name: vault-token
            projected:
              sources:
                - serviceAccountToken:
                    path: token
                    expirationSeconds: 3600
          # The API credential of the argo-sync step, and of nothing else.
          # pipeline-sa carries automountServiceAccountToken: false
          # (templates/serviceaccount.yaml), so no run pod holds a token by
          # default — least of all the buildah step that executes the unit's
          # own build. kubectl reads the token, the cluster CA and the
          # namespace from this one directory, which is why the projection
          # carries all three.
          - name: argo-sync-token
            projected:
              sources:
                - serviceAccountToken:
                    path: token
                    expirationSeconds: 3600
                - configMap:
                    name: kube-root-ca.crt
                    items:
                      - { key: ca.crt, path: ca.crt }
                - downwardAPI:
                    items:
                      - path: namespace
                        fieldRef:
                          fieldPath: metadata.namespace
        steps:
          - name: search-and-write
            image: alpine/k8s:1.35.6
            env:
              - name: UNIT
                value: {{ $unit | quote }}
              - name: CLOUD_URL
                value: https://github.com/simetrixch/hostyour-cloud.git
              # The branch of hostyour-cloud and of the catalog that carries
              # THIS installation's books — the consumer registrations the
              # class-(a) search reads and the tenant registrations the
              # class-(b) reach is derived from. It is global.booksBranch and
              # NOT global.domain: global.domain is the branch of the cluster
              # this build plane runs ON, and the build plane may be a pure
              # slave — an installation is free to arrange that, and this chart
              # deploys wherever the build plane sits — whose branch carries no
              # registration at all, because the trunk it was cut from carries
              # none and no step of any branch program writes one there. The
              # branch program writes booksBranch into clusters/active/<fqdn>.yaml
              # from the same role rule that decides global.endpoints.vault.url. Not the trunk either
              # — a registration names one real unit of one installation, and
              # the trunk is what every future installation is cut from.
              - name: BOOKS_BRANCH
                value: {{ required "consumer-build: global.booksBranch is required (clusters/active/<fqdn>.yaml, rendered per install branch from the cluster map — the install branch of the cluster holding the master role, which carries this installation's registrations)" .Values.global.booksBranch | quote }}
              # The tenant catalog this installation deploys from — one repository
              # per installation, composed once by the branch program into
              # clusters/active/<fqdn>.yaml. Required, never defaulted: a bump that
              # pushed the tenant pins to a repository picked by this chart would
              # write into somebody else's catalog.
              - name: DEPLOY_URL
                value: {{ required "consumer-build: global.catalogUrl is required (clusters/active/<fqdn>.yaml, rendered per install branch from the cluster map's catalog-repo — the repository holding this installation's tenant charts)" .Values.global.catalogUrl | quote }}
              # toJson for the same newline-preserving reason as in gate-stage.
              - name: CHANNEL_STAGES
                value: {{ $channelTable | toJson }}
              - name: SRC
                value: $(workspaces.source.path)
              - name: STAGE
                value: $(params.stage)
              - name: RELEASE_TAG
                value: $(params.release-tag)
              - name: IMAGE_TAG
                value: $(params.image-tag)
              - name: CLUSTER_NAME
                value: {{ .Values.global.clusterName | default "" | quote }}
              - name: HITS_FILE
                value: /bump/hits
              - name: HOME
                value: /tmp
              # ── the bump's OWN Vault identity ──────────────────────────────
              # The class-(a) search clones and pushes one OTHER unit's
              # repository per registration, and which units are registered
              # changes without this chart being re-rendered — so their
              # credentials cannot be delivered by an ExternalSecret the way the
              # three fixed ones are (templates/externalsecret-bump.yaml). This
              # task logs in to Vault itself, under a role of its own, and reads
              # each carrier's PAT at the moment it needs it.
              #
              # THE ROLE IS `build-bump` AND IT IS NOT `build-eso`. build-eso is
              # the per-namespace ExternalSecrets identity, and its policy
              # templates every path on the ONE unit the account is annotated
              # with (templates/secretstore.yaml) — that templating is what stops
              # a unit's secret reader from reaching a sibling's, and widening it
              # would take the isolation away from every ExternalSecret in the
              # namespace to serve one step. build-bump is bound to pipeline-sa
              # instead, and grants read on secret/data/build/+/repo-pat and
              # nothing else. Both are seeded with the cluster
              # (digita-deploy ansiwise/programs/deploy-gitops.yaml).
              #
              # WHAT THIS COSTS, stated rather than implied: an account that can
              # read every registered unit's repo PAT now exists in every build
              # namespace. It is reachable only from a pod that HOLDS a
              # pipeline-sa token, and the only pod of this pipeline that holds
              # one is this task's — pipeline-sa carries
              # automountServiceAccountToken: false and the buildah task that
              # runs the unit's own code mounts no token at all. The blast radius
              # is that pod, and it is the price of a class-(a) search that
              # actually covers what it says it covers.
              - name: VAULT_ADDR
                value: {{ required "consumer-build: global.endpoints.vault.url is required (clusters/active/<fqdn>.yaml — the bump reads each registration's carrier PAT from it, and a search that cannot open a foreign carrier covers less than it reports)" .Values.global.endpoints.vault.url | quote }}
              - name: VAULT_AUTH_MOUNT
                value: {{ required "consumer-build: global.vaultKubernetesAuthPath is required (clusters/active/<fqdn>.yaml — every cluster logs in at its own named kubernetes mount)" .Values.global.vaultKubernetesAuthPath | quote }}
              - name: VAULT_KV_MOUNT
                value: {{ required "consumer-build: global.vaultKvMount is required (clusters/platform/values-common.yaml via the $values chain)" .Values.global.vaultKvMount | quote }}
              - name: VAULT_ROLE
                value: build-bump
              - name: VAULT_TOKEN_FILE
                value: /var/run/secrets/vault/token
            envFrom:
              # The path-qualified git-write records (templates/
              # externalsecret-bump.yaml) — the ONLY task that may hold them.
              - secretRef:
                  name: bump-git-https
            volumeMounts:
              - { name: bump-scratch, mountPath: /bump }
              - { name: vault-token, mountPath: /var/run/secrets/vault, readOnly: true }
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              # ── the §9.3 search: derive the reach, bump every hit ──────────
              # Inputs (env): UNIT CLOUD_URL BOOKS_BRANCH DEPLOY_URL
              # CHANNEL_STAGES SRC STAGE RELEASE_TAG IMAGE_TAG CLUSTER_NAME
              # HITS_FILE VAULT_ADDR VAULT_AUTH_MOUNT VAULT_KV_MOUNT VAULT_ROLE
              # VAULT_TOKEN_FILE [GITCREDENTIALS].

              # Ceiling, re-checked at the point that writes: the channel from
              # the tag must admit the stage, or NOTHING is written.
              CHANNEL="$(printf '%s' "${RELEASE_TAG}" | sed -E 's/^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|stable)-[0-9]{14}$/\1/')"
              ALLOWED="$(printf '%s\n' "${CHANNEL_STAGES}" | awk -v c="${CHANNEL}" '$1 == c { $1=""; sub(/^ /,""); print }')"
              if [ -z "${ALLOWED}" ] || ! printf '%s\n' ${ALLOWED} | grep -qx "${STAGE}"; then
                echo "bump: REFUSE — channel '${CHANNEL}' may not write stage '${STAGE}' (allowed: ${ALLOWED:-<none>}); no pin is written" >&2
                exit 1
              fi

              git config --global user.name  "image-builder"
              git config --global user.email "image-builder@platform"
              # All carriers live on the same git host, so the credential
              # records are PATH-qualified and git must select by repo path.
              git config --global credential.useHttpPath true
              # The store is armed UNCONDITIONALLY, because the three records
              # ESO delivers are no longer the only ones that reach it: the
              # class-(a) loop appends one per private registration as it goes.
              # An arm that hung off GITCREDENTIALS would leave those appended
              # records in a file no helper reads, and every foreign carrier
              # would then be refused as if it had no credential at all.
              CREDENTIALS_FILE=/tmp/git-credentials
              : > "${CREDENTIALS_FILE}"
              chmod 600 "${CREDENTIALS_FILE}"
              git config --global credential.helper "store --file=${CREDENTIALS_FILE}"
              if [ -n "${GITCREDENTIALS:-}" ]; then
                printf '%s\n' "${GITCREDENTIALS}" > "${CREDENTIALS_FILE}"
              fi

              # The declared images of this release — the manifest in the
              # tagged workspace, already attested by the builds task.
              IMAGES="$(yq eval '.builds[].name' "${SRC}/deploy/platform.yaml")"

              # A MANIFEST WITH NO builds[] IS VALID, in two shapes: a
              # self-contained unit that declares a chart and nothing to build,
              # and a fan-out repo that declares a tenant: block. The manifest
              # schema requires ONE of chart / builds / tenant, not builds
              # (hostyour-manager/shared/consumer.ts, ConsumerManifestSchema C1).
              #
              # Such a release ships no image, and all three carrier classes
              # below are keyed on a declared image, so the search has no
              # subject. Running it anyway would clone every registered carrier
              # and the catalog to bump nothing, and would fail the run closed on
              # a carrier branch this release does not touch. The empty hits file
              # is what argo-sync reads.
              if [ -z "${IMAGES}" ]; then
                # NO BUILDS IS ONLY VALID WHEN THE MANIFEST DEPLOYS SOMETHING ELSE,
                # and this is where that is decided rather than assumed. C1 names
                # three arms — chart, builds, tenant — and nothing enforces it at
                # a release tag: the gate that reads it runs at onboarding, and
                # the builds task above judges only names and attestation. So an
                # empty builds[] with no chart and no tenant: block is the inert
                # manifest C1 exists to reject, and a unit whose tag simply LOST
                # its builds list looks exactly like one. Exiting 0 over either
                # would report a release that shipped nothing as done.
                CHART="$(yq eval '.chart // ""' "${SRC}/deploy/platform.yaml")"
                TENANT="$(yq eval '.tenant // ""' "${SRC}/deploy/platform.yaml")"
                if [ -z "${CHART}" ] && [ -z "${TENANT}" ]; then
                  echo "bump: FAIL — ${SRC}/deploy/platform.yaml declares no builds, no chart and no tenant: block, so this tag deploys nothing and builds nothing. A manifest states at least one of the three (ConsumerManifestSchema C1); a tag that reached here without one either lost its builds list on the way or was never a unit this pipeline can release" >&2
                  exit 1
                fi
                : > "${HITS_FILE}"
                echo "bump: ${SRC}/deploy/platform.yaml declares no builds — this release ships no image, so there is no pin to write and no Application this run can derive; what this unit deploys reaches the cluster on ArgoCD's next poll of the ref it follows"
                exit 0
              fi

              WORK="$(mktemp -d)"
              : > "${HITS_FILE}"
              declare -A HIT_COUNT
              for P in ${IMAGES}; do HIT_COUNT[$P]=0; done

              # bump_file <values file> — bumps every declared image's pin in
              # the file. Called directly, never in a command substitution:
              # HIT_COUNT and BUMPED must update the CALLER's state, and a
              # subshell would silently drop both.
              bump_file() {
                local vf="$1"
                for P in ${IMAGES}; do
                  local n
                  n="$(yq eval "[.builds[]? | select(.image == \"${P}\")] | length" "${vf}")"
                  if [ "${n}" != "0" ]; then
                    yq eval -i "(.builds[] | select(.image == \"${P}\")).tag = \"${IMAGE_TAG}\"" "${vf}"
                    HIT_COUNT[$P]=$(( ${HIT_COUNT[$P]} + n ))
                    BUMPED=1
                  fi
                done
              }

              # commit_push <dir> <branch> <what> — several release
              # PipelineRuns can bump the same shared branch at once
              # (hostyour-cloud and the catalog's master, a carrier's
              # deploy/<stage>), and nothing serializes them, so a
              # non-fast-forward rejection is a normal outcome here, not a
              # defect. The one bump commit is rebased onto the freshly
              # fetched remote tip and pushed again: distinct releases touch
              # distinct pin lines, so the rebase merges cleanly. A genuine
              # conflict (two runs writing the SAME pin line) aborts the
              # rebase and fails the task with nothing pushed to this branch.
              #
              # A RACE IS ONE REASON A PUSH IS REFUSED AND NOT THE LIKELY ONE
              # ON A FIRST INSTALLATION, where branch protection on the target
              # branch and a PAT seeded into the store without contents:write
              # both refuse in exactly the same place. Retrying a rebase five
              # times against either changes nothing and prints five lines
              # asserting a race that was never established — the sentence an
              # operator reads first and acts on. So git's own refusal is
              # captured and read: only a non-fast-forward is retried, and
              # every other refusal fails at once with what git said.
              commit_push() {
                local dir="$1" branch="$2" what="$3" attempt err
                err="$(mktemp)"
                ( cd "${dir}"
                  # Staged FIRST, then asked. A pins file written for the first
                  # time is untracked, and `git diff` does not see an untracked
                  # file at all — asking before staging would report "nothing
                  # changed" and drop the very write this run exists to make.
                  git add -A
                  if git diff --cached --quiet; then exit 0; fi
                  git commit -q -m "release: ${UNIT} ${RELEASE_TAG} — pin ${IMAGE_TAG} (${STAGE})"
                  for attempt in 1 2 3 4 5; do
                    if git push -q origin "HEAD:${branch}" 2>"${err}"; then
                      echo "bump: pushed ${what} (${branch})"
                      exit 0
                    fi
                    # git names a non-fast-forward in its own words; anything
                    # else — a protected branch, a credential without
                    # contents:write, a repository that is not there — is not a
                    # race and is not retried.
                    if ! grep -qEi 'non-fast-forward|fetch first|behind its remote' "${err}"; then
                      echo "bump: FAIL — ${what} (${branch}): the push was refused, and not as a concurrent release. git said:" >&2
                      cat "${err}" >&2
                      echo "  A first installation refuses here for two reasons before it ever races: branch protection on ${branch}, and a PAT in the store without contents:write on this repository." >&2
                      exit 1
                    fi
                    echo "bump: push of ${what} (${branch}) rejected as non-fast-forward (attempt ${attempt}/5) — rebasing onto the remote tip and retrying" >&2
                    if ! git fetch -q origin "${branch}" 2>"${err}"; then
                      echo "bump: FAIL — ${what} (${branch}): the push was rejected and the branch cannot be fetched either, so it cannot be rebased. git said:" >&2
                      cat "${err}" >&2
                      exit 1
                    fi
                    if ! git rebase -q FETCH_HEAD; then
                      git rebase --abort
                      echo "bump: FAIL — ${what} (${branch}): a concurrent release wrote the same pin lines (rebase conflict); nothing pushed to this branch" >&2
                      exit 1
                    fi
                  done
                  echo "bump: FAIL — ${what} (${branch}): push still rejected as non-fast-forward after 5 rebase retries" >&2
                  exit 1 )
              }

              # hostyour-cloud is cloned TWICE, because two different kinds of
              # thing live on two different refs. The trunk is the product: the
              # tenant ApplicationSets whose render derives the tenant reach of
              # a class-(b) hit, and the platform image pins class (c) bumps and
              # pushes back. The install branch named by BOOKS_BRANCH carries
              # this installation's books: the consumer registrations class (a)
              # searches, which the Manager writes there and nothing takes
              # away. One clone cannot serve both: the trunk carries no customer
              # registration at all, and an install branch's argocd/ tree has
              # already had __STAGE__, __CLUSTER_NAME__, __BOOKS_FQDN__ and
              # __CATALOG_REPO__ stamped into it for the one stage that branch
              # is, so the tenant render below could not simulate any other.
              git clone -q --depth 1 --branch master "${CLOUD_URL}" "${WORK}/hostyour-cloud"
              # Fail-closed for the same reason the carrier clone below is: a
              # search whose source cannot be read is not a search that found
              # nothing.
              git clone -q --depth 1 --branch "${BOOKS_BRANCH}" "${CLOUD_URL}" "${WORK}/books" \
                || { echo "bump: FAIL — cannot read ${CLOUD_URL}@${BOOKS_BRANCH}, this installation's books; the search over the consumer registrations is impossible" >&2; exit 1; }

              # ── the carrier credentials: ONE PER REGISTRATION ──────────────
              # The Manager's own copy of this search opens each carrier
              # under THAT registration's credential and under no other
              # (hostyour-manager server/domains/registry-cleanup/search.ts,
              # readUnitChart: cloneAtRef with entry.repoCredentialId when the
              # registration carries one, unauthenticated when it does not).
              # This is the same shape read from the other end: the Manager
              # holds a sealed credential store, this pod holds a Vault login,
              # and both resolve to the ONE PAT per unit that onboarding seeds
              # at secret/build/<unit>/repo-pat (hostyour-manager
              # server/domains/onboarding/onboard-seed-repo-pat.ts) — the same
              # entry templates/externalsecret-bump.yaml reads for THIS unit.
              #
              # It cannot be an ExternalSecret like the three fixed records:
              # WHICH units are registered changes with every onboarding, and
              # this chart is not re-rendered when it does. A render-time list
              # would be stale exactly when a new consumer appears, which is the
              # case that matters.
              #
              # ONE login, taken on first need and given back when the loop is
              # done — login, use, revoke-self, the close the Manager's own
              # Vault client makes after every call (adapters/vault/
              # vault-self-seeder.ts). A release on an installation whose only
              # chart-carrying registration is this unit's own public repo never
              # dials Vault at all.
              VAULT_CLIENT_TOKEN=""
              vault_login() {
                local req body code rc
                [ -z "${VAULT_CLIENT_TOKEN}" ] || return 0
                req="$(mktemp)"
                body="$(mktemp)"
                # The JWT goes in through a FILE, never on the command line:
                # /proc/<pid>/cmdline is readable by every process in this pod.
                printf '{"role":"%s","jwt":"%s"}' "${VAULT_ROLE}" "$(cat "${VAULT_TOKEN_FILE}")" > "${req}"
                chmod 600 "${req}"
                set +e
                code="$(curl -sS --connect-timeout 10 --max-time 60 -o "${body}" -w '%{http_code}' \
                        -X POST -H 'content-type: application/json' --data-binary "@${req}" \
                        "${VAULT_ADDR}/v1/auth/${VAULT_AUTH_MOUNT}/login")"
                rc=$?
                set -e
                rm -f "${req}"
                if [ "${rc}" != "0" ]; then
                  echo "bump: FAIL — ${VAULT_ADDR}: curl exited ${rc} on the kubernetes-auth login; the carrier credentials cannot be read, so the class-(a) search cannot be made" >&2
                  return 1
                fi
                if [ "${code}" != "200" ]; then
                  echo "bump: FAIL — Vault answered ${code} to a login as role ${VAULT_ROLE} at auth/${VAULT_AUTH_MOUNT}. That role is seeded with the cluster (digita-deploy ansiwise/programs/deploy-gitops.yaml) and binds the ServiceAccount pipeline-sa in a namespace labelled hostyour.cloud/build; a 403 here means the role, the label or the account does not match this pod." >&2
                  return 1
                fi
                VAULT_CLIENT_TOKEN="$(yq -p=json -o=y '.auth.client_token // ""' "${body}")"
                rm -f "${body}"
                if [ -z "${VAULT_CLIENT_TOKEN}" ]; then
                  echo "bump: FAIL — the Vault login answered 200 and carried no auth.client_token; nothing can be read with it" >&2
                  return 1
                fi
              }

              # carrier_credential <unit> <repoURL> — put THAT unit's own PAT,
              # path-qualified to THAT repository, in front of git for the clone
              # and the push below. Fail-closed at every arm: a registration
              # states this unit deploys at this stage, so a credential that
              # cannot be read is a search that cannot be made, never one that
              # found nothing.
              carrier_credential() {
                local cname="$1" crepo="$2" body code rc pat
                vault_login
                body="$(mktemp)"
                set +e
                code="$(curl -sS --connect-timeout 10 --max-time 60 -o "${body}" -w '%{http_code}' \
                        -H "x-vault-token: ${VAULT_CLIENT_TOKEN}" \
                        "${VAULT_ADDR}/v1/${VAULT_KV_MOUNT}/data/build/${cname}/repo-pat")"
                rc=$?
                set -e
                if [ "${rc}" != "0" ]; then
                  echo "bump: FAIL — ${VAULT_ADDR}: curl exited ${rc} reading ${VAULT_KV_MOUNT}/build/${cname}/repo-pat" >&2
                  return 1
                fi
                if [ "${code}" != "200" ]; then
                  echo "bump: FAIL — Vault answered ${code} for ${VAULT_KV_MOUNT}/build/${cname}/repo-pat. The registration of ${cname} names a repo credential, so that entry is what onboarding seeded for it; 404 means it is gone and 403 means role ${VAULT_ROLE} may not read it." >&2
                  return 1
                fi
                pat="$(yq -p=json -o=y '.data.data.pat // ""' "${body}")"
                rm -f "${body}"
                if [ -z "${pat}" ]; then
                  echo "bump: FAIL — ${VAULT_KV_MOUNT}/build/${cname}/repo-pat carries no property 'pat'; that is the one property every reader of this entry takes" >&2
                  return 1
                fi
                printf 'https://x-access-token:%s@%s\n' "${pat}" "${crepo#https://}" >> "${CREDENTIALS_FILE}"
              }

              # ── class (a): every registration with a chartPath ─────────────
              # Each carrier is cloned and pushed under ITS OWN credential, so a
              # foreign PRIVATE repository is inside this search instead of
              # refusing it. What the three ESO records cover is the set of
              # repositories every run writes — this unit's own, the catalog's
              # and hostyour-cloud's; a carrier's record is added here, for the
              # one registration being read.
              #
              # THIS UNIT'S OWN REGISTRATION IS READ LIKE ANY OTHER, with no arm
              # of its own: its record is appended after the ESO one, git's store
              # answers with the FIRST match, and both name the same repository
              # and the same secret/build/<unit>/repo-pat entry. A special case
              # here would be a second rule to keep true against the first, for a
              # saving of one read.
              for reg in "${WORK}"/books/registrations/*/"${STAGE}.yaml"; do
                [ -f "${reg}" ] || continue
                rname="$(yq eval '.name' "${reg}")"
                rrepo="$(yq eval '.repoURL' "${reg}")"
                rchart="$(yq eval '.chartPath // ""' "${reg}")"
                rcluster="$(yq eval '.cluster // ""' "${reg}")"
                # The registration's own answer to "is this repository private":
                # ConsumerRegistrationSchema (hostyour-manager shared/consumer.ts)
                # carries repoCredentialId for a private repo and omits it for a
                # public one, and the Manager's search branches on exactly
                # this field.
                rcred="$(yq eval '.repoCredentialId // ""' "${reg}")"
                [ -n "${rchart}" ] || continue
                # An `if`, not a `||` list: a command on the right of `||` runs
                # in a condition context, where set -e does NOT fire, so a
                # carrier whose credential Vault refused would fall through to
                # the clone as though it had none — the exact silence this
                # change exists to end.
                if [ -n "${rcred}" ]; then
                  carrier_credential "${rname}" "${rrepo}"
                fi
                dest="${WORK}/carrier-${rname}"
                # Fail-closed: a registered stage whose delivery branch cannot
                # be read is a search we cannot complete — not completed-ok.
                git clone -q --depth 1 --branch "deploy/${STAGE}" "${rrepo}" "${dest}" \
                  || { echo "bump: FAIL — cannot read ${rrepo}@deploy/${STAGE} (registration ${rname}); the search over its pins is impossible." >&2
                       if [ -n "${rcred}" ]; then
                         echo "  This run presented ${rname}'s OWN PAT, read from ${VAULT_KV_MOUNT}/build/${rname}/repo-pat, so what was refused is the branch or that PAT — not the choice of credential." >&2
                       else
                         echo "  ${rname}'s registration carries no repoCredentialId, so it was cloned unauthenticated; a repository that has become private since it was registered is refused here." >&2
                       fi
                       exit 1; }
                vf="${dest}/${rchart}/values-${STAGE}.yaml"
                [ -f "${vf}" ] || { echo "bump: ${rname} has no ${rchart}/values-${STAGE}.yaml — no pin surface, skipping"; continue; }
                BUMPED=0
                bump_file "${vf}"
                if [ "${BUMPED}" = "1" ]; then
                  commit_push "${dest}" "deploy/${STAGE}" "${rname} ${rchart}/values-${STAGE}.yaml"
                  echo "consumer ${rname} ${rcluster}" >> "${HITS_FILE}"
                fi
              done

              # The carriers are read and written; the login has no further use.
              # Handing it back beats letting it stand for its whole TTL, and it
              # is the same close the Manager makes after every Vault call.
              if [ -n "${VAULT_CLIENT_TOKEN}" ]; then
                curl -sS --connect-timeout 10 --max-time 60 -o /dev/null \
                  -X POST -H "x-vault-token: ${VAULT_CLIENT_TOKEN}" \
                  "${VAULT_ADDR}/v1/auth/token/revoke-self" \
                  || echo "bump: the Vault token could not be revoked and stands until its own TTL expires; every pin of this release is unaffected" >&2
                VAULT_CLIENT_TOKEN=""
              fi

              # ── class (b): this installation's tenant pins ─────────────────
              # The charts are read off the catalog's trunk — they are product,
              # shared by every installation — but the pin is NOT written there.
              # A tag says which version THIS installation runs, and a tag on a
              # branch every installation reads means one installation's build
              # decides another's version, with the next bump overwriting it. So
              # the pin stands per stage in the catalog's per-chart pins-<stage>.yaml on
              # this installation's books branch in the catalog, which the
              # tenants ApplicationSet layers over the chart's own values.yaml.
              #
              # "Absent" and "unreadable" are two different answers and are
              # answered separately: ls-remote says whether the ref exists at
              # all, and a books branch that does not exist yet means this
              # installation has never registered a tenant — a real, empty
              # reach, announced, and nothing to pin because nothing of the
              # catalog is deployed. Anything else (network, credential, a
              # wedged remote) is a search that could not be made, and a search
              # that could not be made is never reported as one that found
              # nothing.
              git clone -q --depth 1 --branch master "${DEPLOY_URL}" "${WORK}/catalog"
              BUMPED_CHARTS=""
              TENANT_REGS=""
              if ! DEPLOY_HEADS="$(git ls-remote --heads "${DEPLOY_URL}" "${BOOKS_BRANCH}")"; then
                echo "bump: FAIL — cannot reach ${DEPLOY_URL} to look for the books branch ${BOOKS_BRANCH}; this installation's tenant pins can neither be read nor written" >&2
                exit 1
              fi
              if [ -z "${DEPLOY_HEADS}" ]; then
                echo "bump: ${DEPLOY_URL} carries no branch ${BOOKS_BRANCH} — this installation has registered no tenant, so there is no tenant pin to write and a catalog bump reaches none"
              else
                git clone -q --depth 1 --branch "${BOOKS_BRANCH}" "${DEPLOY_URL}" "${WORK}/catalog-books" \
                  || { echo "bump: FAIL — cannot read ${DEPLOY_URL}@${BOOKS_BRANCH}, this installation's tenant pins and registrations; neither the write nor the reach is possible" >&2; exit 1; }
                TENANT_REGS="${WORK}/catalog-books/registrations"
                for cdir in "${WORK}"/catalog/charts/*/; do
                  cname="$(basename "${cdir}")"
                  # A chart with no builds[] of its own ships no image (the
                  # library chart is the case) and has no pin surface.
                  [ -f "${cdir}values.yaml" ] || continue
                  [ "$(yq eval '.builds // "" | length' "${cdir}values.yaml")" != "0" ] || continue
                  pins="${WORK}/catalog-books/charts/${cname}/pins-${STAGE}.yaml"
                  SEEDED=0
                  if [ ! -f "${pins}" ]; then
                    # First pin for this chart on this installation. helm
                    # REPLACES a list rather than merging it, so the file must
                    # carry the WHOLE builds[] or the render loses the entries
                    # it does not name — it is therefore seeded from the chart's
                    # product default and only then bumped.
                    mkdir -p "$(dirname "${pins}")"
                    { printf '# %s image pins for %s in THIS installation, written by the release\n' "${cname}" "${STAGE}"
                      printf '# pipeline. The catalog trunk carries the product default; this file carries what\n'
                      printf '# this installation built, and the tenants ApplicationSet layers it over the chart.\n'
                      printf '# The list is COMPLETE because helm replaces a list rather than merging it.\n'
                      yq eval '{"builds": .builds}' "${cdir}values.yaml"
                    } > "${pins}"
                    SEEDED=1
                  fi
                  BUMPED=0
                  bump_file "${pins}"
                  if [ "${BUMPED}" = "1" ]; then
                    BUMPED_CHARTS="${BUMPED_CHARTS} ${cname}"
                  elif [ "${SEEDED}" = "1" ]; then
                    # Seeded but not hit: this release builds no image this
                    # chart declares. Leaving the file would commit a pin
                    # nothing decided, on every chart, on every release.
                    rm -f "${pins}"
                  fi
                done
                commit_push "${WORK}/catalog-books" "${BOOKS_BRANCH}" "catalog per-chart pins-${STAGE}.yaml"
              fi

              # ── tenant hits: who renders a bumped catalog chart ────────────
              # A class-(b) hit changes a chart that tenant member Applications
              # render. WHICH ones is derived, never listed: the tenant
              # ApplicationSets under clusters/argocd/apps/ state which member
              # sources which chart and how its Application is named, and the
              # tenant registrations state which tenants exist on which
              # cluster. Those registrations are NOT on the catalog's trunk —
              # the Manager writes them onto this installation's books
              # branch there, the same name hostyour-cloud's books carry, and the
              # pin written above stands beside them. TENANT_REGS points into
              # that clone and is empty exactly when the branch does not exist,
              # which is also when nothing was pinned.
              # Each appset's template is evaluated
              # with helm's go-template engine against the generator's own
              # param set — the registration's flat fields, plus the file-path
              # metadata and the derived values.guid the generator adds, one
              # render per apps[] element for a matrix appset — so a new
              # member appset or a new tenant is picked up with no edit here.
              # The trunk appsets are read (the per-cluster selector is only
              # WHERE an Application lives, which the registration's cluster
              # field answers for the sync below).
              if [ -n "${BUMPED_CHARTS}" ]; then
                SIM="${WORK}/appset-sim"
                mkdir -p "${SIM}/templates"
                printf 'apiVersion: v2\nname: appset-sim\nversion: 0.0.0\n' > "${SIM}/Chart.yaml"
                # render_member <appset file> <params file> — the Application
                # name and its chart sources, rendered as the generator would.
                # The brace escapes keep the with/end wrapper OUT of this
                # chart's own render and IN the emitted sim template.
                render_member() {
                  { printf '{{ "{{" }}- define "app" -}}\n'
                    yq eval '.spec.template' "$1"
                    printf '{{ "{{" }}- end -}}\n{{ "{{" }} include "app" .Values.params }}\n'
                  } > "${SIM}/templates/app.yaml"
                  { printf '{{ "{{" }}- define "patch" -}}\n'
                    yq eval '.spec.templatePatch' "$1"
                    printf '{{ "{{" }}- end -}}\n{{ "{{" }} include "patch" .Values.params }}\n'
                  } > "${SIM}/templates/patch.yaml"
                  helm template appset-sim "${SIM}" -f "$2"
                }
                # ONE parameterized argocd tree, not three per-stage ones: the
                # appsets stand at clusters/argocd/apps/*.yaml and carry the stage as the
                # marker __STAGE__, which the branch program fills when an
                # installation's branch is cut. This is the trunk clone, so the
                # marker is still standing, and the sim fills it for the stage
                # being bumped before reading anything out of the file — the
                # Application name is "<guid>-<member>-__STAGE__", and an
                # unfilled marker there fails the shape check on every member.
                # The other three markers of this tree (__CLUSTER_NAME__,
                # __BOOKS_FQDN__, __CATALOG_REPO__) stand in the generator, the
                # selector and the source repoURLs, none of which this
                # derivation reads.
                for src in "${WORK}"/hostyour-cloud/clusters/argocd/apps/*.yaml; do
                  [ -f "${src}" ] || continue
                  asname="$(basename "${src}")"
                  as="${WORK}/filled-${asname}"
                  sed "s/__STAGE__/${STAGE}/g" "${src}" > "${as}"
                  [ "$(yq eval '.kind // ""' "${as}")" = "ApplicationSet" ] || continue
                  # Only the tenant fan-out labels its Applications
                  # platform/tenant; every other appset in the directory is
                  # not a tenant carrier.
                  [ -n "$(yq eval '.spec.template.metadata.labels."platform/tenant" // ""' "${as}")" ] || continue
                  matrix="$(yq eval '.spec.generators[0] | has("matrix")' "${as}")"
                  # Which registration list the matrix fans out over, read off the
                  # appset itself: elementsYaml is a template action over one field.
                  LEG=""
                  if [ "${matrix}" = "true" ]; then
                    LEG="$(yq eval '.spec.generators[0].matrix.generators[1].list.elementsYaml // ""' "${as}" \
                           | sed -nE 's/^.*\{\{[[:space:]]*\.([A-Za-z0-9_]+)[[:space:]]*\|.*$/\1/p')"
                    [ -n "${LEG}" ] || { echo "bump: FAIL — ${asname} is a matrix whose list leg names no registration field; the tenant reach cannot be derived" >&2; exit 1; }
                  fi
                  [ -n "${TENANT_REGS}" ] || continue
                  for reg in "${TENANT_REGS}"/*/"${STAGE}.yaml"; do
                    [ -f "${reg}" ] || continue
                    guid="$(basename "$(dirname "${reg}")")"
                    rcluster="$(yq eval '.cluster' "${reg}")"
                    if [ -n "${LEG}" ]; then
                      IDX="$(seq 0 $(( $(yq eval ".${LEG} | length" "${reg}") - 1 )))"
                    else
                      IDX="-"
                    fi
                    for i in ${IDX}; do
                      PARAMS="${WORK}/params.yaml"
                      if [ "${i}" = "-" ]; then
                        yq eval ". as \$r | {\"params\": (\$r * {\"values\": {\"guid\": \"${guid}\"}, \"path\": {\"segments\": [\"registrations\", \"${guid}\"]}})}" \
                          "${reg}" > "${PARAMS}"
                      else
                        yq eval ". as \$r | {\"params\": ((\$r * .${LEG}[${i}]) * {\"values\": {\"guid\": \"${guid}\"}, \"path\": {\"segments\": [\"registrations\", \"${guid}\"]}})}" \
                          "${reg}" > "${PARAMS}"
                      fi
                      RENDERED="$(render_member "${as}" "${PARAMS}")"
                      # Three resolution checks guard the sync decision, and the
                      # Application name plus the source paths are all of the
                      # render it consumes. An unconsumed template action would
                      # leave braces behind; a stamp marker would leave its own
                      # text; and a param helm could not resolve leaves a GAP,
                      # because helm strips the missing-key marker from every
                      # render — which is why the third check is the name's
                      # <guid>-<member>-<stage> shape and not marker text.
                      if printf '%s' "${RENDERED}" | grep -qE '[{][{]'; then
                        echo "bump: FAIL — ${asname} left unrendered template actions against ${reg#"${WORK}/"} — the tenant sync cannot be derived:" >&2
                        printf '%s\n' "${RENDERED}" | grep -nE '[{][{]' >&2
                        exit 1
                      fi
                      ANAME="$(printf '%s\n' "${RENDERED}" | yq eval-all 'select(.metadata != null) | .metadata.name')"
                      APATHS="$(printf '%s\n' "${RENDERED}" | yq eval-all 'select(.spec.sources != null) | .spec.sources[].path // ""')"
                      # A marker still standing in one of those two values is an
                      # unanswered value rather than a mismatch: the name would
                      # name no Application and the path would match no chart,
                      # and either takes the reach to empty with nothing said.
                      # The markers in the source repoURLs and targetRevisions
                      # are not read here and are left where they are.
                      if printf '%s\n%s\n' "${ANAME}" "${APATHS}" | grep -q '__[A-Z][A-Z_]*__'; then
                        echo "bump: FAIL — ${asname} rendered an unfilled __MARKER__ into a value the tenant reach reads against ${reg#"${WORK}/"} — name '${ANAME}', source paths:" >&2
                        printf '%s\n' "${APATHS}" >&2
                        exit 1
                      fi
                      case "${ANAME}" in
                        "${guid}"-?*-"${STAGE}") ;;
                        *)
                          echo "bump: FAIL — ${asname} derived Application name '${ANAME}' against ${reg#"${WORK}/"}, not <guid>-<member>-<stage> — a generator param did not resolve" >&2
                          exit 1 ;;
                      esac
                      for C in ${BUMPED_CHARTS}; do
                        if printf '%s\n' "${APATHS}" | grep -qx "charts/${C}"; then
                          grep -qxF "tenant ${ANAME} ${rcluster}" "${HITS_FILE}" \
                            || echo "tenant ${ANAME} ${rcluster}" >> "${HITS_FILE}"
                        fi
                      done
                    done
                  done
                done
              fi

              # ── class (c): the hostyour-cloud platform pins on master ────────
              # NOT synced from here: they live on master and the cluster
              # release delivers them.
              for vf in "${WORK}"/hostyour-cloud/clusters/inventories/*/"values-${STAGE}.yaml"; do
                [ -f "${vf}" ] || continue
                bump_file "${vf}"
              done
              commit_push "${WORK}/hostyour-cloud" master "hostyour-cloud clusters/inventories/*/values-${STAGE}.yaml"

              # ── the reach must exist: an image nothing pins is a defect ────
              MISSING=""
              for P in ${IMAGES}; do
                echo "bump: ${P} — ${HIT_COUNT[$P]} pin(s) bumped to ${IMAGE_TAG} for ${STAGE}"
                [ "${HIT_COUNT[$P]}" != "0" ] || MISSING="${MISSING} ${P}"
              done
              if [ -n "${MISSING}" ]; then
                echo "bump: FAIL — no pin found for builds[].image ==${MISSING}:" >&2
                echo "  searched (a) registrations with chartPath on ${CLOUD_URL} ${BOOKS_BRANCH}," >&2
                echo "           (b) ${DEPLOY_URL} charts/*/ declaring the image, pinned on ${BOOKS_BRANCH}," >&2
                echo "           (c) ${CLOUD_URL} master clusters/inventories/*/values-${STAGE}.yaml." >&2
                echo "  A release nothing pins deploys nowhere — add the pin or drop the build." >&2
                echo "  With (b): a catalog image is pinned only once this installation has registered" >&2
                echo "  a tenant, because the pin stands on the books branch beside the registrations." >&2
                exit 1
              fi
            computeResources:
              requests: { cpu: 100m, memory: 128Mi }
              limits: { cpu: 500m, memory: 512Mi }

          # The sync: poke ArgoCD for every Application hit so the bump
          # commit deploys now instead of on the next poll. Consumer hits are
          # scoped to the UNIT's own Applications — exactly what the
          # onboarding argo-sync grant admits (resourceNames
          # <unit>-dev/-test/-prod in the unit's argoNamespace); a foreign
          # registration's hit is left to ArgoCD's own poll and said so.
          # Tenant hits carry the full member Application name
          # <guid>-<member>-<stage>: the create-tenant run put it in the
          # tenant grant's resourceNames, so the patch reaches exactly that
          # one Application — "sync that one namespace only".
          #
          # THIS STEP RUNS AFTER EVERY PIN IS COMMITTED AND PUSHED, and kubectl
          # here reads the in-cluster config of the cluster the BUILD PLANE runs
          # on, which is not necessarily the cluster the Applications stand on.
          # Every Application of an installation lives on the cluster holding
          # the master role: ns argocd for that cluster's own units, ns <slave>
          # for a slave, because a slave's ArgoCD instance is deployed INTO the
          # master (clusters/slaves/slave/Chart.yaml). The build plane may be a
          # pure slave, and then this API server holds none of them. That is
          # derived from the two branch names — global.domain is this cluster's
          # install branch, global.booksBranch is the master's — and stated
          # BEFORE any call, instead of discovered as a NotFound that fails a
          # release whose pins already landed.
          - name: argo-sync
            image: alpine/k8s:1.35.6
            env:
              - name: UNIT
                value: {{ $unit | quote }}
              - name: STAGE
                value: $(params.stage)
              - name: CLUSTER_NAME
                value: {{ .Values.global.clusterName | default "" | quote }}
              # This build plane's own install branch, and the install branch of
              # the cluster holding the master role. Equal exactly when this
              # build plane IS that cluster.
              - name: DOMAIN
                value: {{ required "consumer-build: global.domain is required (clusters/active/<fqdn>.yaml, the fqdn of the cluster this build plane runs on — the argo-sync cannot say whether the Applications are on this API server without it)" .Values.global.domain | quote }}
              - name: BOOKS_BRANCH
                value: {{ required "consumer-build: global.booksBranch is required (clusters/active/<fqdn>.yaml, rendered per install branch from the cluster map — the install branch of the cluster holding the master role, which carries this installation's registrations)" .Values.global.booksBranch | quote }}
              - name: HITS_FILE
                value: /bump/hits
            volumeMounts:
              - { name: bump-scratch, mountPath: /bump }
              - { name: argo-sync-token, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true }
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              if [ ! -s "${HITS_FILE}" ]; then
                echo "argo-sync: no Application hits — nothing to sync"
                exit 0
              fi
              if [ "${DOMAIN}" != "${BOOKS_BRANCH}" ]; then
                echo "argo-sync: this build plane runs on ${DOMAIN}; every Application of this installation stands on ${BOOKS_BRANCH}, the cluster holding the master role, whose API server is not this one. The pins ARE committed and pushed — the hits below reach the cluster on ArgoCD's own poll of the branches they were written to:"
                cat "${HITS_FILE}"
                exit 0
              fi
              while read -r kind rname rcluster; do
                case "${kind}" in
                  consumer)
                    if [ "${rname}" != "${UNIT}" ]; then
                      echo "argo-sync: ${rname}-${STAGE} bumped but not synced (no grant for a foreign unit's Application; ArgoCD's own poll delivers it)"
                      continue
                    fi
                    app="${rname}-${STAGE}"
                    ;;
                  tenant)
                    # rname is already the full member Application name
                    # <guid>-<member>-<stage>, as the bump derived it.
                    app="${rname}"
                    ;;
                  *) continue ;;
                esac
                # The Application lives beside its ArgoCD instance: ns argocd
                # for this master's own cluster, ns <slave> for a slave.
                if [ -n "${CLUSTER_NAME}" ] && [ "${rcluster}" = "${CLUSTER_NAME}" ]; then
                  ns="argocd"
                else
                  ns="${rcluster}"
                fi
                echo "argo-sync: refreshing application ${app} in ns ${ns}"
                if ! kubectl annotate application.argoproj.io "${app}" -n "${ns}" \
                     argocd.argoproj.io/refresh=normal --overwrite; then
                  echo "argo-sync: FAIL — ${app} in ns ${ns} could not be refreshed. THE PINS OF THIS RELEASE ARE ALREADY COMMITTED AND PUSHED; re-running this release re-derives the same pins and writes nothing new, so the thing to fix is the reach — the argo-sync Role in ns ${ns}, or an Application of another name — and then to refresh it by hand." >&2
                  exit 1
                fi
              done < "${HITS_FILE}"
            computeResources:
              requests: { cpu: 50m, memory: 64Mi }
              limits: { cpu: 200m, memory: 128Mi }
{{- end }}
