{{- /*
The storage box login the `recovery-export` task writes the recovery folder of the owner's master with: host,
user and password at secret/<env>/app/storage-box, the installation's one login, which master-backup and the
Manager's backup and move jobs write with too. It is read through the store <secretStoreName>-recovery-export
(secretstore-recovery-export.yaml), whose role reads that entry and nothing else, and never through the
namespace's build-eso store, which every build namespace logs in under. Three units write the folder, each in
its own namespace: the platform tree at every platform tag, the platform's own builds before their bump pins
them, and the engine before its tag (consumer-build.writesRecoveryFolder). The task writes below
<global.domain>/recovery/ of the login's root alone.

WHAT ONE ACCOUNT COSTS. The login is the storage box's main account, and it opens the whole box: the build
plane can read and delete the master backups (sealed with BACKUP_PASSPHRASE, so a read yields ciphertext, and
a delete loses them) and every tenant and consumer backup the Manager wrote. Nothing guarantees against that.
The main account's password may also unlock the Hetzner Robot, and so delete the machine the installation
runs on; that is not verified. What bounds it: the login stands in the steps present and upload alone, which
run rclone and no code of a repository, and never sync, move or delete, and in the listing pod of
lifecycle/release-platform.sh, which carries the task's label and runs the same two lines of rclone; the pod
reaches only the box's addresses on port 22 (networkpolicy.yaml, recovery-export-egress); and only the account of
the three writer namespaces reads the entry. Rendered for those three units on the owner's master alone, and
mounted by that one task and that listing pod.
*/ -}}
{{- if eq (include "consumer-build.writesRecoveryFolder" .) "true" }}
{{- $unit := include "consumer-build.unitName" . -}}
{{- $env := required "consumer-build: global.env is required (platform values chain)" .Values.global.env -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: recovery-box
  namespace: {{ printf "%s-build" $unit }}
  labels:
    app.kubernetes.io/name: consumer-build
    app.kubernetes.io/component: recovery-box
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    image-builder.io/consumer: {{ $unit | quote }}
spec:
  # The platform-wide delivery rule, stated in full in clusters/charts/external-secret/templates/externalsecret.yaml:
  # the Secret is written when this ExternalSecret is deployed or changed and when the Secret is deleted.
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: {{ printf "%s-recovery-export" .Values.global.secretStoreName }}
    kind: SecretStore
  target:
    name: recovery-box
    creationPolicy: Owner
  data:
    {{- range list "host" "user" "password" }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ printf "%s/app/storage-box" $env }}
        property: {{ . }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    {{- end }}
{{- end }}
