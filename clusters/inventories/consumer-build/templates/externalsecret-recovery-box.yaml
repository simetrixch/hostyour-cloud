{{- /*
The storage-box login the `recovery-export` task writes the recovery folder of the owner's master with: host,
user and password at secret/build/<unit>/recovery-box, through this namespace's build-eso SecretStore, which
reads secret/build/<unit>/* and nothing of a sibling. Three units write the folder, each in its own namespace
and each with its own copy of the login: the platform tree at every platform tag, the platform's own builds
before their bump pins them, and the engine before its tag (consumer-build.writesRecoveryFolder). It is a
sub-account of its own whose base directory is <fqdn>/recovery/, so the build plane can neither read nor
delete a backup beside it. Not the Manager's storage-box entry, which opens every relocation dump, and not
the operator's backup login, which opens every backup. Rendered for those three units on the owner's master
alone, and mounted by that one task.
*/ -}}
{{- if eq (include "consumer-build.writesRecoveryFolder" .) "true" }}
{{- $unit := include "consumer-build.unitName" . -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: recovery-box
  namespace: {{ printf "%s-build" $unit }}
  labels:
    app.kubernetes.io/name: consumer-build
    app.kubernetes.io/component: recovery-box
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    image-builder.io/consumer: {{ $unit | quote }}
spec:
  # The platform-wide delivery rule, stated in full in clusters/charts/external-secret/templates/externalsecret.yaml:
  # the Secret is written when this ExternalSecret is deployed or changed and when the Secret is deleted.
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: {{ .Values.global.secretStoreName }}
    kind: SecretStore
  target:
    name: recovery-box
    creationPolicy: Owner
  data:
    {{- range list "host" "user" "password" }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ printf "build/%s/recovery-box" $unit }}
        property: {{ . }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    {{- end }}
{{- end }}
