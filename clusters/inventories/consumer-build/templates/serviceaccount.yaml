{{- /*
SA for the unit's PipelineRun pods (taskRunTemplate.serviceAccountName in the
deploy-request TriggerTemplate). The chart ships NO Role/RoleBinding for it:
steps consume Secrets via envFrom / mounts only (kubelet needs no API grant
for that), and the API grant a run does need — the argo-sync patch on the
unit's own Applications in its argoNamespace, and on the member Applications
of the tenants whose images it builds — is provisioned imperatively at
onboarding, scoped by resourceNames to exactly those objects.

NO TOKEN IS MOUNTED (the gate-runner pipeline-sa pattern). One TaskRun of this
pipeline builds the unit's own Containerfile: every RUN layer and every npm
lifecycle script of its dependency tree executes there, privileged and as uid
0. A ServiceAccount token in that pod's filesystem is that code's token, and
this one may patch an Application whose syncPolicy is automated — control over
what a tenant deploys. The single step that must call the API, the bump task's
argo-sync, mounts a projected token of this same SA explicitly
(templates/pipeline-release.yaml), so the grants above still apply where they
are used and nowhere else.
*/ -}}
{{- if .Values.unit }}
{{- $unit := include "consumer-build.unitName" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-sa
  namespace: {{ printf "%s-build" $unit }}
  labels:
    app.kubernetes.io/name: consumer-build
    app.kubernetes.io/component: pipeline-sa
    image-builder.io/consumer: {{ $unit | quote }}
automountServiceAccountToken: false
{{- end }}
