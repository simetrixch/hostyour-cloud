{{- /*
The claim of the cache of the ci runs of THIS unit, `ci-cache`, which the check step of the ci Pipeline mounts
(templates/pipeline-ci.yaml): the Go module and build caches, the helm repository cache, the pnpm content store and the
tool archives of ci-install-tools.sh, one directory per tool and version. A cache shared between units is refused: one
unit's run could write what another reads. What a cache can poison is bounded by what the tools verify themselves (go.sum,
the integrity of pnpm-lock.yaml, the sha256 of ci-install-tools.sh), and the check step prints the size and what it
evicted, so the volume stays under ciCache.size.

The storage class binds a claim on its first consumer. A unit that has no ci run never binds it, and Argo CD reports a
claim Healthy only when it is Bound, so the Application of such a unit would show Progressing for ever: the claim carries
the annotation that leaves it out of the health of the Application.
*/ -}}
{{- if .Values.unit }}
{{- $unit := include "consumer-build.unitName" . -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ci-cache
  namespace: {{ printf "%s-build" $unit }}
  labels:
    app.kubernetes.io/name: consumer-build
    app.kubernetes.io/component: ci-cache
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    image-builder.io/ci: {{ $unit | quote }}
  annotations:
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: microk8s-hostpath
  resources:
    requests:
      storage: {{ required "consumer-build: ciCache.size is required" .Values.ciCache.size | quote }}
{{- end }}
