{{- /*
The ci check's GitHub token. ESO renders the property `issues` of the unit's
entry secret/build/<unit>/repo-pat into the key `token`, which the check step of
the <unit>-ci Pipeline reads as GITHUB_TOKEN: a repository's check reads the
labels of the issues a change names with it.

The check runs the repository's own code, so this is the one GitHub token in its
reach, and it is narrow: the Manager mints it as it mints `push`, for the unit's
own repository with the permission issues: read and nothing else, and rewrites
it with the entry, for every unit. For a unit whose credential is a PAT the Manager writes the property
empty, so the check there gets an empty token. Never `pat` or `push`: those
write.

It renders for every unit, because every unit has the ci Pipeline.
*/ -}}
{{- if .Values.unit }}
{{- $unit := include "consumer-build.unitName" . -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: build-issues-read
  namespace: {{ printf "%s-build" $unit }}
  labels:
    app.kubernetes.io/name: consumer-build
    app.kubernetes.io/component: build-issues-read
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    image-builder.io/consumer: {{ $unit | quote }}
spec:
  # Delivered as build-git-https is: on deploy and when the Manager, after it
  # rewrote the entry in Vault, changes an annotation of this ExternalSecret.
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: {{ .Values.global.secretStoreName }}
    kind: SecretStore
  target:
    name: build-issues-read
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # ESO's own template braces, passed through by Helm verbatim.
        token: "{{ `{{ .issues }}` }}"
  data:
    - secretKey: issues
      remoteRef:
        # Emit every defaulted remoteRef field so ArgoCD sees no server-side
        # drift (clusters/charts/external-secret rule).
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        key: {{ printf "build/%s/repo-pat" $unit }}
        property: issues
{{- end }}
