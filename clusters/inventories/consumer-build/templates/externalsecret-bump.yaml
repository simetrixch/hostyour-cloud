{{- /*
The bump task's git-write credential set — and ONLY the bump task's: the
<unit>-release Pipeline mounts this Secret in its bump task alone, so the two
platform PATs are never in reach of a step that runs unit code.

THESE THREE ARE THE REPOSITORIES EVERY RUN WRITES, and they are not all the
repositories a run writes. The three: the unit's OWN chart on its deploy/<stage>
branch (the unit's push token, property `push` of its entry, which writes that
one repository and no other), the deploy repository on master and the hostyour-cloud
platform pins on master (the two platform PATs, on the build-platform/ tier of
the secret store). The rest are the OTHER units the class-(a) search finds registered at
the stage being released; their push tokens stand at the same
secret/build/<unit>/repo-pat as this one, and the bump reads each of them at run
time under its own Vault role, because which units are registered changes with
every onboarding and this chart is not re-rendered when it does
(templates/pipeline-release.yaml, the carrier-credential block of the bump).

All the hosts are github.com, so a host-matched credential store could not tell
them apart — every record, the three here and the ones the bump appends, carries
the FULL repo path, and the bump's git config sets credential.useHttpPath=true,
which makes git select the record by repo, not by host.

THE TWO PLATFORM PATS ARE NO UNIT'S ENTRY, so they stand under build-platform/
and never at build/<unit>/repo-pat: that leaf is the unit's own, written whole
by the Manager, and a unit named hostyour-cloud or deploy reads its own
build/hostyour-cloud/repo-pat or build/deploy/repo-pat as `unit-pat` beside
them.
*/ -}}
{{- if and .Values.unit (eq (include "consumer-build.hasBuilds" .) "true") }}
{{- $unit := include "consumer-build.unitName" . -}}
{{- $repoURL := required "consumer-build: unit.repoURL is required (stamped by the fan-out ApplicationSet)" .Values.unit.repoURL -}}
{{- $repoPath := $repoURL | trimPrefix "https://" -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bump-git-https
  namespace: {{ printf "%s-build" $unit }}
  labels:
    app.kubernetes.io/name: consumer-build
    app.kubernetes.io/component: bump-git-https
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    image-builder.io/consumer: {{ $unit | quote }}
spec:
  # No periodic read of Vault — the platform-wide delivery rule, stated in full in
  # hostyour-cloud clusters/charts/external-secret/templates/externalsecret.yaml: a secret
  # arrives on DEPLOY (OnChange re-syncs when this CR changes) and on target-Secret
  # DELETION (OnChange creates it when absent), never on a timer. The Manager's App-token
  # refresh puts a NEW value in front of the pipeline in two acts of its own: write it
  # into Vault, then change an annotation of this ExternalSecret so ESO writes the
  # target again. The old Secret stands until it has, and the pipeline reads the Secret
  # at each run, so nothing rolls.
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: {{ .Values.global.secretStoreName }}
    kind: SecretStore
  target:
    name: bump-git-https
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # One PATH-QUALIFIED credential-store record per repo the bump may
        # write. The `{{ "{{" }} ... {{ "}}" }}` placeholders are ESO's own
        # templating (v2, in-cluster), passed through Helm via the backtick
        # raw-string idiom; property names contain `-`, hence `index`.
        GITCREDENTIALS: |
          https://x-access-token:{{ `{{ index . "unit-pat" }}` }}@{{ $repoPath }}
          https://x-access-token:{{ `{{ index . "deploy-pat" }}` }}@{{ (required "consumer-build: global.deployUrl is required (clusters/active/<fqdn>.yaml, rendered per install branch from the cluster map's deploy-repo)" .Values.global.deployUrl) | trimPrefix "https://" }}
          https://x-access-token:{{ `{{ index . "cloud-pat" }}` }}@github.com/simetrixch/hostyour-cloud.git
  data:
    - secretKey: unit-pat
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        key: {{ printf "build/%s/repo-pat" $unit }}
        # The token that writes the unit's own repository and nothing else. A
        # CI-only unit's entry has no `push`, and it renders no bump credential.
        property: push
    - secretKey: deploy-pat
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        # Literal grant in the build-eso policy — the bump writes the deploy
        # repository's master branch for every unit. The leaf is named for the
        # ROLE the repository plays: which repository is this installation's deploy
        # repository is its own choice, and a Vault path carrying that name would
        # put installation state into a chart.
        # WRITTEN BY THE MANAGER, with the platform's GitHub App's token minted afresh on the
        # same timer that refreshes every unit's repo-pat: a token
        # GitHub issues for an hour cannot be seeded once.
        key: build-platform/deploy/repo-pat
        property: pat
    - secretKey: cloud-pat
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        # Literal grant likewise, seeded with the cluster from
        # BUILD_HOSTYOUR_CLOUD_REPO_PAT — the platform pins under
        # clusters/inventories/ live on hostyour-cloud master (delivered by the
        # cluster release, never synced from here).
        key: build-platform/hostyour-cloud/repo-pat
        property: pat
{{- end }}
