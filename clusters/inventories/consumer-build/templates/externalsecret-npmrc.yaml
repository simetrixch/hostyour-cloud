{{- /*
Per-unit npm auth for the build (.npmrc). A unit with private
scoped npm deps needs an AUTHENTICATED `pnpm install
--frozen-lockfile` (GitHub Packages serves tarball metadata only to
authenticated clients; unauthenticated hits ERR_PNPM_TARBALL_URL_MISMATCH).
The credential is the `packages` property of the unit's entry
secret/build/<unit>/repo-pat — the ORGANISATION'S PACKAGES READER the Manager
seeds beside the repository token (`pat`, what the clone and the bump ride on;
hostyour-manager#220): a GitHub App installation token reads no private
package, whatever the App's permissions say, so the two are different tokens
in one entry. ESO assembles the complete .npmrc IN-CLUSTER, so neither token
appears in git, chart values or logs.

The buildah-build-push Task mounts THIS Secret (optional) at /npmrc — beside
the build context, never inside it — and passes it to `buildah bud --secret
id=npmrc`. A Containerfile reads it with
`RUN --mount=type=secret,id=npmrc,target=/root/.npmrc`, which buildah mounts
for that RUN alone and commits into no layer. The credential is therefore
absent from the build context, so a `COPY . .` cannot carry it into an image
that any other unit could pull.

REGISTRY LAYOUT of the generated .npmrc:
  1. NO default `registry=` line — unscoped (public) deps resolve from pnpm's
     own default, registry.npmjs.org, which is what the committed lockfile's
     tarball URLs were written against.
  2. The unit's OWN scope — the owner of its repository (_helpers.tpl
     consumer-build.repoOwner) — routed to GitHub Packages with the packages reader:
     `@<owner>:registry=https://npm.pkg.github.com` and
     `//npm.pkg.github.com/:_authToken=<ESO placeholder>`. A unit of another
     organisation therefore reaches its own packages with no value stated here.
*/ -}}
{{- if .Values.unit }}
{{- $unit := include "consumer-build.unitName" . -}}
{{- /* The _authToken value is ESO's OWN template placeholder (engineVersion
       v2, evaluated in-cluster by ESO, NOT Helm): `{{ .packages }}` for a plain
       identifier; a property name that is not a valid Go identifier (e.g.
       contains `-`) must use the `{{ index . "prop" }}` form or ESO's
       template parse fails. */ -}}
{{- $owner := include "consumer-build.repoOwner" . -}}
{{- $lines := list (printf "@%s:registry=https://npm.pkg.github.com" $owner) "//npm.pkg.github.com/:_authToken={{ .packages }}" -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: build-npmrc
  namespace: {{ printf "%s-build" $unit }}
  labels:
    app.kubernetes.io/name: consumer-build
    app.kubernetes.io/component: build-npmrc
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    image-builder.io/consumer: {{ $unit | quote }}
spec:
  # No periodic read of Vault — the platform-wide delivery rule, stated in full in
  # hostyour-cloud clusters/charts/external-secret/templates/externalsecret.yaml: a secret
  # arrives on DEPLOY (OnChange re-syncs when this CR changes) and on target-Secret
  # DELETION (OnChange creates it when absent), never on a timer. So putting a NEW
  # value in front of the pods is three acts: write it into Vault, delete the target
  # Secret so ESO fetches it, roll the pods (the restart-workloads run).
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: {{ .Values.global.secretStoreName }}
    kind: SecretStore
  target:
    name: build-npmrc
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        .npmrc: |
{{ $lines | join "\n" | indent 10 }}
  data:
    - secretKey: packages
      remoteRef:
        # Emit every defaulted remoteRef field so ArgoCD sees no server-side
        # drift (clusters/charts/external-secret rule).
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        # The token is the `packages` property of the unit's ONE stage-free entry —
        # the organisation's packages reader, never the repository token.
        key: {{ printf "build/%s/repo-pat" $unit }}
        property: packages
{{- end }}
