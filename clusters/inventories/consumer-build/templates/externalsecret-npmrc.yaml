{{- /*
Per-unit npm auth for the build (.npmrc). A lockfile names an npm package this
build plane publishes (templates/pipeline-publish.yaml) by its tarball URL
https://<registry>/v2/npm/<owner>/<name>/blobs/sha256:<hex>, and the registry
serves it to its pull identity alone, so the build's `pnpm install
--frozen-lockfile` reads it with that identity: `//<registry>/v2/npm/:_auth=<base64
of pull-user:pull-password>`, from the same <env>/app/registry entry the pull
Secret of templates/externalsecret-registry.yaml reads. ESO assembles the .npmrc
IN-CLUSTER, so the identity appears in no git, chart value or log.

The buildah-build-push Task mounts THIS Secret (optional) at /npmrc — beside
the build context, never inside it — and passes it to `buildah bud --secret
id=npmrc`. A Containerfile reads it with
`RUN --mount=type=secret,id=npmrc,target=/root/.npmrc`, which buildah mounts
for that RUN alone and commits into no layer. The credential is therefore
absent from the build context, so a `COPY . .` cannot carry it into an image
that any other unit could pull.

THE GENERATED .npmrc is that one line: no default `registry=` line, so a public
package resolves from pnpm's own default, registry.npmjs.org, as the committed
lockfile names it, and no scope is routed anywhere, because a lockfile names the
URL of every package itself. No line names GitHub Packages, and nothing reads a
`packages` property of the unit's build entry.
*/ -}}
{{- if .Values.unit }}
{{- $unit := include "consumer-build.unitName" . -}}
{{- $env := required "consumer-build: global.env is required (platform values chain)" .Values.global.env -}}
{{- /* The _auth value is ESO's OWN template (engineVersion v2, evaluated in-cluster by ESO, NOT Helm). */ -}}
{{- $zotLine := printf "//%s/v2/npm/:_auth={{ printf \"%%s:%%s\" .pullUser .pullPassword | b64enc }}" (include "common.registryHost" .) -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: build-npmrc
  namespace: {{ printf "%s-build" $unit }}
  labels:
    app.kubernetes.io/name: consumer-build
    app.kubernetes.io/component: build-npmrc
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    image-builder.io/consumer: {{ $unit | quote }}
spec:
  # No periodic read of Vault — the platform-wide delivery rule, stated in full in
  # hostyour-cloud clusters/charts/external-secret/templates/externalsecret.yaml: a secret
  # arrives on DEPLOY (OnChange re-syncs when this CR changes) and on target-Secret
  # DELETION (OnChange creates it when absent), never on a timer. The Manager's App-token
  # refresh puts a NEW value in front of the pipeline in two acts of its own: write it
  # into Vault, then change an annotation of this ExternalSecret so ESO writes the
  # target again. The old Secret stands until it has, and the pipeline reads the Secret
  # at each run, so nothing rolls.
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: {{ .Values.global.secretStoreName }}
    kind: SecretStore
  target:
    name: build-npmrc
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        .npmrc: |
          {{ $zotLine }}
  data:
    # The registry's pull identity, for the npm packages it serves.
    - secretKey: pullUser
      remoteRef:
        # Emit every defaulted remoteRef field so ArgoCD sees no server-side
        # drift (clusters/charts/external-secret rule).
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        key: {{ printf "%s/app/registry" $env }}
        property: pull-user
    - secretKey: pullPassword
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        key: {{ printf "%s/app/registry" $env }}
        property: pull-password
{{- end }}
