{{- /*
Thin wrapper, CATALOG mode only: emits the build fan-out ApplicationSet
verbatim from files/applicationset.yaml (kept OUTSIDE templates/ so ArgoCD's
own {{ }} goTemplate expressions survive Helm rendering untouched). Four
substitutions:

  __STAGE__    global.env.
  __REVISION__ revision — the commit of this repository the platform
               Application consumer-build synced, handed as a Helm parameter
               by clusters/argocd/files/platform-apps-appset.yaml. The
               generator and every source of this repository stand at it.
  __FQDN__     global.domain — this cluster's fqdn, which names its map.
  __CLUSTER__  global.clusterName — the cluster these build Applications deploy to, named the
               way its project allows it

Build-cluster only: this app is deployed via the platform catalog, and
clusters/inventories/consumer-build/app.yaml says runsOn: master, so the app generator creates
it on the build plane and nowhere else.
*/ -}}
{{- if not .Values.unit }}
{{- .Files.Get "files/applicationset.yaml" | replace "__CLUSTER__" (required "consumer-build: global.clusterName is required (clusters/active/<fqdn>.yaml) — the build Applications name the cluster they deploy to, and their project allows that name" .Values.global.clusterName) | replace "__STAGE__" .Values.global.env | replace "__REVISION__" (required "consumer-build: revision is required — the commit of this repository the platform Application synced, which clusters/argocd/files/platform-apps-appset.yaml hands this chart as the Helm parameter revision ($ARGOCD_APP_REVISION). The generator and the sources of the build ApplicationSet stand at it" .Values.revision) | replace "__FQDN__" .Values.global.domain }}
{{- end }}
