{{- /*
Thin wrapper, CATALOG mode only: emits the build fan-out ApplicationSet
verbatim from files/applicationset.yaml (kept OUTSIDE templates/ so ArgoCD's
own {{ }} goTemplate expressions survive Helm rendering untouched). Three
substitutions, and the two branches are DIFFERENT branches:

  __STAGE__  global.env.
  __RELEASE__ the release tag this cluster stands on, from the map's own
             `release:` line, which is where the CHART source below reads this
             chart from. Absent, it falls back to __BRANCH__, which is what
             that source read before the two were told apart.
  __BRANCH__ global.domain — the install branch of the cluster this build
             plane runs ON, which is where the generated Applications render
             this chart from. app.yaml says runsOn: master, so this chart is
             only ever generated on a cluster carrying the master part, and on
             such a cluster the domain IS the install branch.
  __CLUSTER__ global.clusterName — the cluster these build Applications deploy to, named the
              way its project allows it
  __BOOKS__  global.booksCluster — the install branch of the cluster holding
             the MASTER role, which is where the registrations the generator
             globs over stand (clusters/active/<fqdn>.yaml, written by the branch program).

They are the same value whenever the build plane sits on the cluster holding
the master role, which is the only cluster this chart is generated on — see the
runsOn line below. A cluster carrying only the slave part has no install branch
at all, so a build plane placed there would have no __BRANCH__ to name.

Build-cluster only: this app is deployed via the platform catalog, and
clusters/inventories/consumer-build/app.yaml says runsOn: master, so the app generator creates
it on the build plane and nowhere else.
*/ -}}
{{- if not .Values.unit }}
{{- $release := .Values.release | default .Values.global.domain }}
{{- .Files.Get "files/applicationset.yaml" | replace "__RELEASE__" $release | replace "__CLUSTER__" (required "consumer-build: global.clusterName is required (clusters/active/<fqdn>.yaml) — the build Applications name the cluster they deploy to, and their project allows that name" .Values.global.clusterName) | replace "__STAGE__" .Values.global.env | replace "__BRANCH__" .Values.global.domain | replace "__BOOKS__" (required "consumer-build: global.booksCluster is required (clusters/active/<fqdn>.yaml, rendered per install branch from the cluster map — the install branch of the cluster holding the master role, which carries this installation's registrations)" .Values.global.booksCluster) }}
{{- end }}
