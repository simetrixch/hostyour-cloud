{{- /*
Thin wrapper, CATALOG mode only: emits the build fan-out ApplicationSet
verbatim from files/applicationset.yaml (kept OUTSIDE templates/ so ArgoCD's
own {{ }} goTemplate expressions survive Helm rendering untouched). Three
substitutions, and the two branches are DIFFERENT branches:

  __STAGE__  global.env.
  __BRANCH__ global.domain — the install branch of the cluster this build
             plane runs ON, which is where the generated Applications render
             this chart from.
  __CLUSTER__ global.clusterName — the cluster these build Applications deploy to, named the
              way its project allows it
  __BOOKS__  global.booksCluster — the install branch of the cluster holding
             the MASTER role, which is where the registrations the generator
             globs over stand (clusters/active/<fqdn>.yaml, written by the branch program).

They are the same value whenever the build plane sits on the cluster holding
the master role, and they are not when it sits on a pure slave — an arrangement
an installation is free to choose, and a branch run then deploys this chart
where the build plane sits.

Build-cluster only: this app is deployed via the platform catalog, and
clusters/inventories/consumer-build/app.yaml says runsOn: master, so the app generator creates
it on the build plane and nowhere else.
*/ -}}
{{- if not .Values.unit }}
{{- .Files.Get "files/applicationset.yaml" | replace "__CLUSTER__" (required "consumer-build: global.clusterName is required (clusters/active/<fqdn>.yaml) — the build Applications name the cluster they deploy to, and their project allows that name" .Values.global.clusterName) | replace "__STAGE__" .Values.global.env | replace "__BRANCH__" .Values.global.domain | replace "__BOOKS__" (required "consumer-build: global.booksCluster is required (clusters/active/<fqdn>.yaml, rendered per install branch from the cluster map — the install branch of the cluster holding the master role, which carries this installation's registrations)" .Values.global.booksCluster) }}
{{- end }}
