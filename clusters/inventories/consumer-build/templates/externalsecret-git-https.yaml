{{- /*
The unit's git clone credential. ESO renders the unit's ONE PAT —
secret/build/<unit>/repo-pat (property `pat`), the entry the Manager writes
at onboarding over its own kubernetes-auth identity (the write grant is part of
the Vault policy seeded with the cluster) — into a GITCREDENTIALS-shaped Secret
the shared git-clone Task envFroms (its key BECOMES the env var GITCREDENTIALS;
the Task writes ~/.git-credentials from it). `x-access-token` is GitHub's
accepted username for a PAT over HTTPS.

The <unit>-release Pipeline pins this Secret name into its clone task, so the
clone of an external private repo authenticates with the UNIT's own PAT and no
other unit's. The stage-free path is what makes proof-of-life trivial: it
exists on the build plane's LOCAL Vault or nowhere.
*/ -}}
{{- if .Values.unit }}
{{- $unit := include "consumer-build.unitName" . -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: build-git-https
  namespace: {{ printf "%s-build" $unit }}
  labels:
    app.kubernetes.io/name: consumer-build
    app.kubernetes.io/component: build-git-https
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    image-builder.io/consumer: {{ $unit | quote }}
spec:
  # No periodic read of Vault — the platform-wide delivery rule, stated in full in
  # hostyour-cloud clusters/charts/external-secret/templates/externalsecret.yaml: a secret
  # arrives on DEPLOY (OnChange re-syncs when this CR changes) and on target-Secret
  # DELETION (OnChange creates it when absent), never on a timer. So putting a NEW
  # value in front of the pods is three acts: write it into Vault, delete the target
  # Secret so ESO fetches it, roll the pods (the restart-workloads run).
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: {{ .Values.global.secretStoreName }}
    kind: SecretStore
  target:
    name: build-git-https
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # git-clone envFroms this Secret; the KEY becomes the env var
        # GITCREDENTIALS (one credential-store record per line). The
        # `{{ "{{" }} .pat {{ "}}" }}` braces are ESO's OWN templating
        # (engineVersion v2, evaluated in-cluster by ESO, NOT Helm) — Helm
        # passes them through verbatim via the backtick raw-string idiom.
        GITCREDENTIALS: "https://x-access-token:{{ `{{ .pat }}` }}@github.com"
  data:
    - secretKey: pat
      remoteRef:
        # Emit every defaulted remoteRef field so ArgoCD sees no server-side
        # drift (clusters/charts/external-secret rule).
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
        # Stage-free build tier — the SecretStore supplies the `secret` mount
        # prefix.
        key: {{ printf "build/%s/repo-pat" $unit }}
        property: pat
{{- end }}
