{{- /*
The recovery export's own reader of the installation's storage box login, rendered for the three units that
write the recovery folder of the owner's master (consumer-build.writesRecoveryFolder) and nowhere else. It is
not the namespace's build-eso store: every build namespace logs in under that role, the units of external
parties among them, and the login opens every backup of the installation. This store logs in under the Vault
role build-recovery-export with its own account recovery-export-eso; the role admits that account in the
namespaces of these three units by name and reads secret/<env>/app/storage-box and nothing else (hostyour-deploy
ansiwise/programs/deploy-platform-services.yaml). The account carries no alias-metadata annotation, because
the role's policy is templated on nothing.

Server and auth mount come from the cluster globals (clusters/active/<fqdn>.yaml); the KV mount is the one
shared mount (global.vaultKvMount).
*/ -}}
{{- if eq (include "consumer-build.writesRecoveryFolder" .) "true" }}
{{- $unit := include "consumer-build.unitName" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: recovery-export-eso
  namespace: {{ printf "%s-build" $unit }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ printf "%s-recovery-export" .Values.global.secretStoreName }}
  namespace: {{ printf "%s-build" $unit }}
spec:
  provider:
    vault:
      server: {{ required "global.endpoints.vault.url must be set (clusters/active/<fqdn>.yaml via the $values chain)" .Values.global.endpoints.vault.url | quote }}
      path: {{ required "global.vaultKvMount must be set (clusters/platform/values-common.yaml via the $values chain)" .Values.global.vaultKvMount | quote }}
      version: "v2"
      namespace: "vault"
      auth:
        kubernetes:
          mountPath: {{ required "global.vaultKubernetesAuthPath must be set (clusters/active/<fqdn>.yaml via the $values chain)" .Values.global.vaultKubernetesAuthPath | quote }}
          role: build-recovery-export
          serviceAccountRef:
            # Local, dedicated account: the role binds this name alone, so no other account of the
            # namespace reads the login.
            name: recovery-export-eso
{{- end }}
