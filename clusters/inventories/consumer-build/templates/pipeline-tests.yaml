{{- if .Values.unit }}
{{- $test := include "consumer-build.testRegistration" . -}}
{{- if $test }}
{{- $record := $test | fromJson -}}
{{- $unit := include "consumer-build.unitName" . -}}
{{- $namespace := printf "%s-build" $unit -}}
{{- $params := list (dict "name" "repository-url" "value" $record.repositoryURL) (dict "name" "commit" "value" "$(params.commit)") (dict "name" "ref" "value" "$(params.ref)") (dict "name" "recipe-json" "value" $test) (dict "name" "recipe-digest" "value" $record.recipeDigest) (dict "name" "run-id" "value" "$(context.pipelineRun.uid)") (dict "name" "run-name" "value" "$(context.pipelineRun.name)") (dict "name" "run-namespace" "value" "$(context.pipelineRun.namespace)") -}}
{{- if and (eq (include "consumer-build.hasBuilds" .) "false") (eq $record.visibility "PUBLIC") }}
# The shared clone task requires a named carrier; public source needs no credential.
apiVersion: v1
kind: Secret
metadata:
  name: build-git-https
  namespace: {{ $namespace }}
stringData: {GITCREDENTIALS: ""}
---
{{- end }}
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: {{ $unit }}-tests
  namespace: {{ $namespace }}
spec:
  params:
    - {name: git-url, type: string}
    - {name: commit, type: string}
    - {name: ref, type: string}
  workspaces:
    - name: source
  tasks:
    - name: clone
      taskRef:
        resolver: cluster
        params:
          - {name: kind, value: task}
          - {name: namespace, value: {{ .Values.eventListener.namespace }}}
          - {name: name, value: git-clone}
      params:
        - {name: url, value: {{ $record.repositoryURL | quote }}}
        - {name: revision, value: "$(params.commit)"}
        - {name: depth, value: "1"}
        - {name: credentials-secret, value: build-git-https}
      workspaces:
        - {name: source, workspace: source, subPath: source}
    - name: scan
      runAfter: [clone]
      taskRef:
        resolver: cluster
        params:
          - {name: kind, value: task}
          - {name: namespace, value: {{ .Values.eventListener.namespace }}}
          - {name: name, value: credential-scan}
      workspaces:
        - {name: source, workspace: source, subPath: source}
{{- range $task := list "dependencies" "tests" "test-report" }}
    - name: {{ $task }}
      runAfter: [{{ if eq $task "dependencies" }}scan{{ else if eq $task "tests" }}dependencies{{ else }}tests{{ end }}]
      taskRef:
        resolver: cluster
        params:
          - {name: kind, value: task}
          - {name: namespace, value: {{ $.Values.eventListener.namespace }}}
          - {name: name, value: {{ if eq $task "dependencies" }}test-dependencies{{ else if eq $task "tests" }}test-suites{{ else }}test-report{{ end }}}
      params:
{{ $params | toYaml | indent 8 }}
{{- if eq $task "dependencies" }}
        - name: package-manager-version
          value: {{ trimPrefix "pnpm@" $record.recipe.packageManager | quote }}
        - {name: registry-scope, value: digitaplatform}
{{- end }}
{{- if ne $task "test-report" }}
      workspaces:
        - {name: source, workspace: source, subPath: source}
        - {name: deps, workspace: source, subPath: deps}
{{- end }}
{{- end }}
  finally:
    - name: report-final
      taskRef:
        resolver: cluster
        params:
          - {name: kind, value: task}
          - {name: namespace, value: {{ .Values.eventListener.namespace }}}
          - {name: name, value: test-report}
      params:
{{ $params | toYaml | indent 8 }}
        - {name: require-success, value: "false"}
{{- $root := . -}}
{{- range $proof := concat (list .Values.digitaTests.proof) (.Values.digitaTests.proofs | default list) }}
{{- if and (eq $root.Values.global.env "prod") (eq $unit $proof.repository) }}
---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: {{ $proof.name }}
  namespace: {{ $namespace }}
  labels:
    hostyour.cloud/test-managed: "true"
spec:
  pipelineRef: {name: {{ $unit }}-tests}
  taskRunTemplate: {serviceAccountName: pipeline-sa}
  params:
    - {name: git-url, value: {{ $record.repositoryURL | quote }}}
    - {name: commit, value: {{ $proof.commit | quote }}}
    - {name: ref, value: {{ $proof.ref | quote }}}
  timeouts: {pipeline: 40m, tasks: 30m, finally: 10m}
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests: {storage: 10Gi}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
