{{- /*
The unit's ci pipeline `<unit>-ci` — ONE generic pipeline, rendered per unit
from this template beside `<unit>-release`. Every push of the default branch
or of a `ci/` branch runs the repository's own scripts/check.sh at the pushed
commit, so red is seen on the build plane and not only on the machine of
whoever pushed. The whole run is ONE task, `ci`, in ONE pod, whose steps run
one after the other:

  gate → earlier-green → commit-status-pending → clone@commit → describe →
  branches → list-sources → list-tools → sources → hand-over → check,

and two finally tasks: report-failure mails the error lines of the step that
failed, and commit-status sets the commit status tekton/ci to the outcome.

It renders for every unit, also for one that builds nothing (builds: [] in its
registration), which then has this Pipeline and no release Pipeline.

It is not a release and shares nothing with one but the namespace, the
ServiceAccount and the clone credential. The run is created by the
github-ci-push Trigger (clusters/inventories/image-builder), waiting, and the
ci run keeper starts it while fewer ci runs than ciRunKeeper.maxRunning run;
the release queue never sees it, because neither this Pipeline nor its run
carries image-builder.io/consumer. Tekton copies a Pipeline's labels onto its
runs, so the label of this Pipeline is image-builder.io/ci and nothing else
may be added to it that a release selector reads.

THE ONE POD. The steps share the checkout without a hand-over through a claim: it lives on the emptyDir `scratch` of the task
(ciScratch.size, a size limit that ends a pod that fills it), in the folders repository and sources, mounted at
/workspace/source and /workspace/sources by subPath; the run carries no workspace of its own, and the admission policy
refuses one on a ci run. A pod holds at most its largest step at once, because the
steps run one after the other, so the memory and cpu budget of ciCapacity counts the check step for the pod. The quota
ci-pods counts two pods per run: the one of the task and the one of commit-status, which runs after it.

The trust split:

  PINNED LITERALS: repoURL, the images, the pnpm version, the helm, yq and jq versions of
  files/ci-fixed-tools.sh, and the table of files/ci-tools.table (see THE TOOLS OF A REPOSITORY).

  RUN INPUTS (from the push webhook, proven in-pipeline): git-url is the
  webhook's own claim of the repo and is compared fail-closed against the
  pinned repoURL by the gate before any credential is in reach; commit and before must
  each be a full lowercase SHA-1 before they reach a shell; branch is only
  displayed.

THE CHECK RUNS THE REPOSITORY'S OWN CODE and holds nothing worth stealing:
no ServiceAccount token (pipeline-sa mounts none), no clone credential, and never the GitOps write tokens of
the release bump, which this Pipeline does not reference at all. What keeps the credential away is the
mounts of the steps and not the pods: build-git-https is mounted by earlier-green, commit-status-pending, clone,
branches and sources only, the check step mounts none, and it is the LAST step, so it runs after every step that
holds one. Two secrets are in reach of the check. build-npmrc, the registry's pull identity, is mounted read-only
as the user npmrc because `pnpm install` cannot read the npm packages this build plane publishes without it.
build-issues-read is GITHUB_TOKEN, a token that reads the issues of the unit's
own repository and nothing else, because a check reads the labels of the issues
a change names. The pod runs under the namespace's build-egress policy, like every pod here:
public 443/80 outward, nothing inward.

SOURCES OF OTHER REPOSITORIES. A check may read pinned commits of sibling
repositories (a handbook that cites their code). Those are private, and the
check holds no credential, so the step sources fetches them first. The
repository lists them in ci-sources.json at its root, {"git": {"<repository>":
"<40-hex commit>"}}, and nothing else of that file is read. Each comes from
the unit's own owner on GitHub, never from another owner or host. Each lands
as a bare repository <repository>.git in the run's volume beside the clone,
which the check mounts read-only and finds through CI_SOURCES_DIR. The run's
one volume holds the clone in its subPath repository and the sources in its
subPath sources, so the sources are never part of the checked tree. The file
is the branch's own, and the fetch reads with the unit's token: for a unit of
the platform's GitHub App, the Manager mints it to read the unit's own
repository and the sources the ci-sources.json of its DEFAULT branch names,
and nothing else, so a source a branch adds is fetched once the default branch
names it; for a PAT unit, whatever the owner's PAT reads.

WHAT THE CHECK NEEDS, read from the check.sh of every unit: Node 24, pnpm,
git and bash; a mongod, which mongodb-memory-server downloads on first use; a
Chrome for the tests of a unit that prints PDFs; and helm, yq and jq for the
units whose check renders charts or reads JSON. One public image carries all but
the last three, so their releases are pinned by their sha256 in files/ci-fixed-tools.sh
and installed by the check step, and by build-binaries of the publish pipeline, whose
release/build.sh runs the same suites. No image is built by us. A repository without pnpm-lock.yaml
has nothing for pnpm to install: some carry no package.json, one keeps an npm
lockfile its check never reads.

THE TOOLS OF A REPOSITORY. A repository that needs other versions than the
image's names them in ci-tools.json at its root, {"<tool>": "<x.y.z>"}, with a
tool of node, npm, go, dart, gitleaks, promtool, kubectl, emcc, traefik and loki. The list-tools
step validates the file with jq and hands "<tool> <version>" lines to the check
as a result of the task; the check step installs each from files/ci-tools.table, which holds
a sha256 and an https url per tool and version, unpacks it only after the sha256
matched and puts it before the image's own tools on PATH. A version the table
lacks fails the run; the table is the only place a version is allowed from, so a
repository cannot make the check download whatever it names. A repository that
names npm is installed with `npm ci`, one with pnpm-lock.yaml with pnpm, and one
with ci-tools.json runs its scripts/test.sh after scripts/check.sh. A repository
without ci-tools.json runs as it always did, with the tools of the image.

THE CACHE. The claim `ci-cache` of the unit (templates/ci-cache.yaml, ciCache.size) is mounted by the check step only, at
/ci-cache: the tool archives of files/ci-install-tools.sh under their sha256 (a kept archive is used only while its
sha256 still matches the table), the Go module and build caches, the pnpm content store, the package caches of dart and npm
and the helm repository cache (one directory per tool version), and the corepack home. When the check step ends, whatever the
outcome, files/ci-cache-trim.sh evicts the entries with the oldest last access until the cache is within ciCache.size and
prints what it holds and evicted. An entry is a file, or a directory that a tool takes as complete once it exists (an extracted
Go module, an unpacked package manager, a pub package folder): that one goes whole or stays.
What the cache can poison is bounded by what the tools verify themselves (go.sum, the integrity of pnpm-lock.yaml, the
sha256 of the table), and no unit reads the cache of another.

THE FAILURE MAIL. When the task fails, report-failure reads the last 60 lines of
the step that failed from the Kubernetes API, as pods/log of the pod that the
task's TaskRun names, and posts ONE alert, CIRunFailed, to Alertmanager. The
route for that alert mails it (clusters/inventories/observability), so the mail
carries the error and needs no click to be read. The grant is a Role that reads
nothing but the run, its TaskRuns and pod logs (templates/rbac-ci-report.yaml),
and report-failure is the only task of this Pipeline that mounts a
ServiceAccount token. Its
pod is also the only one in the namespace that may reach the API server and
Alertmanager (templates/networkpolicy.yaml): Alertmanager takes any alert from
anybody, so a pod that runs the repository's code must not reach it.

The subject and the author of the commit come from the step describe, which runs
before any code of the repository does, and travel as results of the task.
report-failure does not run git itself, because a pod that holds a token must
not read the .git/config of a workspace that the check has had in its hands.

report-failure runs after a task timeout because the ci TriggerTemplate bounds
the task and the finally task separately (clusters/inventories/image-builder,
templates/triggers/github-ci-push.yaml). A newer push, or the deletion of the branch, ends a started run by
cancelling it gracefully (CancelledRunFinally): its finally tasks still run,
report-failure finds no failure to mail, and commit-status sets error.

THE COMMIT STATUS. commit-status-pending, a step, sets tekton/ci to pending once the
gate has proven the commit, and commit-status, the finally task, sets success, failure or error,
each linked to the run in the Tekton Dashboard. Both run files/ci-commit-status.sh
with the key token of build-git-https, the unit's
statuses token, which posts commit statuses on its own repository and writes
nothing else, and the finally one in a pod of its own that runs no code of the repository.
commit-status names only $(tasks.ci.status), $(tasks.ci.reason) and params, never a result: a finally task that
names a result the task did not leave is skipped, and a run that timed out before it would stay pending for ever. A run for
a repository the registration does not name is left out by the `when` of commit-status, and the script posts nothing for a commit that
is no full lowercase SHA-1, so a run the gate refused sets no status. A 5xx or no answer
of GitHub is tried 3 times; a pending that still fails lets the run go on to
the check with a warning, so one blip of GitHub skips no ci run.

A COMMIT THAT IS GREEN ALREADY. The step earlier-green reads the combined status of the commit
(files/ci-green-status.sh). A tekton/ci at success there writes the run that set it to the result `earlier-run` and the marker
/workspace/earlier-green (the implicit workspace of the pod, shared by its steps), and every step after it ends at once on the
marker: no pending status that would hide the green one, no clone, no check, and commit-status posts no success, so the status keeps
naming the run that did the check. A read that fails or finds anything else leaves the check to run.
*/ -}}
{{- if .Values.unit }}
{{- $unit := include "consumer-build.unitName" . -}}
{{- $checkMemory := get .Values.ciCheckMemory.units $unit | default .Values.ciCheckMemory.default -}}
{{- if not (regexMatch "^[0-9]+Gi$" (.Values.ciCache.size | toString)) }}{{ fail (printf "consumer-build: ciCache.size %q is not a whole number of Gi, so the check step cannot bound the cache" .Values.ciCache.size) }}{{ end -}}
{{- $cacheLimitKiB := mul (trimSuffix "Gi" .Values.ciCache.size | int) 1048576 -}}
{{- $repoURL := required "consumer-build: unit.repoURL is required (stamped by the fan-out ApplicationSet)" .Values.unit.repoURL -}}
{{- /* The image the shared git-clone Task runs (image-builder/templates/tasks/git-clone.yaml). */ -}}
{{- $gitImage := "alpine/git:2.45.2@sha256:16ad8e788e1d3b0c30f18da8dde5c0ace3b187445a62d8af893b003ca1e70592" -}}
{{- /* The image report-failure runs: bash, curl, jq and the shell tools its script uses. The release pipeline runs the same tag, unpinned, and the ci run keeper runs it for kubectl and jq. */ -}}
{{- $reportImage := "alpine/k8s:1.35.6@sha256:b7a12c5ddf261994c33d2eaaa06fd69a0803ff6b38683bfa3d30a76dcdf92807" -}}
{{- /* The unit's owner on GitHub, which every pinned source is fetched from. */ -}}
{{- $sourcesOwnerURL := regexReplaceAll "/[^/]+$" $repoURL "" -}}
{{- if not (regexMatch "^https://github[.]com/[A-Za-z0-9-]+$" $sourcesOwnerURL) }}{{ fail (printf "consumer-build: unit.repoURL %q is not https://github.com/<owner>/<repository>, so its owner cannot be named for ci-sources.json" $repoURL) }}{{ end -}}
{{- $alertmanager := required "consumer-build: ciFailureReport.alertmanager is required" .Values.ciFailureReport.alertmanager -}}
{{- /* The repository as GitHub's API names it, <owner>/<repository>, for the commit status. */ -}}
{{- $repositoryPath := trimSuffix ".git" (trimPrefix "https://github.com/" $repoURL) -}}
{{- if not (regexMatch "^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$" $repositoryPath) }}{{ fail (printf "consumer-build: unit.repoURL %q is not https://github.com/<owner>/<repository>, so its commits cannot carry a status" $repoURL) }}{{ end -}}
{{- $dashboardURL := printf "https://tekton.%s" (required "consumer-build: global.domain is required (clusters/active/<fqdn>.yaml, the fqdn of the cluster this build plane runs on — the failure mail and the commit status link to the Tekton Dashboard there)" .Values.global.domain) -}}
{{- $runURL := printf "%s/#/namespaces/%s-build/pipelineruns/$(context.pipelineRun.name)" $dashboardURL $unit -}}
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: {{ printf "%s-ci" $unit }}
  namespace: {{ printf "%s-build" $unit }}
  labels:
    app.kubernetes.io/name: consumer-build
    app.kubernetes.io/component: ci-pipeline
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    image-builder.io/ci: {{ $unit | quote }}
spec:
  description: >-
    Runs the repository's scripts/check.sh at one pushed commit. When a task
    fails, the finally task report-failure mails the last 60 lines of the step
    that failed through Alertmanager.
  params:
    - name: commit
      type: string
      description: The pushed commit, a full lowercase SHA-1.
    - name: before
      type: string
      description: The commit the branch stood at before the push, a full lowercase SHA-1; all zeros for a new branch.
    - name: branch
      type: string
      description: The pushed branch, without refs/heads/.
    - name: git-url
      type: string
      description: The webhook's claim of the repository, compared against the registered repoURL.

  tasks:
    # ── ci — the whole run in ONE pod ─────────────────────────────────────────
    # The steps run one after the other in one pod, in this order: gate, earlier-green, commit-status-pending, clone,
    # describe, branches, list-sources, list-tools, sources, hand-over, check. What keeps a credential away from the
    # repository's code is the mounts of the steps and not the pods: only gate-adjacent steps mount build-git-https
    # (earlier-green, commit-status-pending, clone, branches, sources), the check step mounts none, and it is the last
    # step, so it runs after every step that holds a credential. The checkout lives on the emptyDir `scratch` of this
    # task, in the folders repository and sources.
    - name: ci
      timeout: 44m0s
      params:
        - { name: commit, value: "$(params.commit)" }
        - { name: before, value: "$(params.before)" }
        - { name: branch, value: "$(params.branch)" }
        - { name: git-url, value: "$(params.git-url)" }
      taskSpec:
        params:
          - name: commit
            type: string
          - name: before
            type: string
          - name: branch
            type: string
          - name: git-url
            type: string
        results:
          - name: subject
            description: The first line of the commit message, cut at 200 characters.
          - name: author
            description: The name and the address of the commit's author.
          - name: tools
            description: The tools and versions of the branch's ci-tools.json, one "<tool> <version>" per line; empty without the file.
          - name: earlier-run
            description: The run that set a green tekton/ci on this commit before; empty when this run did the check.
        volumes:
          # The checkout and the pinned sources of this run. A size limit, so a check that fills it ends its own pod.
          - name: scratch
            emptyDir:
              sizeLimit: {{ required "consumer-build: ciScratch.size is required" .Values.ciScratch.size | quote }}
          - name: source-list
            emptyDir: {}
          # The unit's authenticated .npmrc, mounted as the buildah build step
          # mounts it (build-npmrc, optional: a unit without private packages
          # has no such Secret).
          - name: npmrc
            secret:
              secretName: build-npmrc
              optional: true
          # The cache of the unit's ci runs (templates/ci-cache.yaml); only the check step mounts it.
          - name: ci-cache
            persistentVolumeClaim:
              claimName: ci-cache
          # The runtime gives a pod a 64 MiB tmpfs at /dev/shm. The engine suite
          # of digita-platform keeps its MongoDB files there where it exists, and
          # mongod refuses to run with less than 500 MiB free. A volume mounted
          # over it is a directory of the node's disk, which has no size limit
          # of its own: df shows the disk and the pod's memory limit is not
          # charged for what the databases write.
          - name: shm
            emptyDir: {}
        steps:
          # ── gate — the repo claim and the commit, BEFORE any clone ───────────
          - name: gate
            image: {{ $gitImage }}
            env:
              - name: REPO_URL
                value: {{ $repoURL | quote }}
              # Run inputs travel as environment variables, never as text of
              # the script: a branch name may hold shell syntax.
              - name: GIT_URL
                value: "$(params.git-url)"
              - name: COMMIT
                value: "$(params.commit)"
              - name: BEFORE
                value: "$(params.before)"
              - name: BRANCH
                value: "$(params.branch)"
            script: |
              #!/usr/bin/env sh
              set -eu
              if [ "${GIT_URL}" != "${REPO_URL}" ]; then
                echo "gate: REJECT — webhook repo '${GIT_URL}' is not the registered repoURL '${REPO_URL}'" >&2
                exit 1
              fi
              is_sha1() {
                case "$1" in
                  *[!0-9a-f]*) return 1 ;;
                esac
                [ "${#1}" -eq 40 ]
              }
              if ! is_sha1 "${COMMIT}"; then
                echo "gate: REJECT — commit '${COMMIT}' is not a full lowercase SHA-1" >&2
                exit 1
              fi
              if ! is_sha1 "${BEFORE}"; then
                echo "gate: REJECT — before '${BEFORE}' is not a full lowercase SHA-1" >&2
                exit 1
              fi
              printf 'gate: ok — %s at %s (branch %s)\n' "${REPO_URL}" "${COMMIT}" "${BRANCH}"
            computeResources:
              requests: { cpu: 50m, memory: 64Mi }
              limits: { cpu: 200m, memory: 128Mi }
          # ── earlier-green — a commit that is green already is not checked again ──
          # Reads the combined status of the commit with the token of the pending status (the anonymous limit of GitHub
          # is shared by the address). A `tekton/ci` at success writes the run that set it to the result earlier-run and
          # the marker, and every step after this one then ends at once: no pending status that would hide the green
          # one, no clone, no check. A read that fails or finds anything else leaves the check to run.
          - name: earlier-green
            image: {{ $reportImage }}
            env:
{{ include "consumer-build.ciCommitStatusEnv" (dict "repositoryPath" $repositoryPath "runURL" $runURL) | indent 14 }}
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
{{ .Files.Get "files/ci-green-status.sh" | indent 14 }}
              if run="$(earlier_green_run)"; then
                printf '%s' "${run}" > "$(results.earlier-run.path)"
                touch {{ include "consumer-build.ciEarlierGreenMarker" . }}
                echo "earlier-green: tekton/ci is success on ${COMMIT} since the run ${run}, so this run clones and checks nothing"
              else
                echo "earlier-green: ${COMMIT} has no green tekton/ci, so the check runs"
              fi
            computeResources:
              requests: { cpu: 50m, memory: 64Mi }
              limits: { cpu: 200m, memory: 128Mi }
          # ── commit-status-pending — tekton/ci is pending on the commit ───────
          # After the gate proved the commit and before the clone. Its finally twin, commit-status, replaces the
          # pending with the outcome.
          - name: commit-status-pending
            image: {{ $reportImage }}
            env:
{{ include "consumer-build.ciCommitStatusEnv" (dict "repositoryPath" $repositoryPath "runURL" $runURL) | indent 14 }}
              - name: RUN_STATE
                value: running
            script: |
              #!/usr/bin/env bash
{{ include "consumer-build.ciEarlierGreenGuard" . | indent 14 }}
{{ .Files.Get "files/ci-commit-status.sh" | indent 14 }}
            computeResources:
              requests: { cpu: 50m, memory: 64Mi }
              limits: { cpu: 200m, memory: 128Mi }
          # ── clone — the pushed commit, from the PINNED repoURL ───────────────
          # Full history of the commit: a check may compare against its base. The unit's OWN clone credential, as the
          # release clones with; its store lives in /tmp of this container, never in the checkout.
          - name: clone
            image: {{ $gitImage }}
            timeout: 10m0s
            envFrom:
              - secretRef:
                  name: build-git-https
            env:
              - name: REPO_URL
                value: {{ $repoURL | quote }}
              - name: COMMIT
                value: "$(params.commit)"
            workingDir: /workspace/source
            volumeMounts:
{{ include "consumer-build.ciScratchMounts" (dict "repository" "rw") | indent 14 }}
            script: |
              #!/usr/bin/env sh
{{ include "consumer-build.ciEarlierGreenGuard" . | indent 14 }}
              set -eu
              printf '%s\n' "${GITCREDENTIALS}" > /tmp/git-credentials
              chmod 600 /tmp/git-credentials
              export HOME=/tmp
              git config --global credential.helper "store --file=/tmp/git-credentials"
              git init -q -b main
              git remote add origin "${REPO_URL}"
              git fetch -q origin "${COMMIT}"
              git checkout -q FETCH_HEAD
              printf 'clone: %s at %s\n' "${REPO_URL}" "$(git rev-parse HEAD)"
            computeResources:
              requests: { cpu: 100m, memory: 128Mi }
              limits: { cpu: 500m, memory: 512Mi }
          # ── describe — the subject and the author, for the failure mail ──────
          # It runs before the check, so the git of this step reads a clone that no code of the repository has
          # touched. The results are read from the TaskRun by report-failure, which runs no git.
          - name: describe
            image: {{ $gitImage }}
            workingDir: /workspace/source
            env:
              - name: COMMIT
                value: "$(params.commit)"
            volumeMounts:
{{ include "consumer-build.ciScratchMounts" (dict "repository" "ro") | indent 14 }}
            script: |
              #!/usr/bin/env sh
{{ include "consumer-build.ciEarlierGreenGuard" . | indent 14 }}
              set -eu
              git log -1 --format=%s "${COMMIT}" | cut -c1-200 | tr -d '\n' > "$(results.subject.path)"
              git log -1 --format='%an <%ae>' "${COMMIT}" | cut -c1-200 | tr -d '\n' > "$(results.author.path)"
            computeResources:
              requests: { cpu: 50m, memory: 64Mi }
              limits: { cpu: 200m, memory: 128Mi }
          # ── fetch — what the check compares against and what it reads ────────
          # The clone fetches the one commit and nothing else, so no origin/<branch>
          # exists, and the git of this pod and of the check step never names the
          # default branch of such a clone: origin/HEAD is set here, from the remote.
          # A check that diffs against its default branch (a freeze guard that reads
          # origin/master, a release probe that reads origin/HEAD) would refuse every
          # run. A check may also read the pinned commits of sibling repositories
          # (SOURCES OF OTHER REPOSITORIES above). Both fetches need the clone
          # credential, which the check step must never hold, so they run in steps of their own.
          # Each credential store lives in /tmp of its own container, never in the
          # checkout, and the step that reads ci-sources.json holds no credential.
          - name: branches
            image: {{ $gitImage }}
            envFrom:
              - secretRef:
                  name: build-git-https
            workingDir: /workspace/source
            volumeMounts:
{{ include "consumer-build.ciScratchMounts" (dict "repository" "rw") | indent 14 }}
            script: |
              #!/usr/bin/env sh
{{ include "consumer-build.ciEarlierGreenGuard" . | indent 14 }}
              set -eu
              printf '%s\n' "${GITCREDENTIALS}" > /tmp/git-credentials
              chmod 600 /tmp/git-credentials
              export HOME=/tmp
              git config --global credential.helper "store --file=/tmp/git-credentials"
              git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
              git remote set-head origin --auto
              echo "fetch: ok — the branch heads of origin are at refs/remotes/origin"
            # The fetch takes every branch head: 95 MiB of anonymous memory
            # for 183 branches, the most of the repositories measured.
            computeResources:
              requests: { cpu: 50m, memory: 128Mi }
              limits: { cpu: 500m, memory: 256Mi }
          # Reads the branch's ci-sources.json into "<repository> <commit>"
          # lines, refusing any name that is not a plain repository name and
          # any commit that is not a full SHA-1, so the step that holds the
          # credential reads nothing but those lines.
          - name: list-sources
            image: {{ $reportImage }}
            workingDir: /workspace/source
            env:
              - name: SOURCE_LIST
                value: /source-list/list
            script: |
              #!/usr/bin/env bash
{{ include "consumer-build.ciEarlierGreenGuard" . | indent 14 }}
              set -euo pipefail
              if [ ! -f ci-sources.json ]; then
                : > "${SOURCE_LIST}"
                echo "fetch: no ci-sources.json, so no sources to fetch"
                exit 0
              fi
              jq -r '(.git // {}) | to_entries[]
                | if (.key | test("^[A-Za-z0-9._-]+$")) and (.key | test("^[.]+$") | not)
                     and (.value | type == "string" and test("^[0-9a-f]{40}$"))
                  then "\(.key) \(.value)"
                  else error("ci-sources.json: \(.key | tojson) must name a repository and a full commit, not \(.value | tojson)") end' \
                ci-sources.json > "${SOURCE_LIST}"
              echo "fetch: $(wc -l < "${SOURCE_LIST}") sources pinned in ci-sources.json"
            computeResources:
              requests: { cpu: 50m, memory: 32Mi }
              limits: { cpu: 200m, memory: 64Mi }
            volumeMounts:
{{ include "consumer-build.ciScratchMounts" (dict "repository" "ro") | indent 14 }}
              - name: source-list
                mountPath: /source-list
          # Reads the branch's ci-tools.json into "<tool> <version>" lines, the result the
          # check installs from. A tool outside the contract or a version that is not
          # x.y.z ends the run here, in a step that holds no credential.
          - name: list-tools
            image: {{ $reportImage }}
            workingDir: /workspace/source
            env:
              - name: TOOLS_RESULT
                value: $(results.tools.path)
            script: |
              #!/usr/bin/env bash
{{ include "consumer-build.ciEarlierGreenGuard" . | indent 14 }}
              set -euo pipefail
              if [ ! -f ci-tools.json ]; then
                : > "${TOOLS_RESULT}"
                echo "fetch: no ci-tools.json, so the check runs with the tools of its image"
                exit 0
              fi
              jq -rs 'if length != 1 or (.[0] | type) != "object" then error("ci-tools.json: must hold one object of tool and version")
                else .[0] | to_entries[]
                  | if (.key | IN("node", "npm", "go", "dart", "gitleaks", "promtool", "kubectl", "emcc", "traefik", "loki")) and (.value | type == "string" and test("^[0-9]+[.][0-9]+[.][0-9]+$"))
                    then "\(.key) \(.value)"
                    else error("ci-tools.json: \(.key | tojson) must be one of node, npm, go, dart, gitleaks, promtool, kubectl, emcc, traefik, loki at a version x.y.z, not \(.value | tojson)") end
                end' ci-tools.json > "${TOOLS_RESULT}"
              echo "fetch: $(wc -l < "${TOOLS_RESULT}") tools named in ci-tools.json"
            computeResources:
              requests: { cpu: 50m, memory: 32Mi }
              limits: { cpu: 200m, memory: 64Mi }
            volumeMounts:
{{ include "consumer-build.ciScratchMounts" (dict "repository" "ro") | indent 14 }}
          - name: sources
            image: {{ $gitImage }}
            envFrom:
              - secretRef:
                  name: build-git-https
            env:
              - name: SOURCES_OWNER_URL
                value: {{ $sourcesOwnerURL | quote }}
            script: |
              #!/usr/bin/env sh
{{ include "consumer-build.ciEarlierGreenGuard" . | indent 14 }}
              set -eu
              if [ ! -s /source-list/list ]; then exit 0; fi
              printf '%s\n' "${GITCREDENTIALS}" > /tmp/git-credentials
              chmod 600 /tmp/git-credentials
              export HOME=/tmp
              git config --global credential.helper "store --file=/tmp/git-credentials"
              while read -r repository commit; do
                into="/workspace/sources/${repository}.git"
                git init -q --bare "${into}"
                if ! git --git-dir "${into}" fetch -q --depth=1 "${SOURCES_OWNER_URL}/${repository}.git" "${commit}"; then
                  echo "fetch: ${repository} at ${commit} could not be fetched from ${SOURCES_OWNER_URL} — the unit's token reads the sources its ci-sources.json names on the default branch, so a source only this branch names is fetched once the default branch names it and the Manager has rewritten the token (every 45 minutes)" >&2
                  exit 1
                fi
                echo "fetch: ${repository} at ${commit}"
              done < /source-list/list
            computeResources:
              requests: { cpu: 50m, memory: 128Mi }
              limits: { cpu: 500m, memory: 256Mi }
            volumeMounts:
{{ include "consumer-build.ciScratchMounts" (dict "sources" "rw") | indent 14 }}
              - name: source-list
                mountPath: /source-list
          # The steps above run as root and leave the clone to root; the check runs as a user
          # without root and has to write into it (node_modules, build output, the test databases).
{{ include "consumer-build.handOverStep" (dict "image" $gitImage "folders" "/workspace/source" "guard" (include "consumer-build.ciEarlierGreenGuard" .) "mounts" (include "consumer-build.ciScratchMounts" (dict "repository" "rw"))) | indent 10 }}
          # ── check — the repository's own scripts/check.sh ───────────────────
          # The last step: it runs after every step that holds a credential, and it mounts none.
          - name: check
            image: {{ include "consumer-build.nodeImage" $ }}
            timeout: 20m0s
            workingDir: /workspace/source
            # Not root (consumer-build.checkUser); the hand-over step hands the clone
            # to this user.
            securityContext:
{{ include "consumer-build.checkUserContext" . | indent 14 }}
            env:
              # What GitHub Actions also sets: a check that cannot run on a
              # build plane (a missing sibling checkout) reads it to say so.
              - name: CI
                value: "true"
{{- if $checkMemory.maxWorkers }}
              - name: VITEST_MAX_WORKERS
                value: {{ $checkMemory.maxWorkers | quote }}
{{- end }}
              # The bare repositories the sources step filled from ci-sources.json.
              - name: CI_SOURCES_DIR
                value: /workspace/sources
              # The commit the branch stood at before this push, proven a SHA-1
              # by the gate, all zeros for a new branch. A check that compares
              # the push against its base reads it: on a master push the merge
              # base with origin/master is the pushed commit itself.
              - name: CI_BEFORE_COMMIT
                value: "$(params.before)"
              # The tools of the repository's ci-tools.json, validated by the list-tools step, and
              # the table they are installed from. Variables and not text of the script.
              - name: CI_TOOLS_FILE
                value: $(results.tools.path)
              - name: CI_TOOLS_TABLE
                value: |
{{ .Files.Get "files/ci-tools.table" | indent 18 }}
              # The cache of the unit's ci runs: one directory per tool and version, kept under the bound by files/ci-cache-trim.sh.
              - name: CI_CACHE_DIR
                value: /ci-cache
              - name: CI_CACHE_LIMIT_KIB
                value: {{ $cacheLimitKiB | quote }}
              # Reads the issues of the unit's own repository and nothing else
              # (templates/externalsecret-issues-read.yaml). Optional: until
              # the Manager has written the property, there is no Secret and
              # the check runs without the variable.
              - name: GITHUB_TOKEN
                valueFrom:
                  secretKeyRef: { name: build-issues-read, key: token, optional: true }
              - name: NPM_CONFIG_USERCONFIG
                value: /npmrc/.npmrc
              - name: COREPACK_ENABLE_DOWNLOAD_PROMPT
                value: "0"
            volumeMounts:
{{ include "consumer-build.ciScratchMounts" (dict "repository" "rw" "sources" "ro") | indent 14 }}
              - name: npmrc
                mountPath: /npmrc
                readOnly: true
              - name: ci-cache
                mountPath: /ci-cache
              - name: shm
                mountPath: /dev/shm
            # The memory request and limit come from ciCheckMemory in values-common.yaml.
            # The steps of this pod run one after the other, so the pod holds at most the
            # largest of its steps at once. The limits of the largest seven distinct ci units
            # count against ciCapacity.limitsMemoryBudget alongside nine releases.
            # The CPU limit is 12 of the cores of the build node, and the request
            # is the largest whole number of cores for which the requests of all
            # ci pods, of the releases the queue runs at once and of the pods that
            # stand on the node still fit its cores (ciCapacity in
            # values-common.yaml, held by scripts/build-contract.test.mjs).
            computeResources:
              requests: { cpu: "2", memory: {{ required "consumer-build: ciCheckMemory.requests is required" $checkMemory.requests | quote }} }
              limits: { cpu: "12", memory: {{ required "consumer-build: ciCheckMemory.limits is required" $checkMemory.limits | quote }} }
            script: |
              #!/usr/bin/env bash
{{ include "consumer-build.ciEarlierGreenGuard" . | indent 14 }}
              set -euo pipefail

              # 1 GiB free in the workspace, in /tmp and in /dev/shm, measured
              # before anything is installed and left in the log: a repository's
              # test database refuses to run on less, and its failures then name
              # the database and not the disk.
              for dir in /workspace/source /tmp /dev/shm; do
                usage="$(df -Pk "$dir")"
                echo "$usage"
                free_kib="$(echo "$usage" | awk 'NR==2 { print $4 }')"
                if [ "$free_kib" -lt 1048576 ]; then
                  echo "check: $dir has $free_kib KiB free, the check needs 1048576 KiB" >&2
                  exit 1
                fi
              done

{{ .Files.Get "files/ci-cache-trim.sh" | indent 14 }}
              trap 'ci_cache_trim || echo "ci-cache: the cache could not be trimmed" >&2' EXIT
              CI_TOOLS="$(cat "${CI_TOOLS_FILE}")"
              export COREPACK_HOME="${CI_CACHE_DIR}/corepack"

{{ .Files.Get "files/ci-fixed-tools.sh" | indent 14 }}

              # The helm repository cache holds the chart tarballs of `helm dependency`, one directory per helm version.
              export HELM_CACHE_HOME="${CI_CACHE_DIR}/helm/$(helm version --template '{{ "{{" }}.Version{{ "}}" }}')"

              # The shims of corepack go to the directory of the fixed tools,
              # whose user owns it, and not beside node.
              # pnpm 11.7.0 is what the units' Dockerfiles activate. A unit
              # whose package.json names packageManager overrides it.
              corepack enable --install-directory "${ci_bin}"
              corepack prepare pnpm@11.7.0 --activate

              # The Chrome of the image, for the units whose tests print PDFs.
              # A unit that has no use for the variables ignores them.
              REPORT_CHROMIUM_PATH="$(ls /home/pptruser/.cache/puppeteer/chrome/linux-*/chrome-linux64/chrome | head -n 1)"
              export REPORT_CHROMIUM_PATH
              # A container gives Chrome no user namespace for its sandbox, and
              # /dev/shm holds the databases of the engine suite, so Chrome
              # keeps its shared memory in /tmp.
              export REPORT_CHROMIUM_ARGS=--no-sandbox,--disable-dev-shm-usage

{{ .Files.Get "files/ci-install-tools.sh" | indent 14 }}

              # One directory per tool and version for what the tools keep between runs: the Go module and build caches
              # of the go that stands first on PATH, the pnpm content store of the pnpm that the repository activates.
              # files/ci-cache-trim.sh names the directories of this layout that it evicts whole.
              if [ -n "$(command -v go)" ]; then
                go_cache="${CI_CACHE_DIR}/go/$(go env GOVERSION)"
                mkdir -p "${go_cache}"
                export GOMODCACHE="${go_cache}/mod" GOCACHE="${go_cache}/build"
              fi
              export pnpm_config_store_dir="${CI_CACHE_DIR}/pnpm/$(pnpm --version)"
              # The package caches of dart (`dart pub get`) and npm (`npm ci`), one directory per version of the tool that fills it.
              if [ -n "$(command -v dart)" ]; then
                dart_version="$(dart --version 2>&1 | sed -n 's/^Dart SDK version: \([^ ]*\) .*/\1/p')"
                if [ -z "${dart_version}" ]; then
                  echo "check: the version of dart cannot be read from: $(dart --version 2>&1)" >&2
                  exit 1
                fi
                export PUB_CACHE="${CI_CACHE_DIR}/pub/${dart_version}"
              fi
              if [ -n "$(command -v npm)" ]; then export npm_config_cache="${CI_CACHE_DIR}/npm/$(npm --version)"; fi
              if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; fi
              if grep -q '^npm ' <<< "${CI_TOOLS}"; then npm ci; fi
              bash scripts/check.sh
              if [ -f ci-tools.json ] && [ -f scripts/test.sh ]; then bash scripts/test.sh; fi

  finally:
    # ── report-failure — one mail for a failed run, with the error in it ──────
    # Runs when a task failed or timed out (a cancelled run runs no finally
    # task). It needs no workspace: everything it mails it reads from the API.
    # The projected token is the only credential, and this is the only task of
    # the Pipeline that mounts one.
    - name: report-failure
      timeout: 5m0s
      when:
        - input: "$(tasks.status)"
          operator: in
          values: ["Failed"]
      params:
        - { name: pipeline-run, value: "$(context.pipelineRun.name)" }
        - { name: branch, value: "$(params.branch)" }
        - { name: commit, value: "$(params.commit)" }
      taskSpec:
        params:
          - name: pipeline-run
            type: string
          - name: branch
            type: string
          - name: commit
            type: string
        volumes:
          # The shape of the release bump's API credential: the token, the
          # cluster CA and the namespace in one directory, which is where an
          # in-cluster client looks. 600 seconds is the shortest life the API
          # server accepts, and the task is bounded at 5 minutes.
          - name: api-token
            projected:
              sources:
                - serviceAccountToken:
                    path: token
                    expirationSeconds: 600
                - configMap:
                    name: kube-root-ca.crt
                    items:
                      - { key: ca.crt, path: ca.crt }
                - downwardAPI:
                    items:
                      - path: namespace
                        fieldRef:
                          fieldPath: metadata.namespace
        steps:
          - name: report
            image: {{ $reportImage }}
            env:
              - name: SERVICE_ACCOUNT_DIR
                value: /var/run/secrets/kubernetes.io/serviceaccount
              - name: PIPELINE_RUN
                value: "$(params.pipeline-run)"
              - name: REPOSITORY
                value: {{ $unit | quote }}
              - name: BRANCH
                value: "$(params.branch)"
              - name: COMMIT
                value: "$(params.commit)"
              - name: DASHBOARD_URL
                value: {{ $dashboardURL | quote }}
              - name: GRAFANA_URL
                value: {{ printf "https://grafana.%s" (required "consumer-build: global.booksCluster is required (clusters/active/<fqdn>.yaml, the install branch of the cluster holding the master role — the failure mail links to the Grafana there)" .Values.global.booksCluster) | quote }}
              - name: ALERTMANAGER_URL
                value: {{ printf "http://%s.%s.svc:%v" $alertmanager.serviceName $alertmanager.namespace $alertmanager.port | quote }}
            volumeMounts:
              - { name: api-token, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true }
            script: |
{{ .Files.Get "files/ci-report-failure.sh" | indent 14 }}
            computeResources:
              requests: { cpu: 50m, memory: 64Mi }
              limits: { cpu: 500m, memory: 256Mi }

    # ── commit-status — tekton/ci gets the outcome of the run ─────────────────
    # Runs after every run, also after a timeout or a cancel, when the pod of the task ci is gone. It names only
    # $(tasks.ci.status), $(tasks.ci.reason) and params: Tekton skips a finally task whose result reference is
    # missing, which would leave a run that timed out before its result pending for ever. A run the gate refused
    # names a commit it did not prove: the repository claim of the webhook is compared here with the registered
    # repoURL (the `in` operator on a literal, because CEL is off in the when expressions of this cluster), and the
    # script posts nothing for a commit that is not a full lowercase SHA-1. A run that found the commit green
    # already posts no success, the status keeps naming the run that did the check. A run the ci run keeper
    # replaces is cancelled gracefully, so this task runs for it too.
    - name: commit-status
      timeout: 2m0s
      when:
        - input: "$(params.git-url)"
          operator: in
          values: [{{ $repoURL | quote }}]
      params:
        - { name: commit, value: "$(params.commit)" }
        - { name: run-state, value: "$(tasks.status)" }
        - name: task-reasons
          value: "$(tasks.ci.reason)"
      taskSpec:
        params:
          - name: commit
            type: string
          - name: run-state
            type: string
          - name: task-reasons
            type: string
        steps:
          - name: commit-status
            image: {{ $reportImage }}
            env:
{{ include "consumer-build.ciCommitStatusEnv" (dict "repositoryPath" $repositoryPath "runURL" $runURL) | indent 14 }}
              - name: RUN_STATE
                value: "$(params.run-state)"
              - name: TASK_REASONS
                value: "$(params.task-reasons)"
            script: |
              #!/usr/bin/env bash
{{ .Files.Get "files/ci-green-status.sh" | indent 14 }}
{{ .Files.Get "files/ci-commit-status.sh" | indent 14 }}
            computeResources:
              requests: { cpu: 50m, memory: 64Mi }
              limits: { cpu: 200m, memory: 128Mi }
{{- end }}
