{{- /*
The unit's ci pipeline `<unit>-ci` — ONE generic pipeline, rendered per unit
from this template beside `<unit>-release`. Every push of a branch runs the
repository's own scripts/check.sh at the pushed commit, so red is seen on the
build plane and not only on the machine of whoever pushed:

  gate → commit-status-pending → clone@commit → describe-commit → fetch → check,

and two finally tasks: report-failure mails the error lines of every task that
failed, and commit-status sets the commit status tekton/ci to the outcome.

It renders for every unit, also for one that builds nothing (builds: [] in its
registration), which then has this Pipeline and no release Pipeline.

It is not a release and shares nothing with one but the namespace, the
ServiceAccount and the clone credential. The run is created by the
github-ci-push Trigger (clusters/inventories/image-builder), waiting, and the
ci run keeper starts it while fewer ci runs than ciRunKeeper.maxRunning run;
the release queue never sees it, because neither this Pipeline nor its run
carries image-builder.io/consumer. Tekton copies a Pipeline's labels onto its
runs, so the label of this Pipeline is image-builder.io/ci and nothing else
may be added to it that a release selector reads.

The trust split:

  PINNED LITERALS: repoURL, the images, the pnpm, helm and yq versions.

  RUN INPUTS (from the push webhook, proven in-pipeline): git-url is the
  webhook's own claim of the repo and is compared fail-closed against the
  pinned repoURL before any credential is in reach; commit and before must
  each be a full lowercase SHA-1 before they reach a shell; branch is only
  displayed.

THE CHECK RUNS THE REPOSITORY'S OWN CODE and holds nothing worth stealing:
no ServiceAccount token (pipeline-sa mounts none), no clone credential
(build-git-https belongs to the clone, fetch and commit-status
tasks, whose containers run before or after the check, never beside it), and never the GitOps write tokens of
the release bump, which this Pipeline does not reference at all. The one secret in
reach is build-npmrc, the packages reader, mounted read-only as the user npmrc
because `pnpm install` cannot read the private @<owner> packages without it.
The pod runs under the namespace's build-egress policy, like every pod here:
public 443/80 outward, nothing inward.

SOURCES OF OTHER REPOSITORIES. A check may read pinned commits of sibling
repositories (a handbook that cites their code). Those are private, and the
check holds no credential, so the fetch task fetches them first. The
repository lists them in ci-sources.json at its root, {"git": {"<repository>":
"<40-hex commit>"}}, and nothing else of that file is read. Each comes from
the unit's own owner on GitHub, never from another owner or host. Each lands
as a bare repository <repository>.git in the run's volume beside the clone,
which the check mounts read-only and finds through CI_SOURCES_DIR. The run's
one volume holds the clone in its subPath repository and the sources in its
subPath sources, so the sources are never part of the checked tree. The file
is the branch's own, so a branch can have any repository of that owner
fetched that the unit's PAT reads; whoever pushes a branch can read those
already.

WHAT THE CHECK NEEDS, read from the check.sh of every unit: Node 24, pnpm,
git and bash; a mongod, which mongodb-memory-server downloads on first use; a
Chrome for the tests of a unit that prints PDFs; and helm and yq for the units
whose check renders charts. One public image carries all but the last two, so
their releases are pinned here by their sha256 and installed by the check step.
No image is built by us. A repository without pnpm-lock.yaml has nothing for
pnpm to install: some carry no package.json, one keeps an npm lockfile its
check never reads.

THE FAILURE MAIL. When a task fails, report-failure reads the last 60 lines of
the step that failed from the Kubernetes API, as pods/log of the pod that the
task's TaskRun names, and posts ONE alert, CIRunFailed, to Alertmanager. The
route for that alert mails it (clusters/inventories/observability), so the mail
carries the error and needs no click to be read. The grant is a Role that reads
nothing but the run, its TaskRuns and pod logs (templates/rbac-ci-report.yaml),
and report-failure is the only task of this Pipeline that mounts a
ServiceAccount token. Its
pod is also the only one in the namespace that may reach the API server and
Alertmanager (templates/networkpolicy.yaml): Alertmanager takes any alert from
anybody, so a pod that runs the repository's code must not reach it.

The subject and the author of the commit come from describe-commit, which runs
before any code of the repository does. report-failure does not run git itself,
because a pod that holds a token must not read the .git/config of a workspace
that the check has had in its hands.

report-failure runs after a task timeout because the ci TriggerTemplate bounds
the tasks and the finally task separately (clusters/inventories/image-builder,
templates/triggers/github-ci-push.yaml). A newer push replaces a started run by
cancelling it gracefully (CancelledRunFinally): its finally tasks still run,
report-failure finds no failure to mail, and commit-status sets error.

THE COMMIT STATUS. commit-status-pending sets tekton/ci to pending once the
gate has proven the commit, and commit-status sets success, failure or error,
each linked to the run in the Tekton Dashboard. Both run files/ci-commit-status.sh
in a pod of their own that holds the key token of build-git-https, the unit's
repository token, and runs no code of the repository. A run the gate refused
sets no status, because it names a commit it did not prove.
*/ -}}
{{- if .Values.unit }}
{{- $unit := include "consumer-build.unitName" . -}}
{{- $repoURL := required "consumer-build: unit.repoURL is required (stamped by the fan-out ApplicationSet)" .Values.unit.repoURL -}}
{{- /* The image the shared git-clone Task runs (image-builder/templates/tasks/git-clone.yaml). */ -}}
{{- $gitImage := "alpine/git:2.45.2@sha256:16ad8e788e1d3b0c30f18da8dde5c0ace3b187445a62d8af893b003ca1e70592" -}}
{{- /* The image report-failure runs: bash, curl, jq and the shell tools its script uses. The release pipeline runs the same tag, unpinned, and the ci run keeper runs it for kubectl and jq. */ -}}
{{- $reportImage := "alpine/k8s:1.35.6@sha256:b7a12c5ddf261994c33d2eaaa06fd69a0803ff6b38683bfa3d30a76dcdf92807" -}}
{{- /* The unit's owner on GitHub, which every pinned source is fetched from. */ -}}
{{- $sourcesOwnerURL := regexReplaceAll "/[^/]+$" $repoURL "" -}}
{{- if not (regexMatch "^https://github[.]com/[A-Za-z0-9-]+$" $sourcesOwnerURL) }}{{ fail (printf "consumer-build: unit.repoURL %q is not https://github.com/<owner>/<repository>, so its owner cannot be named for ci-sources.json" $repoURL) }}{{ end -}}
{{- $alertmanager := required "consumer-build: ciFailureReport.alertmanager is required" .Values.ciFailureReport.alertmanager -}}
{{- /* The repository as GitHub's API names it, <owner>/<repository>, for the commit status. */ -}}
{{- $repositoryPath := trimSuffix ".git" (trimPrefix "https://github.com/" $repoURL) -}}
{{- if not (regexMatch "^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$" $repositoryPath) }}{{ fail (printf "consumer-build: unit.repoURL %q is not https://github.com/<owner>/<repository>, so its commits cannot carry a status" $repoURL) }}{{ end -}}
{{- $dashboardURL := printf "https://tekton.%s" (required "consumer-build: global.domain is required (clusters/active/<fqdn>.yaml, the fqdn of the cluster this build plane runs on — the failure mail and the commit status link to the Tekton Dashboard there)" .Values.global.domain) -}}
{{- $runURL := printf "%s/#/namespaces/%s-build/pipelineruns/$(context.pipelineRun.name)" $dashboardURL $unit -}}
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: {{ printf "%s-ci" $unit }}
  namespace: {{ printf "%s-build" $unit }}
  labels:
    app.kubernetes.io/name: consumer-build
    app.kubernetes.io/component: ci-pipeline
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    image-builder.io/ci: {{ $unit | quote }}
spec:
  description: >-
    Runs the repository's scripts/check.sh at one pushed commit. When a task
    fails, the finally task report-failure mails the last 60 lines of the step
    that failed through Alertmanager.
  params:
    - name: commit
      type: string
      description: The pushed commit, a full lowercase SHA-1.
    - name: before
      type: string
      description: The commit the branch stood at before the push, a full lowercase SHA-1; all zeros for a new branch.
    - name: branch
      type: string
      description: The pushed branch, without refs/heads/.
    - name: git-url
      type: string
      description: The webhook's claim of the repository, compared against the registered repoURL.
  workspaces:
    - name: source
      description: The clone of the repository in subPath repository, and the sources it pins in subPath sources.
  tasks:
    # ── 1. gate — the repo claim and the commit, BEFORE any clone ────────────
    - name: gate
      timeout: 5m0s
      params:
        - { name: commit, value: "$(params.commit)" }
        - { name: before, value: "$(params.before)" }
        - { name: branch, value: "$(params.branch)" }
        - { name: git-url, value: "$(params.git-url)" }
      taskSpec:
        params:
          - name: commit
            type: string
          - name: before
            type: string
          - name: branch
            type: string
          - name: git-url
            type: string
        steps:
          - name: gate
            image: {{ $gitImage }}
            env:
              - name: REPO_URL
                value: {{ $repoURL | quote }}
              # Run inputs travel as environment variables, never as text of
              # the script: a branch name may hold shell syntax.
              - name: GIT_URL
                value: "$(params.git-url)"
              - name: COMMIT
                value: "$(params.commit)"
              - name: BEFORE
                value: "$(params.before)"
              - name: BRANCH
                value: "$(params.branch)"
            script: |
              #!/usr/bin/env sh
              set -eu
              if [ "${GIT_URL}" != "${REPO_URL}" ]; then
                echo "gate: REJECT — webhook repo '${GIT_URL}' is not the registered repoURL '${REPO_URL}'" >&2
                exit 1
              fi
              is_sha1() {
                case "$1" in
                  *[!0-9a-f]*) return 1 ;;
                esac
                [ "${#1}" -eq 40 ]
              }
              if ! is_sha1 "${COMMIT}"; then
                echo "gate: REJECT — commit '${COMMIT}' is not a full lowercase SHA-1" >&2
                exit 1
              fi
              if ! is_sha1 "${BEFORE}"; then
                echo "gate: REJECT — before '${BEFORE}' is not a full lowercase SHA-1" >&2
                exit 1
              fi
              printf 'gate: ok — %s at %s (branch %s)\n' "${REPO_URL}" "${COMMIT}" "${BRANCH}"
            computeResources:
              requests: { cpu: 50m, memory: 64Mi }
              limits: { cpu: 200m, memory: 128Mi }

    # ── commit-status-pending — tekton/ci is pending on the commit ──────────
    # After the gate proved the commit and before the clone: the tasks run one
    # after the other, because the ci quota counts one pod per run. Its finally
    # twin, commit-status, replaces the pending with the outcome.
    - name: commit-status-pending
      runAfter: [gate]
      timeout: 2m0s
      params:
        - { name: commit, value: "$(params.commit)" }
      taskSpec:
        params:
          - name: commit
            type: string
        steps:
          - name: commit-status
            image: {{ $reportImage }}
            env:
{{ include "consumer-build.ciCommitStatusEnv" (dict "repositoryPath" $repositoryPath "runURL" $runURL) | indent 14 }}
              - name: RUN_STATE
                value: running
            script: |
{{ .Files.Get "files/ci-commit-status.sh" | indent 14 }}
            computeResources:
              requests: { cpu: 50m, memory: 64Mi }
              limits: { cpu: 200m, memory: 128Mi }

    # ── 2. clone — the pushed commit, from the PINNED repoURL ────────────────
    - name: clone
      runAfter: [commit-status-pending]
      timeout: 10m0s
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: git-clone }
          - { name: namespace, value: image-builder }
      params:
        - { name: url, value: {{ $repoURL | quote }} }
        - { name: revision, value: "$(params.commit)" }
        # Full history of the commit: a check may compare against its base.
        - { name: depth, value: "0" }
        # The unit's OWN clone credential, as the release clones with.
        - { name: credentials-secret, value: build-git-https }
      workspaces:
        - { name: source, workspace: source, subPath: repository }

    # ── 3. describe-commit — the subject and the author, for the failure mail ─
    # It runs before the check, so the git of this pod reads a clone that no
    # code of the repository has touched. The results are read from the
    # TaskRun by report-failure, which runs no git.
    - name: describe-commit
      runAfter: [clone]
      timeout: 2m0s
      params:
        - { name: commit, value: "$(params.commit)" }
      workspaces:
        - { name: source, workspace: source, subPath: repository }
      taskSpec:
        params:
          - name: commit
            type: string
        workspaces:
          - name: source
        results:
          - name: subject
            description: The first line of the commit message, cut at 200 characters.
          - name: author
            description: The name and the address of the commit's author.
        steps:
          - name: describe
            image: {{ $gitImage }}
            workingDir: /workspace/source
            env:
              - name: COMMIT
                value: "$(params.commit)"
            script: |
              #!/usr/bin/env sh
              set -eu
              git log -1 --format=%s "${COMMIT}" | cut -c1-200 | tr -d '\n' > "$(results.subject.path)"
              git log -1 --format='%an <%ae>' "${COMMIT}" | cut -c1-200 | tr -d '\n' > "$(results.author.path)"
            computeResources:
              requests: { cpu: 50m, memory: 64Mi }
              limits: { cpu: 200m, memory: 128Mi }

    # ── 4. fetch — what the check compares against and what it reads ─────────
    # The clone fetches the one commit and nothing else, so no origin/<branch>
    # exists. A check that diffs against its default branch (a freeze guard that
    # reads origin/master) would refuse every run. A check may also read the
    # pinned commits of sibling repositories (SOURCES OF OTHER REPOSITORIES
    # above). Both fetches need the clone credential, which the check step must
    # never hold, so they run here, in one pod: under the namespace's ci quota
    # of one pod, every further task would wait for the previous pod to go.
    # Each credential store lives in /tmp of its own container, never in the
    # workspace, and the step that reads ci-sources.json holds no credential.
    - name: fetch
      runAfter: [describe-commit]
      timeout: 5m0s
      workspaces:
        - { name: source, workspace: source, subPath: repository }
        - { name: sources, workspace: source, subPath: sources }
      taskSpec:
        workspaces:
          - name: source
          - name: sources
        volumes:
          - name: source-list
            emptyDir: {}
        steps:
          - name: branches
            image: {{ $gitImage }}
            envFrom:
              - secretRef:
                  name: build-git-https
            workingDir: /workspace/source
            script: |
              #!/usr/bin/env sh
              set -eu
              printf '%s\n' "${GITCREDENTIALS}" > /tmp/git-credentials
              chmod 600 /tmp/git-credentials
              export HOME=/tmp
              git config --global credential.helper "store --file=/tmp/git-credentials"
              git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
              echo "fetch: ok — the branch heads of origin are at refs/remotes/origin"
            # The fetch takes every branch head: 95 MiB of anonymous memory
            # for 183 branches, the most of the repositories measured.
            computeResources:
              requests: { cpu: 50m, memory: 128Mi }
              limits: { cpu: 500m, memory: 256Mi }
          # Reads the branch's ci-sources.json into "<repository> <commit>"
          # lines, refusing any name that is not a plain repository name and
          # any commit that is not a full SHA-1, so the step that holds the
          # credential reads nothing but those lines.
          - name: list-sources
            image: {{ $reportImage }}
            workingDir: /workspace/source
            env:
              - name: SOURCE_LIST
                value: /source-list/list
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              if [ ! -f ci-sources.json ]; then
                : > "${SOURCE_LIST}"
                echo "fetch: no ci-sources.json, so no sources to fetch"
                exit 0
              fi
              jq -r '(.git // {}) | to_entries[]
                | if (.key | test("^[A-Za-z0-9._-]+$")) and (.key | test("^[.]+$") | not)
                     and (.value | type == "string" and test("^[0-9a-f]{40}$"))
                  then "\(.key) \(.value)"
                  else error("ci-sources.json: \(.key | tojson) must name a repository and a full commit, not \(.value | tojson)") end' \
                ci-sources.json > "${SOURCE_LIST}"
              echo "fetch: $(wc -l < "${SOURCE_LIST}") sources pinned in ci-sources.json"
            computeResources:
              requests: { cpu: 50m, memory: 32Mi }
              limits: { cpu: 200m, memory: 64Mi }
            volumeMounts:
              - name: source-list
                mountPath: /source-list
          - name: sources
            image: {{ $gitImage }}
            envFrom:
              - secretRef:
                  name: build-git-https
            env:
              - name: SOURCES_OWNER_URL
                value: {{ $sourcesOwnerURL | quote }}
            script: |
              #!/usr/bin/env sh
              set -eu
              if [ ! -s /source-list/list ]; then exit 0; fi
              printf '%s\n' "${GITCREDENTIALS}" > /tmp/git-credentials
              chmod 600 /tmp/git-credentials
              export HOME=/tmp
              git config --global credential.helper "store --file=/tmp/git-credentials"
              while read -r repository commit; do
                into="/workspace/sources/${repository}.git"
                git init -q --bare "${into}"
                if ! git --git-dir "${into}" fetch -q --depth=1 "${SOURCES_OWNER_URL}/${repository}.git" "${commit}"; then
                  echo "fetch: ${repository} at ${commit} could not be fetched from ${SOURCES_OWNER_URL}" >&2
                  exit 1
                fi
                echo "fetch: ${repository} at ${commit}"
              done < /source-list/list
            computeResources:
              requests: { cpu: 50m, memory: 128Mi }
              limits: { cpu: 500m, memory: 256Mi }
            volumeMounts:
              - name: source-list
                mountPath: /source-list

    # ── 5. check — the repository's own scripts/check.sh ─────────────────────
    - name: check
      runAfter: [fetch]
      timeout: 20m0s
      params:
        - { name: before, value: "$(params.before)" }
      workspaces:
        - { name: source, workspace: source, subPath: repository }
        - { name: sources, workspace: source, subPath: sources }
      taskSpec:
        params:
          - name: before
            type: string
        workspaces:
          - name: source
          - name: sources
            readOnly: true
        volumes:
          # The unit's authenticated .npmrc, mounted as the buildah build step
          # mounts it (build-npmrc, optional: a unit without private packages
          # has no such Secret).
          - name: npmrc
            secret:
              secretName: build-npmrc
              optional: true
          # The pnpm content store of this run. It cannot sit on the workspace,
          # which is the repository itself, and a store shared between runs
          # saves nothing worth a claim: a cold install takes seconds.
          - name: pnpm-store
            emptyDir: {}
        steps:
          - name: check
            # ghcr.io/puppeteer/puppeteer: Node 24, git, bash, curl, and the
            # Chrome for Testing its PDF tests need, on the node:24-bookworm
            # base. The tag and the digest were read from the registry
            # (manifest of 25.13.0, linux/amd64).
            image: ghcr.io/puppeteer/puppeteer:25.13.0@sha256:893118e0546f8cee371a0ae09c8489d1e9c40de28c45df9d811d4233203b81a3
            workingDir: /workspace/source
            securityContext:
              # The clone leaves the workspace to root, and the image's own
              # user is 10042. Root without the ability to gain more.
              runAsUser: 0
              allowPrivilegeEscalation: false
            env:
              # What GitHub Actions also sets: a check that cannot run on a
              # build plane (a missing sibling checkout) reads it to say so.
              - name: CI
                value: "true"
              # The bare repositories the fetch task filled from ci-sources.json.
              - name: CI_SOURCES_DIR
                value: /workspace/sources
              # The commit the branch stood at before this push, proven a SHA-1
              # by the gate, all zeros for a new branch. A check that compares
              # the push against its base reads it: on a master push the merge
              # base with origin/master is the pushed commit itself.
              - name: CI_BEFORE_COMMIT
                value: "$(params.before)"
              - name: NPM_CONFIG_USERCONFIG
                value: /npmrc/.npmrc
              - name: pnpm_config_store_dir
                value: /pnpm-store
              - name: COREPACK_ENABLE_DOWNLOAD_PROMPT
                value: "0"
            volumeMounts:
              - name: npmrc
                mountPath: /npmrc
                readOnly: true
              - name: pnpm-store
                mountPath: /pnpm-store
            # Sized from the whole check.sh of the largest repository, every test
            # suite included and the install cold, under a CPU quota of 4 cores
            # and a memory cap of 4 GiB on a 32-core development machine: 8.75
            # minutes, 1.4 cores on average, 1.7 GiB of anonymous memory. The
            # repository whose tests print PDFs peaked at 2.3 GiB. The memory
            # limit is 3 GiB, 30 % above that peak: the limits of all ci pods
            # together must fit the free memory of the build node
            # (ciCapacity in values-common.yaml). The timeout of the task is
            # twice the measured run, the install and the downloads included.
            computeResources:
              requests: { cpu: "1", memory: 2Gi }
              limits: { cpu: "4", memory: 3Gi }
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              # pnpm 11.7.0 is what the units' Dockerfiles activate. A unit
              # whose package.json names packageManager overrides it.
              corepack enable
              corepack prepare pnpm@11.7.0 --activate

              # helm 4.3.0, for a check that renders charts.
              curl -fsSL -o /tmp/helm.tar.gz https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
              echo "86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb  /tmp/helm.tar.gz" | sha256sum -c -
              tar -xzf /tmp/helm.tar.gz -C /usr/local/bin --strip-components=1 linux-amd64/helm

              # yq 4.53.6, for a check that reads rendered charts.
              curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.53.6/yq_linux_amd64
              echo "c5f056448f973ae7d39b5401949648a78f2dc1947d6a8eb65be60d5c504b9385  /usr/local/bin/yq" | sha256sum -c -
              chmod +x /usr/local/bin/yq

              # The Chrome of the image, for the units whose tests print PDFs.
              # A unit that has no use for the variables ignores them.
              REPORT_CHROMIUM_PATH="$(ls /home/pptruser/.cache/puppeteer/chrome/linux-*/chrome-linux64/chrome | head -n 1)"
              export REPORT_CHROMIUM_PATH
              # Root in a container cannot use Chrome's sandbox, and the pod's
              # /dev/shm is 64 MiB.
              export REPORT_CHROMIUM_ARGS=--no-sandbox,--disable-dev-shm-usage

              if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; fi
              bash scripts/check.sh

  finally:
    # ── report-failure — one mail for a failed run, with the error in it ──────
    # Runs when a task failed or timed out (a cancelled run runs no finally
    # task). It needs no workspace: everything it mails it reads from the API.
    # The projected token is the only credential, and this is the only task of
    # the Pipeline that mounts one.
    - name: report-failure
      timeout: 5m0s
      when:
        - input: "$(tasks.status)"
          operator: in
          values: ["Failed"]
      params:
        - { name: pipeline-run, value: "$(context.pipelineRun.name)" }
        - { name: branch, value: "$(params.branch)" }
        - { name: commit, value: "$(params.commit)" }
      taskSpec:
        params:
          - name: pipeline-run
            type: string
          - name: branch
            type: string
          - name: commit
            type: string
        volumes:
          # The shape of the release bump's API credential: the token, the
          # cluster CA and the namespace in one directory, which is where an
          # in-cluster client looks. 600 seconds is the shortest life the API
          # server accepts, and the task is bounded at 5 minutes.
          - name: api-token
            projected:
              sources:
                - serviceAccountToken:
                    path: token
                    expirationSeconds: 600
                - configMap:
                    name: kube-root-ca.crt
                    items:
                      - { key: ca.crt, path: ca.crt }
                - downwardAPI:
                    items:
                      - path: namespace
                        fieldRef:
                          fieldPath: metadata.namespace
        steps:
          - name: report
            image: {{ $reportImage }}
            env:
              - name: SERVICE_ACCOUNT_DIR
                value: /var/run/secrets/kubernetes.io/serviceaccount
              - name: PIPELINE_RUN
                value: "$(params.pipeline-run)"
              - name: REPOSITORY
                value: {{ $unit | quote }}
              - name: BRANCH
                value: "$(params.branch)"
              - name: COMMIT
                value: "$(params.commit)"
              - name: DASHBOARD_URL
                value: {{ $dashboardURL | quote }}
              - name: GRAFANA_URL
                value: {{ printf "https://grafana.%s" (required "consumer-build: global.booksCluster is required (clusters/active/<fqdn>.yaml, the install branch of the cluster holding the master role — the failure mail links to the Grafana there)" .Values.global.booksCluster) | quote }}
              - name: ALERTMANAGER_URL
                value: {{ printf "http://%s.%s.svc:%v" $alertmanager.serviceName $alertmanager.namespace $alertmanager.port | quote }}
            volumeMounts:
              - { name: api-token, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true }
            script: |
{{ .Files.Get "files/ci-report-failure.sh" | indent 14 }}
            computeResources:
              requests: { cpu: 50m, memory: 64Mi }
              limits: { cpu: 500m, memory: 256Mi }

    # ── commit-status — tekton/ci gets the outcome of the run ─────────────────
    # Runs after every run whose gate passed, which is every run that set the
    # pending; a run the gate refused names a commit it did not prove. A run the
    # ci run keeper replaces is cancelled gracefully, so this task runs for it too.
    - name: commit-status
      timeout: 2m0s
      when:
        - input: "$(tasks.gate.status)"
          operator: in
          values: ["Succeeded"]
      params:
        - { name: commit, value: "$(params.commit)" }
        - { name: run-state, value: "$(tasks.status)" }
        - name: task-reasons
          value: "$(tasks.gate.reason) $(tasks.commit-status-pending.reason) $(tasks.clone.reason) $(tasks.describe-commit.reason) $(tasks.fetch.reason) $(tasks.check.reason)"
      taskSpec:
        params:
          - name: commit
            type: string
          - name: run-state
            type: string
          - name: task-reasons
            type: string
        steps:
          - name: commit-status
            image: {{ $reportImage }}
            env:
{{ include "consumer-build.ciCommitStatusEnv" (dict "repositoryPath" $repositoryPath "runURL" $runURL) | indent 14 }}
              - name: RUN_STATE
                value: "$(params.run-state)"
              - name: TASK_REASONS
                value: "$(params.task-reasons)"
            script: |
{{ .Files.Get "files/ci-commit-status.sh" | indent 14 }}
            computeResources:
              requests: { cpu: 50m, memory: 64Mi }
              limits: { cpu: 200m, memory: 128Mi }
{{- end }}
