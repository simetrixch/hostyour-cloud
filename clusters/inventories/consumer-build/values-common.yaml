# Shared values across DEV / TEST / PROD. Nothing here is stage-specific: the
# stage a release lands on arrives per run in the tag ref, and every hostname
# is composed from the platform globals.
#
# TWO RENDER MODES, one chart, told apart by `unit`:
#
#   unit: null   CATALOG mode — the consumer-build Application from the app
#                catalog (clusters/argocd/files/platform-apps-appset.yaml, project
#                cicd) renders ONLY templates/applicationset.yaml, which emits
#                the build fan-out ApplicationSet over registrations/*/build.yaml.
#
#   unit: {...}  UNIT mode — each Application the fan-out generates renders
#                this same chart with the unit's registration stamped in via
#                helm.valuesObject. Everything below `unit` is a LITERAL from
#                registrations/<name>/build.yaml on master — the attested
#                record, never a webhook payload:
#                  name        the unit (== basename(repoURL), the invariant
#                              the deploy-request Trigger routes by)
#                  repoURL     the unit's source repo; the pipeline pins it as
#                              the clone URL and fails a run whose webhook
#                              names any other repo
#                  buildsJson  the attested builds[] as a JSON string (toJson
#                              in the ApplicationSet: its body is emitted
#                              through Helm, which validates output as YAML —
#                              a scalar survives that parse, a rendered list
#                              would not)
unit: null

# WHO MAY LAND A RUN IN A UNIT'S BUILD NAMESPACE. The EventListener runs in its
# own namespace and creates the PipelineRun in the unit's, so the grant lives
# where the run lands — rendered per unit by templates/rbac-eventlistener.yaml,
# scoped to `create` on pipelineruns and to that one namespace.
#
# Named here rather than composed, because these are the identity of another
# release (clusters/inventories/image-builder) and a chart that guessed them would fail at the
# moment a webhook arrives rather than at the moment it renders.
eventListener:
  serviceAccountName: eventlistener-sa
  namespace: image-builder

# WHO STARTS A WAITING RELEASE RUN. Release runs are created waiting, and the release queue of
# clusters/inventories/image-builder starts them one release at a time. Its grant is `patch` on
# pipelineruns in the unit's build namespace, rendered per unit by templates/rbac-release-queue.yaml;
# the admission policy of image-builder lets that identity change nothing but the waiting flag and
# the note of what a run waits for.
releaseQueue:
  serviceAccountName: release-queue
  namespace: image-builder

# HOW MANY CI PODS A UNIT RUNS AT ONCE. templates/resourcequota-ci.yaml caps the pods of the ci priority
# class in each build namespace; a pod over the cap waits and is retried, the run does not fail. The class
# is created by clusters/inventories/image-builder (priorityClasses.ci) and named here for the same reason
# as the identities above; scripts/build-contract.test.mjs renders both charts and fails when the two names
# differ. The cap counts pods, not CPU or memory, because Tekton's own init containers carry no requests and
# a compute quota would refuse every pod. One pod per unit means the ci runs of one repository run one
# after the other: the run of a second branch waits for the run of the first, about 9 minutes for the
# largest repository.
#
# THE SUM OF THE LIMITS MUST FIT THE FREE MEMORY OF THE BUILD NODE. The scheduler admits a pod by its
# requests, so it admits every pod that the caps allow, and the pods may then use their whole limits at
# once. When the node runs out of memory the kernel kills by the QoS class of a pod and not by its priority
# class, so the pods without requests (argocd, tekton, observability and ingress run many of them) die before
# a ci pod does. What keeps them safe is a sum of limits that fits, and scripts/build-contract.test.mjs fails
# when it does not:
#
#   maxRunning x the largest memory limit of a ci pod (the sum of its steps)
#   + maxRunning x the memory limit of the report pod (the finally task of the ci pipeline)
#   + releaseBuildPods x the memory limit of a buildah pod (the sum of its steps)
#   <= limitsMemoryBudget
#
# maxRunning is ciRunKeeper.maxRunning in clusters/inventories/image-builder: the ci run keeper starts a
# waiting ci run only while fewer ci runs than that have started and not finished, whatever the number of
# units. A run holds one live ci pod at a time, because the tasks of the ci pipeline run one after the other
# (the test asserts the chain), and one report pod after them.
#
# podsPerUnit is 2 for that same chain, not for a second live pod. Tekton creates the pod of the next task as
# soon as the steps of the one before have exited, and for a moment that pod is not yet Succeeded, so the
# quota still counts it. With a cap of 1 the next pod is refused (ExceededResourceQuota) and Tekton tries it
# again a minute later, at every task boundary: a check of 30 s took 5 min. The finished pod holds no running
# step, so the memory budget still counts one ci pod per run.
#
# The report pod carries the class image-builder-ci-report, which the quota does not count, so a red run
# reports at once even while the next check of its unit holds the slot. Each running run has at most one,
# so the term is bounded by the same cap.
#
# The second term is one release, because the release queue starts one release at a time, and the build
# pods of a release are not counted by the quota (they carry no ci class). Only the first stage run of a
# release builds; the later stage runs find the image in the registry.
#
# releaseBuildPods is DECLARED, not derived: the attested builds come from the registrations of the books
# branch, which this chart cannot read. It is the number of images the largest unit builds at once after
# the scan (3 on 2026-10-09); the test renders a release with that many images and fails when they do not
# all run in parallel. limitsMemoryBudget is the memory the build node had available on 2026-10-09 at 15:10Z,
# with no build pod running: master1 has 59.5 GiB, and 21.3 GiB was in use, so 38 GiB.
ciCapacity:
  priorityClassName: image-builder-ci
  podsPerUnit: 2
  releaseBuildPods: 3
  limitsMemoryBudget: 38Gi

# WHO STARTS, CANCELS AND DELETES A CI RUN. The ci run keeper of clusters/inventories/image-builder starts
# the waiting ci runs up to ciRunKeeper.maxRunning, cancels a ci run that a newer push to the same branch
# replaces, and deletes the finished ci runs beyond the
# newest 20 of each build namespace. Its grant is `patch` and `delete` on pipelineruns in the unit's
# build namespace, rendered per unit by templates/rbac-ci-run-keeper.yaml, and named here for the same
# reason as the release queue above. The admission policy of image-builder lets that identity set
# spec.status Cancelled or CancelledRunFinally on a ci run, drop its waiting flag and set the note of what it waits for, and change
# nothing else.
ciRunKeeper:
  serviceAccountName: ci-run-keeper
  namespace: image-builder

# WHERE A FAILED CI RUN IS REPORTED. The finally task of the ci pipeline posts one alert to this
# Alertmanager, and templates/networkpolicy.yaml opens its port to that task's pod and to no other pod
# of the namespace: Alertmanager takes any alert from anybody, so a pod that runs a repository's code
# must not reach it. The address is the in-cluster Service of the observability release, which stands
# on the master cluster; a build plane on another cluster reaches nothing there, and its failed runs
# fail the report task visibly instead of mailing. The pod labels are the ones the Prometheus operator
# puts on the Alertmanager pod.
ciFailureReport:
  alertmanager:
    namespace: observability
    serviceName: observability-alertmanager
    port: 9093
    podLabels:
      app.kubernetes.io/name: alertmanager
      alertmanager: observability-alertmanager

# WHO MAY WATCH A RUN IT DID NOT START. The manager has no task in a release cycle — the webhook
# starts the run and the pipeline finishes it — but it reports the run's progress to the operator who
# asked for the release, so it needs get/list/watch on PipelineRuns in the unit's build namespace.
# Read only, and rendered per unit by templates/rbac-manager-read.yaml beside the eventlistener grant,
# for the same reason: both are grants ON the unit's build namespace, and this chart is what creates
# that namespace.
#
# Named here rather than composed, for the reason stated above the EventListener: this is the identity
# of another release (clusters/inventories/manager, its own namespace and its own ServiceAccount), and
# a chart that guessed it would bind a subject that does not exist and report itself green.
manager:
  serviceAccountName: manager
  namespace: manager

# The per-unit .npmrc (templates/externalsecret-npmrc.yaml) states no value here: the
# unit's own scope is the owner of its repository, routed to GitHub Packages with the
# organisation's packages reader (the `packages` property of the unit's build entry,
# hostyour-manager#220), and the DEFAULT (unscoped) registry is deliberately NOT set, so pnpm
# resolves public deps from its own default, registry.npmjs.org — the build's egress is
# outward-open (templates/networkpolicy.yaml), and the tarball URLs in the unit's
# COMMITTED lockfile were written against npmjs (else ERR_PNPM_TARBALL_URL_MISMATCH).

# Post-DNAT API-server egress pinhole for the BUMP pod only (second
# NetworkPolicy in templates/networkpolicy.yaml — the gate-runner
# reportWriter pattern), and for the ci failure report pod (the policy beside
# it, which reads the same ports): the bump's last step patches the unit's own
# Applications for the argo-sync, and Calico evaluates egress AFTER kube-proxy
# DNAT, so kubernetes.default.svc resolves to the node's apiserver endpoint
# inside the fenced private ranges. Default admits the 10/8 range on the usual
# apiserver ports; tighten to <nodeIP>/32 + the one real port (microk8s:
# 16443) on an install branch if desired.
bump:
  apiServer:
    ports:
      - 443
      - 6443
      - 16443
