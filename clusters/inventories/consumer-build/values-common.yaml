# Shared values across DEV / TEST / PROD. Nothing here is stage-specific: the
# stage a release lands on arrives per run in the tag ref, and every hostname
# is composed from the platform globals.
#
# TWO RENDER MODES, one chart, told apart by `unit`:
#
#   unit: null   CATALOG mode — the consumer-build Application from the app
#                catalog (clusters/argocd/files/platform-apps-appset.yaml, project
#                cicd) renders ONLY templates/applicationset.yaml, which emits
#                the build fan-out ApplicationSet over registrations/*/build.yaml.
#
#   unit: {...}  UNIT mode — each Application the fan-out generates renders
#                this same chart with the unit's registration stamped in via
#                helm.valuesObject. Everything below `unit` is a LITERAL from
#                registrations/<name>/build.yaml on master — the attested
#                record, never a webhook payload:
#                  name        the unit (== basename(repoURL), the invariant
#                              the deploy-request Trigger routes by)
#                  repoURL     the unit's source repo; the pipeline pins it as
#                              the clone URL and fails a run whose webhook
#                              names any other repo
#                  buildsJson  the attested builds[] as a JSON string (toJson
#                              in the ApplicationSet: its body is emitted
#                              through Helm, which validates output as YAML —
#                              a scalar survives that parse, a rendered list
#                              would not)
unit: null

# WHO MAY LAND A RUN IN A UNIT'S BUILD NAMESPACE. The EventListener runs in its
# own namespace and creates the PipelineRun in the unit's, so the grant lives
# where the run lands — rendered per unit by templates/rbac-eventlistener.yaml,
# scoped to `create` on pipelineruns and to that one namespace.
#
# Named here rather than composed, because these are the identity of another
# release (clusters/inventories/image-builder) and a chart that guessed them would fail at the
# moment a webhook arrives rather than at the moment it renders.
eventListener:
  serviceAccountName: eventlistener-sa
  namespace: image-builder

# WHO STARTS A WAITING RELEASE RUN. Release runs are created waiting, and the release queue of
# clusters/inventories/image-builder starts them four runs at a time. Its grant is `patch` on
# pipelineruns in the unit's build namespace, rendered per unit by templates/rbac-release-queue.yaml;
# the admission policy of image-builder lets that identity change nothing but the waiting flag and
# the note of what a run waits for.
releaseQueue:
  serviceAccountName: release-queue
  namespace: image-builder

# HOW MANY CI PODS A UNIT RUNS AT ONCE. templates/resourcequota-ci.yaml caps the pods of the ci priority
# class in each build namespace; a pod over the cap waits and is retried, the run does not fail. The class
# is created by clusters/inventories/image-builder (priorityClasses.ci) and named here for the same reason
# as the identities above; scripts/build-contract.test.mjs renders both charts and fails when the two names
# differ. The cap counts pods, not CPU or memory, because Tekton's own init containers carry no requests and
# a compute quota would refuse every pod. One pod per unit means the ci runs of one repository run one
# after the other: the run of a second branch waits for the run of the first, about 9 minutes for the
# largest repository.
#
# THE SUM OF THE LIMITS IS BOUNDED BY A BUDGET. The scheduler admits a pod by its requests, so it admits every
# pod that the caps allow, and the pods may then use their whole limits at once. When the node runs out of
# memory the kernel kills by the QoS class of a pod and not by its priority class, so the pods without requests
# (argocd, tekton, observability and ingress run many of them) die before a ci pod does. What bounds that is a
# sum of limits that does not grow past limitsMemoryBudget, and scripts/build-contract.test.mjs fails when it
# does:
#
#   the limits of the maxRunning largest distinct ci pods (the sum of each pod's steps)
#   + the report pod of each of those ci runs (the finally task of the ci pipeline)
#   + the releaseSlots largest distinct units, each max(the memory limits of the pods that its release run has alive at once,
#                                                        the memory limits of the pods that its publish run has alive at once)
#   <= limitsMemoryBudget
#
# The budget is NOT the free memory of the node. With four releases the worst case, every pod at its limit, is
# 56 GiB (3.5 + 5 x 3 + 1.5 + 12 x 3) on a node of 59.4 GiB of which about 23 GiB were in use on 2026-10-14, so it
# exceeds what is free. The owner accepted that (decision of 2026-10-15: the platform has no customer data and
# production may be down); the pods use far less than their limits, and a fifth release at once, or a larger
# limit, raises the sum past the budget and fails the test until the owner raises the budget again.
#
# maxRunning is ciRunKeeper.maxRunning in clusters/inventories/image-builder: the ci run keeper starts a
# waiting ci run only while fewer ci runs than that have started and not finished, whatever the number of
# units. A run holds one live ci pod at a time, because the tasks of the ci pipeline run one after the other
# (the test asserts the chain), and one report pod after them.
#
# podsPerUnit is 2 for that same chain, not for a second live pod. Tekton creates the pod of the next task as
# soon as the steps of the one before have exited, and for a moment that pod is not yet Succeeded, so the
# quota still counts it. With a cap of 1 the next pod is refused (ExceededResourceQuota) and Tekton tries it
# again a minute later, at every task boundary: a check of 30 s took 5 min. The finished pod holds no running
# step, so the memory budget still counts one ci pod per run.
#
# The report pod carries the class image-builder-ci-report, which the quota does not count, so a red run
# reports at once even while the next check of its unit holds the slot. Each running run has at most one,
# so the term is bounded by the same cap.
#
# The third term is the runs the queue runs at once (releaseSlots is releaseQueue.maxRunning in
# clusters/inventories/image-builder, 4). The queue runs one run of a unit at a time, so the runs in the slots belong to
# different units and the stage runs of a release never add up. A slot holds the larger of the release run and the publish
# run of its unit, and the worst case fills the slots with the largest units: the test sorts the units by that size and
# adds the releaseSlots largest. A run holds the pods that none of its tasks waits for, which the test reads from the
# rendered runAfter, result and when references (the builds of the unit, or its scan beside its probes, whichever is more).
#
# releaseUnitImages is DECLARED, not derived: the attested builds come from the registrations of the books branch, which
# this chart cannot read. It is the number of images each unit builds at once after the scan, as the Pipelines
# `<unit>-release` on the master had them on 2026-10-18 (swissbookai 4, digita-platform and hostyour-manager 3,
# digita-auth and digita-post 2, every other unit 1); the test renders a release with that many images and fails when they
# do not all run in parallel. A unit that builds more images, or a new unit, is added here, and the test then checks it
# against the budget. limitsMemoryBudget is the sum above for the 4 + 3 + 3 + 2 images of the four largest units at once,
# one 3584Mi ci check and five 3Gi ci checks, plus six report pods: 56Gi exactly. A buildah pod is 3Gi, a 2752Mi build step and
# a 320Mi push step, from the largest working sets the steps reached on the master over 15 days
# (scripts/build-contract.test.mjs).
#
# THE PODS OF THE BUILD NODE. The kubelet of the node admits at most nodePods active pods (finished pods do
# not count): --max-pods=250 in hostyour-deploy ansiwise/programs/deploy-cluster.yaml, held there by
# scripts/kubelet-image-gc.test.mjs; the default 110 is not what runs. The test adds the pods that a run has
# alive at once, as for the memory above:
#
#   the releaseSlots largest distinct units, each max(the pods that its release run has alive at once, the pods that its publish run has alive at once)
#   + maxRunning x (podsPerUnit + 1 report pod)
#   + standingPods
#   < nodePods
#
# One run of a unit at a time means the stages that global.channelStages in clusters/platform/values-common.yaml
# lets a channel reach (3) never run side by side. For the four largest units above that is
# (5 + 4 + 4 + 3) + 6 x 3 + 121 = 155 of 250. standingPods is DECLARED,
# not derived: the pods of the node that are not in a build namespace and not finished, 121 on 2026-10-14.
#
# THE CORES OF THE BUILD NODE. The scheduler admits a pod by its CPU requests, and a pod whose requests do not
# fit what is left of the node waits Pending, so a ci run would wait for a free core. A CPU limit reserves
# nothing: the kernel only slows the pods that ask for more than their share, in proportion to their requests.
# So the limits may add up to more than the node has (the check step alone may take 12 of its 32 cores, and
# six runs at once may ask for 72), and only a single limit may not exceed the node. What must fit is the sum
# of requests, and scripts/build-contract.test.mjs fails when it does not:
#
#   maxRunning x the largest CPU request of a ci pod (the sum of its steps)
#   + maxRunning x the CPU request of the report pod
#   + the releaseSlots largest distinct units, each max(the CPU requests of the pods that its release run has alive at once,
#                                                        the CPU requests of the pods that its publish run has alive at once)
#   + standingCpuRequests
#   <= nodeCpu
#
# The check step requests the largest whole number of cores for which that still holds: the test fails when
# the request is above it and when one more core would fit. nodeCpu is the allocatable CPU of master1 (32 on
# 2026-10-15). standingCpuRequests is DECLARED, not derived: the CPU requests of the pods of the node that are
# not in a build namespace and not finished. On 2026-10-15 they were 4.53 cores, and 72 of the pods standing there
# had no request at all, among them traefik and Argo CD, which get the smallest share while the ci pods take the
# node. The pods the master cannot work without now carry a request, each its p95 CPU use over seven days, and
# the figure is the 4.53 cores plus them:
#
#   Argo CD of the master (clusters/bootstrap/argocd/values.tpl)             460m
#   Argo CD of the 8 slave instances, 190m each (clusters/slaves/slave)     1520m
#   cert-manager, its cainjector and its webhook, 10m each                    30m
#   the identity database (clusters/bootstrap/idp/values.yaml)                30m
#   traefik, the ingress addon's DaemonSet                                   400m
#
# Traefik's request is set where the addon is patched, in hostyour-deploy, and is counted here already, so the
# figure may be a little high until that lands, never low. scripts/build-contract.test.mjs adds the requests of the
# values files up and fails when this figure is below the sum.
ciCapacity:
  priorityClassName: image-builder-ci
  podsPerUnit: 2
  releaseUnitImages:
    digita-auth: 2
    digita-catalog-proofapps: 1
    digita-catalog-showcase: 1
    digita-catalog-simplidigita: 1
    digita-jobs: 1
    digita-platform: 3
    digita-post: 2
    digita-realtime: 1
    digita-report: 1
    digita-testkit: 1
    hostyour-demo-consumer: 1
    hostyour-manager: 3
    swissbookai: 4
  limitsMemoryBudget: 56Gi
  nodePods: 250
  standingPods: 121
  nodeCpu: "32"
  standingCpuRequests: 6970m

# THE CHECK STEP'S MEMORY AND VITEST WORKERS. The digita-platform cap holds its app, web and engine
# suites to four workers through their shared VITEST_MAX_WORKERS reader. The supplied upper peak of
# 2Gi for three workers gives ceil(2048 / 3 x 1.30) = 888Mi per worker; four need an estimated
# 3552Mi including margin. The 3Gi request covers their estimated 2731Mi without margin. A complete
# master run must still prove its duration and actual memory peak.
ciCheckMemory:
  default: { requests: 2Gi, limits: 3Gi }
  units:
    digita-platform: { requests: 3Gi, limits: 3584Mi, maxWorkers: "4" }

# WHO STARTS, CANCELS AND DELETES A CI RUN. The ci run keeper of clusters/inventories/image-builder starts
# the waiting ci runs up to ciRunKeeper.maxRunning, cancels a ci run that a newer push to the same branch
# replaces, and deletes the finished ci runs beyond the
# newest 20 of each build namespace. Its grant is `patch` and `delete` on pipelineruns in the unit's
# build namespace, rendered per unit by templates/rbac-ci-run-keeper.yaml, and named here for the same
# reason as the release queue above. The admission policy of image-builder lets that identity set
# spec.status Cancelled or CancelledRunFinally on a ci run together with the annotation that names the
# push which replaced it, drop its waiting flag and set the note of what it waits for, and change
# nothing else.
ciRunKeeper:
  serviceAccountName: ci-run-keeper
  namespace: image-builder

# WHERE A FAILED CI RUN IS REPORTED. The finally task of the ci pipeline posts one alert to this
# Alertmanager, and templates/networkpolicy.yaml opens its port to that task's pod and to no other pod
# of the namespace: Alertmanager takes any alert from anybody, so a pod that runs a repository's code
# must not reach it. The address is the in-cluster Service of the observability release, which stands
# on the master cluster; a build plane on another cluster reaches nothing there, and its failed runs
# fail the report task visibly instead of mailing. The pod labels are the ones the Prometheus operator
# puts on the Alertmanager pod.
ciFailureReport:
  alertmanager:
    namespace: observability
    serviceName: observability-alertmanager
    port: 9093
    podLabels:
      app.kubernetes.io/name: alertmanager
      alertmanager: observability-alertmanager

# WHO MAY WATCH A RUN IT DID NOT START. The manager has no task in a release cycle — the webhook
# starts the run and the pipeline finishes it — but it reports the run's progress to the operator who
# asked for the release, so it needs get/list/watch on PipelineRuns in the unit's build namespace.
# Read only, and rendered per unit by templates/rbac-manager-read.yaml beside the eventlistener grant,
# for the same reason: both are grants ON the unit's build namespace, and this chart is what creates
# that namespace.
#
# Named here rather than composed, for the reason stated above the EventListener: this is the identity
# of another release (clusters/inventories/manager, its own namespace and its own ServiceAccount), and
# a chart that guessed it would bind a subject that does not exist and report itself green.
manager:
  serviceAccountName: manager
  namespace: manager

# The per-unit .npmrc (templates/externalsecret-npmrc.yaml) states no value here: it reads
# the npm packages this build plane publishes with the registry's pull identity, routes no
# scope and names no GitHub Packages, and the DEFAULT (unscoped) registry is deliberately NOT set, so pnpm
# resolves public deps from its own default, registry.npmjs.org — the build's egress is
# outward-open (templates/networkpolicy.yaml), and the tarball URLs in the unit's
# COMMITTED lockfile were written against npmjs (else ERR_PNPM_TARBALL_URL_MISMATCH).

# Post-DNAT API-server egress pinhole for the BUMP pod only (second
# NetworkPolicy in templates/networkpolicy.yaml — the gate-runner
# reportWriter pattern), and for the ci failure report pod (the policy beside
# it, which reads the same ports): the bump's last step patches the unit's own
# Applications for the argo-sync, and Calico evaluates egress AFTER kube-proxy
# DNAT, so kubernetes.default.svc resolves to the node's apiserver endpoint
# inside the fenced private ranges. Default admits the 10/8 range on the usual
# apiserver ports; tighten to <nodeIP>/32 + the one real port (microk8s:
# 16443) on an install branch if desired.
bump:
  apiServer:
    ports:
      - 443
      - 6443
      - 16443
