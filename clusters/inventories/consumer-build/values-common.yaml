# Shared values across DEV / TEST / PROD. Nothing here is stage-specific: the
# stage a release lands on arrives per run in the tag ref, and every hostname
# is composed from the platform globals.
#
# TWO RENDER MODES, one chart, told apart by `unit`:
#
#   unit: null   CATALOG mode — the consumer-build Application from the app
#                catalog (clusters/argocd/files/platform-apps-appset.yaml, project
#                cicd) renders ONLY templates/applicationset.yaml, which emits
#                the build fan-out ApplicationSet over registrations/*/build.yaml.
#
#   unit: {...}  UNIT mode — each Application the fan-out generates renders
#                this same chart with the unit's registration stamped in via
#                helm.valuesObject. Everything below `unit` is a LITERAL from
#                registrations/<name>/build.yaml on master — the attested
#                record, never a webhook payload:
#                  name        the unit (== basename(repoURL), the invariant
#                              the deploy-request Trigger routes by)
#                  repoURL     the unit's source repo; the pipeline pins it as
#                              the clone URL and fails a run whose webhook
#                              names any other repo
#                  buildsJson  the attested builds[] as a JSON string (toJson
#                              in the ApplicationSet: its body is emitted
#                              through Helm, which validates output as YAML —
#                              a scalar survives that parse, a rendered list
#                              would not)
unit: null

# WHO MAY LAND A RUN IN A UNIT'S BUILD NAMESPACE. The EventListener runs in its
# own namespace and creates the PipelineRun in the unit's, so the grant lives
# where the run lands — rendered per unit by templates/rbac-eventlistener.yaml,
# scoped to `create` on pipelineruns and to that one namespace.
#
# Named here rather than composed, because these are the identity of another
# release (clusters/inventories/image-builder) and a chart that guessed them would fail at the
# moment a webhook arrives rather than at the moment it renders.
eventListener:
  serviceAccountName: eventlistener-sa
  namespace: image-builder

# WHO STARTS A WAITING RELEASE RUN. Release runs are created waiting, and the release queue of
# clusters/inventories/image-builder starts them nine runs at a time. Its grant is `patch` on
# pipelineruns in the unit's build namespace, rendered per unit by templates/rbac-release-queue.yaml;
# the admission policy of image-builder lets that identity change nothing but the waiting flag and
# the note of what a run waits for.
releaseQueue:
  serviceAccountName: release-queue
  namespace: image-builder

# THE SUM OF THE LIMITS IS BOUNDED BY A BUDGET. The scheduler admits a pod by its requests, and the pods may then use
# their whole limits at once. When the node runs out of memory the kernel kills by the QoS class of a pod and not by its
# priority class, so the pods without requests (argocd, tekton, observability and ingress run many of them) die before a
# build pod does. What bounds that is a sum of limits that does not grow past limitsMemoryBudget, and
# scripts/build-contract.test.mjs fails when it does:
#
#   the releaseSlots largest distinct units, each max(the memory limits of the pods that its release run has alive at once,
#                                                     the memory limits of the pods that its publish run has alive at once)
#   <= limitsMemoryBudget
#
# The budget is the exact sum, 31.5 GiB (9 x 3.5), on a node that allocates 62313320Ki (59.43 GiB, nodeMemory below) and
# of which 15-23 GiB were in use by the standing pods on 2026-10-19 (peak working set of 15 days: 17.35 GiB). The test
# holds the budget itself to nodeMemory, so the pods alone, at their limits, cannot ask for more than the node has. A
# tenth release at once or a larger limit raises the sum past the budget and fails the test until the owner raises the
# budget.
#
# releaseSlots is releaseQueue.maxRunning in clusters/inventories/image-builder (9), the runs the queue runs at
# once. The queue runs one run of a unit at a time, so the runs in the slots belong to
# different units and the stage runs of a release never add up. A slot holds the larger of the release run and the publish
# run of its unit, and the worst case fills the slots with the largest units: the test sorts the units by that size and
# adds the releaseSlots largest. A run holds the pods that none of its tasks waits for, which the test reads from the
# rendered runAfter, result and when references (the releaseBuildsAtOnce builds of the unit, or its scan beside its probes, or
# the pack pod of its publish run, whichever is more).
#
# releaseBuildsAtOnce is the number of images of one release that build at the same time (1): templates/pipeline-release.yaml
# lets the first releaseBuildsAtOnce builds of a unit wait for the scan and every later build wait for the build that many
# places before it, so the images of a unit build one after the other and a release slot holds one Buildah pod of 3Gi where
# it held every image of the unit at once (swissbookai 4, 12 Gi). That is what lets nine releases fit the memory where four
# did: the largest release of 15 days, swissbookai-release-5pqbj, built 4 images with pods at 2321, 2202 and 2023Mi, 7.5Gi
# in all (read from the master's Prometheus), and a Buildah pod is limited to 3Gi whatever the unit.
#
# releaseUnitImages is DECLARED, not derived: the attested builds come from the registrations of the books branch, which
# this chart cannot read. It is the number of images each unit builds, one after the other from the scan on, as the Pipelines
# `<unit>-release` on the master had them on 2026-10-18 (swissbookai 4, digita-platform and hostyour-manager 3,
# digita-auth and digita-post 2, every other unit 1; digita-realtime, new, has no Pipeline yet and builds 1); the test renders a release with that many images and fails when more
# than releaseBuildsAtOnce of them run at once. A unit that builds more images, or a new unit, is added here, and the test then checks it
# against the budget. limitsMemoryBudget is the sum above for nine release slots of 3584Mi (the pack pod of the publish
# run, the heaviest pod a slot holds): 31.5 GiB (32256Mi) exactly. A buildah pod is 3Gi, a 2752Mi build step and a 320Mi
# push step, from the largest working sets the steps reached on the master over 15 days (scripts/build-contract.test.mjs).
#
# THE PODS OF THE BUILD NODE. The kubelet of the node admits at most nodePods active pods (finished pods do
# not count): --max-pods=250 in hostyour-deploy ansiwise/programs/deploy-cluster.yaml, held there by
# scripts/kubelet-image-gc.test.mjs; the default 110 is not what runs. The test adds the pods that a run has
# alive at once, as for the memory above:
#
#   the releaseSlots largest distinct units, each max(the pods that its release run has alive at once, the pods that its publish run has alive at once)
#   + standingPods
#   < nodePods
#
# One run of a unit at a time means the stages that global.channelStages in clusters/platform/values-common.yaml
# lets a channel reach (3) never run side by side. For the nine largest units above that is
# (5 + 4 + 4 + 3 + 3 + 4 x 3) + 125 = 156 of 250. standingPods is DECLARED,
# not derived: the pods of the node that are not in a build namespace and not finished, 125 at the peak of the five days
# before 2026-10-19 (115 in the two days before; 111 running then), read from kube_pod_status_phase on the master's
# Prometheus.
#
# THE CORES OF THE BUILD NODE. The scheduler admits a pod by its CPU requests, and a pod whose requests do not
# fit what is left of the node waits Pending. A CPU limit reserves nothing: the kernel only slows the pods that ask
# for more than their share, in proportion to their requests. So the limits may add up to more than the node has,
# and only a single limit may not exceed the node. What must fit is the sum of requests, and
# scripts/build-contract.test.mjs fails when it does not:
#
#   the releaseSlots largest distinct units, each max(the CPU requests of the pods that its release run has alive at once,
#                                                     the CPU requests of the pods that its publish run has alive at once)
#   + standingCpuRequests
#   <= nodeCpu
#
# With nine releases that is 9.9 (the nine release slots at 1.1 each, the publish pod) + 6.98 = 16.88 of 32 cores.
# nodeCpu is the allocatable CPU of master1 (32 on 2026-10-15, and again on 2026-10-19). nodeMemory is the allocatable
# memory of master1, 62313320Ki, rounded down to the Mi (read 2026-10-19). standingCpuRequests is DECLARED, not derived: the CPU requests of the pods of the node that are
# not in a build namespace and not finished. On 2026-10-15 they were 4.53 cores, and 72 of the pods standing there
# had no request at all, among them traefik and Argo CD, which get the smallest share while the build pods take the
# node. The pods the master cannot work without now carry a request, each its p95 CPU use over seven days, and
# the figure is the 4.53 cores plus them:
#
#   Argo CD of the master (clusters/bootstrap/argocd/values.tpl)             460m
#   Argo CD of the 8 slave instances, 190m each (clusters/slaves/slave)     1520m
#   cert-manager, its cainjector and its webhook, 10m each                    30m
#   the identity database (clusters/bootstrap/idp/values.yaml)                30m
#   traefik, the ingress addon's DaemonSet                                   400m
#   Forgejo, the Git service of the master (clusters/inventories/forgejo)    10m
#
# Traefik's request is set where the addon is patched, in hostyour-deploy, and is counted here already, so the
# figure may be a little high until that lands, never low. scripts/build-contract.test.mjs adds the requests of the
# values files up and fails when this figure is below the sum.
ciCapacity:
  releaseBuildsAtOnce: 1
  releaseUnitImages:
    digita-auth: 2
    digita-catalog-proofapps: 1
    digita-catalog-showcase: 1
    digita-catalog-simplidigita: 1
    digita-jobs: 1
    digita-platform: 3
    digita-post: 2
    digita-realtime: 1
    digita-report: 1
    digita-testkit: 1
    hostyour-demo-consumer: 1
    hostyour-manager: 3
    swissbookai: 4
  limitsMemoryBudget: 32256Mi
  nodeMemory: 60852Mi
  nodePods: 250
  standingPods: 125
  nodeCpu: "32"
  standingCpuRequests: 6980m

# WHO MAY WATCH A RUN IT DID NOT START. The manager has no task in a release cycle — the webhook
# starts the run and the pipeline finishes it — but it reports the run's progress to the operator who
# asked for the release, so it needs get/list/watch on PipelineRuns in the unit's build namespace.
# Read only, and rendered per unit by templates/rbac-manager-read.yaml beside the eventlistener grant,
# for the same reason: both are grants ON the unit's build namespace, and this chart is what creates
# that namespace.
#
# Named here rather than composed, for the reason stated above the EventListener: this is the identity
# of another release (clusters/inventories/manager, its own namespace and its own ServiceAccount), and
# a chart that guessed it would bind a subject that does not exist and report itself green.
manager:
  serviceAccountName: manager
  namespace: manager

# The per-unit .npmrc (templates/externalsecret-npmrc.yaml) states no value here: it reads
# the npm packages this build plane publishes with the registry's pull identity, routes no
# scope and names no GitHub Packages, and the DEFAULT (unscoped) registry is deliberately NOT set, so pnpm
# resolves public deps from its own default, registry.npmjs.org — the build's egress is
# outward-open (templates/networkpolicy.yaml), and the tarball URLs in the unit's
# COMMITTED lockfile were written against npmjs (else ERR_PNPM_TARBALL_URL_MISMATCH).

# Post-DNAT API-server egress pinhole for the BUMP pod only (second
# NetworkPolicy in templates/networkpolicy.yaml — the gate-runner
# reportWriter pattern): the bump's last step patches the unit's own
# Applications for the argo-sync, and Calico evaluates egress AFTER kube-proxy
# DNAT, so kubernetes.default.svc resolves to the node's apiserver endpoint
# inside the fenced private ranges. Default admits the 10/8 range on the usual
# apiserver ports; tighten to <nodeIP>/32 + the one real port (microk8s:
# 16443) on an install branch if desired.
bump:
  apiServer:
    ports:
      - 443
      - 6443
      - 16443
  # The Forgejo of the installation as the bump reaches it over SSH (templates/networkpolicy.yaml bump-forge-ssh-egress, the
  # environment of the step search-and-write): the Service forgejo-ssh the chart of clusters/inventories/forgejo makes, which
  # leads to the container port of its pods; Calico evaluates egress after DNAT, so the policy admits the pod port. The pods
  # carry the release name of the stage, as egress.forgejo of clusters/inventories/forgejo-build has it.
  forgejo:
    namespace: forgejo
    service: forgejo-ssh
    servicePort: 22
    podPort: 2222
    podLabels:
      app.kubernetes.io/name: forgejo
      app.kubernetes.io/instance: 'forgejo-{{ .Values.global.env }}'
