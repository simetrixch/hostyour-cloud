apiVersion: v2
name: consumer-build
version: 1.0.0
description: Per-unit build namespaces for the release cycle. In catalog mode (no unit values) the chart emits ONE ApplicationSet over registrations/*/build.yaml; each generated Application renders this same chart in unit mode — namespace <unit>-build, SecretStore, the <unit>-release Pipeline, credentials and NetworkPolicy. The webhook entry point (the deploy-request Trigger) lives in clusters/inventories/image-builder next to the EventListener; the shared Tasks it resolves stay there too.
type: application

dependencies:
  # Shared named templates (common.registryHost etc.).
  - name: common
    version: 1.0.0
    repository: file://../../charts/common
