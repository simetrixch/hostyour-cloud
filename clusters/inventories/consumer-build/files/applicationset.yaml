# Build fan-out — one ApplicationSet over the stage-free build registrations
# registrations/<unit>/build.yaml IN THIS INSTALLATION'S BOOKS. Every
# registered unit — every kind alike — gets ONE Application
# `<unit>-build` (project `builds`) that renders the consumer-build chart in
# UNIT mode: namespace <unit>-build, SecretStore, the <unit>-release Pipeline,
# its credentials and NetworkPolicy.
#
# Emitted VERBATIM by clusters/inventories/consumer-build/templates/applicationset.yaml via
# .Files.Get (so ArgoCD's own {{ }} goTemplate expressions survive Helm
# rendering). __STAGE__, __REVISION__, __FQDN__ and __CLUSTER__ are substituted
# by the wrapper (from global.env / the parameter revision / global.domain /
# global.clusterName).
#
# ONE parameter set per unit BY CONSTRUCTION: a plain files generator over
# registrations/*/build.yaml, and a unit has exactly one such file. No merge
# generator, no dedup, no template logic. (A files generator emits one
# parameter set per FILE; matching registrations/*/*.yaml would give a
# Deployments unit three parameter sets and three Applications of the same
# name.)
#
# THE GENERATOR AND THE SOURCES STAND AT __REVISION__, the commit of this
# repository the platform Application consumer-build synced, which
# clusters/argocd/files/platform-apps-appset.yaml hands this chart as the
# parameter `revision`. That commit is the one the root Application synced, on
# the books branch, where the Manager writes the registrations: this chart runs
# only on the cluster holding the master role (app.yaml runsOn: master). A
# <unit>-build Application therefore reaches a commit only after the root
# Application has applied that commit's AppProject `builds` at wave -1. One that
# followed the branch on its own could sync a kind before `builds` admits it,
# and its sync would fail until a retry.
#
# `suspended` acts through the post-selector: a suspended unit gets no
# <unit>-build Application, so the deploy-request webhook runs into nothing
# and nothing is built. (In the consumers-appset suspend must NOT prune — a
# ServiceClaim finalizer would drop live data. Build objects hold no data, so
# prune is the correct suspend here.)
#
# The field read here is build.yaml's, and build.yaml is the UNIT's while suspend
# is per STAGE — so it means "suspended EVERYWHERE", not "suspended somewhere".
# The Manager keeps it that way (Registry.flip): it turns true once every stage
# the unit stands at is suspended, and false again the moment one resumes. Pausing
# dev must not stop prod's releases, and a unit that runs nowhere must not keep a
# build surface.
#
# What is NOT paused is the release BUMP: a paused unit's pins keep being written,
# so a resume comes up on the current version rather than the one it was paused at.
# The pin is bookkeeping; the pause is an operating state.
#
# The unit's attested builds[] ride into the chart as a JSON STRING (toJson):
# this file is emitted through Helm, which validates its output as YAML — a
# quoted scalar survives that parse, a rendered list would not.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: consumer-build
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: __PLATFORM_URL__
        revision: __REVISION__  # the commit the platform Application synced, on the books branch, where the registrations stand
        files:
          - path: "registrations/*/build.yaml"
      # THE FIELD IS A BOOLEAN AND THE SELECTOR VALUE IS A STRING, and both are right.
      # hostyour-manager/shared/consumer.ts declares suspended: z.boolean() and
      # Registry.flip writes it unquoted; matchLabels is map[string]string, so an
      # unquoted false HERE is a manifest the API server refuses. The two meet
      # because ArgoCD prints the parameter before it matches — fmt.Sprintf("%v", v)
      # in applicationset/generators/generator_spec_processor.go at v3.4.5, the
      # appVersion clusters/slaves/slave/Chart.yaml pins — and a Go bool(false) prints as
      # false.
      selector:
        matchLabels:
          suspended: "false"
  template:
    metadata:
      name: "{{ .name }}-build"
      namespace: argocd
      annotations:
        # After image-builder (25), so the shared Tasks + the EventListener exist.
        argocd.argoproj.io/sync-wave: "26"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: builds
      sources:
        # 0. Values-only source — makes $values/... resolvable for the chart source.
        - repoURL: &repo __PLATFORM_URL__
          targetRevision: &revision __REVISION__
          ref: values
        # 1. This same chart in UNIT mode: the registration's fields arrive as
        #    LITERALS via valuesObject — the attested record from master, never
        #    a webhook payload. The platform values reach the chart as global.*
        #    over the SAME $values chain every platform app loads.
        - repoURL: *repo
          targetRevision: *revision
          path: clusters/inventories/consumer-build
          helm:
            # Absent on an installation whose repositories stand on GitHub only.
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/clusters/platform/values-common.yaml
              - $values/clusters/platform/values-__STAGE__.yaml
              - values-common.yaml
              # __FQDN__ AND NOT THE LITERAL <fqdn>. The four tokens this file is
              # substituted through are __STAGE__, __REVISION__, __FQDN__ and __CLUSTER__; a <fqdn>
              # written here is a placeholder nothing replaces, so helm is handed a path
              # that is on no branch and every per-unit build Application fails to
              # render with "open .../clusters/active/<fqdn>.yaml: no such file or
              # directory". Its namespace is rendered by that same Application, so the
              # namespace never appears either, and an onboarding'''s provision-build-rbac
              # step then fails with a 404 naming a namespace nobody created.
              # __FQDN__ is global.domain, this cluster'''s fqdn, which names its map.
              # The forge this installation's repositories stand on (global.repositoryCredentials.forgejo), written by the
              # branch program, as clusters/argocd/files/platform-apps-appset.yaml loads it: a unit's render knows the Forgejo.
              - $values/installation/values/repository-credentials.yaml
              - $values/clusters/active/__FQDN__.yaml
            valuesObject:
              unit:
                name: "{{ .name }}"
                repoURL: "{{ .repoURL }}"
                # The npm scope the registration states (Forgejo units; hostyour-manager shared/consumer.ts
                # packageScope), empty for a unit that states none, whose scope is the owner of its repoURL.
                packageScope: '{{ dig "packageScope" "" . }}'
                buildsJson: "{{ .builds | toJson }}"
      destination:
        # THE CLUSTER, NEVER A SERVER URL — the same rule projects.yaml states. The `builds` project
        # allows `name: <cluster>`, and an Application answering with a server URL asks ArgoCD to
        # resolve one form against the other. It may; relying on it is a bet nobody has to take.
        name: __CLUSTER__
        namespace: "{{ .name }}-build"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        syncOptions:
          # The chart renders the Namespace itself (templates/namespace.yaml),
          # so the PSA level and the hostyour.cloud/build label stand before
          # any pod or SecretStore exists in it.
          - CreateNamespace=false
