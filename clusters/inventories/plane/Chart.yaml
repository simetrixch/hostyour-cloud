apiVersion: v2
name: plane
version: 1.0.0
description: |
  Plane, the platform's own project tracker, on the master in its own namespace.

  Its PostgreSQL, Redis, RabbitMQ and MinIO run beside it in the same namespace, so nothing beside
  it holds its data. Every page sits behind the identity provider's forward auth, and Plane's
  sign-in through Forgejo follows; only /api/v1, Plane's API-key API, is reached without it. The
  installation's own address and certificate issuer stand in installation/values/plane.yaml on
  the install branch.
type: application
dependencies:
  # Vendored as the folder charts/plane-ce, upstream plus the two-line patch in vendor/: plane-ce names its
  # two Jobs with the Helm release revision, which Argo CD renders as 1 every time, so a new Plane
  # version never got a new migration Job. The patch names them by the images they run.
  - name: plane-ce
    version: 1.8.5
  - name: external-secret
    version: 1.0.0
    repository: file://../../charts/external-secret
    alias: externalsecret-app-keys
  - name: external-secret
    version: 1.0.0
    repository: file://../../charts/external-secret
    alias: externalsecret-app-env
  - name: external-secret
    version: 1.0.0
    repository: file://../../charts/external-secret
    alias: externalsecret-pgdb
  - name: external-secret
    version: 1.0.0
    repository: file://../../charts/external-secret
    alias: externalsecret-rabbitmq
  - name: external-secret
    version: 1.0.0
    repository: file://../../charts/external-secret
    alias: externalsecret-doc-store
  - name: secret-store
    version: 1.0.0
    repository: file://../../charts/secret-store
  - name: common
    version: 1.0.0
    repository: file://../../charts/common
