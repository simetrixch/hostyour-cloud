{{- $issuer := "" }}
{{- if and .Values.global .Values.global.clusterIssuer }}
  {{- $issuer = .Values.global.clusterIssuer }}
{{- end }}
{{- if eq $issuer "platform-acme" }}
{{- $zones := list (required "global.platformDomain is a zone of the installation's own that platform-acme answers by DNS-01 (clusters/active/<fqdn>.yaml)" .Values.global.platformDomain) (required "global.unitApex is a zone of the installation's own that platform-acme answers by DNS-01 (clusters/active/<fqdn>.yaml)" .Values.global.unitApex) | uniq }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: platform-acme
spec:
  acme:
    email: {{ required "global.letsencryptEmail is the ACME contact of platform-acme" .Values.global.letsencryptEmail | quote }}
    # THE ONE ACCOUNT OF THE INSTALLATION (Google Trust Services). Every cluster signs with the one
    # key cert-manager-account delivers, so the first cluster registers the account with the External
    # Account Binding and every later one is answered with that same account. Never a key of its own:
    # a generated key would register a second account, and the binding admits only one.
    disableAccountKeyGeneration: true
    privateKeySecretRef:
      name: platform-acme-account
    externalAccountBinding:
      keyID: {{ required "global.acmeEabKeyId is the key id of the installation's one ACME account (clusters/active/<fqdn>.yaml); platform-acme has no form without it" .Values.global.acmeEabKeyId | quote }}
      keySecretRef:
        name: platform-acme-account
        key: eab-mac-key
    server: {{ required "global.letsencryptServer is the ACME directory platform-acme registers with" .Values.global.letsencryptServer | quote }}
    solvers:
      - http01:
          ingress:
            ingressClassName: public
            # The solver's own Service must be a ClusterIP, because a unit namespace admits no other
            # Service type; the challenge is answered over the ingress class, so nothing is lost.
            serviceType: ClusterIP
      # A NAME UNDER THE INSTALLATION'S OWN ZONES is answered by DNS-01, through the zone's DNS API,
      # so no challenge request has to reach the origin and no solver route stands beside the routes of
      # a host behind the edge. cert-manager picks the solver whose dnsZones match a name over the one
      # without a selector; every other name, a tenant's domain outside these zones among them, keeps
      # HTTP-01 above.
      - selector:
          dnsZones:
            {{- range $zones }}
            - {{ . | quote }}
            {{- end }}
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: platform-acme-cloudflare-dns
              key: api-token
{{- else if eq $issuer "platform-local" }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: platform-self-signed
  labels:
    hostyour.cloud/platform-authority: "true"
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: platform-ca
  namespace: cert-manager
  labels:
    hostyour.cloud/platform-authority: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # Never pruned, though its issuers are: the Secret it owns holds the authority's private key, and
    # a flip to platform-acme and back would otherwise mint a new authority that nothing trusts yet.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  isCA: true
  commonName: hostyour.cloud platform authority (this cluster only)
  secretName: platform-ca
  duration: 26280h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  issuerRef:
    name: platform-self-signed
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: platform-local
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  ca:
    secretName: platform-ca
{{- else }}
{{- fail (printf "global.clusterIssuer is %q: it must be platform-acme or platform-local" $issuer) }}
{{- end }}
