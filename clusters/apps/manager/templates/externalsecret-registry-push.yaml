{{- if and .Values.reaper.enabled .Values.master.sshUser .Values.github.repo }}
# The zot PUSH credential (push-user — which carries read+create+update+DELETE per clusters/apps/registry
# accessControl) as a dockerconfigjson for the registry-reaper (reaper-cronjob.yaml) to MOUNT and
# DELETE manifests with. Distinct from manager-registry-pull (the read-only pull cred the
# Deployment mounts for the ensure-images probe): a manifest DELETE needs the push identity, and a
# pull-only cred fails the reaper's first DELETE with HTTP 403.
#
# ESO assembles the dockerconfigjson from the two Vault properties push-user + push-password at
# secret/<env>/app/registry (the SAME entry image-builder's push step reads — the app-tier
# vault-backend SecretStore already present in THIS namespace reaches it, so NO new Vault surface is
# introduced). The auths key is common.registryHost, so it matches the reaper's REGISTRY_HOST. The
# `{{ "{{" }} ... {{ "}}" }}` braces below are ESO's OWN templating (engineVersion v2, evaluated
# in-cluster by ESO, NOT by Helm) — Helm passes them through verbatim via the backtick raw-string
# idiom the external-secret library chart documents.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-reaper-push
spec:
  # No periodic read of Vault — the platform-wide delivery rule, stated in full in
  # hostyour-cloud clusters/charts/external-secret/templates/externalsecret.yaml: a secret
  # arrives on DEPLOY (OnChange re-syncs when this CR changes) and on target-Secret
  # DELETION (OnChange creates it when absent), never on a timer. So putting a NEW
  # value in front of the pods is three acts: write it into Vault, delete the target
  # Secret so ESO fetches it, roll the pods (the restart-workloads run).
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: registry-reaper-push
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |-
          {"auths":{"{{ include "common.registryHost" . }}":{"username":"{{ `{{ .user }}` }}","password":"{{ `{{ .pass }}` }}","auth":"{{ `{{ printf "%s:%s" .user .pass | b64enc }}` }}"}}}
  data:
    - secretKey: user
      remoteRef:
        key: {{ printf "%s/app/registry" .Values.global.env }}
        property: push-user
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: pass
      remoteRef:
        key: {{ printf "%s/app/registry" .Values.global.env }}
        property: push-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
