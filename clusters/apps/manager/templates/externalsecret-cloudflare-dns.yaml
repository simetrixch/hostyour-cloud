# The DNS-only Cloudflare token from secret/<stage>/app/cloudflare-dns — the
# manager writes the one DNS record a unit gets at onboarding with it.
# Nothing but DNS is reachable with the token; it carries no account-level
# permission. Its OWN ExternalSecret, like the storage-box credential: a
# read failure here must never fail the sync of the manager's core auth
# secrets (OIDC / session). All four defaulted remoteRef fields are emitted
# explicitly (ESO 2.x defaults them).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: manager-cloudflare-dns
spec:
  # No periodic read of Vault — the platform-wide delivery rule, stated in full in
  # hostyour-cloud clusters/charts/external-secret/templates/externalsecret.yaml: a secret
  # arrives on DEPLOY (OnChange re-syncs when this CR changes) and on target-Secret
  # DELETION (OnChange creates it when absent), never on a timer. So putting a NEW
  # value in front of the pods is three acts: write it into Vault, delete the target
  # Secret so ESO fetches it, roll the pods (the restart-workloads run).
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: manager-cloudflare-dns
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: {{ printf "%s/app/cloudflare-dns" .Values.global.env }}
        property: api-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
