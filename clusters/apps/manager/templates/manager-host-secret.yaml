{{- if .Values.master.sshUser }}
{{- /*
Dedicated, tightly-scoped Vault surface for the master SSH-to-self key.

The manager's deploy-slave Run SSHes to the MASTER (this control host); the
private key is root on the master → all clusters, so it must NOT live under the broad
app/* tier that external-secrets-sa in EVERY app namespace can read. Instead it
gets its own isolated surface, all scoped to the `manager` namespace:

  * Vault path   secret/<env>/manager-host/ssh   (ssh-private-key + host-key-fp)
  * Vault policy manager-host                     (read ONLY that path)
  * Vault role   manager-host                     (bound to SA manager-host-eso
                                                       in ns manager ONLY)
      — both created when the cluster is seeded, and the key itself is
        written into that path with a clean `kv put`.
  * SA           manager-host-eso                 (dedicated; NOT external-secrets-sa)
  * SecretStore  vault-backend-manager            (authenticates with that role)
  * ExternalSecret manager-master-key             (materializes the K8s Secret)

boot/seed-master.ts reads the mounted private key + the host-key-fp env once and
seals/pins them; it degrades gracefully if the Secret is briefly absent (the pod
still starts — this surface is independent of the manager's core boot secret).
Rendered where the manager is the control host (master.sshUser set); the
GitHub ExternalSecret below is additionally gated on github.repo. Onboarding
kube access is NOT part of this surface: the manager talks to its own
cluster in-cluster via the pod ServiceAccount (grants shipped with this chart,
templates/rbac.yaml),
so no kubeconfig lives in Vault. The mount path / KV mount match the app
SecretStore: `secret` KV-v2, the cluster's own auth mount kubernetes-<name>
(global.vaultKubernetesAuthPath, installation/profile.yaml), Vault ns `vault`.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: manager-host-eso
  namespace: {{ .Release.Namespace }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend-manager
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    vault:
      server: {{ required "vaultUrl must be set (global.vaultUrl)" .Values.global.vaultUrl | quote }}
      path: "secret"
      version: "v2"
      namespace: "vault"
      auth:
        kubernetes:
          mountPath: {{ required "global.vaultKubernetesAuthPath must be set (installation/profile.yaml via the $values chain)" .Values.global.vaultKubernetesAuthPath | quote }}
          role: "manager-host"
          serviceAccountRef:
            # Local, DEDICATED SA — the namespaced SecretStore cannot cross namespaces,
            # and this SA (unlike external-secrets-sa) is bound ONLY to the tight
            # manager-host role, so nothing else can read the key path.
            name: "manager-host-eso"
{{- if .Values.master.sshUser }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: manager-master-key
spec:
  # No periodic read of Vault — the platform-wide delivery rule, stated in full in
  # hostyour-cloud clusters/charts/external-secret/templates/externalsecret.yaml: a secret
  # arrives on DEPLOY (OnChange re-syncs when this CR changes) and on target-Secret
  # DELETION (OnChange creates it when absent), never on a timer. So putting a NEW
  # value in front of the pods is three acts: write it into Vault, delete the target
  # Secret so ESO fetches it, roll the pods (the restart-workloads run).
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: vault-backend-manager
    kind: SecretStore
  target:
    name: manager-master-key
    creationPolicy: Owner
  data:
    - secretKey: ssh-private-key
      remoteRef:
        key: {{ printf "%s/manager-host/ssh" .Values.global.env }}
        property: ssh-private-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: host-key-fp
      remoteRef:
        key: {{ printf "%s/manager-host/ssh" .Values.global.env }}
        property: host-key-fp
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
{{- if and .Values.master.sshUser .Values.github.repo }}
---
# The manager's GitHub write PAT (Branches view + Reset wizard). Carries the
# write-capable GITOPS_REPO_PAT, placed on the isolated manager-host surface (same as
# the SSH self-key above) so the manager-host-eso SA can read it via the manager-host
# Vault policy (wildcard on secret/<env>/manager-host/*) — the manager cannot reach
# the system tier where ArgoCD's copy of the same token lives. It is seeded with the
# cluster at <env>/manager-host/github, property `write-pat`. The pod reads it
# as env GITHUB_WRITE_PAT. (GITOPS_REPO_PAT also reaches a slave when that slave
# is added; since it is now write-capable, a GitHub ruleset must protect `master`
# — see secrets.example.)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: manager-github
spec:
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: vault-backend-manager
    kind: SecretStore
  target:
    name: manager-github
    creationPolicy: Owner
  data:
    - secretKey: write-pat
      remoteRef:
        key: {{ printf "%s/manager-host/github" .Values.global.env }}
        property: write-pat
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
{{- end }}
