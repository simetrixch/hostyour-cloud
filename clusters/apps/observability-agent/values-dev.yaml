# DEV overrides for the observability push agent.

# Push credentials ExternalSecret — reads mount-relative Vault path
# dev/app/observability (mount = global.vaultKvMount, the shared `secret`), which is
# the entry the master's push middleware composes its htpasswd line from.
observability-agent-push-secret:
  externalSecret:
    vaultPath: dev/app/observability
