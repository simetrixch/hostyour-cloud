{{- /*
Image-pull dockerconfigjson for Zot, from the shared app-tier registry secret
secret/<stage>/app/registry (same source as clusters/apps/manager). Rendered as a
kubernetes.io/dockerconfigjson Secret that pipeline-sa lists under
imagePullSecrets — Tekton attaches the SA's pull secrets to every TaskRun
pod, so the gate step can pull the gate-runner image from the platform registry
without any pod-side credential handling.

NOTE: ESO's login from THIS namespace requires Vault's `external-secrets`
role to bind ns gate-runner — it stands on the cross-tier ESO consumer list the
cluster is seeded with (gate-runner reads app/registry like service-provisioner
does).
*/ -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gate-runner-registry-pull
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: gate-runner
spec:
  # No periodic read of Vault — the platform-wide delivery rule, stated in full in
  # hostyour-cloud clusters/charts/external-secret/templates/externalsecret.yaml: a secret
  # arrives on DEPLOY (OnChange re-syncs when this CR changes) and on target-Secret
  # DELETION (OnChange creates it when absent), never on a timer. So putting a NEW
  # value in front of the pods is three acts: write it into Vault, delete the target
  # Secret so ESO fetches it, roll the pods (the restart-workloads run).
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: {{ .Values.global.secretStoreName }}
    kind: SecretStore
  target:
    name: gate-runner-registry-pull
    creationPolicy: Owner
    # COMPOSED HERE FROM THE TWO ATOMIC VALUES, not read as a finished document. The store used to
    # be asked for `pull-dockerconfigjson`, which nothing ever wrote — so this Secret never
    # materialized and every pod that pulls an image from this installation waited on it. A store
    # holds values; a format belongs to whoever needs that format. Written the way the push
    # credential beside it already was.
    #
    # RAW ESO syntax in the inner braces: Helm renders this file, so the ESO expressions are quoted
    # through to be evaluated by ESO and not here.
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |-
          {"auths":{"{{ include "common.registryHost" . }}":{"username":"{{ `{{ .user }}` }}","password":"{{ `{{ .pass }}` }}","auth":"{{ `{{ printf "%s:%s" .user .pass | b64enc }}` }}"}}}
  data:
    - secretKey: user
      remoteRef:
        key: {{ printf "%s/app/registry" .Values.global.env }}
        property: pull-user
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: pass
      remoteRef:
        key: {{ printf "%s/app/registry" .Values.global.env }}
        property: pull-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
