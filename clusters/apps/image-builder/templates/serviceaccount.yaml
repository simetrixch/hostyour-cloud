# SA for the EventListener pod — carries the Tekton Triggers ClusterRole
# bindings (incl. namespace Secret read for interceptor secretRef). The
# PipelineRun pods run in the per-unit <unit>-build namespaces under their own
# pipeline-sa (clusters/apps/consumer-build) — no pipeline identity lives here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.pipeline.eventListenerServiceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: image-builder
    app.kubernetes.io/component: eventlistener-sa
