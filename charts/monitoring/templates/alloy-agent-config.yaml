{{- /*
Grafana Alloy configuration — SLAVE AGENT mode (D4b, apps/observability-agent).

Unlike the master's alloy-config.yaml (which only tails logs + receives OTLP,
because the master's kube-prometheus-stack does the scraping), this config makes
Alloy the WHOLE observability data plane of a slave that runs no Prometheus /
Loki / Grafana server:

  METRICS: discover the cluster's ServiceMonitors/PodMonitors (exactly what the
    per-app `monitoring:` keys declare), scrape kubelet/cAdvisor/node, then
    prometheus.remote_write to the MASTER's Prometheus.
  LOGS:    tail pod stdout (+ optional journald) and loki.write to the MASTER's
    Loki — same pipeline shape as alloy-config.yaml.

Both push paths carry basic_auth (creds materialized by ESO into the
`observability-agent-push-credentials` Secret) and an `external_labels.cluster`
tag = global.domain, so the master can slice metrics/logs per slave.

Endpoints + cluster label come from GLOBALS — which a values file cannot read but
a template can; this is why the agent config lives here as a templated ConfigMap
rather than under the alloy sub-chart's `configMap.content`.

Gated on .Values.alloyAgent.enabled (default false in values.yaml) so it renders
ONLY for apps/observability-agent — every other monitoring-chart consumer
(redis, mongodb, apps/observability, …) leaves it off and emits nothing here.

The alloy sub-chart references this ConfigMap via:
  alloy.configMap.create=false, alloy.configMap.name=alloy-config, key=config.alloy
*/ -}}
{{- if .Values.alloyAgent.enabled }}
{{- $endpoints := default dict .Values.global.endpoints }}
{{- $obs := default dict $endpoints.observability }}
{{- $promPush := printf "%s/api/v1/write" ($obs.prometheusPush | default "") }}
{{- $lokiPush := printf "%s/loki/api/v1/push" ($obs.lokiPush | default "") }}
{{- $cluster := .Values.global.domain }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: {{ .Release.Namespace }}
  labels:
    release: {{ .Values.prometheusReleaseLabel }}
data:
  config.alloy: |
    // ========================================================================
    // SLAVE observability agent — push metrics + logs to the master.
    // NO local Prometheus / Loki / Grafana: everything is remote_write /
    // loki.write to the master (global.endpoints.observability.*).
    // ========================================================================

    // Basic-auth push credentials, materialized by ESO from the master's
    // per-slave Vault mount (<mount>/<stage>/app/observability-agent/*).
    remote.kubernetes.secret "push_creds" {
      namespace = "{{ .Release.Namespace }}"
      name      = "observability-agent-push-credentials"
    }

    // ========================================================================
    // METRICS
    // ========================================================================

    // remote_write → master Prometheus (enableRemoteWriteReceiver, master side I6).
    prometheus.remote_write "default" {
      external_labels = {
        cluster = "{{ $cluster }}",
      }
      endpoint {
        url = "{{ $promPush }}"
        basic_auth {
          username = nonsensitive(remote.kubernetes.secret.push_creds.data["username"])
          password = remote.kubernetes.secret.push_creds.data["password"]
        }
      }
    }

    // Discover + scrape every ServiceMonitor in the cluster (all namespaces) —
    // exactly the CRs each app's `monitoring:` key declares via charts/monitoring,
    // the same targets the master's Prometheus scrapes on a full cluster. Also
    // covers kube-state-metrics (its own ServiceMonitor, enabled in the app values).
    prometheus.operator.servicemonitors "app" {
      forward_to = [prometheus.remote_write.default.receiver]
    }

    // Same for PodMonitors (Traefik, ArgoCD, … — pod-only metrics ports).
    prometheus.operator.podmonitors "app" {
      forward_to = [prometheus.remote_write.default.receiver]
    }

    // --- Node discovery (one target per node → that node's kubelet :10250) ---
    discovery.kubernetes "nodes" {
      role = "node"
    }

    // kubelet /metrics — scraped directly on the node, authorized by the SA's
    // nodes/metrics RBAC (granted by the alloy chart's default clusterRules).
    discovery.relabel "kubelet" {
      targets = discovery.kubernetes.nodes.targets
      rule {
        target_label = "__metrics_path__"
        replacement  = "/metrics"
      }
    }
    prometheus.scrape "kubelet" {
      targets           = discovery.relabel.kubelet.output
      forward_to        = [prometheus.remote_write.default.receiver]
      job_name          = "kubelet"
      scheme            = "https"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tls_config {
        ca_file              = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        insecure_skip_verify = true
      }
    }

    // cAdvisor container metrics (/metrics/cadvisor on the same kubelet).
    discovery.relabel "cadvisor" {
      targets = discovery.kubernetes.nodes.targets
      rule {
        target_label = "__metrics_path__"
        replacement  = "/metrics/cadvisor"
      }
    }
    prometheus.scrape "cadvisor" {
      targets           = discovery.relabel.cadvisor.output
      forward_to        = [prometheus.remote_write.default.receiver]
      job_name          = "cadvisor"
      scheme            = "https"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tls_config {
        ca_file              = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        insecure_skip_verify = true
      }
    }

    // node_* metrics (node-exporter equivalent, in-process). Replaces
    // kube-prometheus-stack's node-exporter DaemonSet on the slave. Needs host
    // /, /proc, /sys mounted — see apps/observability-agent/values-common.yaml
    // (alloy.controller.volumes + alloy.mounts).
    prometheus.exporter.unix "node" {
      rootfs_path = "/host/root"
      procfs_path = "/host/proc"
      sysfs_path  = "/host/sys"
    }
    prometheus.scrape "node" {
      targets    = prometheus.exporter.unix.node.targets
      forward_to = [prometheus.remote_write.default.receiver]
      job_name   = "node-exporter"
    }

    // ========================================================================
    // LOGS  (mirrors apps/observability's Alloy loki pipeline)
    // ========================================================================

    loki.write "default" {
      external_labels = {
        cluster = "{{ $cluster }}",
      }
      endpoint {
        url = "{{ $lokiPush }}"
        basic_auth {
          username = nonsensitive(remote.kubernetes.secret.push_creds.data["username"])
          password = remote.kubernetes.secret.push_creds.data["password"]
        }
      }
    }

    // --- Discovery: all pods on the node ---
    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label  = "app"
      }
      // service_name — Grafana Drilldown Logs groups by this; use namespace as
      // the service boundary (same rationale as the master's alloy-config.yaml).
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "service_name"
      }
    }

    // --- Tail logs from pod stdout/stderr ---
    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pod_logs.output
      forward_to = [loki.process.app_json.receiver]
    }

    // --- Parse Pino/JSON logs, extract labels ---
    loki.process "app_json" {
      forward_to = [loki.write.default.receiver]

      stage.json {
        expressions = {
          level     = "level",
          msg       = "msg",
          req_id    = "requestId",
          source    = "source",
          log_type  = "type",
          trace_id  = "trace_id",
          span_id   = "span_id",
        }
      }

      // Pino numeric levels (30=info, 40=warn, 50=error) → string label.
      stage.template {
        source   = "level_label"
        template = `{{`{{- if eq .level "30" -}}info{{- else if eq .level "40" -}}warn{{- else if eq .level "50" -}}error{{- else if eq .level "60" -}}fatal{{- else if eq .level "20" -}}debug{{- else -}}{{ .level }}{{- end -}}`}}`
      }

      stage.labels {
        values = {
          level  = "level_label",
          source = "",
        }
      }

      stage.structured_metadata {
        values = {
          requestId = "req_id",
          logType   = "log_type",
          traceId   = "trace_id",
          spanId    = "span_id",
        }
      }
    }

    {{- if .Values.alloyAgent.journaldEnabled }}

    // --- Host journald (systemd units) → Loki, job="journald" ---
    // Requires persistent journald (/var/log/journal) + host mounts (varlog +
    // /etc/machine-id) in apps/observability-agent/values-common.yaml.
    loki.source.journal "host" {
      max_age       = "12h"
      path          = "/var/log/journal"
      forward_to    = [loki.write.default.receiver]
      labels        = { job = "journald" }
      relabel_rules = discovery.relabel.journal.rules
    }

    discovery.relabel "journal" {
      targets = []
      rule {
        source_labels = ["__journal__systemd_unit"]
        target_label  = "unit"
      }
      rule {
        source_labels = ["__journal__hostname"]
        target_label  = "node"
      }
      rule {
        source_labels = ["__journal_priority_keyword"]
        target_label  = "level"
      }
    }
    {{- end }}
{{- end }}
