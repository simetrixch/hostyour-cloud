image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

replicas: 1

containerPort: 8080

command: []
args: []

env: []

serviceAccountName: ""

volumeMounts: []
volumes: []

podSecurityContext: {}
containerSecurityContext: {}

livenessProbe: {}
readinessProbe: {}

# Optional container lifecycle hooks (postStart/preStop). Empty = none.
lifecycle: {}

resources: {}

imagePullSecrets: []

terminationGracePeriodSeconds: 30

# Rollout strategy. Empty `{}` uses the K8s default (RollingUpdate with
# maxSurge=25% / maxUnavailable=25%). Set to `{ type: Recreate }` for
# workloads with a ReadWriteOnce PVC where two pods can't coexist (e.g.
# apps that hold an exclusive boltdb / SQLite file lock).
strategy: {}

# Resource-level metadata.annotations on the DEPLOYMENT object itself — NOT the
# pod template (that is `podAnnotations`, which annotates spec.template). Use
# case: annotations a controller reads off the workload resource, such as an
# ArgoCD sync-wave (argocd.argoproj.io/sync-wave). Default empty = no annotations
# block rendered, so any app that sets nothing renders byte-identically. Same
# guarded {{- with }} idiom charts/pvc uses for pvc.annotations.
annotations: {}

service:
  enabled: true
  type: ClusterIP
  port: 8080
  # Optional metadata.annotations on the Service resource (e.g. an ArgoCD
  # sync-wave). Default empty = no annotations block emitted (byte-identical for
  # apps that set nothing). Same guarded idiom as charts/pvc's pvc.annotations.
  annotations: {}
