# Toggle for 'manager' (the standalone manager product, in-cluster) on
# THIS cluster. BUILD-PLANE-ONLY: it deploys only where the
# registry runs locally (the build plane). master default "false" (off
# everywhere); the build plane's install branch flips this to "true". Same
# centralized-app pattern as tekton/registry/image-builder.
#
# The name is what the ApplicationSet's merge generator matches on, and it is
# also the chart directory (`path: "apps/{{ .name }}"`) — so it is apps/manager
# and not the AppProject or the namespace, both of which are still 'controller'.
name: manager
deploy: "false"
