# ApplicationSet — generates one ArgoCD Application per app for the DEV cluster.
# Replaces the per-app Application files that used to live in this directory.
# RepoURL and targetRevision live HERE (one place), no longer duplicated per app.
#
# Bootstrap: argocd/dev/root-app.yaml syncs this directory; ArgoCD creates the
# ApplicationSet; the applicationset-controller materializes one Application
# per element in `generators[0].list.elements`.
#
# To add a new app: append an entry to `generators[0].list.elements` below.
# To change the repo / branch globally for this env: edit the two literals in
# the `sources:` template once. All generated Applications follow.
#
# Per-app conditional fields (syncPolicy.syncOptions extras, ignoreDifferences)
# live in `templatePatch:` further down. That field is a YAML string, so the
# linter doesn't try to parse the Go template directives inside it.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-apps-dev
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error

  generators:
    # SELECTIVE PER-CLUSTER DEPLOY (toggle). The `list` below is the full CATALOG.
    # A branch-local cluster/apps/<name>.yaml carrying `deploy: "false"` is merged
    # by name and drops that app via the selector; `deploy: "true"` (re)enables it.
    # master ships every app at "true"; edit on the install branch. The git files
    # generator reads the tailnet from THIS branch (set-domain stamps `revision:`
    # to the install branch, like targetRevision below).
    - merge:
        mergeKeys:
          - name
        generators:
          - list:
              elements:
                # Wave 0 — deploy-state: the hostyour-deploy-state marker
                # ConfigMap in kube-system (domain/stage/role/generation/
                # writtenAt). The Controller's onboarding preflight reads it and
                # FAILS CLOSED when it is missing or its domain mismatches the
                # cluster — so it must exist on EVERY cluster and self-heal
                # after a wipe. Always-on: deliberately NO cluster/apps toggle,
                # and NOT folded into coredns (set-role toggles coredns with the
                # build plane; deploy-state must stay ON everywhere).
                - name: deploy-state
                  project: core
                  syncWave: "0"
                  namespace: kube-system
                  prune: "true"
                  createNamespace: "false"
                  specialOptions: ""

                # Wave 0 — vault-rbac: ClusterRole + ClusterRoleBinding
                # vault-namespace-reader (get/list namespaces → vault:vault).
                # Vault evaluates its LABEL-bound ESO roles by GETting the
                # calling SA's Namespace; under enforced RBAC that read 403s
                # without this grant and every consumer login fails. GitOps-
                # owned here (wipe-safe) — the imperative MASTER copy was
                # removed from base/lib/seed-vault.sh. Cluster-scoped objects
                # only; destination ns kube-system is a formality (already
                # whitelisted for `core`). On slaves the objects are identical-
                # content (ClusterRole, also created by lib/slave.sh for the
                # reviewer SA) or inert (CRB subject vault:vault absent), so
                # there is no ArgoCD/imperative fight.
                - name: vault-rbac
                  project: core
                  syncWave: "0"
                  namespace: kube-system
                  prune: "true"
                  createNamespace: "false"
                  specialOptions: ""

                # Wave 1 — External-Secrets-Operator (controller + the 2 CRDs we
                # actually use). One Application per cluster — dev/test/prod each
                # run on their own cluster. Sync wave 1 so it lands before
                # workload apps at wave 10+ that create SecretStore /
                # ExternalSecret CRs. Visible in ArgoCD next to the workload apps.
                #
                # specialOptions=external-secrets activates ServerSideApply=true in
                # templatePatch below — the bundled SecretStore CRD's OpenAPI
                # schema is ~580 KB which exceeds the 262 KB
                # last-applied-configuration annotation limit on client-side apply.
                - name: external-secrets
                  project: core
                  syncWave: "1"
                  namespace: external-secrets
                  prune: "true"
                  createNamespace: "true"
                  specialOptions: "external-secrets"

                # NOTE: The platform Identity Provider (Authentik) is INFRASTRUCTURE-
                # tier, not GitOps. It lives at bootstrap/idp/ and
                # is installed by the bootstrap script before ArgoCD reconciles this
                # ApplicationSet — see base/lib/deploy-idp.sh. Reason:
                # ArgoCD itself authenticates via the IdP, so it can't be managed BY
                # ArgoCD (chicken-and-egg). No `login`/`idp` entry here.

                # Wave 3 — Tekton operator + CRDs. Must exist before image-builder
                # (wave 25) creates Pipelines / Tasks / EventListeners.
                - name: tekton
                  project: cicd
                  syncWave: "3"
                  namespace: tekton
                  prune: "true"
                  createNamespace: "true"
                  specialOptions: ""

                # Wave 5 — DNS must resolve before any ESO/SecretStore tries Vault.
                - name: coredns
                  project: core
                  syncWave: "5"
                  namespace: kube-system
                  prune: "false"
                  createNamespace: "false"
                  specialOptions: ""

                # Wave 7 — Zot OCI registry (build plane). In every stage's catalog
                # now (symmetric); deployed on exactly ONE build cluster, gated by
                # cluster/apps/registry.yaml (master default deploy:"false"). Every
                # other cluster PULLS from it via global.endpoints.registry.host.
                # Must be Ready before any wave-10+ workload that pulls a private image.
                - name: registry
                  project: cicd
                  syncWave: "7"
                  namespace: registry
                  prune: "true"
                  createNamespace: "true"
                  specialOptions: ""

                # Wave 10 — Core data stores. Independent peers.
                - name: mongodb
                  project: data
                  syncWave: "10"
                  namespace: mongodb
                  prune: "true"
                  createNamespace: "true"
                  specialOptions: ""

                # Wave 20 — Adjacent platform services.
                - name: postfix
                  project: services
                  syncWave: "20"
                  namespace: postfix
                  prune: "true"
                  createNamespace: "true"
                  specialOptions: ""

                - name: redis
                  project: data
                  syncWave: "20"
                  namespace: redis
                  prune: "true"
                  createNamespace: "true"
                  specialOptions: ""

                # Wave 25 — image-build pipeline. Runs after wave-20 services
                # (postfix / redis) so the build pipeline has email + in-cluster
                # logging (Loki via Alloy); before wave-30 UIs that may consume newly-
                # built images.
                - name: image-builder
                  project: cicd
                  syncWave: "25"
                  namespace: image-builder
                  prune: "true"
                  createNamespace: "true"
                  specialOptions: ""

                # Wave 26 — the build fan-out (apps/consumer-build in catalog
                # mode): ONE ApplicationSet over registrations/*/build.yaml,
                # one Application <unit>-build per registered unit (project
                # `builds`). Rides in ns argocd (the ApplicationSet CR and the
                # generated Applications live there); build-cluster only.
                - name: consumer-build
                  project: cicd
                  syncWave: "26"
                  namespace: argocd
                  prune: "true"
                  createNamespace: "false"
                  specialOptions: ""

                # Wave 27 — gate-runner: the onboarding gates as
                # in-cluster Tekton PipelineRuns in the egress-fenced
                # `gate-runner` namespace (replaces the host-podman Quadlet
                # gate-runner). After image-builder (25) — the gate-run
                # Pipeline references its shared git-clone Task via the
                # cluster resolver — and before the Controller (40), which
                # dispatches the runs. PROVIDER-ONLY like the build plane:
                # cluster/apps/gate-runner.yaml is master-default "false";
                # only the control host's install branch flips it "true".
                - name: gate-runner
                  project: cicd
                  syncWave: "27"
                  namespace: gate-runner
                  prune: "true"
                  createNamespace: "true"
                  specialOptions: ""

                # Wave 30 — UIs + observability stack.
                - name: dbgate
                  project: services
                  syncWave: "30"
                  namespace: dbgate
                  prune: "true"
                  createNamespace: "true"
                  specialOptions: ""

                # observability triggers extra patch (ignoreDifferences + ServerSideApply)
                # in templatePatch below.
                - name: observability
                  project: observability
                  syncWave: "30"
                  namespace: observability
                  prune: "true"
                  createNamespace: "true"
                  specialOptions: "observability"

                # Wave 30 — SLAVE observability PUSH agent (D4b). The slave-side
                # alternative to 'observability' above: a slave runs THIS (Alloy
                # push + kube-state-metrics + the 3 monitoring CRDs) and pushes
                # metrics/logs to the master; a full/master cluster runs
                # 'observability' instead. master-default OFF
                # (cluster/apps/observability-agent.yaml deploy:"false");
                # set-role.sh flips it on wherever the role lacks the master
                # part. SAME project + namespace as
                # 'observability' — they never coexist on one cluster — so the
                # observability AppProject's destination + whitelists already cover it.
                - name: observability-agent
                  project: observability
                  syncWave: "30"
                  namespace: observability
                  prune: "true"
                  createNamespace: "true"
                  specialOptions: ""

                # Wave 16 — generic ServiceClaim-driven credential provisioner
                # (mongodb/postgresql/registry). After the data stores
                # (wave 10) whose admin creds it reads; before consumers (wave 50)
                # that create ServiceClaims. Ships the serviceclaims CRD.
                - name: service-provisioner
                  project: core
                  syncWave: "16"
                  namespace: service-provisioner
                  prune: "true"
                  createNamespace: "true"
                  specialOptions: ""

                # Wave 40 — the Controller (standalone product, in-cluster app).
                # Installs LAST, "on top" of the platform. PROVIDER-ONLY like the
                # build plane: cluster/apps/manager.yaml is master-default
                # "false"; only the control host's install branch flips it "true".
                - name: manager
                  project: controller
                  syncWave: "40"
                  namespace: controller
                  prune: "true"
                  createNamespace: "true"
                  specialOptions: ""

                # Wave 42 — tailnet-coordinator: the self-hosted coordination
                # server (headscale) of the private tailnet the platform's
                # hosts join. The tailnet CLIENT is installed and enabled on
                # every host by base/lib/install-tools.sh; this is the control
                # plane it logs in to, in place of the hosted one. Provided
                # ONCE, on the cluster with the master part, like Vault:
                # cluster/apps/tailnet-coordinator.yaml is master-default
                # "false" and set-role.sh flips it "true" there. Its public
                # address is global.tailnetUrl (cluster/profile.yaml) — public
                # on purpose, because a host that has not joined yet has no
                # other path to it. A host joins from its own setup.sh run and
                # not through ArgoCD, so nothing in this catalog waits on the
                # coordinator; the wave only keeps it inside the platform band,
                # below the per-slave ArgoCD instances generated at 45
                # (argocd/<stage>/apps/slaves-appset.yaml). Those dial their
                # slaves on the cluster map's apiHost/apiPort, which is STATED
                # when the slave is installed — before the host has joined
                # anything — and never looked up from the coordinator. So a
                # slave's map may name its tailnet address, its LAN address or
                # its public one, and this app's presence says nothing about
                # which.
                - name: tailnet-coordinator
                  project: services
                  syncWave: "42"
                  namespace: tailnet-coordinator
                  prune: "true"
                  createNamespace: "true"
                  specialOptions: ""
          - git:
              repoURL: https://github.com/simetrixch/hostyour-cloud.git
              revision: master
              files:
                - path: "cluster/apps/*.yaml"
      selector:
        matchExpressions:
          - key: deploy
            operator: NotIn
            values:
              - "false"

  template:
    metadata:
      name: "{{ .name }}-dev"
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "{{ .syncWave }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: "{{ .project }}"
      sources:
        # Values-only source: makes `$values/...` resolvable inside the chart
        # source's helm.valueFiles list below. The `&repo` / `&branch` YAML
        # anchors let the chart source below reuse the same literal — one
        # source of truth per env, no duplication.
        - repoURL: &repo "https://github.com/simetrixch/hostyour-cloud.git"
          targetRevision: &branch master
          ref: values
        # Chart source — references the anchors above.
        - repoURL: *repo
          targetRevision: *branch
          path: "apps/{{ .name }}"
          helm:
            valueFiles:
              - $values/platform/values-common.yaml
              - $values/platform/values-dev.yaml
              - values-common.yaml
              - values-dev.yaml
              # This installation's values FOR THIS APP — the keys that name one machine or one
              # installation and therefore cannot stand in the app's own files, which the trunk
              # ships to every installation. cluster/profile.yaml below carries global.* and would
              # hand a per-app block to every app, so an app-scoped file is the only place these
              # fit. Absent for every app that has none.
              - $values/cluster/values/{{ .name }}.yaml
              - $values/cluster/profile.yaml   # per-cluster overrides (global.* only) — highest precedence
            # Only the per-app file above may be missing, and for most apps it is.
            ignoreMissingValueFiles: true
      destination:
        server: "https://kubernetes.default.svc"
        namespace: "{{ .namespace }}"

  # All per-app conditional logic lives here, inside a YAML block scalar (|).
  # The linter doesn't parse Go template directives inside string values, so
  # this stays free of "Implicit map key" / "Block collection in flow"
  # warnings. ArgoCD's applicationset-controller renders this and strategic-
  # merges the result onto the template above.
  templatePatch: |
    spec:
      syncPolicy:
        automated:
          prune: {{ .prune }}
          selfHeal: true
        # Same retry/backoff as root-app.yaml. Sync waves only order
        # CREATION — they don't gate on dependency readiness — so a cold
        # bootstrap can race (e.g. ExternalSecrets before the ESO CRDs
        # land). With retry a failed first sync converges on its own
        # instead of waiting for the next selfHeal cycle.
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        # Label every platform workload namespace so the per-slave Vault
        # external-secrets role can bind by LABEL (dynamic) instead of a
        # hardcoded namespace list (base/lib/slave.sh). Same as prod/test.
        managedNamespaceMetadata:
          labels:
            hostyour.cloud/workload: "true"
        syncOptions:
          - CreateNamespace={{ .createNamespace }}
          {{- if eq .specialOptions "observability" }}
          - ServerSideApply=true
          {{- end }}
          {{- if eq .specialOptions "external-secrets" }}
          - ServerSideApply=true
          {{- end }}
      {{- if eq .specialOptions "observability" }}
      ignoreDifferences:
        - group: apps
          kind: StatefulSet
          jsonPointers:
            - /spec/volumeClaimTemplates
        - group: apps
          kind: Deployment
          jqPathExpressions:
            - '.spec.template.spec.containers[]?.env[]?.valueFrom.resourceFieldRef.divisor'
      {{- end }}
