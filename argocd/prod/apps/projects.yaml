# ArgoCD AppProjects for the PROD cluster. See argocd/dev/apps/projects.yaml
# for the full rationale. The build plane is centralized on ONE build cluster;
# the `cicd` project is defined in every stage's catalog and stays empty unless
# cluster/apps enables the build apps (tekton / registry / image-builder).
#
# Applied by root-app.yaml's directory sync (this file sits next to
# applicationset.yaml). sync-wave -1 makes the projects exist before the
# generated Applications reference them. The root-app stays in `default`.
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: core
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Cluster foundation — External-Secrets operator + CoreDNS. Privileged (CRDs, kube-system).
  sourceRepos:
    - https://github.com/simetrixch/hostyour-cloud.git
    - oci://ghcr.io/external-secrets/charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: external-secrets
    - server: https://kubernetes.default.svc
      namespace: kube-system
    # service-provisioner controller's own namespace.
    - server: https://kubernetes.default.svc
      namespace: service-provisioner
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: data
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Stateful data stores — MongoDB and Redis. Namespaced only; never creates cluster-scoped resources.
  sourceRepos:
    - https://github.com/simetrixch/hostyour-cloud.git
    - https://prometheus-community.github.io/helm-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: mongodb
    - server: https://kubernetes.default.svc
      namespace: redis
  # Namespace is the ONE permitted cluster-scoped kind — required by
  # CreateNamespace=true when the namespace does not exist yet.
  # See argocd/dev/apps/projects.yaml for the full rationale.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: services
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Supporting platform services — Postfix, DBGate, the tailnet coordinator. Namespaced only. (The Controller moved to its OWN dedicated `controller` project — it ships cross-namespace + cluster-scoped onboarding RBAC that this restricted project must not permit.)
  sourceRepos:
    - https://github.com/simetrixch/hostyour-cloud.git
    - https://bokysan.github.io/docker-postfix/
  destinations:
    - server: https://kubernetes.default.svc
      namespace: postfix
    - server: https://kubernetes.default.svc
      namespace: dbgate
    - server: https://kubernetes.default.svc
      namespace: tailnet-coordinator
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Monitoring plane — kube-prometheus-stack, Loki, Tempo, Alloy, Grafana. Cluster-wide scraper.
  sourceRepos:
    - https://github.com/simetrixch/hostyour-cloud.git
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://grafana-community.github.io/helm-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: observability
    # kube-prometheus-stack places its CoreDNS + kubelet scrape-target
    # Services in kube-system (observability-coredns / observability-kubelet).
    - server: https://kubernetes.default.svc
      namespace: kube-system
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cicd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Build plane — Tekton, Zot registry, image-builder, gate-runner. Centralized on ONE build cluster (promote test->prod reuses the same image); off unless cluster/apps enables it. Privileged (Tekton CRDs, buildah).
  sourceRepos:
    - https://github.com/simetrixch/hostyour-cloud.git
  # cicd destinations are GENERATED by set-role.sh from its CICD_DEST_NS array —
  # the single source of truth, so a NEW build-plane component's namespace is
  # added there ONCE, not by hand in three per-stage files. The set follows the
  # build-plane apps: each in its own namespace (registry, tekton,
  # image-builder); tekton's vendored manifests add tekton-resolvers;
  # gate-runner runs its gate PipelineRuns here. Do not hand-edit between the
  # markers.
  destinations:
    # set-role:cicd-dest-begin
    - server: https://kubernetes.default.svc
      namespace: tekton
    - server: https://kubernetes.default.svc
      namespace: tekton-resolvers
    - server: https://kubernetes.default.svc
      namespace: registry
    - server: https://kubernetes.default.svc
      namespace: image-builder
    - server: https://kubernetes.default.svc
      namespace: gate-runner
    - server: https://kubernetes.default.svc
      namespace: argocd
    # set-role:cicd-dest-end
  clusterResourceWhitelist:
    # Tekton's release manifests create the Namespace objects themselves.
    - group: ""
      kind: Namespace
    # Tekton Triggers ships its core interceptors as cluster-scoped CRs.
    - group: triggers.tekton.dev
      kind: ClusterInterceptor
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    # PipelineRun admission guard (apps/image-builder/templates/
    # vap-pipelinerun-guard.yaml) — both cluster-scoped kinds.
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicy
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicyBinding
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: builds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "Per-unit build namespaces (apps/consumer-build in unit mode): namespace <unit>-build + SecretStore + the <unit>-release Pipeline + credentials + NetworkPolicy. One glob destination — the fan-out creates units dynamically, and a glob needs no set-role markers (it is cluster-independent). The Application carrying the fan-out ApplicationSet itself runs in `cicd`."
  sourceRepos:
    - https://github.com/simetrixch/hostyour-cloud.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: '*-build'
  clusterResourceWhitelist:
    # The chart renders each unit's Namespace itself (CreateNamespace=false),
    # so the PSA level and the hostyour.cloud/build label stand up front.
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "hostyour-cloud Controller, dedicated tight project. Ships its OWN onboarding RBAC with the workload (Model A): cross-namespace Roles in gate-runner/kube-system + cluster-scoped roles for the dynamic namespaces (smoke, argocd onboarding, reapers). Whitelists = what the chart renders."
  sourceRepos:
    - https://github.com/simetrixch/hostyour-cloud.git
  destinations:
    # The Controller's own namespace: Deployment/Service/ServiceAccount, local
    # configmap-reader Role/RoleBinding, ESO ExternalSecrets + SecretStore, the
    # DATA_DIR PVC, the ingress, and (on the build cluster) the registry-reaper.
    - server: https://kubernetes.default.svc
      namespace: controller
    # Cross-namespace onboarding grants (Role + RoleBinding only in each):
    #   gate-runner   — gate-run PipelineRun dispatch + report;
    #   kube-system   — the hostyour-deploy-state ConfigMap reader.
    # The Applications read and the Controller-owned AppProjects are NOT here: that
    # grant is cluster-scoped (rbac.yaml, "Cluster scope (was ns argocd)"), so it is
    # a ClusterRole + ClusterRoleBinding, which ArgoCD validates against
    # clusterResourceWhitelist below and never against a destination.
    - server: https://kubernetes.default.svc
      namespace: gate-runner
    - server: https://kubernetes.default.svc
      namespace: kube-system
  clusterResourceWhitelist:
    # createNamespace=true on the controller Application: ArgoCD validates the
    # auto-created `controller` Namespace against this list on a fresh cluster.
    - group: ""
      kind: Namespace
    # The smoke ClusterRole + its binding — read-only smoke over DYNAMIC consumer
    # namespaces (the one grant that cannot be namespaced).
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  # Broad namespaced whitelist ('*/*'), matching the core/data/services/observability
  # sibling projects. ArgoCD's resource TREE only DISPLAYS kinds the project allows, so
  # the previous curated list hid the running Pods/ReplicaSets from the UI. The controller
  # is platform-trusted (its chart is authored in THIS repo, like its siblings), so '*/*'
  # is consistent and makes the live tree fully visible. Cluster-scoped kinds stay tightly
  # whitelisted above.
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

# ---------------------------------------------------------------------------
# Slaves (D5) — one AppProject PER SLAVE, named `<name>` (e.g. s1,
# the first DNS label of the slave's FQDN). Deliberately NOT defined in this
# file:
#
#   - master (the git trunk) must stay generic — a per-slave AppProject would
#     hardcode a slave name here (the same rule that keeps the slaves-appset's
#     selector unstamped on the trunk, where it matches no cluster map).
#   - it cannot ride in the apps/slave chart either: the generated Application
#     `<name>-apps` (slaves-appset.yaml) references project `<name>`, and an
#     Application whose project does not exist can never START its first sync
#     — a chart-carried AppProject would never get applied (chicken-and-egg).
#
# So each slave's project is created imperatively on the master by
# `setup.sh --slave-add` (I8) — the same pre-GitOps per-slave surface as the
# Vault mounts — and deleted by `--slave-remove`. The documented onboarding
# order (--slave-add FIRST, pointer file SECOND) guarantees the project exists
# before the ApplicationSet generates the Application that references it.
#
# Shape (_slave_appproject_manifest, base/lib/slave.sh): sourceRepos = the
# monorepo + the one upstream chart repo the slave chart pulls (argo-helm);
# destination pinned to EXACTLY ns <name> on this cluster (tighter
# than any shared project could be); cluster-scoped kinds: Namespace only
# (CreateNamespace=true). Labeled hostyour.cloud/slave=true so --slave-add
# refuses a name collision with a platform project and --slave-remove only
# ever deletes its own. Being imperative (untracked), the root-app's prune
# never touches these projects.
# ---------------------------------------------------------------------------
