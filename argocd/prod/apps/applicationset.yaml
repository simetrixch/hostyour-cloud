# ApplicationSet — generates one ArgoCD Application per app for the PROD cluster.
# Replaces the per-app Application files that used to live in this directory.
# RepoURL and targetRevision live HERE (one place), no longer duplicated per app.
#
# Bootstrap: argocd/prod/root-app.yaml syncs this directory; ArgoCD creates the
# ApplicationSet; the applicationset-controller materializes one Application
# per element in `generators[0].list.elements`.
#
# To add a new app: append an entry to `generators[0].list.elements` below.
# To change the repo / branch globally for this env: edit the two literals in
# the `sources:` template once. All generated Applications follow.
#
# Per-app conditional fields (syncPolicy.syncOptions extras, ignoreDifferences)
# live in `templatePatch:` further down. That field is a YAML string, so the
# linter doesn't try to parse the Go template directives inside it.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-apps-prod
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error

  generators:
    # SELECTIVE PER-CLUSTER DEPLOY (toggle). The `list` below is the full CATALOG.
    # A branch-local cluster/apps/<name>.yaml carrying `deploy: "false"` is merged
    # by name and drops that app via the selector; `deploy: "true"` (re)enables it.
    # master ships every app at "true"; edit on the install branch. The git files
    # generator reads the tailnet from THIS branch (set-domain stamps `revision:`
    # to the install branch, like targetRevision below).
    - merge:
        mergeKeys:
          - name
        generators:
          - list:
              elements:
                # Wave 0 — deploy-state: hostyour-deploy-state marker ConfigMap
                # in kube-system. The Controller's onboarding preflight fails
                # closed without it — always-on on EVERY cluster (no cluster/apps
                # toggle; not folded into coredns, which set-role toggles with
                # the build plane).
                - name: deploy-state
                  project: core
                  syncWave: "0"
                  namespace: kube-system
                  prune: "true"
                  createNamespace: "false"
                  specialOptions: ""

                # Wave 0 — vault-rbac: ClusterRole+Binding vault-namespace-reader
                # (get/list namespaces → vault:vault) for Vault's LABEL-bound ESO
                # roles under enforced RBAC. GitOps-owned (wipe-safe); replaces
                # the imperative MASTER block in base/lib/seed-vault.sh.
                # Cluster-scoped only; destination ns kube-system is a formality.
                - name: vault-rbac
                  project: core
                  syncWave: "0"
                  namespace: kube-system
                  prune: "true"
                  createNamespace: "false"
                  specialOptions: ""

                # Wave 1 — ESO controller + the 2 CRDs we use (ExternalSecret +
                # SecretStore). One Application per cluster. specialOptions=
                # external-secrets activates ServerSideApply=true in templatePatch
                # below — the bundled SecretStore CRD's OpenAPI schema exceeds
                # the 262 KB last-applied-configuration annotation limit.
                - name: external-secrets
                  project: core
                  syncWave: "1"
                  namespace: external-secrets
                  prune: "true"
                  createNamespace: "true"
                  specialOptions: "external-secrets"

                # Wave 3 — Tekton (build plane). Centralized: only the ONE build
                # cluster enables tekton/registry/image-builder (cluster/apps —
                # master default deploy:"false").
                - name: tekton
                  project: cicd
                  syncWave: "3"
                  namespace: tekton
                  prune: "true"
                  createNamespace: "true"
                  specialOptions: ""

                - name: coredns
                  project: core
                  syncWave: "5"
                  namespace: kube-system
                  prune: "false"
                  createNamespace: "false"
                  specialOptions: ""

                # Wave 7 — Zot registry (build plane). Centralized; every other
                # cluster PULLS from it (global.endpoints.registry.host).
                - name: registry
                  project: cicd
                  syncWave: "7"
                  namespace: registry
                  prune: "true"
                  createNamespace: "true"
                  specialOptions: ""

                - name: mongodb
                  project: data
                  syncWave: "10"
                  namespace: mongodb
                  prune: "true"
                  createNamespace: "true"
                  specialOptions: ""

                - name: postfix
                  project: services
                  syncWave: "20"
                  namespace: postfix
                  prune: "true"
                  createNamespace: "true"
                  specialOptions: ""

                - name: redis
                  project: data
                  syncWave: "20"
                  namespace: redis
                  prune: "true"
                  createNamespace: "true"
                  specialOptions: ""

                # Wave 25 — image-build pipeline (build plane). Centralized on the
                # ONE build cluster.
                - name: image-builder
                  project: cicd
                  syncWave: "25"
                  namespace: image-builder
                  prune: "true"
                  createNamespace: "true"
                  specialOptions: ""

                # Wave 26 — the build fan-out (apps/consumer-build in catalog
                # mode): ONE ApplicationSet over registrations/*/build.yaml,
                # one Application <unit>-build per registered unit (project
                # `builds`). Rides in ns argocd (the ApplicationSet CR and the
                # generated Applications live there); build-cluster only.
                - name: consumer-build
                  project: cicd
                  syncWave: "26"
                  namespace: argocd
                  prune: "true"
                  createNamespace: "false"
                  specialOptions: ""

                # Wave 27 — gate-runner: onboarding gates as in-cluster
                # Tekton PipelineRuns (egress-fenced sandbox). Provider-only
                # like the build plane (cluster/apps master default "false").
                - name: gate-runner
                  project: cicd
                  syncWave: "27"
                  namespace: gate-runner
                  prune: "true"
                  createNamespace: "true"
                  specialOptions: ""

                - name: dbgate
                  project: services
                  syncWave: "30"
                  namespace: dbgate
                  prune: "true"
                  createNamespace: "true"
                  specialOptions: ""

                - name: observability
                  project: observability
                  syncWave: "30"
                  namespace: observability
                  prune: "true"
                  createNamespace: "true"
                  specialOptions: "observability"

                # Wave 30 — SLAVE observability PUSH agent (D4b). The slave-side
                # alternative to 'observability' above: a slave runs THIS (Alloy
                # push + kube-state-metrics + the 3 monitoring CRDs) and pushes
                # metrics/logs to the master; a full/master cluster runs
                # 'observability' instead. master-default OFF
                # (cluster/apps/observability-agent.yaml deploy:"false");
                # set-role.sh flips it on wherever the role lacks the master
                # part. SAME project + namespace as
                # 'observability' — they never coexist on one cluster — so the
                # observability AppProject's destination + whitelists already cover it.
                - name: observability-agent
                  project: observability
                  syncWave: "30"
                  namespace: observability
                  prune: "true"
                  createNamespace: "true"
                  specialOptions: ""

                # Wave 16 — generic ServiceClaim-driven credential provisioner
                # (mongodb/postgresql/registry). After the data stores
                # (wave 10) whose admin creds it reads; before consumers (wave 50)
                # that create ServiceClaims. Ships the serviceclaims CRD.
                - name: service-provisioner
                  project: core
                  syncWave: "16"
                  namespace: service-provisioner
                  prune: "true"
                  createNamespace: "true"
                  specialOptions: ""

                # Wave 40 — the Controller (standalone product, in-cluster app).
                # Installs LAST, "on top" of the platform. PROVIDER-ONLY like the
                # build plane: cluster/apps/manager.yaml is master-default
                # "false"; only the control host's install branch flips it "true".
                - name: manager
                  project: controller
                  syncWave: "40"
                  namespace: controller
                  prune: "true"
                  createNamespace: "true"
                  specialOptions: ""

                # Wave 42 — the tailnet coordinator: the self-hosted control
                # plane every host's tailnet client logs in to. Provided once,
                # on the cluster with the master part (cluster/apps master
                # default "false"). A host joins from its own setup.sh run, not
                # through ArgoCD, so nothing here waits on it; the wave only
                # keeps it inside the platform band, below the per-slave ArgoCD
                # instances (slaves-appset, wave 45).
                - name: tailnet-coordinator
                  project: services
                  syncWave: "42"
                  namespace: tailnet-coordinator
                  prune: "true"
                  createNamespace: "true"
                  specialOptions: ""
          - git:
              repoURL: https://github.com/simetrixch/hostyour-cloud.git
              revision: master
              files:
                - path: "cluster/apps/*.yaml"
      selector:
        matchExpressions:
          - key: deploy
            operator: NotIn
            values:
              - "false"

  template:
    metadata:
      name: "{{ .name }}-prod"
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "{{ .syncWave }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: "{{ .project }}"
      sources:
        # `&repo` / `&branch` anchors are reused by the second source below —
        # the repo URL literal appears once per ApplicationSet.
        - repoURL: &repo "https://github.com/simetrixch/hostyour-cloud.git"
          targetRevision: &branch master
          ref: values
        - repoURL: *repo
          targetRevision: *branch
          path: "apps/{{ .name }}"
          helm:
            valueFiles:
              - $values/platform/values-common.yaml
              - $values/platform/values-prod.yaml
              - values-common.yaml
              - values-prod.yaml
              # This installation's values FOR THIS APP — the keys that name one machine or one
              # installation and therefore cannot stand in the app's own files, which the trunk
              # ships to every installation. cluster/profile.yaml below carries global.* and would
              # hand a per-app block to every app, so an app-scoped file is the only place these
              # fit. Absent for every app that has none.
              - $values/cluster/values/{{ .name }}.yaml
              - $values/cluster/profile.yaml   # per-cluster overrides (global.* only) — highest precedence
            # Only the per-app file above may be missing, and for most apps it is.
            ignoreMissingValueFiles: true
      destination:
        server: "https://kubernetes.default.svc"
        namespace: "{{ .namespace }}"

  templatePatch: |
    spec:
      syncPolicy:
        automated:
          prune: {{ .prune }}
          selfHeal: true
        # Same retry/backoff as root-app.yaml. Sync waves only order
        # CREATION — they don't gate on dependency readiness — so a cold
        # bootstrap can race (e.g. ExternalSecrets before the ESO CRDs
        # land). With retry a failed first sync converges on its own
        # instead of waiting for the next selfHeal cycle.
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        # Label every platform workload namespace so the per-slave Vault
        # external-secrets role can bind by LABEL (dynamic) instead of a
        # hardcoded namespace list (base/lib/slave.sh). On the master this is a
        # harmless extra label; on a slave the slave's ESO in that namespace
        # authenticates to Vault via kubernetes-<name> because the namespace
        # carries this label. Applied to namespaces this appset creates
        # (CreateNamespace below) — same mechanism consumers-appset uses.
        managedNamespaceMetadata:
          labels:
            hostyour.cloud/workload: "true"
        syncOptions:
          - CreateNamespace={{ .createNamespace }}
          {{- if eq .specialOptions "observability" }}
          - ServerSideApply=true
          {{- end }}
          {{- if eq .specialOptions "external-secrets" }}
          - ServerSideApply=true
          {{- end }}
      {{- if eq .specialOptions "observability" }}
      ignoreDifferences:
        - group: apps
          kind: StatefulSet
          jsonPointers:
            - /spec/volumeClaimTemplates
        - group: apps
          kind: Deployment
          jqPathExpressions:
            - '.spec.template.spec.containers[]?.env[]?.valueFrom.resourceFieldRef.divisor'
      {{- end }}
