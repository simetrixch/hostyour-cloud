# Tenant fan-out — ONE Application "<guid>-<member>-prod" per (tenant, member), from the tenant
# registrations registrations/<guid>/prod.yaml IN THIS INSTALLATION'S BOOKS, in the tenant catalog. A
# tenant's stage file there IS the deployment for this stage; the Controller writes and removes it,
# and removing it offboards the whole fan-out.
#
# THE MEMBER SET IS DATA. `members` in the registration lists every member the tenant has, each with
# the charts it deploys into its own namespace <guid>-<member>. The Controller resolved that list
# from the tenant product's own manifest — its standing services and one member per app the tenant
# selected — so this file names no member, no chart and no app. It used to be FOUR files per stage,
# one per member family, each carrying a chart path and a values block of one particular product;
# a product with a different member set could not be deployed by this cloud at all.
#
# What this file still decides is what is TRUE OF EVERY MEMBER: the naming, the namespace, the
# isolation project, the sync policy, and the tenant facts each chart is handed. What a member IS
# comes out of the registration.
#
# The registration's flat fields (cluster, subdomain, apps, seedUsers, suspended, quiesced) become
# the template parameters. The body carries NO guid — the path registrations/<guid>/<stage>.yaml is
# the identity — so the guid is derived from the file path ONCE, in the generator's values block.
#
# The two catalog sources part ways here. The chart source's targetRevision KEEPS master (the
# set-domain:keep marker): the member charts are PRODUCT, shared by every installation. The generator
# revision names the BOOKS branch — the install branch of the cluster holding the master role, in
# the catalog — because that is where the Controller writes the tenant registrations, and a second
# installation must be able to hold its own without colliding. A tenant only ever lands on a slave,
# whose own branch does not exist in the catalog at all, so a generator pointed at this branch would
# evaluate against a ref that is not there. The $values source is the ONE hostyour-cloud line: the
# branch program's revision stamp rewrites it, so the platform values chain follows THIS cluster's
# install branch.
#
# THE THREE MARKERS IN THIS FILE, AND WHAT PUTS A VALUE IN EACH.
#
# The generator's repoURL carries the catalog marker, and the branch program's catalog stamp fills it
# from the answer this installation names its tenant catalog in — an owner and a name, with the forge
# and the .git suffix staying as the lines below write them. That marker is deliberately NOT spelled
# out anywhere else in this file: the stamp rewrites every occurrence of it on any line it reaches,
# so a sentence quoting it would come out of a run stating a repository instead of explaining one.
#
# __BOOKS_BRANCH__ and __CLUSTER__ have NO writer at all. The shell that used to fill them is gone,
# and neither value is an answer the branch program holds: the books branch is this cluster's own
# domain where it holds the master role and the named master's domain where it does not, and the
# cluster is the first DNS label of this cluster's domain — the name the Controller writes into a
# registration's `cluster:` field and the name the destination below resolves (on a master from the
# cluster Secret in cluster-self.yaml, on a slave from the instance's ESO-materialized one). A branch
# cut today carries both markers exactly as they stand, so this ApplicationSet reads registrations
# from a ref that does not exist and its selector admits none of them.
#
# Deliberately NO suspended clause in the selector: suspended and quiesced are NOT selectors and
# never prune — both reach the chart as values and the chart renders the off state (replicas 0, no
# Ingress). The reason prune is off the table sits in the service-provisioner: its finalizer
# platform.hostyour.cloud/deprovision runs on EVERY ServiceClaim deletion, an ArgoCD prune included
# (apps/service-provisioner/templates/configmap.yaml), and drops the user AND the databases — a
# prune-based suspend would be destructive by construction. Destructive is only offboard
# (registration removal), where the ServiceClaim finalizers and the Tenant CR cascade are SUPPOSED to
# run.
#
# ArgoCD creates the member namespace (CreateNamespace) and labels it via managedNamespaceMetadata:
# platform/tenant + platform/tenant-managed are the tenant ESO Vault role's precondition (its
# namespace selector matches tenant-managed, and the secret kit's ServiceAccount annotation resolves
# the per-tenant Vault path); platform/db-consumer admits the namespace through the credentialed
# backing-service NetworkPolicies (mongodb). Anything BEYOND those three is the member's own
# `namespaceLabels` out of the registration — the data behind what used to be an `if member == auth`
# in one of the four files, granting reach to a no-auth service that only that member uses. The
# per-member AppProject <guid>-<member> (name == the destination namespace, destinations pinned to
# exactly that namespace) is the isolation — the Controller renders it BEFORE it writes the
# registration, so this template's project: always resolves.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenants-prod
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/__CATALOG_REPO__.git  # the catalog stamp writes the owner and the name of this installation's tenant catalog into the marker — the repository holding the member charts, named in the cluster map
              revision: __BOOKS_BRANCH__  # NOTHING fills this — the tenant registrations in the catalog stand on the books branch, which is not an answer of the branch program (the CHARTS below stay on the trunk)
              files:
                - path: "registrations/*/prod.yaml"
              values:
                guid: "{{ index .path.segments 1 }}"
          - list:
              elementsYaml: "{{ .members | toJson }}"
      selector:
        matchLabels:
          cluster: __CLUSTER__  # NOTHING fills this — the short name is not an answer of the branch program
  template:
    metadata:
      name: "{{ .values.guid }}-{{ .name }}-prod"
      namespace: argocd
      labels:
        platform/tenant: "{{ .values.guid }}"
        platform/member: "{{ .name }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: "{{ .values.guid }}-{{ .name }}"
      # NOTE: spec.sources is set entirely in templatePatch below (a member carries a LIST of charts,
      # which needs a range). Keeping it out of the typed template keeps this file parseable as
      # static YAML.
      destination:
        name: "{{ .cluster }}"
        namespace: "{{ .values.guid }}-{{ .name }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
  # The namespace labels and the sources live here (block scalar): both range over registration data
  # and cannot be expressed in the typed template without breaking a static YAML parse. templatePatch
  # is rendered by the ApplicationSet's go-template and merge-patched onto the Application above
  # (arrays are replaced, so the full sources list is authoritative here).
  templatePatch: |
    spec:
      syncPolicy:
        managedNamespaceMetadata:
          labels:
            platform/tenant: "{{ .values.guid }}"
            platform/tenant-managed: "true"
            platform/db-consumer: "true"
            {{- range $k, $v := .namespaceLabels }}
            {{ $k }}: {{ $v | quote }}
            {{- end }}
      sources:
        # 0. Values-only source — makes $values/... resolvable for the sources below. Stamped
        #    normally: the chain follows THIS cluster's branch.
        - repoURL: https://github.com/simetrixch/hostyour-cloud.git
          targetRevision: master
          ref: values
        # 0b. Pins-only source — this installation's OWN image versions, on the catalog's books
        #    branch. A tag says which version THIS installation runs, so it cannot stand on the
        #    trunk below, which every installation reads: one installation's build would decide
        #    another's version, and the next bump would overwrite it. The release pipeline's bump
        #    writes <chart>/pins-prod.yaml here; until it has, the chart's own values.yaml carries
        #    the product default and the file is simply absent (ignoreMissingValueFiles).
        - repoURL: https://github.com/__CATALOG_REPO__.git  # filled by the catalog stamp, as the generator above is
          targetRevision: __BOOKS_BRANCH__  # NOTHING fills this — the pins stand on the books branch, the CHARTS below on the trunk
          ref: pins
        # 1..n. The member's own charts on the catalog's trunk, in the order the registration lists
        #    them. The platform values reach every one of them as global.* over the SAME $values chain
        #    every platform app loads: platform files first, the chart's own values in between, the
        #    chart's extra value files after those, cluster/profile.yaml LAST (highest precedence).
        {{- range .sources }}
        - repoURL: https://github.com/__CATALOG_REPO__.git  # filled by the catalog stamp, as the two sources above are
          targetRevision: master  # set-domain:keep — the member charts live on the catalog's master, never on an install branch
          path: {{ .chart | quote }}
          helm:
            valueFiles:
              - $values/platform/values-common.yaml
              - $values/platform/values-prod.yaml
              - values.yaml
              - values-prod.yaml
              {{- range .valueFiles }}
              - {{ . | quote }}
              {{- end }}
              # This installation's own pin, after every product file, so nothing shipped can
              # decide the version it runs. Absent until the bump has written one.
              - $pins/{{ .chart }}/pins-prod.yaml
              - $values/cluster/profile.yaml
            # The pins file above is the ONE file MEANT to be missing, and only until this
            # installation has built. The flag permits more than that one file: a values file named
            # here and no longer carried by the repository it stands in renders from whatever files
            # are left, with no sync error anywhere. NOTHING GUARDS EITHER HALF of this list today —
            # the audit that used to require every $values/ path named here to exist in this
            # repository is gone with the tools tree it lived in, and the member chart's own
            # values.yaml, its stage file and whatever the registration's valueFiles adds have never
            # been read by anything here, since they stand in the tenant catalog. So the flag is a
            # silence an installation accepts, on every path in the list.
            ignoreMissingValueFiles: true
            valuesObject:
              # THE TENANT'S OWN FACTS, handed to every source of every member. Bare access is safe
              # under goTemplateOptions missingkey=error: every field read here is mandatory in the
              # registration, written explicitly by the Controller on every commit. A chart takes
              # what it needs and ignores the rest — which is what keeps this block the same for all
              # of them, and keeps every member-specific value out of this file.
              tenant:
                guid: "{{ $.values.guid }}"
                member: "{{ $.name }}"
                # The member name under the key the per-app charts already read. A standing member
                # gets its own name here, which those charts never look at.
                appName: "{{ $.name }}"
                subdomain: "{{ $.subdomain }}"
                stage: prod
                # suspended pauses the tenant; quiesced closes it for a move or backup. The chart
                # renders the off state from these two values (replicas 0, no Ingress) — see the
                # prune note in the header.
                suspended: {{ $.suspended }}
                quiesced: {{ $.quiesced }}
                # The tenant's user boot-seed opt-in, and the apps it owns with their per-app seed
                # tiers. Both are TENANT facts rather than member ones, so every member gets them:
                # the identity provider grants roles per app and mounts the app bundle from them, and
                # an app's engine reads its own seed tiers out of the list by appName.
                seedUsers: {{ $.seedUsers }}
                apps: {{ $.apps | toJson }}
              # The member's own values, out of the registration — the product's keys, resolved by
              # the Controller from the product's manifest. Rendered LAST so a product may override
              # anything above for one member.
              {{- with .values }}
              {{- toYaml . | nindent 10 }}
              {{- end }}
        {{- end }}
        # LAST. The platform's own ingress policy for this member namespace
        #    (apps/unit-networkpolicy on the trunk, one NetworkPolicy and nothing else):
        #    the namespace is deny-by-default inbound, with same-namespace pods, the
        #    tenant's SIBLING members, Traefik and Prometheus open. It rides in the
        #    member's OWN Application on purpose — created, healed and pruned with the
        #    namespace it protects, so no member namespace can exist unprotected.
        #    Reads no platform value, so it loads no $values file; the tenant guid is
        #    what makes the sibling rule this tenant's and not every tenant's.
        - repoURL: https://github.com/simetrixch/hostyour-cloud.git
          targetRevision: master
          path: apps/unit-networkpolicy
          helm:
            valuesObject:
              tenant:
                guid: "{{ .values.guid }}"
        # AND LAST. The platform's own resource ceiling for this member namespace (apps/unit-quota on
        #    the trunk: a ResourceQuota and the LimitRange that keeps it from rejecting a pod which
        #    declares no resources of its own). Rides in the member's OWN Application for the same
        #    reason the policy above does — created, healed and pruned with the namespace it bounds.
        #    The figures come from the tenant REGISTRATION, resolved there by the Controller from its
        #    size table. PER MEMBER, not per tenant: a tenant owns one namespace for each of its
        #    members, so each gets this ceiling and one member filling its own cannot take another's
        #    room.
        - repoURL: https://github.com/simetrixch/hostyour-cloud.git
          targetRevision: master
          path: apps/unit-quota
          helm:
            valuesObject:
              quota:
                requestsCpu: "{{ $.quota.requestsCpu }}"
                requestsMemory: "{{ $.quota.requestsMemory }}"
                limitsCpu: "{{ $.quota.limitsCpu }}"
                limitsMemory: "{{ $.quota.limitsMemory }}"
                pods: "{{ $.quota.pods }}"
                persistentVolumeClaims: "{{ $.quota.persistentVolumeClaims }}"
