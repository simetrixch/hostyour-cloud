# The NAMED registration of THIS cluster's own apiserver for its ArgoCD.
# ArgoCD discovers clusters declaratively: any Secret in its namespace
# labeled argocd.argoproj.io/secret-type: cluster IS a registered cluster.
# The built-in in-cluster entry carries no NAME, but the tenant
# ApplicationSets pin their destination by name — the registration's cluster
# field — so on a master that name must resolve to the master's OWN
# apiserver, or a master cannot carry tenants. set-domain.sh stamps
# __CLUSTER__ to the install branch's cluster short name, the same value the
# tenant appset selectors admit.
#
# On a PURE SLAVE branch set-role.sh REMOVES this file: the slave's ArgoCD
# instance already registers the slave under that same name with the slave's
# real apiserver (apps/slave/templates/externalsecret-cluster-slave.yaml),
# and a second Secret claiming the same cluster name with server
# kubernetes.default.svc — the MASTER's apiserver from the instance's point
# of view — would point the tenant Applications at the wrong apiserver.
apiVersion: v1
kind: Secret
metadata:
  name: cluster-self
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
stringData:
  name: __CLUSTER__
  server: https://kubernetes.default.svc
