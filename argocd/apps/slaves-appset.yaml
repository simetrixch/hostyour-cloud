apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: slaves-__STAGE__
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/simetrixch/hostyour-cloud.git
        revision: __BOOKS_BRANCH__
        files:
          - path: "clusters/active/*.yaml"
        values:
          cluster: '{{ index (splitList "." .fqdn) 0 }}'
      selector:
        matchLabels:
          role: slave
          stage: __STAGE__
          # THE CLUSTER THAT KEEPS THE BOOKS, in the marker the branch programs stamp from the
          # `books_cluster` answer — the same answer the map's own `books-cluster` is written from,
          # so the two sides of this comparison can never be answered apart. It is the same value
          # the generator's revision above carries, because a books branch is named for the cluster
          # whose books it holds. A literal here would be one installation's domain in a file every
          # installation is cut from, and a selector matching nothing produces zero Applications and
          # reports no error at all.
          books-cluster: __BOOKS_BRANCH__
  template:
    metadata:
      name: "{{ .values.cluster }}-apps"
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "45"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: "{{ .values.cluster }}"
      sources:
        - repoURL: &repo "https://github.com/simetrixch/hostyour-cloud.git"
          targetRevision: &branch master
          ref: values
        - repoURL: *repo
          targetRevision: *branch
          path: slaves/slave
          helm:
            valueFiles:
              - $values/platform/values-common.yaml
              - $values/platform/values-__STAGE__.yaml
              - values-common.yaml
              - values-__STAGE__.yaml
              - $values/cluster/profile.yaml
            valuesObject:
              slave:
                name: "{{ .values.cluster }}"
                branch: "{{ .fqdn }}"
                apiHost: "{{ .apiHost }}"
                apiPort: "{{ .apiPort }}"
                masterFqdn: "{{ .master }}"
                stage: "{{ .stage }}"
              argo-cd:
                configs:
                  cm:
                    installationID: "{{ .values.cluster }}"
                    url: "https://argo-{{ .values.cluster }}.{{ .master }}"
        # This slave's database browser (slaves/dbgate), in the same namespace on
        # the master as the reconciler above and reached at gate-<name>.<master>.
        # A further source rather than an application of its own, exactly like the
        # unit charts a consumer's Application carries: what decides that an
        # instance exists is that a slave is registered, and this generator is the
        # only place that knows it. A master with no slave therefore renders none,
        # which is what its own dbgate would have had nothing to browse for.
        #
        # No values-common.yaml / values-<stage>.yaml pair: the chart has one
        # values file, because everything that used to differ per stage is a
        # platform global or one of the per-slave fields below.
        - repoURL: *repo
          targetRevision: *branch
          path: slaves/dbgate
          helm:
            valueFiles:
              - $values/platform/values-common.yaml
              - $values/platform/values-__STAGE__.yaml
              - $values/cluster/profile.yaml
            valuesObject:
              global:
                # Under `global` because the library sub-charts this chart is
                # built from read them, and helm shows a sub-chart nothing of a
                # parent's root keys.
                slave:
                  name: "{{ .values.cluster }}"
                  masterFqdn: "{{ .master }}"
                  apiHost: "{{ .apiHost }}"
              externalsecret-db:
                externalSecret:
                  # The remoteRef KEY — the entry inside the KV mount, not the
                  # mount. A per-stage LITERAL, like every other stamped value in
                  # this file. The chart leaves it empty and `required`s it, so a
                  # render that forgets it fails instead of reading another
                  # cluster's credential.
                  vaultPath: "__STAGE__/app/mongodb"
              # The slave's redis requires a password too (apps/redis boots with
              # --requirepass), and it stands at its own KV entry — hence a second
              # ExternalSecret with its own stamped literal rather than a second data
              # entry under the path above.
              externalsecret-redis:
                externalSecret:
                  vaultPath: "__STAGE__/app/redis"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .values.cluster }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
